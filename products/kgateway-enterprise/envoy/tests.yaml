# Doc-test scenario definitions for the enterprise kgateway docs (Solo
# Enterprise for kgateway), envoy mode.
#
# Same shape as ../../agentgateway-enterprise/kubernetes/tests.yaml. A rebase
# shell copies its upstream twin's scenarios from ../../kgateway/envoy/tests.yaml
# (same name and path). An enterprise-only page gets its own scenarios; a
# schema-only one is named `<page>-schema`.
#
# Most pages on the consuming site are rebase shells, stubs whose whole body is
# one {{< rebase file="conrefs/kgateway/envoy/<dir>/..." >}} line that the site
# expands from the open source kgateway-dev/kgateway.dev repo at build time.
# Unlike the agentgateway shells, these name the upstream version directory
# themselves; the runner uses it as written.
#
# How that differs from ../../kgateway/envoy/tests.yaml:
#
#   page:, never source: for a shell. A shell reuses nothing from its own
#            assets/, so there is no snippet to key on. The shell paths mirror
#            the upstream page paths, so `page:` here is the same string as the
#            upstream scenario's page.
#   content_root: the consuming site lays content out as
#            content/en/kgateway/<version>/, with no mode folder, so the
#            version goes into content_root as {version}.
#   versions: the trees are named by release, not latest/main. `latest` is
#            resolved to the site's current release, the defaultVersion in
#            version_config (2.4.x as of 2026-11), so it moves on by itself
#            when a release ships. The site's doc-test workflow reads the same
#            field, and the release's upstream directory from its ossDir.
#
# The consuming site's own assets/ SHADOW the upstream copies. The install
# snippet is the one that matters: assets/kgw-docs/snippets/envoy/get-started.md
# adds the license key and installs the enterprise charts. Its markup lives in
# ../annotations/assets/kgw-docs/snippets/envoy/get-started.md.yaml: the
# runnable blocks are tagged `standard`, the license-key placeholder is left
# untagged so it never overwrites the LICENSE_KEY that CI sets, and a hidden
# step adds the experimental Gateway API CRDs for `experimental` (the site's
# snippet documents only the standard channel). The upstream pages it rebases
# get their markup from products/kgateway/annotations.
version: 1
mode: envoy
content_root: content/en/kgateway/{version}
versions:
- latest
version_config: hugo-kgateway.toml
prerequisites:
  install-standard:
    page: quickstart.md
    path: standard
  install-experimental:
    page: quickstart.md
    path: experimental
  # httpbin, the `http` Gateway, the httpbin HTTPRoute, and INGRESS_GW_ADDRESS.
  httpbin:
    page: install/sample-app.md
    path: install-httpbin
  # Test-only stand-in for httpbin.org; see ../../kgateway/envoy/tests.yaml.
  httpbin-org-standin:
    page: install/sample-app.md
    path: httpbin-org-standin
# Pages with deliberately no test: section indexes, concept, reference,
# release-note, and support pages. A rebase shell is skipped when its
# upstream twin is skipped in ../../kgateway/envoy/tests.yaml.
