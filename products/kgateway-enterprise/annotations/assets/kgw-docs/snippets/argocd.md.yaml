  content: |-
    {{< doc-test paths="argocd" >}}
    # The Argo CD release is {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}-helm, but the enterprise chart names the
    # control plane Deployment {{< reuse "kgw-docs/snippets/pod-name.md" >}}, whatever the release name.
    YAMLTest -f - <<'EOF'
    - name: wait for the {{< reuse "kgw-docs/snippets/pod-name.md" >}} control plane deployment that Argo CD installed to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "kgw-docs/snippets/pod-name.md" >}}
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 600
          intervalSeconds: 5
    - name: wait for the controller to create and accept the {{< reuse "/kgw-docs/snippets/gatewayclass.md" >}} GatewayClass
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: {{< reuse "/kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
- after:
    block: 10
    fingerprint: 22b49fa1b84ec14e
    lang: sh
    lines: 22b49fa1
    preview: kubectl get gatewayclass
  content: |-
    {{< doc-test paths="argocd" >}}
    controller=$(kubectl get gatewayclass {{< reuse "/kgw-docs/snippets/gatewayclass.md" >}} -o jsonpath='{.spec.controllerName}')
    if [ "$controller" != "{{< reuse "kgw-docs/snippets/controller-name.md" >}}" ]; then
      echo "FAIL: GatewayClass {{< reuse "/kgw-docs/snippets/gatewayclass.md" >}} has controller '$controller', not {{< reuse "kgw-docs/snippets/controller-name.md" >}}"
      exit 1
    fi
    # Step 10: both Argo CD Applications report Healthy and Synced.
    for app in {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}}-helm {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}-helm; do
      for i in $(seq 1 60); do
        sync=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.sync.status}')
        health=$(kubectl -n argocd get application "$app" -o jsonpath='{.status.health.status}')
        [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ] && break
        echo "attempt $i: Application $app is sync '$sync', health '$health'; retrying"
        sleep 5
      done
      if [ "$sync" != "Synced" ] || [ "$health" != "Healthy" ]; then
        echo "FAIL: Argo CD Application $app is sync '$sync', health '$health'; want Synced and Healthy"
        kubectl -n argocd get application "$app" -o jsonpath='{.status.conditions}'; echo
        exit 1
      fi
    done
    {{< /doc-test >}}
