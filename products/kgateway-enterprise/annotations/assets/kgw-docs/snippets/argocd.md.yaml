  content: |-
    {{< doc-test paths="argocd" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for Argo CD to sync the {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}}-helm Application
      wait:
        target:
          kind: Application
          metadata:
            namespace: argocd
            name: {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}}-helm
        jsonPath: "$.status.sync.status"
        jsonPathExpectation:
          comparator: equals
          value: "Synced"
        polling:
          timeoutSeconds: 600
          intervalSeconds: 5
    - name: wait for the TrafficPolicy CRD from the Argo CD sync to be established
      wait:
        target:
          kind: CustomResourceDefinition
          metadata:
            name: trafficpolicies.gateway.kgateway.dev
        jsonPath: "$.status.conditions[?(@.type=='Established')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
