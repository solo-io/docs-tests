    lines: abbd1bdc f1540154 a67acb0a 8c8c4228 4332276e 1288d06d 2f7c298d 35c9e61d 9c6e54bf abc56510
    preview: kubectl apply -f - <<EOF
  content: |-
    {{< doc-test paths="byo-redis" >}}
    # The Secret on the page has placeholder credentials; create it with the
    # credentials of the stand-in Redis instance. Redis 6 and later accept the
    # default user with the requirepass password.
    kubectl apply -f- <<'EOF'
    apiVersion: v1
    kind: Secret
    metadata:
      name: redis-credentials
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    stringData:
      redis-username: "default"
      redis-password: "doc-test-redis-pass"
    EOF
    {{< /doc-test >}}
