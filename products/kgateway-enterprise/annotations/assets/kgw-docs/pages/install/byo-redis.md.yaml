    preview: kubectl apply -f - <<EOF
  content: |-
    {{< doc-test paths="byo-redis" >}}
    YAMLTest -f - <<'EOF'
    - name: "byo-redis - the redis resource has an Accepted condition of True"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: redis
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "byo-redis - with extCache.enabled false, the managed ext-cache Deployment is removed"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-cache
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items.length"
        jsonPathExpectation:
          comparator: lessThan
          value: 1
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the rate-limiter connects to the external Redis address"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].spec.template.spec.containers[0].env[?(@.name=='REDIS_URL')].value"
        jsonPathExpectation:
          comparator: equals
          value: redis.redis.svc.cluster.local:6379
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the rate-limiter reads the Redis password from the redis-credentials secret"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].spec.template.spec.containers[0].env[?(@.name=='REDIS_PASSWORD')].valueFrom.secretKeyRef"
        jsonPathExpectation:
          comparator: equals
          value: {"name": "redis-credentials", "key": "redis-password"}
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the rate-limiter reads the Redis username from the redis-credentials secret"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].spec.template.spec.containers[0].env[?(@.name=='REDIS_USER')].valueFrom.secretKeyRef"
        jsonPathExpectation:
          comparator: equals
          value: {"name": "redis-credentials", "key": "redis-username"}
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the ext-auth-service connects to the external Redis address for sessions"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-auth-service
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].spec.template.spec.containers[0].env[?(@.name=='SESSION_REDIS_ADDRESS')].value"
        jsonPathExpectation:
          comparator: equals
          value: redis.redis.svc.cluster.local:6379
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the ext-auth-service reads the Redis password from the redis-credentials secret"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-auth-service
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].spec.template.spec.containers[0].env[?(@.name=='SESSION_REDIS_PASSWORD')].valueFrom.secretKeyRef.name"
        jsonPathExpectation:
          comparator: equals
          value: redis-credentials
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the rate-limiter deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the ext-auth-service deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-auth-service
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    kubectl rollout status deployment -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app=rate-limiter --timeout=300s
    kubectl rollout status deployment -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app=ext-auth-service --timeout=300s
    # Verify the connection as Step 3 describes: a global rate limit, whose counters
    # the rate limiter keeps in the external Redis instance.
    kubectl apply -f- <<EOF
    apiVersion: ratelimit.solo.io/v1alpha1
    kind: RateLimitConfig
    metadata:
      name: byo-redis-ratelimit
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      raw:
        descriptors:
        - key: generic_key
          value: byo-redis
          rateLimit:
            requestsPerUnit: 1
            unit: MINUTE
        rateLimits:
        - actions:
          - genericKey:
              descriptorValue: byo-redis
    ---
    apiVersion: {{< reuse "kgw-docs/snippets/trafficpolicy-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
    metadata:
      name: byo-redis-ratelimit
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      targetRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: http
      entRateLimit:
        global:
          rateLimitConfigRefs:
          - name: byo-redis-ratelimit
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: httpbin-ratelimit
      namespace: httpbin
    spec:
      parentRefs:
      - name: http
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
      hostnames:
      - ratelimit.example
      rules:
      - backendRefs:
        - name: httpbin
          port: 8000
    EOF
    YAMLTest -f - <<'EOF'
    - name: "byo-redis - the RateLimitConfig is accepted"
      wait:
        target:
          kind: RateLimitConfig
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: byo-redis-ratelimit
        jsonPath: "$.status.state"
        jsonPathExpectation:
          comparator: equals
          value: Accepted
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - the rate limit policy is accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: byo-redis-ratelimit
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "byo-redis - requests beyond 1 per minute are rate limited with 429, so the rate limiter reaches Redis"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "ratelimit.example:8080"
      source:
        type: local
      expect:
        statusCode: 429
    - name: "byo-redis - the rate limit counters are stored in the external Redis instance"
      retries: 30
      command:
        command: "kubectl exec -n redis deploy/redis -- redis-cli -a doc-test-redis-pass --no-auth-warning DBSIZE"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          matches: '^[1-9][0-9]*'
    EOF
    {{< /doc-test >}}
