    preview: kubectl apply -f - <<EOF
  content: |-
    {{< doc-test paths="byo-redis" >}}
    # Stand-in for an external Redis instance: a password-protected Redis in its
    # own namespace, reached by the same host:port address format as ElastiCache.
    # The AWS steps on this page need an EKS cluster and ElastiCache; this scenario
    # instead follows the username/password option in Other configurations.
    kubectl create namespace redis --dry-run=client -o yaml | kubectl apply -f -
    kubectl apply -f- <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
      namespace: redis
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: redis
      template:
        metadata:
          labels:
            app: redis
        spec:
          containers:
          - name: redis
            image: docker.io/redis:8.6.7-alpine
            args: ["--requirepass", "doc-test-redis-pass"]
            ports:
            - containerPort: 6379
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: redis
      namespace: redis
    spec:
      selector:
        app: redis
      ports:
      - port: 6379
        targetPort: 6379
    EOF
    kubectl rollout status deploy/redis -n redis --timeout=300s
    export AWS_ELASTICACHE_HOST=redis.redis.svc.cluster.local:6379
    {{< /doc-test >}}
