  content: |-
    {{< doc-test paths="install-fips" >}}
    # The page says that a FIPS control plane selects the -fips repository for the
    # workloads that it manages. Create a Gateway on a GatewayClass that also
    # enables the WAF server, then check the image of the proxy, the external auth,
    # rate limit, and WAF servers, and that ext-cache keeps its standard image.
    kubectl apply -f- <<'EOF'
    apiVersion: {{< reuse "kgw-docs/snippets/gatewayparam-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
    metadata:
      name: fips-check
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      kube:
        sharedExtensions:
          waf:
            enabled: true
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: fips-check
    spec:
      controllerName: solo.io/{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      parametersRef:
        group: {{< reuse "kgw-docs/snippets/gatewayparam-group.md" >}}
        kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
        name: fips-check
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: fips-check
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      gatewayClassName: fips-check
      listeners:
      - protocol: HTTP
        port: 8080
        name: http
        allowedRoutes:
          namespaces:
            from: All
    EOF
    check_image() {
      # $1 kubectl selector flag, $2 selector, $3 what, $4 expected repository
      for i in $(seq 1 60); do
        images=$(kubectl get deploy -n {{< reuse "kgw-docs/snippets/namespace.md" >}} "$1" "$2" -o jsonpath='{.items[*].spec.template.spec.containers[*].image}' 2>/dev/null)
        [ -n "$images" ] && break
        sleep 5
      done
      case " $images" in
        *"/$4:"*) echo "the $3 runs $images" ;;
        *) echo "FAIL: the $3 does not run the $4 image (deployments matching $2 run: '${images:-none}')"; exit 1 ;;
      esac
    }
    check_image --field-selector metadata.name=fips-check "fips-check gateway proxy" envoy-wrapper-fips
    check_image -l app=ext-auth-service,gateway.solo.io/gatewayclass=fips-check "external auth server" ext-auth-service-fips
    check_image -l app=rate-limiter,gateway.solo.io/gatewayclass=fips-check "rate limit server" rate-limiter-fips
    check_image --field-selector metadata.name=waf-server-fips-check "WAF server" waf-server-fips
    cache=$(kubectl get deploy -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l "app=ext-cache,gateway.solo.io/gatewayclass=fips-check" -o jsonpath='{.items[*].spec.template.spec.containers[*].image}')
    case "$cache" in
      *-fips*) echo "FAIL: the page says ext-cache has no FIPS variant, but it runs: $cache"; exit 1 ;;
      *) echo "ext-cache runs ${cache:-no deployment}" ;;
    esac
    YAMLTest -f - <<'EOF'
    - name: "install-fips - the fips-check proxy runs the envoy-wrapper-fips image"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: fips-check
        jsonPath: "$.spec.template.spec.containers[0].image"
        jsonPathExpectation:
          comparator: equals
          value: "{{< reuse "kgw-docs/snippets/helm-path.md" >}}/envoy-wrapper-fips:{{< reuse "kgw-docs/versions/n-patch.md" >}}"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the fips-check proxy is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: fips-check
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the external auth server runs the ext-auth-service-fips image"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-auth-service
              gateway.solo.io/gatewayclass: fips-check
        jsonPath: "$.items[0].spec.template.spec.containers[0].image"
        jsonPathExpectation:
          comparator: equals
          value: "{{< reuse "kgw-docs/snippets/helm-path.md" >}}/ext-auth-service-fips:{{< reuse "kgw-docs/versions/n-patch.md" >}}"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the external auth server is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-auth-service
              gateway.solo.io/gatewayclass: fips-check
        jsonPath: "$.items[0].status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the rate limit server runs the rate-limiter-fips image"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: fips-check
        jsonPath: "$.items[0].spec.template.spec.containers[0].image"
        jsonPathExpectation:
          comparator: equals
          value: "{{< reuse "kgw-docs/snippets/helm-path.md" >}}/rate-limiter-fips:{{< reuse "kgw-docs/versions/n-patch.md" >}}"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the rate limit server is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: fips-check
        jsonPath: "$.items[0].status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the WAF server runs the waf-server-fips image"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: waf-server-fips-check
        jsonPath: "$.spec.template.spec.containers[0].image"
        jsonPathExpectation:
          comparator: equals
          value: "{{< reuse "kgw-docs/snippets/helm-path.md" >}}/waf-server-fips:{{< reuse "kgw-docs/versions/n-patch.md" >}}"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "install-fips - the WAF server is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: waf-server-fips-check
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
