  content: |-
    {{< doc-test paths="install-fips" >}}
    # Compare with the expected output on the page; the build hash after
    # gofips140=v1.0.0- can differ.
    out=$(kubectl exec -n {{< reuse "kgw-docs/snippets/namespace.md" >}} deploy/{{< reuse "kgw-docs/snippets/helm-kgateway.md" >}} -- /gloo-gateway fips-check)
    echo "$out"
    grep -Eq '^fips140 ok: enabled=true enforced=false version=v1\.0\.0 gofips140=v1\.0\.0(-[0-9a-f]+)?$' <<<"$out" || { echo "FAIL: fips-check output does not match the expected output on the page"; exit 1; }

    # The page's table lists the fips-check command for each image. Run it in
    # each FIPS workload that this scenario created.
    fips_check() {
      # $1 deployment, $2 namespace, $3 expected pattern, then the command
      dep=$1; ns=$2; pat=$3; shift 3
      out=$(kubectl exec -n "$ns" "deploy/$dep" -- "$@" 2>&1) || { echo "FAIL: '$*' failed in deploy/$dep: $out"; exit 1; }
      echo "$dep: $out"
      grep -Eq "$pat" <<<"$out" || { echo "FAIL: '$*' in deploy/$dep did not report the validated module: $out"; exit 1; }
    }
    ok='fips140 ok: enabled=true( enforced=false)? version=v1\.0\.0'
    extauth=$(kubectl get deploy -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app=ext-auth-service,gateway.solo.io/gatewayclass=fips-check -o jsonpath='{.items[0].metadata.name}')
    ratelimit=$(kubectl get deploy -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app=rate-limiter,gateway.solo.io/gatewayclass=fips-check -o jsonpath='{.items[0].metadata.name}')
    fips_check fips-check {{< reuse "kgw-docs/snippets/namespace.md" >}} "$ok" /usr/local/bin/envoyinit fips-check
    fips_check "$extauth" {{< reuse "kgw-docs/snippets/namespace.md" >}} "$ok" /usr/local/bin/executable fips-check
    fips_check "$ratelimit" {{< reuse "kgw-docs/snippets/namespace.md" >}} "$ok" /usr/local/bin/executable fips-check
    fips_check waf-server-fips-check {{< reuse "kgw-docs/snippets/namespace.md" >}} "$ok" /usr/local/bin/waf-server --fips-check
    fips_check portal-controller {{< reuse "kgw-docs/snippets/portal-namespace.md" >}} "$ok" /usr/local/bin/portal-controller fips-check
    fips_check portal-my-portal default "$ok" /usr/local/bin/portal-web-server fips-check
    {{< /doc-test >}}
