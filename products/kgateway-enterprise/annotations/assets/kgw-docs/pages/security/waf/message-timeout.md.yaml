  content: |-
    {{< doc-test paths="waf-message-timeout" >}}
    YAMLTest -f - <<'EOF'
    - name: "waf-message-timeout - the control plane has KGW_WAF_MESSAGE_TIMEOUT set to 10s"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}
        jsonPath: "$.spec.template.spec.containers[*].env[?(@.name=='KGW_WAF_MESSAGE_TIMEOUT')].value"
        jsonPathExpectation:
          comparator: equals
          value: 10s
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "waf-message-timeout - the control plane is available after the upgrade"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
