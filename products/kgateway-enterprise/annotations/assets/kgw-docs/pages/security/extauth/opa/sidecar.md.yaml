    preview: kubectl apply -f - <<EOF
  content: |2-
       {{< doc-test paths="extauth-opa-sidecar" >}}
       YAMLTest -f - <<'EOF'
       - name: "extauth-opa-sidecar - the http-opa Gateway is programmed"
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
               name: http-opa
           jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: "extauth-opa-sidecar - the ext-auth service for the {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}-opa GatewayClass is available"
         wait:
           target:
             kind: Deployment
             metadata:
               namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
               name: ext-auth-service-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}-opa
           jsonPath: "$.status.availableReplicas"
           jsonPathExpectation:
             comparator: greaterThan
             value: 0
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
- after:
    block: 6
    fingerprint: 1341040a25e6fa9e
    lang: sh
    lines: 1341040a
    preview: kubectl get pods -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app.kubern
  content: |2-
       {{< doc-test paths="extauth-opa-sidecar" >}}
       # The step expects 2/2 containers: ext-auth-service and the opa-auth sidecar.
       kubectl -n {{< reuse "kgw-docs/snippets/namespace.md" >}} rollout status deploy/ext-auth-service-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}-opa --timeout=300s
       ready=$(kubectl get pods -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app.kubernetes.io/instance=ext-auth-service-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}-opa \
         -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.name}={.ready} {end}{end}')
       echo "containers: $ready"
       case "$ready" in *opa-auth=true*) ;; *) echo "FAIL: the opa-auth sidecar is not ready"; exit 1 ;; esac
       test "$(echo "$ready" | grep -o '=true' | wc -l)" -ge 2 || { echo "FAIL: fewer than 2 ready containers"; exit 1; }
       {{< /doc-test >}}
