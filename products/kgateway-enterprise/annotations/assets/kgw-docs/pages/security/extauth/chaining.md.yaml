    lang: yaml
    lines: 98875768 efd325e8 8c8c4228 80f22f99 0f10c5bc 36184fa5 36f4fc9a d5ec3fae 38380135 e1281fca 27466baf 8647a760 f7bbc71c 1286b5b3 de77b3a7 e11ff142 c9888a7d 0a478cd0 93454560 aa2f82ea
    preview: 'apiVersion: extauth.solo.io/v1'
  content: |-
    {{< doc-test paths="extauth-chaining-fallback" >}}
    # Test-only: the page shows the fallback AuthConfig without kubectl apply and with a
    # <password> placeholder. Apply it with the APR1 hash of "password" for the salt TYiryv0/
    # (the same user as the basic auth AuthConfig guide), and attach it to the Gateway the way
    # Step 4 attaches the API key and OPA AuthConfig.
    kubectl apply -f- <<EOF
    apiVersion: extauth.solo.io/v1
    kind: AuthConfig
    metadata:
      name: fallback-auth
      namespace: httpbin
    spec:
      booleanExpr: "apikey || basic"
      configs:
      - name: apikey
        apiKeyAuth:
          headerName: api-key
          labelSelector:
            team: infrastructure
      - name: basic
        basicAuth:
          apr:
            users:
              user:
                hashedPassword: 8BvzLUO9IfGPGGsPnAgSu1
                salt: TYiryv0/
    EOF
    kubectl apply -f - <<EOF
    apiVersion: {{< reuse "kgw-docs/snippets/trafficpolicy-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
    metadata:
      name: fallback-policy
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      targetRefs:
        - name: http
          group: gateway.networking.k8s.io
          kind: Gateway
      entExtAuth:
        authConfigRef:
          name: fallback-auth
          namespace: httpbin
    EOF
    {{< /doc-test >}}
