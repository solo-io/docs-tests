  content: |-
    {{< doc-test paths="extauth-opa-rego" >}}
    YAMLTest -f - <<'EOF'
    - name: "extauth-opa-rego - a request with a valid api-key is allowed, x-opa-status is added, and api-key is stripped from the upstream request"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/get"
        method: GET
        headers:
          host: "www.example.com:8080"
          api-key: "my-secret-key"
      source:
        type: local
      expect:
        statusCode: 200
        headers:
          - name: x-opa-status
            comparator: equals
            value: "approved"
        bodyJsonPath:
          - path: "$.headers.X-Validated-By[0]"
            comparator: equals
            value: "opa-policy"
          - path: "$.headers.Api-Key"
            comparator: exists
            negate: true
    EOF
    {{< /doc-test >}}
