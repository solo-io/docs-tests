- after:
    block: 4
    fingerprint: 887db6f6da9dcd86
    lang: sh
    lines: 887db6f6
    preview: kubectl get authconfig opa-auth -n httpbin -o yaml
  content: |-
    {{< doc-test paths="extauth-opa-rego" >}}
    YAMLTest -f - <<'EOF'
    - name: "extauth-opa-rego - wait for the opa-auth policy to be accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: opa-auth
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "extauth-opa-rego - wait for the opa-auth AuthConfig to be accepted"
      wait:
        target:
          kind: AuthConfig
          metadata:
            namespace: httpbin
            name: opa-auth
        jsonPath: "$.status.state"
        jsonPathExpectation:
          comparator: equals
          value: "Accepted"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
