  content: |-
    {{< doc-test paths="extauth-opa-rego" >}}
    YAMLTest -f - <<'EOF'
    - name: "extauth-opa-rego - a request without an api-key is denied with 403, a custom body, and x-opa-deny-reason"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/get"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 403
        headers:
          - name: x-opa-deny-reason
            comparator: equals
            value: "missing-or-invalid-api-key"
        bodyContains: "Request denied by OPA policy"
    EOF
    {{< /doc-test >}}
