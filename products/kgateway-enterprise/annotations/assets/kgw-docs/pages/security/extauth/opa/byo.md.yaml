    YAMLTest -f - <<'EOF'
    - name: "extauth-opa-byo - a request without the allow header is denied with 403"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/get"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 403
    EOF
    {{< /doc-test >}}
