    YAMLTest -f - <<'EOF'
    - name: "extauth-passthrough-grpc - a request without the x-ext-authz header is denied with 403"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 403
        headers:
          - name: x-ext-authz-check-result
            comparator: equals
            value: "denied"
        bodyContains: "denied by ext_authz for not found header"
    EOF
    {{< /doc-test >}}
