  content: |2-
       {{< doc-test paths="install-airgap" >}}
       # ============================================================================
       # Doc test coverage for "Install in air-gapped environments" (not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Step 1: the standard images, including WAF and Portal, are copied with
       #     crane from the public registries to a private registry.
       #   * Step 2: the namespace and an image pull secret.
       #   * Step 3: the values file with the license key, "Mirror Helm charts": both
       #     charts are pulled, pushed to the private registry, and installed from it.
       #   * "Install Portal from the private registry": the Portal images and charts
       #     are mirrored, the portal controller is installed from the private
       #     registry, and the PortalParameters resource is created.
       #   * Step 4: the gateway parameters resource, also with resource settings.
       #   * Step 5: the controller, the proxy, ext-auth-service, ext-cache,
       #     rate-limiter, waf-server, and portal-controller run images from the
       #     private registry, and their pods are ready.
       # HOW THE PRIVATE REGISTRY WORKS HERE:
       #   * A registry:2 container on the runner (127.0.0.1:PORT) takes the pushes,
       #     and a second registry:2 container in the kind node's network namespace
       #     serves the same storage on localhost:PORT, so that the node's containerd
       #     pulls from "localhost:PORT" over plain HTTP. PRIVATE_REGISTRY is the same
       #     string for the push side and the pull side.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A disconnected network: the cluster can still reach public registries; the
       #     image checks prove that the pods use the private registry instead.
       #   * Registry authentication: the test registry has none, so the pull secrets
       #     have placeholder credentials.
       #   * skopeo (the crane commands copy the same images), the FIPS tab, the
       #     optional SDS image (Istio only), and a Portal resource.
       NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
       REG_PORT=$(( 20000 + RANDOM % 20000 ))
       REG_NAME="${NODE}-airgap-registry"
       docker volume create "${REG_NAME}"
       docker run -d --name "${REG_NAME}-push" -p "127.0.0.1:${REG_PORT}:5000" -v "${REG_NAME}:/var/lib/registry" registry:2
       docker run -d --name "${REG_NAME}-pull" --network "container:${NODE}" -e REGISTRY_HTTP_ADDR=":${REG_PORT}" -v "${REG_NAME}:/var/lib/registry" registry:2
       for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:${REG_PORT}/v2/" && break; sleep 1; done
       for i in $(seq 1 30); do docker exec "${NODE}" curl -fsS "http://localhost:${REG_PORT}/v2/" && break; sleep 1; done
       # The visible exports are placeholders; use the test registry.
       export PRIVATE_REGISTRY="localhost:${REG_PORT}"
       export PRIVATE_REPOSITORY={{< reuse "kgw-docs/snippets/helm-kgateway.md" >}}
       # The test registry serves plain HTTP. crane allows that for localhost, but
       # Helm does not, so add --plain-http to Helm OCI calls that use it.
       helm() {
         case " $* " in
           *" oci://localhost:"*) command helm "$@" --plain-http ;;
           *) command helm "$@" ;;
         esac
       }
       # The page offers crane or skopeo; the test uses crane.
       if ! command -v crane >/dev/null 2>&1; then
         os=$(uname -s); arch=$(uname -m); [ "$arch" = aarch64 ] && arch=arm64
         mkdir -p "$HOME/.local/bin"
         curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_${os}_${arch}.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
         export PATH="$HOME/.local/bin:$PATH"
       fi
       crane version
       {{< /doc-test >}}
