  content: |-
    {{< doc-test paths="install-airgap" >}}
    want="$PRIVATE_REGISTRY/$PRIVATE_REPOSITORY/"
    check() { # namespace deployment
      img=$(kubectl -n "$1" get deploy "$2" -o jsonpath='{.spec.template.spec.containers[0].image}')
      echo "$2: $img"
      case "$img" in "$want"*) ;; *) echo "FAIL: $2 does not run an image from the private registry"; exit 1 ;; esac
      kubectl -n "$1" rollout status deploy/"$2" --timeout=120s
    }
    check {{< reuse "kgw-docs/snippets/namespace.md" >}} {{< reuse "kgw-docs/snippets/helm-kgateway.md" >}}
    check {{< reuse "kgw-docs/snippets/namespace.md" >}} http
    check {{< reuse "kgw-docs/snippets/namespace.md" >}} ext-auth-service-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    check {{< reuse "kgw-docs/snippets/namespace.md" >}} ext-cache-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    check {{< reuse "kgw-docs/snippets/namespace.md" >}} rate-limiter-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    check {{< reuse "kgw-docs/snippets/namespace.md" >}} waf-server-{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    check {{< reuse "kgw-docs/snippets/portal-namespace.md" >}} portal-controller
    # Running pods prove that the node pulled the images from the private registry.
    failed=$(kubectl get events -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --field-selector reason=Failed -o name | wc -l)
    test "$failed" -eq 0 || { kubectl get events -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --field-selector reason=Failed; echo "FAIL: image pull or start failures"; exit 1; }
    docker rm -f "${REG_NAME}-push" "${REG_NAME}-pull" || true
    docker volume rm "${REG_NAME}" || true
    {{< /doc-test >}}
