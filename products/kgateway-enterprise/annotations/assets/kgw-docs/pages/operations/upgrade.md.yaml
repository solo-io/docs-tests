  content: |-
    {{< doc-test paths="upgrade" >}}
    # Test-only: the upgrade starts from the previous minor release, so this
    # scenario has no install prerequisite. Install the standard channel of the
    # Gateway API version that the previous minor release supports (the
    # k8s-gw-version snippet's value for that release).
    # Add a mapping here for each new minor version, or the URL has an empty version.
    OLD_GWAPI_VERSION="{{< version include-if="2.5.x" >}}1.7.0{{< /version >}}{{< version include-if="2.4.x" >}}1.6.1{{< /version >}}"
    if [ -z "$OLD_GWAPI_VERSION" ]; then echo "FAIL: no previous Gateway API version is mapped for this docs version"; exit 1; fi
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v${OLD_GWAPI_VERSION}/standard-install.yaml
    {{< /doc-test >}}
- after:
    start: true
  content: |-
    {{< doc-test paths="upgrade-experimental" >}}
    # Test-only: as for the standard channel, with the experimental channel of the
    # previous minor release's Gateway API version, server-side as the quick start does.
    OLD_GWAPI_VERSION="{{< version include-if="2.5.x" >}}1.7.0{{< /version >}}{{< version include-if="2.4.x" >}}1.6.1{{< /version >}}"
    if [ -z "$OLD_GWAPI_VERSION" ]; then echo "FAIL: no previous Gateway API version is mapped for this docs version"; exit 1; fi
    kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v${OLD_GWAPI_VERSION}/experimental-install.yaml
    {{< /doc-test >}}
- after:
    start: true
  content: |-
    {{< doc-test paths="upgrade,upgrade-experimental" >}}
    # Test-only: install the previous minor release with the quick start's Helm
    # commands and the license key that CI sets, then the httpbin sample app behind
    # the http Gateway, and confirm that routing works before the upgrade.
    export OLD_VERSION={{< reuse "kgw-docs/versions/patch_n-1.md" >}}
    if [ -z "$OLD_VERSION" ]; then echo "FAIL: the previous minor version is empty"; exit 1; fi
    if [ -z "${LICENSE_KEY:-}" ]; then echo "FAIL: LICENSE_KEY is not set"; exit 1; fi
    echo "Installing {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} ${OLD_VERSION} before the upgrade"
    helm upgrade -i {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}} \
      --create-namespace --namespace {{< reuse "kgw-docs/snippets/namespace.md" >}} \
      --version "${OLD_VERSION}"
    helm upgrade -i {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      --namespace {{< reuse "kgw-docs/snippets/namespace.md" >}} \
      --version "${OLD_VERSION}" \
      --set controller.image.pullPolicy=Always \
      --set-string licensing.licenseKey="$LICENSE_KEY"
    kubectl rollout status deployment/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --timeout=400s
    kubectl apply -f https://raw.githubusercontent.com/kgateway-dev/kgateway/refs/heads/{{< reuse "kgw-docs/versions/github-branch.md" >}}/examples/httpbin.yaml
    kubectl apply -f- <<'EOF'
    kind: Gateway
    apiVersion: gateway.networking.k8s.io/v1
    metadata:
      name: http
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      gatewayClassName: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      listeners:
      - protocol: HTTP
        port: 8080
        name: http
        allowedRoutes:
          namespaces:
            from: All
    EOF
    kubectl apply -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: httpbin
      namespace: httpbin
    spec:
      parentRefs:
        - name: http
          namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
      hostnames:
        - "www.example.com"
      rules:
        - backendRefs:
            - name: httpbin
              port: 8000
    EOF
    kubectl rollout status deployment/httpbin -n httpbin --timeout=400s
    for i in $(seq 1 60); do
      kubectl get deployment http -n {{< reuse "kgw-docs/snippets/namespace.md" >}} >/dev/null 2>&1 && break
      echo "waiting for the http gateway proxy deployment ($i/60)"; sleep 5
    done
    kubectl rollout status deployment/http -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --timeout=400s
    export INGRESS_GW_ADDRESS=$(kubectl get svc -n {{< reuse "kgw-docs/snippets/namespace.md" >}} http -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") || true
      [ "$code" = "200" ] && break
      echo "before the upgrade: GET /headers returned '$code', want 200 ($i/60)"; sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: before the upgrade, routing to httpbin through the http Gateway returned $code, want 200"
      exit 1
    fi
    image=$(kubectl -n {{< reuse "kgw-docs/snippets/namespace.md" >}} get deployment {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -o jsonpath='{.spec.template.spec.containers[0].image}')
    case "$image" in
      *":${OLD_VERSION}"|*":v${OLD_VERSION}") echo "{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} ${OLD_VERSION} runs before the upgrade: $image" ;;
      *) echo "FAIL: the control plane image before the upgrade is $image, want tag ${OLD_VERSION}"; exit 1 ;;
    esac
    {{< /doc-test >}}
