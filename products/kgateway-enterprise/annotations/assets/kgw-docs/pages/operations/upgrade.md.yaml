  content: |-
    {{< doc-test paths="upgrade,upgrade-experimental" >}}
    # The control plane is ready, it rolled the http gateway proxy to the new
    # version, and routing to httpbin still works after the upgrade.
    YAMLTest -f - <<'EOF'
    - name: upgrade - the upgraded control plane is available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    EOF
    proxy=""
    for i in $(seq 1 60); do
      proxy=$(kubectl -n {{< reuse "kgw-docs/snippets/namespace.md" >}} get deployment http -o jsonpath='{.spec.template.spec.containers[0].image}')
      case "$proxy" in *":${NEW_VERSION}"|*":v${NEW_VERSION}") break ;; esac
      echo "waiting for the http gateway proxy to move to ${NEW_VERSION}: '$proxy' ($i/60)"; sleep 5
    done
    case "$proxy" in
      *":${NEW_VERSION}"|*":v${NEW_VERSION}") echo "http gateway proxy image: $proxy" ;;
      *) echo "FAIL: the http gateway proxy image is $proxy, want tag ${NEW_VERSION}"; exit 1 ;;
    esac
    kubectl rollout status deployment/http -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --timeout=400s
    export INGRESS_GW_ADDRESS=$(kubectl get svc -n {{< reuse "kgw-docs/snippets/namespace.md" >}} http -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") || true
      [ "$code" = "200" ] && break
      echo "after the upgrade: GET /headers returned '$code', want 200 ($i/60)"; sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: after the upgrade, routing to httpbin through the http Gateway returned $code, want 200"
      exit 1
    fi
    {{< /doc-test >}}
