  content: |-
    {{< doc-test paths="upgrade,upgrade-experimental" >}}
    # The CRD release now runs the new chart version, and the CRDs are still installed.
    chart=$(helm list -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o json | jq -r '.[] | select(.name=="{{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}}") | .chart')
    if [ "$chart" != "{{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}}-${NEW_VERSION}" ] && [ "$chart" != "{{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}}-v${NEW_VERSION}" ]; then
      echo "FAIL: the {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}} release runs chart '$chart', want version ${NEW_VERSION}"
      exit 1
    fi
    for crd in trafficpolicies.gateway.kgateway.dev enterprisekgatewaytrafficpolicies.enterprisekgateway.solo.io; do
      if ! kubectl get crd "$crd" >/dev/null 2>&1; then
        echo "FAIL: the $crd CRD is missing after the CRD upgrade"
        exit 1
      fi
    done
    {{< /doc-test >}}
