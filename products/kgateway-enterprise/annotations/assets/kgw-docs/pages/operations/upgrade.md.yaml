    helm get values {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o yaml > values.yaml
    cat values.yaml
    if ! grep -q 'pullPolicy: Always' values.yaml; then
      echo "FAIL: values.yaml does not hold the controller.image.pullPolicy=Always value from the install"
      exit 1
    fi
    {{< /doc-test >}}
