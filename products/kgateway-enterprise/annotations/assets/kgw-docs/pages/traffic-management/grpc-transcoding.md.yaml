    ok=0
    for i in $(seq 1 30); do
      out=$(kubectl exec -n {{< reuse "kgw-docs/snippets/namespace.md" >}} grpcurl-transcoding -- grpcurl -plaintext -authority grpc.example.com http:8080 yages.Echo/Ping 2>&1 || true)
      echo "$out"
      case "$out" in *'"text": "pong"'*) ok=1; break;; esac
      sleep 2
    done
    [ "$ok" = 1 ]
    {{< /doc-test >}}
