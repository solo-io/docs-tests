    - name: "grpc-transcoding - POST /yages.Echo/Ping is transcoded to gRPC and returns pong"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/yages.Echo/Ping"
        method: POST
        headers:
          host: "grpc.example.com"
          content-type: "application/json"
        body: |
          {}
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.text"
            comparator: equals
            value: "pong"
    EOF
    {{< /doc-test >}}
