  content: |-
    {{< doc-test paths="grpc-transcoding" >}}
    kubectl run grpcurl-transcoding -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --image=docker.io/fullstorydev/grpcurl:v1.8.7-alpine --restart=Never --command -- sleep 3600
