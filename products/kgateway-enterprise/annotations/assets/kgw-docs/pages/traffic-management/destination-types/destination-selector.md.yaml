      wait:
        target:
          kind: EnterpriseKgatewayDestinationSelector
          metadata:
            namespace: tenants
            name: by-tenant
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
