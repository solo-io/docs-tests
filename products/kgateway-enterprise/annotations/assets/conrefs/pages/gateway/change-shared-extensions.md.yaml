    - name: "customize-extensions-overlays - after cleanup, the rate-limiter deployment no longer has the team label"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: rate-limiter
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].metadata.labels"
        jsonPathExpectation:
          comparator: contains
          value: "team"
          negate: true
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
