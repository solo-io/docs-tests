- after:
    block: 3
    fingerprint: 2200cce69b6f359b
    lang: yaml
    lines: 46ab7fcc b8109578 241af637
    preview: 'licensing:'
  content: |-
    {{< doc-test paths="licensing-secret" >}}
    # Install the control plane with the Helm values from the previous step.
    # The values on the page set secretName to license-key, but the secret that
    # step 1 creates, and the chart default, is {{< reuse "kgw-docs/snippets/pod-name.md" >}}-license; use that name so
    # that the control plane reads the key from the secret in step 1.
    cat > licensing-values.yaml <<EOF
    licensing:
      secretName: {{< reuse "kgw-docs/snippets/pod-name.md" >}}-license
      createSecret: false
    EOF
    helm upgrade -i {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      -n {{< reuse "kgw-docs/snippets/namespace.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}} \
      -f licensing-values.yaml
    # Create a Gateway so that the control plane reconciles Gateway API resources,
    # which is when it logs a license validation error for a missing key.
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: license-check
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      gatewayClassName: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      listeners:
      - name: http
        protocol: HTTP
        port: 8080
    EOF
    YAMLTest -f - <<'EOF'
    - name: "licensing-secret - the control plane Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "kgw-docs/snippets/pod-name.md" >}}
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    - name: "licensing-secret - the control plane reads the license key from the secret that you created"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "kgw-docs/snippets/pod-name.md" >}}
        jsonPath: "$.spec.template.spec.containers[0].env[?(@.name=='ENTERPRISE_KGATEWAY_LICENSE_KEY')].valueFrom.secretKeyRef.name"
        jsonPathExpectation:
          comparator: equals
          value: {{< reuse "kgw-docs/snippets/pod-name.md" >}}-license
        polling:
          timeoutSeconds: 60
          intervalSeconds: 5
    - name: "licensing-secret - the {{< reuse "kgw-docs/snippets/gatewayclass.md" >}} GatewayClass is accepted by the control plane"
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "licensing-secret - the license-check Gateway is programmed"
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: license-check
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "licensing-secret - the control plane logs no license validation error"
      retries: 10
      command:
        command: "kubectl logs deploy/{{< reuse "kgw-docs/snippets/pod-name.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}}"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: "license validation failed"
          negate: true
    EOF
    {{< /doc-test >}}
