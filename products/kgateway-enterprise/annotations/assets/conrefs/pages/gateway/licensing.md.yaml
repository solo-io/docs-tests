    {{< doc-test paths="licensing-secret" >}}
    # Start from a cluster without the control plane: install the Gateway API
    # CRDs and the {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}} chart (which creates the {{< reuse "kgw-docs/snippets/namespace.md" >}} namespace), so that the
    # secret exists before the control plane is installed.
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{< reuse "kgw-docs/versions/k8s-gw-version.md" >}}/standard-install.yaml
    helm upgrade -i {{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway-crds.md" >}} \
      --create-namespace \
      --namespace {{< reuse "kgw-docs/snippets/namespace.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}}
    {{< /doc-test >}}
