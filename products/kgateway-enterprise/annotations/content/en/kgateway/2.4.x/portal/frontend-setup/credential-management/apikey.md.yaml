  content: |-
    {{< doc-test paths="portal-cm-apikey" >}}
    # Stands in for the localhost (port-forward) request above.
    YAMLTest -f - <<'EOF'
    - name: "a request to the httpbin API without an API key is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
      source:
        type: local
      expect:
        statusCode: 403
    - name: "a request with an API key that Portal did not issue is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          api-key: "not-a-portal-api-key"
      source:
        type: local
      expect:
        statusCode: 403
    EOF
    {{< /doc-test >}}
