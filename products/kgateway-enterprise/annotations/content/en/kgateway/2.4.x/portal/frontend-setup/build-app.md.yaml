  content: |-
    {{< doc-test paths="portal-build-app" >}}
    # Step 1 done in the clone: add the two example pages to projects/ui/public/pages.
    mkdir -p dev-portal-starter/projects/ui/public/pages
    cat > dev-portal-starter/projects/ui/public/pages/getting-started.md <<'PAGEEOF'
    # Getting started

    doc-test custom page: getting-started
    PAGEEOF
    cat > dev-portal-starter/projects/ui/public/pages/faq.html <<'PAGEEOF'
    <h1>FAQ</h1>
    <p>doc-test custom page: faq</p>
    PAGEEOF
    {{< /doc-test >}}
- after:
    block: 10
    fingerprint: 2c00cdff2c0fe266
    lang: shell
    lines: 2c00cdff
    preview: kind load docker-image localhost:5000/portal-frontend:latest --name <cluster-nam
  content: |-
    {{< doc-test paths="portal-build-app" >}}
    YAMLTest -f - <<'EOF'
    - name: "the local registry has the portal-frontend:latest image"
      retries: 10
      http:
        url: "http://localhost:5000/v2/portal-frontend/tags/list"
        method: GET
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.tags[0]"
            comparator: equals
            value: "latest"
    EOF
    # Run the pushed image the way the cluster would, with the custom pages variable,
    # and check that the UI and both custom pages are served.
    docker rm -f portal-frontend-doctest >/dev/null 2>&1 || true
    docker run -d --name portal-frontend-doctest -p 14000:4000 \
      -e VITE_PORTAL_SERVER_URL="http://portal.example.com:8080/v1" \
      -e VITE_CUSTOM_PAGES="$VITE_CUSTOM_PAGES" \
      localhost:5000/portal-frontend:latest
    YAMLTest -f - <<'EOF'
    - name: "the custom frontend serves index.html with the VITE_CUSTOM_PAGES setting"
      retries: 60
      http:
        url: "http://localhost:14000/"
        method: GET
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "Getting Started"
    - name: "the custom frontend serves the getting-started.md custom page"
      retries: 10
      http:
        url: "http://localhost:14000/pages/getting-started.md"
        method: GET
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "doc-test custom page: getting-started"
    - name: "the custom frontend serves the faq.html custom page"
      retries: 10
      http:
        url: "http://localhost:14000/pages/faq.html"
        method: GET
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "doc-test custom page: faq"
    EOF
    docker rm -f portal-frontend-doctest registry >/dev/null 2>&1 || true
    {{< /doc-test >}}
