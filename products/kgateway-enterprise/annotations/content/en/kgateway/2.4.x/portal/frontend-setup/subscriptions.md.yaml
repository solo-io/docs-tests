  content: |-
    {{< doc-test paths="portal-subscriptions" >}}
    # Stands in for the browser login as a Portal admin: admin1 is in the admin
    # group, so the portal grants admin access.
    export ADMIN_TOKEN=$(portal_token admin1)
    for i in $(seq 1 60); do
      portal_api GET /v1/me "$ADMIN_TOKEN"
      [ "$PORTAL_STATUS" = "200" ] && break
      sleep 5
    done
    YAMLTest -f - <<EOF
    - name: "admin1 is a Portal admin"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/me"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${ADMIN_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.isAdmin"
          comparator: equals
          value: true
    EOF
    {{< /doc-test >}}
