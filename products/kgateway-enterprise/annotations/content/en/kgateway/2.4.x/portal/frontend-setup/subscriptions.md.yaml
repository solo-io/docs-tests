  content: |-
    {{< doc-test paths="portal-subscriptions" >}}
    # Wait until the portal controller re-renders the web server with both
    # webhook endpoints before checking the rollout.
    for i in $(seq 1 60); do
      ARGS=$(kubectl get deployment portal-my-portal -n default -o jsonpath='{.spec.template.spec.containers[0].args}')
      case "$ARGS" in *--webhook-endpoint=ticketing=*--webhook-endpoint=audit=*) break ;; esac
      sleep 5
    done
    case "$ARGS" in
      *--webhook-endpoint=ticketing=https://receiver.example.com/events*--webhook-endpoint=audit=http://audit.default.svc.cluster.local:8080/portal*) ;;
      *) echo "FAIL: the portal web server was not re-rendered with both webhook endpoints: $ARGS"; exit 1 ;;
    esac
    {{< /doc-test >}}
- after:
    block: 2
    fingerprint: 10c020dfe6b71911
    lang: sh
    lines: 10c020df
    preview: kubectl rollout status deployment/portal-my-portal -n default
  content: |-
    {{< doc-test paths="portal-subscriptions" >}}
    YAMLTest -f - <<'EOF'
    - name: "the portal-my-portal Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: default
            name: portal-my-portal
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # The rollout restarts the portal web server. With the in-memory store from
    # portal/setup.md, the restart drops teams, apps, and subscriptions. Make sure
    # that an approved subscription is still in place for the credential guides.
    ADMIN_TOKEN=$(portal_token admin1)
    for i in $(seq 1 60); do
      portal_api GET "/v1/subscriptions?status=approved" "$ADMIN_TOKEN"
      [ "$PORTAL_STATUS" = "200" ] && break
      sleep 5
    done
    portal_expect 200 "list approved subscriptions as admin1 after the rollout"
    if ! jq -e --arg id "$PORTAL_SUBSCRIPTION_ID" 'any(.[]; .id == $id)' "$PORTAL_BODY" >/dev/null; then
      echo "The subscription is gone after the restart (in-memory store); request and approve it again."
      portal_request_subscription
      portal_api POST "/v1/subscriptions/${PORTAL_SUBSCRIPTION_ID}/approve" "$ADMIN_TOKEN"
      portal_expect 200 "approve the subscription again as admin1"
    fi
    YAMLTest -f - <<EOF
    - name: "an approved subscription for my-app is in place"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/subscriptions?status=approved"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${ADMIN_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "${PORTAL_SUBSCRIPTION_ID}"
    EOF
    {{< /doc-test >}}
