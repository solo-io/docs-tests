  content: |-
    {{< doc-test paths="portal-subscriptions" >}}
    # Stands in for the Approve, Reject, and Delete buttons.
    # Only an admin can approve or reject a subscription.
    portal_api POST "/v1/subscriptions/${PORTAL_SUBSCRIPTION_ID}/approve" "$(portal_token user1)"
    portal_expect 403 "approve a subscription as the non-admin user1"

    # Approve.
    ADMIN_TOKEN=$(portal_token admin1)
    portal_api POST "/v1/subscriptions/${PORTAL_SUBSCRIPTION_ID}/approve" "$ADMIN_TOKEN"
    portal_expect 200 "approve the subscription as admin1"
    [ "$(jq -r '.approved' "$PORTAL_BODY")" = "true" ] || { echo "FAIL: approved is not true: $(cat "$PORTAL_BODY")"; exit 1; }
    YAMLTest -f - <<EOF
    - name: "the subscription is approved"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/subscriptions?status=approved"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${ADMIN_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "${PORTAL_SUBSCRIPTION_ID}"
    EOF

    # You can still reject a subscription after you approved it.
    portal_api POST "/v1/subscriptions/${PORTAL_SUBSCRIPTION_ID}/reject" "$ADMIN_TOKEN"
    portal_expect 200 "reject the approved subscription as admin1"
    [ "$(jq -r '.rejected' "$PORTAL_BODY")" = "true" ] || { echo "FAIL: rejected is not true: $(cat "$PORTAL_BODY")"; exit 1; }
    YAMLTest -f - <<EOF
    - name: "the subscription is rejected"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/subscriptions?status=rejected"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${ADMIN_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "${PORTAL_SUBSCRIPTION_ID}"
    EOF

    # Delete.
    portal_api DELETE "/v1/subscriptions/${PORTAL_SUBSCRIPTION_ID}" "$ADMIN_TOKEN"
    portal_expect 204 "delete the subscription as admin1"
    portal_api GET /v1/subscriptions "$ADMIN_TOKEN"
    portal_expect 200 "list subscriptions as admin1"
    if jq -e --arg id "$PORTAL_SUBSCRIPTION_ID" 'any(.[]; .id == $id)' "$PORTAL_BODY" >/dev/null; then
      echo "FAIL: deleted subscription $PORTAL_SUBSCRIPTION_ID is still listed"; exit 1
    fi

    # Leave an approved subscription in place for the credential guides:
    # user1 requests the subscription again and admin1 approves it.
    portal_request_subscription
    portal_api POST "/v1/subscriptions/${PORTAL_SUBSCRIPTION_ID}/approve" "$ADMIN_TOKEN"
    portal_expect 200 "approve the new subscription as admin1"
    YAMLTest -f - <<EOF
    - name: "the new subscription is approved"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/subscriptions?status=approved"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${ADMIN_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "${PORTAL_SUBSCRIPTION_ID}"
    EOF
    {{< /doc-test >}}
