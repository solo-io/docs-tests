  content: |-
    {{< doc-test paths="portal-subscriptions" >}}
    # portal/setup.md exports the address of the portal gateway, which serves
    # api.example.com and portal.example.com. Look it up again if it is not set.
    export PORTAL_GW_ADDRESS="${PORTAL_GW_ADDRESS:-$(kubectl get svc -n default portal-gateway -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")}"
    echo "PORTAL_GW_ADDRESS=$PORTAL_GW_ADDRESS"
    # frontend-setup/login.md exports the Keycloak address and the portal-frontend
    # client credentials. Look them up again if they are not set.
    if [ -z "${KEYCLOAK_URL:-}" ]; then
      export KEYCLOAK_URL="http://$(kubectl -n keycloak get service keycloak -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}'):8080"
    fi
    export KEYCLOAK_CLIENT="${KEYCLOAK_CLIENT:-portal-frontend}"
    if [ -z "${KEYCLOAK_SECRET:-}" ]; then
      KC_ADMIN_TOKEN=$(curl -s -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" \
        "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" | jq -r '.access_token')
      KC_CLIENT_UUID=$(curl -s -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/portal/clients?clientId=${KEYCLOAK_CLIENT}" | jq -r '.[0].id')
      export KEYCLOAK_SECRET=$(curl -s -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/portal/clients/${KC_CLIENT_UUID}/client-secret" | jq -r '.value')
    fi
    if [ -z "$KEYCLOAK_SECRET" ] || [ "$KEYCLOAK_SECRET" = "null" ]; then
      echo "FAIL: could not get the client secret of the ${KEYCLOAK_CLIENT} Keycloak client"; exit 1
    fi
    echo "KEYCLOAK_URL=$KEYCLOAK_URL KEYCLOAK_CLIENT=$KEYCLOAK_CLIENT"
    # Helpers that call the portal API on portal.example.com as a Keycloak user of
    # the portal realm. They stand in for the browser login and the frontend app.
    # portal_token USER: prints an access token (direct access grant; every test
    # user from login.md has the password "password").
    portal_token() {
      curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
        -d "client_id=${KEYCLOAK_CLIENT}" -d "client_secret=${KEYCLOAK_SECRET}" \
        -d "grant_type=password" -d "username=$1" -d "password=password" \
        -d "scope=openid email profile" | jq -r '.access_token'
    }
    # portal_api METHOD PATH TOKEN [JSON]: sets PORTAL_STATUS and writes the
    # response body to $PORTAL_BODY.
    PORTAL_BODY=$(mktemp)
    portal_api() {
      local args=(-s -o "$PORTAL_BODY" -w '%{http_code}' -X "$1" -H "host: portal.example.com" -H "Authorization: Bearer $3")
      if [ $# -ge 4 ]; then args+=(-H "Content-Type: application/json" -d "$4"); fi
      PORTAL_STATUS=$(curl "${args[@]}" "http://${PORTAL_GW_ADDRESS}:8080$2")
    }
    # portal_expect STATUS MESSAGE: fails the test unless the last call returned STATUS.
    portal_expect() {
      if [ "$PORTAL_STATUS" != "$1" ]; then
        echo "FAIL: $2: expected HTTP $1, got $PORTAL_STATUS: $(cat "$PORTAL_BODY")"; exit 1
      fi
    }
    # portal_request_subscription: as user1, create the my-team team and the my-app
    # app if they do not exist, and request a subscription to the httpbin
    # ApiProduct (spec.id httpbin). Exports PORTAL_TEAM_ID, PORTAL_APP_ID, and
    # PORTAL_SUBSCRIPTION_ID.
    portal_request_subscription() {
      USER1_TOKEN=$(portal_token user1)
      # The first authenticated call creates the user record. Retry until the
      # bearer route and its JWT policy from login.md accept the token.
      for i in $(seq 1 60); do
        portal_api GET /v1/me "$USER1_TOKEN"
        [ "$PORTAL_STATUS" = "200" ] && break
        sleep 5
      done
      portal_expect 200 "GET /v1/me as user1"
      portal_api GET /v1/teams "$USER1_TOKEN"
      portal_expect 200 "list teams as user1"
      PORTAL_TEAM_ID=$(jq -r '[.[] | select(.name=="my-team")][0].id // empty' "$PORTAL_BODY")
      if [ -z "$PORTAL_TEAM_ID" ]; then
        portal_api POST /v1/teams "$USER1_TOKEN" '{"name":"my-team","description":"Team for the httpbin API"}'
        portal_expect 201 "create the my-team team as user1"
        PORTAL_TEAM_ID=$(jq -r '.id' "$PORTAL_BODY")
      fi
      portal_api GET "/v1/teams/${PORTAL_TEAM_ID}/apps" "$USER1_TOKEN"
      portal_expect 200 "list the apps of my-team as user1"
      PORTAL_APP_ID=$(jq -r '[.[] | select(.name=="my-app")][0].id // empty' "$PORTAL_BODY")
      if [ -z "$PORTAL_APP_ID" ]; then
        portal_api POST "/v1/teams/${PORTAL_TEAM_ID}/apps" "$USER1_TOKEN" '{"name":"my-app","description":"App for the httpbin API"}'
        portal_expect 201 "create the my-app app as user1"
        PORTAL_APP_ID=$(jq -r '.id' "$PORTAL_BODY")
      fi
      portal_api POST "/v1/apps/${PORTAL_APP_ID}/subscriptions" "$USER1_TOKEN" '{"apiProductId":"httpbin"}'
      portal_expect 201 "request a subscription to the httpbin ApiProduct as user1"
      PORTAL_SUBSCRIPTION_ID=$(jq -r '.id' "$PORTAL_BODY")
      export PORTAL_TEAM_ID PORTAL_APP_ID PORTAL_SUBSCRIPTION_ID
      echo "team=$PORTAL_TEAM_ID app=$PORTAL_APP_ID subscription=$PORTAL_SUBSCRIPTION_ID"
    }

    # Stands in for frontend-usage/teams-apps.md: user1 creates a team and an app
    # and requests a subscription to the httpbin API product.
    portal_request_subscription
    {{< /doc-test >}}
