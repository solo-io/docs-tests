  content: |-
    {{< doc-test paths="portal-auth-server" >}}
    YAMLTest -f - <<'EOF'
    - name: "the portal-auth-my-portal Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: default
            name: portal-auth-my-portal
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the portal-auth-my-portal Service listens on port 8080"
      wait:
        target:
          kind: Service
          metadata:
            namespace: default
            name: portal-auth-my-portal
        jsonPath: "$.spec.ports[0].port"
        jsonPathExpectation:
          comparator: equals
          value: 8080
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
- after:
    block: 1
    fingerprint: 5674b8d8b97f9ae0
    lang: sh
    lines: f9282b87 5ab08345
    preview: kubectl get deployment -n default | grep portal-auth
  content: |-
    {{< doc-test paths="portal-auth-server" >}}
    # The auth server runs in restricted mode: routes other than /healthz,
    # /readyz, and GET /v1/metadata return 404.
    CODE=""
    for i in $(seq 1 20); do
      CODE=$(kubectl run portal-auth-probe-$i -n default --rm -i --restart=Never --quiet \
        --image=curlimages/curl:8.11.1 --command -- \
        curl -s -o /dev/null -w '%{http_code}' http://portal-auth-my-portal.default.svc.cluster.local:8080/v1/api-products 2>/dev/null | tail -c 3)
      [ "$CODE" = "404" ] && break
      sleep 5
    done
    echo "GET /v1/api-products on the auth server returned $CODE"
    [ "$CODE" = "404" ]
    {{< /doc-test >}}
