  content: |-
    {{< doc-test paths="portal-login,portal-login-pkce" >}}
    YAMLTest -f - <<'EOF'
    - name: "the keycloak Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: keycloak
            name: keycloak
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 600
          intervalSeconds: 5
    - name: "the keycloak LoadBalancer service has an external address"
      wait:
        target:
          kind: Service
          metadata:
            namespace: keycloak
            name: keycloak
        jsonPath: "$.status.loadBalancer.ingress[0]"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
