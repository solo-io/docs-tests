  content: |-
    {{< doc-test paths="portal-apiproducts" >}}
    YAMLTest -f - <<'EOF'
    - name: "the PortalConfig lists the v1 version of the petstore ApiProduct"
      wait:
        target:
          kind: PortalConfig
          metadata:
            namespace: default
            name: my-portal
        jsonPath: "$.spec.apis[?(@.apiDocRef.name=='petstore-api-v1')].title"
        jsonPathExpectation:
          comparator: equals
          value: "Petstore API v1"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the PortalConfig lists the v2 version of the petstore ApiProduct"
      wait:
        target:
          kind: PortalConfig
          metadata:
            namespace: default
            name: my-portal
        jsonPath: "$.spec.apis[?(@.apiDocRef.name=='petstore-api-v2')].title"
        jsonPathExpectation:
          comparator: equals
          value: "Petstore API v2"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the PortalConfig still lists the httpbin ApiProduct"
      wait:
        target:
          kind: PortalConfig
          metadata:
            namespace: default
            name: my-portal
        jsonPath: "$.spec.apis[?(@.apiDocRef.name=='httpbin-api-v1')].apiProductId"
        jsonPathExpectation:
          comparator: equals
          value: "httpbin"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the API catalog lists the petstore ApiProduct"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products"
        method: GET
        headers:
          host: "portal.example.com"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "petstore"
    EOF
