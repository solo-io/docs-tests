      preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="portal-visibility" >}}
    # Stands in for logging in to the portal frontend as user1 (steps 1-3): call
    # the portal API as user1 through the gateway's bearer route and check that
    # the catalog does not list the httpbin API product, and that its detail page
    # returns 404.
    kc_token() {
      curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
        -d "client_id=${KEYCLOAK_CLIENT}" \
        -d "client_secret=${KEYCLOAK_SECRET}" \
        -d "grant_type=password" \
        -d "username=$1" \
        -d "password=password" \
        -d "scope=openid email profile" | jq -r '.access_token'
    }
    jwt_claim() {
      python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p)).get(sys.argv[2]))' "$1" "$2"
    }
    ok=0
    for i in $(seq 1 60); do
      USER1_TOKEN=$(kc_token user1)
      body=$(curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${USER1_TOKEN}" "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products" || true)
      code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: portal.example.com" -H "Authorization: Bearer ${USER1_TOKEN}" "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products/httpbin" || true)
      if echo "$body" | jq -e 'type == "array" and ((map(.id) | index("httpbin")) == null)' >/dev/null 2>&1 && [ "$code" = "404" ]; then ok=1; break; fi
      sleep 5
    done
    [ "$ok" = 1 ] || { echo "FAIL: user1 (tier: basic) can still see the httpbin API product: list=$body detail=$code"; exit 1; }
    jwt_claim "$USER1_TOKEN" tier | grep basic >/dev/null \
      || { echo "FAIL: the user1 token has no tier: basic claim (set in the Secure login guide)"; exit 1; }
    echo "user1 does not see the httpbin API product"
    {{< /doc-test >}}
