      preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="portal-visibility" >}}
    # Stands in for checking the result of the Portal-wide tab: the Portal resolves
    # the premium-only policy, the catalog is no longer public (no token: 401), and
    # admin1 (tier: premium, and an admin) still sees the httpbin API product.
    YAMLTest -f - <<'EOF'
    - name: "the my-portal Portal resolves its VisibilityPolicy refs"
      wait:
        target:
          kind: Portal
          metadata:
            namespace: default
            name: my-portal
        jsonPath: "$.status.conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the my-portal Portal is programmed"
      wait:
        target:
          kind: Portal
          metadata:
            namespace: default
            name: my-portal
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the API catalog requires a login after visibility.public is removed"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products"
        method: GET
        headers:
          host: "portal.example.com"
      source:
        type: local
      expect:
        statusCode: 401
    EOF
    kc_token() {
      curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
        -d "client_id=${KEYCLOAK_CLIENT}" \
        -d "client_secret=${KEYCLOAK_SECRET}" \
        -d "grant_type=password" \
        -d "username=$1" \
        -d "password=password" \
        -d "scope=openid email profile" | jq -r '.access_token'
    }
    jwt_claim() {
      python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p)).get(sys.argv[2]))' "$1" "$2"
    }
    ADMIN1_TOKEN=$(kc_token admin1)
    [ -n "$ADMIN1_TOKEN" ] && [ "$ADMIN1_TOKEN" != "null" ] || { echo "FAIL: no Keycloak token for admin1"; exit 1; }
    jwt_claim "$ADMIN1_TOKEN" tier | grep premium >/dev/null \
      || { echo "FAIL: the admin1 token has no tier: premium claim (set in the Secure login guide)"; exit 1; }
    export ADMIN1_TOKEN
    YAMLTest -f - <<'EOF'
    - name: "admin1 (tier: premium) sees the httpbin API product"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products"
        method: GET
        headers:
          host: "portal.example.com"
          authorization: "Bearer ${ADMIN1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "\"id\":\"httpbin\""
    EOF
    {{< /doc-test >}}
