  content: |-
    {{< doc-test paths="portal-rbac" >}}
    # Steps 2 and 3: remove the ServiceAccount, and rename the ClusterRole and
    # ClusterRoleBinding because this upgrades an existing installation.
    python3 - <<'PYEOF'
    import yaml
    with open("portal-controller-rbac.yaml") as f:
        docs = [d for d in yaml.safe_load_all(f) if d and d.get("kind") != "ServiceAccount"]
    for d in docs:
        if d["kind"] in ("ClusterRole", "ClusterRoleBinding"):
            d["metadata"]["name"] += "-custom"
        if d["kind"] == "ClusterRoleBinding":
            d["roleRef"]["name"] += "-custom"
    with open("portal-controller-rbac.yaml", "w") as f:
        yaml.safe_dump_all(docs, f)
    PYEOF
    grep -E '^kind:|^  name:' portal-controller-rbac.yaml
    {{< /doc-test >}}
