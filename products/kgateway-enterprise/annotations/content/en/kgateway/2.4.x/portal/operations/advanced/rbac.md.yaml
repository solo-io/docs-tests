    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: portal-web-server
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: portal-web-server
    subjects:
    - kind: ServiceAccount
      name: $SA
      namespace: default
    EOF
