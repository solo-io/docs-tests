    preview: 'curl -vik localhost:8080/httpbin/headers -H "host: api.example.com"'
  content: |-
    {{< doc-test paths="portal-cm-apikey-client-id" >}}
    # Stands in for the localhost (port-forward) request above.
    YAMLTest -f - <<'EOF'
    - name: "a request to the httpbin API without a client ID and API key is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
      source:
        type: local
      expect:
        statusCode: 403
    - name: "a request with an API key but no client ID is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          x-client-secret: "not-a-portal-api-key"
      source:
        type: local
      expect:
        statusCode: 403
    - name: "a request with a client ID and API key that Portal did not issue is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          x-client-id: "not-a-portal-client-id"
          x-client-secret: "not-a-portal-api-key"
      source:
        type: local
      expect:
        statusCode: 403
    EOF
    {{< /doc-test >}}
