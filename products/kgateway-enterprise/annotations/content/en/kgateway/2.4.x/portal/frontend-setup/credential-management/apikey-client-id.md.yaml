    YAMLTest -f - <<'EOF'
    - name: "the httpbin-auth AuthConfig is accepted"
      wait:
        target:
          kind: AuthConfig
          metadata:
            namespace: default
            name: httpbin-auth
        jsonPath: "$.status.state"
        jsonPathExpectation:
          comparator: equals
          value: "Accepted"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
