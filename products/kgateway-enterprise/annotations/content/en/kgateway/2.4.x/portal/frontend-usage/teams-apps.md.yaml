  content: |-
    {{< doc-test paths="portal-teams-apps" >}}
    # Add API product subscriptions: user1 subscribes my-app to the httpbin
    # ApiProduct (POST /v1/apps/{appID}/subscriptions), which is what Create
    # Subscription does in the frontend app. The subscription stays pending until a
    # Portal admin approves it.
    USER1_TOKEN=$(fu_token user1)
    export USER1_TOKEN
    fu_call POST "/v1/apps/${APP_ID}/subscriptions" "${USER1_TOKEN}" "{\"apiProductId\":\"${API_PRODUCT_ID}\"}"
    fu_expect 201 "subscribe my-app to the ${API_PRODUCT_ID} ApiProduct as user1"
    export SUBSCRIPTION_ID=$(echo "${FU_BODY}" | jq -r .id)
    echo "SUBSCRIPTION_ID=${SUBSCRIPTION_ID}"
    YAMLTest -f - <<'EOF'
    - name: "the my-app subscription to the httpbin ApiProduct is pending"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/${APP_ID}/subscriptions"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$[0].apiProductId"
            comparator: equals
            value: "httpbin"
          - path: "$[0].approved"
            comparator: equals
            value: false
          - path: "$[0].rejected"
            comparator: equals
            value: false
    - name: "the SPEC and DOCS of the httpbin ApiProduct load"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products/${API_PRODUCT_ID}/versions"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "/headers"
    EOF
    {{< /doc-test >}}
