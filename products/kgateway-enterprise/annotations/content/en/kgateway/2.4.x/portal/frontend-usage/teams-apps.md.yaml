  content: |-
    {{< doc-test paths="portal-teams-apps" >}}
    # Add users: user1 adds admin1 to the team by email (POST
    # /v1/teams/{teamID}/members), which is what ADD USER does in the frontend app.
    # admin1 logged in earlier (GET /v1/me), so the portal knows the user.
    USER1_TOKEN=$(fu_token user1)
    export USER1_TOKEN
    fu_call POST "/v1/teams/${TEAM_ID}/members" "${USER1_TOKEN}" '{"email":"admin1@solo.io"}'
    fu_expect 201 "add admin1@solo.io to my-team as user1"
    export ADMIN1_MEMBER_ID=$(echo "${FU_BODY}" | jq -r .id)
    YAMLTest -f - <<'EOF'
    - name: "my-team lists admin1 as a team member"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/teams/${TEAM_ID}/members"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "admin1@solo.io"
    EOF
    {{< /doc-test >}}
- after:
