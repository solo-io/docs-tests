    block_before: null
  content: |-
    {{< doc-test paths="portal-teams-apps" >}}
    # Remove users: user1 removes admin1 from the team (DELETE
    # /v1/teams/{teamID}/members/{memberID}), which is what REMOVE does in the
    # frontend app. The team itself is kept, because the pages that build on this
    # guide use it.
    USER1_TOKEN=$(fu_token user1)
    fu_call DELETE "/v1/teams/${TEAM_ID}/members/${ADMIN1_MEMBER_ID}" "${USER1_TOKEN}"
    fu_expect 204 "remove admin1 from my-team as user1"
    fu_call GET "/v1/teams/${TEAM_ID}/members" "${USER1_TOKEN}"
    fu_expect 200 "list the members of my-team as user1"
    if echo "${FU_BODY}" | jq -e '.[] | select(.email == "admin1@solo.io")' >/dev/null; then
      echo "FAIL: admin1 is still a member of my-team: ${FU_BODY}" >&2
      exit 1
    fi
    if ! echo "${FU_BODY}" | jq -e '.[] | select(.email == "user1@example.com")' >/dev/null; then
      echo "FAIL: user1 is no longer a member of my-team: ${FU_BODY}" >&2
      exit 1
    fi
    {{< /doc-test >}}
