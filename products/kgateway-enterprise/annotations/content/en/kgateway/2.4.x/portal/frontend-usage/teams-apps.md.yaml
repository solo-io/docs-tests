    {{< doc-test paths="portal-teams-apps" >}}
    # Create apps: user1 creates the app "my-app" for my-team (POST
    # /v1/teams/{teamID}/apps), which is what CREATE NEW APP does in the frontend app.
    USER1_TOKEN=$(fu_token user1)
    export USER1_TOKEN
    fu_call POST "/v1/teams/${TEAM_ID}/apps" "${USER1_TOKEN}" '{"name":"my-app","description":"App for the httpbin API"}'
    fu_expect 201 "create the app my-app for my-team as user1"
    export APP_ID=$(echo "${FU_BODY}" | jq -r .id)
    echo "APP_ID=${APP_ID}"
    YAMLTest -f - <<'EOF'
    - name: "my-team lists the app my-app"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/teams/${TEAM_ID}/apps"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$[0].name"
            comparator: equals
            value: "my-app"
    EOF
    {{< /doc-test >}}
