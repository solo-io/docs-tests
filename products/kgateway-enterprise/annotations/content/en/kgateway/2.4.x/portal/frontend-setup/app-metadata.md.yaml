  content: |-
    {{< doc-test paths="portal-app-metadata" >}}
    echo "PORTAL_URL=$PORTAL_URL"
    [ "$PORTAL_URL" = "http://portal.example.com:8080" ] || { echo "FAIL: unexpected PORTAL_URL $PORTAL_URL"; exit 1; }
    [ -n "$ADMIN_TOKEN" ] && [ "$ADMIN_TOKEN" != "null" ] || { echo "FAIL: no Keycloak token for admin1"; exit 1; }
    # The httpbin-route HTTPRoute is attached to the portal-gateway Gateway from
    # the portal setup guide, so send the page's API requests to that gateway.
    export INGRESS_GW_ADDRESS="${PORTAL_GW_ADDRESS}"
    # API_KEY comes from the Create API keys guide. If it is not set, create a key
    # for user1's app through the portal API, as that guide does in the frontend.
    if [ -z "${API_KEY:-}" ]; then
      kc_token() {
        curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
          -d "client_id=${KEYCLOAK_CLIENT}" \
          -d "client_secret=${KEYCLOAK_SECRET}" \
          -d "grant_type=password" \
          -d "username=$1" \
          -d "password=password" \
          -d "scope=openid email profile" | jq -r '.access_token'
      }
      USER1_TOKEN=$(kc_token user1)
      pc() { curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${USER1_TOKEN}" -H "Content-Type: application/json" "$@"; }
      T=$(pc "http://${PORTAL_GW_ADDRESS}:8080/v1/teams" | jq -r '.[0].id')
      A=$(pc "http://${PORTAL_GW_ADDRESS}:8080/v1/teams/${T}/apps" | jq -r '.[0].id')
      export API_KEY=$(pc -X POST "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/${A}/api-keys" -d '{"apiKeyName":"app-metadata-test"}' | jq -r '.apiKey')
    fi
    [ -n "${API_KEY:-}" ] && [ "${API_KEY}" != "null" ] || { echo "FAIL: no API key for the httpbin API product"; exit 1; }
    {{< /doc-test >}}
- after:
    block: 7
    fingerprint: ceb703c34aa97ef4
    lang: sh
    lines: ceb703c3
    preview: export SUBSCRIPTION_ID=<subscription-id>
  content: |-
    {{< doc-test paths="portal-app-metadata" >}}
    # Stands in for the three list calls and the placeholder exports above: find
    # the app that owns API_KEY, then its team and its approved subscription to the
    # httpbin API product, with the same admin endpoints the page uses.
    # portal.example.com resolves to the portal-gateway address only through the
    # Host header, so the portal API calls go to PORTAL_GW_ADDRESS with that header.
    pa() { curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" "$@"; }
    export APP_ID=$(curl -s -G -H "Host: portal.example.com" "http://${PORTAL_GW_ADDRESS}:8080/v1/metadata" \
      --data-urlencode "apiKey=${API_KEY}" --data-urlencode "apiProductId=httpbin" | jq -r '.applicationId')
    [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ] || { echo "FAIL: the API key is not valid for the httpbin API product"; exit 1; }
    export TEAM_ID=$(pa "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/${APP_ID}" | jq -r '.teamId')
    pa "http://${PORTAL_GW_ADDRESS}:8080/v1/teams" | jq -e --arg t "$TEAM_ID" 'map(.id) | index($t) != null' >/dev/null \
      || { echo "FAIL: GET /v1/teams does not list team $TEAM_ID"; exit 1; }
    export APP_NAME=$(pa "http://${PORTAL_GW_ADDRESS}:8080/v1/teams/${TEAM_ID}/apps" | jq -r --arg a "$APP_ID" '.[] | select(.id == $a) | .name')
    [ -n "$APP_NAME" ] || { echo "FAIL: GET /v1/teams/$TEAM_ID/apps does not list app $APP_ID"; exit 1; }
    export SUBSCRIPTION_ID=$(pa "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/${APP_ID}/subscriptions" \
      | jq -r '[.[] | select(.apiProductId == "httpbin" and .approved)][0].id')
    [ -n "$SUBSCRIPTION_ID" ] && [ "$SUBSCRIPTION_ID" != "null" ] || { echo "FAIL: no approved subscription to httpbin for app $APP_ID"; exit 1; }
    echo "TEAM_ID=$TEAM_ID APP_ID=$APP_ID APP_NAME=$APP_NAME SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
    {{< /doc-test >}}
- after:
    block: 8
    fingerprint: b5501ac791376499
    lang: sh
    lines: a27a839c f43e9869 67c5a3ac ce37f1bf
    preview: curl -s -X POST "$PORTAL_URL/v1/apps/$APP_ID/metadata" \
  content: |-
    {{< doc-test paths="portal-app-metadata" >}}
    # Runs the call above against the portal-gateway address and checks that the
    # app reports the custom metadata.
    # portal.example.com resolves to the portal-gateway address only through the
    # Host header, so the portal API calls go to PORTAL_GW_ADDRESS with that header.
    pa() { curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" "$@"; }
    resp=$(pa -w '\n%{http_code}' -X POST "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/$APP_ID/metadata" \
      -d '{"customMetadata": {"tier": "free", "region": "eu"}}')
    echo "$resp"
    [ "$(echo "$resp" | tail -1)" = "200" ] || { echo "FAIL: setting the app metadata did not return 200"; exit 1; }
    echo "$resp" | sed '$d' | jq -e '.metadata.customMetadata == {"tier": "free", "region": "eu"}' >/dev/null \
      || { echo "FAIL: the app does not report customMetadata tier=free, region=eu"; exit 1; }
    {{< /doc-test >}}
- after:
    block: 9
    fingerprint: d25845317d23ccea
    lang: sh
    lines: 0bf031c9 f43e9869 67c5a3ac fff4e913
    preview: curl -s -X POST "$PORTAL_URL/v1/subscriptions/$SUBSCRIPTION_ID/metadata" \
  content: |-
    {{< doc-test paths="portal-app-metadata" >}}
    # Runs the call above against the portal-gateway address, checks that the
    # subscription reports the custom metadata, and reads back the merged metadata
    # that ExtAuth gets for the API key: the subscription's tier wins.
    # portal.example.com resolves to the portal-gateway address only through the
    # Host header, so the portal API calls go to PORTAL_GW_ADDRESS with that header.
    pa() { curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" "$@"; }
    resp=$(pa -w '\n%{http_code}' -X POST "http://${PORTAL_GW_ADDRESS}:8080/v1/subscriptions/$SUBSCRIPTION_ID/metadata" \
      -d '{"customMetadata": {"tier": "premium"}}')
    echo "$resp"
    [ "$(echo "$resp" | tail -1)" = "200" ] || { echo "FAIL: setting the subscription metadata did not return 200"; exit 1; }
    echo "$resp" | sed '$d' | jq -e '.metadata.customMetadata == {"tier": "premium"}' >/dev/null \
      || { echo "FAIL: the subscription does not report customMetadata tier=premium"; exit 1; }
    pa "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/$APP_ID/subscriptions" \
      | jq -e --arg s "$SUBSCRIPTION_ID" '.[] | select(.id == $s) | .metadata.customMetadata.tier == "premium"' >/dev/null \
      || { echo "FAIL: GET /v1/apps/$APP_ID/subscriptions does not return the subscription metadata"; exit 1; }
    meta=$(curl -s -G -H "Host: portal.example.com" "http://${PORTAL_GW_ADDRESS}:8080/v1/metadata" \
      --data-urlencode "apiKey=${API_KEY}" --data-urlencode "apiProductId=httpbin")
    echo "$meta"
    echo "$meta" | jq -e --arg a "$APP_ID" '.allowed == true and .applicationId == $a and .customMetadata == {"tier": "premium", "region": "eu"}' >/dev/null \
      || { echo "FAIL: /v1/metadata does not return the merged customMetadata tier=premium, region=eu"; exit 1; }
    {{< /doc-test >}}
