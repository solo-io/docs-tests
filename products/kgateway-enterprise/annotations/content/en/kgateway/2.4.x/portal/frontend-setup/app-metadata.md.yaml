- after:
    block: 15
    fingerprint: ab49128634bacb72
    lang: sh
    lines: ab491286
    preview: kubectl logs -n default deployment/portal-gateway | grep '"path":"/httpbin/heade
  content: |-
    {{< doc-test paths="portal-app-metadata" >}}
    # Checks the latest access log line for an authenticated /httpbin/headers
    # request. ExtAuth caches credential lookups (cacheDuration: 10s) and the
    # listener change takes a moment to reach the proxy, so send a fresh request
    # and retry.
    ok=0
    for i in $(seq 1 30); do
      curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/httpbin/headers" -H "host: api.example.com" -H "api-key: ${API_KEY}"
      sleep 2
      line=$(kubectl logs -n default deployment/portal-gateway --tail=500 \
        | grep '^{' | jq -c 'select(.path == "/httpbin/headers" and (.response_code | tostring) == "200")' 2>/dev/null | tail -1 || true)
      if [ -n "$line" ] && echo "$line" | jq -e --arg a "$APP_ID" --arg n "$APP_NAME" \
          '.application_id == $a and .application_name == $n and .tier == "premium" and .region == "eu" and .method == "GET"' >/dev/null; then
        ok=1; break
      fi
      sleep 3
    done
    echo "last access log line: $line"
    [ "$ok" = 1 ] || { echo "FAIL: no access log line with application_id=$APP_ID, application_name=$APP_NAME, tier=premium, region=eu"; exit 1; }
    {{< /doc-test >}}
