  content: |-
    {{< doc-test paths="portal-creds-apikeys-client-id" >}}
    YAMLTest -f - <<'EOF'
    - name: "the httpbin API returns 200 for a request with the client ID and the API key"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          x-client-id: "${CLIENT_ID}"
          x-client-secret: "${API_KEY}"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
