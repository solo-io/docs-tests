  content: |-
    {{< doc-test paths="portal-memory-limit" >}}
    YAMLTest -f - <<'EOF'
    - name: "the portal controller Deployment sets AUTOMEMLIMIT to 0.90"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/portal-namespace.md" >}}
            name: portal-controller
        jsonPath: "$.spec.template.spec.containers[0].env[?(@.name=='AUTOMEMLIMIT')].value"
        jsonPathExpectation:
          comparator: equals
          value: "0.90"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
