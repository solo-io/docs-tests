  content: |-
    {{< doc-test paths="portal-view-apis" >}}
    # fu_ensure_app: finds user1's app (or creates the team "my-team" and the
    # app "my-app"), and makes sure that the app has an approved subscription to
    # the httpbin ApiProduct, as the "Before you begin" section requires. Sets
    # TEAM_ID, APP_ID, and SUBSCRIPTION_ID.
    fu_ensure_app() {
      USER1_TOKEN=$(fu_token user1)
      ADMIN1_TOKEN=$(fu_token admin1)
      TEAM_ID=""
      APP_ID=""
      fu_call GET /v1/teams "${USER1_TOKEN}"
      fu_expect 200 "GET /v1/teams as user1"
      for t in $(echo "${FU_BODY}" | jq -r '.[].id'); do
        TEAM_ID="${TEAM_ID:-$t}"
        fu_call GET "/v1/teams/$t/apps" "${USER1_TOKEN}"
        fu_expect 200 "GET /v1/teams/$t/apps as user1"
        a=$(echo "${FU_BODY}" | jq -r '.[0].id // empty')
        if [ -n "$a" ]; then TEAM_ID="$t"; APP_ID="$a"; break; fi
      done
      if [ -z "${TEAM_ID}" ]; then
        fu_call POST /v1/teams "${USER1_TOKEN}" '{"name":"my-team","description":"Team for the httpbin API"}'
        fu_expect 201 "POST /v1/teams as user1"
        TEAM_ID=$(echo "${FU_BODY}" | jq -r .id)
      fi
      if [ -z "${APP_ID}" ]; then
        fu_call POST "/v1/teams/${TEAM_ID}/apps" "${USER1_TOKEN}" '{"name":"my-app","description":"App for the httpbin API"}'
        fu_expect 201 "POST /v1/teams/${TEAM_ID}/apps as user1"
        APP_ID=$(echo "${FU_BODY}" | jq -r .id)
      fi
      fu_call GET "/v1/apps/${APP_ID}/subscriptions" "${USER1_TOKEN}"
      fu_expect 200 "GET /v1/apps/${APP_ID}/subscriptions as user1"
      SUBSCRIPTION_ID=$(echo "${FU_BODY}" | jq -r --arg p "${API_PRODUCT_ID}" '[.[] | select(.apiProductId == $p)][0].id // empty')
      SUBSCRIPTION_APPROVED=$(echo "${FU_BODY}" | jq -r --arg p "${API_PRODUCT_ID}" '[.[] | select(.apiProductId == $p)][0].approved // false')
      if [ -z "${SUBSCRIPTION_ID}" ]; then
        fu_call POST "/v1/apps/${APP_ID}/subscriptions" "${USER1_TOKEN}" "{\"apiProductId\":\"${API_PRODUCT_ID}\"}"
        fu_expect 201 "POST /v1/apps/${APP_ID}/subscriptions as user1"
        SUBSCRIPTION_ID=$(echo "${FU_BODY}" | jq -r .id)
        SUBSCRIPTION_APPROVED=false
      fi
      if [ "${SUBSCRIPTION_APPROVED}" != true ]; then
        fu_call POST "/v1/subscriptions/${SUBSCRIPTION_ID}/approve" "${ADMIN1_TOKEN}"
        fu_expect 200 "POST /v1/subscriptions/${SUBSCRIPTION_ID}/approve as admin1"
      fi
      export TEAM_ID APP_ID SUBSCRIPTION_ID USER1_TOKEN ADMIN1_TOKEN
    }
    # Test API access in the UI: Try it out sends GET /headers to the httpbin API
    # with the credential that you enter in Authorize. Use the API key from the
    # Create API keys guide, or create one if this guide runs on its own.
    if [ -z "${API_KEY:-}" ]; then
      fu_ensure_app
      fu_call POST "/v1/apps/${APP_ID}/api-keys" "${USER1_TOKEN}" '{"apiKeyName":"view-apis-key"}'
      fu_expect 201 "create an API key for the app as user1"
      export API_KEY=$(echo "${FU_BODY}" | jq -r .apiKey)
    fi
    YAMLTest -f - <<'EOF'
    - name: "Try it out on GET httpbin/headers returns 200 with the API key"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          api-key: "${API_KEY}"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
