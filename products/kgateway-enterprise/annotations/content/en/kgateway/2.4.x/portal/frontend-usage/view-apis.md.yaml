  content: |-
    {{< doc-test paths="portal-view-apis" >}}
    # The fu_* helpers below stand in for the frontend app (fu = frontend user).
    # The portal frontend app calls the portal REST API (/v1/...) on
    # portal.example.com with the token of the user who is logged in, through the
    # portal-backend-bearer route from the secure login guide. The UI steps are
    # replaced with the same API calls. Tokens for user1 (Portal user) and admin1
    # (Portal admin) come from Keycloak's password grant on the portal-frontend
    # client, which has direct access grants enabled.
    export PORTAL_GW_ADDRESS="${PORTAL_GW_ADDRESS:-$(kubectl get svc -n default portal-gateway -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")}"
    if [ -z "${KEYCLOAK_URL:-}" ]; then
      export KEYCLOAK_URL="http://$(kubectl -n keycloak get service keycloak -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}'):8080"
    fi
    export KEYCLOAK_CLIENT="${KEYCLOAK_CLIENT:-portal-frontend}"
    if [ -z "${KEYCLOAK_SECRET:-}" ]; then
      KC_ADMIN_TOKEN=$(curl -s -d client_id=admin-cli -d username=admin -d password=admin -d grant_type=password \
        "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" | jq -r .access_token)
      KC_CLIENT_UUID=$(curl -s -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/portal/clients?clientId=${KEYCLOAK_CLIENT}" | jq -r '.[0].id')
      export KEYCLOAK_SECRET=$(curl -s -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KEYCLOAK_URL}/admin/realms/portal/clients/${KC_CLIENT_UUID}/client-secret" | jq -r .value)
    fi
    # fu_token USER: an access token for USER (password "password").
    fu_token() {
      curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
        -d "client_id=${KEYCLOAK_CLIENT}" -d "client_secret=${KEYCLOAK_SECRET}" \
        -d grant_type=password -d "username=$1" -d password=password \
        -d "scope=openid email profile" | jq -r '.access_token // empty'
    }
    # fu_call METHOD PATH TOKEN [JSON]: calls the portal API, sets FU_STATUS and FU_BODY.
    fu_call() {
      local args=(-s -w '\n%{http_code}' -X "$1" "http://${PORTAL_GW_ADDRESS}:8080$2"
        -H "host: portal.example.com" -H "Authorization: Bearer $3")
      if [ $# -ge 4 ]; then args+=(-H "Content-Type: application/json" -d "$4"); fi
      local out
      out=$(curl "${args[@]}" || true)
      FU_STATUS="${out##*$'\n'}"
      FU_BODY="${out%$'\n'*}"
    }
    # fu_expect CODE WHAT: fails the test unless the last fu_call returned CODE.
    fu_expect() {
      if [ "${FU_STATUS}" != "$1" ]; then
        echo "FAIL: $2: expected HTTP $1, got ${FU_STATUS}: ${FU_BODY}" >&2
        exit 1
      fi
    }
    # Log in as user1 and admin1. GET /v1/me creates the user record, like the
    # first login in the frontend app. Retry until the bearer route accepts tokens.
    for i in $(seq 1 60); do
      USER1_TOKEN=$(fu_token user1)
      if [ -n "${USER1_TOKEN}" ]; then
        fu_call GET /v1/me "${USER1_TOKEN}"
        if [ "${FU_STATUS}" = 200 ]; then break; fi
      fi
      sleep 5
    done
    fu_expect 200 "GET /v1/me as user1"
    ADMIN1_TOKEN=$(fu_token admin1)
    fu_call GET /v1/me "${ADMIN1_TOKEN}"
    fu_expect 200 "GET /v1/me as admin1"
    export USER1_TOKEN ADMIN1_TOKEN
    fu_call GET /v1/api-products "${USER1_TOKEN}"
    fu_expect 200 "GET /v1/api-products as user1"
    export API_PRODUCT_ID=$(echo "${FU_BODY}" | jq -r '[.[] | select(.id == "httpbin" or .name == "HTTPBin API")][0].id // empty')
    if [ -z "${API_PRODUCT_ID}" ]; then
      echo "FAIL: the httpbin ApiProduct is not in the API catalog: ${FU_BODY}" >&2
      exit 1
    fi
    YAMLTest -f - <<'EOF'
    - name: "the API catalog shows the httpbin ApiProduct to user1"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "HTTPBin API"
    - name: "the httpbin ApiProduct details load"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products/${API_PRODUCT_ID}"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.name"
            comparator: equals
            value: "HTTPBin API"
    - name: "the Spec and Docs of the httpbin ApiProduct load"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products/${API_PRODUCT_ID}/versions"
        method: GET
        headers:
          host: "portal.example.com"
          Authorization: "Bearer ${USER1_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "/headers"
    EOF
    {{< /doc-test >}}
