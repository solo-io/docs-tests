    # The httpbin-route HTTPRoute is attached to the portal-gateway Gateway from
    # the portal setup guide, so send the page's requests to that gateway's address.
    export INGRESS_GW_ADDRESS="${PORTAL_GW_ADDRESS}"
    # API_KEY comes from the Create API keys guide. If it is not set, create a key
    # for user1's app through the portal API, as that guide does in the frontend.
    if [ -z "${API_KEY:-}" ]; then
      kc_token() {
        curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
          -d "client_id=${KEYCLOAK_CLIENT}" \
          -d "client_secret=${KEYCLOAK_SECRET}" \
          -d "grant_type=password" \
          -d "username=$1" \
          -d "password=password" \
          -d "scope=openid email profile" | jq -r '.access_token'
      }
      USER1_TOKEN=$(kc_token user1)
      pc() { curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${USER1_TOKEN}" -H "Content-Type: application/json" "$@"; }
      TEAM_ID=$(pc "http://${PORTAL_GW_ADDRESS}:8080/v1/teams" | jq -r '.[0].id')
      APP_ID=$(pc "http://${PORTAL_GW_ADDRESS}:8080/v1/teams/${TEAM_ID}/apps" | jq -r '.[0].id')
      export API_KEY=$(pc -X POST "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/${APP_ID}/api-keys" -d '{"apiKeyName":"ratelimit-test"}' | jq -r '.apiKey')
    fi
    [ -n "${API_KEY:-}" ] && [ "${API_KEY}" != "null" ] || { echo "FAIL: no API key for the httpbin API product"; exit 1; }
    {{< /doc-test >}}
- after:
    section: 'Step 1: Set up a default rate limit for an API'
    line: 600fe1bb59e46b50
    occurrence: 0
    words: 32d3feda
    block_before:
      block: 5
      fingerprint: 1032bf8d57cf2931
      lang: sh
      lines: fc06010d 663f7696 6692427b
      preview: for i in {1..3}; do curl -vik localhost:8080/httpbin/headers \
  content: |-
    {{< doc-test paths="portal-ratelimit" >}}
    # Stands in for the curl loop above (its line continuations end in a space, so
    # the -H flags are not passed): requests with the app's API key beyond the
    # default limit of 2 per minute get a 429.
    YAMLTest -f - <<'EOF'
    - name: "a request with the API key succeeds"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          api-key: "${API_KEY}"
      source:
        type: local
      expect:
        statusCode: 200
    - name: "requests beyond the default limit are rate limited"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          api-key: "${API_KEY}"
      source:
        type: local
      expect:
        statusCode: 429
        headers:
          - name: x-envoy-ratelimited
            comparator: equals
            value: "true"
    EOF
    # Sends $1 requests with the API key at the start of a fresh rate limit
    # window (the rate limiter counts per calendar minute) and prints the codes.
    rl_window() {
      local s; s=$(date +%S); sleep $((61 - 10#$s))
      local codes=""
      for i in $(seq 1 "$1"); do
        codes="$codes $(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/httpbin/headers" -H "host: api.example.com" -H "api-key: ${API_KEY}")"
      done
      echo "${codes# }"
    }
    codes=$(rl_window 3)
    echo "default limit, 3 requests in one minute: $codes"
    [ "$codes" = "200 200 429" ] || { echo "FAIL: expected 200 200 429 with the default limit of 2 per minute, got: $codes"; exit 1; }
    {{< /doc-test >}}
