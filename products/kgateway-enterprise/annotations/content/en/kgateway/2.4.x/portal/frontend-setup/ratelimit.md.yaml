      preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="portal-ratelimit" >}}
    # Stands in for steps 2-6 in the frontend: as admin1, set a rate limit of 5
    # requests per minute on the app's subscription to the httpbin API product
    # through the portal API (the call that the Edit Rate Limit dialog makes).
    kc_token() {
      curl -s -X POST "${KEYCLOAK_URL}/realms/portal/protocol/openid-connect/token" \
        -d "client_id=${KEYCLOAK_CLIENT}" \
        -d "client_secret=${KEYCLOAK_SECRET}" \
        -d "grant_type=password" \
        -d "username=$1" \
        -d "password=password" \
        -d "scope=openid email profile" | jq -r '.access_token'
    }
    ADMIN_TOKEN=$(kc_token admin1)
    [ -n "$ADMIN_TOKEN" ] && [ "$ADMIN_TOKEN" != "null" ] || { echo "FAIL: no Keycloak token for admin1"; exit 1; }
    APP_ID=$(curl -s -G -H "Host: portal.example.com" "http://${PORTAL_GW_ADDRESS}:8080/v1/metadata" \
      --data-urlencode "apiKey=${API_KEY}" --data-urlencode "apiProductId=httpbin" | jq -r '.applicationId')
    [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ] || { echo "FAIL: the API key is not valid for the httpbin API product"; exit 1; }
    SUBSCRIPTION_ID=$(curl -s -H "Host: portal.example.com" -H "Authorization: Bearer ${ADMIN_TOKEN}" \
      "http://${PORTAL_GW_ADDRESS}:8080/v1/apps/${APP_ID}/subscriptions" \
      | jq -r '[.[] | select(.apiProductId == "httpbin" and .approved)][0].id')
    [ -n "$SUBSCRIPTION_ID" ] && [ "$SUBSCRIPTION_ID" != "null" ] || { echo "FAIL: no approved subscription to httpbin for app $APP_ID"; exit 1; }
    resp=$(curl -s -w '\n%{http_code}' -X POST -H "Host: portal.example.com" -H "Authorization: Bearer ${ADMIN_TOKEN}" \
      -H "Content-Type: application/json" "http://${PORTAL_GW_ADDRESS}:8080/v1/subscriptions/${SUBSCRIPTION_ID}/metadata" \
      -d '{"rateLimit": {"requestsPerUnit": "5", "unit": "MINUTE"}}')
    echo "$resp"
    [ "$(echo "$resp" | tail -1)" = "200" ] || { echo "FAIL: setting the subscription rate limit did not return 200"; exit 1; }
    echo "$resp" | sed '$d' | jq -e '.metadata.rateLimit.requestsPerUnit == "5" and .metadata.rateLimit.unit == "MINUTE"' >/dev/null \
      || { echo "FAIL: the subscription does not report a rate limit of 5 per MINUTE"; exit 1; }
    # ExtAuth reads the limit from the same endpoint that validates the key.
    curl -s -G -H "Host: portal.example.com" "http://${PORTAL_GW_ADDRESS}:8080/v1/metadata" \
      --data-urlencode "apiKey=${API_KEY}" --data-urlencode "apiProductId=httpbin" \
      | jq -e '.allowed == true and .rateLimit.requestsPerUnit == "5" and .rateLimit.unit == "MINUTE"' >/dev/null \
      || { echo "FAIL: /v1/metadata does not return the subscription rate limit for the API key"; exit 1; }
    {{< /doc-test >}}
