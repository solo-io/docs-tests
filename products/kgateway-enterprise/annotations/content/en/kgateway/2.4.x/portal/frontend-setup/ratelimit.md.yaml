    {{< doc-test paths="portal-ratelimit" >}}
    # Stands in for the curl loop above (same line continuation problem as in
    # Step 1): with the subscription limit, 5 requests in a minute succeed and the
    # 6th gets a 429. ExtAuth caches credential lookups (cacheDuration: 10s), so
    # retry over a few rate limit windows.
    # Sends $1 requests with the API key at the start of a fresh rate limit
    # window (the rate limiter counts per calendar minute) and prints the codes.
    rl_window() {
      local s; s=$(date +%S); sleep $((61 - 10#$s))
      local codes=""
      for i in $(seq 1 "$1"); do
        codes="$codes $(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/httpbin/headers" -H "host: api.example.com" -H "api-key: ${API_KEY}")"
      done
      echo "${codes# }"
    }
    ok=0
    for attempt in 1 2 3 4; do
      codes=$(rl_window 6)
      echo "subscription limit, 6 requests in one minute: $codes"
      if [ "$codes" = "200 200 200 200 200 429" ]; then ok=1; break; fi
    done
    [ "$ok" = 1 ] || { echo "FAIL: expected 5 x 200 then 429 with the subscription limit of 5 per minute, got: $codes"; exit 1; }
    {{< /doc-test >}}
