    {{< doc-test paths="portal-ratelimit" >}}
    YAMLTest -f - <<'EOF'
    - name: "the ratelimit policy is accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
          metadata:
            namespace: default
            name: ratelimit
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
