  content: |-
    {{< doc-test paths="portal-cm-oauth" >}}
    # Wait until the portal controller re-renders the web server with the IdP
    # Connect URL and the new pod is rolled out.
    for i in $(seq 1 60); do
      ARGS=$(kubectl get deployment portal-my-portal -n default -o jsonpath='{.spec.template.spec.containers[0].args}')
      case "$ARGS" in *--idp-server-url=http://idp-connect.kgateway-system.svc.cluster.local:80*) break ;; esac
      sleep 5
    done
    case "$ARGS" in
      *--idp-server-url=http://idp-connect.kgateway-system.svc.cluster.local:80*) ;;
      *) echo "FAIL: the portal web server was not re-rendered with --idp-server-url"; exit 1 ;;
    esac
    kubectl rollout status deployment/portal-my-portal -n default --timeout=300s
    {{< /doc-test >}}
