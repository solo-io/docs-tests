  content: |-
    {{< doc-test paths="portal-cm-oauth" >}}
    # The httpbin-route HTTPRoute is attached to the portal gateway, so check the
    # request through that gateway.
    YAMLTest -f - <<'EOF'
    - name: "a request to the httpbin API without an access token is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
      source:
        type: local
      expect:
        statusCode: 403
    - name: "a request with a Basic Authorization header is denied with 403"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/httpbin/headers"
        method: GET
        headers:
          host: "api.example.com"
          Authorization: "Basic dXNlcjE6cGFzc3dvcmQ="
      source:
        type: local
      expect:
        statusCode: 403
    EOF
    {{< /doc-test >}}
