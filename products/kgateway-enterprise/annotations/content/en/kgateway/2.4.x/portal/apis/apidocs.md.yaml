    preview: helm upgrade -i portal \
  content: |-
    {{< doc-test paths="portal-apidocs" >}}
    YAMLTest -f - <<'EOF'
    - name: "the portal controller Deployment sets APIDOC_MAX_OPENAPI_VERSION to 3.1"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/portal-namespace.md" >}}
            name: portal-controller
        jsonPath: "$.spec.template.spec.containers[0].env[?(@.name=='APIDOC_MAX_OPENAPI_VERSION')].value"
        jsonPathExpectation:
          comparator: equals
          value: "3.1"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    kubectl rollout status deployment/portal-controller -n {{< reuse "kgw-docs/snippets/portal-namespace.md" >}} --timeout=300s
    {{< /doc-test >}}
