      wait:
        target:
          kind: ApiDoc
          metadata:
            namespace: default
            name: petstore-url-apidoc
        jsonPath: "$.status.conditions[?(@.type=='Ready')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
