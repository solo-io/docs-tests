      wait:
        target:
          kind: ApiDoc
          metadata:
            namespace: default
            name: petstore-apidoc
        jsonPath: "$.status.sourceOpenApiVersion"
        jsonPathExpectation:
          comparator: equals
          value: "3.0.0"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the manual petstore ApiDoc is converted to OpenAPI 3.1.0"
      wait:
        target:
          kind: ApiDoc
          metadata:
            namespace: default
            name: petstore-apidoc
        jsonPath: "$.status.resolvedOpenApiVersion"
        jsonPathExpectation:
          comparator: equals
          value: "3.1.0"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
