  content: |-
    {{< doc-test paths="portal-apidocs" >}}
    # CI sets only the Solo Enterprise for kgateway license, as LICENSE_KEY. The
    # portal controller only logs license problems, so reuse that key when no
    # portal license key is set.
    export PORTAL_LICENSE_KEY="${PORTAL_LICENSE_KEY:-$LICENSE_KEY}"
    {{< /doc-test >}}
- after:
