  content: |-
    {{< doc-test paths="portal-apidocs,portal-apidocs-kube" >}}
    YAMLTest -f - <<'EOF'
    - name: "the petstore Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: default
            name: petstore
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
