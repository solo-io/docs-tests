  content: |-
    {{< doc-test paths="portal-database" >}}
    # Wait until the controller re-renders the web server for the Postgres store
    # and the new pod is rolled out.
    for i in $(seq 1 60); do
      ARGS=$(kubectl get deployment portal-my-portal -n default -o jsonpath='{.spec.template.spec.containers[0].args}')
      case "$ARGS" in *--store-type=postgres*) break ;; esac
      sleep 5
    done
    kubectl get deployment portal-my-portal -n default -o jsonpath='{.spec.template.spec.containers[0].args}' | grep -- '--store-type=postgres'
    kubectl rollout status deployment/portal-my-portal -n default --timeout=300s
    {{< /doc-test >}}
