  content: |-
    {{< doc-test paths="portal-database" >}}
    # Stands in for the pgAdmin UI steps: the web server ran its schema
    # migrations, so the portal tables exist in the db database.
    TABLES=$(kubectl exec deployment/postgres -n default -- psql -U user -d db -tAc "select count(*) from information_schema.tables where table_schema='public'")
    echo "portal tables in Postgres: $TABLES"
    [ "$TABLES" -gt 0 ]
    YAMLTest -f - <<'EOF'
    - name: "the portal web server serves the API catalog from the Postgres store"
      retries: 60
      http:
        url: "http://${PORTAL_GW_ADDRESS}:8080/v1/api-products"
        method: GET
        headers:
          host: "portal.example.com"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "httpbin"
    EOF
    {{< /doc-test >}}
