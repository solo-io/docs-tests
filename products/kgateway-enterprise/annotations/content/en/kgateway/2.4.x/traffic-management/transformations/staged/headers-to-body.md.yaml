  content: |-
    {{< doc-test paths="staged-headers-to-body" >}}
    YAMLTest -f - <<'EOF'
    - name: "staged-headers-to-body - the root and nested header values are merged into the request body"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/post"
        method: POST
        headers:
          host: "www.example.com:8080"
          Content-Type: "application/json"
          root: "root-val"
          nested: "nested-val"
        body: |
          {"payload": {"foo": "bar"}}
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.json.root"
            comparator: equals
            value: 'root-val'
          - path: "$.json.payload.nested"
            comparator: equals
            value: 'nested-val'
          - path: "$.json.payload.foo"
            comparator: equals
            value: 'bar'
    EOF
    {{< /doc-test >}}
