  content: |-
    {{< doc-test paths="staged-append-headers" >}}
    YAMLTest -f - <<'EOF'
    - name: "staged-append-headers - the Set-Cookie request header has both appended values"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.headers['Set-Cookie'][0]"
            comparator: equals
            value: 'customcookie2=www.example.com:8080'
          - path: "$.headers['Set-Cookie'][1]"
            comparator: equals
            value: 'customcookie3=www.example.com:8080'
    EOF
    {{< /doc-test >}}
