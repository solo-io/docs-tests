  content: |-
    {{< doc-test paths="staged-extract-query-params" >}}
    YAMLTest -f - <<'EOF'
    - name: "staged-extract-query-params - the foo-request and bar-request headers hold the query parameter values"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything?foo=foo-value&bar=bar-value"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.headers['Foo-Request'][0]"
            comparator: equals
            value: 'foo-value'
          - path: "$.headers['Bar-Request'][0]"
            comparator: equals
            value: 'bar-value'
    EOF
    {{< /doc-test >}}
