    YAMLTest -f - <<'EOF'
    - name: "staged-extract-header - the x-account-solo request header holds the extracted account value"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com:8080"
          account: "abc123"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.headers['X-Account-Solo'][0]"
            comparator: equals
            value: 'account: abc123-solo'
    EOF
    {{< /doc-test >}}
