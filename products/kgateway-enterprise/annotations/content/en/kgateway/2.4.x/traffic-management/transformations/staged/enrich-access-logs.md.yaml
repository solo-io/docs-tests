  content: |-
    {{< doc-test paths="staged-enrich-access-logs" >}}
    YAMLTest -f - <<'EOF'
    - name: "staged-enrich-access-logs - the x-pod-name response header holds the gateway proxy pod name"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        headers:
          - name: x-pod-name
            comparator: matches
            value: "^http-"
    EOF
    {{< /doc-test >}}
- after:
    block: 2
    fingerprint: 4e84dcdef2af0e1f
    lang: sh
    lines: 4e84dcde
    preview: 'curl -i http://$INGRESS_GW_ADDRESS:8080/status/200 -H "host: www.example.com:808'
  content: |-
    {{< doc-test paths="staged-enrich-access-logs" >}}
    # Step 5: the access log entry for that request carries the same pod name. The
    # page pipes the last log line to jq, which fails under pipefail when the last
    # line is not JSON, so this finds the newest JSON entry for /status/200 instead.
    pod=""
    for i in $(seq 1 30); do
      pod=$(kubectl -n {{< reuse "kgw-docs/snippets/namespace.md" >}} logs deployments/http --since=10m 2>/dev/null \
        | grep '^{' | jq -r 'select(.path == "/status/200") | .pod_name' 2>/dev/null | tail -1) || true
      case "$pod" in http-*) break ;; esac
      echo "attempt $i: no access log entry with pod_name for /status/200 yet, retrying"; sleep 2
    done
    case "$pod" in
      http-*) echo "access log pod_name: $pod" ;;
      *) echo "FAIL: the access log entry for /status/200 has pod_name '$pod', want the http proxy pod name"; exit 1 ;;
    esac
    {{< /doc-test >}}
