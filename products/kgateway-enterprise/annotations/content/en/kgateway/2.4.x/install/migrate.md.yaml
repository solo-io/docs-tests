  content: |-
    {{< doc-test paths="migrate,migrate-canary" >}}
    # Start state for this guide: kgateway open source with the httpbin sample app,
    # installed the way the kgateway open source quick start and sample app guides do.
    # The open source version is v2.5.0: Solo Enterprise for kgateway 2.4.x is built on
    # kgateway 2.5 (the docs map 2.4.x to open source 2.5.x), so v2.5.0 is the open
    # source release whose CRDs the enterprise CRD chart replaces in step 1.
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{< reuse "kgw-docs/versions/k8s-gw-version.md" >}}/standard-install.yaml
    helm upgrade -i kgateway-crds oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds \
      --create-namespace --namespace kgateway-system \
      --version v2.5.0
    helm upgrade -i kgateway oci://cr.kgateway.dev/kgateway-dev/charts/kgateway \
      --namespace kgateway-system \
      --version v2.5.0
    YAMLTest -f - <<'EOF'
    - name: "migrate - the kgateway open source control plane is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    - name: "migrate - the kgateway GatewayClass is accepted"
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: kgateway
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    kubectl apply -f https://raw.githubusercontent.com/kgateway-dev/kgateway/refs/heads/{{< reuse "kgw-docs/versions/github-branch.md" >}}/examples/httpbin.yaml
    kubectl apply -f- <<EOF
    kind: Gateway
    apiVersion: gateway.networking.k8s.io/v1
    metadata:
      name: http
      namespace: kgateway-system
    spec:
      gatewayClassName: kgateway
      listeners:
      - protocol: HTTP
        port: 8080
        name: http
        allowedRoutes:
          namespaces:
            from: All
    EOF
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: httpbin
      namespace: httpbin
    spec:
      parentRefs:
        - name: http
          namespace: kgateway-system
      hostnames:
        - "www.example.com"
      rules:
        - backendRefs:
            - name: httpbin
              port: 8000
    EOF
    YAMLTest -f - <<'EOF'
    - name: "migrate - the httpbin sample app is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    - name: "migrate - the open source http Gateway is programmed"
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "migrate - the http gateway service has a load balancer address"
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.loadBalancer.ingress[0].ip"
        jsonPathExpectation:
          comparator: exists
          value: true
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "migrate - the httpbin HTTPRoute is accepted"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    export INGRESS_GW_ADDRESS=$(kubectl get svc -n kgateway-system http -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
    export OSS_GW_ADDRESS=$INGRESS_GW_ADDRESS
    YAMLTest -f - <<'EOF'
    - name: "migrate - the open source gateway proxy serves httpbin with a 200"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "www.example.com"
    EOF
    {{< /doc-test >}}
