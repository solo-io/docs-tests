  content: |-
    {{< doc-test paths="migrate" >}}
    # The curl pod on the page is interactive and runs until you stop it. Run the
    # same loop as a detached pod instead, and read its logs in step 4.
    kubectl run curl-test --image=curlimages/curl --restart=Never -- \
      sh -c '
      while true; do
        status=$(curl -s -o /dev/null -w "%{http_code}" http://http.kgateway-system.svc.cluster.local:8080/headers -H "host: www.example.com")
        if [ "$status" != "200" ]; then
          echo "ALERT: dropped request, got HTTP $status"
        fi
        sleep 0.25
      done
    '
    kubectl wait pod curl-test --for=condition=Ready --timeout=180s
    YAMLTest -f - <<'EOF'
    - name: "migrate - the curl-test pod reaches httpbin through the open source proxy without dropped requests"
      retries: 5
      command:
        command: "sleep 5; kubectl logs curl-test"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: "ALERT"
          negate: true
    EOF
    {{< /doc-test >}}
