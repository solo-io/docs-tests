            namespace: httpbin
            name: httpbin-ratelimit
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
- after:
    block: 11
    fingerprint: f79d8e2ca533e575
    lang: sh
    lines: f79d8e2c
    preview: 'curl -v http://$INGRESS_GW_ADDRESS:8080/status/200 -H "host: ratelimit.example:8'
  content: |-
    {{< doc-test paths="ratelimit-set-generic" >}}
    YAMLTest -f - <<'EOF'
    - name: "after the first request, more requests in the same window are rate limited with 429"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "ratelimit.example:8080"
      source:
        type: local
      expect:
        statusCode: 429
    - name: "after the rate limit window resets, the first request succeeds with 200"
      retries: 150
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "ratelimit.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
    - name: "the next request in the same window is rate limited with 429"
      retries: 10
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "ratelimit.example:8080"
      source:
        type: local
      expect:
        statusCode: 429
    EOF
    {{< /doc-test >}}
