  content: |-
    {{< doc-test paths="waf-overview" >}}
    YAMLTest -f - <<'EOF'
    - name: "the waf-body-limits traffic policy is accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
          metadata:
            namespace: httpbin
            name: waf-body-limits
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the waf-body-limits WAFPolicy is ready"
      wait:
        target:
          kind: WAFPolicy
          metadata:
            namespace: httpbin
            name: waf-body-limits
        jsonPath: "$.status.conditions[?(@.type=='Ready')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "a request through the waf-body-limits policy is allowed with 200"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
    - name: "a request with a small body is inspected and allowed with 200"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/post"
        method: POST
        headers:
          host: "www.example.com:8080"
          content-type: "application/json"
        body: |
          {"message": "hello"}
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
