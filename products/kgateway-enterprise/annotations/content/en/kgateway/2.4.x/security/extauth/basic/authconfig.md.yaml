    preview: HTTP/1.1 401 Unauthorized
  content: |-
    {{< doc-test paths="extauth-basic-authconfig" >}}
    YAMLTest -f - <<'EOF'
    - name: "extauth-basic-authconfig - a request without credentials is denied with 401 and the kgateway realm"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 401
        headers:
          - name: www-authenticate
            comparator: equals
            value: 'Basic realm="kgateway"'
    - name: "extauth-basic-authconfig - a request with a wrong password is denied with 401"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Basic dXNlcjp3cm9uZy1wYXNzd29yZA=="
      source:
        type: local
      expect:
        statusCode: 401
    EOF
    {{< /doc-test >}}
