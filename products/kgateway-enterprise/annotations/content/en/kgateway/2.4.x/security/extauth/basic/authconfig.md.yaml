  content: |-
    {{< doc-test paths="extauth-basic-authconfig" >}}
    # Test-only: the next step runs htpasswd. macOS ships it; on Linux it comes with apache2-utils.
    command -v htpasswd >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils; }
    {{< /doc-test >}}
- after:
    block: 1
    fingerprint: 5a1584769c3f8df6
    lang: console
    lines: 5a158476
    preview: user:$apr1$TYiryv0/$8BvzLUO9IfGPGGsPnAgSu1
  content: |-
    {{< doc-test paths="extauth-basic-authconfig" >}}
    YAMLTest -f - <<'EOF'
    - name: "extauth-basic-authconfig - htpasswd -nbm prints a salted APR1 entry for the user"
      command:
        command: "htpasswd -nbm user password"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          matches: '^user:\$apr1\$[^$]+\$[^$]+'
    - name: "extauth-basic-authconfig - the salt and hash on the page are the APR1 hash of the password"
      command:
        command: "openssl passwd -apr1 -salt 'TYiryv0/' password"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: '$apr1$TYiryv0/$8BvzLUO9IfGPGGsPnAgSu1'
    EOF
    {{< /doc-test >}}
