        jsonPath: "$.data.api-key"
        jsonPathExpectation:
          comparator: equals
          value: "TjJZd01ESXhaVEV0TkdVek5TMWpOemd6TFRSa1lqQXRZakUyWXpSa1pHVm1OamN5"
