    preview: kubectl get secret infra-apikey -n httpbin -oyaml
  content: |-
    {{< doc-test paths="extauth-apikey-raw" >}}
    YAMLTest -f - <<'EOF'
    - name: "secret infra-apikey has $.type equals extauth.solo.io/apikey"
      wait:
        target:
          kind: Secret
          metadata:
            namespace: httpbin
            name: infra-apikey
        jsonPath: "$.type"
        jsonPathExpectation:
          comparator: equals
          value: "extauth.solo.io/apikey"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: "secret infra-apikey has $.data.api-key equals TjJZd01ESXhaVEV0TkdVek5TMWpOemd6TFRSa1lqQXRZakUyWXpSa1pHVm1OamN5"
