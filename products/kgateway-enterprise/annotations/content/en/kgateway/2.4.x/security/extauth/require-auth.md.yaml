  content: |-
    {{< doc-test paths="require-auth" >}}
    # Replaces the step that saves the Helm values and opens them in an editor (step 1),
    # and adds the step 2 snippet to the saved values file without an editor.
    helm get values {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o yaml > values.yaml
    python3 - <<'PY'
    import yaml
    with open('values.yaml') as f:
        values = yaml.safe_load(f) or {}
    values.setdefault('controller', {}).setdefault('extraEnv', {})['KGW_ENABLE_AUTH_METADATA'] = 'true'
    with open('values.yaml', 'w') as f:
        yaml.safe_dump(values, f, default_flow_style=False)
    PY
    {{< /doc-test >}}
