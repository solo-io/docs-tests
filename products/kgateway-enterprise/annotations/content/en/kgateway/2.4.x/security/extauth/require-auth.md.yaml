- after:
    block: 3
    fingerprint: 5fba5f3bf561451f
    lang: sh
    lines: 5fba5f3b
    preview: kubectl get pods -n {{< reuse "kgw-docs/snippets/namespace.md" >}}
  content: |-
    {{< doc-test paths="require-auth" >}}
    YAMLTest -f - <<'EOF'
    - name: "the controller deployment sets KGW_ENABLE_AUTH_METADATA to true"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}
        jsonPath: "$.spec.template.spec.containers[0].env[?(@.name=='KGW_ENABLE_AUTH_METADATA')].value"
        jsonPathExpectation:
          comparator: equals
          value: "true"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the controller deployment is available after the upgrade"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
- after:
    block: 5
