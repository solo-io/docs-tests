  content: |-
    {{< doc-test paths="require-auth" >}}
    YAMLTest -f - <<'EOF'
    - name: "a request to the require-auth route without an auth policy is denied with 403"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/get"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 403
        bodyContains: "RBAC: access denied"
    EOF
    {{< /doc-test >}}
