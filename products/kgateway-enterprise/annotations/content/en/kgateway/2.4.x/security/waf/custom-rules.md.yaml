    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="waf-custom-rules" >}}
    YAMLTest -f - <<'EOF'
    - name: "the httpbin-waf traffic policy is accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
          metadata:
            namespace: httpbin
            name: httpbin-waf
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "the httpbin-waf WAFPolicy is ready"
      wait:
        target:
          kind: WAFPolicy
          metadata:
            namespace: httpbin
            name: httpbin-waf
        jsonPath: "$.status.conditions[?(@.type=='Ready')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
