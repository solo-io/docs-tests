  content: |-
    {{< doc-test paths="extauth-external-service" >}}
    # Step 1 points to the Static backend guide. These are that guide's Backend
    # and HTTPRoute for the static.example host.
    kubectl apply -f- <<EOF
    apiVersion: gateway.kgateway.dev/v1alpha1
    kind: Backend
    metadata:
      name: json-backend
    spec:
      type: Static
      static:
        hosts:
          - host: jsonplaceholder.typicode.com
            port: 80
    EOF
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: static-backend
      namespace: default
    spec:
      parentRefs:
      - name: http
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
      hostnames:
        - static.example
      rules:
        - backendRefs:
          - name: json-backend
            kind: Backend
            group: gateway.kgateway.dev
          filters:
          - type: URLRewrite
            urlRewrite:
              hostname: jsonplaceholder.typicode.com
    EOF
    YAMLTest -f - <<'EOF'
    - name: "extauth-external-service - the static backend serves /posts before auth is applied"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/posts"
        method: GET
        headers:
          host: "static.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
