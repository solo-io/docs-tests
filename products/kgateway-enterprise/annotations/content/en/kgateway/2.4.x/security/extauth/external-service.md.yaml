  content: |-
    {{< doc-test paths="extauth-external-service" >}}
    YAMLTest -f - <<'EOF'
    - name: "extauth-external-service - the basic-auth AuthConfig is accepted"
      wait:
        target:
          kind: AuthConfig
          metadata:
            namespace: httpbin
            name: basic-auth
        jsonPath: "$.status.state"
        jsonPathExpectation:
          comparator: equals
          value: "Accepted"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
