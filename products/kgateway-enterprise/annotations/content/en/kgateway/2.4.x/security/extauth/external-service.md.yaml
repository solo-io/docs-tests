  content: |-
    {{< doc-test paths="extauth-external-service" >}}
    # Step 2 points to the Basic auth guide. These are the AuthConfig and policy
    # from its AuthConfig option, which apply to every route on the http Gateway.
    kubectl apply -f- <<EOF
    apiVersion: extauth.solo.io/v1
    kind: AuthConfig
    metadata:
      name: basic-auth
      namespace: httpbin
    spec:
      configs:
        - basicAuth:
            apr:
              users:
                user:
                  hashedPassword: 8BvzLUO9IfGPGGsPnAgSu1
                  salt: TYiryv0/
            realm: kgateway
    EOF
    kubectl apply -f - <<EOF
    apiVersion: {{< reuse "kgw-docs/snippets/trafficpolicy-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
    metadata:
      name: basic-auth
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      targetRefs:
        - name: http
          group: gateway.networking.k8s.io
          kind: Gateway
      entExtAuth:
        authConfigRef:
          name: basic-auth
          namespace: httpbin
    EOF
    {{< /doc-test >}}
