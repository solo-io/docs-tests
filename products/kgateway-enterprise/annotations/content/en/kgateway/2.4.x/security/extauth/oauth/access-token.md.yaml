    preview: 'curl -i http://$INGRESS_GW_ADDRESS:8080/status/200 -H "host: www.example.com" \'
  content: |2-
       {{< doc-test paths="oauth-access-token" >}}
       test -n "$USER1_TOKEN" && [ "$USER1_TOKEN" != "null" ] || { echo "Keycloak returned no access token for user1"; exit 1; }
       YAMLTest -f - <<EOF
       - name: "oauth-access-token - a request with user1's access token succeeds"
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
           method: GET
           headers:
             host: "www.example.com"
             Authorization: "Bearer ${USER1_TOKEN}"
         source:
           type: local
         expect:
           statusCode: 200
       EOF
       {{< /doc-test >}}
