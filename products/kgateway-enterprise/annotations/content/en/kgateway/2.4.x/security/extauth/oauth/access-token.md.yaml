       YAMLTest -f - <<'EOF'
       - name: "oauth-access-token - a request without an access token is denied with 403"
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
           method: GET
           headers:
             host: "www.example.com"
         source:
           type: local
         expect:
           statusCode: 403
       EOF
       {{< /doc-test >}}
