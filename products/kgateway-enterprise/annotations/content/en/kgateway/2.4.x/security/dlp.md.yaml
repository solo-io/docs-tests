  content: |-
    {{< doc-test paths="dlp" >}}
    for i in $(seq 1 30); do
      curl -s -o /dev/null "http://$INGRESS_GW_ADDRESS:8080/status/200" -H "host: www.example.com:8080" -H "authorization: Bearer my-secret-token" || true
      sleep 2
      line=$(kubectl logs -n {{< reuse "kgw-docs/snippets/namespace.md" >}} deployment/http --tail=1)
      if [[ "$line" == *'"path":"/status/200"'* && "$line" == *'"authorization":"XXXX'* && "$line" != *'my-secret-token'* ]]; then
        echo "$line"
        break
      fi
      if [ "$i" -eq 30 ]; then
        echo "the authorization header is not masked in the access log: $line"
        exit 1
      fi
    done
    {{< /doc-test >}}
