    YAMLTest -f - <<'EOF'
    - name: "dlp - without DLP the card and SSN values are returned unmasked"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything?fakevisa=4397945340344828&ssn=123-45-6789"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.args.fakevisa[0]"
            comparator: equals
            value: "4397945340344828"
          - path: "$.args.ssn[0]"
            comparator: equals
            value: "123-45-6789"
    EOF
    {{< /doc-test >}}
