        - inline: |
            SecRuleRemoveById 913100
            SecRuleRemoveById 920430
    EOF
    kubectl apply -f- <<EOF
    apiVersion: enterprisekgateway.solo.io/v1alpha1
    kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
    metadata:
      name: httpbin-waf
      namespace: httpbin
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: httpbin
      entWAF:
        wafPolicyRef:
          name: httpbin-waf
    EOF
