- after:
    start: true
  content: |-
    {{< doc-test paths="waf-debug,waf-debug-pprof" >}}
    YAMLTest -f - <<'EOF'
    - name: "waf-debug - wait for the httpbin-waf WAFPolicy to be ready"
      wait:
        target:
          kind: WAFPolicy
          metadata:
            namespace: httpbin
            name: httpbin-waf
        jsonPath: "$.status.conditions[?(@.type=='Ready')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "waf-debug - wait for the httpbin-waf policy to be accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
          metadata:
            namespace: httpbin
            name: httpbin-waf
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "waf-debug - the WAF blocks a request for .htaccess with 403"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/.htaccess"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 403
    - name: "waf-debug - the WAF allows a regular request"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
