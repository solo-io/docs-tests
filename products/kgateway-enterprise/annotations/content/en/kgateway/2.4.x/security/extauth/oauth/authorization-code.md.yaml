      preview: open "http://www.example.com:8080/get"
  content: |-
    {{< doc-test paths="oauth-authorization-code" >}}
    YAMLTest -f - <<'EOF'
    - name: "oauth-authorization-code - a request without a session is redirected to the Keycloak login with the www.example.com:8080 callback"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/get"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 302
        headers:
          - name: location
            comparator: contains
            value: "/realms/master/protocol/openid-connect/auth?client_id="
          - name: location
            comparator: contains
            value: "redirect_uri=http%3A%2F%2Fwww.example.com%3A8080%2Fcallback"
    EOF
    # The browser steps (log in as user1, return to the app) done with curl: the
    # gateway at www.example.com:8080 resolves to INGRESS_GW_ADDRESS, and Keycloak
    # is reached at the KEYCLOAK_URL that the AuthConfig's issuerUrl uses.
    jar=$(mktemp)
    gw=(--resolve "www.example.com:8080:${INGRESS_GW_ADDRESS}")
    login=$(curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" "${gw[@]}" http://www.example.com:8080/get)
    case "$login" in "$KEYCLOAK_URL"/realms/master/*) ;; *) echo "FAIL: expected a redirect to $KEYCLOAK_URL, got '$login'"; exit 1 ;; esac
    action=$(curl -sS -c "$jar" -b "$jar" "$login" | grep -o 'action="[^"]*"' | head -1 | sed -e 's/^action="//' -e 's/"$//' -e 's/&amp;/\&/g')
    test -n "$action" || { echo "FAIL: the Keycloak login page has no form"; exit 1; }
    callback=$(curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" -d username=user1 -d password=password "$action")
    case "$callback" in http://www.example.com:8080/callback\?*) ;; *) echo "FAIL: Keycloak did not redirect to the callback, got '$callback'"; exit 1 ;; esac
    back=$(curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" "${gw[@]}" "$callback")
    test "$back" = "http://www.example.com:8080/get" || { echo "FAIL: the callback did not return to /get, got '$back'"; exit 1; }
    body=$(curl -sS -c "$jar" -b "$jar" "${gw[@]}" http://www.example.com:8080/get)
    echo "$body" | jq -e '.headers.Jwt[0] | startswith("ey")' >/dev/null \
      || { echo "FAIL: after login, /get does not show the ID token in the jwt header"; echo "$body" | head -20; exit 1; }
    echo "logged in as user1; httpbin received the ID token in the jwt header"
    {{< /doc-test >}}
