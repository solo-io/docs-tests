  content: |-
    {{< doc-test paths="customize-extensions-gomemlimit" >}}
    # The page says to point the GatewayClass at ext-params-gomemlimit the way
    # step 2 of Built-in customization does, with the name replaced.
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    spec:
      controllerName: solo.io/{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      parametersRef:
        group: {{< reuse "kgw-docs/snippets/gatewayparam-group.md" >}}
        kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
        name: ext-params-gomemlimit
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    EOF
    YAMLTest -f - <<'EOF'
    - name: "customize-extensions-gomemlimit - the ext-params-gomemlimit resource has an Accepted condition of True"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: ext-params-gomemlimit
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
