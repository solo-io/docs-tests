- after:
    block: 3
    fingerprint: 3b35e602154affb9
    lang: yaml
    lines: 36184fa5 9cc14d83 356067ee 3e196ba7 ff7360cf be80440e 36184fa5 a58565b2 36184fa5 04968f51 fef2806a 8db70061 3d49695e 162b7570
    preview: 'spec:'
  content: |-
    {{< doc-test paths="customize-extensions-env" >}}
    # The overlay on the page is a fragment of a resource; apply it as a full
    # resource and point the GatewayClass at it.
    kubectl apply -f- <<EOF
    apiVersion: {{< reuse "kgw-docs/snippets/gatewayparam-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
    metadata:
      name: ext-params
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      kube:
        sharedExtensions:
          extauth:
            enabled: true
            deploymentOverlay:
              spec:
                template:
                  spec:
                    containers:
                    - name: ext-auth-service
                      env:
                      - name: PRESERVE_UNSET_INJECTED_HEADERS
                        value: "true"
    EOF
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    spec:
      controllerName: solo.io/{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      parametersRef:
        group: {{< reuse "kgw-docs/snippets/gatewayparam-group.md" >}}
        kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
        name: ext-params
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    EOF
    YAMLTest -f - <<'EOF'
    - name: "customize-extensions-env - the ext-params resource has an Accepted condition of True"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: ext-params
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "customize-extensions-env - the ext-auth-service container has PRESERVE_UNSET_INJECTED_HEADERS set to true"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            labels:
              app: ext-auth-service
              gateway.solo.io/gatewayclass: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.items[0].spec.template.spec.containers[0].env[?(@.name=='PRESERVE_UNSET_INJECTED_HEADERS')].value"
        jsonPathExpectation:
          comparator: equals
          value: "true"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
