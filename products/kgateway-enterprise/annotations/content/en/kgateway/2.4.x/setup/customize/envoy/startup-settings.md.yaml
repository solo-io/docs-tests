    YAMLTest -f - <<'EOF'
    - name: "startup-settings - the last Envoy application log line is a JSON object with the message, time, logger, and level keys"
      retries: 30
      command:
        command: "kubectl logs deployment/startup-settings -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -c kgateway-proxy --tail=1 | jq -e 'has(\"message\") and has(\"time\") and has(\"logger\") and has(\"level\")'"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: "true"
    - name: "startup-settings - Envoy logged the starting workers message as JSON"
      retries: 30
      command:
        command: "kubectl logs deployment/startup-settings -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -c kgateway-proxy"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: '"message":"all dependencies initialized. starting workers"'
    EOF
    {{< /doc-test >}}
