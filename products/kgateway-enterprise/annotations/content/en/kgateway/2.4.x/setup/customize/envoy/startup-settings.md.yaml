  content: |-
    {{< doc-test paths="startup-settings" >}}
    YAMLTest -f - <<'EOF'
    - name: "startup-settings - the startup-params resource has an Accepted condition of True"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: startup-params
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "startup-settings - the ACCEPTED column of kubectl get ekgpar shows True"
      retries: 30
      command:
        command: "kubectl get ekgpar startup-params -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --no-headers"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          matches: '^startup-params\s+True'
    EOF
    {{< /doc-test >}}
