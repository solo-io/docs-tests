  content: |-
    {{< doc-test paths="startup-settings" >}}
    YAMLTest -f - <<'EOF'
    - name: "startup-settings - the startup-settings Gateway is programmed"
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: startup-settings
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "startup-settings - the startup-settings proxy Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: startup-settings
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
