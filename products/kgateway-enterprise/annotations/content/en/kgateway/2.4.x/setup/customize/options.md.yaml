  content: |-
    {{< doc-test paths="customize-options" >}}
    # Apply the GatewayClass and Gateway overlay examples from this section as
    # full resources: the GatewayClass parameters (gc-params) carry the GatewayClass
    # labels, and the Gateway parameters (my-gw-params) carry the Gateway labels.
    kubectl apply -f- <<EOF
    apiVersion: {{< reuse "kgw-docs/snippets/gatewayparam-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
    metadata:
      name: gc-params
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      kube:
        deploymentOverlay:
          metadata:
            labels:
              level: gc
              gc-only-label: from-gc
    ---
    apiVersion: {{< reuse "kgw-docs/snippets/gatewayparam-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
    metadata:
      name: my-gw-params
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      kube:
        deploymentOverlay:
          metadata:
            labels:
              level: gw
              gw-only-label: from-gw
    EOF
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
    spec:
      controllerName: solo.io/{{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      parametersRef:
        group: {{< reuse "kgw-docs/snippets/gatewayparam-group.md" >}}
        kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
        name: gc-params
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    EOF
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: options-gw
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      gatewayClassName: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      infrastructure:
        parametersRef:
          group: {{< reuse "kgw-docs/snippets/gatewayparam-group.md" >}}
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          name: my-gw-params
      listeners:
      - name: http
        protocol: HTTP
        port: 8080
    EOF
    YAMLTest -f - <<'EOF'
    - name: "customize-options - the options-gw proxy Deployment is available"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: options-gw
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "customize-options - the Gateway value wins for the conflicting level label"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: options-gw
        jsonPath: "$.metadata.labels.level"
        jsonPathExpectation:
          comparator: equals
          value: gw
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "customize-options - the GatewayClass-only label is preserved"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: options-gw
        jsonPath: "$.metadata.labels['gc-only-label']"
        jsonPathExpectation:
          comparator: equals
          value: from-gc
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "customize-options - the Gateway-only label is added"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: options-gw
        jsonPath: "$.metadata.labels['gw-only-label']"
        jsonPathExpectation:
          comparator: equals
          value: from-gw
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
