  content: |-
    {{< doc-test paths="customize-options" >}}
    YAMLTest -f - <<'EOF'
    - name: "customize-options - the Accepted condition status is True"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: my-gw-params
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "customize-options - the Accepted condition reason is Accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: my-gw-params
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
        jsonPathExpectation:
          comparator: equals
          value: Accepted
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "customize-options - the Accepted condition message is parameters accepted"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: my-gw-params
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].message"
        jsonPathExpectation:
          comparator: equals
          value: "parameters accepted"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "customize-options - Accepted is the only condition type"
      wait:
        target:
          kind: {{< reuse "kgw-docs/snippets/gatewayparameters.md" >}}
          metadata:
            namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
            name: my-gw-params
        jsonPath: "$.status.conditions.length"
        jsonPathExpectation:
          comparator: equals
          value: 1
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: "customize-options - observedGeneration matches metadata.generation"
      retries: 30
      command:
        command: |
          gen=$(kubectl get ekgpar my-gw-params -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath='{.metadata.generation}')
          obs=$(kubectl get ekgpar my-gw-params -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath='{.status.conditions[?(@.type=="Accepted")].observedGeneration}')
          echo "generation=$gen observedGeneration=$obs"
          [ -n "$gen" ] && [ "$gen" = "$obs" ]
      source:
        type: local
      expect:
        exitCode: 0
    EOF
    {{< /doc-test >}}
