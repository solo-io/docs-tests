    preview: kubectl get gateway -n kgateway-system && kubectl get httproute -n httpbin
  content: |-
    {{< doc-test paths="operations-go-client" >}}
    YAMLTest -f - <<'EOF'
    - name: "Gateway http-go is programmed"
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: http-go
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "HTTPRoute httpbin-go is accepted"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-go
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "HTTPRoute httpbin-go resolves its backend refs"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-go
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "deployment http-go has an available replica"
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: http-go
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "service http-go has a load balancer address"
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: http-go
        jsonPath: "$.status.loadBalancer.ingress[0]"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
