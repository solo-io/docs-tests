# Doc-test scenario definitions for the enterprise agentgateway docs, standalone mode.
#
# Built the same way as ../kubernetes/tests.yaml: a rebase shell copies its
# upstream twin's scenarios from ../../agentgateway/standalone/tests.yaml (same
# name and path; a twin keyed on source: becomes page: here, one scenario per
# shell that shows it). An enterprise-only page gets its own scenarios; a
# schema-only one is named `<page>-schema`.
#
# What differs from open source:
#
#   The binary. Upstream annotations install the open source binary through a
#            hidden reuse of agw-docs/snippets/install-agentgateway-binary.md.
#            The consuming site's assets/ shadow upstream ones, so its
#            workflow drops ./install-agentgateway-binary.md (next to this
#            file) into its own assets/ before the run, and every scenario
#            installs the enterprise binary instead, with no change to the
#            upstream annotations.
#   The license. The enterprise binary will not start without
#            ENTERPRISE_AGENTGATEWAY_LICENSE_KEY, which the workflow sets from
#            a secret. No annotation tags a block that exports a placeholder
#            for it.
#   The schema. Standalone config is checked against the enterprise
#            config.json at the release tag, not the open source one: it adds
#            the enterprise-only fields (license, entSts, purview, ...).
