# Doc-test scenario definitions for the enterprise agentgateway docs, kubernetes mode.
#
# Covers traffic-management: every kubernetes traffic-management scenario in
# ../../agentgateway/kubernetes/tests.yaml, minus the schema-only ones (the
# consuming site's workflow runs functional and live tests only).
#
# The consuming site publishes the enterprise docs from its own repo; almost
# every page there is a rebase shell,
# a stub whose whole body is one {{< rebase file="agw-docs/kubernetes/..." >}}
# line that the site expands from the open source agentgateway/website repo at
# build time.
#
# How that differs from ../../agentgateway/kubernetes/tests.yaml:
#
#   page:, never source:. A shell reuses nothing from its own assets/, so there
#            is no snippet to key on. The shell paths mirror the upstream page
#            paths one for one, so `page:` here is the same string as the
#            upstream scenario's page.
#   content_root: the consuming site lays content out as
#            content/en/agentgateway/<mode>/<version>/.
#
# The runner expands a shell from the upstream checkout given by
# --upstream-root, using the version map in --upstream-versions. The
# consuming site's own assets/ still SHADOW the upstream copies: that is the
# only place the enterprise install differs from open source (the get-started
# snippet adds the license key), so the install prerequisite below tests
# enterprise content even though its page is a shell.
#
# The consuming site keeps test markup out of its content, so its install
# snippet carries no paths= tags of its own. They come from
# ../annotations/assets/agw-docs/snippets/agentgateway/get-started.md.yaml, a
# test annotation attached to the site's checkout at test time: the snippet's
# runnable blocks are tagged `standard`, its license-key placeholder is left
# untagged so it never overwrites the CI secret, and install-standard-verify.sh
# runs after the last block. The upstream pages it rebases get theirs from
# products/agentgateway/annotations.
#
# Scenario names and paths are copied from the upstream manifest, so a
# scenario here and its open source twin select the same blocks. One deliberate
# difference: every scenario here needs install-standard, even where its twin
# needs install-experimental. The enterprise install snippet documents one
# channel (released build, standard Gateway API CRDs), tagged `standard`; it
# has no experimental path, so a scenario that asked for one
# would extract no install steps at all and fail for the wrong reason.
version: 1
mode: kubernetes
content_root: content/en/agentgateway
prerequisites:
  gateway:
    page: documentation/setup/gateway.md
    path: all
  httpbin:
    page: documentation/install/sample-app.md
    path: install-httpbin
  install-standard:
    page: documentation/quickstart/install.md
    path: standard
# Pages with deliberately no test: section indexes and concept pages, the same
# list as the upstream manifest's traffic-management skips.
skip:
- page: documentation/traffic-management/_index.md
- page: documentation/traffic-management/buffer.md
- page: documentation/traffic-management/header-control/_index.md
- page: documentation/traffic-management/load-balancing.md
- page: documentation/traffic-management/match/_index.md
- page: documentation/traffic-management/redirect/_index.md
- page: documentation/traffic-management/rewrite/_index.md
- page: documentation/traffic-management/route-delegation/_index.md
- page: documentation/traffic-management/route-delegation/inheritance/_index.md
- page: documentation/traffic-management/route-delegation/overview.md
- page: documentation/traffic-management/transformations/_index.md
- page: documentation/traffic-management/transformations/templating-language.md
