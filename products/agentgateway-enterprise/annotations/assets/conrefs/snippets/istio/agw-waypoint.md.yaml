       # The page leaves the namespace to the reader. Use a fixed one, create it, and
       # enroll it in the ambient mesh so that its workloads reach the waypoint.
       export NAMESPACE=agw-mesh
       kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
       kubectl label namespace ${NAMESPACE} istio.io/dataplane-mode=ambient --overwrite
       {{< /doc-test >}}
