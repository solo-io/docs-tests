  content: |2-
         {{< doc-test paths="integrations-agentic-mesh-waypoint-install" >}}
         # Claim: traffic to enrolled services flows through the agentgateway waypoint.
         # Deploy an app and a client in the enrolled namespace, confirm a request
         # succeeds, then attach a deny rule to the waypoint Gateway: a 403 on the
         # denied path can only come from the waypoint.
         kubectl apply -n ${NAMESPACE} -f - <<EOF
         apiVersion: v1
         kind: Service
         metadata:
           name: httpbin
           labels:
             app: httpbin
         spec:
           ports:
           - name: http
             port: 8000
             targetPort: 8080
           selector:
             app: httpbin
         ---
         apiVersion: apps/v1
         kind: Deployment
         metadata:
           name: httpbin
         spec:
           replicas: 1
           selector:
             matchLabels:
               app: httpbin
           template:
             metadata:
               labels:
                 app: httpbin
             spec:
               containers:
               - name: httpbin
                 image: docker.io/mccutchen/go-httpbin:v2.6.0
                 command: [go-httpbin]
                 args: ["-port", "8080"]
                 ports:
                 - containerPort: 8080
         EOF
         kubectl -n ${NAMESPACE} run waypoint-client --image=curlimages/curl --restart=Never -- sleep 3600
         kubectl -n ${NAMESPACE} rollout status deploy/httpbin --timeout=180s
         kubectl -n ${NAMESPACE} wait pod/waypoint-client --for=condition=Ready --timeout=180s
         code=""
         for i in $(seq 1 60); do
           code=$(kubectl -n ${NAMESPACE} exec waypoint-client -- curl -s -o /dev/null -m 5 -w '%{http_code}' http://httpbin:8000/get || true)
           [ "$code" = "200" ] && break
           sleep 2
         done
         [ "$code" = "200" ] || { echo "expected 200 from httpbin through the waypoint, got ${code}"; exit 1; }
         kubectl apply -f - <<EOF
         apiVersion: enterpriseagentgateway.solo.io/v1alpha1
         kind: EnterpriseAgentgatewayPolicy
         metadata:
           name: waypoint-probe-deny
           namespace: ${NAMESPACE}
         spec:
           targetRefs:
           - group: gateway.networking.k8s.io
             kind: Gateway
             name: agentgateway-waypoint
           traffic:
             authorization:
               action: Deny
               policy:
                 matchExpressions:
                 - 'request.path == "/anything/waypoint-probe"'
         EOF
         code=""
         for i in $(seq 1 60); do
           code=$(kubectl -n ${NAMESPACE} exec waypoint-client -- curl -s -o /dev/null -m 5 -w '%{http_code}' http://httpbin:8000/anything/waypoint-probe || true)
           [ "$code" = "403" ] && break
           sleep 2
         done
         [ "$code" = "403" ] || { echo "expected 403 from the waypoint deny rule, got ${code}"; exit 1; }
         ok=$(kubectl -n ${NAMESPACE} exec waypoint-client -- curl -s -o /dev/null -m 5 -w '%{http_code}' http://httpbin:8000/get || true)
         [ "$ok" = "200" ] || { echo "expected /get to stay 200 with the deny rule, got ${ok}"; exit 1; }
         kubectl -n ${NAMESPACE} delete enterpriseagentgatewaypolicy waypoint-probe-deny
         {{< /doc-test >}}
