       {{< doc-test paths="oauth-keycloak,oauth-keycloak-setup" >}}
       # The next step reads the LoadBalancer address, which cloud-provider-kind
       # assigns a few seconds after the Service exists.
       for i in $(seq 1 60); do
         ip=$(kubectl -n keycloak get service keycloak -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}')
         [ -n "$ip" ] && break; sleep 5
       done
       test -n "$ip" || { echo "keycloak Service got no LoadBalancer address"; exit 1; }
       # start-dev answers on the port a little after the rollout reports ready.
       for i in $(seq 1 60); do
         curl -fsS -o /dev/null "http://$ip:8080/realms/master/.well-known/openid-configuration" && break; sleep 5
       done
       {{< /doc-test >}}
