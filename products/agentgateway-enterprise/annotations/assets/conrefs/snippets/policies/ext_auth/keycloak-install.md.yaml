  content: |2-
       {{< doc-test paths="oauth-keycloak,oauth-keycloak-setup" >}}
       # ============================================================================
       # Doc test coverage for "Keycloak as an IdP" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Keycloak installs from the published manifest, gets a LoadBalancer
       #     address, and the admin password grant works.
       #   * The client registration, the redirect URI update, the `group` mapper, and
       #     both users succeed: the client secret is set, and user1 gets an access
       #     token through the direct access grant with that client ID and secret,
       #     which the access token and authorization code guides rely on.
       #   * "Configure Keycloak": TOKEN_ENDPOINT, the JWKS URI, and the JWKS keys are
       #     set to real values.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * "Open the Keycloak frontend" and the admin console checks: they need a
       #     browser. The Admin REST API checks below cover the same users and client.
       #   * The developer portal steps, which do not render for agentgateway.
       test -n "$KEYCLOAK_CLIENT" || { echo "client registration returned no client ID"; exit 1; }
       test -n "$KEYCLOAK_SECRET" && [ "$KEYCLOAK_SECRET" != "null" ] || { echo "client registration returned no secret"; exit 1; }
       ADMIN_TOKEN=$(curl -fsS -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" | jq -r .access_token)
       curl -fsS -H "Authorization: Bearer ${ADMIN_TOKEN}" "$KEYCLOAK_URL/admin/realms/master/users?username=user" \
         | jq -e '[.[].username] | index("user1") != null and index("user2") != null' >/dev/null \
         || { echo "user1 and user2 were not both created"; exit 1; }
       curl -fsS -d "client_id=${KEYCLOAK_CLIENT}" -d "client_secret=${KEYCLOAK_SECRET}" \
         -d "username=user1" -d "password=password" -d "grant_type=password" \
         "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
         | jq -e '.access_token | length > 0' >/dev/null \
         || { echo "user1 could not get a token with the registered client"; exit 1; }
       {{< /doc-test >}}
