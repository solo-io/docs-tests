  content: |2-
           {{< doc-test paths="oauth-keycloak,oauth-keycloak-setup" >}}
           # The visible steps copy these values from a browser and use placeholders.
           # Read the real values from the realm's OpenID configuration instead.
           export KEYCLOAK_JWKS_URI=$(curl -fsS "$KEYCLOAK_URL/realms/master/.well-known/openid-configuration" | jq -r .jwks_uri)
           test "$(curl -fsS "$KEYCLOAK_URL/realms/master/.well-known/openid-configuration" | jq -r .token_endpoint)" = "$TOKEN_ENDPOINT" \
             || { echo "TOKEN_ENDPOINT does not match the realm's token_endpoint"; exit 1; }
           export KEYCLOAK_CERT_KEYS=$(curl -fsS "$KEYCLOAK_JWKS_URI" | jq -c .)
           echo "$KEYCLOAK_CERT_KEYS" | jq -e '.keys | map(select(.use == "sig")) | length > 0' >/dev/null \
             || { echo "the realm JWKS has no signing key"; exit 1; }
           {{< /doc-test >}}
