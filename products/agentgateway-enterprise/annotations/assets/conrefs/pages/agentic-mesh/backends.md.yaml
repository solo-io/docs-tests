  content: |2-
       {{< doc-test paths="integrations-agentic-mesh-waypoint-backends" >}}
       # Claim: the authorized pod reaches the provider. With the placeholder key,
       # OpenAI itself answers 401; anything but 403 (the waypoint), 400 (agentgateway
       # could not parse the request), or 000/5xx (no upstream) shows the request went
       # through the backend.
       code=""
       for i in $(seq 1 30); do
         code=$(kubectl exec -n ${NAMESPACE} curl-auth -- curl -s -o /dev/null -m 15 -w '%{http_code}' http://myllm.example.com/openai -H 'content-type: application/json' -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}' || true)
         case "$code" in 2??|401|404) break ;; esac
         sleep 2
       done
       case "$code" in
         2??|401|404) ;;
         *) echo "expected an answer from the provider (2xx, 401, or 404) for curl-auth, got ${code}"; exit 1 ;;
       esac
       {{< /doc-test >}}
