  blank_before: []
  content: |2-
       {{< doc-test paths="integrations-agentic-mesh-egress" >}}
       # Claim: the authorized pod reaches OpenAI. Without an API key OpenAI answers
       # 401; a 403 means the waypoint blocked the request, and a 000 or 5xx means the
       # waypoint did not reach OpenAI over TLS.
       code=""
       for i in $(seq 1 30); do
         code=$(kubectl exec -n ${NAMESPACE} curl-auth -- curl -s -o /dev/null -m 15 -w '%{http_code}' -X POST http://api.openai.com/v1/chat/completions -H 'content-type: application/json' -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}' || true)
         case "$code" in 2??|401) break ;; esac
         sleep 2
       done
       case "$code" in
         2??|401) ;;
         *) echo "expected an answer from OpenAI (2xx or 401) for curl-auth, got ${code}"; exit 1 ;;
       esac
       {{< /doc-test >}}
