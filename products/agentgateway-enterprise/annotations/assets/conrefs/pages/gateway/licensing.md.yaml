    {{< doc-test paths="enterprise-licensing" >}}
    kubectl get secret {{< reuse "kgw-docs/snippets/pod-name.md" >}}-license -n {{< reuse "kgw-docs/snippets/namespace.md" >}} \
      -o jsonpath="{.data.{{< reuse "kgw-docs/snippets/pod-name.md" >}}-license-key}" | base64 --decode > license.jwt
    python3 - <<'EOF'
    import base64, json
    parts = open("license.jwt").read().strip().split(".")
    claims = None
    for seg in parts[:2]:
        try:
            claims = json.loads(base64.urlsafe_b64decode(seg + "=" * (-len(seg) % 4)))
        except Exception:
            continue
        if isinstance(claims, dict) and "exp" in claims:
            break
    assert isinstance(claims, dict) and "exp" in claims and claims.get("product") == "agentgateway", "license claims not found"
    print("license product:", claims["product"], "exp:", claims["exp"])
    EOF
    {{< /doc-test >}}
