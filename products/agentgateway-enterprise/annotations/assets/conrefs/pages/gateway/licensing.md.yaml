  content: |-
    {{< doc-test paths="enterprise-licensing" >}}
    # ============================================================================
    # Doc test coverage for "Licensing" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Provide key directly": the Enterprise license helm upgrade with
    #     licensing.licenseKey creates the enterprise-agentgateway-license secret.
    #   * "Provide key in a secret": after a hidden uninstall of the controller, the
    #     page's secret is applied and the controller installs with
    #     licensing.secretName / createSecret=false and reads that secret.
    #   * "Update the license": the secret is re-created with the same key, the
    #     controller restarts, and its logs have no `license validation failed`.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The Trial license tab: same command with a trial key; CI has one key.
    #   * "Check the license values": a hidden Python decode replaces the visible
    #     base64 pipeline, which can fail on unpadded JWT segments under pipefail.
    #   * Restarting enterprise-agentgateway-ui: the UI is not installed here.
    # The page uses $LICENSE_KEY; CI provides AGENTGATEWAY_LICENSE_KEY.
    export LICENSE_KEY="${AGENTGATEWAY_LICENSE_KEY}"
    {{< /doc-test >}}
