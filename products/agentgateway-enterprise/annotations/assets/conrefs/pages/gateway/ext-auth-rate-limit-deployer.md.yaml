       {{< doc-test paths="shared-extensions-deployer" >}}
       # Extensions exist only while a Gateway uses the class, and the shared setup deleted
       # the `http` Gateway. Create a test Gateway so that the new resources roll out.
       kubectl apply -f- <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: Gateway
       metadata:
         name: doc-test-extensions
         namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
       spec:
         gatewayClassName: {{< reuse "/kgw-docs/snippets/gatewayclass.md" >}}
         listeners:
         - protocol: HTTP
           port: 8080
           name: http
       EOF
       for attempt in $(seq 1 60); do
         got=$(kubectl get deployment -l app=rate-limiter,gateway.solo.io/gatewayclass={{< reuse "/kgw-docs/snippets/gatewayclass.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath='{.items[0].spec.template.spec.containers[0].resources.limits.cpu}' 2>/dev/null || true)
         if [ "$got" = "750m" ]; then break; fi
         sleep 3
       done
       if [ "$got" != "750m" ]; then echo "rate-limiter CPU limit: expected 750m, got $got"; exit 1; fi
       for attempt in $(seq 1 60); do
         got=$(kubectl get deployment -l app=ext-cache,gateway.solo.io/gatewayclass={{< reuse "/kgw-docs/snippets/gatewayclass.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath='{.items[0].spec.template.spec.containers[0].resources.limits.memory}' 2>/dev/null || true)
         if [ "$got" = "2Gi" ]; then break; fi
         sleep 3
       done
       if [ "$got" != "2Gi" ]; then echo "ext-cache memory limit: expected 2Gi, got $got"; exit 1; fi
       echo "the extension Deployments use the new requests and limits"
       {{< /doc-test >}}
