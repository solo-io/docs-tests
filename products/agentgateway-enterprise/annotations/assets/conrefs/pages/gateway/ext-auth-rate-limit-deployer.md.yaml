  content: |2-
       {{< doc-test paths="shared-extensions-deployer" >}}
       # ============================================================================
       # Doc test coverage for the shared extensions deployer (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Shared setup": creating the `http` Gateway provisions the ext-auth-service,
       #     rate-limiter, and ext-cache Deployments for the default GatewayClass, and
       #     deleting the Gateway leaves them for the prerequisite agentgateway-proxy
       #     Gateway, which uses the same class.
       #   * "Dedicated setup": a Gateway on a custom GatewayClass gets its own set of the
       #     three Deployments, and deleting the Gateway and class removes them.
       #   * "Update resource requests and limits": the parameters resource and GatewayClass
       #     update apply, and the Deployments roll out with the documented resources.
       #   * "Disable the deployer": after the GatewayClass references the disabling
       #     parameters resource, no extension Deployments remain for the class.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The Gloo Gateway and kgateway variants: not rendered for agentgateway.
       # ext_deployments CLASS: names of the extension Deployments for a GatewayClass, in any namespace.
       ext_deployments() {
         kubectl get deployments -A -l "app in (ext-auth-service,rate-limiter,ext-cache),gateway.solo.io/gatewayclass=$1" -o name
       }
       # wait_count CLASS N: poll until the class has exactly N extension Deployments.
       wait_count() {
         for attempt in $(seq 1 60); do
           n=$(ext_deployments "$1" | wc -l | tr -d ' ')
           if [ "$n" = "$2" ]; then echo "$1 has $n extension Deployments"; return 0; fi
           sleep 3
         done
         echo "$1: expected $2 extension Deployments, found $n"; ext_deployments "$1"; return 1
       }
       {{< /doc-test >}}
