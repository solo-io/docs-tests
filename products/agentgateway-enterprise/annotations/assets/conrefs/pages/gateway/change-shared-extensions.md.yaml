    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="change-shared-extensions" >}}
       # ============================================================================
       # Doc test coverage for customizing shared extensions (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Built-in customization": the parameters resource and the GatewayClass update
       #     apply, and the ext-auth-service, rate-limiter, and ext-cache Deployments roll
       #     out with the documented requests and limits.
       #   * "Overlays": the overlay applies, and the Deployments get the documented labels
       #     and pod template annotations.
       #   * Cleanup runs.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The kgateway variants of the examples: they are not rendered for agentgateway.
       # wait_field APP JSONPATH VALUE: poll until the Deployment with label app=APP has VALUE.
       wait_field() {
         for attempt in $(seq 1 60); do
           got=$(kubectl get deployment -l app="$1" -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath="{.items[0]$2}" 2>/dev/null || true)
           if [ "$got" = "$3" ]; then echo "$1 $2 = $3"; return 0; fi
           sleep 3
         done
         echo "$1 $2: expected $3, got $got"; return 1
       }
       {{< /doc-test >}}
