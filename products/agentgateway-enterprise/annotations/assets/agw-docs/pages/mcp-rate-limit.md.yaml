       {{< doc-test paths="mcp-rate-limit-enterprise" >}}
       for i in $(seq 1 30); do
         curl -s -o /tmp/mcp-burst-$i -w "%{http_code}\n" "$MCP_URL" \
           -H "content-type: application/json" -H "accept: application/json, text/event-stream" \
           -d "$INIT" > /tmp/mcp-burst-status-$i &
       done
       wait
       limited=0
       for i in $(seq 1 30); do
         if grep -q '^429$' /tmp/mcp-burst-status-$i || grep -qi "rate limit exceeded" /tmp/mcp-burst-$i; then limited=$((limited + 1)); fi
       done
       echo "$limited of 30 burst requests were rate limited"
       if [ "$limited" -eq 0 ]; then echo "the local MCP rate limit was never enforced"; exit 1; fi
       # Let the token bucket refill before the next section.
       sleep 5
       {{< /doc-test >}}
