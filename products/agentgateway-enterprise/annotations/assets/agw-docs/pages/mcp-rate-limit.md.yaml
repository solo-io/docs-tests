  content: |2-
       {{< doc-test paths="mcp-rate-limit-enterprise" >}}
       # ============================================================================
       # Doc test coverage for the MCP rate limiting guide (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Local rate limiting": the local policy on the `mcp` HTTPRoute is accepted, and a
       #     burst of 30 parallel MCP requests is rate limited (HTTP 429, or the JSON-RPC
       #     "rate limit exceeded" response that newer versions return with HTTP 200).
       #   * "Per-tool rate limits": the RateLimitConfig and the policy are accepted; in one
       #     window, 3 tools/call requests for trigger-long-running-operation pass the rate
       #     limit, the 4th is rate limited, and 5 echo calls are not rate limited.
       #   * Cleanup runs.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The MCP Inspector loops. They need npx and the `echo` and
       #     `trigger-long-running-operation` tools, which the prerequisite server
       #     (mcp-website-fetcher, one `fetch` tool) does not have. The same JSON-RPC
       #     requests are sent with curl. The rate limit runs in the gateway, before the
       #     server sees the tool name, so the counters work the same for unknown tools.
       #   * The tool results themselves: the server answers unknown tools with an error.
       MCP_URL="http://${INGRESS_GW_ADDRESS}:80/mcp"
       # mcp_post SESSION BODY: writes the body to /tmp/mcp-body, the headers to
       # /tmp/mcp-headers, and prints the HTTP status.
       mcp_post() {
         curl -s -D /tmp/mcp-headers -o /tmp/mcp-body -w "%{http_code}" "$MCP_URL" \
           -H "content-type: application/json" -H "accept: application/json, text/event-stream" \
           ${1:+-H "mcp-session-id: $1"} -d "$2"
       }
       INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"doc-test","version":"1.0"}}}'
       call_body() { printf '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"%s","arguments":{}}}' "$1"; }
       rate_limited() { [ "$1" = "429" ] || grep -qi "rate limit exceeded" /tmp/mcp-body; }
       YAMLTest -f - <<'EOF'
       - name: the mcp-rate-limit policy is accepted
         wait:
           target:
             kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
             metadata:
               namespace: default
               name: mcp-rate-limit
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
