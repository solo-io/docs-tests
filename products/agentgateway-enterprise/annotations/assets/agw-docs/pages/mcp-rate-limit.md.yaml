       {{< doc-test paths="mcp-rate-limit-enterprise" >}}
       # Open one session; initialize is not counted by the per-tool limit.
       mcp_post "" "$INIT" > /dev/null
       SESSION=$(grep -i '^mcp-session-id:' /tmp/mcp-headers | awk '{print $2}' | tr -d '\r' || true)
       mcp_post "$SESSION" '{"jsonrpc":"2.0","method":"notifications/initialized"}' > /dev/null
       # Wait until the limit is enforced, with a tool name that no other check uses.
       enforced=""
       for attempt in $(seq 1 45); do
         if rate_limited "$(mcp_post "$SESSION" "$(call_body doc-test-probe)")"; then enforced=yes; break; fi
         sleep 2
       done
       if [ -z "$enforced" ]; then echo "the per-tool rate limit was never enforced"; exit 1; fi
       # Start a fresh one-minute window, then 3 calls pass and the 4th is limited.
       sleep $((61 - 10#$(date +%S)))
       for i in 1 2 3; do
         if rate_limited "$(mcp_post "$SESSION" "$(call_body trigger-long-running-operation)")"; then
           echo "trigger-long-running-operation call $i was rate limited too early"; cat /tmp/mcp-body; exit 1
         fi
       done
       if ! rate_limited "$(mcp_post "$SESSION" "$(call_body trigger-long-running-operation)")"; then
         echo "trigger-long-running-operation call 4 was not rate limited"; cat /tmp/mcp-body; exit 1
       fi
       for i in 1 2 3 4 5; do
         if rate_limited "$(mcp_post "$SESSION" "$(call_body echo)")"; then
           echo "echo call $i was rate limited, but echo has its own counter"; cat /tmp/mcp-body; exit 1
         fi
       done
       echo "per-tool limits: 3 trigger-long-running-operation calls passed, the 4th was limited, 5 echo calls passed"
       {{< /doc-test >}}
