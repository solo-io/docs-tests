- after:
    block: 10
    fingerprint: dcbd0fee62644594
    lang: sh
    lines: dcbd0fee
    preview: kubectl get eagbud,ratelimitconfig -n {{< reuse "agw-docs/snippets/namespace.md"
  content: |2-
       {{< doc-test paths="budget-limits-enterprise" >}}
       # Both budgets compile into controller-managed RateLimitConfigs.
       kubectl get ratelimitconfig -n agentgateway-system -o name | grep -q 'agw-budget-global-'
       kubectl get ratelimitconfig -n agentgateway-system -o name | grep -q 'agw-budget-per-key-budgets-'
       # Probe the route WITHOUT an API key: the policy answers 401 once the route,
       # the policy, and the proxy are programmed, and the probe spends no budget.
       YAMLTest -f - <<'EOF'
       - name: the httpbun route is programmed and requires an API key
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: /v1/chat/completions
           method: POST
           headers:
             host: openai.example.com
             content-type: application/json
           body: |
             {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hi"}]}
         source:
           type: local
         retries: 30
         expect:
           statusCode: 401
       EOF
       # Give the rate limit server a moment to load the compiled budget descriptors.
       sleep 10
       {{< /doc-test >}}
