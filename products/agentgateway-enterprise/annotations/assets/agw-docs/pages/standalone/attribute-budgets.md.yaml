  content: |-
    {{< doc-test paths="attribute-budgets" >}}
    code=$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/v1/chat/completions \
      -H "content-type: application/json" \
      -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Hello"}]}')
    [ "$code" = "200" ] || { echo "expected 200, got $code"; cat agw.log; exit 1; }
    # Block: same config with a 1-token limit and a fresh database.
    kill $AGW_PID; wait $AGW_PID 2>/dev/null || true
    python3 - <<'PY'
    import pathlib
    src = pathlib.Path("config-mock.yaml").read_text()
    assert "amount: 100000" in src and "sqlite://./data.db" in src
    src = src.replace("amount: 100000", "amount: 1").replace("sqlite://./data.db", "sqlite://./data-block.db")
    pathlib.Path("config-block.yaml").write_text(src)
    PY
    rm -f data-block.db
    agentgateway -f config-block.yaml > agw.log 2>&1 &
    AGW_PID=$!
    for _ in $(seq 1 30); do curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && break; sleep 1; done
    curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready || { echo "agentgateway did not become ready within 30 s"; cat agw.log; exit 1; }
    # max_tokens makes the mock LLM report 5 completion tokens, well over the 1-token limit.
    send() {
      curl -s -o /dev/null -w '%{http_code}' localhost:4000/v1/chat/completions \
        -H "content-type: application/json" \
        -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Hello"}],"max_tokens":5}'
    }
    first=$(send)
    [ "$first" = "200" ] || { echo "first request under the budget: expected 200, got $first"; exit 1; }
    # Usage is charged after the response, so poll for the rejection.
    for _ in $(seq 1 10); do
      code=$(send); [ "$code" = "429" ] && break; sleep 1
    done
    [ "$code" = "429" ] || { echo "expected 429 once the token budget is used up, got $code"; cat agw.log; exit 1; }
    {{< /doc-test >}}
