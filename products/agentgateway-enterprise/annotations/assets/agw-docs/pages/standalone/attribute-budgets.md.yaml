  content: |-
    {{< doc-test paths="attribute-budgets" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Set a token budget per model": the config (SQLite database + per-model
    #     Tokens budget) passes --validate-only and serves a request (200).
    #   * onBudgetExceeded: Block: a copy of the same config with the limit lowered
    #     to 1 token lets the first request through, charges it after the response,
    #     and rejects the next matching request with 429.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Real OpenAI usage: a local mock LLM stands in (no provider key or spend).
    #   * "Set a budget per group": it needs API keys or JWTs with groups; its
    #     config is covered by the schema check only.
    #   * The UI Budgets page: browser only.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    export OPENAI_API_KEY=mock-key
    {{< /doc-test >}}
