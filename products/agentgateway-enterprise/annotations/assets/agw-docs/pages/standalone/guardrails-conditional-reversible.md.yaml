  content: |-
    {{< doc-test paths="conditional-reversible" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Run a guard conditionally": the config validates; without the
    #     x-guardrail header the request reaches the LLM (200), with
    #     x-guardrail: strict the regex guard rejects it (403).
    #   * "Restore masked values": the LLM receives a unique placeholder instead
    #     of the email address, and the client gets the original address back.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Real OpenAI: a local echo LLM stands in, which repeats the placeholder
    #     exactly (a real model might not).
    #   * The Troubleshoot table's error messages.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}

    # Test-only stand-in for the LLM: echoes the last user message back as the
    # completion and logs each request body, so the test can check both what the
    # LLM received (placeholders) and what the client got back (restored values).
    cat > echo-llm.py <<'PY'
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            raw = self.rfile.read(int(self.headers.get("content-length") or 0)) or b"{}"
            with open("echo-llm-requests.log", "ab") as f:
                f.write(raw + b"\n")
            req = json.loads(raw)
            text = next((m.get("content") for m in reversed(req.get("messages", [])) if m.get("role") == "user"), "")
            if not isinstance(text, str):
                text = json.dumps(text)
            body = json.dumps({"id": "chatcmpl-echo", "object": "chat.completion", "created": 0,
                "model": req.get("model", "mock"),
                "choices": [{"index": 0, "finish_reason": "stop", "message": {"role": "assistant", "content": text}}],
                "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *args):
            pass
    HTTPServer(("127.0.0.1", 3091), Handler).serve_forever()
    PY
    python3 echo-llm.py &
    MOCK_LLM_PID=$!
    for _ in $(seq 1 20); do curl -sf -o /dev/null -m 2 -X POST http://localhost:3091 -d '{}' && break; sleep 1; done \
      || { echo "echo LLM did not start within 20 s"; exit 1; }

    export OPENAI_API_KEY=mock-key
    {{< /doc-test >}}
