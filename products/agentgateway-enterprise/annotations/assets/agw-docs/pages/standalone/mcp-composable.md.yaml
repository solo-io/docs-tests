  content: |-
    {{< doc-test paths="composable" >}}
    # "Combine both sections into one configuration file" (Steps 1 and 2 as written).
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    backends:
    - name: github-api
      host: api.github.com:443
      policies:
        backendTLS: {}
    mcp:
      targets:
      - name: github-summary
        custom:
          description: "Fetch a GitHub user's public profile and list a few of their repositories."
          inputSchema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                description: "GitHub username"
          steps:
          - http:
              name: user
              backend: /github-api
              method: GET
              path: '"/users/" + input.name'
              headers:
              - name: User-Agent
                value: '"agentgateway-composable-mcp"'
              - name: Accept
                value: '"application/vnd.github+json"'
          - http:
              name: repos
              backend: /github-api
              method: GET
              path: '"/users/" + input.name + "/repos?per_page=5"'
              headers:
              - name: User-Agent
                value: '"agentgateway-composable-mcp"'
              - name: Accept
                value: '"application/vnd.github+json"'
          output: |
            "Hello " + output.user.login
            + "! You have " + string(output.user.public_repos) + " public repos."
            + " A few of them: " + output.repos.map(r, r.name).join(", ") + "."
    EOF
    {{< /doc-test >}}
