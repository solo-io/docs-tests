  content: |-
    {{< doc-test paths="composable" >}}
    # Point the backend at the local stand-in (plaintext) for the run.
    python3 - <<'PY'
    import pathlib
    src = pathlib.Path("config.yaml").read_text()
    old = "  host: api.github.com:443\n  policies:\n    backendTLS: {}\n"
    assert old in src, "backend block changed; update the composable doc test"
    pathlib.Path("config-local.yaml").write_text(src.replace(old, "  host: localhost:3093\n"))
    PY
    agentgateway --validate-only -f config-local.yaml
    agentgateway -f config-local.yaml > agw.log 2>&1 &
    AGW_PID=$!
    trap 'kill $AGW_PID $GH_PID 2>/dev/null' EXIT
    for _ in $(seq 1 30); do
      curl -s -o /dev/null -m 2 -w '%{http_code}' http://localhost:3000/mcp -X POST \
        -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
        -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' \
        | grep -q 200 && break
      sleep 1
    done
    {{< /doc-test >}}
