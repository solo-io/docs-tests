  content: |-
    {{< doc-test paths="composable" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Steps 1-2 combined: the github-api backend and the custom target pass
    #     --validate-only exactly as written (TLS backend to api.github.com).
    #   * Step 4: the composite tool is listed by tools/list and a tools/call runs
    #     both HTTP steps and returns the CEL output sentence built from them.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The live GitHub API: unauthenticated calls are rate limited per IP, so a
    #     local stand-in serves the two endpoints, and the backend is pointed at it
    #     (plaintext, no backendTLS) in a derived copy of the config.
    #   * The MCP step reference example (fragment only).
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    # Test-only stand-in for the two GitHub API endpoints the steps call.
    cat > github-standin.py <<'PY'
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    DATA = {
        "/users/octocat": {"login": "octocat", "public_repos": 8},
        "/users/octocat/repos?per_page=5": [{"name": "Hello-World"}, {"name": "linguist"}],
    }
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path not in DATA:
                self.send_response(404); self.end_headers(); return
            body = json.dumps(DATA[self.path]).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *args):
            pass
    HTTPServer(("127.0.0.1", 3093), Handler).serve_forever()
    PY
    python3 github-standin.py &
    GH_PID=$!
    for _ in $(seq 1 20); do curl -sf -o /dev/null -m 2 http://localhost:3093/users/octocat && break; sleep 1; done \
      || { echo "GitHub stand-in did not start"; exit 1; }
    {{< /doc-test >}}
