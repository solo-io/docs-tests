  content: |-
    {{< doc-test paths="ui-access-control" >}}
    # Test setup: the enterprise image (a bare binary is not a documented
    # enterprise install), test users signed by a local JWKS, and the full
    # configuration that this page builds from its fragments.
    AGW_IMAGE="{{< reuse "agw-docs/standalone/image-ref.md" >}}:{{< reuse "agw-docs/versions/image-tag.md" >}}"
    : "${AGENTGATEWAY_LICENSE_KEY:?set AGENTGATEWAY_LICENSE_KEY to an enterprise agentgateway license key}"
    RBAC_TEST_DIR="$(mktemp -d)"
    cd "$RBAC_TEST_DIR"
    openssl genrsa -out key.pem 2048 2>/dev/null
    python3 - <<'PY'
    import base64, json, subprocess, time
    def b64(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    mod = subprocess.check_output(["openssl", "rsa", "-in", "key.pem", "-noout", "-modulus"]).decode().strip().split("=")[1]
    json.dump({"keys": [{"kty": "RSA", "alg": "RS256", "use": "sig", "kid": "k1", "n": b64(bytes.fromhex(mod)), "e": "AQAB"}]}, open("jwks.json", "w"))
    def token(claims):
        head = b64(json.dumps({"alg": "RS256", "typ": "JWT", "kid": "k1"}).encode())
        claims = dict(iss="https://idp.example.com", aud="agw-ui", exp=int(time.time()) + 3600, **claims)
        body = b64(json.dumps(claims).encode())
        sig = subprocess.run(["openssl", "dgst", "-sha256", "-sign", "key.pem"], input=f"{head}.{body}".encode(), capture_output=True, check=True).stdout
        return f"{head}.{body}.{b64(sig)}"
    users = {
        "ADMIN": {"sub": "u1", "email": "pat@example.com", "groups": ["platform-admins"]},
        "AUDITOR": {"sub": "u2", "email": "al@example.com", "groups": ["auditors"]},
        "DEVELOPER": {"sub": "u3", "email": "carol@example.com", "groups": ["developers"]},
        "ALICE": {"sub": "u4", "email": "alice@example.com"},
        "NOBODY": {"sub": "u5", "email": "x@other.example.com", "groups": ["others"]},
    }
    with open("tokens.env", "w") as f:
        for name, claims in users.items():
            f.write(f"TOKEN_{name}={token(claims)}\n")
    PY
    set -a; . ./tokens.env; set +a
    cat > config.yaml <<'EOF'
    config:
      standardAttributes:
        user: 'has(jwt.email) ? jwt.email : jwt.sub'
    gateways:
      ui-gateway:
        port: 4001
    ui:
      gateways: [ui-gateway]
      policies:
        jwtAuth:
          mode: strict
          issuer: https://idp.example.com
          audiences: [agw-ui]
          jwks:
            file: /cfg/jwks.json
    llm:
      port: 4000
      models:
      - name: gpt-4o
        provider: openai
        params:
          apiKey: sk-doc-test
      - name: claude
        provider: anthropic
        params:
          apiKey: sk-doc-test
    rbac:
      mode: fine-grained
      policies:
      - name: admins
        subjects:
        - group: platform-admins
        preset: admin
      - name: auditors
        subjects:
        - group: auditors
        preset: viewer
      - name: developers
        subjects:
        - group: developers
        preset: self-service
      - name: model-owners
        subjects:
        - group: ml-team
        - user: alice@example.com
        preset: self-service
        grants:
        - resource: llm.model
          access: manage
          scope:
            names:
            - gpt-4o
    EOF
    # The page runs `agentgateway --validate-only -f config.yaml`; run it in the image.
    agentgateway() {
      docker run --rm --user "$(id -u):$(id -g)" \
        -e ENTERPRISE_AGENTGATEWAY_LICENSE_KEY="$AGENTGATEWAY_LICENSE_KEY" \
        -v "$RBAC_TEST_DIR:/cfg" -w /cfg "$AGW_IMAGE" "$@"
    }
    {{< /doc-test >}}
