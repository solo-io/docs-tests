  content: |-
    {{< doc-test paths="ui-access-control" >}}
    code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
    perms() { curl -sf http://localhost:4001/api/permissions -H "Authorization: Bearer $1"; }
    # Before you begin: strict authentication rejects a request without a token.
    test "$(code http://localhost:4001/api/permissions)" = "401"
    # Each example policy grants what the expected-access table says.
    perms "$TOKEN_DEVELOPER" | python3 -c '
    import json, sys
    p = json.load(sys.stdin)
    assert p["user"] == "carol@example.com", p["user"]
    assert p["groups"] == ["developers"], p["groups"]
    got = {(g["resource"], g["access"], json.dumps(g.get("scope"), sort_keys=True)) for g in p["permissions"]}
    self_scope = json.dumps({"owner": "self"}, sort_keys=True)
    want = {("llm.apiKey", "manage", self_scope), ("logs", "view", self_scope), ("analytics", "view", self_scope), ("llm.budget", "view", self_scope)}
    assert got == want, got'
    perms "$TOKEN_ADMIN" | python3 -c '
    import json, sys
    p = json.load(sys.stdin)
    assert {"resource": "config", "access": "manage"} in p["permissions"], p["permissions"]'
    perms "$TOKEN_AUDITOR" | python3 -c '
    import json, sys
    p = json.load(sys.stdin)
    assert p["permissions"], "auditor has no grants"
    assert all(g["access"] == "view" for g in p["permissions"]), p["permissions"]
    assert not any(g["resource"] == "config" for g in p["permissions"]), p["permissions"]'
    perms "$TOKEN_NOBODY" | python3 -c '
    import json, sys
    p = json.load(sys.stdin)
    assert p["permissions"] == [], p["permissions"]'
    # Verify access step 2: the page says 403 for a resource the user cannot access.
    test "$(code http://localhost:4001/api/config -H "Authorization: Bearer $TOKEN_DEVELOPER")" = "403"
    test "$(code http://localhost:4001/api/config -H "Authorization: Bearer $TOKEN_ADMIN")" = "200"
    # model-owners: manage gpt-4o only.
    put_model() {
      code -X PUT -H "Authorization: Bearer $1" -H 'content-type: application/json' \
        -d "{\"value\":{\"name\":\"$2\",\"provider\":\"$3\",\"params\":{\"apiKey\":\"sk-doc-test\"}}}" \
        "http://localhost:4001/api/config/resources/llm.model/$2"
    }
    test "$(put_model "$TOKEN_ALICE" gpt-4o openai)" = "200"
    test "$(put_model "$TOKEN_ALICE" claude anthropic)" = "403"
    test "$(put_model "$TOKEN_AUDITOR" gpt-4o openai)" = "403"
    docker rm -f agw-rbac-doc-test >/dev/null 2>&1 || true
    cd - >/dev/null
    rm -rf "$RBAC_TEST_DIR"
    {{< /doc-test >}}
