  content: |-
    {{< doc-test paths="enterprise-ui-access-control-setup" >}}
    # ============================================================================
    # Doc test coverage for "Set up UI access control" (these comments are not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES (Config file tab):
    #   * "Configure coarse access": with a strict jwtAuth policy in ui.policies, a
    #     request to the UI gateway without credentials gets 401 (visible curl).
    #   * "Configure fine-grained access": the visible standardAttributes and rbac
    #     snippets load; the visible --validate-only accepts the file; the visible
    #     /api/permissions call for an admin token shows the email as user, the
    #     platform-admins group from jwt.realm_access.roles, and full manage access
    #     in coarse mode; adding mode: fine-grained reloads without a restart.
    #   * "Verify access": the developer token gets the self-service grants
    #     (llm.apiKey manage, owner self), /api/config returns 403 with
    #     "management access denied", the admin keeps access, and the admin
    #     address still has full access without credentials.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI tab and the login steps: browser interactions.
    #   * The misspelled-grant example output: it is an example, not a step.
    #   * A real IdP: the test mints its own RSA key and JWTs, with the claims the
    #     page reads (email, sub, groups, realm_access.roles).
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    openssl genrsa -out uiac.key 2048 2>/dev/null
    python3 - <<'EOF'
    import base64, json, subprocess, time
    def b64(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    mod = subprocess.check_output(["openssl", "rsa", "-in", "uiac.key", "-noout", "-modulus"]).decode().strip().split("=", 1)[1]
    jwk = {"kty": "RSA", "kid": "uiac", "use": "sig", "alg": "RS256", "n": b64(bytes.fromhex(mod)), "e": "AQAB"}
    json.dump({"keys": [jwk]}, open("uiac-jwks.json", "w"))
    def mint(name, claims):
        claims = {"iss": "uiac.example.com", "aud": "agentgateway-ui", "exp": int(time.time()) + 7200, **claims}
        head = b64(json.dumps({"alg": "RS256", "typ": "JWT", "kid": "uiac"}).encode())
        body = b64(json.dumps(claims).encode())
        sig = subprocess.run(["openssl", "dgst", "-sha256", "-sign", "uiac.key"], input=f"{head}.{body}".encode(), capture_output=True, check=True).stdout
        open(name, "w").write(f"{head}.{body}.{b64(sig)}")
    mint("admin.jwt", {"sub": "admin-sub", "email": "admin@example.com", "realm_access": {"roles": ["platform-admins"]}})
    mint("dev.jwt", {"sub": "carol-sub", "email": "carol@example.com", "realm_access": {"roles": ["developers"]}})
    EOF
    export ADMIN_ID_TOKEN=$(cat admin.jwt)
    export ID_TOKEN=$(cat dev.jwt)
    # The UI on its own gateway, port 4001, as in "Expose the UI", with the strict
    # jwtAuth policy that the page's first snippet sets.
    UI_BASE='gateways:
      ui-gateway:
        port: 4001
    ui:
      gateways: [ui-gateway]
      policies:
        jwtAuth:
          mode: strict
          issuer: uiac.example.com
          audiences: [agentgateway-ui]
          jwks:
            file: ./uiac-jwks.json'
    write_config() {
      { echo "# yaml-language-server: \$schema=https://agentgateway.dev/schema/config"; echo "$UI_BASE"; printf '%s\n' "$@"; } > config.yaml
    }
    start_agw() {
      agentgateway -f config.yaml > agw.log 2>&1 &
      AGW_PID=$!
      for i in $(seq 1 30); do
        curl -s -o /dev/null http://localhost:4001/api/config && return 0
        sleep 1
      done
      echo "agentgateway did not start"; cat agw.log; exit 1
    }
    stop_agw() { kill $AGW_PID 2>/dev/null || true; wait $AGW_PID 2>/dev/null || true; }
    trap 'stop_agw' EXIT
    write_config
    start_agw
    {{< /doc-test >}}
