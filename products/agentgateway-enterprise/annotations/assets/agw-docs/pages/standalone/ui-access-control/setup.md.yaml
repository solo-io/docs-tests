  content: |-
    {{< doc-test paths="ui-access-control" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Coarse mode with the default (optional) jwtAuth lets a request without
    #     credentials read the raw config, and `mode: strict` blocks it.
    #   * In coarse mode, any authenticated user can read the raw config.
    #   * The page's `rbac` section and `config.standardAttributes.user` pass
    #     `agentgateway --validate-only`, and the running gateway reloads them.
    #   * In fine-grained mode, /api/permissions returns the self-service grants for
    #     a member of `developers`, /api/config returns 403 "management access
    #     denied" for that user, and a member of `platform-admins` keeps access.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI tab steps and what the UI shows (menus, buttons, labels): they need
    #     a browser session. The REST API checks cover the same grants.
    #   * A real IdP: the test signs its own JWTs with a local key, because the
    #     policies only read the claims.
    #
    # Harness: runs the enterprise image in Docker. `agentgateway` is a wrapper
    # around `docker run`, so the page's `agentgateway --validate-only` step runs
    # the same binary.
    AGW_IMAGE="${AGW_ENTERPRISE_IMAGE:-us-docker.pkg.dev/solo-public/enterprise-agentgateway/agentgateway-enterprise:2026.10.1}"
    export ENTERPRISE_AGENTGATEWAY_LICENSE_KEY="${ENTERPRISE_AGENTGATEWAY_LICENSE_KEY:-${AGENTGATEWAY_LICENSE_KEY:-}}"
    UIRBAC_DIR="$(mktemp -d)"
    cd "$UIRBAC_DIR"
    python3 -m venv .venv
    .venv/bin/pip install -q 'pyjwt[crypto]'
    cat > mint.py <<'PY'
    import json, os, sys, time
    import jwt
    from cryptography.hazmat.primitives import serialization
    from cryptography.hazmat.primitives.asymmetric import rsa
    if not os.path.exists("key.pem"):
        key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
        open("key.pem", "wb").write(key.private_bytes(
            serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
        jwk = json.loads(jwt.algorithms.RSAAlgorithm.to_jwk(key.public_key()))
        jwk.update({"kid": "test", "alg": "RS256", "use": "sig"})
        json.dump({"keys": [jwk]}, open("jwks.json", "w"))
    if len(sys.argv) > 1:
        email, groups = sys.argv[1], sys.argv[2:]
        claims = {"iss": "https://idp.example.com", "aud": "agentgateway-ui",
                  "sub": "sub-" + email.split("@")[0], "email": email, "groups": groups,
                  "exp": int(time.time()) + 3600}
        print(jwt.encode(claims, open("key.pem", "rb").read(), algorithm="RS256", headers={"kid": "test"}))
    PY
    .venv/bin/python mint.py
    mint() { .venv/bin/python "$UIRBAC_DIR/mint.py" "$@"; }
    agentgateway() { docker run --rm -v "$UIRBAC_DIR:$UIRBAC_DIR" -w "$UIRBAC_DIR" -e ENTERPRISE_AGENTGATEWAY_LICENSE_KEY "$AGW_IMAGE" "$@"; }
    # write_config <jwtAuth mode> [fine-grained]: the page's settings on a minimal gateway.
    write_config() {
      cat > "$UIRBAC_DIR/config.yaml" <<EOF
    config:
      adminAddr: 0.0.0.0:15000
    EOF
      if [ "${2:-}" = "fine-grained" ]; then
        cat >> "$UIRBAC_DIR/config.yaml" <<'EOF'
      standardAttributes:
        user: 'has(jwt.email) ? jwt.email : jwt.sub'
    EOF
      fi
      cat >> "$UIRBAC_DIR/config.yaml" <<EOF
    gateways:
      default:
        port: 4001
    ui:
      policies:
        jwtAuth:
          mode: $1
          issuer: https://idp.example.com
          audiences: [agentgateway-ui]
          jwks:
            file: $UIRBAC_DIR/jwks.json
    EOF
      if [ "${2:-}" = "fine-grained" ]; then
        cat >> "$UIRBAC_DIR/config.yaml" <<'EOF'
    rbac:
      mode: fine-grained
      policies:
      - name: admins
        subjects:
        - group: platform-admins
        preset: admin
      - name: developers
        subjects:
        - group: developers
        preset: self-service
    EOF
      fi
    }
    # code <path> [token]: the HTTP status of a UI API request.
    code() {
      if [ -n "${2:-}" ]; then
        curl -s -o /dev/null -w "%{http_code}" "http://localhost:4001$1" -H "Authorization: Bearer $2"
      else
        curl -s -o /dev/null -w "%{http_code}" "http://localhost:4001$1"
      fi
    }
    # wait_code <want> <path> [token]: poll until a request returns the status.
    wait_code() {
      for _ in $(seq 1 60); do
        [ "$(code "$2" "${3:-}")" = "$1" ] && return 0
        sleep 1
      done
      echo "timed out waiting for $2 to return $1 (last: $(code "$2" "${3:-}"))"
      return 1
    }
    write_config optional
    docker rm -f agw-ui-rbac >/dev/null 2>&1 || true
    docker run -d --name agw-ui-rbac -p 4001:4001 -p 15000:15000 \
      -v "$UIRBAC_DIR:$UIRBAC_DIR" -e ENTERPRISE_AGENTGATEWAY_LICENSE_KEY \
      "$AGW_IMAGE" -f "$UIRBAC_DIR/config.yaml"
    DEV_TOKEN="$(mint carol@example.com developers)"
    ADMIN_TOKEN="$(mint dana@example.com platform-admins)"
    # Coarse mode with the default optional jwtAuth: no credentials, full access.
    wait_code 200 /api/config
    {{< /doc-test >}}
