    assert bad != s
    open("bad-config.yaml", "w").write(bad)
    PY
    out="$(agentgateway --validate-only -f bad-config.yaml 2>&1 || true)"
    echo "$out"
    grep -q 'rbac.policies\[1\].grants\[0\]: unknown management resource "llm.models"' <<<"$out"
