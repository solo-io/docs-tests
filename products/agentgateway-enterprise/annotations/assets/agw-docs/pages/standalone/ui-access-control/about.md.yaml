  content: |-
    {{< doc-test paths="ui-access-control-samples" >}}
    # ============================================================================
    # Doc test coverage for this page (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The sample `rbac` section and every kind of subject in the subjects
    #     example pass `agentgateway --validate-only` on the enterprise image.
    #   * An `owner: self` scope on `llm.*` is rejected in fine-grained mode and
    #     not checked in coarse mode, as the scopes section says.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Runtime access for each user: setup.md tests the admin and self-service
    #     policies end to end against a running gateway.
    AGW_IMAGE="${AGW_ENTERPRISE_IMAGE:-us-docker.pkg.dev/solo-public/enterprise-agentgateway/agentgateway-enterprise:2026.10.1}"
    export ENTERPRISE_AGENTGATEWAY_LICENSE_KEY="${ENTERPRISE_AGENTGATEWAY_LICENSE_KEY:-${AGENTGATEWAY_LICENSE_KEY:-}}"
    SAMPLES_DIR="$(mktemp -d)"
    cd "$SAMPLES_DIR"
    agentgateway() { docker run --rm -v "$SAMPLES_DIR:$SAMPLES_DIR" -w "$SAMPLES_DIR" -e ENTERPRISE_AGENTGATEWAY_LICENSE_KEY "$AGW_IMAGE" "$@"; }
    cat > samples.yaml <<'EOF'
    rbac:
      mode: fine-grained
      policies:
      - name: admins
        subjects:
        - group: platform-admins
        preset: admin
      - name: auditors
        subjects:
        - group: auditors
        preset: viewer
      - name: developers
        subjects:
        - group: developers
        preset: self-service
      - name: model-owners
        subjects:
        - group: ml-team
        - user: alice@example.com
        preset: self-service
        grants:
        - resource: llm.model
          access: manage
          scope:
            names:
            - gpt-4o
    EOF
    agentgateway --validate-only -f samples.yaml
    {{< /doc-test >}}
