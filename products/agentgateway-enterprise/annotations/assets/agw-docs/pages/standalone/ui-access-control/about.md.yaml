  content: |-
    {{< doc-test paths="ui-access-control-samples" >}}
    cat > subjects.yaml <<'EOF'
    rbac:
      mode: fine-grained
      policies:
      - name: subject-kinds
        subjects:
        - user: alice@example.com
        - group: platform-admins
        - expression: '"platform-admins" in jwt.realm_access.roles'
        - expression: 'jwt.email.endsWith("@example.com") && request.headers["x-team"] == "platform"'
        preset: viewer
    EOF
    agentgateway --validate-only -f subjects.yaml
    # Scopes section: llm.* with owner: self is not valid, because llm.model does not accept owner.
    cat > bad-scope.yaml <<'EOF'
    rbac:
      mode: fine-grained
      policies:
      - name: bad
        subjects:
        - group: developers
        grants:
        - resource: llm.*
          access: view
          scope:
            owner: self
    EOF
    # Fine-grained mode rejects the scope.
    out="$(agentgateway --validate-only -f bad-scope.yaml 2>&1 || true)"
    echo "$out"
    grep -q "scope.owner is only supported for llm.apiKey, llm.budget, logs, and analytics" <<<"$out"
    # Coarse mode does not check scopes, so the same policy passes.
    grep -v "mode: fine-grained" bad-scope.yaml > bad-scope-coarse.yaml
    agentgateway --validate-only -f bad-scope-coarse.yaml
    {{< /doc-test >}}
