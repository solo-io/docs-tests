    {{< doc-test paths="license" >}}
    curl -sf localhost:15000/api/runtime | python3 -c '
    import json, sys
    lic = json.load(sys.stdin).get("license") or {}
    assert lic.get("state") == "running", f"expected license state running, got {lic}"
    assert lic.get("product") == "agentgateway", lic
    print("license:", lic)
    '
