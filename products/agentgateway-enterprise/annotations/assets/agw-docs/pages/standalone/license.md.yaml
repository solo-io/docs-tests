  content: |-
    {{< doc-test paths="license" >}}
    # Write the real key (from the CI secret) to the file the File reference tab uses,
    # then start the proxy WITHOUT the env var so only config.license.key.file can license it.
    umask 077
    printf '%s' "$ENTERPRISE_AGENTGATEWAY_LICENSE_KEY" > license.key
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      license:
        key:
          file: ./license.key
    gateways:
      default:
        port: 4000
    EOF
    agentgateway -f config.yaml --validate-only
    env -u ENTERPRISE_AGENTGATEWAY_LICENSE_KEY agentgateway -f config.yaml > agw.log 2>&1 &
    AGW_PID=$!
    trap 'kill $AGW_PID 2>/dev/null; rm -f license.key' EXIT
    for _ in $(seq 1 30); do curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && break; sleep 1; done
    curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready || { echo "agentgateway did not become ready within 30 s"; cat agw.log; exit 1; }
    {{< /doc-test >}}
