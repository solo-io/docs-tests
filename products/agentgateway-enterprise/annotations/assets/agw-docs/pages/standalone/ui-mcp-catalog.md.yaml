  content: |-
    {{< doc-test paths="ui-mcp-catalog" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Turn on the catalog": AGENTGATEWAY_UI_MCP_CATALOG_ENABLED=true turns the
    #     catalog on (the UI index carries mcpCatalog: true), the alternate value
    #     "on" does too, and without the variable the catalog is off.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The wizard steps: they are browser interactions with hosted third-party
    #     MCP providers that need accounts and tokens.
    #   * Docker and Helm tabs: the standalone binary test env has neither.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    mcp:
      port: 3000
      targets: []
    EOF
    catalog_flag() {
      for _ in $(seq 1 30); do
        body=$(curl -sf -m 2 http://localhost:15000/ui/) && break || true
        sleep 1
      done
      printf '%s' "${body:-}" | grep -o 'mcpCatalog: [a-z]*' || true
    }
    run_with() {
      env "$@" agentgateway -f config.yaml > agw.log 2>&1 &
      AGW_PID=$!
    }
    trap 'kill $AGW_PID 2>/dev/null' EXIT
    {{< /doc-test >}}
