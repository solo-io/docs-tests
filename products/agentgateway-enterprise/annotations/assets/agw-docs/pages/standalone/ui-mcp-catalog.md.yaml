  content: |-
    {{< doc-test paths="ui-mcp-catalog" >}}
    # Catalog on with =true, as the Binary tab shows.
    run_with AGENTGATEWAY_UI_MCP_CATALOG_ENABLED=true
    flag=$(catalog_flag); echo "$flag"
    [ "$flag" = "mcpCatalog: true" ] || { echo "catalog not enabled"; cat agw.log; exit 1; }
    kill $AGW_PID; wait $AGW_PID 2>/dev/null || true
    # "on" is also accepted.
    run_with AGENTGATEWAY_UI_MCP_CATALOG_ENABLED=on
    flag=$(catalog_flag); echo "$flag"
    [ "$flag" = "mcpCatalog: true" ] || { echo "catalog not enabled by 'on'"; exit 1; }
    kill $AGW_PID; wait $AGW_PID 2>/dev/null || true
    # Off by default.
    run_with -u AGENTGATEWAY_UI_MCP_CATALOG_ENABLED
    flag=$(catalog_flag); echo "$flag"
    [ "$flag" = "mcpCatalog: false" ] || { echo "catalog should be off by default"; exit 1; }
    {{< /doc-test >}}
