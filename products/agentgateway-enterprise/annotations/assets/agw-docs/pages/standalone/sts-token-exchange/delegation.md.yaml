  content: |-
    {{< doc-test paths="sts-delegation" >}}
    # Step 4: the delegated claims.
    USER_SUB=$(jwt_claims "$USER_TOKEN" | jq -r .sub)
    jwt_claims "$(echo "$DELEGATED" | jq -r .access_token)" \
      | jq -e --arg u "$USER_SUB" --arg a "$AGENT_SUB" --arg kc "$KEYCLOAK_ISSUER" \
        '.iss == "https://sts.example.com" and .sub == $u and .act.sub == $a and .act.iss == $kc and .may_act.sub == $a' >/dev/null \
      || { echo "delegated token claims do not match the page: $(jwt_claims "$(echo "$DELEGATED" | jq -r .access_token)")"; exit 1; }
    # The may_act section: a subject token without may_act is refused.
    NO_MAY_ACT=$(curl -s -X POST http://localhost:7777/token \
      -H "Content-Type: application/x-www-form-urlencoded" -H "Accept: application/json" \
      -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
      -d "subject_token=${AGENT_TOKEN}" -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
      -d "actor_token=${AGENT_TOKEN}" -d "actor_token_type=urn:ietf:params:oauth:token-type:jwt")
    echo "$NO_MAY_ACT" | jq -e '.error == "unauthorized_client" and (.error_description | contains("may_act"))' >/dev/null \
      || { echo "expected unauthorized_client for a subject token with no may_act: $NO_MAY_ACT"; exit 1; }
    {{< /doc-test >}}
