  content: |-
    {{< doc-test paths="sts-setup" >}}
    # The page's entSts section (Step 2) and oauthTokenExchange policy (Step 3) in
    # one file, with the Keycloak stand-in for idp.example.com, the key from Step 1,
    # and a route whose backend echoes the forwarded Authorization header.
    # Backend stand-in for internal-api.example.com: echoes the Authorization
    # header that it receives, so the test can decode the token the proxy forwarded.
    cat > sts-echo.py <<'PYEOF'
    import http.server, json
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            b = json.dumps({"authorization": self.headers.get("Authorization", "")}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def log_message(self, *a):
            pass
    http.server.HTTPServer(("127.0.0.1", 8081), H).serve_forever()
    PYEOF
    python3 sts-echo.py &
    ECHO_PID=$!
    cat > config.yaml <<EOF
    entSts:
      enabled: true
      issuer: https://sts.example.com
      tokenExpiration: 1h
      requireAudience: false
      privateKeyPath: ${PWD}/sts-jwt.pem
      subjectValidators:
      - validatorType: remote
        issuer: ${KEYCLOAK_ISSUER}
        remoteConfig:
          url: ${KEYCLOAK_JWKS}
      actorValidators:
      - validatorType: remote
        issuer: ${KEYCLOAK_ISSUER}
        remoteConfig:
          url: ${KEYCLOAK_JWKS}
      apiValidators:
      - validatorType: remote
        issuer: ${KEYCLOAK_ISSUER}
        remoteConfig:
          url: ${KEYCLOAK_JWKS}
    binds:
    - port: 3000
      listeners:
      - name: default
        routes:
        - name: internal-api
          backends:
          - host: 127.0.0.1:8081
            policies:
              backendAuth:
                oauthTokenExchange:
                  host: 127.0.0.1:7777
                  path: /token
                  audiences: ["internal-api"]
                  subjectToken:
                    tokenType: "urn:ietf:params:oauth:token-type:jwt"
    EOF
    {{< /doc-test >}}
