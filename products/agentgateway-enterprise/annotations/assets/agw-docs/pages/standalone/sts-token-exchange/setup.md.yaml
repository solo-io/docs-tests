  content: |2-
       {{< doc-test paths="sts-setup" >}}
       # Step 5 and 6: exchange, decode, and compare with the page's claims.
       STS_RESP=$(curl -fsS -X POST http://127.0.0.1:7777/token \
         -H "Content-Type: application/x-www-form-urlencoded" -H "Accept: application/json" \
         -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
         -d "subject_token=${USER_TOKEN}" -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt")
       echo "$STS_RESP" | jq -e '.issued_token_type == "urn:ietf:params:oauth:token-type:jwt" and .token_type == "Bearer" and (.access_token | length > 0)' >/dev/null \
         || { echo "unexpected exchange response: $STS_RESP"; exit 1; }
       USER_SUB=$(jwt_claims "$USER_TOKEN" | jq -r .sub)
       jwt_claims "$(echo "$STS_RESP" | jq -r .access_token)" \
         | jq -e --arg sub "$USER_SUB" '.iss == "https://sts.example.com" and .sub == $sub' >/dev/null \
         || { echo "issued token iss/sub do not match"; exit 1; }
       # Through the proxy: the backend receives the STS token, not the IdP token.
       FWD=$(curl -fsS http://localhost:3000/ -H "Authorization: Bearer ${USER_TOKEN}" | jq -r .authorization)
       jwt_claims "${FWD#Bearer }" | jq -e --arg sub "$USER_SUB" '.iss == "https://sts.example.com" and .sub == $sub' >/dev/null \
         || { echo "backend did not receive an STS-signed token: $FWD"; exit 1; }
       {{< /doc-test >}}
