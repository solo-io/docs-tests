    {{< doc-test paths="sts-setup" >}}
    # Step 4, Binaries tab: the page's commands, run in the background. The
    # license key comes from the environment (the page's export is a placeholder).
    agentgateway-sts sts --config-file config.yaml --address 127.0.0.1:7777 > sts.log 2>&1 &
    STS_PID=$!
    for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:7777/healthz 2>/dev/null && break; sleep 1; done
    curl -fsS -o /dev/null http://127.0.0.1:7777/healthz || { echo "STS did not become healthy"; exit 1; }
    grep -q '"minting_enabled":true' sts.log || { echo "STS log does not report minting_enabled true"; exit 1; }
    agentgateway -f config.yaml --validate-only
    agentgateway -f config.yaml > agw.log 2>&1 &
    AGW_PID=$!
    for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:15021/healthz/ready 2>/dev/null && break; sleep 1; done
    curl -fsS -o /dev/null http://localhost:15021/healthz/ready || { echo "proxy did not become ready"; exit 1; }
    {{< /doc-test >}}
