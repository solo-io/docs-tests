  content: |-
    {{< doc-test paths="sts-setup" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES (Binaries method):
    #   * Step 1: the documented openssl command produces a key the STS loads
    #     (the startup log reports minting_enabled true).
    #   * Steps 2-4: an entSts section with the documented fields, three remote
    #     validators, and the Step 3 oauthTokenExchange policy on a route, all in
    #     one file: agentgateway --validate-only accepts it, agentgateway-sts starts
    #     from it on 127.0.0.1:7777, and the proxy starts from the same file.
    #   * Step 5: /healthz, the authorization server metadata (issuer, grant type),
    #     and a non-empty /.well-known/jwks.json; a direct RFC 8693 exchange of an
    #     IdP token returns an STS-signed JWT whose iss is entSts.issuer and whose
    #     sub is the IdP user's sub; and the same exchange through the proxy.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The IdP. Keycloak in docker dev mode stands in for idp.example.com, so
    #     the hidden config swaps in its issuer and JWKS URL.
    #   * The Docker container and Helm tabs, the chown step, and the launcher
    #     settings: the run uses the installed binaries only.
    #   * The tokenExchange / config.stsUri variant (services and workloads
    #     entries); only oauthTokenExchange, which the page recommends, is run.
    #   * Step 6, trusting the STS at a downstream service (no downstream here).
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    trap 'rc=$?; kill ${AGW_PID:-} ${STS_PID:-} ${ECHO_PID:-} ${MCP_PID:-} 2>/dev/null || true; if [ $rc -ne 0 ]; then echo "--- sts.log"; tail -n 50 sts.log 2>/dev/null; echo "--- agw.log"; tail -n 50 agw.log 2>/dev/null; fi; docker rm -f keycloak-sts >/dev/null 2>&1 || true' EXIT
    # IdP stand-in: Keycloak in docker dev mode. Realm "sts" with:
    #   user-client  public client, password grant; adds aud=agentgateway and a
    #                hardcoded may_act.sub claim naming agent-1's service account
    #   agent-1      confidential client whose service account is the agent
    #   user1        test user
    docker rm -f keycloak-sts >/dev/null 2>&1 || true
    docker run -d --name keycloak-sts -p 8080:8080 \
      -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
      quay.io/keycloak/keycloak:26.4 start-dev >/dev/null
    KEYCLOAK_URL=http://localhost:8080
    for i in $(seq 1 90); do
      curl -fsS -o /dev/null "${KEYCLOAK_URL}/realms/master/.well-known/openid-configuration" 2>/dev/null && break
      sleep 2
    done
    KC_ADMIN=$(curl -fsS "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
      -d client_id=admin-cli -d username=admin -d password=admin -d grant_type=password | jq -r .access_token)
    test -n "$KC_ADMIN" && test "$KC_ADMIN" != null || { echo "Keycloak admin login failed"; exit 1; }
    kc() { curl -fsS -H "Authorization: Bearer ${KC_ADMIN}" -H 'Content-Type: application/json' "$@"; }
    kc -X POST "${KEYCLOAK_URL}/admin/realms" -d '{"realm":"sts","enabled":true}'
    kc -X POST "${KEYCLOAK_URL}/admin/realms/sts/clients" \
      -d '{"clientId":"agent-1","enabled":true,"publicClient":false,"secret":"agent-1-secret","serviceAccountsEnabled":true,"standardFlowEnabled":false,"directAccessGrantsEnabled":false}'
    AGENT_CLIENT_UUID=$(kc "${KEYCLOAK_URL}/admin/realms/sts/clients?clientId=agent-1" | jq -r '.[0].id')
    AGENT_SUB=$(kc "${KEYCLOAK_URL}/admin/realms/sts/clients/${AGENT_CLIENT_UUID}/service-account-user" | jq -r .id)
    kc -X POST "${KEYCLOAK_URL}/admin/realms/sts/clients" -d @- <<KCEOF
    {"clientId":"user-client","enabled":true,"publicClient":true,"directAccessGrantsEnabled":true,"standardFlowEnabled":false,
     "protocolMappers":[
      {"name":"aud-agentgateway","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper",
       "config":{"included.custom.audience":"agentgateway","access.token.claim":"true","id.token.claim":"false"}},
      {"name":"may-act","protocol":"openid-connect","protocolMapper":"oidc-hardcoded-claim-mapper",
       "config":{"claim.name":"may_act.sub","claim.value":"${AGENT_SUB}","jsonType.label":"String","access.token.claim":"true","id.token.claim":"false","userinfo.token.claim":"false"}}]}
    KCEOF
    kc -X POST "${KEYCLOAK_URL}/admin/realms/sts/users" \
      -d '{"username":"user1","enabled":true,"email":"user1@example.com","emailVerified":true,"firstName":"User","lastName":"One","credentials":[{"type":"password","value":"Password1!","temporary":false}]}'
    KEYCLOAK_ISSUER=${KEYCLOAK_URL}/realms/sts
    KEYCLOAK_JWKS=${KEYCLOAK_ISSUER}/protocol/openid-connect/certs
    get_user_token() {
      curl -fsS "${KEYCLOAK_ISSUER}/protocol/openid-connect/token" -d grant_type=password \
        -d client_id=user-client -d username=user1 -d 'password=Password1!' | jq -r .access_token
    }
    get_agent_token() {
      curl -fsS "${KEYCLOAK_ISSUER}/protocol/openid-connect/token" -d grant_type=client_credentials \
        -d client_id=agent-1 -d client_secret=agent-1-secret | jq -r .access_token
    }
    jwt_claims() { python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p))))' "$1"; }
    test -n "$(get_user_token)" || { echo "user1 cannot get a token from Keycloak"; exit 1; }
    {{< /doc-test >}}
