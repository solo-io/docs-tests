  content: |-
    {{< doc-test paths="mcp-elicitation-brokered-setup" >}}
    # ============================================================================
    # Doc test coverage for "Set up brokered elicitation" (standalone; comments not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Keycloak in Docker with the downstream-mcp realm, the Everything MCP
    #     server, the complete config.yaml (--validate-only), and the STS and proxy
    #     started from it, with the STS log lines that the page quotes.
    #   * The 401 challenge, protected resource metadata, and authorization server
    #     metadata, with exact values.
    #   * Dynamic client registration accepts an allowlisted Inspector callback
    #     and rejects one that is not on the allowlist.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The separate terminals: the MCP server, STS, and proxy run in the
    #     background of this script instead, and stop when it exits.
    #   * Clean up: the brokered pages that chain this one need Keycloak; the exit
    #     trap removes the container instead.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    command -v agentgateway-sts >/dev/null || { echo "agentgateway-sts not installed" >&2; exit 1; }
    DT_LOGS=$(mktemp -d)
    DT_PIDS=""
    trap 'kill $DT_PIDS 2>/dev/null || true; docker rm -f agentgateway-downstream-keycloak >/dev/null 2>&1 || true' EXIT
    # Helpers that stand in for the browser in the brokered pages that chain this
    # one: kc_form_login posts a Keycloak login form, and follow_redirects_until
    # walks a redirect chain until a URL prefix.
    kc_form_login() {
      local url="$1" user="$2" pass="$3" jar="$4" page action
      page=$(curl -sS -c "$jar" -b "$jar" "$url")
      action=$(printf '%s' "$page" | { grep -o 'action="[^"]*login-actions/authenticate[^"]*"' || true; } | head -1 \
        | sed -e 's/^action="//' -e 's/"$//' -e 's/&amp;/\&/g')
      if [ -z "$action" ]; then
        echo "no Keycloak login form at $url" >&2
        printf '%s\n' "$page" | head -40 >&2
        return 1
      fi
      curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" \
        --data-urlencode "username=$user" --data-urlencode "password=$pass" \
        --data-urlencode "credentialId=" "$action"
    }
    follow_redirects_until() {
      local prefix="$1" url="$2" jar="$3" i
      for i in $(seq 1 10); do
        case "$url" in "$prefix"*) printf '%s' "$url"; return 0;; esac
        url=$(curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" "$url")
        if [ -z "$url" ]; then echo "redirect chain ended before reaching $prefix" >&2; return 1; fi
      done
      echo "too many redirects before $prefix" >&2
      return 1
    }
    query_param() {
      python3 -c 'import sys,urllib.parse as u; print(u.parse_qs(u.urlparse(sys.argv[1]).query)[sys.argv[2]][0])' "$1" "$2"
    }
    urlenc() { jq -rn --arg v "$1" '$v|@uri'; }
    pkce_pair() {
      PKCE_VERIFIER=$(openssl rand -hex 32)
      PKCE_CHALLENGE=$(printf '%s' "$PKCE_VERIFIER" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
    }
    wait_for_log() {
      local file="$1" text="$2" i
      for i in $(seq 1 60); do
        grep -qF "$text" "$file" 2>/dev/null && return 0
        sleep 1
      done
      echo "FAIL: '$text' not in $file" >&2
      tail -n 40 "$file" >&2
      return 1
    }
    # Starts (or restarts) the STS in the background from the working directory.
    start_sts() {
      if [ -n "${STS_PID:-}" ]; then kill "$STS_PID" 2>/dev/null || true; wait "$STS_PID" 2>/dev/null || true; fi
      : > "$DT_LOGS/sts.log"
      agentgateway-sts sts --config-file config.yaml --address 127.0.0.1:7777 > "$DT_LOGS/sts.log" 2>&1 &
      STS_PID=$!
      DT_PIDS="$DT_PIDS $STS_PID"
      wait_for_log "$DT_LOGS/sts.log" 'starting token exchange server on'
    }
    {{< /doc-test >}}
