       {{< doc-test paths="mcp-elicitation-brokered-agent" >}}
       # ============================================================================
       # Doc test coverage for "Agent (upstream-only)" (standalone; comments not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The upstream-mcp realm and local-agent client through the Keycloak
       #     admin API, the agent's password-grant token, and the secret file.
       #   * The agent-mcp route and elicitation resource from Step 3, merged into
       #     config.yaml (hidden equivalent of the hand edit), and the STS reload.
       #   * The first initialize returns 400 with an upstream-mcp authorization URL
       #     whose redirect_uri is the issuer's upstream callback.
       #   * The browser step without a browser: the upstream Keycloak login form is
       #     posted with curl, and the issuer callback answers "Authorization
       #     complete". The retry opens a session, the Echo tool answers, and the STS
       #     logs the agent flow lines that the page quotes.
       #   * Clean up: the secret file and the Keycloak realm and client are removed.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A real browser, and the `code config.yaml` editor step.
       [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/mcp)" = "401" ] || { echo "FAIL: proxy is not answering 401" >&2; exit 1; }
       {{< /doc-test >}}
