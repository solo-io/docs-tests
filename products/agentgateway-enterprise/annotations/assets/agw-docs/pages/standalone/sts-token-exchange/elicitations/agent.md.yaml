       {{< doc-test paths="mcp-elicitation-brokered-agent" >}}
       # The proxy reloads on its own schedule: retry until the new route answers 400.
       for i in $(seq 1 30); do
         AGENT_RESP=$(curl -s -w '\n%{http_code}' -X POST http://localhost:3000/mcp/agent \
           -H "Authorization: Bearer ${AGENT_TOKEN}" -H "Content-Type: application/json" \
           -H "Accept: application/json, text/event-stream" \
           -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"local-agent","version":"1"}}}')
         [ "$(tail -n1 <<<"$AGENT_RESP")" = "400" ] && break
         sleep 2
       done
       [ "$(tail -n1 <<<"$AGENT_RESP")" = "400" ] || { echo "FAIL: expected 400" >&2; echo "$AGENT_RESP" >&2; exit 1; }
       UPSTREAM_AUTH_URL=$(sed '$d' <<<"$AGENT_RESP" | jq -er .url)
       case "$UPSTREAM_AUTH_URL" in
         "http://localhost:8080/realms/upstream-mcp/protocol/openid-connect/auth?"*) ;;
         *) echo "FAIL: URL does not point to the upstream-mcp realm: $UPSTREAM_AUTH_URL" >&2; exit 1 ;;
       esac
       [ "$(query_param "$UPSTREAM_AUTH_URL" redirect_uri)" = "http://localhost:3000/oauth-issuer/callback/upstream" ] \
         || { echo "FAIL: redirect_uri $(query_param "$UPSTREAM_AUTH_URL" redirect_uri)" >&2; exit 1; }
       # Stand-in for steps 2 and 3: sign in to the upstream realm as alice.
       JAR=$(mktemp)
       UPSTREAM_CB=$(kc_form_login "$UPSTREAM_AUTH_URL" alice alice-upstream-password "$JAR")
       case "$UPSTREAM_CB" in
         "http://localhost:3000/oauth-issuer/callback/upstream?"*) ;;
         *) echo "FAIL: upstream login did not return to the issuer: $UPSTREAM_CB" >&2; exit 1 ;;
       esac
       curl -fsS -L -b "$JAR" -c "$JAR" "$UPSTREAM_CB" | grep 'Authorization complete' >/dev/null \
         || { echo "FAIL: callback did not show Authorization complete" >&2; exit 1; }
       {{< /doc-test >}}
