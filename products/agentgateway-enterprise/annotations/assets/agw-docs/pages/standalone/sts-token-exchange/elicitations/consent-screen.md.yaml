  content: |2-
       {{< doc-test paths="mcp-elicitation-brokered-consent" >}}
       # "Verify consent" against the local stand-ins, with curl in place of the browser.
       JAR=$(mktemp)
       REDIRECT_URI="http://localhost:6274/oauth/callback"
       curl -fsS -X POST http://localhost:3000/oauth-issuer/register -H 'Content-Type: application/json' \
         -d "{\"client_name\":\"doc-test\",\"redirect_uris\":[\"${REDIRECT_URI}\"]}" >/dev/null
       pkce_pair
       AUTH_URL="http://localhost:3000/oauth-issuer/authorize?client_id=agw-issuer&response_type=code&state=doc-test-consent&redirect_uri=$(urlenc "$REDIRECT_URI")&code_challenge=${PKCE_CHALLENGE}&code_challenge_method=S256&resource=$(urlenc http://localhost:3000/mcp/consent)"
       KC_PAGE=$(follow_redirects_until "http://localhost:8080/realms/downstream-mcp/" "$AUTH_URL" "$JAR")
       AFTER_LOGIN=$(kc_form_login "$KC_PAGE" alice alice-password "$JAR")
       # 1-2. The issuer redirects to its consent screen, not to the upstream provider.
       CONSENT_URL=$(follow_redirects_until "http://localhost:3000/oauth-issuer/consent" "$AFTER_LOGIN" "$JAR")
       CONSENT_PAGE=$(curl -fsS -b "$JAR" -c "$JAR" "$CONSENT_URL")
       for want in 'Example Platform' \
                   'Example Corp will access your GitHub account on your behalf.' \
                   'https://example.com/logo.svg' \
                   'Upstream Example' \
                   'name="state"' \
                   'name="decision" value="allow"'; do
         grep -qF "$want" <<<"$CONSENT_PAGE" || { echo "FAIL: consent page lacks: $want" >&2; echo "$CONSENT_PAGE" | grep -v '^\s*$' | tail -60 >&2; exit 1; }
       done
       for want in '"msg":"downstream callback processed, redirecting to consent"' '"has_consent_url":true'; do
         grep -F "$want" "$DT_LOGS/sts.log" >/dev/null || { echo "FAIL: STS log lacks $want" >&2; tail -n 40 "$DT_LOGS/sts.log" >&2; exit 1; }
       done
       grep -F '"path":"/oauth-issuer/consent"' "$DT_LOGS/sts.log" | grep -F '"method":"GET"' | grep -F '"status_code":200' >/dev/null \
         || { echo "FAIL: no GET /oauth-issuer/consent 200 in the STS log" >&2; exit 1; }
       # 3-4. Post the form's state with decision=allow; a 302 to the upstream provider follows.
       FORM_STATE=$(grep -o 'name="state" value="[^"]*"' <<<"$CONSENT_PAGE" | head -1 | sed -e 's/.*value="//' -e 's/"$//' -e 's/&amp;/\&/g')
       [ -n "$FORM_STATE" ] || { echo "FAIL: no state in the consent form" >&2; exit 1; }
       POST_OUT=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -b "$JAR" -c "$JAR" \
         --data-urlencode "state=${FORM_STATE}" --data-urlencode decision=allow "$CONSENT_URL")
       [ "${POST_OUT%% *}" = "302" ] || { echo "FAIL: consent POST returned ${POST_OUT}" >&2; exit 1; }
       UPSTREAM_AUTH_URL=${POST_OUT#* }
       case "$UPSTREAM_AUTH_URL" in
         "http://localhost:8080/realms/upstream-mcp/protocol/openid-connect/auth?"*) ;;
         *) echo "FAIL: consent did not redirect to the upstream provider: $UPSTREAM_AUTH_URL" >&2; exit 1 ;;
       esac
       grep -F '"path":"/oauth-issuer/consent"' "$DT_LOGS/sts.log" | grep -F '"method":"POST"' | grep -F '"status_code":302' >/dev/null \
         || { echo "FAIL: no POST /oauth-issuer/consent 302 in the STS log" >&2; exit 1; }
       # The upstream leg, followed with GET as a browser does.
       UPSTREAM_CB=$(kc_form_login "$UPSTREAM_AUTH_URL" alice alice-upstream-password "$JAR")
       CLIENT_CB=$(follow_redirects_until "$REDIRECT_URI" "$UPSTREAM_CB" "$JAR")
       [ "$(query_param "$CLIENT_CB" state)" = "doc-test-consent" ] || { echo "FAIL: state mismatch in $CLIENT_CB" >&2; exit 1; }
       grep -F '"msg":"code exchange succeeded"' "$DT_LOGS/sts.log" | grep -F '"resource":"consent-mcp"' >/dev/null \
         || { echo "FAIL: no code exchange for consent-mcp in the STS log" >&2; tail -n 40 "$DT_LOGS/sts.log" >&2; exit 1; }
       CODE=$(query_param "$CLIENT_CB" code)
       TOKEN_RESP=$(curl -fsS -X POST http://localhost:3000/oauth-issuer/token \
         --data-urlencode grant_type=authorization_code --data-urlencode "code=${CODE}" \
         --data-urlencode client_id=agw-issuer --data-urlencode "redirect_uri=${REDIRECT_URI}" \
         --data-urlencode "code_verifier=${PKCE_VERIFIER}")
       DOWNSTREAM_TOKEN=$(jq -er .access_token <<<"$TOKEN_RESP")
       HDRS=$(mktemp)
       curl -fsS -D "$HDRS" -o /dev/null -X POST http://localhost:3000/mcp/consent \
         -H "Authorization: Bearer ${DOWNSTREAM_TOKEN}" -H 'Content-Type: application/json' \
         -H 'Accept: application/json, text/event-stream' \
         -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"doc-test","version":"1"}}}'
       SID=$(awk 'tolower($1) == "mcp-session-id:" {gsub("\r", "", $2); print $2}' "$HDRS")
       [ -n "$SID" ] || { echo "FAIL: no mcp-session-id" >&2; cat "$HDRS" >&2; exit 1; }
       ECHO_OUT=$(curl -fsS -X POST http://localhost:3000/mcp/consent -H "Authorization: Bearer ${DOWNSTREAM_TOKEN}" \
         -H "Mcp-Session-Id: ${SID}" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
         -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"echo","arguments":{"message":"after consent"}}}')
       grep -q 'Echo: after consent' <<<"$ECHO_OUT" || { echo "FAIL: echo result" >&2; echo "$ECHO_OUT" >&2; exit 1; }
       {{< /doc-test >}}
