    {{< doc-test paths="mcp-elicitation-brokered-consent" >}}
    # ============================================================================
    # Doc test coverage for "Consent screen" (standalone; comments not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The issuer-level consent block from "Turn on consent", with the page's
    #     values, merged into the brokered setup's config.yaml, and the STS restart.
    #   * An upstream OAuth resource with clientName (the page's example points at
    #     GitHub; this test uses a second Keycloak realm, upstream-mcp, as the
    #     upstream provider, the same stand-in as the agent guide), its
    #     oauthTokenExchange backend policy, and its issuer-proxy route.
    #   * "Verify consent" without a browser: registration, PKCE authorize, the
    #     downstream Keycloak login, and the redirect to the consent page, which
    #     shows the platform name, legal text, logo, and clientName, and carries a
    #     form with state and decision. The STS log lines that the page quotes.
    #   * Submitting decision=allow returns 302 to the upstream provider. The
    #     upstream login completes, the client gets a code and a token, and an MCP
    #     initialize and Echo call through the resource succeed.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The page's example URLs (gateway.example.com, GitHub): not reachable in
    #     CI. The per-resource override and opt-out examples are checked by the
    #     schema test only.
    ADMIN_TOKEN=$(curl -fsS -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
      -d grant_type=password -d client_id=admin-cli -d username=admin -d password=admin | jq -r .access_token)
    curl -fsS -X POST http://localhost:8080/admin/realms \
      -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" -d @- <<'JSON'
    {
      "realm": "upstream-mcp",
      "enabled": true,
      "sslRequired": "none",
      "clients": [{"clientId": "agw-upstream", "secret": "local-upstream-secret", "publicClient": false,
        "standardFlowEnabled": true, "directAccessGrantsEnabled": false,
        "redirectUris": ["http://localhost:3000/oauth-issuer/callback/upstream"]}],
      "users": [{"username": "alice", "enabled": true, "email": "alice@example.com", "emailVerified": true,
        "firstName": "Alice", "lastName": "Upstream",
        "credentials": [{"type": "password", "value": "alice-upstream-password", "temporary": false}]}]
    }
    JSON
    printf 'local-upstream-secret' > upstream-client-secret.txt
    chmod 600 upstream-client-secret.txt
    python3 - <<'PY'
    import yaml
    with open("config.yaml") as f:
        cfg = yaml.safe_load(f)
    # The issuer-level block from "Turn on consent", as the page shows it.
    cfg["entSts"]["oauthIssuer"]["consent"] = {
        "enabled": True,
        "platformName": "Example Platform",
        "legalText": "Example Corp will access your GitHub account on your behalf.",
        "logoUrl": "https://example.com/logo.svg",
    }
    cfg["entSts"]["entElicitations"]["resources"]["consent-mcp"] = yaml.safe_load("""
    brokered:
      mcpResourcePath: /mcp/consent
      chainedAuth:
        oauth:
          clientId: agw-upstream
          clientSecret: {file: ./upstream-client-secret.txt}
          authorizeUrl: http://localhost:8080/realms/upstream-mcp/protocol/openid-connect/auth
          accessTokenUrl: http://localhost:8080/realms/upstream-mcp/protocol/openid-connect/token
          scopes: [openid, profile]
          clientName: Upstream Example
    """)
    cfg["routes"].insert(0, yaml.safe_load("""
    name: consent-mcp
    gateways: [default]
    matches:
    - path: {pathPrefix: /mcp/consent}
    - path: {exact: /.well-known/oauth-protected-resource/mcp/consent}
    - path: {exact: /.well-known/oauth-authorization-server/mcp/consent}
    policies:
      mcpAuthentication:
        issuer: http://localhost:8080/realms/downstream-mcp
        audiences: [agw-issuer]
        jwks:
          url: http://localhost:8080/realms/downstream-mcp/protocol/openid-connect/certs
        resourceMetadata:
          agentgateway.dev/issuer-proxy: http://localhost:3000/oauth-issuer
          resource: http://localhost:3000/mcp/consent
          authorizationServers: [http://localhost:3000/mcp/consent]
      backendAuth:
        oauthTokenExchange:
          host: 127.0.0.1:7777
          path: /elicitations/oauth2/token
          allowSubjectTokenFromClaims: true
          subjectToken:
            tokenType: "urn:ietf:params:oauth:token-type:jwt"
          resources:
          - consent-mcp
    backends:
    - mcp:
        targets:
        - name: everything
          mcp:
            host: 127.0.0.1
            port: 3001
            path: /mcp
    """))
    with open("config.yaml", "w") as f:
        yaml.safe_dump(cfg, f, sort_keys=False)
    PY
    # Hidden equivalent of the restart above: issuer-level consent needs a restart.
    start_sts
    grep -F 'MCP resource paths declared as issuer-proxy handled' "$DT_LOGS/sts.log" | grep -F '"/mcp/consent"' >/dev/null \
      || { echo "FAIL: STS did not declare /mcp/consent" >&2; tail -n 40 "$DT_LOGS/sts.log" >&2; exit 1; }
    for i in $(seq 1 30); do
      [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/.well-known/oauth-protected-resource/mcp/consent)" = "200" ] && break
      sleep 2
    done
    PRM=$(curl -fsS http://localhost:3000/.well-known/oauth-protected-resource/mcp/consent)
    [ "$(jq -r .resource <<<"$PRM")" = "http://localhost:3000/mcp/consent" ] || { echo "FAIL: resource" >&2; echo "$PRM" >&2; exit 1; }
    {{< /doc-test >}}
