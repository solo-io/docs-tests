  content: |-
    {{< doc-test paths="tool-mode" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The listener config (license key file + server-everything over stdio)
    #     passes --validate-only and serves MCP.
    #   * Each mode, switched in the config file and hot-reloaded: standard lists
    #     the target's tools and calls echo; search exposes only get_tool and
    #     invoke_tool and both work; code exposes only run_code and returns the
    #     success and error envelopes; codeSearch exposes get_tool and run_code,
    #     get_tool returns a JavaScript signature, and run_code works.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI tabs (browser only) and the timeout error messages.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    command -v npx >/dev/null || { echo "npx is required for the stdio MCP target"; exit 1; }
    # The page's config reads the key from ./license.key; write the CI secret there.
    umask 077
    printf '%s' "$ENTERPRISE_AGENTGATEWAY_LICENSE_KEY" > license.key
    umask 022
    set_tool_mode() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    mode, settings = sys.argv[1], sys.argv[2] == "True"
    p = pathlib.Path("config.yaml")
    src = re.sub(r"\n  codeModeSettings:\n(    .*\n)+", "\n", p.read_text())
    src, n = re.subn(r"^  toolMode: \w+$", f"  toolMode: {mode}", src, flags=re.M)
    assert n == 1, "toolMode line not found"
    if settings:
        src = src.replace(f"  toolMode: {mode}\n", f"  toolMode: {mode}\n  codeModeSettings:\n    timeout: 1m0s\n    cpuTimeout: 1s\n")
    p.write_text(src)
    PY
      agentgateway --validate-only -f config.yaml
      # The file is watched; give the reload a moment before the next session.
      sleep 3
      # Each session takes the mode in effect when it starts. The runner drops a
      # visible block identical to an earlier one, so the page's own re-initialize
      # step may not run again for every mode: start the new session here too.
      export SESSION_ID=$(curl -sD - -o /dev/null http://localhost:3000/mcp \
        -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"curl","version":"1"}}}' \
        | awk -F': *' 'tolower($1)=="mcp-session-id"{gsub(/\r/,"",$2);print $2}')
      [ -n "$SESSION_ID" ] || { echo "no mcp-session-id after switching to $1"; cat agw.log; exit 1; }
    }
    mcp_call() {
      curl -s http://localhost:3000/mcp \
        -H "Content-Type: application/json" \
        -H "Accept: application/json, text/event-stream" \
        -H "Mcp-Session-Id: $SESSION_ID" \
        -d "$1"
    }
    {{< /doc-test >}}
