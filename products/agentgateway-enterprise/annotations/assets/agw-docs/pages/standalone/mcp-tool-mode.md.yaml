  content: |-
    {{< doc-test paths="tool-mode" >}}
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      license:
        key:
          file: ./license.key
    mcp:
      port: 3000
      toolMode: standard
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["-y", "@modelcontextprotocol/server-everything"]
    EOF
    {{< /doc-test >}}
- after:
