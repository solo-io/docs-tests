  content: |-
    {{< doc-test paths="tool-mode" >}}
    agentgateway -f config.yaml > agw.log 2>&1 &
    AGW_PID=$!
    trap 'kill $AGW_PID 2>/dev/null; rm -f license.key' EXIT
    # The first start downloads server-everything through npx; wait for tools to appear.
    for _ in $(seq 1 90); do
      SESSION_ID=$(curl -sD - -o /dev/null -m 5 http://localhost:3000/mcp \
        -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' \
        | awk -F': *' 'tolower($1)=="mcp-session-id"{gsub(/\r/,"",$2);print $2}') || true
      if [ -n "$SESSION_ID" ]; then
        tools=$(mcp_call '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}') || true
        grep -q '"name":"echo"' <<<"$tools" && break
      fi
      sleep 2
    done
    grep -q '"name":"echo"' <<<"$tools" \
      || { echo "MCP target did not come up"; cat agw.log; exit 1; }
    {{< /doc-test >}}
