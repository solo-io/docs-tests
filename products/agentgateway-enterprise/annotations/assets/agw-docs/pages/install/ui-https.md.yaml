       YAMLTest -f - <<'EOF'
       - name: the https Gateway is programmed
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: agentgateway-system
               name: https
           jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
- after:
    block: 10
