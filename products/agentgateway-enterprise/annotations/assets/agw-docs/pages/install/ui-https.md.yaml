  content: |2-
       {{< doc-test paths="enterprise-ui-https" >}}
       HTTPS_IP=""
       for i in $(seq 1 60); do
         HTTPS_IP=$(kubectl get service https -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
         [ -n "$HTTPS_IP" ] && break
         sleep 5
       done
       code=""
       for i in $(seq 1 30); do
         code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$UI_HOST:443:$HTTPS_IP" "https://$UI_HOST/" || true)
         echo "$code" | grep -Eq '^[23][0-9][0-9]$' && break
         sleep 5
       done
       echo "UI over HTTPS returned: $code"
       echo "$code" | grep -Eq '^[23][0-9][0-9]$'
       {{< /doc-test >}}
