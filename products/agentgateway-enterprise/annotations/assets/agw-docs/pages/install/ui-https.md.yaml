  content: |2-
       {{< doc-test paths="enterprise-ui-https" >}}
       # ============================================================================
       # Doc test coverage for "Expose the UI via HTTPS" (not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Steps 1 and 2: the HTTPS Gateway and the UI HTTPRoute are accepted, the
       #     Gateway gets a LoadBalancer address, and an HTTPS request for $UI_HOST
       #     through that address reaches the UI.
       #   * Cleanup step 1.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Real DNS and a trusted certificate: a self-signed certificate for
       #     $UI_HOST is created here and curl uses --resolve and -k.
       #   * Steps 3 to 5 (IdP and UI settings): need an external identity provider.
       openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$UI_HOST" \
         -addext "subjectAltName=DNS:$UI_HOST" -keyout tls.key -out tls.crt
       kubectl create secret tls https -n {{< reuse "agw-docs/snippets/namespace.md" >}} --cert=tls.crt --key=tls.key \
         --dry-run=client -o yaml | kubectl apply -f -
       {{< /doc-test >}}
