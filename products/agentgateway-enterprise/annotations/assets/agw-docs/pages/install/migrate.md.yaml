       kubectl wait --for=delete gateway/agentgateway-proxy -n agentgateway-system --timeout=120s
       kubectl apply -f- <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: Gateway
       metadata:
         name: agentgateway-proxy
         namespace: agentgateway-system
       spec:
         gatewayClassName: agentgateway
         listeners:
         - protocol: HTTP
           port: 80
           name: http
           allowedRoutes:
