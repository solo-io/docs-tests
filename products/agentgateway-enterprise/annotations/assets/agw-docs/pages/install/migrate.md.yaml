  content: |-
    {{< doc-test paths="enterprise-migrate" >}}
    # ============================================================================
    # Doc test coverage for "Migrate from open source" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Start state (hidden): agentgateway OSS (OSS_VERSION) in agentgateway-system,
    #     an `agentgateway` Gateway, and httpbin that returns 200 through it.
    #   * Step 1: CRD ownership transfer, enterprise CRDs and control plane in
    #     agentgateway-enterprise-system, both GatewayClasses accepted.
    #   * Step 2, Option A (canary): enterprise Gateway, dual-parent route, a 200
    #     through the enterprise Gateway, route cut-over, OSS Gateway deleted.
    #   * Step 2, Option B (in-place): on a hidden second OSS Gateway, both patch
    #     commands; the Gateway is programmed by the enterprise class.
    #   * Step 3: OSS uninstall and GatewayClass delete; traffic still returns 200.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The license export placeholder (CI provides AGENTGATEWAY_LICENSE_KEY).
    #   * Port-forward blocks and the endless `kubectl run curl-test` loop.
    # Bump OSS_VERSION to the open source release that the enterprise n-patch
    # builds on when it moves.
    export OSS_VERSION=1.7.0
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{< reuse "agw-docs/versions/k8s-gw-version.md" >}}/standard-install.yaml
    helm upgrade -i agentgateway-crds oci://cr.agentgateway.dev/charts/agentgateway-crds \
      --create-namespace -n agentgateway-system --version v${OSS_VERSION}
    helm upgrade -i agentgateway oci://cr.agentgateway.dev/charts/agentgateway \
      -n agentgateway-system --version v${OSS_VERSION} --wait --timeout 5m
    kubectl wait --for=condition=Accepted gatewayclass/agentgateway --timeout=120s
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: agentgateway-proxy
      namespace: agentgateway-system
    spec:
      gatewayClassName: agentgateway
      listeners:
      - protocol: HTTP
        port: 80
        name: http
        allowedRoutes:
          namespaces:
            from: All
    EOF
    kubectl apply -f https://raw.githubusercontent.com/kgateway-dev/kgateway/refs/heads/main/examples/httpbin.yaml
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: httpbin
      namespace: httpbin
    spec:
      parentRefs:
      - name: agentgateway-proxy
        namespace: agentgateway-system
      hostnames:
      - "www.example.com"
      rules:
      - backendRefs:
        - name: httpbin
          port: 8000
    EOF
    kubectl -n httpbin rollout status deploy/httpbin --timeout=300s
    kubectl wait --for=condition=Programmed gateway/agentgateway-proxy -n agentgateway-system --timeout=300s
    for i in $(seq 1 60); do
      OSS_ADDR=$(kubectl get svc -n agentgateway-system agentgateway-proxy -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
      [ -n "$OSS_ADDR" ] && [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${OSS_ADDR}/headers" -H "host: www.example.com")" = "200" ] && break
      sleep 5
    done
    [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${OSS_ADDR}/headers" -H "host: www.example.com")" = "200" ]
    {{< /doc-test >}}
