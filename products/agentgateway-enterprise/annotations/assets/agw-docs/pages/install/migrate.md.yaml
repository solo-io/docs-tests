       {{< doc-test paths="enterprise-migrate" >}}
       [ "$(kubectl get gateway agentgateway-proxy -n agentgateway-system -o jsonpath='{.spec.gatewayClassName}')" = "{{< reuse "agw-docs/snippets/gatewayclass.md" >}}" ]
       # A Programmed=True left over from the OSS controller would pass a plain
       # wait, so require the condition for the patched generation.
       for i in $(seq 1 60); do
         GEN=$(kubectl get gateway agentgateway-proxy -n agentgateway-system -o jsonpath='{.metadata.generation}')
         OG=$(kubectl get gateway agentgateway-proxy -n agentgateway-system -o jsonpath="{.status.conditions[?(@.type=='Programmed')].observedGeneration}")
         ST=$(kubectl get gateway agentgateway-proxy -n agentgateway-system -o jsonpath="{.status.conditions[?(@.type=='Programmed')].status}")
         [ "$OG" = "$GEN" ] && [ "$ST" = "True" ] && break
         sleep 5
       done
       [ "$OG" = "$GEN" ] && [ "$ST" = "True" ]
       kubectl -n agentgateway-system rollout status deploy/agentgateway-proxy --timeout=300s
       {{< /doc-test >}}
