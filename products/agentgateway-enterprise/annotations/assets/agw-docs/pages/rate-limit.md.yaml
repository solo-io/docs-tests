    fingerprint: 02e1b4e88350f307
    lang: yaml
    lines: 16c71da1 88b9492f c548623c 8c8c4228 e4c5685b 0bebd850 36184fa5 588a5d84 b5a028c9 cd44d8cd 89b06424 e4f6a86d 065d53f7 c14c1813 2ed67d95 1cd7398a abc56510
    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="llm-rate-limit-enterprise" >}}
       # ============================================================================
       # Doc test coverage for the LLM rate limiting guide (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Agentgateway rate limit": the RateLimitConfig and the Gateway-wide policy
       #     apply and are accepted; in a fresh one-minute window, 5 requests to /openai
       #     return 200 and the 6th returns 429.
       #   * "LLM provider rate limit": the HTTPRoute-level policy is accepted; in a fresh
       #     window, 2 requests return 200 and the 3rd returns 429. The Gateway-wide policy
       #     from the previous section stays in place, as on the page, so this also checks
       #     that the route-level policy takes precedence.
       #   * "Token-based rate limit": the replaced RateLimitConfig is accepted; the first
       #     request with X-User-ID succeeds, and repeated requests are then rate limited.
       #   * "CEL-based rate limit": the CEL policy is accepted; with `x-user: me`, 1 request
       #     returns 200 and the 2nd returns 429.
       #   * Cleanup runs.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The visible curl commands. The "Cloud Provider LoadBalancer" tabs send to port
       #     8080, but the agentgateway-proxy listener is on port 80, so the same requests
       #     are sent here on port 80. The port-forward tabs need a port-forward.
       #   * Live OpenAI completions: the openai backend is patched to the in-cluster mock
       #     LLM by the openai-setup prerequisite.
       #   * The exact token count for the token limit. The mock LLM reports its own usage,
       #     so the check allows up to 20 requests before the 429.
       #   * Global limits use fixed windows aligned to the clock minute, so each exact count
       #     check starts at the beginning of a new window.
       llm_status() {
         curl -s -o /dev/null -w "%{http_code}" "http://${INGRESS_GW_ADDRESS}:80/openai" \
           -H content-type:application/json "$@" \
           -d '{"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Hi"}]}'
       }
       # Accepted status can land before the proxy enforces the limit. Send a request every
       # 2 seconds until one is rate limited (at most 90 seconds, so at least one full window).
       wait_enforced() {
         for attempt in $(seq 1 45); do
           if [ "$(llm_status "$@")" = "429" ]; then return 0; fi
           sleep 2
         done
         echo "the rate limit was never enforced"; return 1
       }
       # Start a fresh window, send LIMIT requests that must succeed, then one that must not.
       check_window() {
         limit=$1; shift
         sleep $((61 - 10#$(date +%S)))
         for i in $(seq 1 "$limit"); do
           status=$(llm_status "$@")
           if [ "$status" != "200" ]; then echo "request $i: expected 200, got $status"; return 1; fi
         done
         status=$(llm_status "$@")
         if [ "$status" != "429" ]; then echo "request $((limit + 1)): expected 429, got $status"; return 1; fi
         echo "first $limit requests returned 200, request $((limit + 1)) returned 429"
       }
       YAMLTest -f - <<'EOF'
       - name: the global-rate-limit policy is accepted
         wait:
           target:
             kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
             metadata:
               namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
               name: global-rate-limit
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
