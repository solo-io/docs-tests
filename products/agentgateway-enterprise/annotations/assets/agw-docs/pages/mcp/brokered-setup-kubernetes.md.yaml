  content: |2-
       {{< doc-test paths="mcp-elicitation-brokered-setup" >}}
       # ============================================================================
       # Doc test coverage for "Set up brokered elicitation" (comments not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Keycloak (downstream-mcp realm) behind a cloud-provider-kind
       #     LoadBalancer, STS + OAuth issuer Helm overlay, the issuer route and
       #     JWKS backend, the Everything MCP server, and the EnterpriseAgentgateway
       #     backend + route are applied, roll out, and are Accepted.
       #   * Issuer discovery through the gateway, the 401 challenge, protected
       #   resource metadata, and authorization server metadata, with exact values.
       #   * Dynamic client registration accepts an allowlisted Inspector callback
       #     and rejects one that is not on the allowlist.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The "Cloud Provider LoadBalancer" tab's https:// GATEWAY_URL: the CI
       #     Gateway has a plain HTTP listener, so this test uses http:// instead.
       #   * The port-forward tab: CI allows no port-forward.
       #   * Clean up: needs a hand edit of the Helm values file; later scenarios
       #     chain this page and need the shared resources.
       # The helpers below stand in for the browser in the brokered pages that
       # chain this one: kc_form_login posts a Keycloak login form, and
       # follow_redirects_until walks a redirect chain until a URL prefix.
       kc_form_login() {
         local url="$1" user="$2" pass="$3" jar="$4" page action
         page=$(curl -sS -c "$jar" -b "$jar" "$url")
         action=$(printf '%s' "$page" | { grep -o 'action="[^"]*login-actions/authenticate[^"]*"' || true; } | head -1 \
           | sed -e 's/^action="//' -e 's/"$//' -e 's/&amp;/\&/g')
         if [ -z "$action" ]; then
           echo "no Keycloak login form at $url" >&2
           printf '%s\n' "$page" | head -40 >&2
           return 1
         fi
         curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" \
           --data-urlencode "username=$user" --data-urlencode "password=$pass" \
           --data-urlencode "credentialId=" "$action"
       }
       follow_redirects_until() {
         local prefix="$1" url="$2" jar="$3" i
         for i in $(seq 1 10); do
           case "$url" in "$prefix"*) printf '%s' "$url"; return 0;; esac
           url=$(curl -sS -o /dev/null -w '%{redirect_url}' -c "$jar" -b "$jar" "$url")
           if [ -z "$url" ]; then echo "redirect chain ended before reaching $prefix" >&2; return 1; fi
         done
         echo "too many redirects before $prefix" >&2
         return 1
       }
       query_param() {
         python3 -c 'import sys,urllib.parse as u; print(u.parse_qs(u.urlparse(sys.argv[1]).query)[sys.argv[2]][0])' "$1" "$2"
       }
       urlenc() { jq -rn --arg v "$1" '$v|@uri'; }
       pkce_pair() {
         PKCE_VERIFIER=$(openssl rand -hex 32)
         PKCE_CHALLENGE=$(printf '%s' "$PKCE_VERIFIER" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
       }
       # Hidden equivalent of the LoadBalancer tab, over plain HTTP.
       kubectl -n {{< reuse "agw-docs/snippets/namespace.md" >}} wait --for=jsonpath='{.status.loadBalancer.ingress}' "service/$GATEWAY_NAME" --timeout=120s
       export INGRESS_GW_ADDRESS=$(kubectl get svc -n {{< reuse "agw-docs/snippets/namespace.md" >}} "$GATEWAY_NAME" -o json | jq -r '.status.loadBalancer.ingress[0] | .hostname // .ip')
       export GATEWAY_URL="http://${INGRESS_GW_ADDRESS}"
       echo "$GATEWAY_URL"
       {{< /doc-test >}}
