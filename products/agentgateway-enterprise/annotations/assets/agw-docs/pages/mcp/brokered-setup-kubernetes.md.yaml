  content: |2-
       {{< doc-test paths="mcp-elicitation-brokered-setup" >}}
       # The 401 challenge points at the protected resource metadata.
       HDRS=$(curl -s -o /dev/null -D - "${GATEWAY_URL}/mcp")
       grep -q '^HTTP/[0-9.]* 401' <<<"$HDRS" || { echo "FAIL: expected 401" >&2; echo "$HDRS" >&2; exit 1; }
       grep -qi "^www-authenticate: Bearer resource_metadata=\"${GATEWAY_URL}/.well-known/oauth-protected-resource/mcp\"" <<<"$HDRS" \
         || { echo "FAIL: www-authenticate does not name the resource metadata" >&2; echo "$HDRS" >&2; exit 1; }
       PRM=$(curl -fsS "${GATEWAY_URL}/.well-known/oauth-protected-resource/mcp")
       [ "$(jq -r .resource <<<"$PRM")" = "${GATEWAY_URL}/mcp" ] || { echo "FAIL: resource" >&2; echo "$PRM" >&2; exit 1; }
       [ "$(jq -r '.authorization_servers[0]' <<<"$PRM")" = "${GATEWAY_URL}/mcp" ] || { echo "FAIL: authorization_servers" >&2; echo "$PRM" >&2; exit 1; }
       ASM=$(curl -fsS "${GATEWAY_URL}/.well-known/oauth-authorization-server/mcp")
       [ "$(jq -r .issuer <<<"$ASM")" = "${GATEWAY_URL}/mcp" ] || { echo "FAIL: issuer" >&2; echo "$ASM" >&2; exit 1; }
       [ "$(jq -r .authorization_endpoint <<<"$ASM")" = "${GATEWAY_URL}/oauth-issuer/authorize" ] || { echo "FAIL: authorization_endpoint" >&2; echo "$ASM" >&2; exit 1; }
       [ "$(jq -r .registration_endpoint <<<"$ASM")" = "${GATEWAY_URL}/oauth-issuer/register" ] || { echo "FAIL: registration_endpoint" >&2; echo "$ASM" >&2; exit 1; }
       # Dynamic client registration: an allowlisted Inspector callback is accepted,
       # and a callback that is not on the allowlist is rejected. Loopback callbacks
       # match on any port (RFC 8252), so the rejected one differs by path.
       DCR=$(curl -fsS -X POST "${GATEWAY_URL}/oauth-issuer/register" -H 'Content-Type: application/json' \
         -d '{"client_name":"doc-test","redirect_uris":["http://localhost:6274/oauth/callback"]}')
       [ "$(jq -r .client_id <<<"$DCR")" = "${ISSUER_CLIENT_ID}" ] || { echo "FAIL: DCR client_id" >&2; echo "$DCR" >&2; exit 1; }
       DCR_BAD=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${GATEWAY_URL}/oauth-issuer/register" -H 'Content-Type: application/json' \
         -d '{"client_name":"doc-test","redirect_uris":["http://localhost:6274/not-allowlisted/callback"]}')
       [ "$DCR_BAD" = "400" ] || { echo "FAIL: unlisted redirect_uri returned $DCR_BAD, want 400" >&2; exit 1; }
       {{< /doc-test >}}
