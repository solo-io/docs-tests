       {{< doc-test paths="mcp-elicitation-interactive-github" >}}
       # ============================================================================
       # Doc test coverage for "Elicit a GitHub credential" (comments not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The namespace, client Secret, GitHub MCP backend, interactive policy
       #     (Accepted and Attached), and route (Accepted, ResolvedRefs).
       #   * The elicitation challenge: initialize with user1's token returns 400
       #     with the CALLBACK_URL from setup, before any traffic reaches GitHub.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The UI approval, the GitHub OAuth login, and the retry with the stored
       #     credential (initialize 200, session ID, get_me): these need a browser,
       #     a GitHub OAuth app, and a GitHub account. The OAuth client values here
       #     are dummies.
       for i in $(seq 1 30); do
         IG_RESP=$(curl -s -w '\n%{http_code}' "$MCP_URL" \
           -H "Authorization: Bearer $USER_TOKEN" -H 'Content-Type: application/json' \
           -H 'Accept: application/json, text/event-stream' \
           -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"doc-test-interactive","version":"1.0"}}}')
         [ "$(tail -n1 <<<"$IG_RESP")" = "400" ] && break
         sleep 2
       done
       [ "$(tail -n1 <<<"$IG_RESP")" = "400" ] || { echo "FAIL: expected 400" >&2; echo "$IG_RESP" >&2; exit 1; }
       [ "$(sed '$d' <<<"$IG_RESP" | jq -r .url)" = "http://localhost:8090/elicitations" ] \
         || { echo "FAIL: challenge URL" >&2; echo "$IG_RESP" >&2; exit 1; }
       {{< /doc-test >}}
