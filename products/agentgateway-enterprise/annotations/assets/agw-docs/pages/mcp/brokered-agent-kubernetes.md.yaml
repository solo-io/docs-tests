- after:
    block: 9
    fingerprint: e7fb036a42f0b0cf
    lang: sh
    lines: 5440dc77 4877c191 67c5a3ac 4347ff3f af835a62
    preview: curl -s -i -X POST "${GATEWAY_URL}/mcp/agent" \
  content: |2-
       {{< doc-test paths="mcp-elicitation-brokered-agent" >}}
       # ============================================================================
       # Doc test coverage for "Agent (upstream-only)" (comments not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The upstream-mcp realm and local-agent client through the Keycloak
       #     admin API, the agent's password-grant token, and the backend, policy,
       #     and route (Accepted and Attached).
       #   * The first initialize returns 400 with an upstream-mcp authorization
       #     URL whose redirect_uri is the issuer's upstream callback.
       #   * The browser step without a browser: the upstream Keycloak login form is
       #     posted with curl, and the issuer callback answers "Authorization
       #     complete". The retry then opens a session and the Echo tool answers.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A real browser, and the Clean up section (not needed in a fresh cluster).
       for i in $(seq 1 30); do
         AGENT_RESP=$(curl -s -w '\n%{http_code}' -X POST "${GATEWAY_URL}/mcp/agent" \
           -H "Authorization: Bearer ${AGENT_TOKEN}" -H "Content-Type: application/json" \
           -H "Accept: application/json, text/event-stream" \
           -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"doc-test-agent","version":"1"}}}')
         [ "$(tail -n1 <<<"$AGENT_RESP")" = "400" ] && break
         sleep 2
       done
       [ "$(tail -n1 <<<"$AGENT_RESP")" = "400" ] || { echo "FAIL: expected 400" >&2; echo "$AGENT_RESP" >&2; exit 1; }
       UPSTREAM_AUTH_URL=$(sed '$d' <<<"$AGENT_RESP" | jq -er .url)
       case "$UPSTREAM_AUTH_URL" in
         "${UPSTREAM_ISSUER}/protocol/openid-connect/auth?"*) ;;
         *) echo "FAIL: URL does not point to the upstream-mcp realm: $UPSTREAM_AUTH_URL" >&2; exit 1 ;;
       esac
       [ "$(query_param "$UPSTREAM_AUTH_URL" redirect_uri)" = "${GATEWAY_URL}/oauth-issuer/callback/upstream" ] \
         || [ "$(query_param "$UPSTREAM_AUTH_URL" redirect_uri)" = "${GATEWAY_URL}:80/oauth-issuer/callback/upstream" ] \
         || { echo "FAIL: redirect_uri $(query_param "$UPSTREAM_AUTH_URL" redirect_uri)" >&2; exit 1; }
       # Stand-in for steps 2 and 3: sign in to the upstream realm as alice.
       JAR=$(mktemp)
       UPSTREAM_CB=$(kc_form_login "$UPSTREAM_AUTH_URL" alice alice-upstream-password "$JAR")
       case "$UPSTREAM_CB" in
         *"/oauth-issuer/callback/upstream?"*) ;;
         *) echo "FAIL: upstream login did not return to the issuer: $UPSTREAM_CB" >&2; exit 1 ;;
       esac
       curl -fsS -L -b "$JAR" -c "$JAR" "$UPSTREAM_CB" | grep 'Authorization complete' >/dev/null \
         || { echo "FAIL: callback did not show Authorization complete" >&2; exit 1; }
       {{< /doc-test >}}
