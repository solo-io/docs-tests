  content: |2-
       {{< doc-test paths="mcp-elicitation-brokered-consent" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for EnterpriseAgentgatewayPolicy mcp-atlassian-elicit Accepted
         wait:
           target:
             kind: EnterpriseAgentgatewayPolicy
             metadata:
               namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
               name: mcp-atlassian-elicit
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: wait for EnterpriseAgentgatewayPolicy mcp-atlassian-elicit Attached
         wait:
           target:
             kind: EnterpriseAgentgatewayPolicy
             metadata:
               namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
               name: mcp-atlassian-elicit
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Attached')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: wait for HTTPRoute mcp-atlassian Accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
               name: mcp-atlassian
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       for i in $(seq 1 30); do
         [ "$(curl -s -o /dev/null -w '%{http_code}' "${GATEWAY_URL}/.well-known/oauth-protected-resource/mcp/atlassian")" = "200" ] && break
         sleep 2
       done
       PRM=$(curl -fsS "${GATEWAY_URL}/.well-known/oauth-protected-resource/mcp/atlassian")
       [ "$(jq -r .resource <<<"$PRM")" = "${GATEWAY_URL}/mcp/atlassian" ] || { echo "FAIL: resource" >&2; echo "$PRM" >&2; exit 1; }
       JAR=$(mktemp)
       REDIRECT_URI="http://127.0.0.1:6274/oauth/callback"
       pkce_pair
       AUTH_URL="${GATEWAY_URL}/oauth-issuer/authorize?client_id=${ISSUER_CLIENT_ID}&response_type=code&state=doc-test-consent&redirect_uri=$(urlenc "$REDIRECT_URI")&code_challenge=${PKCE_CHALLENGE}&code_challenge_method=S256&resource=$(urlenc "${GATEWAY_URL}/mcp/atlassian")"
       KC_PAGE=$(follow_redirects_until "${KEYCLOAK_ISSUER}/" "$AUTH_URL" "$JAR")
       AFTER_LOGIN=$(kc_form_login "$KC_PAGE" alice alice-password "$JAR")
       CONSENT_URL=$(follow_redirects_until "${GATEWAY_URL}/oauth-issuer/consent" "$AFTER_LOGIN" "$JAR")
       CONSENT_PAGE=$(curl -fsS -b "$JAR" "$CONSENT_URL")
       for want in 'Acme AI Gateway powered by Solo Enterprise for agentgateway' \
                   'read your Jira issues and Confluence pages on your behalf' \
                   'Atlassian-horizontal-blue-rgb.svg' \
                   'name="decision" value="allow"'; do
         grep -qF "$want" <<<"$CONSENT_PAGE" || { echo "FAIL: consent page lacks: $want" >&2; echo "$CONSENT_PAGE" | head -60 >&2; exit 1; }
       done
       {{< /doc-test >}}
