  content: |2-
       {{< doc-test paths="mcp-elicitation-brokered-consent" >}}
       # ============================================================================
       # Doc test coverage for "MCP consent screen" (comments not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Step 1: the consent settings merged into brokered-values.yaml (hidden
       #     equivalent of the hand edit) and the Helm upgrade.
       #   * Step 2: the Atlassian backend, policy (Accepted and Attached), and
       #     route, and the resource's protected resource metadata.
       #   * Step 3 up to the consent screen without a browser: registration, PKCE
       #     authorize for /mcp/atlassian, the Keycloak login as alice, and the
       #     redirect to the gateway's consent page, which shows the issuer's
       #     platform name and the backend's legal text and logo overrides.
       #   * Step 4: the opt-out policy is created.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Continue on the consent page and the Atlassian authorization: needs an
       #     Atlassian account. MCP Inspector: no browser in CI.
       #   * Step 4 has no mcp-internal backend, so the policy's status is not checked.
       python3 - <<'PY'
       import json, yaml
       with open("brokered-values.yaml") as f:
           values = yaml.safe_load(f)
       env = values["controller"]["extraEnv"]
       cfg = json.loads(env["KGW_OAUTH_ISSUER_CONFIG"])
       cfg["consent"] = {
           "enabled": True,
           "force_refresh": False,
           "platform_name": "Acme AI Gateway powered by Solo Enterprise for agentgateway",
           "logo_url": "https://agentgateway.dev/agw-dark.svg",
           "legal_text": "By clicking Continue, you authorize Acme AI Gateway to act on your behalf against the selected upstream service. Acme will store an access token tied to your identity until it is revoked or expires.",
       }
       env["KGW_OAUTH_ISSUER_CONFIG"] = json.dumps(cfg, indent=2)
       with open("brokered-values.yaml", "w") as f:
           yaml.safe_dump(values, f, sort_keys=False)
       PY
       # The visible upgrade below is textually identical to the brokered setup's,
       # so the extractor drops it as a duplicate; this copy applies the consent values.
       helm upgrade -i {{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} oci://{{< reuse "agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} \
         -n {{< reuse "agw-docs/snippets/namespace.md" >}} --version {{< reuse "agw-docs/versions/helm-version-flag.md" >}} \
         -f values.yaml -f brokered-values.yaml
       kubectl -n {{< reuse "agw-docs/snippets/namespace.md" >}} rollout status deployment/{{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} --timeout=300s
       kubectl -n {{< reuse "agw-docs/snippets/namespace.md" >}} get deploy {{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} -o json | grep 'Acme AI Gateway powered by' >/dev/null
       {{< /doc-test >}}
