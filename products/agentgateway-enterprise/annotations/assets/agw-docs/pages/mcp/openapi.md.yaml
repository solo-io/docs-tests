  content: |2-
       {{< doc-test paths="mcp-openapi" >}}
       # The visible steps use a port-forward and a <session-id> placeholder, so run the
       # same initialize and tools/list calls through the gateway's LoadBalancer address.
       MCP_URL="http://${INGRESS_GW_ADDRESS}/mcp"
       SID=""
       for attempt in $(seq 1 30); do
         SID=$(curl -s --max-time 10 -D - -o /dev/null "$MCP_URL" \
           -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
           -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' \
           | awk -F': *' 'tolower($1)=="mcp-session-id"{gsub(/\r/,"",$2);print $2}')
         [ -n "$SID" ] && break
         sleep 5
       done
       [ -n "$SID" ] || { echo "no mcp-session-id from $MCP_URL"; exit 1; }
       curl -s --max-time 10 "$MCP_URL" -H "Mcp-Session-Id: $SID" \
         -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
         -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' >/dev/null || true
       LIST=$(curl -s --max-time 30 "$MCP_URL" -H "Mcp-Session-Id: $SID" \
         -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
         -d '{"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}')
       echo "$LIST"
       for tool in findPets addPet findPetById deletePet; do
         grep -q "\"name\":\"$tool\"" <<<"$LIST" || { echo "tool $tool missing from tools/list"; exit 1; }
       done
       # Call one converted operation end to end, so the REST call through the gateway is covered too.
       CALL=$(curl -s --max-time 30 "$MCP_URL" -H "Mcp-Session-Id: $SID" \
         -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
         -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"findPets","arguments":{}}}')
       echo "$CALL"
       grep -q '"isError":false' <<<"$CALL"
       # The visible cleanup also deletes a CORS policy that this guide never creates
       # (it sits in a commented-out section), so clean up with --ignore-not-found here.
       kubectl delete httproute openapi-mcp -n default --ignore-not-found
       kubectl delete enterpriseagentgatewaybackend petstore-openapi -n default --ignore-not-found
       kubectl delete configmap petstore-schema -n default --ignore-not-found
       kubectl delete deployment petstore -n default --ignore-not-found
       kubectl delete svc petstore -n default --ignore-not-found
       {{< /doc-test >}}
