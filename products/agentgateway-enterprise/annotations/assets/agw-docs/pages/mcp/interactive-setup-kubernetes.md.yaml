  content: |2-
       {{< doc-test paths="mcp-elicitation-interactive-setup" >}}
       # Test-only CPU request overrides, appended under the ui: key. The CI kind
       # node has 2 CPUs and is already full, and ClickHouse alone requests 2 CPUs
       # by default, so ClickHouse and the next controller rollout stayed Pending.
       cat >> solo-ui-values.yaml <<'EOF'
         clickhouse:
           resources:
             requests:
               cpu: 50m
               memory: 1Gi
         telemetry:
           k8sobjects:
             resources:
               requests:
                 cpu: 50m
           collector:
             resources:
               requests:
                 cpu: 50m
       EOF
       {{< /doc-test >}}
