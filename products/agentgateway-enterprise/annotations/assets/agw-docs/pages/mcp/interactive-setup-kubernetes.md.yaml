       GROUPS_CLAIM=$(curl -fsS -X POST "${KEYCLOAK_URL}/realms/agentgateway/protocol/openid-connect/token" \
         -d 'grant_type=password' -d 'client_id=fe-client-1' -d 'username=user1' -d 'password=Password1!' \
         | jq -r '.access_token | split(".")[1] | gsub("-";"+") | gsub("_";"/") | . + ("=" * ((4 - length % 4) % 4)) | @base64d | fromjson | .Groups | join(",")')
       [ "$GROUPS_CLAIM" = "admins" ] || { echo "FAIL: Groups claim is '$GROUPS_CLAIM', want admins" >&2; exit 1; }
       {{< /doc-test >}}
