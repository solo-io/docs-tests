  content: |2-
       {{< doc-test paths="mcp-elicitation-interactive-setup" >}}
       # ============================================================================
       # Doc test coverage for "Set up interactive elicitation" (comments not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Keycloak, the agentgateway realm, fe-client-1, user1, the UI clients,
       #     the admins group, and the Groups client scope, checked by decoding a
       #     user1 token for the Groups claim.
       #   * The STS Helm values, the UI subchart install, and CALLBACK_URL: the
       #     controller rolls out with 7777 on its Service, CALLBACK_URL is set on
       #     the controller, and the UI Deployment rolls out.
       #   * Step 5: the Gateway accepts routes from all namespaces.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Registering a GitHub OAuth app (third-party SaaS; placeholders are
       #     replaced with dummy values that the GitHub guide never sends to GitHub).
       #   * The UI port-forward and browser login (no port-forward or browser in CI).
       kubectl get svc -n {{< reuse "agw-docs/snippets/namespace.md" >}} {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} -o jsonpath='{.spec.ports[*].port}' | tr ' ' '\n' | grep -x 7777 >/dev/null
       kubectl get deploy -n {{< reuse "agw-docs/snippets/namespace.md" >}} {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} \
         -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="CALLBACK_URL")].value}' | grep -x 'http://localhost:8090/elicitations' >/dev/null
       kubectl rollout status deployment/{{< reuse "agw-docs/snippets/solo-ui/ui-service.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} --timeout=600s
       {{< /doc-test >}}
