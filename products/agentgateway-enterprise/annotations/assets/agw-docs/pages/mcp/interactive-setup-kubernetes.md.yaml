  content: |-
    {{< doc-test paths="mcp-elicitation-interactive-setup" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for Gateway agentgateway-proxy Programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: agentgateway-system
            name: agentgateway-proxy
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    kubectl get gateway agentgateway-proxy -n agentgateway-system -o jsonpath='{.spec.listeners[0].allowedRoutes.namespaces.from}' | grep -x All >/dev/null
    {{< /doc-test >}}
