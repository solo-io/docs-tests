- after:
    block: 1
    fingerprint: 75b37bbe874d26a7
    lang: yaml
    lines: 16c71da1 88b9492f c548623c 8c8c4228 2a9ae068 0bebd850 36184fa5 588a5d84 b5a028c9 cd44d8cd 89b06424 e4f6a86d 065d53f7 c14c1813 2ed67d95 959a9fcb abc56510
    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="global-rate-limit-enterprise" >}}
       # ============================================================================
       # Doc test coverage for the global rate limiting guide (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Rate limit by client IP": the RateLimitConfig and the Gateway-wide policy are
       #     accepted; in a fresh one-minute window, 10 requests to /openai return 200 and
       #     the 11th returns 429.
       #   * "Rate limit by user ID": the HTTPRoute-level policy is accepted; with
       #     `x-user-id: alice`, 50 requests return 200 and the 51st returns 429. The IP
       #     policy stays in place, as on the page, so this also checks that the
       #     route-level policy takes precedence over the Gateway-wide one.
       #   * "Combine local and global rate limiting": both policies are accepted; with
       #     `x-user-id: bob`, 50 requests return 200 and the 51st returns 429.
       #   * Cleanup runs.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The visible curl loops. The "Cloud Provider LoadBalancer" tabs send to port 8080,
       #     but the agentgateway-proxy listener is on port 80, so the same requests are sent
       #     here on port 80. The port-forward tabs need a port-forward.
       #   * Live OpenAI completions: the openai-setup prerequisite patches the backend to the
       #     in-cluster mock LLM.
       #   * Global limits use fixed windows aligned to the clock minute, so each count check
       #     starts at the beginning of a new window.
       llm_status() {
         curl -s -o /dev/null -w "%{http_code}" "http://${INGRESS_GW_ADDRESS}:80/openai" \
           -H content-type:application/json "$@" \
           -d '{"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Hi"}]}'
       }
       wait_enforced() {
         for attempt in $(seq 1 150); do
           if [ "$(llm_status "$@")" = "429" ]; then return 0; fi
           sleep 0.3
         done
         echo "the rate limit was never enforced"; return 1
       }
       check_window() {
         limit=$1; shift
         sleep $((61 - 10#$(date +%S)))
         for i in $(seq 1 "$limit"); do
           status=$(llm_status "$@")
           if [ "$status" != "200" ]; then echo "request $i: expected 200, got $status"; return 1; fi
         done
         status=$(llm_status "$@")
         if [ "$status" != "429" ]; then echo "request $((limit + 1)): expected 429, got $status"; return 1; fi
         echo "first $limit requests returned 200, request $((limit + 1)) returned 429"
       }
       YAMLTest -f - <<'EOF'
       - name: the ip-rate-limit policy is accepted
         wait:
           target:
             kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
             metadata:
               namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
               name: ip-rate-limit
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
