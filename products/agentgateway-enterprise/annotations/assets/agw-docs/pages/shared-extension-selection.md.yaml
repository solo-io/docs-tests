  content: |2-
       {{< doc-test paths="shared-extension-selection" >}}
       for attempt in $(seq 1 60); do
         if [ -z "$(kubectl get deployments -n {{< reuse "agw-docs/snippets/namespace.md" >}} -l 'app in (ext-auth-service,rate-limiter,ext-cache,waf-server),gateway.solo.io/gatewayclass=enterprise-agentgateway' -o name)" ]; then break; fi
         sleep 3
       done
       remaining=$(kubectl get deployments -n {{< reuse "agw-docs/snippets/namespace.md" >}} -l 'app in (ext-auth-service,rate-limiter,ext-cache,waf-server),gateway.solo.io/gatewayclass=enterprise-agentgateway' -o name)
       if [ -n "$remaining" ]; then echo "extension Deployments remain after the gateway-only selection: $remaining"; exit 1; fi
       echo "no extension Deployments remain for the gateway-only selection"
       # The page has no cleanup. Restore the default GatewayClass and remove the resource.
       kubectl apply -f- <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: GatewayClass
       metadata:
         name: enterprise-agentgateway
       spec:
         controllerName: solo.io/enterprise-agentgateway
       EOF
       kubectl delete {{< reuse "agw-docs/snippets/gatewayparameters.md" >}} network-scenario -n {{< reuse "agw-docs/snippets/namespace.md" >}} --ignore-not-found
       {{< /doc-test >}}
