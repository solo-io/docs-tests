  content: |-
    {{< doc-test paths="shared-extension-selection" >}}
    # ============================================================================
    # Doc test coverage for choosing shared extensions (not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Before you begin": the GatewayClass and Gateway lookups run.
    #   * "Choose the extensions": the gateway-only EnterpriseAgentgatewayParameters
    #     resource and the GatewayClass update apply, and the controller then removes
    #     every extension Deployment for the enterprise-agentgateway GatewayClass.
    #   * The GatewayClass is restored afterward.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The parameters lookup with `<parameters-name>`: placeholder values. The
    #     gateway prerequisite creates no Gateway-level parameters to inspect.
    #   * The other rows of the table and the Helm value alternative.
    # The extensions exist only after a Gateway uses the class. Wait for the
    # rate limiter that the gateway prerequisite provisions, so that the removal
    # check below starts from deployed extensions.
    for attempt in $(seq 1 60); do
      if [ -n "$(kubectl get deployments -n {{< reuse "agw-docs/snippets/namespace.md" >}} -l 'app in (ext-auth-service,rate-limiter,ext-cache,waf-server),gateway.solo.io/gatewayclass=enterprise-agentgateway' -o name)" ]; then break; fi
      sleep 3
    done
    if [ -z "$(kubectl get deployments -n {{< reuse "agw-docs/snippets/namespace.md" >}} -l 'app in (ext-auth-service,rate-limiter,ext-cache,waf-server),gateway.solo.io/gatewayclass=enterprise-agentgateway' -o name)" ]; then
      echo "no extension Deployments were provisioned for the GatewayClass"; exit 1
    fi
    kubectl get deployments -n {{< reuse "agw-docs/snippets/namespace.md" >}} -l 'app in (ext-auth-service,rate-limiter,ext-cache,waf-server),gateway.solo.io/gatewayclass=enterprise-agentgateway'
    {{< /doc-test >}}
- after:
    block: 4
    fingerprint: a0c377f4b4307514
