  content: |-
    {{< doc-test paths="enterprise-clickhouse" >}}
    # ============================================================================
    # Doc test coverage for "ClickHouse data store" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Enable persistent storage on an existing installation": orphan delete,
    #     upgrade with persistentVolume.enabled, pod delete; the claim binds (kind's
    #     default local-path StorageClass) and the UI re-creates the schema.
    #   * "Data retention": dbctl retention show, set --days 90, set --unlimited.
    #   * "Query data directly": the page's queries, run with --query.
    #   * "Schema initialization": dbctl init and migrate-up re-run cleanly.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * "Keep the bundled data across restarts" on a first install: this cluster
    #     already runs on ephemeral storage, which the page says the chart refuses.
    #   * "Bring your own ClickHouse": needs an external instance.
    # The values file from step 1 of "Keep the bundled data across restarts":
    cat > values.yaml <<'EOF'
    ui:
      clickhouse:
        persistentVolume:
          enabled: true
          size: 20Gi
    EOF
    {{< /doc-test >}}
