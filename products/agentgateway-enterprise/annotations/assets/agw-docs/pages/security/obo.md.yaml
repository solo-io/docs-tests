       {{< doc-test paths="te-delegation" >}}
       # ============================================================================
       # Doc test coverage for "Delegation" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Step 1 with the in-cluster Keycloak from "Keycloak as an IdP" (master
       #     realm). The Keycloak tab's JWKS URI and key commands are placeholders, so
       #     the real values come from that guide's test steps.
       #   * Step 2: the token exchange values are added to the Helm values, the
       #     upgrade succeeds, and the control plane service exposes port 7777.
       #   * Step 3.4: the JWT policy on the static MCP server's route is accepted,
       #     and a request without a token is rejected with 401.
       #   * The RFC 8693 delegation exchange itself, as an agent would send it: from
       #     a pod in the cluster, user1's Keycloak token (subject) and a Kubernetes
       #     service account token (actor) are exchanged at the STS for a token with
       #     the user's `sub` and the service account in the `act` claim.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Steps 3.1 to 3.3 and 3.5: they need an agent built with agentsts-adk and
       #     deployed with kagent, which the guide does not provide. The test sends the
       #     agent's exchange request directly instead.
       #   * A request to the MCP server with the delegated token: the JWT policy
       #     validates the STS issuer against Keycloak's keys, which cannot verify a
       #     token that the STS signed (see the docs bug report).
       test -n "$KEYCLOAK_JWKS_URI" && test -n "$KEYCLOAK_CERT_KEYS" \
         || { echo "run the Keycloak as an IdP steps first"; exit 1; }
       {{< /doc-test >}}
