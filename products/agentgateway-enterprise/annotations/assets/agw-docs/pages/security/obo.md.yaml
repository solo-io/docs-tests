       {{< doc-test paths="te-delegation" >}}
       YAMLTest -f - <<'EOF'
       - name: jwt-policy is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: default
               name: jwt-policy
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: an MCP request without a token is rejected by the JWT policy
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/mcp"
           method: POST
           headers:
             content-type: "application/json"
             accept: "application/json, text/event-stream"
           body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"curl-client","version":"1.0"}}}'
         source:
           type: local
         retries: 15
         expect:
           statusCode: 401
       EOF

       # Delegation, as the agent in step 3.5 would do it. The actor is the default
       # service account in the default namespace.
       ACTOR_SUB="system:serviceaccount:default:default"
       ADMIN_TOKEN=$(curl -fsS -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" \
         "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" | jq -r .access_token)
       KC_CLIENT_UUID=$(curl -fsS -H "Authorization: Bearer ${ADMIN_TOKEN}" \
         "$KEYCLOAK_URL/admin/realms/master/clients?clientId=${KEYCLOAK_CLIENT}" | jq -r '.[0].id')
       # The STS rejects delegation unless the subject token's may_act claim names
       # the actor, which the guide does not set up. Add the claim to the client.
       MAY_ACT_MAPPER=$(jq -n --arg v "{\"sub\":\"${ACTOR_SUB}\"}" '{name: "may_act", protocol: "openid-connect", protocolMapper: "oidc-hardcoded-claim-mapper", config: {"claim.name": "may_act", "claim.value": $v, "jsonType.label": "JSON", "access.token.claim": "true"}}')
       curl -fsS -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" -X POST \
         "$KEYCLOAK_URL/admin/realms/master/clients/${KC_CLIENT_UUID}/protocol-mappers/models" -d "$MAY_ACT_MAPPER"
       SUBJECT_TOKEN=$(curl -fsS -d "client_id=${KEYCLOAK_CLIENT}" -d "client_secret=${KEYCLOAK_SECRET}" \
         -d "username=user1" -d "password=password" -d "grant_type=password" \
         "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" | jq -r .access_token)
       ACTOR_TOKEN=$(kubectl create token default -n default)
       jwt_claims() { python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p))))' "$1"; }
       jwt_claims "$SUBJECT_TOKEN" | jq -e --arg a "$ACTOR_SUB" '.may_act.sub == $a' >/dev/null \
         || { echo "the Keycloak token has no may_act claim for the actor"; exit 1; }
       for attempt in $(seq 1 10); do
         DELEGATION_RESPONSE=$(kubectl run "sts-client-delegation-$attempt" -n default --rm -i --quiet --restart=Never \
           --pod-running-timeout=3m --image=curlimages/curl -- \
           curl -s -X POST "http://{{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}}.{{< reuse "/agw-docs/snippets/namespace.md" >}}.svc.cluster.local:7777/oauth2/token" \
             -H "Content-Type: application/x-www-form-urlencoded" \
             -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
             -d "subject_token=${SUBJECT_TOKEN}" \
             -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
             -d "actor_token=${ACTOR_TOKEN}" \
             -d "actor_token_type=urn:ietf:params:oauth:token-type:jwt" \
             -d "audience=my-mcp-server") || true
         echo "$DELEGATION_RESPONSE" | jq -e '.access_token | length > 0' >/dev/null 2>&1 && break
         sleep 5
       done
       DELEGATED_TOKEN=$(echo "$DELEGATION_RESPONSE" | jq -r '.access_token // empty')
       test -n "$DELEGATED_TOKEN" || { echo "delegation exchange failed: $DELEGATION_RESPONSE"; exit 1; }
       USER_SUB=$(jwt_claims "$SUBJECT_TOKEN" | jq -r .sub)
       jwt_claims "$DELEGATED_TOKEN" | jq -e --arg sub "$USER_SUB" --arg a "$ACTOR_SUB" --arg iss "{{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}}.{{< reuse "/agw-docs/snippets/namespace.md" >}}.svc.cluster.local:7777" \
         '.sub == $sub and .iss == $iss and .act.sub == $a' >/dev/null \
         || { echo "the delegated token does not carry the user's sub, the STS issuer, and the actor in act"; jwt_claims "$DELEGATED_TOKEN"; exit 1; }
       {{< /doc-test >}}
