  content: |-
    {{< doc-test paths="ui-access-control" >}}
    # The page assumes the UI is installed (Before you begin links to its setup).
    # Turn on the UI subchart with its built-in identity provider, and write the
    # Helm values from steps 2 and 3 to the file that step 4 names.
    helm upgrade -i {{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} oci://{{< reuse "agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} \
      --namespace {{< reuse "agw-docs/snippets/namespace.md" >}} \
      --version {{< reuse "agw-docs/versions/helm-version-flag.md" >}} \
      --reset-then-reuse-values \
      --set ui.enabled=true \
      --wait --timeout 10m
    kubectl -n {{< reuse "agw-docs/snippets/namespace.md" >}} rollout status deploy/enterprise-agentgateway-ui --timeout=10m
    cat > ui-rbac-values.yaml <<'EOF'
    ui:
      rbac:
        subjectMapping:
          userClaim: email
          groupsClaim: groups
        roleMapping:
          roleMapper: "has(claims.groups) ? claims.groups.transformList(i, v, v in rolesMap, rolesMap[v]) : []"
          roleMappings:
            platform-admins: global.Admin
            finops: global.Writer
            developers: global.Reader
          defaultRoles:
          - global.Reader
    EOF
    {{< /doc-test >}}
