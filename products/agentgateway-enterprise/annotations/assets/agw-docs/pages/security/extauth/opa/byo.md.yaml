  content: |-
    {{< doc-test paths="extauth-opa-byo" >}}
    # ============================================================================
    # Doc test coverage for the standalone OPA server external auth guide (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The Rego config map, the OPA server Deployment, and the AuthConfig apply, and the
    #     AuthConfig reaches the Accepted state.
    #   * LLM route: without the api-key header the request is denied with 403, the
    #     custom body, and x-opa-decision: denied; with the header it returns 200 and
    #     x-opa-decision: allowed.
    #   * MCP route: initialize is denied without the header; with it, initialize
    #     returns an mcp-session-id and tools/list lists the fetch tool.
    #   * Cleanup runs.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * A live OpenAI completion: the backend is patched to the in-cluster httpbun
    #     mock LLM, so no API key is needed. The OPA decision happens before any
    #     provider call.
    #   * That x-validated-by reaches the upstream and api-key is stripped: the mock
    #     does not echo request headers.
    #   * The Local host / port-forward tabs: CI reaches the gateway via LoadBalancer.
    # The guide's prerequisite MCP server must run in agentgateway-system (the static
    # MCP guide deploys it in default), so deploy it here.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-mock-openai-key}"
    # The hub has no deploy-mock-llm snippet, so the httpbun mock LLM is inlined here.
    kubectl apply -f- <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: httpbun
      namespace: default
      labels:
        app: httpbun
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: httpbun
      template:
        metadata:
          labels:
            app: httpbun
        spec:
          containers:
            - name: httpbun
              image: sharat87/httpbun
              env:
                - name: HTTPBUN_BIND
                  value: "0.0.0.0:3090"
              ports:
                - containerPort: 3090
    EOF
    kubectl apply -f- <<EOF
    apiVersion: v1
    kind: Service
    metadata:
      name: httpbun
      namespace: default
      labels:
        app: httpbun
    spec:
      selector:
        app: httpbun
      ports:
        - protocol: TCP
          port: 3090
          targetPort: 3090
      type: ClusterIP
    EOF
    kubectl rollout status deployment/httpbun -n default --timeout=180s
    kubectl apply -n agentgateway-system -f- <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mcp-website-fetcher
    spec:
      selector:
        matchLabels:
          app: mcp-website-fetcher
      template:
        metadata:
          labels:
            app: mcp-website-fetcher
        spec:
          containers:
          - name: mcp-website-fetcher
            image: ghcr.io/peterj/mcp-website-fetcher:main
            imagePullPolicy: Always
    EOF
    kubectl apply -n agentgateway-system -f- <<EOF
    apiVersion: v1
    kind: Service
    metadata:
      name: mcp-website-fetcher
    spec:
      selector:
        app: mcp-website-fetcher
      ports:
      - port: 80
        targetPort: 8000
        appProtocol: agentgateway.dev/mcp
    EOF
    kubectl rollout status deployment/mcp-website-fetcher -n agentgateway-system --timeout=180s
    {{< /doc-test >}}
