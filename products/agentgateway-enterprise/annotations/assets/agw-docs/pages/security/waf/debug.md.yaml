    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="waf-debug" >}}
       sleep 5
       kubectl rollout status deploy/waf-server-enterprise-agentgateway -n agentgateway-system --timeout=180s
       # The admin server listens on localhost in the pod, which the API server pod
       # proxy cannot reach. The runner does not allow the page's port-forward, so
       # attach an ephemeral curl container, which shares the pod's network namespace.
       WAF_POD=$(kubectl get pod -n agentgateway-system -o name | grep 'waf-server-enterprise-agentgateway' | head -1 | sed 's#^pod/##')
       test -n "$WAF_POD" || { echo "no waf-server pod"; exit 1; }
       kubectl debug -n agentgateway-system "pod/$WAF_POD" --image=curlimages/curl:8.10.1 -c pprof-probe -- sleep 600
       : > /tmp/waf-out.txt
       for i in $(seq 1 30); do
         kubectl exec -n agentgateway-system "$WAF_POD" -c pprof-probe -- curl -s http://127.0.0.1:9095/debug/pprof/ > /tmp/waf-out.txt 2>/dev/null || true
         grep 'goroutine' /tmp/waf-out.txt >/dev/null && break
         sleep 2
       done
       grep -c 'goroutine' /tmp/waf-out.txt
       {{< /doc-test >}}
