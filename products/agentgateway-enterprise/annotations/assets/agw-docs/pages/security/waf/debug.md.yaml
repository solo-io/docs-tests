  content: |-
    {{< doc-test paths="waf-debug" >}}
    kubectl apply -f- <<EOF
    apiVersion: waf.solo.io/v1alpha1
    kind: WAFPolicy
    metadata:
      name: httpbin-waf
      namespace: httpbin
    spec:
      ruleEngineSettings:
        inline: |
          SecRuleEngine On
      customDirectives:
        - inline: |
            SecRule REQUEST_HEADERS:User-Agent "@streq scammer" "deny,status:403,id:107,phase:1,msg:'blocked scammer'"
    ---
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayPolicy
    metadata:
      name: httpbin-waf
      namespace: httpbin
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: httpbin
      traffic:
        entWAF:
          wafPolicyRef:
            name: httpbin-waf
    EOF
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:80/status/200" -H "host: www.example.com" -H "User-Agent: scammer")
      [ "$code" = "403" ] && break
      sleep 2
    done
    echo "got $code"
    [ "$code" = "403" ]
    {{< /doc-test >}}
