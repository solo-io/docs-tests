  content: |2-
       {{< doc-test paths="oauth-entra" >}}
       # Mint an RS256 JWT with the policy's issuer and audience, signed by a key that
       # Entra never published. The policy must reject it on the signature.
       FORGED_KEY=$(mktemp)
       openssl genrsa -out "$FORGED_KEY" 2048 2>/dev/null
       b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
       NOW=$(date +%s)
       JWT_HEADER=$(printf '{"alg":"RS256","typ":"JWT","kid":"doc-test-forged"}' | b64url)
       JWT_BODY=$(printf '{"iss":"https://sts.windows.net/%s/","aud":"api://%s","sub":"doc-test","iat":%s,"exp":%s}' \
         "$ENTRA_TENANT_ID" "$ENTRA_CLIENT_ID" "$NOW" "$((NOW + 600))" | b64url)
       JWT_SIG=$(printf '%s.%s' "$JWT_HEADER" "$JWT_BODY" | openssl dgst -sha256 -sign "$FORGED_KEY" | b64url)
       export FORGED_TOKEN="$JWT_HEADER.$JWT_BODY.$JWT_SIG"
       YAMLTest -f - <<EOF
       - name: a token that Entra did not sign is rejected
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: "application/json"
             authorization: "Bearer ${FORGED_TOKEN}"
           body: '{"model":"","messages":[{"role":"user","content":"forged token"}]}'
         source:
           type: local
         retries: 3
         expect:
           statusCode: 401
       EOF
       {{< /doc-test >}}
