  content: |2-
       {{< doc-test paths="oauth-entra" >}}
       # ============================================================================
       # Doc test coverage for "MS Entra ID as an IdP" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The entra-jwks backend and the JWT policy are accepted, and the policy's
       #     remote JWKS (login.microsoftonline.com) resolves, so the policy is enforced
       #     on the openai route.
       #   * A request without a token is rejected with 401.
       #   * A well-formed RS256 JWT with the policy's issuer and audience, but signed
       #     by a key that is not in the Entra JWKS, is rejected with 401.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * "Register an app in Entra ID", "Expose an API", the client secret, and
       #     `az login`: they need a real Entra tenant and a signed-in user, which CI
       #     does not have. So the test cannot get a token that Entra signed, and the
       #     200 response with a valid token is not checked.
       #   * The request path: the openai prerequisite route matches /openai, so the
       #     checks call /openai instead of /v1/chat/completions.
       # The tenant is Microsoft's multi-tenant `common` alias, whose JWKS endpoint is
       # public. The client ID is a placeholder that no token in this test carries.
       export ENTRA_TENANT_ID="${ENTRA_TENANT_ID:-common}"
       export ENTRA_CLIENT_ID="${ENTRA_CLIENT_ID:-aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee}"
       {{< /doc-test >}}
