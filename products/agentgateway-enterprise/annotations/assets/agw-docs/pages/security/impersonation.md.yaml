  content: |2-
       {{< doc-test paths="te-impersonation" >}}
       # The port-forward and localhost call above are not allowed in CI. Send the
       # same token exchange request from a pod in the cluster to the STS service.
       # The STS can answer "JWKS not available" until it has fetched Keycloak's keys
       # after the Helm upgrade, so retry a few times.
       for attempt in $(seq 1 10); do
         STS_RESPONSE=$(kubectl run "sts-client-impersonation-$attempt" -n default --rm -i --quiet --restart=Never \
           --pod-running-timeout=3m --image=curlimages/curl -- \
           curl -s -X POST "http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/token" \
             -H "Content-Type: application/x-www-form-urlencoded" \
             -H "Accept: application/json" \
             -H "Authorization: Bearer ${USER_TOKEN}" \
             -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
             -d "subject_token=${USER_TOKEN}" \
             -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt") || true
         echo "$STS_RESPONSE" | jq -e '.access_token | length > 0' >/dev/null 2>&1 && break
         sleep 5
       done
       export STS_RESPONSE
       echo "$STS_RESPONSE" | jq -e '.access_token | length > 0' >/dev/null \
         || { echo "STS token exchange failed: $STS_RESPONSE"; exit 1; }
       {{< /doc-test >}}
