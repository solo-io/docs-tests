    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="te-impersonation" >}}
    # ============================================================================
    # Doc test coverage for "Impersonation" (these comments are not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Keycloak (in the cluster) gets the agentgateway realm, the fe-client-1
    #     client, and user1, and the STS is enabled with Helm against that realm's
    #     JWKS.
    #   * The EnterpriseAgentgatewayParameters and the updated Gateway are accepted,
    #     and the proxy rolls out with the STS_URI and STS_AUTH_TOKEN settings.
    #   * "Test the STS server locally", run from a pod in the cluster instead of a
    #     port-forward: the STS exchanges user1's Keycloak token for a token with the
    #     same `sub`, the STS issuer, and no `act` claim.
    #   * The impersonation policy on the static MCP server's backend is accepted. An
    #     MCP initialize without a token fails, and with user1's token it succeeds,
    #     because the gateway exchanged the token through the STS.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * "Open the Keycloak URL" and the debug-logging port-forward: CI has no
    #     browser and allows no port-forward.
    #   * That the MCP server received the STS-minted token rather than the original:
    #     the sample MCP server does not echo request headers.
    kubectl rollout status deployment/agentgateway-proxy -n agentgateway-system --timeout=300s
    kubectl get deployment agentgateway-proxy -n agentgateway-system -o json \
      | jq -e '[.spec.template.spec.containers[].env[]? | select(.name == "STS_URI")] | length > 0' >/dev/null \
      || { echo "the proxy deployment did not pick up STS_URI from agw-params"; exit 1; }
    YAMLTest -f - <<'EOF'
    - name: agentgateway-proxy is programmed with agw-params
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: agentgateway-system
            name: agentgateway-proxy
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 180
          intervalSeconds: 3
    EOF
    {{< /doc-test >}}
- after:
    block: 7
    fingerprint: fecd70fbd82c9d05
