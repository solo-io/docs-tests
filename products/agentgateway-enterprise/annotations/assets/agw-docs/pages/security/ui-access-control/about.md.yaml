    {{< doc-test paths="enterprise-ui-access-control-about" >}}
    # ============================================================================
    # Doc test coverage for "About UI access control" (these comments are not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Sample policies": all four policies apply, and in fine-grained mode the
    #     UI accepts each one, so every resource key, access level, and constraint
    #     attribute in the samples is one the UI knows. The schema check covers the
    #     field names; only the UI catches a wrong resource key or attribute.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * What each user can see: needs a browser and an IdP with real groups.
    #   * The principals fragment: it is a partial spec, not a resource.
    # Mirror of the four visible tab blocks above.
    kubectl apply -f- <<EOF
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayRBACPolicy
    metadata:
      name: admins
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      principals:
      - all:
        - attribute: groups
          values: [platform-admins]
      grants:
      - name: everything
        resource: "agentgateway:*"
        accessLevel: manage
    ---
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayRBACPolicy
    metadata:
      name: team-a-routes
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      principals:
      - all:
        - attribute: groups
          values: [team-a]
      grants:
      - name: routes
        resource: agentgateway:httproutes
        accessLevel: view
        constraints:
        - all:
          - attribute: namespace
            values: [team-a]
    ---
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayRBACPolicy
    metadata:
      name: finops
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      principals:
      - all:
        - attribute: groups
          values: [finops]
      grants:
      - name: budgets
        resource: agentgateway:budgets
        accessLevel: manage
      - name: budget-entries
        resource: agentgateway:budgets:entries
        accessLevel: view
    ---
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayRBACPolicy
    metadata:
      name: team-a-keys
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      principals:
      - all:
        - attribute: groups
          values: [team-a-leads]
      grants:
      - name: keys
        resource: agentgateway:virtual-keys
        accessLevel: manage
        constraints:
        - all:
          - attribute: namespace
            values: [team-a]
    EOF
    for p in admins team-a-routes finops team-a-keys; do
      status=""
      for i in $(seq 1 60); do
        status=$(kubectl get enterpriseagentgatewayrbacpolicy "$p" -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status}')
        [ "$status" = "True" ] && break
        sleep 3
      done
      [ "$status" = "True" ] || { echo "policy $p is not accepted:"; kubectl describe enterpriseagentgatewayrbacpolicy "$p" -n {{< reuse "agw-docs/snippets/namespace.md" >}}; exit 1; }
      echo "policy $p accepted"
    done
    {{< /doc-test >}}
