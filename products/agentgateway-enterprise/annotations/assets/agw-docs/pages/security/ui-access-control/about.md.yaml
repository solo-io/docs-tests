    # The principals fragment in a policy with one grant.
    kubectl apply -f- <<'EOF'
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayRBACPolicy
    metadata:
      name: principal-kinds
      namespace: agentgateway-system
    spec:
      principals:
      - all:                  # One user.
        - attribute: user
          values: [alice]
      - all:                  # A member of any listed group.
        - attribute: groups
          values: [team-a, team-b]
      - all:                  # A user who is also a member of a group.
        - attribute: user
          values: [bob]
        - attribute: groups
          values: [team-a]
      grants:
      - name: routes
        resource: agentgateway:httproutes
        accessLevel: view
    EOF
    wait_accepted principal-kinds
    kubectl get enterpriseagentgatewayrbacpolicies -A
