  content: |-
    {{< doc-test paths="ui-access-control-samples" >}}
    # ============================================================================
    # Doc test coverage for this page (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Each complete sample policy (Administrators, Application team, FinOps,
    #     Team leads) applies, and the UI reports it as ACCEPTED True.
    #   * The Principal kinds fragment is valid in a policy: the test wraps it in a
    #     grant and checks that the policy is accepted.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The access table (what each user can do): it needs an IdP with these
    #     groups. setup.md tests policy filtering end to end with the built-in IdP.
    #
    # The UI writes the ACCEPTED status only in fine-grained mode, so turn it on first.
    helm upgrade -i {{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} oci://{{< reuse "agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} \
      --namespace {{< reuse "agw-docs/snippets/namespace.md" >}} \
      --version {{< reuse "agw-docs/versions/helm-version-flag.md" >}} \
      --reset-then-reuse-values \
      --set ui.rbac.mode=fine-grained
    kubectl rollout status deployment/enterprise-agentgateway-ui -n agentgateway-system --timeout=600s
    # wait_accepted <name>: poll until the policy shows ACCEPTED True.
    wait_accepted() {
      local got=""
      for _ in $(seq 1 60); do
        got="$(kubectl get enterpriseagentgatewayrbacpolicy "$1" -n agentgateway-system \
          -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status} {.status.conditions[?(@.type=="Accepted")].reason}')"
        [ "$got" = "True Accepted" ] && return 0
        sleep 2
      done
      echo "timed out waiting for $1 to be accepted (last: '$got')"
      kubectl describe enterpriseagentgatewayrbacpolicy "$1" -n agentgateway-system
      return 1
    }
    kubectl apply -f- <<'EOF'
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayRBACPolicy
    metadata:
      name: admins
      namespace: agentgateway-system
    spec:
      principals:
      - all:
        - attribute: groups
          values: [platform-admins]
      grants:
      - name: everything
        resource: "agentgateway:*"
        accessLevel: manage
    EOF
    wait_accepted admins
    {{< /doc-test >}}
