       {{< doc-test paths="enterprise-ui-access-control-setup" >}}
       # A misspelled resource key: the page says the REASON column names
       # UnknownResource, and that the other policies still apply.
       kubectl apply -f- <<EOF
       apiVersion: enterpriseagentgateway.solo.io/v1alpha1
       kind: EnterpriseAgentgatewayRBACPolicy
       metadata:
         name: doc-test-misspelled
         namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
       spec:
         principals:
         - all:
           - attribute: groups
             values: [developers]
         grants:
         - name: routes
           resource: agentgateway:httproute
           accessLevel: view
       EOF
       YAMLTest -f - <<'EOF'
       - name: the misspelled policy reports UnknownResource
         wait:
           target:
             kind: EnterpriseAgentgatewayRBACPolicy
             metadata:
               namespace: agentgateway-system
               name: doc-test-misspelled
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: UnknownResource
           polling:
             timeoutSeconds: 180
             intervalSeconds: 3
       - name: the admins policy is still accepted
         wait:
           target:
             kind: EnterpriseAgentgatewayRBACPolicy
             metadata:
               namespace: agentgateway-system
               name: admins
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 3
       EOF
       kubectl delete enterpriseagentgatewayrbacpolicy doc-test-misspelled -n {{< reuse "agw-docs/snippets/namespace.md" >}}
       {{< /doc-test >}}
