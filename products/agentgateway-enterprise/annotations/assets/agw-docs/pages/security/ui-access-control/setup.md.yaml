  content: |2-
       {{< doc-test paths="ui-access-control" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The EnterpriseAgentgatewayRBACPolicy CRD is installed by the install steps.
       #   * The page's subjectMapping and roleMapping values, applied with the page's
       #     `helm upgrade --reset-then-reuse-values` command, reach the UI: the RBAC
       #     ConfigMap holds the roleMapper, roleMappings, and defaultRoles, the UI
       #     container gets the user and groups claims, and the UI pod becomes ready.
       #   * Coarse mode: a user that maps to no group gets global.Reader from
       #     defaultRoles, sees the HTTPRoutes in every namespace, and is denied a write.
       #   * The `admins` and `developers-routes` policies apply and show ACCEPTED True,
       #     and a policy with a misspelled resource key shows ACCEPTED False with
       #     REASON UnknownResource.
       #   * Fine-grained mode: the page's `helm upgrade --set ui.rbac.mode=fine-grained`
       #     reaches the UI, HTTPRoutes are then filtered by policy (a user that
       #     matches no policy sees none, a namespace constraint limits the list to
       #     team-a), and the gateways list still works under the global role.
       #
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A real OIDC IdP (ui.oidc.issuer) and the group-based principals of the
       #     page's policies: CI has no IdP. The functional checks use the UI's
       #     built-in IdP, whose token always identifies the user by `sub` ("admin")
       #     and carries `Groups`, not `groups`, so under the page's values it maps to
       #     defaultRoles only and matches policies only by user. A hidden policy
       #     with the same constraint as `developers-routes` stands in for the group.
       #   * What the UI shows (pages, buttons, warnings): the checks call the UI
       #     backend's gRPC-Web API, which is what the UI pages read.
       #   * Budgets and virtual keys: they need cost management and an
       #     apiKeyAuthentication policy.
       #
       # The ACCEPTED column is written by the UI only in fine-grained mode, so the
       # status checks run after the fine-grained upgrade.
       UIRBAC_DIR="$(mktemp -d)"
       cat > "$UIRBAC_DIR/grpcweb.py" <<'PY'
       # grpcweb.py <full method> <token>: call the UI backend with an empty request.
       # Prints grpc-status=<code> grpc-message=<text>, then each string in the reply.
       import os, re, struct, sys, urllib.parse, urllib.request
       req = urllib.request.Request(os.environ["UI_URL"] + "/" + sys.argv[1], data=b"\x00\x00\x00\x00\x00", method="POST")
       req.add_header("Content-Type", "application/grpc-web+proto")
       req.add_header("X-Grpc-Web", "1")
       req.add_header("Authorization", "Bearer " + sys.argv[2])
       resp = urllib.request.urlopen(req, timeout=30)
       data = resp.read()
       # An error reply carries its status in the HTTP headers (trailers-only); a
       # normal reply carries it in a trailer frame after the message.
       status, message, payload, i = resp.headers.get("Grpc-Status"), urllib.parse.unquote(resp.headers.get("Grpc-Message", "")), b"", 0
       while i + 5 <= len(data):
           n = struct.unpack(">I", data[i + 1:i + 5])[0]
           chunk = data[i + 5:i + 5 + n]
           if data[i] & 0x80:
               for line in chunk.decode(errors="replace").split("\r\n"):
                   key, _, value = line.partition(":")
                   if key.lower() == "grpc-status":
                       status = value.strip()
                   if key.lower() == "grpc-message":
                       message = urllib.parse.unquote(value.strip())
           else:
               payload += chunk
           i += 5 + n
       print(f"grpc-status={status} grpc-message={message}")
       for s in re.findall(rb"[\x20-\x7e]{3,}", payload):
           print(s.decode())
       PY
       # ui_connect: after an upgrade, wait for the UI pod, then get a built-in IdP
       # token that the new pod accepts. The UI is reached through the
       # agentgateway-proxy Gateway from the install steps, as on the Expose the UI page.
       ui_connect() {
         kubectl rollout status deployment/enterprise-agentgateway-ui -n agentgateway-system --timeout=600s
         for _ in $(seq 1 60); do
           UI_TOKEN="$(curl -s -X POST "$UI_URL/api/autoauth/token" -d '{"user_type":"admin"}' \
             | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])' 2>/dev/null || true)"
           if [ -n "$UI_TOKEN" ] && ui_call rpc.common.solo.io.UserService/GetCurrentUser 2>/dev/null | grep -q '^grpc-status=0 '; then
             return 0
           fi
           sleep 3
         done
         echo "timed out waiting for the UI at $UI_URL"
         return 1
       }
       ui_call() { python3 "$UIRBAC_DIR/grpcweb.py" "$1" "$UI_TOKEN"; }
       # route_names: the test routes the caller can see in the HTTPRoutes list, sorted.
       # Prints the error instead when the call fails, so an empty list never passes by accident.
       route_names() {
         local out
         out="$(ui_call rpc.agentgateway.solo.io.GatewayAPI/ListHTTPRouteSummaries 2>&1)"
         if ! grep -q '^grpc-status=0 ' <<<"$out"; then
           head -1 <<<"$out"
           return 0
         fi
         grep -oE 'uirbac-route-[a-z]+' <<<"$out" | sort -u | paste -sd' ' -
       }
       # wait_routes <want>: poll until route_names returns the list, such as "uirbac-route-a uirbac-route-b".
       wait_routes() {
         for _ in $(seq 1 60); do
           [ "$(route_names)" = "$1" ] && return 0
           sleep 3
         done
         echo "timed out waiting for HTTPRoutes '$1' (last: '$(route_names)')"
         return 1
       }
       # Route to the UI through the agentgateway-proxy Gateway.
       kubectl apply -f - <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: HTTPRoute
       metadata:
         name: ui
         namespace: agentgateway-system
       spec:
         parentRefs:
         - name: agentgateway-proxy
           namespace: agentgateway-system
         rules:
         - backendRefs:
           - name: enterprise-agentgateway-ui
             port: 80
       EOF
       export UI_URL="http://${INGRESS_GW_ADDRESS}"
       # Two HTTPRoutes to list, one per team namespace.
       for ns in team-a team-b; do
         kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
         kubectl apply -f - <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: HTTPRoute
       metadata:
         name: uirbac-route-${ns#team-}
         namespace: $ns
       spec:
         rules:
         - backendRefs:
           - name: backend
             port: 8080
       EOF
       done
       {{< /doc-test >}}
