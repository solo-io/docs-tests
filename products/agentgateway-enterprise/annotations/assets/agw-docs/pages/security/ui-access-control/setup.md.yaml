  content: |2-
       {{< doc-test paths="ui-access-control" >}}
       # The UI pod is ready, and the values reached the RBAC ConfigMap and the UI container.
       ui_connect
       kubectl get configmap enterprise-agentgateway-ui-rbac-config -n agentgateway-system \
         -o jsonpath='{.data.config}' > "$UIRBAC_DIR/rbac-config.json"
       python3 - "$UIRBAC_DIR/rbac-config.json" <<'PY'
       import json, sys
       c = json.load(open(sys.argv[1]))
       assert c["roleMapper"] == "has(claims.groups) ? claims.groups.transformList(i, v, v in rolesMap, rolesMap[v]) : []", c
       for group, role in {"platform-admins": "global.Admin", "finops": "global.Writer", "developers": "global.Reader"}.items():
           assert c["roleMappings"].get(group) == role, c
       assert c["defaultRoles"] == ["global.Reader"], c
       PY
       helm get values enterprise-agentgateway -n agentgateway-system -o json \
         | python3 -c 'import json, sys; m = json.load(sys.stdin)["ui"]["rbac"]["subjectMapping"]; assert m == {"userClaim": "email", "groupsClaim": "groups"}, m'
       kubectl get deployment enterprise-agentgateway-ui -n agentgateway-system -o json > "$UIRBAC_DIR/ui-deploy.json"
       python3 - "$UIRBAC_DIR/ui-deploy.json" <<'PY'
       import json, sys
       env = {e["name"]: e.get("value") for c in json.load(open(sys.argv[1]))["spec"]["template"]["spec"]["containers"] for e in c.get("env", [])}
       assert env["MANAGEMENT_RBAC_MODE"] == "coarse", env.get("MANAGEMENT_RBAC_MODE")
       assert env["MANAGEMENT_RBAC_GROUPS_CLAIM"] == "groups", env.get("MANAGEMENT_RBAC_GROUPS_CLAIM")
       PY
       # Coarse mode: the built-in IdP token has no `groups` claim, so the user gets
       # only global.Reader from defaultRoles. A reader sees the HTTPRoutes in every
       # namespace and cannot write.
       out="$(ui_call rpc.common.solo.io.UserService/GetCurrentUser)"
       echo "$out"
       grep -q '^grpc-status=0 ' <<<"$out"
       test "$(grep -oE 'global\.[A-Za-z]+' <<<"$out" | sort -u | paste -sd' ' -)" = "global.Reader"
       wait_routes "uirbac-route-a uirbac-route-b"
       out="$(ui_call rpc.agentgateway.solo.io.AgentgatewayCostAPI/DeleteBudget)"
       echo "$out"
       grep -q '^grpc-status=7 .*not allowed to call /rpc.agentgateway.solo.io.AgentgatewayCostAPI/DeleteBudget' <<<"$out"
       {{< /doc-test >}}
