       {{< doc-test paths="ui-access-control" >}}
       # The UI pod is ready in fine-grained mode, and the coarse-mode values are kept.
       ui_connect
       kubectl get deployment enterprise-agentgateway-ui -n agentgateway-system -o json > "$UIRBAC_DIR/ui-deploy.json"
       python3 - "$UIRBAC_DIR/ui-deploy.json" <<'PY'
       import json, sys
       env = {e["name"]: e.get("value") for c in json.load(open(sys.argv[1]))["spec"]["template"]["spec"]["containers"] for e in c.get("env", [])}
       assert env["MANAGEMENT_RBAC_MODE"] == "fine-grained", env.get("MANAGEMENT_RBAC_MODE")
       assert env["MANAGEMENT_RBAC_GROUPS_CLAIM"] == "groups", env.get("MANAGEMENT_RBAC_GROUPS_CLAIM")
       PY
       kubectl get configmap enterprise-agentgateway-ui-rbac-config -n agentgateway-system -o jsonpath='{.data.config}' | grep -q '"platform-admins":"global.Admin"'
       # policy_status <name>: the ACCEPTED and REASON columns of a policy.
       policy_status() {
         kubectl get enterpriseagentgatewayrbacpolicy "$1" -n agentgateway-system \
           -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status} {.status.conditions[?(@.type=="Accepted")].reason}'
       }
       # wait_status <name> <ACCEPTED> <REASON>
       wait_status() {
         for _ in $(seq 1 60); do
           [ "$(policy_status "$1")" = "$2 $3" ] && return 0
           sleep 2
         done
         echo "timed out waiting for $1 to show '$2 $3' (last: '$(policy_status "$1")')"
         return 1
       }
       # Step 3: valid policies show ACCEPTED True; the misspelled one shows UnknownResource.
       wait_status admins True Accepted
       wait_status developers-routes True Accepted
       wait_status misspelled-resource False UnknownResource
       kubectl get enterpriseagentgatewayrbacpolicies -A | tee "$UIRBAC_DIR/policies.txt"
       head -1 "$UIRBAC_DIR/policies.txt" | grep -qE '^NAMESPACE +NAME +ACCEPTED +REASON +AGE$'
       grep -qE '^agentgateway-system +misspelled-resource +False +UnknownResource ' "$UIRBAC_DIR/policies.txt"
       kubectl describe enterpriseagentgatewayrbacpolicy misspelled-resource -n agentgateway-system \
         | grep -q 'references unknown resource "agentgateway:httproute"'
       # Fine-grained mode: the built-in IdP user matches no policy, so it sees no
       # HTTPRoutes, even though it saw both in coarse mode. The gateways list is
       # not covered by policies, so global.Reader still allows it.
       wait_routes ""
       ui_call rpc.agentgateway.solo.io.GatewayAPI/ListGatewaySummaries | grep -q '^grpc-status=0 '
       # The same grant as developers-routes, for the built-in IdP user, which a
       # policy can match only by user (`sub`, "admin"): only the team-a HTTPRoute.
       kubectl apply -f- <<EOF
       apiVersion: enterpriseagentgateway.solo.io/v1alpha1
       kind: EnterpriseAgentgatewayRBACPolicy
       metadata:
         name: builtin-user-routes
         namespace: agentgateway-system
       spec:
         principals:
         - all:
           - attribute: user
             values: [admin]
         grants:
         - name: routes
           resource: agentgateway:httproutes
           accessLevel: view
           constraints:
           - all:
             - attribute: namespace
               values: [team-a]
       EOF
       wait_status builtin-user-routes True Accepted
       wait_routes "uirbac-route-a"
       {{< /doc-test >}}
