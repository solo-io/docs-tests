       {{< doc-test paths="enterprise-ui-access-control-setup" >}}
       kubectl rollout status deployment/{{< reuse "agw-docs/snippets/solo-ui/ui-service.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} --timeout=300s
       groups_claim=$(kubectl get deploy {{< reuse "agw-docs/snippets/solo-ui/ui-service.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.spec.template.spec.containers[*].env[?(@.name=="MANAGEMENT_RBAC_GROUPS_CLAIM")].value}')
       [ "$groups_claim" = "groups" ] || { echo "groups claim is '$groups_claim', expected groups"; exit 1; }
       rbac_config=$(kubectl get configmap {{< reuse "agw-docs/snippets/solo-ui/ui-service.md" >}}-rbac-config -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.data.config}')
       echo "$rbac_config"
       echo "$rbac_config" | python3 -c '
       import json, sys
       c = json.load(sys.stdin)
       want = {"platform-admins": "global.Admin", "finops": "global.Writer", "developers": "global.Reader",
               "admins": "global.Admin", "writers": "global.Writer", "readers": "global.Reader"}
       missing = {k: v for k, v in want.items() if c["roleMappings"].get(k) != v}
       assert not missing, f"roleMappings missing {missing}"
       assert c["defaultRoles"] == ["global.Reader"], c["defaultRoles"]
       assert "claims.groups" in c["roleMapper"], c["roleMapper"]
       '
       {{< /doc-test >}}
