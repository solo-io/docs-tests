       {{< doc-test paths="enterprise-ui-access-control-setup" >}}
       # ============================================================================
       # Doc test coverage for "Set up UI access control" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Configure coarse access": the two visible values snippets, saved to
       #     ui-rbac-values.yaml, upgrade the release with the visible helm command;
       #     the UI rolls out with the groups claim set; the rendered role mapping
       #     holds the new groups, defaultRoles, and the chart's default admins,
       #     writers, and readers entries that the page says Helm keeps.
       #   * "Configure fine-grained access": the two visible policies apply; the
       #     visible helm upgrade turns on fine-grained mode; both policies report
       #     Accepted True; the visible kubectl get runs; a policy with a misspelled
       #     resource key reports the UnknownResource reason that the page names.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The login steps: they need a browser and an OIDC IdP with real groups.
       #   * ui.rbac.subjectMapping.userClaim: with no ui.oidc.issuer the chart uses
       #     the built-in IdP, which always maps users from sub.
       #   * kubectl describe: its <name> and <namespace> are placeholders.
       # Mirror of the two visible values snippets above, saved as the page says.
       cat > ui-rbac-values.yaml <<'EOF'
       ui:
         rbac:
           subjectMapping:
             userClaim: email
             groupsClaim: groups
           roleMapping:
             roleMapper: "has(claims.groups) ? claims.groups.transformList(i, v, v in rolesMap, rolesMap[v]) : []"
             roleMappings:
               platform-admins: global.Admin
               finops: global.Writer
               developers: global.Reader
             defaultRoles:
             - global.Reader
       EOF
       {{< /doc-test >}}
