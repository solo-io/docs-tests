  content: |2-
       {{< doc-test paths="aws-assume-role-chain" >}}
       # ============================================================================
       # Doc test coverage for "AWS AssumeRole chaining" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The entAws policy with a two-role chain and an external ID is accepted,
       #     and it reports Attached=True once a route sends traffic to aws-backend.
       #   * Each CRD validation message in the Troubleshoot table: the API server
       #     rejects the invalid variants with that message (server-side dry run).
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The AssumeRole calls and the SigV4 signing at request time: they need
       #     ambient AWS credentials and real IAM roles in two accounts, which CI does
       #     not have. The role ARNs are the guide's example values.
       # The guide expects an existing AgentgatewayBackend named aws-backend for an
       # AWS service. Create a stand-in in the httpbin namespace, with a route to it,
       # so the policy has a target and can attach. No request is sent through it.
       kubectl apply -f- <<EOF
       apiVersion: agentgateway.dev/v1alpha1
       kind: AgentgatewayBackend
       metadata:
         name: aws-backend
         namespace: httpbin
       spec:
         static:
           host: execute-api.us-east-1.amazonaws.com
           port: 443
       ---
       apiVersion: gateway.networking.k8s.io/v1
       kind: HTTPRoute
       metadata:
         name: aws-backend
         namespace: httpbin
       spec:
         parentRefs:
         - name: agentgateway-proxy
           namespace: agentgateway-system
         rules:
         - matches:
           - path:
               type: PathPrefix
               value: /aws
           backendRefs:
           - name: aws-backend
             group: agentgateway.dev
             kind: AgentgatewayBackend
       EOF
       {{< /doc-test >}}
