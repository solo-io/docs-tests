  content: |-
    {{< doc-test paths="aws-assume-role-chain" >}}
    # Each invalid variant from the table must be rejected with the documented message.
    expect_rejected() {
      local message="$1" backend="$2" out
      if out=$(kubectl apply --dry-run=server -f - 2>&1 <<EOF
    apiVersion: enterpriseagentgateway.solo.io/v1alpha1
    kind: EnterpriseAgentgatewayPolicy
    metadata:
      name: aws-chain-invalid
      namespace: httpbin
    spec:
      targetRefs:
      - group: agentgateway.dev
        kind: AgentgatewayBackend
        name: aws-backend
      backend:
    $backend
    EOF
      ); then
        echo "expected the API server to reject the policy with: $message"; exit 1
      fi
      case "$out" in
        *"$message"*) ;;
        *) echo "rejected, but without the documented message ($message): $out"; exit 1;;
      esac
    }
    expect_rejected "exactly one of the fields in [roleArn chain] must be set" '    entAws:
          serviceName: execute-api
          assumeRole:
            roleArn: arn:aws:iam::111111111111:role/gateway-hop
            chain:
            - roleArn: arn:aws:iam::222222222222:role/target-role'
    expect_rejected "externalId must be set on each chain hop, not on the top-level assumeRole config" '    entAws:
          serviceName: execute-api
          assumeRole:
            externalId: partner-external-id
            chain:
            - roleArn: arn:aws:iam::222222222222:role/target-role'
    expect_rejected "secretRef and assumeRole are mutually exclusive" '    entAws:
          serviceName: execute-api
          secretRef:
            name: aws-creds
          assumeRole:
            chain:
            - roleArn: arn:aws:iam::222222222222:role/target-role'
    expect_rejected "at most one of the fields in [auth workloadIdentity tokenExchange entTokenExchange entCrossAppAccess entAws] may be set" '    auth:
          aws:
            secretRef:
              name: aws-creds
        entAws:
          serviceName: execute-api
          assumeRole:
            chain:
            - roleArn: arn:aws:iam::222222222222:role/target-role'
    {{< /doc-test >}}
