         -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
         -H "Mcp-Session-Id: $GRAPH_SESSION" \
         -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
       case "$GRAPH_TOOLS" in
         *'"graph_me"'*) ;;
         *) echo "tools/list through the gateway did not list graph_me: $GRAPH_TOOLS"; exit 1;;
       esac
       {{< /doc-test >}}
