  content: |2-
       {{< doc-test paths="te-idps-entra" >}}
       # ============================================================================
       # Doc test coverage for "Microsoft Entra ID" OBO (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The client secret, the Helm upgrade that enables the STS with Entra
       #     validators and binds the GatewayClass to agentgateway-params, and the
       #     control plane service exposing port 7777.
       #   * agentgateway-params is picked up by the proxy (STS_URI is set on it).
       #   * The entra-jwks backend, the Graph /me MCP server, its backend and route
       #     are accepted, and an MCP client can initialize and list the graph_me tool
       #     through the gateway before the OBO policy is applied.
       #   * The entra-obo-policy, with the tenant and client ID formats that the CRD
       #     enforces, is accepted.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Steps 1, 7, and 9 with a real tenant: the app registration, consent,
       #     `az login`, MCP Inspector, and the Graph call need an Entra tenant, a
       #     signed-in user, and a browser. So the OBO exchange with Entra and the
       #     Graph /me response are not checked.
       #   * The port-forward: CI reaches the gateway through its LoadBalancer.
       # The tenant and client IDs are placeholder GUIDs (the policy rejects the
       # `common` alias) and the client secret is a dummy. The STS validators use
       # Microsoft's public multi-tenant `common` JWKS, so the controller can load real
       # keys without a tenant.
       export ENTRA_TENANT_ID="${ENTRA_TENANT_ID:-00000000-0000-4000-8000-000000000000}"
       export ENTRA_CLIENT_ID="${ENTRA_CLIENT_ID:-aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee}"
       export ENTRA_CLIENT_SECRET="${ENTRA_CLIENT_SECRET:-doc-test-placeholder-secret}"
       {{< /doc-test >}}
