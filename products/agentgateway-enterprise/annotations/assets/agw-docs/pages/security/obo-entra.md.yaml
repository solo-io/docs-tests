             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: graph-me-mcp HTTPRoute is accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: {{< reuse "/agw-docs/snippets/namespace.md" >}}
               name: graph-me-mcp
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       # Before the OBO policy, an MCP client reaches the server through the gateway
       # and sees the graph_me tool (step 7's List Tools, without MCP Inspector).
       GRAPH_HEADERS=$(mktemp)
       for i in $(seq 1 30); do
         curl -s -D "$GRAPH_HEADERS" -o /dev/null -X POST "http://${INGRESS_GW_ADDRESS}:80/graph-me/mcp" \
           -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
           -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"doc-test","version":"1.0"}}}'
         GRAPH_SESSION=$(awk 'tolower($1) == "mcp-session-id:" {print $2}' "$GRAPH_HEADERS" | tr -d '\r')
