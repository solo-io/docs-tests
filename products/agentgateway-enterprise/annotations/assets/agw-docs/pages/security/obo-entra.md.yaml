       - name: graph-me-mcp backend is accepted
         wait:
           target:
             kind: EnterpriseAgentgatewayBackend
             metadata:
               namespace: {{< reuse "/agw-docs/snippets/namespace.md" >}}
               name: graph-me-mcp
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
