    preview: curl "$INGRESS_GW_ADDRESS/openai" \
  content: |2-
       {{< doc-test paths="guardrails-conditional-reversible" >}}
       # The backend is the in-cluster httpbun mock (see openai-setup), which does not
       # reliably repeat the prompt, so the restored address cannot be asserted. Check
       # that the masked request succeeds and that no unique placeholder leaks to the client.
       RESP=""
       for attempt in $(seq 1 15); do
         RESP=$(curl -s --max-time 30 -w '\n%{http_code}' "$INGRESS_GW_ADDRESS/openai" \
           -H "content-type: application/json" \
           -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Repeat this address: jane.doe@example.com"}]}')
         [ "$(tail -n1 <<<"$RESP")" = "200" ] && break
         sleep 2
       done
       echo "$RESP"
       [ "$(tail -n1 <<<"$RESP")" = "200" ] || { echo "expected HTTP 200"; exit 1; }
       if grep -q '<agw_' <<<"$RESP"; then echo "a reversible placeholder reached the client"; exit 1; fi
       {{< /doc-test >}}
