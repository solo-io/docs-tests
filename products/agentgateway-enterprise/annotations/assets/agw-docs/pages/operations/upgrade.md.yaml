  content: |-
    {{< doc-test paths="enterprise-upgrade" >}}
    # ============================================================================
    # Doc test coverage for "Upgrade" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * A real upgrade: the hidden start state installs the previous release
    #     (PREVIOUS_VERSION below) with a Gateway, then the page's steps upgrade the
    #     Gateway API CRDs, the enterprise CRDs, and the control plane to the
    #     n-patch version with the values from `helm get values`.
    #   * The controller image tag matches NEW_VERSION, the control plane is ready,
    #     and the existing Gateway is still programmed after the upgrade.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * `open values.yaml` and the "Get a file with all values" tab: `open` is a
    #     desktop command; a hidden `helm get values` runs instead.
    #   * The 2026.9.3 extension cleanup snippet and "Migrate from the management
    #     chart": they need WAF, PDB/HPA leftovers, or the separate management chart.
    # Bump PREVIOUS_VERSION when n-patch moves, so the start state stays one release
    # behind the version that the page upgrades to.
    export PREVIOUS_VERSION=2026.9.3
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v{{< reuse "agw-docs/versions/k8s-gw-version.md" >}}/standard-install.yaml
    helm upgrade -i {{< reuse "agw-docs/snippets/helm-agentgateway-crds.md" >}} oci://{{< reuse "agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "agw-docs/snippets/helm-agentgateway-crds.md" >}} \
      --create-namespace --namespace {{< reuse "agw-docs/snippets/namespace.md" >}} --version v${PREVIOUS_VERSION}
    helm upgrade -i {{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} oci://{{< reuse "agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} \
      -n {{< reuse "agw-docs/snippets/namespace.md" >}} --version v${PREVIOUS_VERSION} \
      --set-string licensing.licenseKey=${AGENTGATEWAY_LICENSE_KEY} --wait --timeout 5m
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: agentgateway-proxy
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      gatewayClassName: {{< reuse "agw-docs/snippets/gatewayclass.md" >}}
      listeners:
      - protocol: HTTP
        port: 80
        name: http
        allowedRoutes:
          namespaces:
            from: All
    EOF
    kubectl wait --for=condition=Programmed gateway/agentgateway-proxy -n {{< reuse "agw-docs/snippets/namespace.md" >}} --timeout=300s
    {{< /doc-test >}}
