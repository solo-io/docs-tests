  content: |2-
       {{< doc-test paths="external-redis-enterprise" >}}
       # ============================================================================
       # Doc test coverage for the external Redis guide (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "`extCache` fields": with `extCache.redis.url` and `extCache.auth` set, the
       #     deployer removes the in-cluster ext-cache Deployment, and a global rate limit
       #     on the httpbin route is enforced with its counters stored in the external Redis.
       #   * "Overlay": with the REDIS_* overlay, the rate limiter rolls out with the
       #     overlay variables, the in-cluster ext-cache Deployment is listed again, and the
       #     rate limit counters are stored in the external Redis.
       #   * "Redis password": the ext-auth-service overlay applies and the Deployment
       #     rolls out with SESSION_REDIS_PASSWORD.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A managed Redis such as Memorystore or ElastiCache: a password-protected Redis
       #     in the `external-redis` namespace stands in for it. The visible steps that use
       #     `<redis-password>`, `10.0.0.12`, or `redis.example.com` run here with that
       #     instance's values instead.
       #   * TLS (`REDIS_SOCKET_TYPE: tls`, `REDIS_CA_CERT`), and the AuthConfig session
       #     store and login flow, which need an OIDC provider.
       kubectl create namespace external-redis --dry-run=client -o yaml | kubectl apply -f -
       kubectl apply -n external-redis -f- <<EOF
       apiVersion: apps/v1
       kind: Deployment
       metadata:
         name: redis
       spec:
         replicas: 1
         selector:
           matchLabels:
             app: redis
         template:
           metadata:
             labels:
               app: redis
           spec:
             containers:
             - name: redis
               image: redis:7-alpine
               args: ["redis-server", "--requirepass", "doc-test-redis-pass"]
               ports:
               - containerPort: 6379
       EOF
       kubectl apply -n external-redis -f- <<EOF
       apiVersion: v1
       kind: Service
       metadata:
         name: redis
       spec:
         selector:
           app: redis
         ports:
         - port: 6379
           targetPort: 6379
       EOF
       kubectl rollout status deployment/redis -n external-redis --timeout=180s
       redis_keys() {
         kubectl exec -n external-redis deploy/redis -- redis-cli -a doc-test-redis-pass --no-auth-warning DBSIZE | tr -d '\r '
       }
       rl_deployment() {
         kubectl get deployment -l app=rate-limiter -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o name | head -n 1
       }
       # A global rate limit on the httpbin route, as in the global rate limiting guide.
       apply_rate_limit() {
         kubectl apply -f- <<EOF
       apiVersion: ratelimit.solo.io/v1alpha1
       kind: RateLimitConfig
       metadata:
         name: redis-test-limit
         namespace: httpbin
       spec:
         raw:
           descriptors:
           - key: generic_key
             value: counter
             rateLimit:
               requestsPerUnit: 3
               unit: MINUTE
           rateLimits:
           - actions:
             - genericKey:
                 descriptorValue: counter
       EOF
         kubectl apply -f- <<EOF
       apiVersion: {{< reuse "kgw-docs/snippets/trafficpolicy-apiversion.md" >}}
       kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
       metadata:
         name: redis-test-limit
         namespace: httpbin
       spec:
         targetRefs:
         - group: gateway.networking.k8s.io
           kind: HTTPRoute
           name: httpbin
         traffic:
           entRateLimit:
             global:
               rateLimitConfigRefs:
               - name: redis-test-limit
       EOF
       }
       # Send requests until one is rate limited, then check that Redis holds the counter.
       check_limit_in_redis() {
         kubectl exec -n external-redis deploy/redis -- redis-cli -a doc-test-redis-pass --no-auth-warning FLUSHALL
         limited=""
         for attempt in $(seq 1 90); do
           status=$(curl -s -o /dev/null -w "%{http_code}" "http://${INGRESS_GW_ADDRESS}:80/get" -H "host: www.example.com")
           if [ "$status" = "429" ]; then limited=yes; break; fi
           sleep 1
         done
         if [ -z "$limited" ]; then echo "the global rate limit was never enforced (last status $status)"; return 1; fi
         keys=$(redis_keys)
         if [ "$keys" = "0" ]; then echo "the external Redis holds no rate limit counters"; return 1; fi
         echo "rate limited; the external Redis holds $keys keys"
       }
       kubectl create secret generic redis-auth \
         -n {{< reuse "kgw-docs/snippets/namespace.md" >}} \
         --from-literal=password=doc-test-redis-pass --dry-run=client -o yaml | kubectl apply -f -
       {{< /doc-test >}}
