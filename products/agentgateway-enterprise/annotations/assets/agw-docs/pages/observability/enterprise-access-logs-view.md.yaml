  content: |-
    {{< doc-test paths="access-logging" >}}
    # ============================================================================
    # Doc test coverage for "View and customize access logs" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "View access logs": a request to httpbin shows up in the proxy's stdout log.
    #   * "Filter requests": with the filter policy, a 400 is logged and a later 200
    #     is not (the last log line is still the 400).
    #   * "Add or remove log fields": the custom user_id and env fields appear and
    #     http.host is gone.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The port-forward tabs (CI allows no port-forward; the LoadBalancer tabs run).
    #   * The page has no cleanup section; a hidden step deletes the policy.
    {{< /doc-test >}}
