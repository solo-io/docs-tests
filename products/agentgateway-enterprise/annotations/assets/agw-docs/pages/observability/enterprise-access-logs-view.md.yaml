  content: |2-
       {{< doc-test paths="access-logging" >}}
       # Policy check 9
       YAMLTest -f - <<'EOF'
       - name: the access-logs policy is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: agentgateway-system
               name: access-logs
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       # Give the proxy a moment to load the new policy before the next request.
       sleep 10
       {{< /doc-test >}}
