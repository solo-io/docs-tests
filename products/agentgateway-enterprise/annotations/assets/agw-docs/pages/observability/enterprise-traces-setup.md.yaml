    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="enterprise-traces-setup" >}}
    # ============================================================================
    # Doc test coverage for "Set up and customize traces" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Enable tracing": the policy is accepted, and an LLM request on the
    #     openai route produces spans in ClickHouse.
    #   * Every policy variant on the page (sampling, filter, add and remove
    #     attributes) is accepted; the add-attributes variant puts the custom
    #     service.name on new spans.
    #   * Cleanup runs.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The page's curl to /v1/chat/completions: that is the LLM quickstart's
    #     route. This scenario chains the OpenAI provider setup, whose route is
    #     /openai and whose backend is patched to the in-cluster mock LLM.
    #   * The UI Tracing view (port-forward and browser).
    # Policy check 4
    YAMLTest -f - <<'EOF'
    - name: the tracing policy is accepted
      wait:
        target:
          kind: {{< reuse "agw-docs/snippets/policy.md" >}}
          metadata:
            namespace: agentgateway-system
            name: tracing
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    # Give the proxy a moment to load the new policy before the next request.
    sleep 10
    curl -s -o /dev/null -w '%{http_code}\n' "$INGRESS_GW_ADDRESS/openai" -H content-type:application/json -H "x-user-id: user-123" -d '{"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Say hello"}]}'
    export CH_USER=$(kubectl get secret {{< reuse "agw-docs/snippets/solo-ui/clickhouse-auth-secret.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.data.username}' | base64 -d)
    export CH_PASS=$(kubectl get secret {{< reuse "agw-docs/snippets/solo-ui/clickhouse-auth-secret.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.data.password}' | base64 -d)
    chq() { kubectl exec -n {{< reuse "agw-docs/snippets/namespace.md" >}} {{< reuse "agw-docs/snippets/solo-ui/clickhouse-pod.md" >}} -- clickhouse-client --user "$CH_USER" --password "$CH_PASS" --query "$1"; }
    # Wait until a count query returns more than zero rows. Telemetry is batched, so allow a few minutes.
    ch_wait_rows() {
      local q="$1" n=0
      for i in $(seq 1 36); do
        n=$(chq "$q" 2>/dev/null || echo 0)
        if [ "${n:-0}" -gt 0 ] 2>/dev/null; then echo "rows: $n"; return 0; fi
        sleep 10
      done
      echo "no rows after 6 minutes for: $q"; return 1
    }
    ch_wait_rows "SELECT count() FROM {{< reuse "agw-docs/snippets/solo-ui/clickhouse-db.md" >}}.otel_traces_json"
    {{< /doc-test >}}
