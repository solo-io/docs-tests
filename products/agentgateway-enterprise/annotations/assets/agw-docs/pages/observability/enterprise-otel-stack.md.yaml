  content: |-
    {{< doc-test paths="enterprise-otel-stack" >}}
    # ============================================================================
    # Doc test coverage for the observability stack migration (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Migrate traces" and "Migrate access logs": the enterprise tracing and
    #     access log policies are accepted, the OSS AgentgatewayPolicy resources
    #     delete cleanly, and access logs from httpbin traffic land in ClickHouse.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The OSS stack itself. This cluster never had one, so two OSS
    #     AgentgatewayPolicy resources named like the OSS guide's are created here
    #     so the documented deletes have something to delete. The helm uninstall
    #     steps for the OSS collectors, Tempo, and Loki are left out.
    #   * Step 3's clickhouse-client query is run without -it and with the
    #     credentials from the auth Secret (the page's command passes none).
    #   * The UI Tracing view (browser) and the monitoring.enabled upgrade
    #     (placeholder release name; covered by the metrics external scenario).
    kubectl apply -f- <<EOF
    apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayPolicy
    metadata:
      name: tracing
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      targetRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: agentgateway-proxy
      frontend:
        tracing:
          backendRef:
            name: {{< reuse "agw-docs/snippets/solo-ui/telemetry-collector.md" >}}
            namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
            kind: Service
            port: 4317
          randomSampling: "false"
    ---
    apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayPolicy
    metadata:
      name: access-logs
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      targetRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: agentgateway-proxy
      frontend:
        accessLog:
          filter: 'true'
    EOF
    {{< /doc-test >}}
