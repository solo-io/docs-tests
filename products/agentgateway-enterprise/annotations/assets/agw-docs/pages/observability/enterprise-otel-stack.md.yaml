  content: |2-
       {{< doc-test paths="enterprise-otel-stack" >}}
       export CH_USER=$(kubectl get secret {{< reuse "agw-docs/snippets/solo-ui/clickhouse-auth-secret.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.data.username}' | base64 -d)
       export CH_PASS=$(kubectl get secret {{< reuse "agw-docs/snippets/solo-ui/clickhouse-auth-secret.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{.data.password}' | base64 -d)
       chq() { kubectl exec -n {{< reuse "agw-docs/snippets/namespace.md" >}} {{< reuse "agw-docs/snippets/solo-ui/clickhouse-pod.md" >}} -- clickhouse-client --user "$CH_USER" --password "$CH_PASS" --query "$1"; }
       # Wait until a count query returns more than zero rows. Telemetry is batched, so allow a few minutes.
       ch_wait_rows() {
         local q="$1" n=0
         for i in $(seq 1 36); do
           n=$(chq "$q" 2>/dev/null || echo 0)
           if [ "${n:-0}" -gt 0 ] 2>/dev/null; then echo "rows: $n"; return 0; fi
           sleep 10
         done
         echo "no rows after 6 minutes for: $q"; return 1
       }
       for i in 1 2 3 4 5; do curl -s -o /dev/null http://$INGRESS_GW_ADDRESS:80/get -H "host: www.example.com"; done
       ch_wait_rows "SELECT count() FROM {{< reuse "agw-docs/snippets/solo-ui/clickhouse-db.md" >}}.otel_logs_json WHERE position(toString(LogAttributes), 'www.example.com') > 0"
       kubectl delete {{< reuse "agw-docs/snippets/policy.md" >}} tracing access-logs -n {{< reuse "agw-docs/snippets/namespace.md" >}}
       {{< /doc-test >}}
