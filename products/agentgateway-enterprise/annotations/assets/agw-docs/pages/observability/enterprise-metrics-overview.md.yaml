  content: |-
    {{< doc-test paths="enterprise-metrics-overview" >}}
    # ============================================================================
    # Doc test coverage for "Metrics overview" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Access raw metrics": the control plane answers on 9092/metrics and the
    #     proxy on 15020/metrics with agentgateway_ metrics. CI allows no
    #     port-forward, so an in-cluster curl pod reads the same endpoints.
    #   * "View metrics in the management UI": the collector scrapes the proxy, and
    #     agentgateway_requests_total reaches otel_metrics_sum (the page's query).
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI Dashboard panels (browser) and the interactive clickhouse-client shell.
    PROXY_IP=$(kubectl get pods -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{"\n"}{end}' | grep '^agentgateway-proxy-' | head -1 | cut -d' ' -f2)
    kubectl run metrics-check -n {{< reuse "agw-docs/snippets/namespace.md" >}} --rm -i --restart=Never --quiet --image=curlimages/curl:8.11.1 -- \
      sh -c "curl -sf http://enterprise-agentgateway.{{< reuse "agw-docs/snippets/namespace.md" >}}.svc.cluster.local:9092/metrics | grep -c '^agentgateway_' && curl -sf http://$PROXY_IP:15020/metrics | grep -c '^agentgateway_'"
    {{< /doc-test >}}
