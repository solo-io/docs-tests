  content: |-
    {{< doc-test paths="enterprise-metrics-external" >}}
    # ============================================================================
    # Doc test coverage for "Export metrics to an external system" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Option 1: the documented OTel Collector values install and the collector
    #     rolls out (with a stand-in remote write endpoint; nothing receives it).
    #   * Option 2: with the Prometheus Operator CRDs present, monitoring.enabled
    #     creates the ServiceMonitor, the PodMonitor, and the Grafana dashboard
    #     ConfigMap.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Data arriving in a real Prometheus, Datadog, or Grafana Cloud (external
    #     accounts), and the Grafana sidecar steps (placeholder namespace, no Grafana).
    #   * The other-namespace values snippets (values only, no command).
    helm upgrade --install agentgateway-metrics opentelemetry-collector \
      --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
      --set mode=deployment \
      --set image.repository="otel/opentelemetry-collector-contrib" \
      --set command.name="otelcol-contrib" \
      --namespace {{< reuse "agw-docs/snippets/namespace.md" >}} \
      -f - <<EOF
    config:
      receivers:
        prometheus:
          config:
            scrape_configs:
              - job_name: agentgateway-controller
                scrape_interval: 15s
                static_configs:
                  - targets:
                      - enterprise-agentgateway.{{< reuse "agw-docs/snippets/namespace.md" >}}:9092
              - job_name: agentgateway-proxy
                scrape_interval: 15s
                static_configs:
                  - targets:
                      - agentgateway-proxy.{{< reuse "agw-docs/snippets/namespace.md" >}}:15020
      exporters:
        prometheusremotewrite:
          endpoint: http://prometheus.invalid:9090/api/v1/write
      service:
        pipelines:
          metrics:
            receivers: [prometheus]
            processors: [batch]
            exporters: [prometheusremotewrite]
    EOF
    kubectl rollout status deployment/agentgateway-metrics-opentelemetry-collector -n {{< reuse "agw-docs/snippets/namespace.md" >}} --timeout=300s
    helm uninstall agentgateway-metrics -n {{< reuse "agw-docs/snippets/namespace.md" >}}
    # Option 2 needs the Prometheus Operator CRDs; no Prometheus instance is installed.
    # v0.88.0 or later: the chart sets PodMonitor spec.scrapeNativeHistograms.
    kubectl apply --server-side -f https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.94.2/stripped-down-crds.yaml
    {{< /doc-test >}}
