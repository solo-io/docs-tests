    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="access-log-otlp" >}}
    # ============================================================================
    # Doc test coverage for "Export logs to ClickHouse" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The OTLP access log policy and its filter and attributes variants are accepted.
    #   * Records reach the otel_logs_json table; the page's own SQL (status filter)
    #     runs non-interactively; with otlp.filter only the 500 is exported while
    #     stdout keeps both requests; the otlp.attributes variant exports trace_id.
    #   * Cleanup runs.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The interactive `kubectl exec -it ... clickhouse-client` shells; the same
    #     queries run with --query instead.
    #   * The step that reads `deploy/opentelemetry-collector-logs -n telemetry`:
    #     that collector belongs to the OSS stack and does not exist here. The
    #     exported trace_id is checked in ClickHouse instead.
    # Policy check 11
    YAMLTest -f - <<'EOF'
    - name: the access-logs policy is accepted
      wait:
        target:
          kind: {{< reuse "agw-docs/snippets/policy.md" >}}
          metadata:
            namespace: agentgateway-system
            name: access-logs
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    # Give the proxy a moment to load the new policy before the next request.
    sleep 10
    {{< /doc-test >}}
- after:
    block: 3
