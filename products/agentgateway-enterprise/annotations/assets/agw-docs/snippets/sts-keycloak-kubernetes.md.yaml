  content: |2-
       {{< doc-test paths="te-impersonation" >}}
       # The realm, client, and user exist: user1 gets a token from fe-client-1 with
       # the agentgateway realm as issuer.
       jwt_claims() { python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p))))' "$1"; }
       KC_CHECK_TOKEN=$(curl -fsS -X POST "${KEYCLOAK_URL}/realms/agentgateway/protocol/openid-connect/token" \
         -d 'grant_type=password' -d 'client_id=fe-client-1' -d 'username=user1' -d 'password=Password1!' | jq -r .access_token)
       jwt_claims "$KC_CHECK_TOKEN" \
         | jq -e --arg iss "${KEYCLOAK_URL}/realms/agentgateway" '.iss == $iss and .preferred_username == "user1"' >/dev/null \
         || { echo "user1 token from the agentgateway realm has the wrong issuer or user"; exit 1; }
       curl -fsS -o /dev/null "$KEYCLOAK_JWKS_URI" || { echo "KEYCLOAK_JWKS_URI does not answer"; exit 1; }
       {{< /doc-test >}}
