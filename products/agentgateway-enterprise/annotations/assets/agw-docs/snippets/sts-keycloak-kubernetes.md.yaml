    preview: kubectl -n keycloak rollout status deploy/keycloak
  content: |2-
       {{< doc-test paths="te-impersonation" >}}
       # The next step reads the LoadBalancer address, which cloud-provider-kind
       # assigns a few seconds after the Service exists. Wait for it, and for
       # Keycloak to answer on it.
       for i in $(seq 1 60); do
         kc_ip=$(kubectl -n keycloak get service keycloak -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}')
         [ -n "$kc_ip" ] && break; sleep 5
       done
       test -n "$kc_ip" || { echo "keycloak Service got no LoadBalancer address"; exit 1; }
       for i in $(seq 1 60); do
         curl -fsS -o /dev/null "http://$kc_ip:8080/realms/master/.well-known/openid-configuration" && break; sleep 5
       done
       {{< /doc-test >}}
