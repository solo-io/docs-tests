  content: |-
    {{< doc-test paths="integrations-agentic-mesh-waypoint-install,integrations-agentic-mesh-waypoint-setup,integrations-agentic-mesh-istio" >}}
    # The page links out to the Solo Enterprise for Istio install guides. CI has no
    # Solo Istio license, so install community Istio in ambient mode instead, the
    # same way the open source ambient scenarios do. The enterprise waypoint e2e
    # suite also runs against community Istio.
    ISTIO_VERSION="${ISTIO_VERSION:-1.31.3}"
    istio_arch=$(uname -m)
    case "$istio_arch" in x86_64) istio_arch=amd64 ;; aarch64) istio_arch=arm64 ;; esac
    istio_os=$(uname -s | tr '[:upper:]' '[:lower:]')
    [ "$istio_os" = "darwin" ] && istio_os=osx
    ISTIO_BIN="${TMPDIR:-/tmp}/doc-test-istioctl-${ISTIO_VERSION}"
    mkdir -p "$ISTIO_BIN"
    export PATH="$ISTIO_BIN:$PATH"
    if [ ! -x "$ISTIO_BIN/istioctl" ]; then
      curl -fsSL "https://github.com/istio/istio/releases/download/${ISTIO_VERSION}/istioctl-${ISTIO_VERSION}-${istio_os}-${istio_arch}.tar.gz" \
        | tar -xz -C "$ISTIO_BIN" istioctl
    fi
    istioctl install --set profile=ambient --skip-confirmation
    kubectl -n istio-system rollout status deploy/istiod --timeout=300s
    kubectl -n istio-system rollout status ds/ztunnel --timeout=300s
    kubectl -n istio-system rollout status ds/istio-cni-node --timeout=300s
    {{< /doc-test >}}
