       {{< doc-test paths="mcp-search-mode" >}}
       LIST=$(curl -sS --max-time 60 -X POST "$MCP_URL" -H "Mcp-Session-Id: $SID" \
         -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
         -d '{"jsonrpc":"2.0","id":20,"method":"tools/list","params":{}}')
       echo "$LIST"
       grep -q '"name":"get_tool"' <<<"$LIST"
       grep -q '"name":"invoke_tool"' <<<"$LIST"
       if grep -q '"name":"run_code"' <<<"$LIST"; then echo "unexpected match: '"name":"run_code"'"; exit 1; fi
       # The upstream fetch tool is never listed directly.
       if grep -q '"name":"fetch"' <<<"$LIST"; then echo "unexpected match: '"name":"fetch"'"; exit 1; fi
       {{< /doc-test >}}
