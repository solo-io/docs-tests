  content: |2-
       {{< doc-test paths="enterprise-fips" >}}
       # ============================================================================
       # Doc test coverage for "FIPS TLS profile" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Controller and data plane proxy": the visible helm upgrade with
       #     image.variant=fips pulls the published -fips controller and proxy images,
       #     and both roll out.
       #   * "Verify the profile at runtime": the visible kubectl commands run; the
       #     controller and proxy images end in -fips; the proxy logs
       #     crypto_backend aws-lc-rs-fips and crypto_fips true; the controller logs
       #     the Go module in FIPS mode with fips140 on.
       #   * "Strict FIPS mode": the visible helm upgrade sets GODEBUG=fips140=only,
       #     the controller still rolls out (it fails closed if the module is off),
       #     and the visible jsonpath query prints fips140=only.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Shared extension images and EnterpriseAgentgatewayParameters overrides:
       #     the extensions deploy only with policies that use them; the override is
       #     a fragment.
       #   * Air gap mirroring: needs a private registry.
       #   * The TLS refusal table, RSA and JWT key rules: need non-FIPS TLS peers and
       #     custom keys, beyond a single-node kind cluster.
       #   * "Switch back to the standard images": prose steps with no commands.
       # The reader's values file holds their existing install values plus the
       # variant, so build it the same way: the current release values (license key
       # included) merged with the visible snippet above.
       helm get values {{< reuse "agw-docs/snippets/helm-agentgateway.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o yaml > values.yaml
       python3 - <<'EOF'
       import yaml
       values = yaml.safe_load(open("values.yaml")) or {}
       values.setdefault("image", {})["variant"] = "fips"
       yaml.safe_dump(values, open("values.yaml", "w"))
       EOF
       {{< /doc-test >}}
