  content: |-
    {{< doc-test paths="rbac-hardening" >}}
    # ============================================================================
    # Doc test coverage for the RBAC hardening guide (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Scope namespace discovery: labeling the install namespace and setting
    #     discoveryNamespaceSelectors keeps the controller healthy and the Gateway
    #     programmed.
    #   * Security contexts and Disable unused features: a Helm upgrade with the
    #     page's podSecurityContext, securityContext, inferenceExtension,
    #     tokenExchange, and istio values rolls out, the Gateway stays programmed,
    #     and the ClusterRole no longer grants networking.istio.io.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The visible values snippets run as-is: they are Helm values fragments, not
    #     commands, so hidden helm upgrade steps apply them.
    #   * Labeling the my-app namespace: it is an example namespace that does not exist.
    #   * Pre-provisioning the license Secret: it needs a fresh install, and the
    #     chart already owns a Secret of that name in this cluster.
    #   * The private-registry values: my-registry.example.com does not exist.
    kubectl label namespace {{< reuse "agw-docs/snippets/namespace.md" >}} agentgateway.dev/discovery=true --overwrite
    CHART_VERSION=$(helm get metadata {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o json | jq -r .version)
    helm upgrade {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} oci://{{< reuse "/agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} \
      -n {{< reuse "agw-docs/snippets/namespace.md" >}} --version "$CHART_VERSION" --reuse-values \
      -f - <<EOF
    discoveryNamespaceSelectors:
    - matchLabels:
        agentgateway.dev/discovery: "true"
    EOF
    kubectl -n {{< reuse "agw-docs/snippets/namespace.md" >}} rollout status deployment/{{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} --timeout=180s
    YAMLTest -f - <<'EOF'
    - name: the agentgateway-proxy Gateway is still programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: agentgateway-system
            name: agentgateway-proxy
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
- after:
