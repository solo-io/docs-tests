  content: |-
    {{< doc-test paths="rbac-hardening" >}}
    CHART_VERSION=$(helm get metadata {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} -n {{< reuse "agw-docs/snippets/namespace.md" >}} -o json | jq -r .version)
    helm upgrade {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} oci://{{< reuse "/agw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} \
      -n {{< reuse "agw-docs/snippets/namespace.md" >}} --version "$CHART_VERSION" --reuse-values \
      -f - <<EOF
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
    inferenceExtension:
      enabled: false
    tokenExchange:
      enabled: false
    istio:
      enabled: false
    EOF
    kubectl -n {{< reuse "agw-docs/snippets/namespace.md" >}} rollout status deployment/{{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}} --timeout=180s
    YAMLTest -f - <<'EOF'
    - name: the agentgateway-proxy Gateway is still programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: agentgateway-system
            name: agentgateway-proxy
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    # The Important callout's check: no output means the istio rule is gone.
    if kubectl get clusterrole {{< reuse "/agw-docs/snippets/helm-agentgateway.md" >}}-{{< reuse "agw-docs/snippets/namespace.md" >}} -o yaml | grep -q networking.istio.io; then
      echo "ClusterRole still grants networking.istio.io after istio.enabled=false"; exit 1
    fi
    {{< /doc-test >}}
