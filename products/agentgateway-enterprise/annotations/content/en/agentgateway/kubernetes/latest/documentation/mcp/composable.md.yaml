       {{< doc-test paths="mcp-composable" >}}
       # The visible export is a placeholder. Start a session and capture its real ID.
       SESSION_ID=$(curl -s --max-time 10 -D - -o /dev/null "http://${INGRESS_GW_ADDRESS}/mcp" \
         -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
         -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' \
         | awk -F': *' 'tolower($1)=="mcp-session-id"{gsub(/\r/,"",$2);print $2}')
       export SESSION_ID
       [ -n "$SESSION_ID" ] || { echo "no mcp-session-id from the gateway"; exit 1; }
       curl -s --max-time 10 "http://${INGRESS_GW_ADDRESS}/mcp" -H "Mcp-Session-Id: $SESSION_ID" \
         -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
         -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' >/dev/null || true
       {{< /doc-test >}}
