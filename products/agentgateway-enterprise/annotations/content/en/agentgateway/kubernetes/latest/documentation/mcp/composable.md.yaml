       {{< doc-test paths="mcp-composable" >}}
       # The tool calls the public GitHub API, which rate-limits unauthenticated callers,
       # so retry a few times before failing.
       for attempt in $(seq 1 5); do
         CALL=$(curl -s --max-time 60 "http://${INGRESS_GW_ADDRESS}/mcp" \
           -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
           -H "Mcp-Session-Id: $SESSION_ID" \
           -d '{"jsonrpc":"2.0","id":21,"method":"tools/call","params":{"name":"github-summary","arguments":{"name":"octocat"}}}')
         echo "$CALL"
         grep -q 'Hello octocat! You have [0-9]* public repos. A few of them: ' <<<"$CALL" && break
         sleep 10
       done
       grep -q 'Hello octocat! You have [0-9]* public repos. A few of them: ' <<<"$CALL"
       # The visible cleanup deletes an AgentgatewayPolicy, but Step 1 created an
       # EnterpriseAgentgatewayPolicy, so clean up here instead.
       kubectl delete httproute composable-mcp -n default --ignore-not-found
       kubectl delete enterpriseagentgatewaybackend composable-mcp github-api -n default --ignore-not-found
       kubectl delete enterpriseagentgatewaypolicy github-api-tls -n default --ignore-not-found
       {{< /doc-test >}}
