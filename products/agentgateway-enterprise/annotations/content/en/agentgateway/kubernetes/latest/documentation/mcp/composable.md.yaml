  content: |-
    {{< doc-test paths="mcp-composable" >}}
    YAMLTest -f - <<'EOF'
    - name: the github-api backend is accepted
      wait:
        target:
          kind: EnterpriseAgentgatewayBackend
          metadata:
            namespace: default
            name: github-api
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the composable-mcp backend is accepted
      wait:
        target:
          kind: EnterpriseAgentgatewayBackend
          metadata:
            namespace: default
            name: composable-mcp
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the github-api-tls policy is accepted
      wait:
        target:
          kind: EnterpriseAgentgatewayPolicy
          metadata:
            namespace: default
            name: github-api-tls
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the composable-mcp HTTPRoute is accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: composable-mcp
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
