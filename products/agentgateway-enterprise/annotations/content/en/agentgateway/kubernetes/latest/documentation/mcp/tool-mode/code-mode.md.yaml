  content: |2-
       {{< doc-test paths="mcp-code-mode" >}}
       # Wait until the route answers an MCP initialize with a session ID, so the
       # visible initialize step below does not race route programming.
       for attempt in $(seq 1 30); do
         if curl -s --max-time 10 -D - -o /dev/null -X POST "$MCP_URL" \
             -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"curl","version":"1"}}}' \
             | grep -qi '^mcp-session-id:'; then break; fi
         sleep 5
       done
       {{< /doc-test >}}
