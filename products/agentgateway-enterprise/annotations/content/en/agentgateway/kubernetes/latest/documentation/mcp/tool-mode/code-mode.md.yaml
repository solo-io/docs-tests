  content: |-
    {{< doc-test paths="mcp-code-mode" >}}
    YAMLTest -f - <<'EOF'
    - name: the mcp-website-fetcher deployment is available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: default
            name: mcp-website-fetcher
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 180
          intervalSeconds: 5
    - name: the mcp-code-backend backend is accepted
      wait:
        target:
          kind: EnterpriseAgentgatewayBackend
          metadata:
            namespace: default
            name: mcp-code-backend
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the mcp-code HTTPRoute is accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: mcp-code
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
