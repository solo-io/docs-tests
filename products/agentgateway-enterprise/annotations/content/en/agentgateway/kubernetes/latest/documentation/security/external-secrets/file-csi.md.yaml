       {{< doc-test paths="enterprise-file-csi" >}}
       # ============================================================================
       # Doc test coverage for "File store with the CSI driver" (not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Steps 1-3: the Secrets Store CSI Driver, Vault in dev mode with its CSI
       #     provider, and the Vault key, policy, and Kubernetes-auth role.
       #   * Steps 4-6: the SecretProviderClass, the file store Helm values (the CSI
       #     volume mounts on the controller), the rendered stores.yaml, and an
       #     EnterpriseAgentgatewayExternalSecret that reports Accepted=True.
       #   * Steps 7-8: a backend whose auth secretRef names the external secret is
       #     accepted in full, and a chat completion on /openai returns 200.
       #   * Cleanup runs.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A live OpenAI completion: the backend is patched to the in-cluster httpbun
       #     mock LLM, so the key stored in Vault is a test value.
       #   * The Step 7 backend and HTTPRoute blocks as written: they pair
       #     `apiVersion: agentgateway.dev/v1alpha1` (and backendRef group
       #     agentgateway.dev) with the EnterpriseAgentgatewayBackend kind, which does
       #     not exist in that group. Hidden copies use kind AgentgatewayBackend, as the
       #     apiVersion and the page's TODO intend. Tag the visible blocks once fixed.
       #   * The port-forward tab.
       export OPENAI_API_KEY="${OPENAI_API_KEY:-mock-openai-key}"
       # Test-only: the httpbun mock LLM, an OpenAI-compatible endpoint.
       kubectl apply -f- <<EOF
       apiVersion: apps/v1
       kind: Deployment
       metadata:
         name: httpbun
         namespace: default
         labels:
           app: httpbun
       spec:
         replicas: 1
         selector:
           matchLabels:
             app: httpbun
         template:
           metadata:
             labels:
               app: httpbun
           spec:
             containers:
               - name: httpbun
                 image: sharat87/httpbun
                 env:
                   - name: HTTPBUN_BIND
                     value: "0.0.0.0:3090"
                 ports:
                   - containerPort: 3090
       EOF
       kubectl apply -f- <<EOF
       apiVersion: v1
       kind: Service
       metadata:
         name: httpbun
         namespace: default
       spec:
         selector:
           app: httpbun
         ports:
           - protocol: TCP
             port: 3090
             targetPort: 3090
       EOF
       kubectl rollout status deployment/httpbun -n default --timeout=180s
       {{< /doc-test >}}
