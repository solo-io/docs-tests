       # The visible block is the file content; write it to the name that step 2 uses.
       cat > storage-values.yaml <<'EOF'
       externalSecrets:
         stores:
           - name: llm-secrets
             file:
               path: /var/run/secrets/agentgateway-external-secrets/llm
       controller:
         extraVolumes:
           - name: llm-secrets
             csi:
               driver: secrets-store.csi.k8s.io
               readOnly: true
               volumeAttributes:
                 secretProviderClass: openai-vault
         extraVolumeMounts:
           - name: llm-secrets
             mountPath: /var/run/secrets/agentgateway-external-secrets/llm
             readOnly: true
       EOF
       {{< /doc-test >}}
