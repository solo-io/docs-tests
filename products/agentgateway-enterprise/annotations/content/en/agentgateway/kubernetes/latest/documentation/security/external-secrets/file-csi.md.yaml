       {{< doc-test paths="enterprise-file-csi" >}}
       kubectl apply -f- <<EOF
       apiVersion: agentgateway.dev/v1alpha1
       kind: AgentgatewayBackend
       metadata:
         name: openai
         namespace: {{< reuse "/agw-docs/snippets/namespace.md" >}}
       spec:
         ai:
           groups:
             - providers:
                 - name: openai
                   openai:
                     model: gpt-3.5-turbo
                   host: httpbun.default.svc.cluster.local
                   port: 3090
                   path: /llm/chat/completions
                   policies:
                     auth:
                       secretRef:
                         group: enterpriseagentgateway.solo.io
                         kind: EnterpriseAgentgatewayExternalSecret
                         name: openai-external-secret
       EOF
       kubectl apply -f- <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: HTTPRoute
       metadata:
         name: openai
         namespace: {{< reuse "/agw-docs/snippets/namespace.md" >}}
       spec:
         parentRefs:
           - name: agentgateway-proxy
             namespace: {{< reuse "/agw-docs/snippets/namespace.md" >}}
         rules:
           - matches:
               - path:
                   type: PathPrefix
                   value: /openai
             backendRefs:
               - name: openai
                 namespace: {{< reuse "/agw-docs/snippets/namespace.md" >}}
                 group: agentgateway.dev
                 kind: AgentgatewayBackend
       EOF
       YAMLTest -f - <<'EOF'
       - name: the openai backend translated in full, auth included
         wait:
           target:
             kind: AgentgatewayBackend
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: "Accepted"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 5
       - name: the openai HTTPRoute resolves its backend
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
