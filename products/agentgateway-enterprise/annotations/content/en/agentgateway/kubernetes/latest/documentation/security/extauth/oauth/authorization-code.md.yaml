       {{< doc-test paths="oauth-authorization-code" >}}
       # A request without a session cookie gets a 302 to the Keycloak login.
       AUTHZ_JAR=$(mktemp)
       AUTH_URL=""
       for i in $(seq 1 30); do
         AUTH_URL=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -c "$AUTHZ_JAR" \
           "http://${INGRESS_GW_ADDRESS}:80/openai" -H content-type:application/json \
           -d '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"hi"}]}')
         case "$AUTH_URL" in "302 ${KEYCLOAK_URL}/realms/master/protocol/openid-connect/auth?"*) break;; esac
         sleep 4
       done
       case "$AUTH_URL" in
         "302 ${KEYCLOAK_URL}/realms/master/protocol/openid-connect/auth?"*) ;;
         *) echo "expected a 302 to the Keycloak auth endpoint, got: $AUTH_URL"; exit 1;;
       esac
       AUTH_URL=${AUTH_URL#302 }
       echo "$AUTH_URL" | grep -q "client_id=${KEYCLOAK_CLIENT}" || { echo "redirect is missing the client ID"; exit 1; }
       echo "$AUTH_URL" | grep -q "redirect_uri=http%3A%2F%2F${INGRESS_GW_ADDRESS}%3A80%2Fopenai" || { echo "redirect_uri is not the gateway callback"; exit 1; }
       {{< /doc-test >}}
