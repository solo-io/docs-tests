       YAMLTest -f - <<EOF
       - name: a request with the keycloak-session cookie reaches the LLM
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: "application/json"
             cookie: "${COOKIE}"
           body: '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"with session"}]}'
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       EOF
       {{< /doc-test >}}
