  content: |2-
       {{< doc-test paths="oauth-authorization-code" >}}
       # The visible steps sign in through a browser and copy the cookie by hand.
       # Run the same exchanges with curl: load the Keycloak login form, post user1's
       # credentials, and follow the redirect to the callback path, where ext auth
       # trades the code for tokens and sets the keycloak-session cookie.
       KC_JAR=$(mktemp)
       LOGIN_PAGE=$(curl -fsS -c "$KC_JAR" -b "$KC_JAR" "$AUTH_URL")
       LOGIN_ACTION=$(printf '%s' "$LOGIN_PAGE" | python3 -c '
       import html, re, sys
       page = sys.stdin.read()
       form = re.search(r"<form[^>]*id=\"kc-form-login\"[^>]*>", page)
       action = re.search(r"action=\"([^\"]+)\"", form.group(0)) if form else None
       print(html.unescape(action.group(1)) if action else "")
       ')
       test -n "$LOGIN_ACTION" || { echo "no Keycloak login form in the authorization page"; exit 1; }
       CALLBACK=$(curl -s -o /dev/null -w '%{redirect_url}' -c "$KC_JAR" -b "$KC_JAR" \
         --data-urlencode username=user1 --data-urlencode password=password "$LOGIN_ACTION")
       case "$CALLBACK" in
         # Keycloak drops the default :80 port from the redirect URI it sends back.
         "http://${INGRESS_GW_ADDRESS}:80/openai?"*code=*|"http://${INGRESS_GW_ADDRESS}/openai?"*code=*) ;;
         *) echo "Keycloak did not redirect to the callback with a code: $CALLBACK"; exit 1;;
       esac
       CALLBACK_HDRS=$(curl -s -o /dev/null -D - -c "$AUTHZ_JAR" -b "$AUTHZ_JAR" "$CALLBACK")
       # Read the cookie from the response headers, not the cookie jar: ext auth
       # marks it Secure, and curl does not store a Secure cookie that arrives
       # over plain http.
       COOKIE=$(sed -n 's/^[Ss]et-[Cc]ookie: *\(keycloak-session=[^;]*\).*/\1/p' <<<"$CALLBACK_HDRS" | tr -d '\r' | tail -1)
       test -n "$COOKIE" || { echo "the callback did not set the keycloak-session cookie"; echo "$CALLBACK_HDRS"; kubectl logs -n agentgateway-system deploy/ext-auth-service-enterprise-agentgateway --tail=30 || true; exit 1; }
       export COOKIE
       {{< /doc-test >}}
