       {{< doc-test paths="oauth-authorization-code" >}}
       # ============================================================================
       # Doc test coverage for "Authorization code" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The client secret, the AuthConfig with oidcAuthorizationCode, and the
       #     policy are accepted.
       #   * A request without a session is redirected (302) to the Keycloak
       #     authorization endpoint, with the gateway callback as redirect_uri.
       #   * The whole authorization code flow, run headless: the test fetches the
       #     Keycloak login form, posts user1's credentials, follows the redirect
       #     back to the callback path, and gets the keycloak-session cookie. A request
       #     with that cookie reaches the LLM.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The browser itself: the Keycloak login page is driven with curl, which
       #     covers the same HTTP exchanges but not the page rendering.
       #   * A live OpenAI completion: the openai prerequisite points the backend at
       #     the httpbun mock LLM.
       #   * The port-forward tabs: CI reaches the gateway through its LoadBalancer.
       # The Redis host in the AuthConfig above comes from a snippet that renders
       # empty for agentgateway (it has gates only for Gloo and kgateway versions),
       # which leaves `host: :6379`. Point it at the ext-cache Redis that the
       # enterprise install deploys, so the session can be stored.
       kubectl patch authconfig oauth-authorization-code -n {{< reuse "agw-docs/snippets/namespace.md" >}} --type=json \
         -p='[{"op":"replace","path":"/spec/configs/0/oauth2/oidcAuthorizationCode/session/redis/options/host","value":"ext-cache-enterprise-agentgateway:6379"}]'
       {{< /doc-test >}}
