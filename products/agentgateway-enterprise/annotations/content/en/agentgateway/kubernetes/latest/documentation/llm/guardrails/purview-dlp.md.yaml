  content: |-
    {{< doc-test paths="enterprise-purview-dlp" >}}
    # ============================================================================
    # Doc test coverage for "Purview DLP" (not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Step 3: the client secret and the EnterpriseAgentgatewayPolicy with the
    #     purviewDlp request and response guards are accepted on the openai backend
    #     (from the openai-setup prerequisite).
    #   * "Log DLP interventions": the access log policy is accepted on the Gateway.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Steps 1-2 (Entra app, Purview DLP policy) and the Step 4 requests: the
    #     guard calls Microsoft Entra and Microsoft Graph, which need a Microsoft 365
    #     tenant with Purview licensing; there is no in-cluster stand-in, so the IDs
    #     and secret below are placeholders and no request is sent.
    #   * "Per-user attribution with Entra OBO": needs an Entra user token.
    export TENANT_ID=00000000-0000-0000-0000-000000000001
    export CLIENT_ID=00000000-0000-0000-0000-000000000002
    export ENTRA_USER_OBJECT_ID=00000000-0000-0000-0000-000000000003
    export CLIENT_SECRET=doc-test-client-secret
    {{< /doc-test >}}
