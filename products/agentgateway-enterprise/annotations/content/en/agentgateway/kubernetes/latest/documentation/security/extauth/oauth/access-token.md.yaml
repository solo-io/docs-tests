  content: |2-
       {{< doc-test paths="oauth-access-token" >}}
       # ============================================================================
       # Doc test coverage for "Access token validation" (these comments are not rendered)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * The AuthConfig with the inline Keycloak JWKS reaches the Accepted state,
       #     and the policy that points the Gateway at the ext auth service is accepted.
       #   * A request without a token is denied with 403.
       #   * A Keycloak access token for user1 (password grant with the registered
       #     client) passes access token validation and reaches the LLM.
       #   * A token whose signature does not match the JWKS is denied.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A live OpenAI completion: the openai prerequisite patches the backend to
       #     the in-cluster httpbun mock LLM, so no provider key is needed.
       #   * The port-forward tabs: CI reaches the gateway through its LoadBalancer.
       # The IdP is the in-cluster Keycloak from "Keycloak as an IdP".
       kubectl wait --for=jsonpath='{.status.state}'=Accepted authconfig/oauth-jwt-validation -n {{< reuse "agw-docs/snippets/namespace.md" >}} --timeout=120s
       {{< /doc-test >}}
