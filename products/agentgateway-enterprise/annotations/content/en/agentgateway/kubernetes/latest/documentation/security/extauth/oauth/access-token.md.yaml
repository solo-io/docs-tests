       {{< doc-test paths="oauth-access-token" >}}
       YAMLTest -f - <<'EOF'
       - name: oauth-jwt-validation policy is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
               name: oauth-jwt-validation
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
