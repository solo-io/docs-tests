  content: |2-
       {{< doc-test paths="oauth-access-token" >}}
       # The LoadBalancer tab's command above is split across lines in the wrong
       # place, so it is not run. This is the same request, written as the
       # port-forward tab writes it, sent to the gateway's LoadBalancer address.
       BAD_TOKEN="${USER1_TOKEN%.*}.AAAA"
       YAMLTest -f - <<EOF
       - name: a request with user1's Keycloak access token passes validation
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: "application/json"
             authorization: "Bearer ${USER1_TOKEN}"
           body: '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"with token"}]}'
         source:
           type: local
         retries: 15
         expect:
           statusCode: 200
       - name: a token with a tampered signature is denied
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: "application/json"
             authorization: "Bearer ${BAD_TOKEN}"
           body: '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"bad token"}]}'
         source:
           type: local
         retries: 3
         expect:
           statusCode: 403
       EOF
       {{< /doc-test >}}
