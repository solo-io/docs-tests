           path: "/openai"
           method: POST
           headers:
             content-type: "application/json"
           body: '{"model":"gpt-3.5-turbo","messages":[{"role":"user","content":"no token"}]}'
         source:
           type: local
         retries: 15
         expect:
           statusCode: 403
       EOF
       {{< /doc-test >}}
