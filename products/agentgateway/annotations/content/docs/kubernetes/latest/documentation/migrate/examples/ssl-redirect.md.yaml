    preview: cat <<'EOF' > ssl-redirect-ingress.yaml
  content: |-
    {{< doc-test paths="migrate-ssl-redirect" >}}
    # Install the ingress2gateway version this guide documents, for this OS and CPU.
    I2G_VERSION="${I2G_VERSION:-v0.5.0}"
    i2g_arch=$(uname -m)
    [ "$i2g_arch" = "aarch64" ] && i2g_arch=arm64
    # A throwaway dir, so a local run leaves nothing in your home directory.
    I2G_BIN="${TMPDIR:-/tmp}/doc-test-ingress2gateway-${I2G_VERSION}"
    mkdir -p "$I2G_BIN"
    export PATH="$I2G_BIN:$PATH"
    if ! ingress2gateway version 2>/dev/null | grep -q "${I2G_VERSION#v}"; then
      curl -fsSL "https://github.com/kgateway-dev/ingress2gateway/releases/download/${I2G_VERSION}/ingress2gateway_$(uname -s)_${i2g_arch}.tar.gz" \
        | tar -xz -C "$I2G_BIN" ingress2gateway
    fi
    {{< /doc-test >}}
- after:
    block: 4
    fingerprint: b5c92c9d5c3949d4
    lang: bash
    lines: b5c92c9d
    preview: kubectl apply -f ssl-redirect-agentgateway.yaml
  content: |-
    {{< doc-test paths="migrate-ssl-redirect" >}}
    YAMLTest -f - <<'EOF'
    - name: the HTTP route redirects with 308
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: ssl-redirect-demo-secure-example-com-http
        jsonPath: "$.spec.rules[0].filters[0].requestRedirect.statusCode"
        jsonPathExpectation:
          comparator: equals
          value: 308
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    kubectl delete -f ssl-redirect-agentgateway.yaml --ignore-not-found
    {{< /doc-test >}}
