    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="llm-prompt-templates-run" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the dynamic-prompt-template policy to be accepted
         wait:
           target:
             kind: AgentgatewayPolicy
             metadata:
               namespace: agentgateway-system
               name: dynamic-prompt-template
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       # The transformation puts the x-user-id header into a system message, so a longer
       # user ID must produce a larger prompt at the provider.
       prompt_tokens() {
         curl -s -w '\n%{http_code}' "http://${INGRESS_GW_ADDRESS}:80/openai" -H content-type:application/json -H "x-user-id: $1" \
           -d '{"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "What are my recent orders?"}]}' > /tmp/doc-test-prompt.out || true
         python3 -c 'import json,sys; print(json.loads(open("/tmp/doc-test-prompt.out").read().rsplit("\n",1)[0])["usage"]["prompt_tokens"])' 2>/dev/null
       }
       short=""; long=""
       for i in $(seq 1 10); do
         short=$(prompt_tokens alice || true)
         long=$(prompt_tokens "alice from the returns team in the north region office" || true)
         [ -n "$short" ] && [ -n "$long" ] && [ "$long" -gt "$short" ] && break
         sleep 2
       done
       if ! { [ -n "$short" ] && [ -n "$long" ] && [ "$long" -gt "$short" ]; }; then
         echo "x-user-id was not injected into the prompt: prompt_tokens short=${short} long=${long}"
         echo "last response (body, then HTTP status):"; cat /tmp/doc-test-prompt.out || true
         exit 1
       fi
       {{< /doc-test >}}
