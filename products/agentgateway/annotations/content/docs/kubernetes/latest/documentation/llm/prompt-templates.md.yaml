    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="llm-prompt-templates-run" >}}
       # The httpbun mock counts the prompt it receives in usage.prompt_tokens. The user
       # message alone is under 10 tokens; with the prepended and appended system
       # messages it is well over 20, which shows the template reached the provider.
       YAMLTest -f - <<'EOF'
       - name: wait for the static-prompt-template policy to be accepted
         wait:
           target:
             kind: AgentgatewayPolicy
             metadata:
               namespace: agentgateway-system
               name: static-prompt-template
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: the static template adds system messages to the prompt
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "How do I return a product?"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.usage.prompt_tokens"
               comparator: greaterThan
               value: 20
       EOF
       {{< /doc-test >}}
