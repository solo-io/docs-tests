  content: |-
    {{< doc-test paths="path-match-exact" >}}
    for i in $(seq 1 100); do
      curl -s --max-time 5 -o /dev/null "http://${INGRESS_GW_ADDRESS}:80/get" -H "host: match.example" && break
      sleep 2
    done
    YAMLTest -f - <<'EOF'
    - name: wait for httpbin-match HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-match
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for httpbin-match HTTPRoute refs to be resolved
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-match
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: exact path match - /status/200 returns 200
      retries: 1
      http:
        url: "http://${INGRESS_GW_ADDRESS}:80"
        path: /status/200
        method: GET
        headers:
          host: match.example
      source:
        type: local
      expect:
        statusCode: 200
    - name: exact path match - /headers returns 404
      http:
        url: "http://${INGRESS_GW_ADDRESS}:80"
        path: /headers
        method: GET
        headers:
          host: match.example
      source:
        type: local
      expect:
        statusCode: 404
    EOF
    {{< /doc-test >}}
