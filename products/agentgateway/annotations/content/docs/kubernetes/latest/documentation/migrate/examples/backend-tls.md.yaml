    preview: cat <<'EOF' > backend-tls-ingress.yaml
  content: |-
    {{< doc-test paths="migrate-backend-tls" >}}
    # Install the ingress2gateway version this guide documents, for this OS and CPU.
    I2G_VERSION="${I2G_VERSION:-v0.5.0}"
    i2g_arch=$(uname -m)
    [ "$i2g_arch" = "aarch64" ] && i2g_arch=arm64
    # A throwaway dir, so a local run leaves nothing in your home directory.
    I2G_BIN="${TMPDIR:-/tmp}/doc-test-ingress2gateway-${I2G_VERSION}"
    mkdir -p "$I2G_BIN"
    export PATH="$I2G_BIN:$PATH"
    if ! ingress2gateway version 2>/dev/null | grep -q "${I2G_VERSION#v}"; then
      curl -fsSL "https://github.com/kgateway-dev/ingress2gateway/releases/download/${I2G_VERSION}/ingress2gateway_$(uname -s)_${i2g_arch}.tar.gz" \
        | tar -xz -C "$I2G_BIN" ingress2gateway
    fi
    {{< /doc-test >}}
- after:
    block: 5
    fingerprint: 944a286051f388ed
    lang: bash
    lines: 944a2860
    preview: kubectl apply -f backend-tls-agentgateway.yaml
  content: |-
    {{< doc-test paths="migrate-backend-tls" >}}
    YAMLTest -f - <<'EOF'
    - name: the BackendTLSPolicy validates the backend hostname
      wait:
        target:
          kind: BackendTLSPolicy
          metadata:
            namespace: default
            name: secure-api-backend-tls
        jsonPath: "$.spec.validation.hostname"
        jsonPathExpectation:
          comparator: equals
          value: "internal-api.example.com"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the AgentgatewayPolicy sets the SNI
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: default
            name: secure-api-backend-tls
        jsonPath: "$.spec.backend.tls.sni"
        jsonPathExpectation:
          comparator: equals
          value: "internal-api.example.com"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    kubectl delete -f backend-tls-agentgateway.yaml --ignore-not-found
    {{< /doc-test >}}
