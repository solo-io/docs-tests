    preview: cat <<'EOF' > external-auth-ingress.yaml
  content: |-
    {{< doc-test paths="migrate-external-auth" >}}
    # Install the ingress2gateway version this guide documents, for this OS and CPU.
    I2G_VERSION="${I2G_VERSION:-v0.5.0}"
    i2g_arch=$(uname -m)
    [ "$i2g_arch" = "aarch64" ] && i2g_arch=arm64
    # A throwaway dir, so a local run leaves nothing in your home directory.
    I2G_BIN="${TMPDIR:-/tmp}/doc-test-ingress2gateway-${I2G_VERSION}"
    mkdir -p "$I2G_BIN"
    export PATH="$I2G_BIN:$PATH"
    if ! ingress2gateway version 2>/dev/null | grep -q "${I2G_VERSION#v}"; then
      curl -fsSL "https://github.com/kgateway-dev/ingress2gateway/releases/download/${I2G_VERSION}/ingress2gateway_$(uname -s)_${i2g_arch}.tar.gz" \
        | tar -xz -C "$I2G_BIN" ingress2gateway
    fi
    {{< /doc-test >}}
- after:
    block: 4
    fingerprint: f5cd959c53ba62fc
    lang: bash
    lines: f5cd959c
    preview: kubectl apply -f external-auth-agentgateway.yaml
  content: |-
    {{< doc-test paths="migrate-external-auth" >}}
    YAMLTest -f - <<'EOF'
    - name: the ext auth policy points at auth-service
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: default
            name: ext-auth-demo
        jsonPath: "$.spec.traffic.extAuth.backendRef.name"
        jsonPathExpectation:
          comparator: equals
          value: "auth-service"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    kubectl delete -f external-auth-agentgateway.yaml --ignore-not-found
    {{< /doc-test >}}
