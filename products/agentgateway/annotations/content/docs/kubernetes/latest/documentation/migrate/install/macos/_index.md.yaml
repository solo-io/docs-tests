  content: |2-
        {{< doc-test paths="migrate-install-macos" >}}
        # Runs on a macOS runner (runner: macos in tests.yaml). Work in a temp folder, and use
        # this machine's architecture instead of the page's arm64 example.
        case "$(uname -m)" in arm64) ARCH=arm64 ;; x86_64) ARCH=x86_64 ;; esac
        DOC_TEST_DIR=$(mktemp -d)
        cd "$DOC_TEST_DIR"
        {{< /doc-test >}}
- after:
    block: 7
    fingerprint: 896b20f5145ad524
    lang: bash
    lines: 896b20f5
    preview: ingress2gateway version
  content: |2-
        {{< doc-test paths="migrate-install-macos" >}}
        # The page says the checksum check prints OK; --check exits non-zero otherwise, and the
        # tagged block above runs under set -e. Now confirm the installed binary is the one on
        # PATH and reports the version that was downloaded.
        command -v ingress2gateway | grep -qx /usr/local/bin/ingress2gateway \
          || { echo "ingress2gateway on PATH is $(command -v ingress2gateway), not /usr/local/bin"; exit 1; }
        out=$(ingress2gateway version 2>&1)
        echo "$out"
        echo "$out" | grep -q "${VERSION#v}" || { echo "version output does not mention ${VERSION}"; exit 1; }
        sudo rm -f /usr/local/bin/ingress2gateway
        cd / && rm -rf "$DOC_TEST_DIR"
        {{< /doc-test >}}
