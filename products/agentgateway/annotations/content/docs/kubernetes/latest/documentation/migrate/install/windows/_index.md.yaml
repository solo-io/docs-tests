  content: |2-
        {{< doc-test paths="migrate-install-windows" >}}
        # Runs on a Windows runner (runner: windows in tests.yaml) in Git Bash, the shell the
        # page's ${VAR} syntax needs. Use this machine's architecture instead of the page's arm64
        # example, and put Windows' own tar.exe first on PATH: the page says to use Command
        # Prompt, whose tar can extract a .zip, and Git Bash's GNU tar cannot.
        case "${PROCESSOR_ARCHITECTURE:-AMD64}" in ARM64) ARCH=arm64 ;; x86) ARCH=i386 ;; *) ARCH=x86_64 ;; esac
        export PATH="/c/Windows/System32:$PATH"
        DOC_TEST_DIR=$(mktemp -d)
        cd "$DOC_TEST_DIR"
        {{< /doc-test >}}
- after:
    block: 2
    fingerprint: 1b4d5a129d05077e
