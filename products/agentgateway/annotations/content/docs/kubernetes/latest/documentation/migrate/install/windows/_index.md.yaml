    preview: curl -LO https://github.com/kgateway-dev/ingress2gateway/releases/download/${VER
  content: |2-
        {{< doc-test paths="migrate-install-windows" >}}
        # The page asks readers to compare CertUtil's hash with checksums.txt by eye. Do the
        # same comparison here. (CertUtil prints the hash, not "OK" as the page's example shows.)
        want=$(grep -F "  ingress2gateway_${OS}_${ARCH}.zip" checksums.txt | awk '{print $1}')
        got=$(CertUtil -hashfile "ingress2gateway_${OS}_${ARCH}.zip" SHA256 | sed -n 2p | tr -d ' \r' | tr 'A-F' 'a-f')
        [ -n "$want" ] && [ "$want" = "$got" ] || { echo "checksum mismatch: checksums.txt=$want CertUtil=$got"; exit 1; }
        {{< /doc-test >}}
