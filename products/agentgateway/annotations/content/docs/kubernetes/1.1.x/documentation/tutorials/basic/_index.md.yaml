  content: |-
    {{< doc-test paths="basic-mcp" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for mcp-backend to be accepted
      wait:
        target:
          kind: AgentgatewayBackend
          metadata:
            namespace: agentgateway-system
            name: mcp-backend
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2

    - name: wait for mcp HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: agentgateway-system
            name: mcp
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
