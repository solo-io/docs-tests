- after:
    block: 2
    fingerprint: b3def76266d3c275
    lang: sh
    lines: b3def762
    preview: kubectl rollout status deployment/opentelemetry-collector-traces -n telemetry
  content: |-
    {{< doc-test paths="langsmith" >}}
    # Prerequisite from the OpenTelemetry stack guide: the tracing policy that sends the
    # proxy's traces to opentelemetry-collector-traces.
    kubectl apply -f- <<'EOF'
    apiVersion: agentgateway.dev/v1alpha1
    kind: AgentgatewayPolicy
    metadata:
      name: tracing
      namespace: agentgateway-system
    spec:
      targetRefs:
        - kind: Gateway
          name: agentgateway-proxy
          group: gateway.networking.k8s.io
      frontend:
        tracing:
          backendRef:
            name: opentelemetry-collector-traces
            namespace: telemetry
            port: 4317
          protocol: GRPC
          randomSampling: "true"
    EOF
    YAMLTest -f - <<'EOF'
    - name: wait for the tracing policy to be accepted
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: agentgateway-system
            name: tracing
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
- after:
    block: 3
    fingerprint: f80fbca2383a3396
    lang: sh
    lines: adf11cef 493f47f6 e66f4a20 fc075a9d
    preview: curl "$INGRESS_GW_ADDRESS/openai" -H content-type:application/json -d '{
  content: |2-
       {{< doc-test paths="langsmith" >}}
       # The page checks the vendor UI by eye. Check instead that the collector received the
       # agentgateway LLM span: the debug exporter prints it with its gen_ai attributes. Keep
       # sending requests until the span shows up, since tracing starts after the policy lands.
       found=""
       for i in $(seq 1 40); do
         curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}/openai" -H content-type:application/json \
           -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello!"}]}' || true
         # Save the logs first: piping them into `grep -q` fails under pipefail when grep
         # stops reading early.
         kubectl logs deploy/opentelemetry-collector-traces -n telemetry --tail=-1 > /tmp/doc-test-collector.log 2>/dev/null || true
         if grep -q 'gen_ai.request.model: Str(gpt-4o-mini)' /tmp/doc-test-collector.log; then
           found=yes; break
         fi
         sleep 3
       done
       if [ -z "$found" ]; then
         echo "the collector has no agentgateway span with gen_ai.request.model=gpt-4o-mini"
         kubectl logs deploy/opentelemetry-collector-traces -n telemetry --tail=60 || true
         exit 1
       fi
       helm uninstall opentelemetry-collector-traces -n telemetry || true
       kubectl delete agentgatewaypolicy tracing -n agentgateway-system --ignore-not-found
       kubectl delete secret langsmith-api-key -n telemetry --ignore-not-found
       kubectl delete namespace telemetry --ignore-not-found
       {{< /doc-test >}}
