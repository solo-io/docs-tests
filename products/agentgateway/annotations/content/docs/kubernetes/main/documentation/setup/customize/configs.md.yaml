  content: |-
    {{< doc-test paths="customize-configs-run" >}}
    # Attach the parameters to a Gateway so that a proxy starts with the headers.
    kubectl apply --server-side -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: xds-headers
      namespace: agentgateway-system
    spec:
      gatewayClassName: agentgateway
      infrastructure:
        parametersRef:
          group: agentgateway.dev
          kind: AgentgatewayParameters
          name: agentgateway-config
      listeners:
        - name: http
          port: 80
          protocol: HTTP
    EOF
    YAMLTest -f - <<'EOF'
    - name: the proxy with XDS_HEADER_* variables starts and becomes available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: agentgateway-system
            name: xds-headers
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    for pair in XDS_HEADER_X_ISTIO_REVISION=canary XDS_HEADER_X_TENANT=team-a; do
      name=${pair%%=*}; want=${pair#*=}
      got=$(kubectl get deployment xds-headers -n agentgateway-system \
        -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${name}')].value}")
      if [ "$got" != "$want" ]; then
        echo "${name} on the xds-headers proxy is '${got}', expected '${want}'"
        exit 1
      fi
    done
    kubectl delete gateway xds-headers -n agentgateway-system
    {{< /doc-test >}}
