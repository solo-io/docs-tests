    preview: cat <<'EOF' > basic-ingress.yaml
  content: |-
    {{< doc-test paths="migrate-basic" >}}
    # Install the ingress2gateway version this guide documents, for this OS and CPU.
    I2G_VERSION="${I2G_VERSION:-v0.5.0}"
    i2g_arch=$(uname -m)
    [ "$i2g_arch" = "aarch64" ] && i2g_arch=arm64
    # A throwaway dir, so a local run leaves nothing in your home directory.
    I2G_BIN="${TMPDIR:-/tmp}/doc-test-ingress2gateway-${I2G_VERSION}"
    mkdir -p "$I2G_BIN"
    export PATH="$I2G_BIN:$PATH"
    if ! ingress2gateway version 2>/dev/null | grep -q "${I2G_VERSION#v}"; then
      curl -fsSL "https://github.com/kgateway-dev/ingress2gateway/releases/download/${I2G_VERSION}/ingress2gateway_$(uname -s)_${i2g_arch}.tar.gz" \
        | tar -xz -C "$I2G_BIN" ingress2gateway
    fi
    {{< /doc-test >}}
- after:
    block: 4
    fingerprint: 6d9a28ab71a42922
    lang: bash
    lines: bb64d3b0 444e8359 3771ff7f
    preview: kubectl apply -f basic-agentgateway.yaml
  content: |-
    {{< doc-test paths="migrate-basic" >}}
    YAMLTest -f - <<'EOF'
    - name: the Gateway uses the agentgateway class
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: default
            name: nginx
        jsonPath: "$.spec.gatewayClassName"
        jsonPathExpectation:
          comparator: equals
          value: "agentgateway"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the HTTPRoute attaches to the nginx Gateway
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: demo-localhost-demo-localdev-me
        jsonPath: "$.spec.parentRefs[0].name"
        jsonPathExpectation:
          comparator: equals
          value: "nginx"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    kubectl delete -f basic-agentgateway.yaml --ignore-not-found
    {{< /doc-test >}}
