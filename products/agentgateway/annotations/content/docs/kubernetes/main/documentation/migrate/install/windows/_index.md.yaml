    preview: $VERSION = "v0.5.0"
  content: |2-
        {{< doc-test paths="migrate-install-windows" >}}
        # Runs on a Windows runner (runner: windows, shell: pwsh in tests.yaml). Use this
        # machine's architecture instead of the page's x86_64 example, and work in a temp folder.
        $ARCH = switch ($env:PROCESSOR_ARCHITECTURE) { "ARM64" { "arm64" } "x86" { "i386" } default { "x86_64" } }
        $DocTestDir = Join-Path ([System.IO.Path]::GetTempPath()) ("doc-test-" + [guid]::NewGuid())
        New-Item -ItemType Directory -Path $DocTestDir | Out-Null
        Set-Location $DocTestDir
        {{< /doc-test >}}
- after:
    block: 3
    fingerprint: f38ed0a8045f69e8
    lang: powershell
    lines: c9c459e5 e0c3a39f 2c68786d
    preview: $expected = (Select-String -Path checksums.txt -Pattern "ingress2gateway_${OS}_$
  content: |2-
        {{< doc-test paths="migrate-install-windows" >}}
        # The page's comparison prints a message either way; fail the test on a mismatch.
        if (-not $expected) { throw "checksums.txt has no entry for ingress2gateway_${OS}_${ARCH}.zip" }
        if ($actual -ne $expected) { throw "checksum mismatch: checksums.txt=$expected Get-FileHash=$actual" }
        {{< /doc-test >}}
- after:
    block: 7
    fingerprint: 896b20f5145ad524
    lang: powershell
    lines: 896b20f5
    preview: ingress2gateway version
  content: |2-
        {{< doc-test paths="migrate-install-windows" >}}
        $out = ingress2gateway version 2>&1 | Out-String
        Write-Output $out
        if ($out -notmatch [regex]::Escape($VERSION.TrimStart("v"))) { throw "version output does not mention $VERSION" }
        Set-Location ([System.IO.Path]::GetTempPath())
        Remove-Item -Recurse -Force $DocTestDir
        {{< /doc-test >}}
