    preview: cat <<'EOF' > ratelimit-ingress.yaml
  content: |-
    {{< doc-test paths="migrate-rate-limiting" >}}
    # Install the ingress2gateway version this guide documents, for this OS and CPU.
    I2G_VERSION="${I2G_VERSION:-v0.5.0}"
    i2g_arch=$(uname -m)
    [ "$i2g_arch" = "aarch64" ] && i2g_arch=arm64
    # A throwaway dir, so a local run leaves nothing in your home directory.
    I2G_BIN="${TMPDIR:-/tmp}/doc-test-ingress2gateway-${I2G_VERSION}"
    mkdir -p "$I2G_BIN"
    export PATH="$I2G_BIN:$PATH"
    if ! ingress2gateway version 2>/dev/null | grep -q "${I2G_VERSION#v}"; then
      curl -fsSL "https://github.com/kgateway-dev/ingress2gateway/releases/download/${I2G_VERSION}/ingress2gateway_$(uname -s)_${i2g_arch}.tar.gz" \
        | tar -xz -C "$I2G_BIN" ingress2gateway
    fi
    {{< /doc-test >}}
- after:
    block: 4
    fingerprint: 107794687c9bb92b
    lang: bash
    lines: '10779468'
    preview: kubectl apply -f ratelimit-agentgateway.yaml
  content: |-
    {{< doc-test paths="migrate-rate-limiting" >}}
    YAMLTest -f - <<'EOF'
    - name: the local rate limit is 10 requests
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: default
            name: ratelimit-demo
        jsonPath: "$.spec.traffic.rateLimit.local[0].requests"
        jsonPathExpectation:
          comparator: equals
          value: 10
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the burst is 20
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: default
            name: ratelimit-demo
        jsonPath: "$.spec.traffic.rateLimit.local[0].burst"
        jsonPathExpectation:
          comparator: equals
          value: 20
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    kubectl delete -f ratelimit-agentgateway.yaml --ignore-not-found
    {{< /doc-test >}}
