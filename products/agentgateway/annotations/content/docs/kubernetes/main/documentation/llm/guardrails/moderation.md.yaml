    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="guardrails-moderation-inline" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Moderate content inline on the OpenAI provider": the documented backend
       #     translates in full, and every chat request that agentgateway sends to
       #     OpenAI carries the configured `moderation` parameter (model
       #     omni-moderation-latest, input Block, output Score). A mock provider in the
       #     cluster logs each request body it receives.
       #   * A `moderation` value that the client sends is replaced by the configured one.
       #
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * "Block harmful content with the moderation prompt guard", the scope example,
       #     and the guard cleanup: agentgateway calls the OpenAI Moderation API itself,
       #     with no host override, so the guard needs a real OpenAI API key.
       #     Credentialed, not tested.
       #   * The `moderation` results in the response: OpenAI produces them.
       kubectl apply -f- <<'EOF'
       apiVersion: v1
       kind: ConfigMap
       metadata:
         name: moderation-mock
         namespace: default
       data:
         mock.py: |
           import json
           from http.server import BaseHTTPRequestHandler, HTTPServer
           class Handler(BaseHTTPRequestHandler):
               def do_POST(self):
                   length = int(self.headers.get("content-length") or 0)
                   request = json.loads(self.rfile.read(length) or b"{}")
                   print(json.dumps(request), flush=True)
                   message = dict(role="assistant", content="mock completion")
                   response = dict(id="chatcmpl-mock", object="chat.completion", created=0,
                                   model=request.get("model", "mock"),
                                   choices=[dict(index=0, finish_reason="stop", message=message)],
                                   usage=dict(prompt_tokens=1, completion_tokens=1, total_tokens=2))
                   payload = json.dumps(response).encode()
                   self.send_response(200)
                   self.send_header("content-type", "application/json")
                   self.send_header("content-length", str(len(payload)))
                   self.end_headers()
                   self.wfile.write(payload)
               def log_message(self, *args):
                   pass
           HTTPServer(("0.0.0.0", 3094), Handler).serve_forever()
       EOF
       kubectl apply -f- <<'EOF'
       apiVersion: apps/v1
       kind: Deployment
       metadata:
         name: moderation-mock
         namespace: default
       spec:
         replicas: 1
         selector:
           matchLabels:
             app: moderation-mock
         template:
           metadata:
             labels:
               app: moderation-mock
           spec:
             containers:
             - name: mock
               image: python:3.12-alpine
               command: ["python", "-u", "/app/mock.py"]
               ports:
               - containerPort: 3094
               volumeMounts:
               - name: app
                 mountPath: /app
             volumes:
             - name: app
               configMap:
                 name: moderation-mock
       EOF
       kubectl apply -f- <<'EOF'
       apiVersion: v1
       kind: Service
       metadata:
         name: moderation-mock
         namespace: default
       spec:
         selector:
           app: moderation-mock
         ports:
         - port: 3094
           targetPort: 3094
       EOF
       kubectl rollout status deployment/moderation-mock -n default --timeout=180s
       # Point the documented backend at the mock. `path: null` drops the httpbun path
       # from the openai-setup prerequisite, so requests keep the OpenAI path.
       kubectl patch {{< reuse "agw-docs/snippets/backend.md" >}} openai -n {{< reuse "agw-docs/snippets/namespace.md" >}} --type=merge \
         -p '{"spec":{"ai":{"provider":{"host":"moderation-mock.default.svc.cluster.local","port":3094,"path":null}}}}'
       YAMLTest -f - <<'EOF'
       - name: the openai backend with inline moderation is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       # Accepted=True also covers a partly translated backend (reason PartiallyValid),
       # which can silently drop its auth policy. The reason tells the two apart.
       - name: the openai backend with inline moderation translated in full, not partly
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: "Accepted"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       # Assert on the last request body that the mock received.
       check_upstream() {
         kubectl logs deployment/moderation-mock -n default --tail=1 > /tmp/moderation-up.json
         python3 - "$1" <<'PY'
       import json, sys
       up = json.load(open("/tmp/moderation-up.json"))
       mod = up.get("moderation") or {}
       policy = mod.get("policy") or {}
       mode = lambda side: str((policy.get(side) or {}).get("mode", "")).lower()
       if not eval(sys.argv[1]):
           sys.exit(f"FAIL: {sys.argv[1]}\nupstream body: {up}")
       PY
       }
       for _ in $(seq 1 30); do
         [ "$(curl -s -m 10 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:80/openai" -H content-type:application/json \
           -d '{"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Hello"}]}')" = "200" ] && break
         sleep 2
       done
       {{< /doc-test >}}
