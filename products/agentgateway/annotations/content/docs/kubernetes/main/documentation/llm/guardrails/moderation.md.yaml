       # The request that left the gateway carries the configured moderation parameter.
       check_upstream 'mod.get("model") == "omni-moderation-latest" and mode("input") == "block" and mode("output") == "score"'
       # A client-supplied moderation value is replaced with the configured one.
       curl -s -m 10 -o /dev/null "http://${INGRESS_GW_ADDRESS}:80/openai" -H "content-type: application/json" \
         -d '{"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Hello"}], "moderation": {"model": "client-weaker-model"}}'
       check_upstream 'mod.get("model") == "omni-moderation-latest" and mode("input") == "block"'
       echo "inline moderation is set by the gateway and cannot be overridden by the client"
