  content: |-
    {{< doc-test paths="migrate-canary" >}}
    YAMLTest -f - <<'EOF'
    - name: the primary backend gets 80% of traffic
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: app-canary-app-example-com
        jsonPath: "$.spec.rules[0].backendRefs[?(@.name=='app-v1')].weight"
        jsonPathExpectation:
          comparator: equals
          value: 80
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the canary backend gets 20% of traffic
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: app-canary-app-example-com
        jsonPath: "$.spec.rules[0].backendRefs[?(@.name=='app-v2')].weight"
        jsonPathExpectation:
          comparator: equals
          value: 20
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    kubectl delete -f canary-agentgateway.yaml --ignore-not-found
    {{< /doc-test >}}
