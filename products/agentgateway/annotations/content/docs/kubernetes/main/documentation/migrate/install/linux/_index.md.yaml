    preview: tar -xvf ingress2gateway_${OS}_${ARCH}.tar.gz
  content: |2-
        {{< doc-test paths="migrate-install-linux" >}}
        # Step 6 runs the installed binary from PATH; run the extracted one in place.
        I2G_OUT=$(./ingress2gateway version 2>&1)
        echo "$I2G_OUT"
        grep -q "${VERSION#v}" <<<"$I2G_OUT" || { echo "FAIL: ingress2gateway version does not report ${VERSION}"; exit 1; }
        echo "ok: ingress2gateway ${VERSION} runs on ${OS}/${ARCH}"
        cd "$I2G_TEST_PREV_DIR"
        rm -rf "$I2G_TEST_DIR"
        {{< /doc-test >}}
