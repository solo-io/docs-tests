  content: |2-
        {{< doc-test paths="migrate-install-linux" >}}
        # ============================================================================
        # Doc test coverage for this guide (these comments are not rendered on the page)
        # ============================================================================
        # WHAT THIS TEST VALIDATES:
        #   * Steps 2-4: the release tarball and checksums file download from the documented
        #     URLs, the checksum validates, and the tarball extracts an ingress2gateway binary.
        #   * Step 6: the extracted binary runs and reports the documented VERSION.
        # WHAT THIS TEST DOES NOT VALIDATE (and why):
        #   * Step 5 - it installs with sudo into /usr/local/bin or into ~/.local/bin; the
        #     test runs the extracted binary in place so it changes nothing outside a temp dir.
        # Step 1 hardcodes ARCH=arm64 as an example. Use the runner's architecture instead,
        # named the way the release assets are (x86_64 or arm64).
        ARCH=$(uname -m)
        [ "$ARCH" = "aarch64" ] && ARCH=arm64
        I2G_TEST_PREV_DIR="$PWD"
        I2G_TEST_DIR=$(mktemp -d "${TMPDIR:-/tmp}/doc-test-i2g-linux.XXXXXX")
        cd "$I2G_TEST_DIR"
        {{< /doc-test >}}
- after:
    block: 5
    fingerprint: bea9765bd4e56982
