  content: |-
    {{< doc-test paths="multiple-llms" >}}
    cat <<'EOF' > config.yaml
    llm:
      providers:
      - name: openai-prod
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"

      models:
      - name: fast
        provider:
          reference: openai-prod
        params:
          model: gpt-4o-mini
      - name: smart
        provider:
          reference: openai-prod
        params:
          model: gpt-4o
    EOF
    agentgateway -f config.yaml --validate-only
    {{< /doc-test >}}
