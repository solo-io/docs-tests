  content: |-
    {{< doc-test paths="direct-response" >}}
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      default:
        port: 3000
    routes:
    - policies:
        directResponse:
          body: "Not found!"
          status: 404
    EOF

    cat <<'EOF' > config-mcp.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    mcp:
      port: 3000
      policies:
        directResponse:
          body: "Not found!"
          status: 404
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
    EOF
    agentgateway -f config-mcp.yaml --validate-only
    {{< /doc-test >}}
