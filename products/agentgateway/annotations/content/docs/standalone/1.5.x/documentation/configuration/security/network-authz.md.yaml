  content: |-
    {{< doc-test paths="network-authz" >}}
    # Runtime check for "Require mTLS client identity". Create a test CA, a server
    # certificate for localhost, and two client certificates from the same CA: one
    # with the SPIFFE ID that the example requires, and one with a different
    # SPIFFE ID. The example's gateway reads certs/cert.pem, certs/key.pem, and
    # certs/ca.pem, and --validate-only reads those files too.
    mkdir -p certs
    openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=test-ca" \
      -keyout certs/ca.key -out certs/ca.pem 2>/dev/null
    issue_cert() {
      openssl req -newkey rsa:2048 -nodes -subj "/CN=$1" \
        -keyout "certs/$1.key" -out "certs/$1.csr" 2>/dev/null
      printf 'subjectAltName=%s\n' "$2" > "certs/$1.ext"
      openssl x509 -req -in "certs/$1.csr" -CA certs/ca.pem -CAkey certs/ca.key \
        -CAcreateserial -days 1 -extfile "certs/$1.ext" -out "certs/$1.pem" 2>/dev/null
    }
    issue_cert server "DNS:localhost,IP:127.0.0.1"
    cp certs/server.pem certs/cert.pem
    cp certs/server.key certs/key.pem
    issue_cert my-service "URI:spiffe://cluster.local/ns/default/sa/my-service"
    issue_cert other-service "URI:spiffe://cluster.local/ns/default/sa/other-service"

    cat <<'EOF' > config-mtls.yaml
    frontendPolicies:
      networkAuthorization:
        rules:
        - require: 'source.spiffeId == "spiffe://cluster.local/ns/default/sa/my-service"'

    gateways:
      default:
        port: 3443
        tls:
          cert: certs/cert.pem
          key: certs/key.pem
          root: certs/ca.pem
    routes:
    - backends:
      - host: localhost:8080
    EOF
    agentgateway -f config-mtls.yaml --validate-only

    agentgateway -f config-mtls.yaml &
    AGW_PID=$!
    sleep 3

    # A connection that network authorization admits reaches HTTP routing and gets
    # a 503 from the placeholder backend at localhost:8080. A rejected connection is
    # reset at L4, so curl reports 000.
    client_status() {
      curl -s -o /dev/null -w '%{http_code}' --max-time 5 --cacert certs/ca.pem "$@" https://localhost:3443/ || true
    }
    ALLOWED=$(client_status --cert certs/my-service.pem --key certs/my-service.key)
    OTHER=$(client_status --cert certs/other-service.pem --key certs/other-service.key)
    NO_CERT=$(client_status)
    kill $AGW_PID 2>/dev/null || true
    wait $AGW_PID 2>/dev/null || true

    if [ "$ALLOWED" != "503" ]; then
      echo "FAIL: expected the client with the required SPIFFE ID to reach HTTP routing (503), got $ALLOWED"
      exit 1
    fi
    if [ "$OTHER" != "000" ]; then
      echo "FAIL: expected the client with a different SPIFFE ID to be rejected, got $OTHER"
      exit 1
    fi
    if [ "$NO_CERT" != "000" ]; then
      echo "FAIL: expected a client without a certificate to be rejected, got $NO_CERT"
      exit 1
    fi
    echo "✓ Network authorization admitted only the client whose certificate carries the required SPIFFE ID"
    {{< /doc-test >}}
