  content: |-
    {{< doc-test paths="apikey-authn" >}}
    # WHAT THIS TEST VALIDATES:
    #   * The apiKey authentication policy is accepted by agentgateway in all three
    #     configuration forms: routing-based (gateways), simplified LLM (llm.policies),
    #     and simplified MCP (mcp.policies).
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * That a request with the given key is actually authenticated at runtime —
    #     requires a backend the page omits to forward to.
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      default:
        port: 3000
        apiKey:
          mode: strict
          keys:
          - key: sk-testkey-1
            metadata:
              user: test
              role: admin
    routes:
    - backends:
      - host: localhost:8080
    EOF
    agentgateway -f config.yaml --validate-only

    cat <<'EOF' > config-llm.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      policies:
        apiKey:
          mode: strict
          keys:
          - key: sk-testkey-1
            metadata:
              user: test
              role: admin
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f config-llm.yaml --validate-only

    cat <<'EOF' > config-mcp.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    mcp:
      port: 3000
      policies:
        apiKey:
          mode: strict
          keys:
          - key: sk-testkey-1
            metadata:
              user: test
              role: admin
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
    EOF
    agentgateway -f config-mcp.yaml --validate-only
    {{< /doc-test >}}
