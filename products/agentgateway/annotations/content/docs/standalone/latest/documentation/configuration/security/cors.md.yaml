  content: |-
    {{< doc-test paths="cors" >}}
    cat <<'EOF' > config-llm.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      policies:
        cors:
          allowOrigins:
          - https://chat.example.com
          allowMethods:
          - POST
          - OPTIONS
          allowHeaders:
          - authorization
          - content-type
          exposeHeaders:
          - x-request-id
          allowCredentials: true
          maxAge: 10m
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f config-llm.yaml --validate-only

    cat <<'EOF' > config-mcp.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    mcp:
      port: 3000
      policies:
        cors:
          allowOrigins:
          - https://chat.example.com
          allowMethods:
          - POST
          - OPTIONS
          allowHeaders:
          - authorization
          - content-type
          exposeHeaders:
          - x-request-id
          allowCredentials: true
          maxAge: 10m
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
    EOF
    agentgateway -f config-mcp.yaml --validate-only

    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      default:
        port: 3000
    routes:
    - backends:
      - host: api.example.com:443
      policies:
        cors:
          allowOrigins:
          - https://app.example.com
          allowMethods:
          - GET
          - POST
          - OPTIONS
          allowHeaders:
          - authorization
          - content-type
          exposeHeaders:
          - x-request-id
          allowCredentials: true
          maxAge: 100s
    EOF
    agentgateway -f config.yaml --validate-only
    {{< /doc-test >}}
