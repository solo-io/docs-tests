  content: |-
    {{< doc-test paths="guardrail-webhooks" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # The tests run a local webhook stub on localhost:8000 that speaks the guardrail
    # webhook API, and a local mock LLM. Each documented config is written exactly as
    # the page shows it, then a copy is derived that swaps the example webhook host for
    # localhost:8000 and points the model at the mock LLM.
    # WHAT THIS TEST VALIDATES:
    #   * All five example configs are accepted by agentgateway (--validate-only).
    #   * "Configuration": agentgateway calls POST /request and POST /response on the
    #     webhook, and a clean prompt passes both guards (200).
    #   * "Reject content from a webhook": a webhook reply with status_code 451 and a
    #     body is returned to the client as that status and body.
    #   * "Configure a webhook timeout": a webhook referenced as the named backend
    #     `/content-safety-webhook` is called and can reject the request.
    #   * "Customize the request path and headers": the webhook receives the request on
    #     the `:path` set in `headers`, with x-tenant from the client request and
    #     x-model set, and without x-user, because jwt.sub cannot be evaluated without
    #     a JWT.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The https:// webhook target with backendTLS - it needs a TLS webhook server
    #     at content-safety-webhook.example.com; the config is validated only.
    #   * The 35s timeout itself and mask actions - not observable in a short run with
    #     the mock LLM.
    #   * DeepKeep - external service, covered by its own integration page.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > /tmp/doc-test-webhooks-agw.log 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat /tmp/doc-test-webhooks-agw.log; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    # The page's heredocs use an unquoted EOF, so the shell expands `$schema` in the
    # yaml-language-server comment. Keep that line intact under `set -u`.
    schema='$schema'
    # Local webhook stub: rejects prompts that contain "blocked-topic", answers
    # "bad-pass" with a pass action that carries an extra field, and passes the rest.
    # Every call is logged so tests can assert the path and headers agentgateway sent.
    cat > webhook.py <<'PY'
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            raw = self.rfile.read(int(self.headers.get("content-length") or 0)).decode()
            with open("/tmp/doc-test-webhook-calls.log", "a") as log:
                log.write(json.dumps({"path": self.path, "headers": {k.lower(): v for k, v in self.headers.items()}}) + "\n")
            if self.path.endswith("/request") and "blocked-topic" in raw:
                action = {"status_code": 451, "body": "Request blocked by content policy.",
                          "reason": "Prompt matched a restricted topic."}
            elif self.path.endswith("/request") and "bad-pass" in raw:
                action = {"reason": "No policy violations found.", "score": 0.1}
            elif self.path.endswith("/request"):
                action = {"reason": "No policy violations found."}
            else:
                action = {}
            payload = json.dumps({"action": action}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
        def log_message(self, *args):
            pass
    HTTPServer(("127.0.0.1", 8000), Handler).serve_forever()
    PY
    WEBHOOK_PID=""
    start_webhook() {
      python3 webhook.py &
      WEBHOOK_PID=$!
      for _ in $(seq 1 20); do curl -s -o /dev/null -m 2 -X POST http://localhost:8000/response -d '{}' && return 0; sleep 1; done
      echo "webhook stub did not start"; return 1
    }
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} ${WEBHOOK_PID:-} 2>/dev/null || true' EXIT
    start_webhook
    : > /tmp/doc-test-webhook-calls.log
    # Derive a runnable copy: local webhook host, mock LLM.
    localize() {
      sed 's#content-safety-webhook.example.com:8000#localhost:8000#g' "$1" > "$1.local"
      to_mock "$1.local" "$2"
      agentgateway -f "$2" --validate-only
    }
    chat() {
      curl -s -m 15 -w '\n%{http_code}' http://localhost:4000/v1/chat/completions -H 'content-type: application/json' "$@"
    }
    {{< /doc-test >}}
