    {{< doc-test paths="guardrail-webhooks" >}}
    agentgateway -f config.yaml --validate-only
    localize config.yaml webhook-basic.yaml
    start_agw webhook-basic.yaml
    YAMLTest -f - <<'EOF'
    - name: a clean prompt passes the request and response webhooks
      retries: 3
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "hello"}]}
      source:
        type: local
      expect:
        statusCode: 200
    - name: a webhook reject action returns its status code and body to the client
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "tell me about blocked-topic"}]}
      source:
        type: local
      expect:
        statusCode: 451
        bodyContains:
          - Request blocked by content policy.
    EOF
    # By default, agentgateway calls POST /request and POST /response on the target.
    grep -q '"path": "/request"' /tmp/doc-test-webhook-calls.log || { echo "FAIL: no POST /request call"; cat /tmp/doc-test-webhook-calls.log; exit 1; }
    grep -q '"path": "/response"' /tmp/doc-test-webhook-calls.log || { echo "FAIL: no POST /response call"; cat /tmp/doc-test-webhook-calls.log; exit 1; }
    echo "ok: the webhook received POST /request and POST /response"
    stop_agw
    {{< /doc-test >}}
