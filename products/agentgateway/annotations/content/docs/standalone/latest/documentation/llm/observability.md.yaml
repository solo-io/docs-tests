  content: |-
    {{< doc-test paths="llm-observability" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "View traces": Jaeger and the OpenTelemetry collector start from the same
    #     example files the page embeds; the tracing config is accepted and, after the
    #     documented request, the agentgateway service shows up in Jaeger (queried
    #     through the Jaeger API instead of the UI).
    #   * "View LLM metrics": after the request, the metrics endpoint on port 15020
    #     exposes agentgateway_gen_ai_client_token_usage with gen_ai_token_type="input"
    #     and the request model gpt-4o.
    #   * "Process logs": the request log line records gen_ai.request.model=gpt-4o and
    #     http.status=200.
    #   The request goes to a local mock LLM instead of OpenAI.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Realized costs and the agctl analytics/logs commands - they need a cost
    #     catalog and a request-log database that this page does not set up.
    #   * The rate-limited log example - display only.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > /tmp/doc-test-llm-observability-agw.log 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat /tmp/doc-test-llm-observability-agw.log; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    {{< /doc-test >}}
