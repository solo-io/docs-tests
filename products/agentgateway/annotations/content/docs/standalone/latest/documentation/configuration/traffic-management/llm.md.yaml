  content: |-
    {{< doc-test paths="llm-policies" >}}
    # A model that sets params.model, served from the local mock LLM.
    cat <<'EOF' > config-resolve.yaml
    llm:
      models:
      - name: "*"
        provider: openAI
        params:
          model: gpt-4o-mini
          apiKey: "$OPENAI_API_KEY"
    EOF
    to_mock config-resolve.yaml config-resolve-mock.yaml
    agentgateway -f config-resolve-mock.yaml --validate-only
    start_agw config-resolve-mock.yaml
    YAMLTest -f - <<'EOF'
    - name: a request without model fails with 400 missing_model despite params.model
      retries: 3
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"messages": [{"role": "user", "content": "hello"}]}
      source:
        type: local
      expect:
        statusCode: 400
        bodyContains:
          - missing_model
    - name: the same request with a model succeeds
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "hello"}]}
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    stop_agw
    {{< /doc-test >}}
