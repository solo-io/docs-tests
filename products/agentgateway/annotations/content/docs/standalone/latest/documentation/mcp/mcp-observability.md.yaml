    {{< doc-test paths="mcp-observability" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "View traces" steps 1-3: the Jaeger and collector stack from the published
    #     mcp-telemetry example starts, and agentgateway runs with the documented tracing
    #     config and the `everything` MCP server.
    #   * Steps 4-5, through the MCP API and the Jaeger API rather than the UIs: an `echo`
    #     tool call produces a trace with a `call_tool` operation in Jaeger.
    #   * "View MCP metrics": `mcp_requests_total` on http://localhost:15020/metrics has a
    #     series for the tool call with the documented labels (`server`, `method`,
    #     `resource`, `resource_type`).
    #   * "View logs": the stdout log line for the tool call has `mcp.method.name=tools/call`,
    #     `mcp.target=everything`, and `gen_ai.tool.name=echo`.
    #   * The first access log policy example: only `tools/call` requests are logged, and
    #     the entry carries the added `tool_args` and `tool_result` fields. The second
    #     example (`mcp.toolsList`) is accepted by agentgateway.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The agentgateway and Jaeger UIs - UI-only; the test uses the same MCP endpoint
    #     the playground uses and the Jaeger query API.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
