    preview: '# yaml-language-server: $schema=https://agentgateway.dev/schema/config'
  content: |2-
       {{< doc-test paths="jaeger-standalone" >}}
       # Step 2's tracing settings, on a gateway with one route so there is traffic to trace.
       # The backend is a test-only echo server on port 8080.
       cat > doc-test-echo.py <<'PY'
       from http.server import BaseHTTPRequestHandler, HTTPServer
       class H(BaseHTTPRequestHandler):
           def do_GET(self):
               body = b"ok"
               self.send_response(200)
               self.send_header("content-length", str(len(body)))
               self.end_headers()
               self.wfile.write(body)
           def log_message(self, *a):
               pass
       HTTPServer(("127.0.0.1", 8080), H).serve_forever()
       PY
       python3 doc-test-echo.py > /tmp/doc-test-jaeger-echo.log 2>&1 &
       ECHO_PID=$!
       cat > config.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       frontendPolicies:
         tracing:
           host: localhost:4317
           randomSampling: true
       gateways:
         default:
           port: 3000
       routes:
       - backends:
         - host: localhost:8080
       EOF
       agentgateway -f config.yaml --validate-only
       agentgateway -f config.yaml > "$AGW_LOG" 2>&1 &
       AGW_PID=$!
       for _ in $(seq 1 30); do
         curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && break
         sleep 1
       done
       # Step 3 checks the Jaeger UI by eye. Query the API that the UI reads instead, and keep
       # sending requests until an agentgateway service has reported a trace for them.
       svc=""
       for _ in $(seq 1 30); do
         curl -s -o /dev/null -m 5 http://localhost:3000/jaeger-check || true
         svc=$(curl -s -m 5 http://localhost:16686/api/services | jq -r '.data[]? | select(startswith("agentgateway"))' | head -n 1 || true)
         if [ -n "$svc" ] && curl -s -m 5 "http://localhost:16686/api/traces?service=${svc}&limit=50" | grep -q '/jaeger-check'; then
           break
         fi
         svc=""
         sleep 2
       done
       [ -n "$svc" ] || { echo "FAIL: Jaeger has no agentgateway trace for /jaeger-check"; curl -s http://localhost:16686/api/services; tail -20 "$AGW_LOG"; exit 1; }
       echo "ok: Jaeger received a trace for /jaeger-check from service $svc"
       kill "${AGW_PID:-}" ${ECHO_PID:-} 2>/dev/null || true
       wait "${AGW_PID:-}" 2>/dev/null || true
       AGW_PID=""
       ECHO_PID=""
       {{< /doc-test >}}
