       {{< doc-test paths="jaeger-standalone" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Binary and Docker" step 1: the documented `docker run` starts Jaeger, and its
       #     query API answers on localhost:16686.
       #   * Step 2 (Config file): with the documented `frontendPolicies.tracing` settings,
       #     agentgateway exports request spans to Jaeger on localhost:4317.
       #   * Step 3: the Jaeger query API (what the Jaeger UI reads) lists an agentgateway
       #     service with a trace for the test request.
       #   * Step 4: `docker rm -f jaeger` cleanup.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The UI tab - browser-only steps.
       #   * The Helm installation - needs a cluster; this is a standalone test.
       #   * The Docker Compose example - it runs the agentgateway container image instead
       #     of the binary under test, with a config that the page does not give in full.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       AGW_PID=""
       ECHO_PID=""
       AGW_LOG=/tmp/doc-test-jaeger-agw.log
       trap 'kill ${AGW_PID:-} ${ECHO_PID:-} 2>/dev/null || true; docker rm -f jaeger >/dev/null 2>&1 || true' EXIT
       for _ in $(seq 1 60); do
         curl -sf -o /dev/null -m 3 http://localhost:16686/api/services && break
         sleep 2
       done
       curl -sf -o /dev/null -m 3 http://localhost:16686/api/services \
         || { echo "FAIL: the Jaeger query API did not answer on localhost:16686"; docker logs jaeger 2>&1 | tail -20; exit 1; }
       {{< /doc-test >}}
