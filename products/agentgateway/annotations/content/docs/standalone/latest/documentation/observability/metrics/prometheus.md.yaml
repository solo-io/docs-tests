    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Binary and Docker" steps 1-2: the documented prometheus.yml and docker run start
    #     Prometheus, which scrapes agentgateway's metrics endpoint on port 15020.
    #   * Step 4, through the Prometheus HTTP API rather than the UI: the
    #     `agentgateway_requests_total` query returns series after traffic.
    #   * Step 5: `docker rm -f prometheus` cleanup.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The "Kubernetes (Helm)" tab, relabeling, and native histograms - they need a
    #     cluster with the Prometheus Operator; this is a standalone test.
    #   * The Docker Compose example - an alternative to the steps that are tested.
    #   * `host.docker.internal` on Linux: Docker Desktop defines it, but Docker Engine on
    #     Linux does not unless the container is started with
    #     `--add-host=host.docker.internal:host-gateway`. On Linux, the test re-creates the
    #     container with that flag so that the scrape can reach the host. The page's
    #     docker run command does not include it.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
