  content: |2-
       {{< doc-test paths="prometheus-standalone" >}}
       # On Linux, host.docker.internal only resolves with an explicit host-gateway mapping.
       if [ "$(uname -s)" = "Linux" ]; then
         docker rm -f prometheus >/dev/null 2>&1 || true
         docker run -d --name prometheus \
           --add-host=host.docker.internal:host-gateway \
           -p 9090:9090 \
           -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml \
           prom/prometheus:latest
       fi
       # Test-only backend: echo each request as JSON (method, path, headers). Repeated
       # headers are kept as lists so the test can see exactly what agentgateway forwarded.
       cat > doc-test-echo.py <<'PY'
       import json, sys
       from http.server import BaseHTTPRequestHandler, HTTPServer
       class H(BaseHTTPRequestHandler):
           def _reply(self):
               headers = {}
               for k in self.headers.keys():
                   headers[k.lower()] = self.headers.get_all(k)
               status = 404 if self.path.startswith("/missing") else 200
               body = json.dumps({"method": self.command, "path": self.path, "headers": headers}).encode()
               self.send_response(status)
               self.send_header("content-type", "application/json")
               self.send_header("content-length", str(len(body)))
               self.end_headers()
               self.wfile.write(body)
           do_GET = do_POST = do_PUT = do_DELETE = _reply
           def log_message(self, *a):
               pass
       HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
       PY
       start_echo() {
         python3 doc-test-echo.py "$1" > "/tmp/doc-test-echo-$1.log" 2>&1 &
         ECHO_PIDS="${ECHO_PIDS:-} $!"
         for _ in $(seq 1 20); do curl -sf -o /dev/null "http://localhost:$1/" && return 0; sleep 0.5; done
         echo "echo backend on port $1 did not start"; return 1
       }

       # Run agentgateway in the background. Never call start_gateway inside $( ): the PID
       # would be set in a subshell and the gateway would never be stopped.
       start_gateway() {
         agentgateway -f "$1" > "/tmp/doc-test-agw-$(basename "$1").log" 2>&1 &
         AGW_PID=$!
       }
       stop_gateway() {
         [ -n "${AGW_PID:-}" ] || return 0
         kill "$AGW_PID" 2>/dev/null || true
         wait "$AGW_PID" 2>/dev/null || true
         AGW_PID=""
       }
       # wait_http URL [TRIES]: wait until URL answers with any HTTP status.
       wait_http() {
         for _ in $(seq 1 "${2:-30}"); do
           code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 "$1" 2>/dev/null || true)
           [ -n "$code" ] && [ "$code" != "000" ] && return 0
           sleep 1
         done
         echo "$1 did not answer"; return 1
       }
       trap 'stop_gateway; kill ${ECHO_PIDS:-} 2>/dev/null || true; docker rm -f prometheus >/dev/null 2>&1 || true' EXIT
       start_echo 8080
       cat > config.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       gateways:
         default:
           port: 3000
       routes:
       - backends:
         - host: localhost:8080
       EOF
       start_gateway config.yaml
       wait_http http://localhost:3000/ 30
       wait_http http://localhost:9090/-/ready 60

       # The scrape interval is 15s; keep sending traffic until the query returns series.
       found=""
       for _ in $(seq 1 30); do
         curl -s -o /dev/null http://localhost:3000/prometheus-check || true
         n=$(curl -s 'http://localhost:9090/api/v1/query?query=agentgateway_requests_total' | jq '.data.result | length' 2>/dev/null || echo 0)
         if [ "${n:-0}" -gt 0 ]; then found=yes; break; fi
         sleep 3
       done
       [ -n "$found" ] || {
         echo "Prometheus returned no agentgateway_requests_total series"
         curl -s http://localhost:9090/api/v1/targets | jq '.data.activeTargets[] | {scrapeUrl, health, lastError}' || true
         exit 1
       }
       stop_gateway
       {{< /doc-test >}}
