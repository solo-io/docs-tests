  content: |-
    {{< doc-test paths="llm-configuration-modes" >}}
    cat <<'EOF' > modes-basic.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config

    llm:
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f modes-basic.yaml --validate-only
    to_mock modes-basic.yaml modes-basic-mock.yaml
    start_agw modes-basic-mock.yaml
    YAMLTest -f - <<'EOF'
    - name: with no gateway defined, LLM traffic is served on port 4000
      retries: 3
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "hello"}]}
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.model"
            comparator: equals
            value: gpt-4o-mini
    EOF
    stop_agw
    {{< /doc-test >}}
