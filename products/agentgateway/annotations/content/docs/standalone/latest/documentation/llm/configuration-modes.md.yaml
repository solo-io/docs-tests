  content: |-
    {{< doc-test paths="llm-configuration-modes" >}}
    cat <<'EOF' > modes-tls.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      default:
        port: 8443
        tls:
          cert: /etc/agentgateway/tls/tls.crt
          key: /etc/agentgateway/tls/tls.key
    llm:
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    mcp:
      targets:
      - name: tools
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
    EOF
    # The page's cert paths are under /etc; use a self-signed cert in ./tls instead.
    mkdir -p tls
    openssl req -x509 -newkey rsa:2048 -nodes -keyout tls/tls.key -out tls/tls.crt -days 1 \
      -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" 2>/dev/null
    sed 's#/etc/agentgateway/tls/#./tls/#' modes-tls.yaml > modes-tls-local.yaml
    agentgateway -f modes-tls-local.yaml --validate-only
    to_mock modes-tls-local.yaml modes-tls-mock.yaml
    start_agw modes-tls-mock.yaml
    YAMLTest -f - <<'EOF'
    - name: the llm section attaches to the default gateway and is served over TLS on 8443
      retries: 3
      http:
        url: "https://localhost:8443"
        path: /v1/chat/completions
        method: POST
        skipSslVerification: true
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "hello"}]}
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    stop_agw
    {{< /doc-test >}}
