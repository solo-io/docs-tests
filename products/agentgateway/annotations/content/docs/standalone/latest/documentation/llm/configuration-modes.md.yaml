  content: |-
    {{< doc-test paths="llm-configuration-modes" >}}
    cat <<'EOF' > modes-advanced.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config

    llm:
      policies:
        jwtAuth:
          issuer: agentgateway.dev
          audiences: [api.example.com]
          jwks:
            file: ./public-key.json
        authorization:
          rules:
          - 'jwt.email.endsWith("@example.com")'
      models:
      - name: claude-haiku
        provider: anthropic
        params:
          model: claude-3-5-haiku-20241022
          apiKey: "$ANTHROPIC_API_KEY"
        matches:
        - headers:
          - name: x-org
            value:
              exact: engineering
      - name: gpt-4
        provider: openAI
        params:
          model: gpt-4o
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f modes-advanced.yaml --validate-only
    {{< /doc-test >}}
