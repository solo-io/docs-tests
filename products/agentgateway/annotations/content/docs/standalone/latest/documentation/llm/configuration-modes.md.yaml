  content: |-
    {{< doc-test paths="llm-configuration-modes" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # The page shows its configs without heredocs, so each one is restated in a
    # hidden block below and kept byte-for-byte equal to the page.
    # WHAT THIS TEST VALIDATES:
    #   * All five example configs are accepted by agentgateway (--validate-only).
    #   * "LLM listener ports and TLS": with no gateway defined, the implied default
    #     gateway serves LLM traffic on port 4000 at /v1/chat/completions (basic example,
    #     run against a local mock LLM).
    #   * The TLS example: the llm section attaches to the gateway named `default`, so
    #     LLM traffic is served over TLS on port 8443 (run against the mock LLM, with a
    #     self-signed cert substituted for the /etc/agentgateway/tls paths).
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The JWT, authorization, and header-matching behavior of the advanced LLM
    #     example - the page shows no request for it; only the config is validated.
    #   * Path-based routing in the routing-based examples - they target live OpenAI and
    #     Anthropic and api.example.com; the configs are validated only.
    #   * The MCP stdio target in the TLS example - it needs npx and is not exercised.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > /tmp/doc-test-config-modes-agw.log 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat /tmp/doc-test-config-modes-agw.log; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    export ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-test}"
    # The advanced LLM example reads a JWKS from ./public-key.json; generate one.
    openssl genrsa -out jwt-key.pem 2048 2>/dev/null
    python3 - <<'PY'
    import base64, json, subprocess
    mod = subprocess.check_output(["openssl", "rsa", "-in", "jwt-key.pem", "-noout", "-modulus"]).decode().strip().split("=", 1)[1]
    n = base64.urlsafe_b64encode(bytes.fromhex(mod)).rstrip(b"=").decode()
    json.dump({"keys": [{"kty": "RSA", "kid": "doc-test", "use": "sig", "alg": "RS256", "n": n, "e": "AQAB"}]}, open("public-key.json", "w"))
    PY
    {{< /doc-test >}}
