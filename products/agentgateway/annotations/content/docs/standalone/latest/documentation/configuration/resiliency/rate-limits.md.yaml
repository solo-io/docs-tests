  content: |-
    {{< doc-test paths="rate-limits" >}}
    # WHAT THIS TEST VALIDATES:
    #   * The request-based localRateLimit policy is accepted by agentgateway in the
    #     routing-based (gateways), simplified LLM (llm.policies), and simplified MCP
    #     (mcp.policies) forms.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * That requests are actually limited at runtime — requires driving traffic
    #     past the configured bucket, which the page does not exercise.
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      default:
        port: 3000
    routes:
    - policies:
        localRateLimit:
        - maxTokens: 10
          tokensPerFill: 1
          fillInterval: 60s
          type: requests
      backends:
      - host: localhost:8080
    EOF
    agentgateway -f config.yaml --validate-only

    cat <<'EOF' > config-llm.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      policies:
        localRateLimit:
        - maxTokens: 10
          tokensPerFill: 1
          fillInterval: 60s
          type: requests
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f config-llm.yaml --validate-only

    cat <<'EOF' > config-mcp.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    mcp:
      port: 3000
      policies:
        localRateLimit:
        - maxTokens: 10
          tokensPerFill: 1
          fillInterval: 60s
          type: requests
      targets:
      - name: everything
        stdio:
          cmd: npx
          args: ["@modelcontextprotocol/server-everything"]
    EOF
    agentgateway -f config-mcp.yaml --validate-only
    {{< /doc-test >}}
