       {{< doc-test paths="otlp-log-export" >}}
       # Run agentgateway in the background. Never call start_gateway inside $( ): the PID
       # would be set in a subshell and the gateway would never be stopped.
       start_gateway() {
         agentgateway -f "$1" > "/tmp/doc-test-agw-$(basename "$1").log" 2>&1 &
         AGW_PID=$!
       }
       stop_gateway() {
         [ -n "${AGW_PID:-}" ] || return 0
         kill "$AGW_PID" 2>/dev/null || true
         wait "$AGW_PID" 2>/dev/null || true
         AGW_PID=""
       }
       # wait_http URL [TRIES]: wait until URL answers with any HTTP status.
       wait_http() {
         for _ in $(seq 1 "${2:-30}"); do
           code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 "$1" 2>/dev/null || true)
           [ -n "$code" ] && [ "$code" != "000" ] && return 0
           sleep 1
         done
         echo "$1 did not answer"; return 1
       }
       # "Filter logs before export": only error responses go to the collector.
       cat > config-filter.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       frontendPolicies:
         accessLog:
           otlp:
             host: localhost:4317
             filter: 'response.code >= 400'
       gateways:
         default:
           port: 3000
       routes:
       - backends:
         - host: localhost:8080
       EOF
       start_gateway config-filter.yaml
       wait_http http://localhost:3000/ 30
       sleep 3
       T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)
       curl -s -o /dev/null http://localhost:3000/filter-ok
       curl -s -o /dev/null http://localhost:3000/missing-filter
       wait_for_record "$T1" '/missing-filter'
       sleep 3
       collector_since "$T1"
       if grep -q -- '/filter-ok' /tmp/doc-test-otel-logs.log; then
         echo "a 200 response was exported despite otlp.filter"; exit 1
       fi
       stop_gateway

       # The two top-level `filter` examples.
       cat > config-filter-top.yaml <<'EOF'
       frontendPolicies:
         accessLog:
           filter: 'response.code >= 400'
           otlp:
             host: localhost:4317
       EOF
       agentgateway -f config-filter-top.yaml --validate-only
       cat > config-filter-override.yaml <<'EOF'
       frontendPolicies:
         accessLog:
           filter: 'response.code >= 400'
           otlp:
             host: localhost:4317
             filter: 'true'
       EOF
       agentgateway -f config-filter-override.yaml --validate-only

       # "Customize exported fields": add trace_id from a header, remove server.address.
       cat > config-fields.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       frontendPolicies:
         accessLog:
           otlp:
             host: localhost:4317
             fields:
               add:
                 trace_id: 'request.headers["x-trace-id"]'
               remove:
                 - server.address
       gateways:
         default:
           port: 3000
       routes:
       - backends:
         - host: localhost:8080
       EOF
       start_gateway config-fields.yaml
       wait_http http://localhost:3000/ 30
       sleep 3
       T2=$(date -u +%Y-%m-%dT%H:%M:%SZ)
       curl -s -o /dev/null -H 'x-trace-id: doc-test-trace-123' http://localhost:3000/fields-check
       wait_for_record "$T2" '/fields-check'
       grep -q 'trace_id' /tmp/doc-test-otel-logs.log
       grep -q 'doc-test-trace-123' /tmp/doc-test-otel-logs.log
       if grep -q 'server.address' /tmp/doc-test-otel-logs.log; then
         echo "server.address was not removed from the exported record"; exit 1
       fi
       stop_gateway
       {{< /doc-test >}}
