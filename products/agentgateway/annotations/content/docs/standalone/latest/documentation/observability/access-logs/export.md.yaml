    {{< doc-test paths="otlp-log-export" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Binary and Docker installations" steps 1-2: the documented collector config
    #     and docker run start an OTel Collector with a logs pipeline.
    #   * Step 3 (Config file tab) and step 4: with `frontendPolicies.accessLog.otlp`,
    #     each proxied request reaches the collector as a `LogRecord` in the
    #     `agentgateway.access` scope, with `gateway`, `http.request.method`, `url.path`,
    #     and `http.response.status_code` attributes.
    #   * "Filter logs before export": `otlp.filter: 'response.code >= 400'` exports the
    #     404 request and not the 200 request.
    #   * "Customize exported fields": the `trace_id` field from `x-trace-id` is added and
    #     `server.address` is removed from the exported record.
    #   * The two top-level `filter` examples are accepted by agentgateway.
    #   * Step 5: `docker rm -f otel-collector` cleanup.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI tabs - UI-only.
    #   * The "Helm installations" section - needs a cluster; this is a standalone test.
    #   * That the top-level filter also limits stdout and the database - not asserted.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
