  content: |2-
       {{< doc-test paths="llm-audio" >}}
       grep -q '/audio/transcriptions$' /tmp/doc-test-audio-last.path \
         || { echo "FAIL: upstream path was $(cat /tmp/doc-test-audio-last.path)"; exit 1; }
       python3 - <<'PY'
       body = open("/tmp/doc-test-audio-last.body", "rb").read()
       audio = open("audio.mp3", "rb").read()
       assert b'name="model"\r\n\r\nwhisper-1\r\n' in body, "model form field not forwarded as whisper-1"
       assert audio in body, "uploaded file was not forwarded unchanged"
       print("multipart model field and file forwarded unchanged")
       PY
       LINE=$(log_line /v1/audio/transcriptions)
       echo "$LINE"
       for want in 'gen_ai.operation.name=transcription' 'gen_ai.request.model=whisper-1' \
                'gen_ai.usage.audio_seconds=90' 'audio_rate=0.005' 'audio_cost=0.0075' 'agw.ai.usage.cost.total=0.00750*'; do
         echo "$LINE" | grep -Eq "(^|[[:space:]])${want}([[:space:]]|$)" || { echo "FAIL: transcription log entry lacks $want"; exit 1; }
       done
       echo "transcription recorded with 90 s at the overlay rate: cost 0.0075"

       # The About table: translations are recorded the same way.
       CODE=$(curl -s -o audio-translation.json -w '%{http_code}' http://localhost:4000/v1/audio/translations \
         -F model=whisper-1 -F file=@audio.mp3)
       [ "$CODE" = "200" ] || { echo "FAIL: translation returned $CODE"; cat audio-translation.json; exit 1; }
       grep -q '/audio/translations$' /tmp/doc-test-audio-last.path || { echo "FAIL: translation path"; exit 1; }
       log_line /v1/audio/translations | grep -q 'gen_ai.operation.name=transcription' \
         || { echo "FAIL: translation not recorded as transcription"; exit 1; }
       echo "translation recorded as transcription"
       {{< /doc-test >}}
