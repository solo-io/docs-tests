  content: |2-
       {{< doc-test paths="llm-audio" >}}
       export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
       AGW_PID=""
       stop_agw() {
         [ -n "${AGW_PID:-}" ] || return 0
         kill "$AGW_PID" 2>/dev/null || true
         wait "$AGW_PID" 2>/dev/null || true
         AGW_PID=""
       }
       cleanup() {
         stop_agw
         [ -n "${MOCK_PID:-}" ] && { kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true; }
         return 0
       }
       trap cleanup EXIT
       # start_agw CONFIG LOGNAME URL: start agentgateway and wait until URL answers at all.
       start_agw() {
         agentgateway -f "$1" > "/tmp/doc-test-agw-$2.log" 2>&1 &
         AGW_PID=$!
         for _ in $(seq 1 30); do
           curl -s -o /dev/null -m 2 "$3" && return 0
           kill -0 "$AGW_PID" 2>/dev/null || break
           sleep 1
         done
         echo "FAIL: agentgateway did not start with $1"; cat "/tmp/doc-test-agw-$2.log"; exit 1
       }
       # expect_invalid FILE CLAIM: the page says FILE's config is invalid.
       expect_invalid() {
         if agentgateway -f "$1" --validate-only > "$1.log" 2>&1; then
           echo "FAIL: $1 was accepted, but the page says: $2"; exit 1
         fi
         echo "rejected as documented: $2"
       }
       to_mock() {
         python3 - "$1" "$2" "$3" <<'PY'
       import pathlib, re, sys
       src = pathlib.Path(sys.argv[1]).read_text()
       out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: " + sys.argv[3], src, flags=re.M)
       if not n:
           sys.exit("no apiKey line in " + sys.argv[1])
       pathlib.Path(sys.argv[2]).write_text(out)
       PY
       }
       # A local mock of the OpenAI audio APIs on port 3094. It writes the last request's path and raw
       # body to /tmp/doc-test-audio-last.*.
       cat > audio-mock.py <<'PY'
       import json
       from http.server import BaseHTTPRequestHandler, HTTPServer
       class H(BaseHTTPRequestHandler):
           def do_POST(self):
               n = int(self.headers.get("content-length") or 0)
               raw = self.rfile.read(n) if n else b""
               open("/tmp/doc-test-audio-last.path", "w").write(self.path)
               open("/tmp/doc-test-audio-last.body", "wb").write(raw)
               if self.path.endswith("/audio/speech"):
                   payload, ctype = b"ID3-doc-test-speech-bytes", "audio/mpeg"
               else:
                   payload = json.dumps({"text": "Hello from agentgateway.",
                                         "usage": {"type": "duration", "seconds": 90}}).encode()
                   ctype = "application/json"
               self.send_response(200)
               self.send_header("content-type", ctype)
               self.send_header("content-length", str(len(payload)))
               self.end_headers()
               self.wfile.write(payload)
           def log_message(self, *a):
               pass
       HTTPServer(("127.0.0.1", 3094), H).serve_forever()
       PY
       python3 audio-mock.py > /tmp/doc-test-audio-mock.out 2>&1 &
       MOCK_PID=$!
       for _ in $(seq 1 20); do curl -sf -o /dev/null -m 2 -X POST http://127.0.0.1:3094/probe && break; sleep 1; done
       curl -sf -o /dev/null -m 2 -X POST http://127.0.0.1:3094/probe || { echo "FAIL: audio mock did not start"; exit 1; }
       agentgateway -f config.yaml --validate-only
       to_mock config.yaml config-mock.yaml http://127.0.0.1:3094
       agentgateway -f config-mock.yaml --validate-only
       # A small stand-in audio file; the mock does not decode it.
       printf 'ID3-doc-test-audio-%s' "$(date +%s)" > audio.mp3
       {{< /doc-test >}}
