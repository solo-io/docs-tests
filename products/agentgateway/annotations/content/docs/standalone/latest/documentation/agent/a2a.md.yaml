  content: |2-
       {{< doc-test paths="a2a" >}}
       # Step 2 of "Set up an ADK agent" runs in the foreground; run it in the background.
       rm -f /tmp/doc-test-a2a-agent.log
       uv run --directory a2a-samples/samples/python/agents/helloworld --with-requirements requirements.txt . > /tmp/doc-test-a2a-agent.log 2>&1 &
       A2A_AGENT_PID=$!
       up=""
       for _ in $(seq 1 90); do
         code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://localhost:9999/.well-known/agent.json || true)
         code2=$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://localhost:9999/.well-known/agent-card.json || true)
         if [ "$code" = "200" ] || [ "$code2" = "200" ]; then up=yes; break; fi
         sleep 2
       done
       [ -n "$up" ] || { echo "Hello World agent did not start"; tail -40 /tmp/doc-test-a2a-agent.log; exit 1; }
       {{< /doc-test >}}
