  content: |2-
       {{< doc-test paths="a2a" >}}
       # Step 1: the agent card through agentgateway, with the interface URL rewritten
       # to point to agentgateway.
       curl -s localhost:3000/.well-known/agent-card.json > /tmp/doc-test-agent-card.json
       jq -e '.name == "Hello World Agent"
              and any(.supportedInterfaces[]; .url == "http://localhost:3000/")' /tmp/doc-test-agent-card.json >/dev/null \
         || { echo "unexpected agent card through agentgateway"; cat /tmp/doc-test-agent-card.json; exit 1; }

       # Step 2: the same SendMessage request; the agent completes the task and replies.
       curl -s -X POST http://localhost:3000/ -H 'content-type: application/json' -H 'A2A-Version: 1.0' -d '{
         "jsonrpc": "2.0", "id": "1", "method": "SendMessage",
         "params": {"message": {"role": "ROLE_USER", "messageId": "doc-test-1", "parts": [{"text": "hi"}]}}
       }' > /tmp/doc-test-a2a-reply.json
       jq -e '.result.task.status.state == "TASK_STATE_COMPLETED"
              and any(.result.task.artifacts[].parts[]; .text | startswith("Hello, World!"))' /tmp/doc-test-a2a-reply.json >/dev/null \
         || { echo "agent did not complete the task with Hello, World!"; cat /tmp/doc-test-a2a-reply.json; exit 1; }

       # Step 3: the request log records the SendMessage method and the task state.
       sleep 1
       grep '"a2a.method":"SendMessage"' "$AGW_LOG" | grep -q '"a2a.task.state":"TASK_STATE_COMPLETED"' \
         || { echo "no SendMessage request log line with a completed task"; tail -20 "$AGW_LOG"; exit 1; }
       kill "$A2A_AGENT_PID" 2>/dev/null || true
       stop_gateway
       {{< /doc-test >}}
