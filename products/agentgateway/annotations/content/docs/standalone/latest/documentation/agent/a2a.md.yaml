  content: |2-
       {{< doc-test paths="a2a" >}}
       curl -s localhost:3000/.well-known/agent.json > /tmp/doc-test-agent-card.json
       jq -e '.name == "Hello World Agent"
              and .url == "http://localhost:3000"
              and any(.skills[]; .id == "hello_world")' /tmp/doc-test-agent-card.json >/dev/null \
         || { echo "unexpected agent card through agentgateway"; cat /tmp/doc-test-agent-card.json; exit 1; }

       # Step 1 without the interactive client: send "hi" as an A2A message through the gateway.
       curl -s -X POST http://localhost:3000/ -H 'content-type: application/json' -d '{
         "jsonrpc": "2.0", "id": "1", "method": "message/send",
         "params": {"message": {"role": "user", "messageId": "doc-test-1",
                                "parts": [{"kind": "text", "text": "hi"}]}}
       }' > /tmp/doc-test-a2a-reply.json
       grep -q 'Hello World' /tmp/doc-test-a2a-reply.json \
         || { echo "agent did not answer Hello World"; cat /tmp/doc-test-a2a-reply.json; exit 1; }

       # Step 3: the request log records the A2A method for the call.
       sleep 1
       grep -q 'message/send' "$AGW_LOG" && grep 'message/send' "$AGW_LOG" | grep -q 'a2a' \
         || { echo "no A2A request log line"; tail -20 "$AGW_LOG"; exit 1; }
       kill "$A2A_AGENT_PID" 2>/dev/null || true
       stop_gateway
       {{< /doc-test >}}
- after:
