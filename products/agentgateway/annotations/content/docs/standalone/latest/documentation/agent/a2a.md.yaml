    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The interactive CLI client (`uv run ... hosts/cli`) - it prompts for input; the
    #     test sends the same A2A request with curl.
    #   * The UI steps - UI-only.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
