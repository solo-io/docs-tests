    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Set up the agentgateway": the published traffic-a2a example config (which the
    #     page embeds) runs, proxying port 3000 to localhost:9999 with the `a2a` policy.
    #   * "Set up an ADK agent": the A2A samples clone and the Hello World agent runs
    #     with the A2A SDK version that its requirements.txt file pins.
    #   * "Verify the A2A connection" step 1: the agent card through agentgateway names
    #     the Hello World agent, and its supportedInterfaces URL is rewritten to
    #     http://localhost:3000/.
    #   * Step 2: a SendMessage request of "hi" through agentgateway completes the task
    #     with a "Hello, World!" reply.
    #   * Step 3: the agentgateway request log records SendMessage with a completed task.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI steps - UI-only.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
- after:
    block: 0
    fingerprint: 8d0170ba41c8e208
