  content: |-
    {{< doc-test paths="api-types-decisions-run" >}}
    cat <<'EOF' > config-custom.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      models:
      - name: decisions-model
        provider:
          custom:
            formats:
            - type: decisions
        params:
          apiKey: "$CUSTOM_PROVIDER_API_KEY"
          baseUrl: "https://api.example.com/v1"
    EOF
    agentgateway -f config-custom.yaml --validate-only
    sed 's#https://api.example.com/v1#http://localhost:3091/v1#' config-custom.yaml > config-custom-mock.yaml
    run_agw config-custom-mock.yaml
    STATUS=$(post /v1/decisions "${DECISIONS_BODY/<decisions-model>/decisions-model}")
    [ "$STATUS" = "200" ] || { echo "FAIL: custom decisions provider returned $STATUS"; cat /tmp/decisions-resp.json; exit 1; }
    check 'up["path"] == "/v1/decisions"'
    stop_agw

    # Without `formats`, the custom provider rejects Decisions requests with a 400
    # that names the request format and the provider.
    grep -v -e '^        formats:$' -e '^        - type: decisions$' config-custom-mock.yaml \
      | sed 's/^      custom:$/      custom: {}/' > config-custom-noformats.yaml
    run_agw config-custom-noformats.yaml
    STATUS=$(post /v1/decisions "${DECISIONS_BODY/<decisions-model>/decisions-model}")
    [ "$STATUS" = "400" ] || { echo "FAIL: expected 400 without formats, got $STATUS"; cat /tmp/decisions-resp.json; exit 1; }
    grep -q 'unsupported conversion: from Decisions to provider custom' /tmp/decisions-resp.json \
      || { echo "FAIL: the 400 does not carry the documented error"; cat /tmp/decisions-resp.json; exit 1; }
    stop_agw
    {{< /doc-test >}}
