    {{< doc-test paths="api-types-decisions-run" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Map the Decisions route type": all three configs pass --validate-only.
    #   * The `llm` config maps /v1/decisions and /v1/systemone with no route setup:
    #     the documented Decisions request returns the provider's answers, and the
    #     documented SystemOne request reaches the OpenAI provider translated to the
    #     Decisions format (a list of `predicate` questions) and comes back in the
    #     SystemOne format (`answers.visible_damage.noul`).
    #   * The `custom` provider with `formats: [decisions]` sends Decisions requests
    #     to `baseUrl` + `/decisions`, and a custom provider without `formats`
    #     rejects them with a 400 that names the conversion, as the page states.
    #   * The `routes` config maps both paths through `policies.ai.routes`.
    #   * "Verify token tracking": the metrics endpoint reports token usage with
    #     gen_ai_operation_name="decisions".
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Real answers from OpenAI: every config runs against a local mock provider
    #     that answers each question with probability 0.64, so no API key is needed.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    export OPENAI_API_KEY="${OPENAI_API_KEY:-sk-mock}"
    export CUSTOM_PROVIDER_API_KEY="${CUSTOM_PROVIDER_API_KEY:-sk-mock-custom}"

    # A mock provider on port 3091 (where the point-config-at-mock-llm helper points
    # the OpenAI provider) that speaks the Decisions API and records every request.
    cat > /tmp/decisions-mock.py <<'PY'
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("content-length") or 0)
            request = json.loads(self.rfile.read(length) or b"{}")
            with open("/tmp/decisions-mock.jsonl", "a") as log:
                log.write(json.dumps(dict(path=self.path, body=request)) + "\n")
            questions = request.get("questions")
            if isinstance(questions, dict):  # SystemOne
                answers = {k: {"type": q["type"], q["type"]: 0.64} for k, q in questions.items()}
                usage = dict(input_tokens=156, output_tokens=0)
            else:  # Decisions
                answers = [dict(type=q["type"], name=q.get("name"), probability=0.64) for q in questions or []]
                usage = dict(input_tokens=156, output_tokens=0, total_tokens=156)
            payload = json.dumps(dict(model=request.get("model", "mock"), answers=answers, usage=usage)).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
        def log_message(self, *args):
            pass
    HTTPServer(("127.0.0.1", 3091), Handler).serve_forever()
    PY
    : > /tmp/decisions-mock.jsonl
    python3 /tmp/decisions-mock.py > /tmp/decisions-mock.log 2>&1 &
    DECISIONS_MOCK_PID=$!
    AGW_PID=""
    trap 'kill $AGW_PID $DECISIONS_MOCK_PID 2>/dev/null || true' EXIT
    for _ in $(seq 1 20); do curl -s -o /dev/null -m 2 -X POST http://localhost:3091 -d '{"questions": []}' && break; sleep 1; done

    run_agw() {
      agentgateway -f "$1" > /tmp/agw-decisions.log 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do curl -s -o /dev/null -m 2 http://localhost:4000/ && return 0; sleep 1; done
      echo "FAIL: agentgateway did not start with $1"; cat /tmp/agw-decisions.log; exit 1
    }
    stop_agw() {
      kill $AGW_PID 2>/dev/null || true
      wait $AGW_PID 2>/dev/null || true
      AGW_PID=""
    }
    # POST a JSON body to a gateway path; the response goes to /tmp/decisions-resp.json
    # and the status code to stdout.
    post() {
      curl -s -m 10 -o /tmp/decisions-resp.json -w '%{http_code}' "http://localhost:4000$1" \
        -H 'Content-Type: application/json' -d "$2"
    }
    # Run a Python assertion against the last request the mock received (`up`) and
    # the last gateway response (`resp`).
    check() {
      python3 - "$1" <<'PY'
    import json, sys
    up = json.loads(open("/tmp/decisions-mock.jsonl").read().strip().splitlines()[-1])
    try:
        resp = json.load(open("/tmp/decisions-resp.json"))
    except Exception:
        resp = None
    if not eval(sys.argv[1]):
        sys.exit(f"FAIL: {sys.argv[1]}\nupstream: {up}\nresponse: {resp}")
    PY
    }
    DECISIONS_BODY='{"model": "<decisions-model>", "input": [{"role": "user", "content": [{"type": "input_text", "text": "The package was left in the rain and the box is soaked through."}]}], "questions": [{"type": "predicate", "name": "visible_damage", "instructions": "Does the customer report visible damage to the package?"}]}'
    SYSTEMONE_BODY='{"model": "<decisions-model>", "state": [{"role": "user", "content": "The package was left in the rain and the box is soaked through."}], "questions": {"visible_damage": {"type": "noul", "instructions": "Does the customer report visible damage to the package?"}}}'
    {{< /doc-test >}}
