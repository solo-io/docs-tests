  content: |2-
       {{< doc-test paths="mcp-openapi" >}}
       # Run agentgateway in the background. Never call start_gateway inside $( ): the PID
       # would be set in a subshell and the gateway would never be stopped.
       start_gateway() {
         agentgateway -f "$1" > "/tmp/doc-test-agw-$(basename "$1").log" 2>&1 &
         AGW_PID=$!
       }
       stop_gateway() {
         [ -n "${AGW_PID:-}" ] || return 0
         kill "$AGW_PID" 2>/dev/null || true
         wait "$AGW_PID" 2>/dev/null || true
         AGW_PID=""
       }
       # wait_http URL [TRIES]: wait until URL answers with any HTTP status.
       wait_http() {
         for _ in $(seq 1 "${2:-30}"); do
           code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 "$1" 2>/dev/null || true)
           [ -n "$code" ] && [ "$code" != "000" ] && return 0
           sleep 1
         done
         echo "$1 did not answer"; return 1
       }

       # Minimal MCP client over streamable HTTP. Responses can be server-sent events, so
       # `data:` lines are unwrapped before parsing.
       MCP_URL="${MCP_URL:-http://localhost:3000/mcp}"
       mcp_init() {
         MCP_SID=$(curl -sS -D - -o /dev/null --max-time 15 -X POST "$MCP_URL" \
           -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
           -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"doctest","version":"1.0"}},"id":1}' \
           | grep -i '^mcp-session-id:' | tr -d '\r' | awk '{print $2}' || true)
         if [ -n "$MCP_SID" ]; then
           curl -sS --max-time 10 -o /dev/null -X POST "$MCP_URL" \
             -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
             -H "Mcp-Session-Id: $MCP_SID" -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' || true
         fi
       }
       # mcp_call METHOD PARAMS_JSON: print the JSON-RPC response body.
       mcp_call() {
         curl -sS --max-time 30 -X POST "$MCP_URL" \
           -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
           ${MCP_SID:+-H "Mcp-Session-Id: $MCP_SID"} \
           -d "{\"jsonrpc\":\"2.0\",\"method\":\"$1\",\"params\":$2,\"id\":2}" \
           | sed -n 's/^data: //p; /^{/p' | head -1
       }
       # mcp_tools: wait for the MCP targets to come up and print the tool names. It is
       # usually called as $(mcp_tools), a subshell: call mcp_init afterwards to get a
       # session in the calling shell.
       mcp_tools() {
         local names=""
         for _ in $(seq 1 30); do
           mcp_init
           names=$(mcp_call tools/list '{}' 2>/dev/null | jq -r '[.result.tools[].name] | join(" ")' 2>/dev/null || true)
           [ -n "$names" ] && break
           sleep 2
         done
         echo "$names"
       }
       trap 'stop_gateway; docker rm -f swaggerapi-petstore3 >/dev/null 2>&1 || true' EXIT
       jq -e '.paths | length > 0' openapi.json >/dev/null

       # The downloaded example config is accepted as published.
       agentgateway -f config.yaml --validate-only

       # Step 2: update config.yaml to the page's local-file config, then step 3: run it.
       cat > config.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       mcp:
         port: 3000
         policies:
           cors:
             allowOrigins:
               - "*"
             allowHeaders:
               - "*"
         targets:
         - name: openapi
           openapi:
             schema:
               file: openapi.json
             host: localhost:8080
       EOF
       start_gateway config.yaml
       tools=$(mcp_tools)
       mcp_init   # mcp_tools ran in a subshell; open the session in this shell
       for t in getPetById findPetsByStatus addPet getInventory; do
         case " $tools " in *" $t "*) ;; *) echo "tool $t not listed: $tools"; exit 1 ;; esac
       done
       mcp_call tools/call '{"name":"getInventory","arguments":{}}' > /tmp/doc-test-inventory.json
       jq -e '.result.isError == false
              and (.result.structuredContent | type == "object")
              and (.result.content[0].type == "text")
              and ((.result.content[0].text | fromjson) == .result.structuredContent)' /tmp/doc-test-inventory.json >/dev/null \
         || { echo "unexpected getInventory result"; cat /tmp/doc-test-inventory.json; exit 1; }
       stop_gateway

       # "Schema URL"
       cat > config-url.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       mcp:
         port: 3000
         policies:
           cors:
             allowOrigins:
               - "*"
             allowHeaders:
               - "*"
         targets:
         - name: openapi
           openapi:
             schema:
               url: http://localhost:8080/api/v3/openapi.json
             host: localhost:8080
       EOF
       start_gateway config-url.yaml
       tools=$(mcp_tools)
       case " $tools " in *" getPetById "*) ;; *) echo "schema URL config: getPetById not listed: $tools"; exit 1 ;; esac
       stop_gateway

       # "Inline schema": only the one inline operation becomes a tool.
       cat > config-inline.yaml <<'EOF'
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       mcp:
         port: 3000
         policies:
           cors:
             allowOrigins:
               - "*"
             allowHeaders:
               - "*"
         targets:
         - name: openapi
           openapi:
             schema: |
               {
                 "openapi": "3.0.0",
                 "info": { "title": "Petstore", "version": "1.0.0" },
                 "servers": [{ "url": "/" }],
                 "paths": {
                   "/pet/{petId}": {
                     "get": {
                       "operationId": "getPetById",
                       "summary": "Find pet by ID",
                       "parameters": [
                         {
                           "name": "petId",
                           "in": "path",
                           "required": true,
                           "schema": { "type": "integer", "format": "int64" }
                         }
                       ],
                       "responses": { "200": { "description": "successful operation" } }
                     }
                   }
                 }
               }
             host: localhost:8080
       EOF
       start_gateway config-inline.yaml
       tools=$(mcp_tools)
       [ "$tools" = "getPetById" ] || { echo "inline schema: expected only getPetById, got '$tools'"; exit 1; }
       stop_gateway

       # "Stateless sessions"
       cat > config-stateless.yaml <<'EOF'
       mcp:
         port: 3000
         statefulMode: stateless
         targets:
         - name: openapi
           openapi:
             schema:
               url: http://localhost:8080/api/v3/openapi.json
             host: localhost:8080
       EOF
       start_gateway config-stateless.yaml
       tools=$(mcp_tools)
       case " $tools " in *" getInventory "*) ;; *) echo "stateless config: getInventory not listed: $tools"; exit 1 ;; esac
       stop_gateway
       {{< /doc-test >}}
