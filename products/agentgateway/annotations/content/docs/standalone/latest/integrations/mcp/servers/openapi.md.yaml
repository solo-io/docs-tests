    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Sample Petstore server" (AMD64 tab): the image pulls and the server runs on 8080.
    #   * "Configure the agentgateway": the OpenAPI schema downloads; the published
    #     mcp-openapi example config downloads and is accepted; the page's local-file
    #     config (`schema.file: openapi.json`) runs.
    #   * "Verify access to the Petstore APIs", through the MCP API rather than the UI
    #     playground: tools/list returns one tool per operation named after its
    #     `operationId` (`getPetById`, `findPetsByStatus`, `addPet`), and calling
    #     `getInventory` returns the inventory as structured content with `isError: false`.
    #   * "Tool response content": a JSON object response arrives in `structuredContent`
    #     and as a `text` block with the serialized JSON.
    #   * "Schema URL", "Inline schema", and "Stateless sessions": each config runs and
    #     lists the expected tools (the inline schema lists only `getPetById`).
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The UI tabs and the playground (Apply CORS, Initialize, Call tool) - UI-only.
    #   * The ARM64 tab - builds the image from source with Maven; CI runs on AMD64.
    #   * "Override the schema server path" - its example points at example.com, which
    #     serves no OpenAPI schema.
    #   * The other rows of the response-content table and the path parameter rules -
    #     the Petstore server does not return those response types on demand.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
