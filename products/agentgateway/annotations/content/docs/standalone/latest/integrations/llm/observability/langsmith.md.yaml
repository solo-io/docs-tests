    {{< doc-test paths="langsmith-validate" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The LangSmith tracing configuration on this page is accepted by agentgateway
    #     (--validate-only), so the tracing, policies, and header fields are spelled and
    #     shaped correctly.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * That LangSmith receives traces - external dependency: needs a real LangSmith
    #     account and API key. The test uses placeholder credentials and never contacts
    #     LangSmith.
    #   * The UI tab, the Docker run or Compose example, and the dashboard checks -
    #     browser-only steps or a different binary than the one under test.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    # Placeholder credentials. agentgateway expands the ${...} references when it loads
    # the config, so they must be set, but nothing is sent anywhere.
    export LANGSMITH_API_KEY="${LANGSMITH_API_KEY:-placeholder-key}"
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    cat > config-langsmith.yaml <<'EOF'
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      tracing:
        host: api.smith.langchain.com:443
        protocol: http
        path: /otel/v1/traces
        randomSampling: true
        policies:
          backendTLS: {}
          requestHeaderModifier:
            set:
              x-api-key: "${LANGSMITH_API_KEY}"
    gateways:
      default:
        port: 3000
    routes:
    - backends:
      - ai:
          name: openai
          provider:
            openAI:
              model: gpt-4o-mini
      policies:
        backendAuth:
          key: "$OPENAI_API_KEY"
    EOF
    agentgateway -f config-langsmith.yaml --validate-only
    echo "ok: the LangSmith tracing config is valid"
    {{< /doc-test >}}
