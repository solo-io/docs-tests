       #     dependency; needs a GitHub OAuth app and an interactive browser login. The test never
       #     follows the redirect to github.com.
       #   * The Google and Azure AD variants - need those providers' OAuth apps.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       {{< /doc-test >}}
