       {{< doc-test paths="oauth2-proxy" >}}
       cat <<'EOF' > config.yaml
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       frontendPolicies:
         accessLog:
           add:
             # Log the authenticated user's GitHub username and email
             github.user: 'extauthz.githubUser'
             github.email: 'extauthz.githubEmail'

       gateways:
         default:
           port: 3000
           protocol: HTTP
       routes:
       # Route OAuth2 Proxy endpoints (login, callback, and so on)
       - name: oauth2-proxy
         matches:
         - path:
             pathPrefix: /oauth2
         policies:
           urlRewrite:
             authority: none
         backends:
         - host: localhost:4180

       # Protected MCP application
       - name: application
         backends:
         - mcp:
             targets:
             - name: everything
               stdio:
                 cmd: npx
                 args: ["@modelcontextprotocol/server-everything"]
         policies:
           cors:
             allowOrigins: ["*"]
             allowHeaders: ["*"]
             exposeHeaders: ["Mcp-Session-Id"]
           extAuthz:
             host: localhost:4180
             includeRequestHeaders:
             - cookie
             protocol:
               http:
                 # Check authentication status
                 path: '"/oauth2/auth"'
                 # Redirect unauthenticated users to login
                 redirect: '"/oauth2/start?rd=" + request.path'
                 # Extract user info from OAuth2 Proxy response headers
                 metadata:
                   githubUser: response.headers["x-auth-request-user"]
                   githubEmail: response.headers["x-auth-request-email"]
                 addRequestHeaders:
                   x-forwarded-host: request.host
                 includeResponseHeaders:
                 - x-auth-request-user
       EOF
       agentgateway -f config.yaml --validate-only
       {{< /doc-test >}}
