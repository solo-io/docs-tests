       {{< doc-test paths="oauth2-proxy" >}}
       CODE=$(curl -s -o /dev/null -D o2p-mcp.headers -w '%{http_code}' http://localhost:3000/mcp)
       LOC=$(grep -i '^location:' o2p-mcp.headers | sed 's/^[^:]*: *//' | tr -d '\r')
       [ "$CODE" = "302" ] && [ "$LOC" = "/oauth2/start?rd=/mcp" ] \
         || { echo "FAIL: expected 302 to /oauth2/start?rd=/mcp, got $CODE $LOC"; exit 1; }
       echo "ok: unauthenticated request redirected to $LOC"
       # Follow one hop through the gateway's /oauth2 route.
       CODE=$(curl -s -o /dev/null -D o2p-start.headers -w '%{http_code}' "http://localhost:3000$LOC")
       GH=$(grep -i '^location:' o2p-start.headers | sed 's/^[^:]*: *//' | tr -d '\r')
       [ "$CODE" = "302" ] && case "$GH" in https://github.com/login/oauth/authorize?*client_id=doc-test-client-id*) true ;; *) false ;; esac \
         || { echo "FAIL: expected a redirect to the GitHub authorization page, got $CODE $GH"; exit 1; }
       echo "ok: /oauth2/start redirects to GitHub for the configured client"
       stop_agw
       {{< /doc-test >}}
