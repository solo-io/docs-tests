  content: |-
    {{< doc-test paths="open-webui" >}}
    # Open WebUI downloads models and migrates its database on first start; wait for it.
    for _ in $(seq 1 120); do
      curl -sf -o /dev/null -m 5 http://localhost:3080/health && break
      sleep 5
    done
    curl -sf -m 5 http://localhost:3080/health \
      || { echo "FAIL: Open WebUI did not become healthy on port 3080"; docker logs open-webui 2>&1 | tail -40; exit 1; }
    # Step 4.1: create the initial admin account (the first sign-up becomes the admin).
    TOKEN=$(curl -s -m 30 -X POST http://localhost:3080/api/v1/auths/signup \
      -H 'content-type: application/json' \
      -d '{"name": "Doc Test", "email": "doc-test@example.com", "password": "doc-test-Passw0rd!"}' | jq -r '.token // empty' || true)
    [ -n "$TOKEN" ] || { echo "FAIL: could not create the Open WebUI admin account"; exit 1; }
    # Step 4.2: the model list comes from agentgateway's /v1/models.
    models=$(curl -s -m 60 http://localhost:3080/api/models -H "Authorization: Bearer $TOKEN" || true)
    jq -e '[.data[]?.id] | index("gpt-4o-mini") != null' <<<"$models" >/dev/null \
      || { echo "FAIL: Open WebUI's model list has no gpt-4o-mini from agentgateway: $(head -c 500 <<<"$models")"; docker logs open-webui 2>&1 | tail -20; exit 1; }
    before=$(grep -Ec 'http.path=/v1/chat/completions.*http.status=200' "$AGW_LOG" || true)
    # Step 4.3: a chat through Open WebUI reaches agentgateway and returns the LLM's reply.
    reply=$(curl -s -m 120 -X POST http://localhost:3080/api/chat/completions \
      -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
      -d '{"model": "gpt-4o-mini", "stream": false, "messages": [{"role": "user", "content": "Hello"}]}' || true)
    jq -e '.choices[0].message.content == "mock completion"' <<<"$reply" >/dev/null \
      || { echo "FAIL: the chat through Open WebUI did not return the mock reply: $(head -c 500 <<<"$reply")"; tail -20 "$AGW_LOG"; exit 1; }
    # Step 5: the chat added a chat-completion entry with status 200 to the agentgateway log.
    sleep 1
    after=$(grep -Ec 'http.path=/v1/chat/completions.*http.status=200' "$AGW_LOG" || true)
    [ "${after:-0}" -gt "${before:-0}" ] \
      || { echo "FAIL: the chat from Open WebUI is not in the agentgateway log"; tail -20 "$AGW_LOG"; exit 1; }
    echo "ok: a chat sent through Open WebUI went through agentgateway"
    docker rm -f open-webui >/dev/null 2>&1 || true
    stop_agw
    {{< /doc-test >}}
