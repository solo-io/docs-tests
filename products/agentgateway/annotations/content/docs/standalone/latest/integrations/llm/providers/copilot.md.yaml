- after:
    block: 2
    fingerprint: 422b67617f35ae60
    lang: bash
    lines: 633e696d 67c5a3ac b0cead6d cb3139cb f7cc4a04 fc075a9d
    preview: curl -X POST http://localhost:4000/v1/chat/completions \
  content: |-
    {{< doc-test paths="llm-provider-copilot" >}}
    REC=/tmp/doc-test-copilot-last.json
    # The example request reached the Chat Completions path with the key and the protocol headers.
    python3 - "$REC" <<'PY'
    import json, sys
    r = json.load(open(sys.argv[1]))
    h = r["headers"]
    assert r["path"].endswith("/chat/completions"), r["path"]
    assert h.get("authorization") == "Bearer copilot-doc-test-key", h.get("authorization")
    assert h.get("editor-version", "").startswith("agentgateway/"), h
    assert h.get("x-initiator") == "agent", h
    assert h.get("x-interaction-type") == "conversation-agent", h
    assert r["body"].get("model") == "gpt-4.1", r["body"]
    print("example request: path, key, and Copilot headers verified")
    PY

    # A Responses request to gpt-4.1 is converted to Chat Completions.
    CODE=$(curl -s -o copilot-responses.json -w '%{http_code}' http://localhost:4000/v1/responses \
      -H "Content-Type: application/json" -d '{"model": "gpt-4.1", "input": "Hello"}')
    [ "$CODE" = "200" ] || { echo "FAIL: Responses to gpt-4.1 returned $CODE"; cat copilot-responses.json; exit 1; }
    python3 -c 'import json,sys; p=json.load(open(sys.argv[1]))["path"]; assert p.endswith("/chat/completions"), p' "$REC"
    echo "Responses request to gpt-4.1 was sent as Chat Completions"

    # A Messages request to a claude-* model passes through to /v1/messages.
    CODE=$(curl -s -o copilot-messages.json -w '%{http_code}' http://localhost:4000/v1/messages \
      -H "Content-Type: application/json" \
      -d '{"model": "claude-sonnet-4", "max_tokens": 16, "messages": [{"role": "user", "content": "Hello"}]}')
    [ "$CODE" = "200" ] || { echo "FAIL: Messages to claude-sonnet-4 returned $CODE"; cat copilot-messages.json; exit 1; }
    python3 -c 'import json,sys; p=json.load(open(sys.argv[1]))["path"]; assert p.endswith("/v1/messages"), p' "$REC"
    echo "Messages request to a claude-* model passed through to /v1/messages"

    # A Chat Completions request to a Responses-only model fails.
    CODE=$(curl -s -o copilot-gpt5.txt -w '%{http_code}' http://localhost:4000/v1/chat/completions \
      -H "Content-Type: application/json" -d '{"model": "gpt-5", "messages": [{"role": "user", "content": "Hello"}]}')
    [ "$CODE" = "400" ] && grep -q 'unsupported conversion' copilot-gpt5.txt \
      || { echo "FAIL: expected 400 unsupported conversion for gpt-5, got $CODE"; cat copilot-gpt5.txt; exit 1; }
    echo "Chat Completions to gpt-5 fails with unsupported conversion"
    stop_agw

    # Troubleshoot: a custom baseUrl without params.apiKey sends no Authorization header, even
    # with GH_COPILOT_TOKEN set.
    cat <<'EOF' > copilot-nokey.yaml
    llm:
      models:
      - name: "*"
        provider: copilot
        params:
          baseUrl: http://127.0.0.1:3093
    EOF
    export GH_COPILOT_TOKEN=copilot-env-token
    start_agw copilot-nokey.yaml copilot-nokey http://localhost:4000/
    curl -s -o /dev/null http://localhost:4000/v1/chat/completions -H "Content-Type: application/json" \
      -d '{"model": "gpt-4.1", "messages": [{"role": "user", "content": "Hello"}]}'
    python3 -c 'import json,sys; h=json.load(open(sys.argv[1]))["headers"]; assert "authorization" not in h, h["authorization"]' "$REC"
    echo "custom baseUrl without apiKey: no Authorization header"
    stop_agw
    unset GH_COPILOT_TOKEN

    # Troubleshoot: no credential anywhere, default upstream. Token lookup fails before any
    # connection to api.githubcopilot.com is made.
    agentgateway -f copilot.yaml --validate-only
    start_agw copilot.yaml copilot-notoken http://localhost:4000/
    CODE=$(curl -s -o copilot-notoken.txt -w '%{http_code}' http://localhost:4000/v1/chat/completions \
      -H "Content-Type: application/json" -d '{"model": "gpt-4.1", "messages": [{"role": "user", "content": "Hello"}]}')
    stop_agw
    [ "$CODE" = "500" ] || { echo "FAIL: expected 500 with no credential, got $CODE"; cat copilot-notoken.txt; exit 1; }
    cat copilot-notoken.txt /tmp/doc-test-agw-copilot-notoken.log | grep -q 'Copilot token not found' \
      || { echo "FAIL: Copilot token not found is in neither the response nor the logs"; cat copilot-notoken.txt; exit 1; }
    echo "no credential: 500 and Copilot token not found"
    {{< /doc-test >}}
