       # The config from the block above, with jwks pointed at the
       # local mock's keys because the tenant in this test does not exist.
       cat <<'EOF' > config.yaml
       mcp:
         port: 3000
         policies:
           cors:
             allowOrigins: ["*"]
             allowHeaders: ["*"]
             exposeHeaders: ["Mcp-Session-Id"]
           mcpAuthentication:
             mode: strict
             issuer: ${ENTRA_ISSUER}
             audiences:
             - api://${ENTRA_CLIENT_ID}
