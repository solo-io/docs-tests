  content: |-
    {{< doc-test paths="multi-layer-guardrails" >}}
    cat <<'EOF' > multi-layer.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      policies:
        guardrails:
          request:
          # Shared layer 1: Fast regex check for known patterns
          - regex:
              action: reject
              rules:
              - builtin: ssn
              - builtin: creditCard
              - builtin: email
            rejection:
              body: "Request contains PII and cannot be processed"
          response:
          - regex:
              action: mask
              rules:
              - builtin: ssn
              - builtin: creditCard
      models:
      - name: "*"
        provider: openAI
        params:
          model: gpt-3.5-turbo
          apiKey: "$OPENAI_API_KEY"
        guardrails:
          request:
          # Model layer: OpenAI moderation for harmful content
          - openAIModeration:
              model: omni-moderation-latest
              policies:
                backendAuth:
                  key: "$OPENAI_API_KEY"
            rejection:
              body: "Content blocked by moderation policy"
          # Model layer: Custom webhook for domain-specific checks
          - webhook:
              target:
                host: content-safety-webhook.example.com:8000
          response:
          - webhook:
              target:
                host: content-safety-webhook.example.com:8000
    EOF
    agentgateway -f multi-layer.yaml --validate-only
    start_agw multi-layer.yaml
    YAMLTest -f - <<'EOF'
    - name: the shared layer rejects an SSN for the model
      retries: 3
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "My SSN is 123-45-6789"}]}
      source:
        type: local
      expect:
        statusCode: 403
        bodyContains:
          - Request contains PII and cannot be processed
    - name: the shared layer rejects a credit card number
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Charge 4111 1111 1111 1111 please"}]}
      source:
        type: local
      expect:
        statusCode: 403
        bodyContains:
          - Request contains PII and cannot be processed
    - name: the shared layer rejects an email address
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Mail test@example.com"}]}
      source:
        type: local
      expect:
        statusCode: 403
        bodyContains:
          - Request contains PII and cannot be processed
    EOF
    stop_agw
    {{< /doc-test >}}
