    preview: '# yaml-language-server: $schema=https://agentgateway.dev/schema/config'
  content: |-
    {{< doc-test paths="routes" >}}
    cat <<'EOF' > config-http.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      http-proxy:
        port: 8080
        protocol: HTTP
    routes:
    - name: http-backend
      gateways: [http-proxy]
      hostnames:
      - "example.com"
      matches:
      - path:
          pathPrefix: /
      backends:
      - host: http.example.com:8080
        weight: 1
    EOF
    agentgateway -f config-http.yaml --validate-only
    {{< /doc-test >}}
