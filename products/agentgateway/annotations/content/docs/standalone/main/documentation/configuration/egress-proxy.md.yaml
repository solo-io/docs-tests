  content: |-
    {{< doc-test paths="egress-proxy" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Every example config is accepted by agentgateway (--validate-only).
    #   * Tunnel mode allowlist: an allowlisted host (pypi.org) is reachable through the
    #     proxy (200); a host outside the allowlist (example.com) fails with a client
    #     TLS error after the tunnel is set up, not with a proxy refusal.
    #   * Route mode: a request without credentials gets 407 with
    #     `proxy-authenticate: Basic realm="agentgateway-egress"`; with credentials an
    #     allowlisted host returns 200; a host outside the allowlist gets 404 to the
    #     CONNECT request (curl exit code 56).
    #   * Selected TLS termination: pypi.org still passes through; static.example.com
    #     returns `hello from agentgateway`; llm.example.com serves the `smart` model in
    #     /v1/models, all with the generated CA.
    #   * Inspect all HTTPS: a request to httpbingo.org through the dynamic CA carries
    #     the request transformation upstream and the response transformation back.
    #   * "Loopback and link-local destinations": a dynamic backend refuses
    #     localhost:15021 with 503 `backend not allowed` and logs the documented
    #     reason; after adding config.backend.allowDynamicLoopback, the same request
    #     returns 200 `ready`.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The `export HTTPS_PROXY` example - setting it would route every later HTTPS
    #     call in the test through the proxy; the tests pass --proxy explicitly.
    #   * The tcpRoutes dynamic `target` expression fragment - mirror.example.com does
    #     not exist.
    # REQUIREMENTS: outbound internet access to pypi.org and httpbingo.org.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > /tmp/doc-test-egress-agw.log 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat /tmp/doc-test-egress-agw.log; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    # The tunnel-mode examples declare a gateway on port 443. On Linux, an unprivileged
    # process cannot bind a port below 1024 unless the unprivileged range is lowered.
    if [ "$(uname -s)" = Linux ]; then
      first_port=$(sysctl -n net.ipv4.ip_unprivileged_port_start 2>/dev/null || echo 0)
      if [ "$first_port" -gt 443 ]; then
        sudo -n sysctl -w net.ipv4.ip_unprivileged_port_start=443 >/dev/null 2>&1 || true
      fi
    fi
    PROXY=http://127.0.0.1:3000
    # Print the status code of a HEAD request through the proxy; 000 on failure.
    via_proxy() { curl -s -o /dev/null -m 20 -w '%{http_code}' --noproxy '' --proxy "$PROXY" "$@" || true; }
    {{< /doc-test >}}
