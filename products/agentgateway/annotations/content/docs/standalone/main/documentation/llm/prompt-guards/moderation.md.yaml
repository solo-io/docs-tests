       import pathlib, re, sys
       src = pathlib.Path("moderation-config.yaml").read_text()
       out, n = re.subn(r"^(\s*)name: openai$", lambda m: m.group(0) + "\n" + m.group(1) + "hostOverride: localhost:3094", src, flags=re.M)
