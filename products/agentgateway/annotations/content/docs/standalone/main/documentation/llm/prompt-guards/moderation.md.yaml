  content: |-
    {{< doc-test paths="prompt-guards-moderation-inline" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Moderate content inline on the OpenAI provider": the documented
    #     `moderation-config.yaml` passes --validate-only, and every chat request
    #     that agentgateway sends to the OpenAI provider carries the configured
    #     `moderation` parameter (model omni-moderation-latest, input block, output
    #     score). A local mock provider records the request body it receives.
    #   * A `moderation` value that the client sends is replaced by the configured
    #     one, so a client cannot weaken it.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * "Block harmful content with the moderation prompt guard": agentgateway
    #     calls the OpenAI Moderation API itself, and that call has no host
    #     override, so it needs a real OpenAI API key. Credentialed, not tested.
    #   * The `moderation` results in the response: OpenAI produces them, so they
    #     need a real OpenAI API key.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    export OPENAI_API_KEY="${OPENAI_API_KEY:-sk-mock}"
    # The config step writes moderation-config.yaml through an unquoted heredoc, so the
    # shell expands the `$schema` in its first comment line. Keep that line intact.
    schema='$schema'

    # A mock OpenAI provider that records each request body it receives.
    cat > /tmp/moderation-mock.py <<'PY'
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("content-length") or 0)
            request = json.loads(self.rfile.read(length) or b"{}")
            with open("/tmp/moderation-mock.jsonl", "a") as log:
                log.write(json.dumps(request) + "\n")
            message = dict(role="assistant", content="mock completion")
            response = dict(id="chatcmpl-mock", object="chat.completion", created=0,
                            model=request.get("model", "mock"),
                            choices=[dict(index=0, finish_reason="stop", message=message)],
                            usage=dict(prompt_tokens=1, completion_tokens=1, total_tokens=2))
            payload = json.dumps(response).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
        def log_message(self, *args):
            pass
    HTTPServer(("127.0.0.1", 3094), Handler).serve_forever()
    PY
    : > /tmp/moderation-mock.jsonl
    python3 /tmp/moderation-mock.py > /tmp/moderation-mock.log 2>&1 &
    MODERATION_MOCK_PID=$!
    AGW_PID=""
    trap 'kill $AGW_PID $MODERATION_MOCK_PID 2>/dev/null || true' EXIT
    for _ in $(seq 1 20); do curl -s -o /dev/null -m 2 -X POST http://localhost:3094 -d '{}' && break; sleep 1; done
    # Assert on the last request body that the mock received.
    check_upstream() {
      python3 - "$1" <<'PY'
    import json, sys
    up = json.loads(open("/tmp/moderation-mock.jsonl").read().strip().splitlines()[-1])
    mod = up.get("moderation") or {}
    policy = mod.get("policy") or {}
    mode = lambda side: str((policy.get(side) or {}).get("mode", "")).lower()
    if not eval(sys.argv[1]):
        sys.exit(f"FAIL: {sys.argv[1]}\nupstream body: {up}")
    PY
    }
    {{< /doc-test >}}
