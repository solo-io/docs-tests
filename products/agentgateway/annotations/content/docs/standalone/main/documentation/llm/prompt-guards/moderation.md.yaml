       check_upstream 'mod.get("model") == "omni-moderation-latest" and mode("input") == "block"'
       kill $AGW_PID 2>/dev/null || true
       wait $AGW_PID 2>/dev/null || true
       AGW_PID=""
       echo "inline moderation is set by the gateway and cannot be overridden by the client"
