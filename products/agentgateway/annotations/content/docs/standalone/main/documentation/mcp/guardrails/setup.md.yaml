    preview: '# yaml-language-server: $schema=https://agentgateway.dev/schema/config'
  content: |2-
       {{< doc-test paths="mcp-guardrails" >}}
       cat <<'EOF' > config.yaml
       gateways:
         default:
           port: 3000
       routes:
       - policies:
           cors:
             allowOrigins:
             - "*"
             allowHeaders:
             - mcp-protocol-version
             - content-type
             - mcp-session-id
             exposeHeaders:
             - "Mcp-Session-Id"
           mcpGuardrails:
             processors:
             - kind: remote
               host: "localhost:9001"
               failureMode: failClosed
               methods:
                 tools/call: request
                 tools/list: response
         backends:
         - mcp:
             targets:
             - name: everything
               stdio:
                 cmd: npx
                 args: ["@modelcontextprotocol/server-everything"]
       EOF
       {{< /doc-test >}}
- after:
