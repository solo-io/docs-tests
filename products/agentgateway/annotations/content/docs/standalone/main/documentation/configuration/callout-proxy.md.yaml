  content: |-
    {{< doc-test paths="callout-proxy" >}}
    # WHAT THIS TEST VALIDATES:
    #   * The Option 1 example (`config.callouts.tunnel` with `noProxy`) is valid.
    #   * The settings-table claim about schemes: a `socks5://` tunnel URL passes `--validate-only`,
    #     and agentgateway then fails to start with `invalid callouts config`.
    #   * The JWKS walkthrough, run against local stand-ins: a JWKS fetch is a callout that goes
    #     through the forward proxy, agentgateway logs `callouts will use proxy`, an unreachable
    #     forward proxy makes startup fail with `failed to load JWKS`, and the HTTP_PROXY variable
    #     (Option 2) has the same effect as `config.callouts.tunnel`.
    #   * Destinations that bypass the forward proxy: a `noProxy` entry, and a loopback IP address,
    #     go direct, while the hostname `localhost` goes through the forward proxy.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The Google JWKS URL and the Squid container - external dependency, and a Squid container
    #     cannot reach a JWKS on the runner's loopback. The test runs a small logging forward proxy
    #     and a JWKS server on the runner instead, and points the JWKS at `localhost`, which the page
    #     says goes through the forward proxy.
    #   * TLS callouts through CONNECT, HTTPS_PROXY, and GCP credential fetches - need a TLS
    #     callout target or a GCP account.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    expect_start_fail() {
      local rc=0
      timeout 30 agentgateway -f "$1" > "$1.start.log" 2>&1 || rc=$?
      if [ "$rc" = "0" ] || [ "$rc" = "124" ]; then
        echo "FAIL: agentgateway did not exit with an error for $1 (rc=$rc), but the page says: $3"; cat "$1.start.log"; exit 1
      fi
      grep -q "$2" "$1.start.log" || { echo "FAIL: expected '$2' for $1"; cat "$1.start.log"; exit 1; }
      echo "fails to start as documented: $3"
    }

    cat <<'EOF' > callouts-example.yaml
    config:
      callouts:
        tunnel:
          url: http://proxy.example.com:3128
          noProxy:
          - internal.example.com
          - 10.0.0.0/8
    EOF
    agentgateway -f callouts-example.yaml --validate-only

    sed 's#http://proxy.example.com:3128#socks5://proxy.example.com:1080#' callouts-example.yaml > callouts-socks5.yaml
    agentgateway -f callouts-socks5.yaml --validate-only
    expect_start_fail callouts-socks5.yaml "invalid callouts config" "an unsupported scheme fails at startup"
    {{< /doc-test >}}
