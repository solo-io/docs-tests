  content: |-
    {{< doc-test paths="compression" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * Step 2: the config with `policies.compression` passes --validate-only.
    #   * Step 4: `Accept-Encoding: br, gzip` gets `content-encoding: gzip`, because
    #     `gzip` is first in the policy's `algorithms` list, plus
    #     `vary: accept-encoding`; the body really is gzip.
    #   * Step 5: `Accept-Encoding: br` gets `content-encoding: br`.
    #   * Step 6: no `Accept-Encoding` gets no `content-encoding`, a
    #     `content-length`, and still `vary: accept-encoding`.
    #   * Step 7: a gzip-encoded request body reaches httpbin decoded, so the
    #     `/anything` echo shows `json.hello == "world"`.
    #   * Extra: `Accept-Encoding: zstd` gets `zstd`, the third configured algorithm.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The eligibility rules in "Response compression" (32-byte minimum, media
    #     types, `Cache-Control: no-transform`, `Content-Range`, 204/304) - the page
    #     describes them but has no example request for them.
    #   * Quality-value (`q`) weighting and `identity` - no example on the page.
    #   * The "Compression settings" snippet on its own - it is a fragment, and the
    #     full config in step 2 covers the same fields.
    #   * Step 3 as written - it runs agentgateway in the foreground, which would
    #     block the script, so the test starts the same command in the background.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}

    # Remove a leftover container from an earlier run so `docker run --name httpbin`
    # does not fail, and clean up on any exit, including a failed assertion.
    docker rm -f httpbin >/dev/null 2>&1 || true
    trap '[ -n "${AGW_PID:-}" ] && kill "$AGW_PID" 2>/dev/null; docker rm -f httpbin >/dev/null 2>&1 || true' EXIT
    {{< /doc-test >}}
