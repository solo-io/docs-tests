  content: |-
    {{< doc-test paths="compression" >}}
    headers_for() {
      curl -s -m 10 -o /dev/null -D - http://localhost:3000/json "$@" | tr -d '\r' || true
    }

    expect_header() {
      local desc="$1" headers="$2" pattern="$3"
      if grep -qi "$pattern" <<<"$headers"; then
        echo "✓ $desc"
      else
        echo "FAIL: $desc -- no header matching '$pattern' in:"
        echo "$headers"
        exit 1
      fi
    }

    expect_no_header() {
      local desc="$1" headers="$2" pattern="$3"
      if grep -qi "$pattern" <<<"$headers"; then
        echo "FAIL: $desc -- unexpected header matching '$pattern' in:"
        echo "$headers"
        exit 1
      fi
      echo "✓ $desc"
    }

    # Step 4: equal preference, so the first configured algorithm (gzip) wins.
    H=$(headers_for -H "Accept-Encoding: br, gzip")
    expect_header "Accept-Encoding: br, gzip gets content-encoding: gzip" "$H" '^content-encoding: gzip$'
    expect_header "compressed response has vary: accept-encoding" "$H" '^vary: .*accept-encoding'
    expect_no_header "compressed response drops content-length" "$H" '^content-length:'
    curl -s -m 10 http://localhost:3000/json -H "Accept-Encoding: gzip" \
      | gunzip | python3 -c 'import json,sys; json.load(sys.stdin)' \
      || { echo "FAIL: gzip response body does not decompress to JSON"; exit 1; }
    echo "✓ gzip response body decompresses to JSON"

    # Step 5: br only.
    H=$(headers_for -H "Accept-Encoding: br")
    expect_header "Accept-Encoding: br gets content-encoding: br" "$H" '^content-encoding: br$'

    # zstd, the third configured algorithm.
    H=$(headers_for -H "Accept-Encoding: zstd")
    expect_header "Accept-Encoding: zstd gets content-encoding: zstd" "$H" '^content-encoding: zstd$'

    # Step 6: no Accept-Encoding. curl sends none unless --compressed is set.
    H=$(headers_for)
    expect_no_header "no Accept-Encoding gets no content-encoding" "$H" '^content-encoding:'
    expect_header "uncompressed response keeps content-length" "$H" '^content-length:'
    expect_header "uncompressed response still has vary: accept-encoding" "$H" '^vary: .*accept-encoding'

    # Step 7: gzip request body is decoded before it reaches httpbin.
    BODY=$(echo '{"hello":"world"}' | gzip | curl -s -m 10 http://localhost:3000/anything \
      -H "Content-Type: application/json" \
      -H "Content-Encoding: gzip" \
      --data-binary @-)
    echo "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("json") == {"hello": "world"}, d' \
      || { echo "FAIL: httpbin did not receive the decoded body: $BODY"; exit 1; }
    echo "✓ gzip request body reaches httpbin decoded"
    {{< /doc-test >}}
