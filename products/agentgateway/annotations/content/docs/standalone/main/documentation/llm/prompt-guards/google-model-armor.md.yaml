    head, _, _ = src.partition("    guardrails:\n")
    guard = """    guardrails:
          request:
          - scope: [systemPrompt, messages]
            googleModelArmor:
              templateId: doc-test-template
              projectId: doc-test-project
              location: us-central1
              policies:
                backendAuth:
                  gcp: {}
    """
    open("armor-scope.yaml", "w").write(head + guard)
    PY
    agentgateway -f armor-scope.yaml --validate-only
