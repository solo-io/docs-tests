  content: |-
    {{< doc-test paths="virtual-models" >}}
    cat <<'EOF' > config-failover.yaml
    llm:
      models:
      - name: claude-primary
        visibility: internal
        provider: anthropic
        params:
          model: claude-sonnet-4-0
          apiKey: "$ANTHROPIC_API_KEY"
        health:
          eviction:
            consecutiveFailures: 1
            duration: 60s
      - name: claude-backup-a
        visibility: internal
        provider: anthropic
        params:
          model: claude-3-5-haiku-20241022
          apiKey: "$ANTHROPIC_API_KEY"
        health:
          eviction:
            consecutiveFailures: 1
            duration: 60s
      - name: claude-backup-b
        visibility: internal
        provider: anthropic
        params:
          model: claude-3-5-haiku-20241022
          apiKey: "$ANTHROPIC_API_KEY"
        health:
          eviction:
            consecutiveFailures: 1
            duration: 60s

      virtualModels:
      - name: resilient
        routing:
          failover:
            targets:
            - model: claude-primary
              priority: 0
            - model: claude-backup-a
              priority: 1
            - model: claude-backup-b
              priority: 1
    EOF
    agentgateway -f config-failover.yaml --validate-only
    assert_models config-failover.yaml '["resilient"]'
    {{< /doc-test >}}
