  content: |-
    {{< doc-test paths="virtual-models" >}}
    cat <<'EOF' > config-weighted.yaml
    llm:
      models:
      - name: gpt-4o-public
        visibility: public
        provider: openAI
        params:
          model: gpt-4o
          apiKey: "$OPENAI_API_KEY"
      - name: gpt-4o-primary
        visibility: internal
        provider: openAI
        params:
          model: gpt-4o
          apiKey: "$OPENAI_API_KEY"
      - name: gpt-4o-fallback
        visibility: internal
        provider: openAI
        params:
          model: gpt-4o-mini
          apiKey: "$OPENAI_API_KEY"

      virtualModels:
      - name: smart
        routing:
          weighted:
            targets:
            - model: gpt-4o-primary
              weight: 90
            - model: gpt-4o-fallback
              weight: 10
    EOF
    agentgateway -f config-weighted.yaml --validate-only
    assert_models config-weighted.yaml '["gpt-4o-public","smart"]'
    {{< /doc-test >}}
