    {{< doc-test paths="guardrails-overview" >}}
    # A response webhook may only use the [messages] scope.
    cat <<'EOF' > guard-webhook-scope.yaml
    llm:
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
        guardrails:
          response:
          - scope: [toolInput]
            webhook:
              target:
                host: localhost:8000
    EOF
    if agentgateway -f guard-webhook-scope.yaml --validate-only > /tmp/doc-test-guard-webhook-scope.log 2>&1; then
      echo "FAIL: a response webhook with scope [toolInput] should not load"; cat /tmp/doc-test-guard-webhook-scope.log; exit 1
    fi
    echo "ok: a response webhook with scope [toolInput] does not load"
    {{< /doc-test >}}
