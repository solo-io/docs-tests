  content: |-
    {{< doc-test paths="guardrails-overview" >}}
    cat <<'EOF' > guard-scope.yaml
    llm:
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
        guardrails:
          request:
          - scope: [systemPrompt, messages, toolOutput, toolInput]
            regex:
              action: reject
              rules:
              - builtin: ssn
          response:
          - scope: [messages, toolInput]
            regex:
              action: reject
              rules:
              - pattern: "(?i)internal-only"
    EOF
    agentgateway -f guard-scope.yaml --validate-only
    # Contrast config: the same request guard with `scope` omitted (the default).
    cat <<'EOF' > guard-scope-default.yaml
    llm:
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
        guardrails:
          request:
          - regex:
              action: reject
              rules:
              - builtin: ssn
    EOF
    cat <<'EOF' > tool-input-ssn.json
    {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "file my claim"}, {"role": "assistant", "tool_calls": [{"id": "c1", "type": "function", "function": {"name": "file_claim", "arguments": "{\"ssn\": \"123-45-6789\"}"}}]}, {"role": "tool", "tool_call_id": "c1", "content": "claim filed"}]}
    EOF
    status_for() {
      curl -s -o /dev/null -w '%{http_code}' -m 15 http://localhost:4000/v1/chat/completions \
        -H 'content-type: application/json' --data @tool-input-ssn.json
    }
    to_mock guard-scope-default.yaml guard-scope-default-mock.yaml
    start_agw guard-scope-default-mock.yaml
    code=$(status_for)
    stop_agw
    [ "$code" = 200 ] || { echo "FAIL: default scope should not scan tool call arguments, got $code"; exit 1; }
    echo "ok: with the default scope, an SSN in tool call arguments passes ($code)"
    to_mock guard-scope.yaml guard-scope-mock.yaml
    start_agw guard-scope-mock.yaml
    code=$(status_for)
    stop_agw
    [ "$code" = 403 ] || { echo "FAIL: scope with toolInput should reject the SSN in tool call arguments, got $code"; exit 1; }
    echo "ok: with toolInput in scope, the SSN in tool call arguments is rejected ($code)"
    # An empty scope list is refused.
    sed 's/- scope: \[systemPrompt, messages, toolOutput, toolInput\]/- scope: []/' guard-scope.yaml > guard-scope-empty.yaml
    expect_load_error guard-scope-empty.yaml "scope must not be empty"
    {{< /doc-test >}}
