  content: |-
    {{< doc-test paths="guardrails-overview" >}}
    # The fragment from the page, plus one model. The model also carries a guard
    # without a `rejection` block, to show the default 403 response.
    cat <<'EOF' > guard-rejection.yaml
    llm:
      policies:
        guardrails:
          request:
          - regex:
              action: reject
              rules:
              - builtin: creditCard
            rejection:
              status: 422
              headers:
                set:
                  content-type: "application/json"
              body: '{"error":"Request contains sensitive information."}'
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
        guardrails:
          request:
          - regex:
              action: reject
              rules:
              - builtin: email
    EOF
    to_mock guard-rejection.yaml guard-rejection-mock.yaml
    agentgateway -f guard-rejection-mock.yaml --validate-only
    start_agw guard-rejection-mock.yaml
    YAMLTest -f - <<'EOF'
    - name: the credit card guard returns the custom 422 JSON rejection
      retries: 3
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Card 4111 1111 1111 1111"}]}
      source:
        type: local
      expect:
        statusCode: 422
        headers:
          - name: content-type
            comparator: contains
            value: application/json
        bodyJsonPath:
          - path: "$.error"
            comparator: equals
            value: Request contains sensitive information.
    - name: a guard without rejection settings returns the default 403 and body
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Mail test@example.com"}]}
      source:
        type: local
      expect:
        statusCode: 403
        bodyContains:
          - The request was rejected due to inappropriate content
    - name: a clean prompt reaches the model
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "hello"}]}
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    stop_agw
    {{< /doc-test >}}
