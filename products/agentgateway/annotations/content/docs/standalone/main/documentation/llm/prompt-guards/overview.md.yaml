  content: |-
    {{< doc-test paths="guardrails-overview" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # The page shows config fragments without heredocs; each test config below restates
    # the fragment and adds only the model entry needed to run it against a local mock LLM.
    # WHAT THIS TEST VALIDATES:
    #   * "Customize rejection responses": the credit card guard returns the documented
    #     422 with a JSON content-type and the configured body; a guard without a
    #     `rejection` block returns the default 403 and the body `The request was
    #     rejected due to inappropriate content`.
    #   * The audit mode and streaming guardrail example configs are accepted
    #     (--validate-only).
    #   * Guard scope: a prompt whose SSN is only in a tool call argument passes a guard with
    #     the default scope (200) and is rejected by the page's scope example, which
    #     adds `toolInput` (403). This is the "Guards do not scan tool call arguments
    #     by default" and "Setting scope replaces the default" claims.
    #   * Webhook scope: a response webhook with a scope other than [messages] fails
    #     to load.
    #   * An empty `scope` list fails to load with `scope must not be empty`.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Audit mode at runtime - the example's openAIModeration guard calls live OpenAI.
    #   * Streaming guardrails at runtime - the local mock LLM does not stream.
    #   * Mask behavior and the route-type table - covered by the regex guide or
    #     display-only.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > /tmp/doc-test-guardrails-overview-agw.log 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat /tmp/doc-test-guardrails-overview-agw.log; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    # Load a config that must be refused, and check the documented error text.
    expect_load_error() {
      local out
      if out=$(agentgateway -f "$1" --validate-only 2>&1); then
        echo "FAIL: $1 should not load"; echo "$out"; exit 1
      fi
      if ! grep -qF "$2" <<<"$out"; then
        echo "FAIL: $1 did not report: $2"; echo "$out"; exit 1
      fi
      echo "ok: $1 is refused with: $2"
    }
    {{< /doc-test >}}
