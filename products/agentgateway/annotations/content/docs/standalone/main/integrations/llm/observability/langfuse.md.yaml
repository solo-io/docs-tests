    {{< doc-test paths="langfuse-validate" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The Langfuse tracing configuration on this page is accepted by agentgateway
    #     (--validate-only), so the tracing, policies, and header fields are spelled and
    #     shaped correctly.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * That Langfuse receives traces - external dependency: needs a real Langfuse
    #     account and API key. The test uses placeholder credentials and never contacts
    #     Langfuse.
    #   * The UI tab, the Docker run or Compose example, and the dashboard checks -
    #     browser-only steps or a different binary than the one under test.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    # Placeholder credentials. agentgateway expands the ${...} references when it loads
    # the config, so they must be set, but nothing is sent anywhere.
    export LANGFUSE_AUTH_HEADER="${LANGFUSE_AUTH_HEADER:-$(printf '%s' 'pk-lf-test:sk-lf-test' | base64 | tr -d '\n')}"
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    cat > config-langfuse.yaml <<'EOF'
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      tracing:
        host: cloud.langfuse.com:443
        protocol: http
        path: /api/public/otel/v1/traces
        randomSampling: true
        policies:
          backendTLS: {}
          requestHeaderModifier:
            set:
              Authorization: "Basic ${LANGFUSE_AUTH_HEADER}"
    gateways:
      default:
        port: 3000
    routes:
    - backends:
      - ai:
          name: openai
          provider:
            openAI:
              model: gpt-4o-mini
      policies:
        backendAuth:
          key: "$OPENAI_API_KEY"
    EOF
    agentgateway -f config-langfuse.yaml --validate-only
    echo "ok: the Langfuse tracing config is valid"
    {{< /doc-test >}}
