  content: |2-
       {{< doc-test paths="tailscale" >}}
       AGW_PID=""
       stop_agw() {
         [ -n "${AGW_PID:-}" ] || return 0
         kill "$AGW_PID" 2>/dev/null || true
         wait "$AGW_PID" 2>/dev/null || true
         AGW_PID=""
       }
       cleanup() {
         stop_agw
         [ -n "${MOCK_PID:-}" ] && { kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true; }
         return 0
       }
       trap cleanup EXIT
       # start_agw CONFIG LOGNAME URL: start agentgateway and wait until URL answers at all.
       start_agw() {
         agentgateway -f "$1" > "/tmp/doc-test-agw-$2.log" 2>&1 &
         AGW_PID=$!
         for _ in $(seq 1 30); do
           curl -s -o /dev/null -m 2 "$3" && return 0
           kill -0 "$AGW_PID" 2>/dev/null || break
           sleep 1
         done
         echo "FAIL: agentgateway did not start with $1"; cat "/tmp/doc-test-agw-$2.log"; exit 1
       }
       # expect_invalid FILE CLAIM: the page says FILE's config is invalid.
       expect_invalid() {
         if agentgateway -f "$1" --validate-only > "$1.log" 2>&1; then
           echo "FAIL: $1 was accepted, but the page says: $2"; exit 1
         fi
         echo "rejected as documented: $2"
       }
       cat <<'EOF' > tailscale-linux.yaml
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       frontendPolicies:
         accessLog:
           add:
             tailscale.node: extauthz.tailscaleNode
             tailscale.email: extauthz.tailscaleEmail

       gateways:
         default:
           port: 3000
           protocol: HTTP
       routes:
       - name: application
         backends:
         - mcp:
             targets:
             - name: everything
               stdio:
                 cmd: npx
                 args: ["@modelcontextprotocol/server-everything"]
         policies:
           cors:
             allowOrigins: ["*"]
             allowHeaders: ["*"]
             exposeHeaders: ["Mcp-Session-Id"]
           extAuthz:
             host: unix:/run/tailscale/tailscaled.sock
             protocol:
               http:
                 path: |
                   "/localapi/v0/whois?addr=" + source.address
                 addRequestHeaders:
                   :authority: '"local-tailscaled.sock"'
                 metadata:
                   tailscaleNode: json(response.body).Node.Name
                   tailscaleEmail: json(response.body).UserProfile.LoginName
       EOF
       cat <<'EOF' > tailscale-macos.yaml
       # yaml-language-server: $schema=https://agentgateway.dev/schema/config
       frontendPolicies:
         accessLog:
           add:
             tailscale.node: extauthz.tailscaleNode
             tailscale.email: extauthz.tailscaleEmail

       gateways:
         default:
           port: 3000
           protocol: HTTP
       routes:
       - name: application
         backends:
         - mcp:
             targets:
             - name: everything
               stdio:
                 cmd: npx
                 args: ["@modelcontextprotocol/server-everything"]
         policies:
           cors:
             allowOrigins: ["*"]
             allowHeaders: ["*"]
             exposeHeaders: ["Mcp-Session-Id"]
           extAuthz:
             host: unix:/var/run/tailscale/tailscaled.sock
             protocol:
               http:
                 path: |
                   "/localapi/v0/whois?addr=" + source.address
                 addRequestHeaders:
                   :authority: '"local-tailscaled.sock"'
                 metadata:
                   tailscaleNode: json(response.body).Node.Name
                   tailscaleEmail: json(response.body).UserProfile.LoginName
       EOF
       agentgateway -f tailscale-linux.yaml --validate-only
       agentgateway -f tailscale-macos.yaml --validate-only

       # The stand-in for the Tailscale local API.
       SOCK=/tmp/doc-test-tailscaled.sock
       rm -f "$SOCK"
       cat > tailscaled-stub.py <<'PY'
       import json, socketserver, sys, urllib.parse
       from http.server import BaseHTTPRequestHandler
       class H(BaseHTTPRequestHandler):
           def do_GET(self):
               url = urllib.parse.urlsplit(self.path)
               addr = dict(urllib.parse.parse_qsl(url.query)).get("addr", "")
               with open("/tmp/doc-test-tailscale-whois.log", "a") as f:
                   f.write(json.dumps({"path": url.path, "addr": addr, "host": self.headers.get("host", "")}) + "\n")
               loopback = "127.0.0.1" in addr or addr in ("::1", "[::1]") or addr.startswith("[::1]:")
               if url.path != "/localapi/v0/whois" or not addr or loopback:
                   body, status = b"no match for IP:port\n", 404
               else:
                   body = json.dumps({"Node": {"Name": "doc-test-node.tailnet.ts.net."},
                                      "UserProfile": {"LoginName": "doc-user@example.com"}}).encode()
                   status = 200
               self.send_response(status)
               self.send_header("content-type", "application/json" if status == 200 else "text/plain")
               self.send_header("content-length", str(len(body)))
               self.end_headers()
               self.wfile.write(body)
           def address_string(self):
               return "unix"
           def log_message(self, *a):
               pass
       class S(socketserver.ThreadingMixIn, socketserver.UnixStreamServer):
           daemon_threads = True
       S(sys.argv[1], H).serve_forever()
       PY
       : > /tmp/doc-test-tailscale-whois.log
       python3 tailscaled-stub.py "$SOCK" > /tmp/doc-test-tailscaled-stub.out 2>&1 &
       MOCK_PID=$!
       for _ in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 1; done
       curl -s --unix-socket "$SOCK" -o /dev/null http://local-tailscaled.sock/localapi/v0/whois?addr=10.0.0.1 \
         || { echo "FAIL: the whois stand-in did not start"; cat /tmp/doc-test-tailscaled-stub.out; exit 1; }
       : > /tmp/doc-test-tailscale-whois.log

       # A non-loopback address of this machine stands in for the Tailscale IP.
       LAN_IP=$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}' || true)
       [ -n "$LAN_IP" ] || LAN_IP=$(hostname -I 2>/dev/null | awk '{print $1}' || true)
       [ -n "$LAN_IP" ] || { echo "FAIL: no non-loopback IPv4 address found"; exit 1; }
       tailscale() { echo "$LAN_IP"; }

       # The Linux configuration, with the stand-in socket.
       sed "s#unix:/run/tailscale/tailscaled.sock#unix:$SOCK#" tailscale-linux.yaml > config.yaml
       agentgateway -f config.yaml --validate-only
       agentgateway -f config.yaml > /tmp/doc-test-agw-tailscale.log 2>&1 &
       AGW_PID=$!
       for _ in $(seq 1 30); do curl -s -o /dev/null -m 2 http://localhost:3000/mcp && break; sleep 1; done
       : > /tmp/doc-test-tailscale-whois.log
       {{< /doc-test >}}
