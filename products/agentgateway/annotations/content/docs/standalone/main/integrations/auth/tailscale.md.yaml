  content: |2-
       {{< doc-test paths="tailscale" >}}
       # WHAT THIS TEST VALIDATES (against a stand-in for the Tailscale local API on a Unix socket):
       #   * Both the Linux and macOS configurations load.
       #   * The extAuthz policy calls the whois API over the Unix socket with the request's source
       #     address and the `local-tailscaled.sock` authority.
       #   * Step 3: a request from localhost, which has no Tailscale identity, is denied; a request
       #     from another address of this machine passes authorization and reaches the MCP server
       #     (406 without text/event-stream, then a complete initialize request succeeds).
       #   * The access log records the node name and login name extracted from the whois response.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A real tailnet and tailscaled - external dependency; needs a Tailscale account. The test
       #     serves the whois API from a small script on /tmp/doc-test-tailscaled.sock (the config's
       #     socket path is changed to it) that answers like tailscaled: 404 `no match for IP:port` for
       #     127.0.0.1, and a node and user profile for any other address. A `tailscale` shell function
       #     stands in for `tailscale ip -4` and prints a non-loopback address of this machine.
       #   * The exact denial status for localhost (the page shows 403) - it depends on what the real
       #     tailscaled returns, which the stand-in cannot prove.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       {{< /doc-test >}}
