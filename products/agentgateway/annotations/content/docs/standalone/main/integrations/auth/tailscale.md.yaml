       CODE=$(curl -s -o tailscale-local.txt -w '%{http_code}' http://localhost:3000/mcp)
       case "$CODE" in 2*|406) echo "FAIL: a localhost request was not denied ($CODE)"; cat tailscale-local.txt; exit 1 ;; esac
       echo "ok: localhost request denied ($CODE: $(head -c 80 tailscale-local.txt))"
       python3 - <<'PY'
       import json
       calls = [json.loads(l) for l in open("/tmp/doc-test-tailscale-whois.log") if l.strip()]
       assert calls, "the gateway did not call the whois API"
       c = calls[-1]
       assert c["path"] == "/localapi/v0/whois", c
       assert "127.0.0.1" in c["addr"] or "::1" in c["addr"], c
       assert c["host"] == "local-tailscaled.sock", c
       print("ok: whois called over the socket with addr", c["addr"], "and authority", c["host"])
       PY
       {{< /doc-test >}}
