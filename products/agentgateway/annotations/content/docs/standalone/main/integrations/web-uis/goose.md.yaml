    {{< doc-test paths="goose" >}}
    code=$(curl -s -o /tmp/doc-test-goose-reply.json -w '%{http_code}' -m 15 "$OPENAI_HOST/v1/chat/completions" \
      -H 'content-type: application/json' -H "Authorization: Bearer $OPENAI_API_KEY" \
      -d "{\"model\": \"$GOOSE_MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"say hello\"}]}")
    [ "$code" = 200 ] || { echo "FAIL: a Goose-style request should succeed, got $code"; cat /tmp/doc-test-goose-reply.json; exit 1; }
    [ "$(jq -r .model /tmp/doc-test-goose-reply.json)" = gpt-4o ] || { echo "FAIL: wrong model"; cat /tmp/doc-test-goose-reply.json; exit 1; }
    sleep 1
    grep -q 'gen_ai.request.model=gpt-4o' /tmp/doc-test-goose-agw.log \
      || { echo "FAIL: the request is not in the agentgateway log"; cat /tmp/doc-test-goose-agw.log; exit 1; }
    echo "ok: a Goose-style request reaches the model through agentgateway"
    stop_agw
    {{< /doc-test >}}
