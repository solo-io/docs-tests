  content: |-
    {{< doc-test paths="librechat" >}}
    # Step 2 runs agentgateway in the foreground with a real key; run the same config
    # in the background against the local mock LLM instead.
    start_agw config-mock.yaml
    out=$(curl -s -m 15 http://localhost:3000/v1/chat/completions \
        -H 'content-type: application/json' \
        -H "Authorization: Bearer placeholder" \
        -d '{"model": "gpt-4o", "messages": [{"role": "user", "content": "Hello"}]}' || true)
    jq -e '.model == "gpt-4o" and .choices[0].message.content == "mock completion"' <<<"$out" >/dev/null \
      || { echo "FAIL: no completion for gpt-4o on port 3000: $out"; cat "$AGW_LOG"; exit 1; }
    out=$(curl -s -m 15 http://localhost:3000/v1/chat/completions \
        -H 'content-type: application/json' \
        -H "Authorization: Bearer placeholder" \
        -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}' || true)
    jq -e '.model == "gpt-4o-mini" and .choices[0].message.content == "mock completion"' <<<"$out" >/dev/null \
      || { echo "FAIL: no completion for gpt-4o-mini on port 3000: $out"; cat "$AGW_LOG"; exit 1; }
    # The log entry that the page shows: the chat completion, proxied with status 200.
    sleep 1
    grep -Eq 'http.path=/v1/chat/completions.*http.status=200' "$AGW_LOG" \
      || { echo "FAIL: no http.path=/v1/chat/completions http.status=200 entry in the agentgateway log"; cat "$AGW_LOG"; exit 1; }
    echo "ok: agentgateway serves chat completions on port 3000 and logs them"
    {{< /doc-test >}}
