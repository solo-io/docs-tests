      -H "Authorization: Bearer placeholder" || true)
    [ "$code" = 200 ] && jq -e '[.data[]?.id] | index("gpt-4o") != null and index("gpt-4o-mini") != null' /tmp/doc-test-librechat-models.json >/dev/null \
      || { echo "FAIL: /v1/models answered $code without gpt-4o and gpt-4o-mini"; cat /tmp/doc-test-librechat-models.json; exit 1; }
    echo "ok: /v1/models lists $(jq '.data | length' /tmp/doc-test-librechat-models.json) models, including both listed in librechat.yaml"
    stop_agw
    {{< /doc-test >}}
