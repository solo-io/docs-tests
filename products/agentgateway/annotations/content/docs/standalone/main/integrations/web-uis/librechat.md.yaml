  content: |-
    {{< doc-test paths="librechat" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The Config file tab's config is accepted and serves chat completions on port
    #     3000 (against a local mock LLM instead of OpenAI), and agentgateway logs each
    #     one as http.path=/v1/chat/completions with http.status=200.
    #   * Gateway side of the librechat.yaml custom endpoint: both listed models
    #     (gpt-4o, and gpt-4o-mini, which is also the titleModel) get completions on
    #     port 3000 with the placeholder apiKey sent as a bearer token.
    #   * /v1/models lists catalog models, including gpt-4o and gpt-4o-mini, for the
    #     wildcard model (the page's note on `fetch`).
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * LibreChat itself - the page sets it up from LibreChat's own Docker Compose
    #     stack (with MongoDB) and gives no container command, and chatting requires
    #     registering and logging in to an account in the browser. Only the gateway
    #     side of the integration is tested.
    #   * The UI tab - browser-only steps.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    AGW_LOG=/tmp/doc-test-librechat-agw.log
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > "$AGW_LOG" 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat "$AGW_LOG"; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    # wait_http URL [TRIES]: wait until URL answers with any HTTP status (1 s apart).
    wait_http() {
      for _ in $(seq 1 "${2:-30}"); do
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "$1" 2>/dev/null || true)
        [ -n "$code" ] && [ "$code" != "000" ] && return 0
        sleep 1
      done
      echo "$1 did not answer"; return 1
    }
    # The Config file tab's agentgateway config (shown without a heredoc), restated.
    cat <<'EOF' > config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      port: 3000
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f config.yaml --validate-only
    to_mock config.yaml config-mock.yaml
    {{< /doc-test >}}
- after:
