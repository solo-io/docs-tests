  content: |-
    {{< doc-test paths="braintrust-validate" >}}
    # "Capture prompt and response content": the same tracing policy with the
    # message attributes added is also valid (CEL expressions included).
    cat > config-braintrust-content.yaml <<'EOF'
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      tracing:
        host: api.braintrust.dev:443
        protocol: http
        path: /otel/v1/traces
        randomSampling: true
        clientSampling: true
        policies:
          backendTLS: {}
          requestHeaderModifier:
            set:
              Authorization: "Bearer ${BRAINTRUST_API_KEY}"
              x-bt-parent: "${BRAINTRUST_PARENT}"
        resources:
          service.name: '"agentgateway"'
        attributes:
          llm.input_messages: >-
            flattenRecursive(llm.prompt.map(c, {"message": c}))
          llm.output_messages: >-
            flattenRecursive(llm.completion.map(c, {
              "role": "assistant",
              "content": c
            }))
    EOF
    agentgateway -f config-braintrust-content.yaml --validate-only
    echo "ok: the Braintrust tracing config with message content attributes is valid"
    {{< /doc-test >}}
