  content: |-
    {{< doc-test paths="braintrust-validate" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The Braintrust tracing configuration on this page is accepted by agentgateway
    #     (--validate-only), so the tracing, policies, and header fields are spelled and
    #     shaped correctly.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * That Braintrust receives traces - external dependency: needs a real Braintrust
    #     account and API key. The test uses placeholder credentials and never contacts
    #     Braintrust.
    #   * The UI tab, the Docker run or Compose example, and the dashboard checks -
    #     browser-only steps or a different binary than the one under test.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    # Placeholder credentials. agentgateway expands the ${...} references when it loads
    # the config, so they must be set, but nothing is sent anywhere.
    export BRAINTRUST_API_KEY="${BRAINTRUST_API_KEY:-placeholder-key}"
    export BRAINTRUST_PARENT="${BRAINTRUST_PARENT:-project_name:doc-test}"
    cat > config-braintrust.yaml <<'EOF'
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      tracing:
        host: api.braintrust.dev:443
        protocol: http
        path: /otel/v1/traces
        randomSampling: true
        clientSampling: true
        policies:
          backendTLS: {}
          requestHeaderModifier:
            set:
              Authorization: "Bearer ${BRAINTRUST_API_KEY}"
              x-bt-parent: "${BRAINTRUST_PARENT}"
        resources:
          service.name: '"agentgateway"'
    EOF
    agentgateway -f config-braintrust.yaml --validate-only
    echo "ok: the Braintrust tracing config is valid"
    {{< /doc-test >}}
