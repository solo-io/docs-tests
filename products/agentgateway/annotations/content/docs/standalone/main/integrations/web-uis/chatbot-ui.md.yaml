  content: |-
    {{< doc-test paths="chatbot-ui" >}}
    # The note's Docker command, restated: run detached under a name so the test can
    # stop it (the page runs it in the foreground with --rm).
    docker rm -f doc-test-chatbot-ui >/dev/null 2>&1 || true
    docker run -d --name doc-test-chatbot-ui -p 3000:3000 \
      --add-host=host.docker.internal:host-gateway \
      -e OPENAI_API_KEY=placeholder \
      -e OPENAI_API_HOST=http://host.docker.internal:3001 \
      ghcr.io/mckaywrigley/chatbot-ui:main
    wait_http http://localhost:3000/ 120 \
      || { docker logs doc-test-chatbot-ui 2>&1 | tail -20; exit 1; }
    code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:3000/ || true)
    [ "$code" = 200 ] || { echo "FAIL: Chatbot UI answered $code on port 3000"; exit 1; }
    # Chatbot UI's server fetches the model list from OPENAI_API_HOST/v1/models.
    models=$(curl -s -m 30 -w '\n%{http_code}' -X POST http://localhost:3000/api/models \
      -H 'content-type: application/json' -d '{"key": ""}' || true)
    [ "$(tail -n 1 <<<"$models")" = 200 ] \
      || { echo "FAIL: Chatbot UI could not list models through agentgateway: $models"; docker logs doc-test-chatbot-ui 2>&1 | tail -20; exit 1; }
    sed '$d' <<<"$models" | jq -e 'type == "array"' >/dev/null \
      || { echo "FAIL: Chatbot UI's model list is not a JSON array: $models"; exit 1; }
    echo "ok: the Chatbot UI container reached agentgateway at host.docker.internal:3001"
    docker rm -f doc-test-chatbot-ui >/dev/null 2>&1 || true
    stop_agw
    {{< /doc-test >}}
