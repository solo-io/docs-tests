  content: |-
    {{< doc-test paths="setup-keycloak" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for keycloak deployment to be ready
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: keycloak
            name: keycloak
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: wait for keycloak service LB address
      wait:
        target:
          kind: Service
          metadata:
            namespace: keycloak
            name: keycloak
        jsonPath: "$.status.loadBalancer.ingress[0].ip"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
