    YAMLTest -f - <<'EOF'
    - name: wait for api-key-auth policy to be accepted
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: agentgateway-system
            name: api-key-auth
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
