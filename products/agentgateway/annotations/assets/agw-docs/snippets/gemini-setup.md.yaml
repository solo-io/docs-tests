  content: |-
    {{< doc-test paths="llm-rbac-run" >}}
    # ============================================================================
    # Doc test coverage for the CEL-based RBAC guide (these comments are not rendered)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Set up access to Gemini": the Secret, the Gemini backend, and the custom
    #     /gemini HTTPRoute apply, and the backend translates in full.
    #   * "Set up RBAC permissions": the AgentgatewayPolicy is accepted; a request
    #     without the `x-llm: gemini` header is denied with 403, and the same request
    #     with the header succeeds with 200.
    #   * Cleanup runs.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * A live completion from Gemini: the backend is patched to the httpbun mock
    #     LLM, so no Google API key is needed. The policy decision happens in the
    #     gateway before any provider call, so the 403 does not depend on the mock.
    #   * The "Gemini default" and "OpenAI-compatible" route tabs: the RBAC policy
    #     targets the custom /gemini route.
    #
    # The visible export is a placeholder. Use a test value.
    export GOOGLE_KEY="${GOOGLE_KEY:-mock-google-key}"
    {{< reuse "agw-docs/snippets/deploy-mock-llm.md" >}}
    {{< /doc-test >}}
