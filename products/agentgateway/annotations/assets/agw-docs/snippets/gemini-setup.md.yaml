         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/gemini"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "", "messages": [{"role": "user", "content": "Explain how AI works in simple terms."}]}
         source:
           type: local
         retries: 15
         expect:
           statusCode: 200
           bodyJsonPath:
