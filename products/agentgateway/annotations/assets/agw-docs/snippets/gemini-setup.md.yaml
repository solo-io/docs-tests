  content: |2-
       {{< doc-test paths="gemini" >}}
       # ============================================================================
       # Doc test coverage for the Gemini provider guide (not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * schema: the AgentgatewayBackend for Gemini matches the CRD.
       #   * "Set up access to Gemini": the Secret, the Gemini backend, and the Custom route
       #     tab's /gemini HTTPRoute apply; the backend is accepted and translated in full.
       #   * Step 5 (Custom route tab, LoadBalancer): a chat completion request on /gemini
       #     returns 200 with an assistant message.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * A live Gemini completion - external dependency: needs a Google API key. The
       #     backend's host, port, and path are patched to the in-cluster httpbun mock LLM,
       #     so the gemini provider and its auth policy stay in place but no request leaves
       #     the cluster.
       #   * The "Gemini default" and "OpenAI-compatible" route tabs - each creates the same
       #     HTTPRoute name, so one tab is tested; the Localhost tabs need a port-forward.
       # The visible export is a placeholder. Use a test value.
       export GOOGLE_KEY="${GOOGLE_KEY:-mock-google-key}"
       {{< reuse "agw-docs/snippets/deploy-mock-llm.md" >}}
       {{< /doc-test >}}
