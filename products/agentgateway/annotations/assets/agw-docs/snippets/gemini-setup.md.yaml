    fingerprint: 86b74dc4fe4b60d6
    lang: yaml
    lines: 16c71da1 8c67597e 56bf9360 8c8c4228 32ecf0ce 8af957d1 36184fa5 d3d416e7 2d157081 8af957d1 3de9d845 b733d726 aeca2b3d bf068a96 79b10c33 94ae491e f047ee91 8af957d1 b6e1c19c 99d7dba1 abc56510
    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="gemini" >}}
       kubectl patch {{< reuse "agw-docs/snippets/backend.md" >}} google -n {{< reuse "agw-docs/snippets/namespace.md" >}} --type=merge --patch-file /dev/stdin <<EOF
       spec:
         ai:
           provider:
             host: httpbun.default.svc.cluster.local
             port: 3090
             path: /llm/chat/completions
       EOF
       YAMLTest -f - <<'EOF'
       - name: the google backend is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: google
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       # Accepted=True also covers a partly translated backend (reason PartiallyValid),
       # which can silently drop its auth policy. The reason tells the two apart.
       - name: the google backend translated in full, not partly
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: google
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: "Accepted"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       - name: the google HTTPRoute is accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: agentgateway-system
               name: google
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
