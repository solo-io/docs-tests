    YAMLTest -f - <<'EOF'
    - name: request through agentgateway to httpbin returns 200
      http:
        url: "http://localhost:3000"
        path: /headers
        method: GET
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
