  content: |-
    {{< doc-test paths="virtual-keys" >}}
    YAMLTest -f - <<'EOF'
    - name: request with valid API key succeeds
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
          Authorization: "Bearer sk-alice-abc123def456"
        body: |
          {
            "model": "gpt-3.5-turbo",
            "messages": [{"role": "user", "content": "Hello!"}]
          }
      source:
        type: local
      expect:
        statusCode: 200

    - name: request with invalid API key is rejected
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
          Authorization: "Bearer invalid-key"
        body: |
          {
            "model": "gpt-3.5-turbo",
            "messages": [{"role": "user", "content": "Hello!"}]
          }
      source:
        type: local
      expect:
        statusCode: 401

    - name: request with Bob's key also succeeds independently
      http:
        url: "http://localhost:4000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
          Authorization: "Bearer sk-bob-xyz789uvw012"
        body: |
          {
            "model": "gpt-3.5-turbo",
            "messages": [{"role": "user", "content": "Hello!"}]
          }
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
