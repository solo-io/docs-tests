  content: |-
    {{< doc-test paths="docker-install" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Mount a directory": the container starts as the current user, generates
    #     config.yaml in the mounted directory with the documented content (SQLite
    #     database under /config, `default` gateway on 4000, UI on that gateway), and
    #     serves the UI at http://localhost:4000/ui.
    #   * "Mount a configuration file": the documented config.yaml and docker run start a
    #     container that loads /config.yaml and serves the UI on port 4000.
    #   * "Verify that the container runs" / "Find the UI address": `docker ps` lists the
    #     container, and the logs report the loaded file and the UI address.
    #   * "Run with Docker Compose": the documented compose.yaml starts the service and
    #     serves the UI on port 4000; `docker compose ps` lists it as running.
    #   * Cleanup: `docker rm -f agentgateway` and `docker compose down`.
    #
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Opening the UI in a browser - checked as an HTTP 200 from /ui instead.
    #   * The compose file's literal `user: "1000:1000"` - the page says to replace it
    #     with your own IDs; the test substitutes `id -u`/`id -g` so the container can
    #     write the mounted directory on any runner.
    # ============================================================================
    trap 'docker rm -f agentgateway >/dev/null 2>&1 || true; docker compose -f compose.yaml down >/dev/null 2>&1 || true' EXIT

    wait_ui() {
      for _ in $(seq 1 60); do
        [ "$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://localhost:4000/ui/ 2>/dev/null || true)" = "200" ] && return 0
        sleep 2
      done
      echo "UI at http://localhost:4000/ui did not return 200"; docker logs agentgateway 2>&1 | tail -30 || true; return 1
    }
    wait_ui

    # The generated file matches the page: SQLite under /config, `default` gateway on 4000,
    # and the UI attached to that gateway.
    test -f agentgateway-config/config.yaml
    python3 - <<'PY'
    import yaml
    c = yaml.safe_load(open("agentgateway-config/config.yaml"))
    assert c["config"]["database"]["url"] == "sqlite:///config/data.db", c
    assert c["gateways"]["default"]["port"] == 4000, c
    assert c["ui"]["gateways"] == "default", c
    PY
    {{< /doc-test >}}
