  content: |-
    {{< doc-test paths="docker-install" >}}
    # The logs name the loaded file and the UI address, as the example output shows.
    # (Logs go to a file first: `docker logs | grep -q` can fail under pipefail.)
    for _ in $(seq 1 10); do
      docker logs agentgateway > /tmp/doc-test-agw-docker.log 2>&1 || true
      grep -q 'serving UI at http://localhost:4000/ui' /tmp/doc-test-agw-docker.log && break
      sleep 1
    done
    grep -q 'loaded config from File("/config.yaml")' /tmp/doc-test-agw-docker.log
    grep -q 'serving UI at http://localhost:4000/ui' /tmp/doc-test-agw-docker.log

    # Remove the container from the tabs above so that the Compose service can use the
    # same name, port, and a fresh agentgateway-config directory (`mkdir` without -p).
    docker rm -f agentgateway >/dev/null 2>&1 || true
    rm -rf agentgateway-config data

    # "Create the Compose file": the page's compose.yaml, with your own user and group IDs
    # in place of the literal 1000:1000, as the page instructs.
    cat > compose.yaml <<EOF
    services:
      agentgateway:
        container_name: agentgateway
        restart: unless-stopped
        image: {{< reuse "agw-docs/standalone/image-ref.md" >}}:{{< reuse "agw-docs/versions/image-tag.md" >}}
        user: "$(id -u):$(id -g)"
        ports:
          - "4000:4000"
        volumes:
          - ./agentgateway-config:/config
    EOF
    {{< /doc-test >}}
