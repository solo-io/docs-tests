    {{< doc-test paths="binary-install" >}}
    # Run agentgateway in the background. Never call start_gateway inside $( ): the PID
    # would be set in a subshell and the gateway would never be stopped.
    start_gateway() {
      agentgateway -f "$1" > "/tmp/doc-test-agw-$(basename "$1").log" 2>&1 &
      AGW_PID=$!
    }
    stop_gateway() {
      [ -n "${AGW_PID:-}" ] || return 0
      kill "$AGW_PID" 2>/dev/null || true
      wait "$AGW_PID" 2>/dev/null || true
      AGW_PID=""
    }
    # wait_http URL [TRIES]: wait until URL answers with any HTTP status.
    wait_http() {
      for _ in $(seq 1 "${2:-30}"); do
        code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 "$1" 2>/dev/null || true)
        [ -n "$code" ] && [ "$code" != "000" ] && return 0
        sleep 1
      done
      echo "$1 did not answer"; return 1
    }

    # Use a throwaway config directory instead of the runner's ~/.config.
    export XDG_CONFIG_HOME="${TMPDIR:-/tmp}/doc-test-xdg-$$"
    rm -rf "$XDG_CONFIG_HOME"; mkdir -p "$XDG_CONFIG_HOME"
    GEN="$XDG_CONFIG_HOME/agentgateway/config.yaml"
    trap 'stop_gateway; rm -rf "$XDG_CONFIG_HOME"' EXIT

    agentgateway > /tmp/doc-test-agw-bare.log 2>&1 &
    AGW_PID=$!
    ok=""
    for _ in $(seq 1 30); do
      [ "$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://localhost:4000/ui/ || true)" = "200" ] && ok=yes && break
      sleep 1
    done
    [ -n "$ok" ] || { echo "generated config did not serve the UI on :4000"; cat /tmp/doc-test-agw-bare.log; exit 1; }
    test -f "$GEN"
    python3 - "$GEN" "$XDG_CONFIG_HOME" <<'PY'
    import sys, yaml
    c = yaml.safe_load(open(sys.argv[1]))
    url = c["config"]["database"]["url"]
    assert url.startswith("sqlite://") and url.endswith("/agentgateway/data.db"), url
    assert sys.argv[2] in url, (url, sys.argv[2])
    assert c["gateways"]["default"]["port"] == 4000, c
    assert c["ui"]["gateways"] == "default", c
    PY
    stop_gateway

    # "Agentgateway does not overwrite an existing file": mark the file, run again, and
    # confirm that the mark is still there.
    echo "# doc-test-marker" >> "$GEN"
    agentgateway > /tmp/doc-test-agw-bare2.log 2>&1 &
    AGW_PID=$!
    wait_http http://localhost:4000/ui/ 30
    grep -q '^# doc-test-marker$' "$GEN"
    stop_gateway
    {{< /doc-test >}}
