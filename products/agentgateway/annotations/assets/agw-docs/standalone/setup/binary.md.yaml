    #     download`) - the install script needs sudo to write /usr/local/bin and the
    #     nightly build needs a GitHub Actions run ID. The test installs the binary for
    #     the docs version with the shared install snippet instead.
    #   * The two foreground `agentgateway` commands are run in the background with their
    #     output in /tmp, so that the test can query them.
    #   * Opening the UI in a browser - checked as an HTTP 200 instead.
    # ============================================================================
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< /doc-test >}}
