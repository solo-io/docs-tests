  content: |-
    {{< doc-test paths="binary-install" >}}
    # A configuration file of your own, with no `ui` section. The route answers directly,
    # so the test can tell the gateway port apart from the UI.
    cat > config.yaml <<'EOF'
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      default:
        port: 4000
    routes:
    - policies:
        directResponse:
          body: "before-reload"
          status: 200
    EOF
    start_gateway config.yaml
    wait_http http://localhost:15000/ui/ 30
    # Without a `ui` section, the UI is served on the admin interface only.
    [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:15000/ui/)" = "200" ]
    [ "$(curl -s http://localhost:4000/ui/)" = "before-reload" ]

    # "Agentgateway watches the file and reloads it": change the route and wait for the
    # running process to serve the new body.
    # Rewrite in place (same inode), the way an editor save would.
    sed 's/before-reload/after-reload/' config.yaml > /tmp/doc-test-config.yaml.new
    cat /tmp/doc-test-config.yaml.new > config.yaml
    body=""
    for _ in $(seq 1 30); do
      body=$(curl -s http://localhost:4000/ || true)
      [ "$body" = "after-reload" ] && break
      sleep 1
    done
    [ "$body" = "after-reload" ] || { echo "config change was not reloaded (got '$body')"; exit 1; }
    stop_gateway
    {{< /doc-test >}}
