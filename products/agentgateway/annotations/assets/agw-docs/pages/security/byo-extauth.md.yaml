  content: |2-
       {{< doc-test paths="extauth-byo-ext-auth-service-run" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the ext-authz service to be available
         wait:
           target:
             kind: Deployment
             metadata:
               namespace: agentgateway-system
               name: ext-authz
           jsonPath: "$.status.availableReplicas"
           jsonPathExpectation:
             comparator: greaterThan
             value: 0
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: before the policy, the openai route answers without authorization
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Write 5 sentences."}]}
         source:
           type: local
         retries: 10
         expect:
           statusCode: 200
       EOF
       {{< /doc-test >}}
- after:
    block: 6
