    preview: kubectl apply -f - <<EOF
  content: |2-
       {{< doc-test paths="extauth-byo-ext-auth-service-run" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the gateway ext auth policy to be accepted
         wait:
           target:
             kind: AgentgatewayPolicy
             metadata:
               namespace: agentgateway-system
               name: gateway-ext-auth-policy
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: a request without the x-ext-authz header is denied
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Write 5 sentences."}]}
         source:
           type: local
         retries: 10
         expect:
           statusCode: 403
           bodyContains:
           - 'denied by ext_authz'
       - name: a request with the x-ext-authz allow header is authorized
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
             x-ext-authz: allow
           body: |
             {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "Write 5 sentences."}]}
         source:
           type: local
         retries: 10
         expect:
           statusCode: 200
       EOF
       {{< /doc-test >}}
