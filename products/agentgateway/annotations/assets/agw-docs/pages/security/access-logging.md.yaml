          type: local
        expect:
          statusCode: 200
      - name: verify user_id custom field appears in logs
        command:
          command: "kubectl logs -n {{< reuse "agw-docs/snippets/namespace.md" >}} deployments/agentgateway-proxy"
        source:
          type: local
        expect:
          exitCode: 0
          stdout:
            contains: "user_id=\"user-123\""
