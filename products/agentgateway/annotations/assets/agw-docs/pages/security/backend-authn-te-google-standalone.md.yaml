    preview: cat > agentgateway-realm.json <<'EOF'
  content: |2-
       {{< doc-test paths="te-google" >}}
       # WHAT THIS TEST VALIDATES:
       #   * Step 1 as written, against a local Keycloak: the realm imports, the token for testuser has
       #     the https://keycloak.example.com issuer, the agentgateway audience, and a sub claim, and
       #     the saved jwks.json holds only signing keys.
       #   * Step 3: the generated configuration loads with sample project, pool, and provider values.
       #   * Step 4, last request: without a token, the gateway answers `invalid request` with 400.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Step 2, the token exchange at the Google STS, and the Cloud Storage listing - external
       #     dependency; need a Google Cloud project with Workload Identity Federation. No request
       #     with a token is sent, so the gateway never calls sts.googleapis.com.
       #   * The Troubleshooting table - each row is a Google STS response.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       AGW_PID=""
       stop_agw() {
         [ -n "${AGW_PID:-}" ] || return 0
         kill "$AGW_PID" 2>/dev/null || true
         wait "$AGW_PID" 2>/dev/null || true
         AGW_PID=""
       }
       cleanup() {
         stop_agw
         [ -n "${MOCK_PID:-}" ] && { kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true; }
         return 0
       }
       trap cleanup EXIT
       # start_agw CONFIG LOGNAME URL: start agentgateway and wait until URL answers at all.
       start_agw() {
         agentgateway -f "$1" > "/tmp/doc-test-agw-$2.log" 2>&1 &
         AGW_PID=$!
         for _ in $(seq 1 30); do
           curl -s -o /dev/null -m 2 "$3" && return 0
           kill -0 "$AGW_PID" 2>/dev/null || break
           sleep 1
         done
         echo "FAIL: agentgateway did not start with $1"; cat "/tmp/doc-test-agw-$2.log"; exit 1
       }
       # expect_invalid FILE CLAIM: the page says FILE's config is invalid.
       expect_invalid() {
         if agentgateway -f "$1" --validate-only > "$1.log" 2>&1; then
           echo "FAIL: $1 was accepted, but the page says: $2"; exit 1
         fi
         echo "rejected as documented: $2"
       }
       docker rm -f keycloak >/dev/null 2>&1 || true
       {{< /doc-test >}}
