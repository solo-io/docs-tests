       {{< doc-test paths="te-google" >}}
       trap 'cleanup; docker rm -f keycloak >/dev/null 2>&1 || true' EXIT
       # Bound the visible wait loop that follows, so that a Keycloak that never starts fails the test.
       for _ in $(seq 1 150); do
         curl -sf http://localhost:7080/realms/agentgateway/.well-known/openid-configuration > /dev/null && break
         sleep 2
       done
       curl -sf http://localhost:7080/realms/agentgateway/.well-known/openid-configuration > /dev/null \
         || { echo "FAIL: the Keycloak realm was not served"; docker logs keycloak 2>&1 | tail -50; exit 1; }
       {{< /doc-test >}}
