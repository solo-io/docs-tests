    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="extauth-basic-run" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the basic-auth policy to be accepted
         wait:
           target:
             kind: AgentgatewayPolicy
             metadata:
               namespace: agentgateway-system
               name: basic-auth
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: a request without credentials is rejected
         http:
           url: "http://${INGRESS_GW_ADDRESS}/headers"
           method: GET
           headers:
             host: www.example.com
         source:
           type: local
         retries: 5
         expect:
           statusCode: 401
       - name: a request with the user's credentials succeeds
         http:
           url: "http://${INGRESS_GW_ADDRESS}/headers"
           method: GET
           headers:
             host: www.example.com
             Authorization: basic dXNlcjpwYXNzd29yZA==
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       - name: a request with a wrong password is rejected
         http:
           url: "http://${INGRESS_GW_ADDRESS}/headers"
           method: GET
           headers:
             host: www.example.com
             Authorization: basic dXNlcjp3cm9uZw==
         source:
           type: local
         retries: 5
         expect:
           statusCode: 401
       EOF
       {{< /doc-test >}}
