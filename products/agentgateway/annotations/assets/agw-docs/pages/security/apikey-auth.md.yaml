  content: |2-
       {{< doc-test paths="apikey-auth" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the apikey-auth policy to be accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: agentgateway-system
               name: apikey-auth
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: a request without an API key is rejected
         http:
           url: "http://${INGRESS_GW_ADDRESS}/headers"
           method: GET
           headers:
             host: www.example.com
         source:
           type: local
         retries: 5
         expect:
           statusCode: 401
       - name: a request with a valid API key succeeds
         http:
           url: "http://${INGRESS_GW_ADDRESS}/headers"
           method: GET
           headers:
             host: www.example.com
             Authorization: Bearer N2YwMDIxZTEtNGUzNS1jNzgzLTRkYjAtYjE2YzRkZGVmNjcy
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       EOF
       {{< /doc-test >}}
