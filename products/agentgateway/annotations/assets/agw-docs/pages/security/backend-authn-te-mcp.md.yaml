    - name: wait for the mcp token exchange policy to be accepted
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: httpbin
            name: mcp-token-exchange
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
