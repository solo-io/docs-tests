       {{< doc-test paths="cross-app-access" >}}
       trap 'cleanup; docker rm -f kc-idjag >/dev/null 2>&1 || true' EXIT
       # Bound the wait, so that a Keycloak that never starts fails the test instead of hanging it.
       for _ in $(seq 1 120); do
         [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8480/realms/master || true)" = "200" ] && break
         sleep 5
       done
       [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8480/realms/master || true)" = "200" ] \
         || { echo "FAIL: Keycloak did not become ready"; docker logs kc-idjag 2>&1 | tail -50; exit 1; }
       {{< /doc-test >}}
