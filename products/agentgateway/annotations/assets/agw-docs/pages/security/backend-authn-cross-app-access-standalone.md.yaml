  content: |2-
       {{< doc-test paths="cross-app-access" >}}
       export KC_AGENT_SECRET=agent-secret KC_RESOURCE_SECRET=resource-secret
       agentgateway -f ./gateway.yaml --validate-only

       # Configuration fragments from the page, applied to the example config.
       python3 - <<'PY'
       s = open("gateway.yaml").read()
       scopes = "            - todos.read\n"
       assert scopes in s, "the example config changed shape"
       open("xaa-no-access-scopes.yaml", "w").write(s.replace(scopes, scopes + "            accessTokenScopes: []\n", 1))
       open("xaa-extra-scope.yaml", "w").write(s.replace(scopes, scopes + "            accessTokenScopes:\n            - other.scope\n", 1))
       leg1 = """                clientId: agent-client
                       method: clientSecretBasic
                       clientSecret: $KC_AGENT_SECRET
       """
       assert leg1 in s, "the example config changed shape"
       pk = """                clientId: gateway-at-chat
                       method: privateKeyJwt
                       signingKey:
                         file: ./xaa-signing-key.pem
                       alg: RS256
                       kid: my-signing-key
                       assertionAudience: https://chat.example.com/oauth2/token
       """
       open("xaa-private-key-jwt.yaml", "w").write(s.replace(leg1, pk))
       open("xaa-private-key-jwt-noaud.yaml", "w").write(
           s.replace(leg1, pk.replace("                assertionAudience: https://chat.example.com/oauth2/token\n", "")))
       PY
       openssl genrsa -out xaa-signing-key.pem 2048 2>/dev/null
       agentgateway -f xaa-no-access-scopes.yaml --validate-only
       agentgateway -f xaa-extra-scope.yaml --validate-only
       echo "ok: a scope absent from scopes does not reject the configuration"
       agentgateway -f xaa-private-key-jwt.yaml --validate-only
       expect_invalid xaa-private-key-jwt-noaud.yaml "privateKeyJwt requires an explicit assertionAudience"

       start_agw ./gateway.yaml xaa http://localhost:3030/todos
       {{< /doc-test >}}
