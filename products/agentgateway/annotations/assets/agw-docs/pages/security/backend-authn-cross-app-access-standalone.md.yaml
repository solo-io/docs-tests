  content: |-
    {{< doc-test paths="cross-app-access" >}}
    # WHAT THIS TEST VALIDATES:
    #   * The Local example, end to end, as written: Keycloak in Docker as both the IdP and the
    #     resource authorization server, the example's gateway.yaml, and the echo backend. The
    #     backend receives a Bearer access token for alice with azp resource-client and the
    #     todos.read scope, not the inbound ID token; no token gets 400 and a bad token gets 401.
    #   * Configuration fragments, applied to the example config: `accessTokenScopes: []` loads, a
    #     scope that is absent from `scopes` loads (warning only), and `privateKeyJwt` loads with
    #     `assertionAudience` and is rejected without it.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The xaa.dev and Okta/Auth0 demos - external dependency; need hosted accounts.
    #   * Token caching - not observable from outside the gateway.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    AGW_PID=""
    stop_agw() {
      [ -n "${AGW_PID:-}" ] || return 0
      kill "$AGW_PID" 2>/dev/null || true
      wait "$AGW_PID" 2>/dev/null || true
      AGW_PID=""
    }
    cleanup() {
      stop_agw
      [ -n "${MOCK_PID:-}" ] && { kill "$MOCK_PID" 2>/dev/null || true; wait "$MOCK_PID" 2>/dev/null || true; }
      return 0
    }
    trap cleanup EXIT
    # start_agw CONFIG LOGNAME URL: start agentgateway and wait until URL answers at all.
    start_agw() {
      agentgateway -f "$1" > "/tmp/doc-test-agw-$2.log" 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -s -o /dev/null -m 2 "$3" && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "FAIL: agentgateway did not start with $1"; cat "/tmp/doc-test-agw-$2.log"; exit 1
    }
    # expect_invalid FILE CLAIM: the page says FILE's config is invalid.
    expect_invalid() {
      if agentgateway -f "$1" --validate-only > "$1.log" 2>&1; then
        echo "FAIL: $1 was accepted, but the page says: $2"; exit 1
      fi
      echo "rejected as documented: $2"
    }
    docker rm -f kc-idjag >/dev/null 2>&1 || true
    {{< /doc-test >}}
