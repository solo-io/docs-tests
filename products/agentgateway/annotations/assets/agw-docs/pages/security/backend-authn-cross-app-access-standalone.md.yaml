       {{< doc-test paths="cross-app-access" >}}
       curl -s http://localhost:3030/todos -H "Authorization: Bearer $ID_TOKEN" > xaa-echo.json
       python3 - "$ID_TOKEN" <<'PY'
       import base64, json, sys
       d = json.load(open("xaa-echo.json"))
       h = {k.lower(): v for k, v in d["headers"].items()}
       tok = h["authorization"].split()[1]
       assert tok != sys.argv[1], "the inbound ID token reached the backend"
       p = json.loads(base64.urlsafe_b64decode(tok.split(".")[1] + "=="))
       assert p["typ"] == "Bearer", p.get("typ")
       assert p["preferred_username"] == "alice", p.get("preferred_username")
       assert p["azp"] == "resource-client", p.get("azp")
       assert "todos.read" in p["scope"].split(), p.get("scope")
       print("ok: backend received a Bearer token for alice, azp resource-client, scope", p["scope"])
       PY
       {{< /doc-test >}}
