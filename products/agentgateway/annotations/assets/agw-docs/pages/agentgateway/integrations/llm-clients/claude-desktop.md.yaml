  content: |2-
       {{< doc-test paths="claude-desktop" >}}
       # WHAT THIS TEST VALIDATES (against a local recording mock in place of api.anthropic.com, and a
       # local JWKS server in place of Entra ID):
       #   * Subscription passthrough: the Teams configuration listens on port 4001, forwards the
       #     user's bearer token upstream unchanged, and adds no provider API key; `/v1/models` lists
       #     Anthropic model IDs from the catalog for the `*` model; the `requestHeaders` example adds
       #     `anthropic-beta: oauth-2025-04-20` to the upstream request.
       #   * Identity provider: with the page's jwtAuth configuration (strict mode, issuer, audience,
       #     JWKS), a request without a token or with a token for another audience gets 401, and a valid
       #     ID token reaches the backend with the configured ANTHROPIC_API_KEY instead of the user token.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Claude Desktop itself, its developer menu, `claude setup-token`, and MDM profiles - a GUI
       #     app and real Claude and Entra ID accounts.
       #   * The Entra ID URLs - the issuer and JWKS hosts are replaced with a local server, because
       #     loading the config fetches the JWKS.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       {{< /doc-test >}}
