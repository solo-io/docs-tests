       {{< doc-test paths="llm-client-opencode" >}}
       jq -e '.provider.agentgateway.options.baseURL == "http://localhost:4000/v1"
         and .provider.agentgateway.models["gpt-4o-mini"] != null
         and .model == "agentgateway/gpt-4o-mini"' opencode.json >/dev/null \
         || { echo "FAIL: opencode.json does not match the agentgateway config"; cat opencode.json; exit 1; }
       send() {
         curl -s -o /dev/null -w '%{http_code}' -m 15 http://localhost:4000/v1/chat/completions \
           -H 'content-type: application/json' "$@"
       }
       code=$(send -H "Authorization: Bearer $AGENTGATEWAY_API_KEY" -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Say hello"}]}')
       [ "$code" = 200 ] || { echo "FAIL: the virtual key should be accepted, got $code"; cat /tmp/doc-test-opencode-agw.log; exit 1; }
       sleep 1
       grep -q 'gen_ai.request.model=gpt-4o-mini' /tmp/doc-test-opencode-agw.log \
         || { echo "FAIL: the request is not in the agentgateway log"; cat /tmp/doc-test-opencode-agw.log; exit 1; }
       code=$(send -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Say hello"}]}')
       [ "$code" = 401 ] || { echo "FAIL: a missing key should get 401, got $code"; exit 1; }
       code=$(send -H "Authorization: Bearer vk-unknown" -d '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Say hello"}]}')
       [ "$code" = 401 ] || { echo "FAIL: an unknown key should get 401, got $code"; exit 1; }
       code=$(send -H "Authorization: Bearer $AGENTGATEWAY_API_KEY" -d '{"model": "gpt-4o", "messages": [{"role": "user", "content": "Say hello"}]}')
       case "$code" in 4??) ;; *) echo "FAIL: an unlisted model should be rejected, got $code"; exit 1 ;; esac
       echo "ok: virtual key accepted, missing/unknown keys get 401, unlisted model rejected ($code)"
       stop_agw
       {{< /doc-test >}}
