    YAMLTest -f - <<'EOF'
    - name: a request with an Authorization header also returns a completion
      retries: 3
      http:
        url: "http://localhost:3000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
          authorization: Bearer YOUR_API_KEY
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    stop_agw
    {{< /doc-test >}}
