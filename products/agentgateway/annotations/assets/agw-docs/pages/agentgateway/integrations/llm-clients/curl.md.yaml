  content: |-
    {{< doc-test paths="llm-client-curl" >}}
    YAMLTest -f - <<'EOF'
    - name: the documented request returns a chat completion through port 3000
      retries: 3
      http:
        url: "http://localhost:3000"
        path: /v1/chat/completions
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello, how are you?"}]}
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.model"
            comparator: equals
            value: gpt-4o-mini
          - path: "$.choices[0].message.role"
            comparator: equals
            value: assistant
    EOF
    {{< /doc-test >}}
