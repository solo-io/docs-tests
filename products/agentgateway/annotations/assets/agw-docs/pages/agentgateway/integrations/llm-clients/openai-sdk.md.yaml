       {{< doc-test paths="llm-client-openai-sdk" >}}
       mkdir -p "$SDK_DIR/node" && cd "$SDK_DIR/node"
       npm init -y >/dev/null
       npm install --silent openai
       cat > client.mjs <<'JS'
       import OpenAI from "openai";

       const client = new OpenAI({
         baseURL: "http://localhost:3000/v1",
         apiKey: "anything",
       });

       const response = await client.chat.completions.create({
         model: "gpt-4o-mini",
         messages: [{ role: "user", content: "Hello!" }],
       });
       console.log(response.choices[0].message.content);
       JS
       out=$(node client.mjs)
       cd - >/dev/null
       [ "$out" = "mock completion" ] || { echo "FAIL: Node.js SDK printed: $out"; exit 1; }
       echo "ok: the Node.js SDK script got a completion through agentgateway"
       stop_agw
