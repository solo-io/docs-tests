  content: |-
    {{< doc-test paths="llm-client-openai-sdk" >}}
    # The exports above set OPENAI_BASE_URL; the client takes no arguments.
    cat > "$SDK_DIR/client_env.py" <<'PY'
    from openai import OpenAI

    client = OpenAI()  # picks up OPENAI_BASE_URL and OPENAI_API_KEY from env
    response = client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": "Hello!"}],
    )
    print(response.choices[0].message.content)
    PY
    out=$("$SDK_DIR/venv/bin/python" "$SDK_DIR/client_env.py")
    [ "$out" = "mock completion" ] || { echo "FAIL: env-configured client printed: $out"; exit 1; }
    echo "ok: OpenAI() picks up OPENAI_BASE_URL and reaches agentgateway"
    {{< /doc-test >}}
