       {{< doc-test paths="llm-client-openai-sdk" >}}
       SDK_DIR="${TMPDIR:-/tmp}/doc-test-openai-sdk"
       rm -rf "$SDK_DIR" && mkdir -p "$SDK_DIR"
       python3 -m venv "$SDK_DIR/venv"
       "$SDK_DIR/venv/bin/pip" install -q openai
       cat > "$SDK_DIR/client.py" <<'PY'
       from openai import OpenAI

       client = OpenAI(
           base_url="http://localhost:3000/v1",
           api_key="anything",  # placeholder if gateway has no auth
       )

       response = client.chat.completions.create(
           model="gpt-4o-mini",
           messages=[{"role": "user", "content": "Hello!"}],
       )
       print(response.choices[0].message.content)
       PY
       out=$("$SDK_DIR/venv/bin/python" "$SDK_DIR/client.py")
       [ "$out" = "mock completion" ] || { echo "FAIL: Python SDK printed: $out"; exit 1; }
       echo "ok: the Python SDK script got a completion through agentgateway"
       {{< /doc-test >}}
