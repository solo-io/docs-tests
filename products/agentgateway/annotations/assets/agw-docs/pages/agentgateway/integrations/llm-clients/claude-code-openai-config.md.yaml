  content: |2-
       {{< doc-test paths="claude-code" >}}
       # WHAT THIS TEST VALIDATES (all three configurations run against a local recording mock on
       # port 8000, the baseUrl of the OpenAI-compatible example):
       #   * OpenAI-compatible backend: the configuration runs as written. A Messages request like the
       #     ones Claude Code sends to ANTHROPIC_BASE_URL is converted to Chat Completions, reaches
       #     /v1/chat/completions with the pinned `Qwen/Qwen3-32B` model and the configured key, and
       #     the answer comes back in the Messages format.
       #   * Anthropic backend: the request passes through to /v1/messages with the client's model and
       #     the ANTHROPIC_API_KEY value as x-api-key.
       #   * Claude Teams or Pro: the gateway listens on port 4001, and with no provider key it
       #     forwards the client's own Authorization header (the subscription OAuth token).
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The Claude Code CLI (`claude -p`) - an interactive client that is not installed in CI, and
       #     that would need a real Anthropic credential. The test sends the same Messages API request.
       #   * The UI tabs - GUI-only.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       {{< /doc-test >}}
