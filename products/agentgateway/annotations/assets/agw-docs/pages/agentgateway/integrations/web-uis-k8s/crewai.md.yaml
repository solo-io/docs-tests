          kind: HTTPRoute
          metadata:
            namespace: agentgateway-system
            name: crewai
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
