       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Get the gateway URL": the LoadBalancer command sets INGRESS_GW_ADDRESS.
       #   * The request that Devin Desktop sends when configured as above, with
       #     http://<INGRESS_GW_ADDRESS>/<route-path> filled in as http://${INGRESS_GW_ADDRESS}/openai
       #     (the /openai route that the OpenAI provider guide creates): Devin Desktop sends
       #     OpenAI-style chat completions to `<URL>/chat/completions`. It returns 200 and a chat
       #     completion for the requested model.
       #   * "Verify the connection": the request reaches the agentgateway backend, shown by an
       #     agentgateway-proxy log entry for http.path=/openai/chat/completions with http.status=200.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Devin Desktop itself - it is a GUI app that cannot run in CI, so this test emulates the
       #     request it sends. The settings steps above are UI-only.
       #   * Whether Devin Desktop's Http: Proxy setting sends requests in this form. In VS
       #     Code-based editors, Http: Proxy is a forward-proxy setting (CONNECT), so this
       #     check follows what the page says rather than a recorded Devin Desktop request.
       #   * A real OpenAI completion - openai-setup points the backend at the httpbun mock LLM.
       #   * The port-forward tab - doc tests reach the gateway through the LoadBalancer.
       [ -n "${INGRESS_GW_ADDRESS:-}" ] || { echo "FAIL: INGRESS_GW_ADDRESS is empty"; exit 1; }
       # Emulates Devin Desktop's request, because Devin Desktop is a GUI app.
       YAMLTest -f - <<'EOF'
       - name: the request Devin Desktop sends returns a chat completion
         retries: 5
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai/chat/completions"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4o", "messages": [{"role": "user", "content": "Hello from Devin Desktop"}], "stream": false}
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.object"
               comparator: equals
               value: chat.completion
             - path: "$.model"
               comparator: equals
               value: gpt-4o
             - path: "$.choices[0].message.role"
               comparator: equals
               value: assistant
       EOF
       # "Verify the connection": the request went through the agentgateway backend.
       PROXY_LOG="${TMPDIR:-/tmp}/doc-test-llm-client-devin-proxy.log"
       found=""
       for _ in $(seq 1 15); do
         kubectl logs deployment/agentgateway-proxy -n {{< reuse "agw-docs/snippets/namespace.md" >}} --since=5m > "$PROXY_LOG" 2>/dev/null || true
         if awk '/http.path=\/openai\/chat\/completions/ && /http.status=200/ {f=1} END {exit !f}' "$PROXY_LOG"; then found=yes; break; fi
         sleep 2
       done
       [ -n "$found" ] || { echo "FAIL: no http.path=/openai/chat/completions entry with http.status=200 in the proxy logs"; tail -n 20 "$PROXY_LOG"; exit 1; }
       echo "ok: the request is in the agentgateway-proxy logs with http.status=200"
       rm -f "$PROXY_LOG" "${STREAM_OUT:-}"
       {{< /doc-test >}}
