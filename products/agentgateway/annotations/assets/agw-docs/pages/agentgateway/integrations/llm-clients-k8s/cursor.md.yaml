       {{< doc-test paths="llm-client-cursor" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Get the gateway URL": the LoadBalancer command sets INGRESS_GW_ADDRESS.
       #   * The request that Cursor sends when configured as above, with the documented base
       #     URL http://<INGRESS_GW_ADDRESS>/v1, through the route from the OpenAI guide's
       #     "OpenAI v1/chat/completions" tab (restated below as openai-v1): with Override
       #     OpenAI Base URL set, Cursor posts to `<base URL>/chat/completions`, with no
       #     provider API key (the page says to toggle API key overrides off). It returns 200
       #     and a chat completion for the requested model.
       #   * "Verify the connection": the request reaches the agentgateway backend as a
       #     parsed chat completion, shown by an agentgateway-proxy log entry for
       #     http.path=/v1/chat/completions with http.status=200, gen_ai.operation.name=chat,
       #     and gen_ai.request.model=gpt-4o. A request on a path agentgateway does not
       #     recognize is passed through and logs no gen_ai fields.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Cursor itself - it is a GUI app that cannot run in CI, so this test emulates the
       #     request it sends. The settings steps above are done in the app.
       #   * Cursor's `<base URL>/models` lookup - openai-setup pins every upstream request
       #     to the mock's chat completions endpoint, so a model list cannot be checked here.
       #   * A real OpenAI completion - openai-setup points the backend at the httpbun mock LLM.
       #   * The port-forward tab - doc tests reach the gateway through the LoadBalancer.
       [ -n "${INGRESS_GW_ADDRESS:-}" ] || { echo "FAIL: INGRESS_GW_ADDRESS is empty"; exit 1; }
       # Test-only setup: openai-setup creates only the OpenAI guide's "Custom route" tab
       # (/openai, rewritten to /v1/chat/completions). This page needs the guide's default
       # "OpenAI v1/chat/completions" tab route (no path match, forwards every path), restated
       # here under its own name so the openai route stays in place. Removed at the end.
       kubectl apply -f- <<EOF
       apiVersion: gateway.networking.k8s.io/v1
       kind: HTTPRoute
       metadata:
         name: openai-v1
         namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
       spec:
         parentRefs:
           - name: agentgateway-proxy
             namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
         rules:
           - backendRefs:
             - name: openai
               namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
               group: {{< reuse "agw-docs/snippets/group.md" >}}
               kind: {{< reuse "agw-docs/snippets/backend.md" >}}
       EOF
       # Wait until the new route serves /v1/chat/completions.
       code=""
       for _ in $(seq 1 30); do
         code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "http://${INGRESS_GW_ADDRESS}/v1/chat/completions" \
           -H 'content-type: application/json' \
           -d '{"model": "gpt-4o", "messages": [{"role": "user", "content": "route check"}]}' || true)
         [ "$code" = 200 ] && break
         sleep 2
       done
       [ "$code" = 200 ] || { echo "FAIL: /v1/chat/completions returned $code through the openai-v1 route"; exit 1; }
       # Emulates Cursor's request, because Cursor is a GUI app.
       YAMLTest -f - <<'EOF'
       - name: the request Cursor sends returns a chat completion
         retries: 5
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/v1/chat/completions"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4o", "messages": [{"role": "user", "content": "Hello from Cursor"}], "stream": false}
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.object"
               comparator: equals
               value: chat.completion
             - path: "$.model"
               comparator: equals
               value: gpt-4o
             - path: "$.choices[0].message.role"
               comparator: equals
               value: assistant
       EOF
       # Cursor streams chat replies, so the same request with stream: true must come back
       # as server-sent chat.completion.chunk events that end with [DONE].
       STREAM_OUT="${TMPDIR:-/tmp}/doc-test-llm-client-cursor-stream.txt"
       curl -s -N -m 30 "http://${INGRESS_GW_ADDRESS}/v1/chat/completions" \
         -H 'content-type: application/json' \
         -d '{"model": "gpt-4o", "messages": [{"role": "user", "content": "Hello from Cursor"}], "stream": true}' \
         > "$STREAM_OUT" || true
       grep -q 'chat.completion.chunk' "$STREAM_OUT" \
         || { echo "FAIL: the streamed reply has no chat.completion.chunk events"; head -20 "$STREAM_OUT"; exit 1; }
       grep -q '\[DONE\]' "$STREAM_OUT" \
         || { echo "FAIL: the streamed reply does not end with [DONE]"; tail -5 "$STREAM_OUT"; exit 1; }
       echo "ok: the streamed reply is chat.completion.chunk events ending with [DONE]"
       # "Verify the connection": the request went through the agentgateway backend.
       # The logs are saved to a file before they are searched.
       PROXY_LOG="${TMPDIR:-/tmp}/doc-test-llm-client-cursor-proxy.log"
       found=""
       for _ in $(seq 1 15); do
         kubectl logs deployment/agentgateway-proxy -n {{< reuse "agw-docs/snippets/namespace.md" >}} --since=5m > "$PROXY_LOG" 2>/dev/null || true
         if awk '/http.path=\/v1\/chat\/completions( |$)/ && /http.status=200( |$)/ && /gen_ai.operation.name=chat( |$)/ && /gen_ai.request.model=gpt-4o( |$)/ {f=1} END {exit !f}' "$PROXY_LOG"; then found=yes; break; fi
         sleep 2
       done
       [ -n "$found" ] || { echo "FAIL: no http.path=/v1/chat/completions entry with http.status=200, gen_ai.operation.name=chat, and gen_ai.request.model=gpt-4o in the proxy logs"; tail -n 20 "$PROXY_LOG"; exit 1; }
       echo "ok: the request is in the agentgateway-proxy logs as documented"
       rm -f "$PROXY_LOG" "${STREAM_OUT:-}"
       kubectl delete httproute openai-v1 -n {{< reuse "agw-docs/snippets/namespace.md" >}} --ignore-not-found
       {{< /doc-test >}}
