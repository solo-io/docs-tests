  content: |-
    {{< doc-test paths="llm-client-codex" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Set the gateway URL": AGENTGATEWAY_BASE_URL is the gateway address with /v1.
    #   * "CLI override": the Codex CLI, installed into a temporary directory with
    #     CODEX_HOME in another temporary directory, runs `codex exec` with the page's -c
    #     overrides plus the documented env_key field and a prompt, and prints the mock
    #     LLM's reply that came back through agentgateway.
    #   * "Verify the CLI connection": the documented log command finds the request, and
    #     an entry has http.path=/v1/responses and http.status=200.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The Profile tab and the ChatGPT desktop app section - both write ~/.codex on the
    #     runner, and the app is a GUI.
    #   * A real OpenAI completion - openai-setup points the backend at the httpbun mock.
    # Test-only setup for two gaps between the shared openai-setup prerequisite and this page:
    #   1. openai-setup creates only the OpenAI guide's "Custom route" tab (/openai). Codex
    #      calls /v1/responses, which the guide's default "OpenAI v1/chat/completions" tab
    #      route (no path match) serves, so that route is restated here under its own name.
    #   2. openai-setup pins the mock's path to /llm/chat/completions for every request.
    #      Codex speaks the Responses API, which httpbun serves at /llm/v1/responses, so the
    #      backend path is switched for this test and switched back at the end.
    INGRESS_GW_ADDRESS="${INGRESS_GW_ADDRESS:-$(kubectl get svc -n {{< reuse "agw-docs/snippets/namespace.md" >}} agentgateway-proxy -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")}"
    [ -n "$INGRESS_GW_ADDRESS" ] || { echo "FAIL: INGRESS_GW_ADDRESS is empty"; exit 1; }
    export INGRESS_GW_ADDRESS
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: codex-openai-v1
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      parentRefs:
        - name: agentgateway-proxy
          namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
      rules:
        - backendRefs:
          - name: openai
            namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
            group: {{< reuse "agw-docs/snippets/group.md" >}}
            kind: {{< reuse "agw-docs/snippets/backend.md" >}}
    EOF
    kubectl patch {{< reuse "agw-docs/snippets/backend.md" >}} openai -n {{< reuse "agw-docs/snippets/namespace.md" >}} --type=merge \
      -p '{"spec":{"ai":{"provider":{"path":"/llm/v1/responses"}}}}'
    # Wait until a Responses API request along /v1/responses comes back as a response object.
    CODEX_PROBE="${TMPDIR:-/tmp}/doc-test-codex-probe.json"
    code=""
    for _ in $(seq 1 30); do
      code=$(curl -s -o "$CODEX_PROBE" -w '%{http_code}' -m 15 "http://${INGRESS_GW_ADDRESS}/v1/responses" \
        -H 'content-type: application/json' \
        -d '{"model": "gpt-5-codex", "input": [{"role": "user", "content": [{"type": "input_text", "text": "Hello"}]}]}' || true)
      [ "$code" = 200 ] && break
      sleep 2
    done
    [ "$code" = 200 ] || { echo "FAIL: /v1/responses returned $code"; cat "$CODEX_PROBE" 2>/dev/null || true; exit 1; }
    jq -e '.object == "response" and .output[0].content[0].type == "output_text"' "$CODEX_PROBE" >/dev/null \
      || { echo "FAIL: /v1/responses did not return a Responses API object"; cat "$CODEX_PROBE"; exit 1; }
    echo "ok: /v1/responses answers through the gateway"
    {{< /doc-test >}}
