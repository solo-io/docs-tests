  content: |-
    {{< doc-test paths="llm-client-codex" >}}
    # The CLI override above starts an interactive session. Run the same -c overrides
    # non-interactively with `codex exec` and a prompt, plus the documented env_key field.
    # Codex is installed into a temporary directory and CODEX_HOME points at another, so
    # nothing is written to ~/.codex. The two retry settings only make a failure fail fast.
    CODEX_TMP="${TMPDIR:-/tmp}/doc-test-codex"
    rm -rf "$CODEX_TMP" && mkdir -p "$CODEX_TMP/home" "$CODEX_TMP/work"
    npm install --silent --prefix "$CODEX_TMP" "@openai/codex@${CODEX_VERSION:-latest}"
    "$CODEX_TMP/node_modules/.bin/codex" --version
    # Count the matching log entries before Codex runs, so the checks below see Codex's own
    # request rather than the readiness probe's.
    CODEX_LOG="${TMPDIR:-/tmp}/doc-test-codex-proxy.log"
    kubectl logs deployment/agentgateway-proxy -n {{< reuse "agw-docs/snippets/namespace.md" >}} --since=10m > "$CODEX_LOG" 2>/dev/null || true
    CODEX_BEFORE=$(awk '/http.path=\/v1\/responses/ && /http.status=200/ {n++} END {print n+0}' "$CODEX_LOG")
    TO=""
    if command -v timeout >/dev/null 2>&1; then TO="timeout 300"; fi
    if ! (cd "$CODEX_TMP/work" && CODEX_HOME="$CODEX_TMP/home" $TO "$CODEX_TMP/node_modules/.bin/codex" exec \
        --skip-git-repo-check --ephemeral --color never -s read-only \
        -o "$CODEX_TMP/last-message.txt" \
        -c 'model_provider="agentgateway"' \
        -c 'model_providers.agentgateway.name="OpenAI via agentgateway"' \
        -c "model_providers.agentgateway.base_url=\"${AGENTGATEWAY_BASE_URL}\"" \
        -c 'model_providers.agentgateway.wire_api="responses"' \
        -c 'model_providers.agentgateway.env_key="AGENTGATEWAY_API_KEY"' \
        -c 'model_providers.agentgateway.request_max_retries=1' \
        -c 'model_providers.agentgateway.stream_max_retries=1' \
        "Hello" < /dev/null > "$CODEX_TMP/exec.log" 2>&1); then
      echo "FAIL: codex exec failed"; cat "$CODEX_TMP/exec.log"; exit 1
    fi
    grep -q 'httpbun' "$CODEX_TMP/last-message.txt" \
      || { echo "FAIL: Codex did not print the mock LLM reply"; cat "$CODEX_TMP/exec.log"; exit 1; }
    echo "ok: codex exec got the mock LLM reply through agentgateway"
    # Wait for Codex's access log entry, so the page's log command below finds it.
    found=""
    for _ in $(seq 1 15); do
      kubectl logs deployment/agentgateway-proxy -n {{< reuse "agw-docs/snippets/namespace.md" >}} --since=10m > "$CODEX_LOG" 2>/dev/null || true
      if [ "$(awk '/http.path=\/v1\/responses/ && /http.status=200/ {n++} END {print n+0}' "$CODEX_LOG")" -gt "$CODEX_BEFORE" ]; then found=yes; break; fi
      sleep 2
    done
    [ -n "$found" ] || { echo "FAIL: no new http.path=/v1/responses entry with http.status=200 from Codex"; tail -n 20 "$CODEX_LOG"; exit 1; }
    {{< /doc-test >}}
