  content: |-
    {{< doc-test paths="llm-client-cursor" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * The Config file tab's config is accepted, and serves LLM traffic on port 3000
    #     (run against a local mock LLM instead of OpenAI).
    #   * The request that Cursor sends when configured as the page says: with Override
    #     OpenAI Base URL set to http://localhost:3000/v1, Cursor posts to `<base
    #     URL>/chat/completions` (http://localhost:3000/v1/chat/completions), with no
    #     provider API key. It returns 200 and a chat completion for the requested
    #     model.
    #   * "Verify the connection": the request reaches agentgateway as a parsed chat
    #     completion, shown by an agentgateway log entry for that path with
    #     http.status=200 and gen_ai.operation.name=chat. A request on a path agentgateway
    #     does not recognize is passed through and logs no gen_ai fields.
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * Cursor itself - it is a GUI app that cannot run in CI, so this test emulates
    #     the request it sends. The settings steps are UI-only.
    #   * Cursor's `<base URL>/models` lookup - Cursor's use of it is not documented on
    #     the page.
    #   * Streaming replies - the local mock LLM does not stream.
    #   * The UI tab - browser-only steps.
    {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
    {{< reuse "agw-docs/snippets/start-mock-llm.md" >}}
    # Placeholder key: the mock LLM ignores it and no real provider is called.
    export OPENAI_API_KEY="${OPENAI_API_KEY:-test}"
    AGW_PID=""
    MOCK_LLM_PID="${MOCK_LLM_PID:-}"
    trap 'kill ${AGW_PID:-} ${MOCK_LLM_PID:-} 2>/dev/null || true' EXIT
    AGW_LOG=/tmp/doc-test-cursor-agw.log
    # Run agentgateway in the background and wait for its readiness endpoint.
    start_agw() {
      agentgateway -f "$1" > "$AGW_LOG" 2>&1 &
      AGW_PID=$!
      for _ in $(seq 1 30); do
        curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && return 0
        kill -0 "$AGW_PID" 2>/dev/null || break
        sleep 1
      done
      echo "agentgateway did not become ready on $1"; cat "$AGW_LOG"; return 1
    }
    stop_agw() {
      kill "${AGW_PID:-}" 2>/dev/null || true
      wait "${AGW_PID:-}" 2>/dev/null || true
      AGW_PID=""
    }
    # Point every OpenAI model in a config at the local mock LLM by adding a baseUrl
    # after each apiKey line; works whether or not the heredoc expanded the key.
    to_mock() {
      python3 - "$1" "$2" <<'PY'
    import pathlib, re, sys
    src = pathlib.Path(sys.argv[1]).read_text()
    out, n = re.subn(r'^(\s*)apiKey: .*$', lambda m: m.group(0) + "\n" + m.group(1) + "baseUrl: http://localhost:3091", src, flags=re.M)
    if not n:
        sys.exit("no apiKey line in " + sys.argv[1])
    pathlib.Path(sys.argv[2]).write_text(out)
    PY
    }
    # The Config file tab's agentgateway config (shown without a heredoc), restated.
    cat <<'EOF' > cursor-config.yaml
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    llm:
      port: 3000
      models:
      - name: "*"
        provider: openAI
        params:
          apiKey: "$OPENAI_API_KEY"
    EOF
    agentgateway -f cursor-config.yaml --validate-only
    to_mock cursor-config.yaml cursor-config-mock.yaml
    start_agw cursor-config-mock.yaml
    {{< /doc-test >}}
- after:
