  content: |2-
       {{< doc-test paths="llm-client-cursor" >}}
       # Emulates the request that Cursor sends with the setting above, because Cursor is
       # a GUI app that cannot run in CI.
       YAMLTest -f - <<'EOF'
       - name: the request Cursor sends returns a chat completion through port 3000
         retries: 3
         http:
           url: "http://localhost:3000"
           path: /v1/chat/completions
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4o", "messages": [{"role": "user", "content": "Hello from Cursor"}]}
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.object"
               comparator: equals
               value: chat.completion
             - path: "$.model"
               comparator: equals
               value: gpt-4o
             - path: "$.choices[0].message.role"
               comparator: equals
               value: assistant
       EOF
       # "Verify the connection": the request went through agentgateway as a chat completion.
       # AGW_LOG is the file agentgateway writes its log to.
       found=""
       for _ in $(seq 1 10); do
         if awk '/http.path=\/v1\/chat\/completions( |$)/ && /http.status=200( |$)/ && /gen_ai.operation.name=chat( |$)/ {f=1} END {exit !f}' "$AGW_LOG"; then found=yes; break; fi
         sleep 1
       done
       [ -n "$found" ] || { echo "FAIL: no http.path=/v1/chat/completions entry with http.status=200 and gen_ai.operation.name=chat in the agentgateway log"; tail -n 20 "$AGW_LOG"; exit 1; }
       echo "ok: the agentgateway log shows the /v1/chat/completions request with http.status=200 and gen_ai.operation.name=chat"
       stop_agw
       rm -f cursor-config.yaml cursor-config-mock.yaml
       {{< /doc-test >}}
