    preview: cat <<EOF > devin-proxy.yaml
  content: |2-
       {{< doc-test paths="devin-egress" >}}
       # The page starts agentgateway in the foreground; start it in the background instead.
       agentgateway -f devin-proxy.yaml --validate-only
       agentgateway -f devin-proxy.yaml > /tmp/doc-test-devin-agw.log 2>&1 &
       AGW_PID=$!
       trap 'kill "$AGW_PID" 2>/dev/null || true' EXIT
       for _ in $(seq 1 30); do
         curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready && break
         sleep 1
       done
       curl -sf -o /dev/null -m 2 http://localhost:15021/healthz/ready \
         || { echo "agentgateway did not become ready"; cat /tmp/doc-test-devin-agw.log; exit 1; }
       # Step 4: a request without credentials is challenged with 407. curl exits 56 when the
       # proxy refuses the tunnel, so the page's command is run here with `|| true`.
       out=$(curl --verbose --proxy http://127.0.0.1:3000 --head https://example.com/ 2>&1 || true)
       grep -q '< HTTP/1.1 407' <<<"$out" || { echo "FAIL: expected 407 without credentials"; echo "$out"; exit 1; }
       grep -qi '< proxy-authenticate: Basic realm="agentgateway-egress"' <<<"$out" \
         || { echo "FAIL: expected the Basic realm challenge"; echo "$out"; exit 1; }
       {{< /doc-test >}}
