  content: |2-
       {{< doc-test paths="claude-code" >}}
       send_messages() {
         local url=$1; shift
         curl -s -o claude-code-resp.json -w '%{http_code}' "$url/v1/messages" \
           -H 'content-type: application/json' -H 'anthropic-version: 2023-06-01' "$@" \
           -d '{"model": "claude-sonnet-4-5", "max_tokens": 64, "messages": [{"role": "user", "content": "Hello"}]}'
       }
       export ANTHROPIC_BASE_URL="http://localhost:4000"
       CODE=$(send_messages "$ANTHROPIC_BASE_URL" -H 'x-api-key: client-placeholder')
       [ "$CODE" = "200" ] || { echo "FAIL: Messages request returned $CODE"; cat claude-code-resp.json; exit 1; }
       python3 - <<'PY'
       import json
       r = json.load(open("claude-code-resp.json"))
       assert r.get("type") == "message" and r["content"][0]["text"] == "mock completion", r
       up = json.load(open("/tmp/doc-test-claude-code-last.json"))
       assert up["path"] == "/v1/chat/completions", up["path"]
       assert up["body"]["model"] == "Qwen/Qwen3-32B", up["body"].get("model")
       assert up["headers"].get("authorization") == "Bearer mock-key", up["headers"].get("authorization")
       print("ok: Messages converted to Chat Completions for Qwen/Qwen3-32B, answer returned as a message")
       PY
       stop_agw
       {{< /doc-test >}}
