       python3 - <<'PY'
       src = open("config.yaml").read()
       assert "  provider: anthropic\n" in src
       open("claude-code-teams-mock.yaml", "w").write(
           src.replace("  provider: anthropic\n", "  provider: anthropic\n    params:\n      baseUrl: http://127.0.0.1:8000\n"))
       PY
       agentgateway -f config.yaml --validate-only
       start_agw claude-code-teams-mock.yaml claude-code-teams http://localhost:4001/
       CODE=$(send_messages "${ANTHROPIC_BASE_URL%/}" -H 'authorization: Bearer sk-ant-oat-doc-test')
       [ "$CODE" = "200" ] || { echo "FAIL: Messages request on port 4001 returned $CODE"; cat claude-code-resp.json; exit 1; }
       python3 - <<'PY'
       import json
       up = json.load(open("/tmp/doc-test-claude-code-last.json"))
       assert up["path"] == "/v1/messages", up["path"]
       assert up["headers"].get("authorization") == "Bearer sk-ant-oat-doc-test", up["headers"]
       print("ok: port 4001 serves the Teams config and forwards the client's OAuth token")
       PY
       stop_agw
