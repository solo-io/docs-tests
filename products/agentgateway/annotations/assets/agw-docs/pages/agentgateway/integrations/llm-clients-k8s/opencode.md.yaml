  content: |2-
       {{< doc-test paths="llm-client-opencode" >}}
       [ "$AGENTGATEWAY_BASE_URL" = "http://${INGRESS_GW_ADDRESS}/v1" ] \
         || { echo "FAIL: AGENTGATEWAY_BASE_URL is '$AGENTGATEWAY_BASE_URL'"; exit 1; }
       jq -e '.provider.agentgateway.options.baseURL == "{env:AGENTGATEWAY_BASE_URL}"
         and .provider.agentgateway.options.apiKey == "{env:AGENTGATEWAY_API_KEY}"
         and .provider.agentgateway.npm == "@ai-sdk/openai-compatible"
         and .provider.agentgateway.models["gpt-4o-mini"] != null
         and .model == "agentgateway/gpt-4o-mini"' opencode.json >/dev/null \
         || { echo "FAIL: opencode.json does not match the guide"; cat opencode.json; exit 1; }
       # What OpenCode sends: a chat completion for gpt-4o-mini with the virtual key as a
       # bearer token. Sent to /openai, the openai-setup route (see the note at the top).
       send() {
         curl -s -o /dev/null -w '%{http_code}' -m 15 "http://${INGRESS_GW_ADDRESS}/openai" \
           -H 'content-type: application/json' "$@" || true
       }
       BODY='{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Say hello"}]}'
       code=""
       for _ in $(seq 1 30); do
         code=$(send -H "Authorization: Bearer $AGENTGATEWAY_API_KEY" -d "$BODY")
         [ "$code" = 200 ] && break
         sleep 2
       done
       [ "$code" = 200 ] || { echo "FAIL: the virtual key should be accepted, got $code"; exit 1; }
       code=$(send -d "$BODY")
       [ "$code" = 401 ] || { echo "FAIL: a missing key should get 401, got $code"; exit 1; }
       code=$(send -H "Authorization: Bearer vk-unknown" -d "$BODY")
       [ "$code" = 401 ] || { echo "FAIL: an unknown key should get 401, got $code"; exit 1; }
       echo "ok: virtual key accepted, missing and unknown keys get 401"
       {{< /doc-test >}}
