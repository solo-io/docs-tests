       {{< doc-test paths="llm-client-opencode" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Before you begin" step 3, restated: virtual key authentication on the Gateway
       #     (the vk-alice-4f9c2a key, stored as a SHA-256 hash as in the virtual keys guide).
       #   * AGENTGATEWAY_BASE_URL is the gateway address with the /v1 suffix, and
       #     opencode.json reads the base URL and key from those variables and lists the
       #     model it requests.
       #   * The virtual key: a request with `Authorization: Bearer $AGENTGATEWAY_API_KEY`
       #     for gpt-4o-mini succeeds; a missing or unknown key gets 401.
       #   * The proxy-log check: the request appears in the agentgateway-proxy logs with
       #     http.status=200.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * OpenCode itself (`opencode`, `opencode run`) - an interactive client that is
       #     not installed in CI. The requests below send what OpenCode sends.
       #   * The /v1/chat/completions route path. The guide uses the OpenAI provider
       #     guide's v1/chat/completions route; the shared openai-setup prerequisite
       #     (which points the backend at the httpbun mock LLM) leaves the route on the
       #     /openai path instead, so the requests and the log check use /openai.
       #   * The exact 401 error text - it differs between versions.
       kubectl apply -f- <<EOF
       apiVersion: v1
       kind: ConfigMap
       metadata:
         name: llm-api-keys
         namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
         labels:
           agentgateway.dev/apikey: "true"
       data:
         alice: |
           {
             "keyHash": "sha256:84d589f2439e4d9ff4438aa840e63ffcbf231a87e7fef929f975d2bde03dc78c",
             "metadata": {
               "user_id": "alice"
             }
           }
       EOF
       kubectl apply -f- <<EOF
       apiVersion: {{< reuse "agw-docs/snippets/api-version.md" >}}
       kind: {{< reuse "agw-docs/snippets/policy.md" >}}
       metadata:
         name: api-key-auth
         namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
       spec:
         targetRefs:
           - group: gateway.networking.k8s.io
             kind: Gateway
             name: agentgateway-proxy
         traffic:
           apiKeyAuthentication:
             mode: Strict
             configMapSelector:
               matchLabels:
                 agentgateway.dev/apikey: "true"
       EOF
       YAMLTest -f - <<'EOF'
       - name: wait for the api-key-auth policy to be accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
               name: api-key-auth
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
