       {{< doc-test paths="llm-client-opencode" >}}
       # The log check above, restated for the /openai route path (see the note at the top).
       found=""
       for _ in $(seq 1 15); do
         logs=$(kubectl logs deployment/agentgateway-proxy -n {{< reuse "agw-docs/snippets/namespace.md" >}} --since=5m 2>/dev/null || true)
         if grep -q 'http.path=/openai.*http.status=200' <<<"$logs"; then found=yes; break; fi
         sleep 2
       done
       [ -n "$found" ] || { echo "FAIL: no http.path=/openai entry with http.status=200 in the proxy logs"; tail -n 20 <<<"$logs"; exit 1; }
       echo "ok: the request is in the agentgateway-proxy logs with http.status=200"
       # Cleanup: remove the virtual key authentication this test added, so later guides
       # on the same Gateway are not asked for a key.
       kubectl delete {{< reuse "agw-docs/snippets/policy.md" >}} api-key-auth -n {{< reuse "agw-docs/snippets/namespace.md" >}} --ignore-not-found
       kubectl delete configmap llm-api-keys -n {{< reuse "agw-docs/snippets/namespace.md" >}} --ignore-not-found
       rm -f opencode.json
       {{< /doc-test >}}
