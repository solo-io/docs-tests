  content: |-
    {{< doc-test paths="llm-client-curl" >}}
    # The page's requests use a `<route-path>` placeholder. The openai-setup prerequisite
    # creates the HTTPRoute with the /openai path (pointed at the httpbun mock LLM), so the
    # request is restated here with /openai in place of <route-path>.
    STREAM_RESPONSE=$(curl -s -N -m 30 "http://${INGRESS_GW_ADDRESS}/openai" \
      -H "content-type: application/json" \
      -d '{
        "model": "gpt-4o-mini",
        "messages": [{"role": "user", "content": "Write a haiku about the cloud"}],
        "stream": true
      }' || true)
    grep -q "chat.completion.chunk" <<<"$STREAM_RESPONSE" \
      || { echo "FAIL: the streamed response has no chat.completion.chunk events"; echo "$STREAM_RESPONSE" | head -20; exit 1; }
    grep -q '\[DONE\]' <<<"$STREAM_RESPONSE" \
      || { echo "FAIL: the stream does not end with [DONE]"; exit 1; }
    echo "ok: the streamed response is SSE chunks ending with [DONE]"
    {{< /doc-test >}}
