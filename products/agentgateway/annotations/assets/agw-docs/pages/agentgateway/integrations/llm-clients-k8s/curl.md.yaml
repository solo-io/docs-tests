  content: |-
    {{< doc-test paths="llm-client-curl" >}}
    # ============================================================================
    # Doc test coverage for this guide (these comments are not rendered on the page)
    # ============================================================================
    # WHAT THIS TEST VALIDATES:
    #   * "Get the gateway URL": the LoadBalancer command sets INGRESS_GW_ADDRESS.
    #   * "Send a request": the documented request, sent to the /openai route that the
    #     OpenAI provider guide creates, returns a chat completion (200, the requested
    #     model, an assistant message, token usage).
    #   * "Authentication": the same request with an `Authorization: Bearer` header
    #     also returns 200.
    #   * "Streaming responses": `stream: true` returns SSE chunks that end with [DONE].
    # WHAT THIS TEST DOES NOT VALIDATE (and why):
    #   * The OpenAI provider itself - the openai-setup prerequisite points the
    #     backend at the httpbun mock LLM, so no provider key is needed.
    #   * The port-forward tab - doc tests reach the gateway through the LoadBalancer.
    # The page's requests use a `<route-path>` placeholder. The openai-setup prerequisite
    # creates the HTTPRoute with the /openai path (pointed at the httpbun mock LLM), so the
    # request is restated here with /openai in place of <route-path>.
    YAMLTest -f - <<'EOF'
    - name: the documented request returns a chat completion through the /openai route
      retries: 3
      http:
        url: "http://${INGRESS_GW_ADDRESS}:80/openai"
        method: POST
        headers:
          content-type: application/json
        body: |
          {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello from Kubernetes!"}]}
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.model"
            comparator: equals
            value: gpt-4o-mini
          - path: "$.choices[0].message.role"
            comparator: equals
            value: assistant
          - path: "$.usage.total_tokens"
            comparator: greaterThan
            value: 0
    EOF
    {{< /doc-test >}}
