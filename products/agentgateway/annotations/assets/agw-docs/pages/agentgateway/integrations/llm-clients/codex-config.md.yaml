  content: |2-
       {{< doc-test paths="codex" >}}
       # WHAT THIS TEST VALIDATES (against a local recording mock in place of api.openai.com):
       #   * The agentgateway configuration loads and runs.
       #   * The request that Codex sends with the documented provider settings (base_url
       #     http://localhost:4000/v1, wire_api "responses", env_key AGENTGATEWAY_API_KEY): a Responses
       #     API request succeeds, reaches the upstream /v1/responses path with the client's model (the
       #     `*` model forwards it), the upstream gets the OPENAI_API_KEY credential, and the request
       #     appears in the agentgateway log with http.path=/v1/responses and protocol=llm.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Codex itself (the CLI, profiles in ~/.codex, and the ChatGPT desktop app) - a client that
       #     is not installed in CI and that would write to the home directory. The test sends the
       #     same request that Codex sends.
       #   * The UI tab - GUI-only.
       {{< reuse "agw-docs/snippets/install-agentgateway-binary.md" >}}
       {{< /doc-test >}}
