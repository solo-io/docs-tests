       {{< doc-test paths="llm-client-openai-sdk" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "Get the gateway URL": the LoadBalancer command sets INGRESS_GW_ADDRESS.
       #   * The Python and Node.js scripts from the page, installed into a temporary
       #     directory, get a completion back through the gateway's /openai route.
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * `pip install openai` / `npm install openai` into the reader's project - the
       #     test installs into a throwaway directory instead of the runner's environment.
       #   * The OpenAI provider itself - the openai-setup prerequisite points the
       #     backend at the httpbun mock LLM.
       #   * The port-forward tab - doc tests reach the gateway through the LoadBalancer.
       # The page's requests use a `<route-path>` placeholder. The openai-setup prerequisite
       # creates the HTTPRoute with the /openai path (pointed at the httpbun mock LLM), so the
       # script is restated here with /openai in place of <route-path>.
       SDK_DIR="${TMPDIR:-/tmp}/doc-test-openai-sdk-k8s"
       rm -rf "$SDK_DIR" && mkdir -p "$SDK_DIR"
       python3 -m venv "$SDK_DIR/venv"
       "$SDK_DIR/venv/bin/pip" install -q openai
       cat > "$SDK_DIR/client.py" <<'PY'
       import os
       from openai import OpenAI

       gateway_address = os.environ["INGRESS_GW_ADDRESS"]

       client = OpenAI(
           base_url=f"http://{gateway_address}/openai",
           api_key="anything",  # placeholder if gateway has no auth
       )

       response = client.chat.completions.create(
           model="gpt-4o-mini",
           messages=[{"role": "user", "content": "Hello from Kubernetes!"}],
       )
       print(response.choices[0].message.content)
       PY
       out=$("$SDK_DIR/venv/bin/python" "$SDK_DIR/client.py")
       [ -n "$out" ] || { echo "FAIL: the Python SDK script printed no completion text"; exit 1; }
       echo "ok: the Python SDK script got a completion through the gateway: $out"
       {{< /doc-test >}}
