       {{< doc-test paths="llm-client-openai-sdk" >}}
       # The page's requests use a `<route-path>` placeholder. The openai-setup prerequisite
       # creates the HTTPRoute with the /openai path (pointed at the httpbun mock LLM), so the
       # script is restated here with /openai in place of <route-path>.
       mkdir -p "$SDK_DIR/node" && cd "$SDK_DIR/node"
       npm init -y >/dev/null
       npm install --silent openai
       cat > client.mjs <<'JS'
       import OpenAI from "openai";

       const gatewayAddress = process.env.INGRESS_GW_ADDRESS;

       const client = new OpenAI({
         baseURL: `http://${gatewayAddress}/openai`,
         apiKey: "anything",
       });

       const response = await client.chat.completions.create({
         model: "gpt-4o-mini",
         messages: [{ role: "user", content: "Hello from Kubernetes!" }],
       });
       console.log(response.choices[0].message.content);
       JS
       out=$(node client.mjs)
       cd - >/dev/null
       [ -n "$out" ] || { echo "FAIL: the Node.js SDK script printed no completion text"; exit 1; }
       echo "ok: the Node.js SDK script got a completion through the gateway: $out"
       {{< /doc-test >}}
