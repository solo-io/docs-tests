  content: |2-
       {{< doc-test paths="quickstart-llm-run" >}}
       # The catalog expands openai/* into the OpenAI models, with the prefix.
       curl -s "http://${INGRESS_GW_ADDRESS}/v1/models" | jq -e '[.data[].id] | index("openai/gpt-5-mini") != null' >/dev/null \
         || { echo "FAIL: /v1/models does not list openai/gpt-5-mini"; curl -s "http://${INGRESS_GW_ADDRESS}/v1/models"; exit 1; }
       {{< /doc-test >}}
