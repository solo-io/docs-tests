    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="llm-alias" >}}
       # The openai-setup prerequisite points the openai backend at the httpbun mock,
       # which echoes back the model it receives, so the response model shows the alias
       # was rewritten before the request left the gateway.
       YAMLTest -f - <<'EOF'
       - name: the openai backend with aliases is accepted in full
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: "Accepted"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       - name: the fast alias resolves to gpt-3.5-turbo
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "fast", "messages": [{"role": "user", "content": "Say hello in one word"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.model"
               comparator: equals
               value: "gpt-3.5-turbo"
       - name: the smart alias resolves to gpt-4-turbo
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "smart", "messages": [{"role": "user", "content": "Say hello in one word"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.model"
               comparator: equals
               value: "gpt-4-turbo"
       EOF
       {{< /doc-test >}}
