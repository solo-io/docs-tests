  content: |-
    {{< doc-test paths="gemini-inbound" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the google-native backend with the Gemini route types to be accepted
      wait:
        target:
          kind: AgentgatewayBackend
          metadata:
            namespace: agentgateway-system
            name: google-native
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: wait for the google-native HTTPRoute to resolve its backendRef
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: agentgateway-system
            name: google-native
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    EOF
    {{< /doc-test >}}
