    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="llm-api-keys-run" >}}
       # Every visible apply of the openai backend replaces its provider block, so point
       # it back at the httpbun mock LLM (deployed by the openai-setup prerequisite)
       # after each one.
       point_openai_at_mock() {
       kubectl patch {{< reuse "agw-docs/snippets/backend.md" >}} openai -n {{< reuse "agw-docs/snippets/namespace.md" >}} --type=merge --patch-file /dev/stdin <<EOF
       spec:
         ai:
           provider:
             host: httpbun.default.svc.cluster.local
             port: 3090
             path: /llm/chat/completions
       EOF
       }
       point_openai_at_mock
       YAMLTest -f - <<'EOF'
       - name: the inline-key openai backend is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       # Accepted=True also covers a partly translated backend (reason PartiallyValid),
       # which can silently drop its auth policy. The reason tells the two apart.
       - name: the inline-key openai backend translated in full, not partly
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: "Accepted"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       - name: a request through the inline-key backend returns a completion with token usage
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "{{< reuse "agw-docs/snippets/openai-model.md" >}}", "messages": [{"role": "user", "content": "Say hello in one word"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.usage.prompt_tokens"
               comparator: greaterThan
               value: 0
             - path: "$.usage.completion_tokens"
               comparator: greaterThan
               value: 0
       EOF
       {{< /doc-test >}}
