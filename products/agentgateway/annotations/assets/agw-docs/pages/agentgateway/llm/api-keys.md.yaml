  content: |2-
       {{< doc-test paths="llm-api-keys-run" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Each of the three ways to provide the key (inline, Secret, passthrough):
       #     the documented backend and HTTPRoute apply, the backend translates in full
       #     (reason Accepted, not PartiallyValid, which is what a dropped auth policy
       #     looks like), and a request along the documented /openai route returns an
       #     OpenAI-shaped completion with token usage.
       #   * "Rotate a provider key": the documented `kubectl create secret ... | kubectl
       #     apply` updates the Secret in place to the new key, and requests keep
       #     succeeding afterwards.
       #
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * That OpenAI accepts the key. Every backend is patched to the httpbun mock
       #     LLM after it is applied, so no request reaches OpenAI and no real key is
       #     needed. The mock does not check credentials.
       #   * The placeholder `export` steps (`<your-ai-provider-token>` and similar):
       #     they do not run as written, so the hidden steps set the variables instead.
       #
       # The visible export is a placeholder. Use the CI placeholder key instead.
       export TOKEN="${TOKEN:-${OPENAI_API_KEY:-mock-token}}"
       {{< /doc-test >}}
