    preview: kubectl wait --for=condition=ready pod \
  content: |-
    {{< doc-test paths="vllm-provider-setup" >}}
    kubectl apply -f- <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: httpbun-vllm
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
      labels:
        app: httpbun-vllm
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: httpbun-vllm
      template:
        metadata:
          labels:
            app: httpbun-vllm
        spec:
          containers:
          - name: httpbun
            image: sharat87/httpbun
            env:
            - name: HTTPBUN_BIND
              value: "0.0.0.0:3090"
            ports:
            - containerPort: 3090
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: httpbun-vllm
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      selector:
        app: httpbun-vllm
      ports:
      - protocol: TCP
        port: 3090
        targetPort: 3090
    EOF

    YAMLTest -f - <<'EOF'
    - name: wait for httpbun-vllm deployment to be ready
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: agentgateway-system
            name: httpbun-vllm
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 180
          intervalSeconds: 5
    EOF

    HTTPBUN_VLLM_POD_IP=$(kubectl get pod -n {{< reuse "agw-docs/snippets/namespace.md" >}} -l app=httpbun-vllm -o jsonpath='{.items[0].status.podIP}')
    kubectl apply -f- <<EOF
    apiVersion: v1
    kind: Service
    metadata:
      name: vllm
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      type: ClusterIP
      clusterIP: None
      ports:
      - port: 8000
        targetPort: 8000
        protocol: TCP
    ---
    apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: vllm
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
      labels:
        kubernetes.io/service-name: vllm
    addressType: IPv4
    endpoints:
    - addresses:
      - ${HTTPBUN_VLLM_POD_IP}
    ports:
    - port: 3090
      protocol: TCP
    ---
    apiVersion: {{< reuse "agw-docs/snippets/api-version.md" >}}
    kind: {{< reuse "agw-docs/snippets/backend.md" >}}
    metadata:
      name: vllm
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      ai:
        provider:
          openai:
            model: gpt-4
          host: vllm.{{< reuse "agw-docs/snippets/namespace.md" >}}.svc.cluster.local
          port: 3090
          path: /llm/chat/completions
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: vllm
      namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
    spec:
      parentRefs:
      - name: agentgateway-proxy
        namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
      rules:
      - backendRefs:
        - name: vllm
          namespace: {{< reuse "agw-docs/snippets/namespace.md" >}}
          group: agentgateway.dev
          kind: {{< reuse "agw-docs/snippets/backend.md" >}}
    EOF

    YAMLTest -f - <<'EOF'
    - name: wait for vllm HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: agentgateway-system
            name: vllm
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    - name: wait for vllm HTTPRoute refs to be resolved
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: agentgateway-system
            name: vllm
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF

    export INGRESS_GW_ADDRESS=$(kubectl get svc -n agentgateway-system agentgateway-proxy -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")

    YAMLTest -f - <<'EOF'
    - name: verify vllm route serves OpenAI-compatible responses
      http:
        url: "http://${INGRESS_GW_ADDRESS}:80/vllm"
        method: POST
        headers:
          content-type: application/json
        body: |
          {
            "model": "gpt-4",
            "messages": [
              {
                "role": "user",
                "content": "Respond with the word hello."
              }
            ],
            "httpbun": {
              "content": "vllm provider route is working"
            }
          }
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
          - path: "$.choices[0].message.content"
            comparator: contains
            value: "vllm provider route is working"
    EOF
    {{< /doc-test >}}
