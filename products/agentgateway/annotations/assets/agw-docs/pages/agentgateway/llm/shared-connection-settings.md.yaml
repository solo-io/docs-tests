  content: |2-
       {{< doc-test paths="shared-connection-settings" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for llm-providers backend to be accepted
         wait:
           target:
             kind: AgentgatewayBackend
             metadata:
               namespace: agentgateway-system
               name: llm-providers
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
