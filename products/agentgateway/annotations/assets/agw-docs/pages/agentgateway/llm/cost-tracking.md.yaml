  content: |2-
       {{< doc-test paths="cost-tracking" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * "View token usage metrics": after LLM requests, the metrics endpoint on the
       #     proxy pod's port 15020 (read through the API server) exposes agentgateway_gen_ai_client_token_usage
       #     with the labels that the page lists (token type, operation name, system,
       #     request and response model), `_sum` holds the tokens consumed, and
       #     `_count` counts the requests.
       #
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * The PromQL queries, alert rule, and trace attributes: they need Prometheus,
       #     Alertmanager, and a tracing backend, which this test does not install.
       #   * Real OpenAI token counts: the openai-setup prerequisite points the backend
       #     at the httpbun mock LLM, which reports its own token usage.
       #
       # Send three chat requests for gpt-4 through the /openai route.
       YAMLTest -f - <<'EOF'
       - name: chat request 1 for gpt-4 succeeds
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "Say hello in one word"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       - name: chat request 2 for gpt-4 succeeds
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "Say hello in one word"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       - name: chat request 3 for gpt-4 succeeds
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "Say hello in one word"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       EOF
       kubectl get --raw "/api/v1/namespaces/agentgateway-system/pods/$(kubectl get pods -n agentgateway-system -l gateway.networking.k8s.io/gateway-name=agentgateway-proxy -o jsonpath='{.items[0].metadata.name}'):15020/proxy/metrics" > /tmp/doc-test-metrics.txt
       python3 - <<'PY'
       import sys, urllib.request
       text = open("/tmp/doc-test-metrics.txt").read()
       want = ['gen_ai_operation_name="chat"', 'gen_ai_request_model="gpt-4"', 'gen_ai_system="openai"', "gen_ai_response_model="]
       def value(suffix, token_type):
           for line in text.splitlines():
               if (line.startswith("agentgateway_gen_ai_client_token_usage_" + suffix + "{")
                       and f'gen_ai_token_type="{token_type}"' in line and all(w in line for w in want)):
                   return float(line.rsplit(" ", 1)[1])
           return None
       checks = {
           "input _count counts the 3 requests": (value("count", "input") or 0) >= 3,
           "input _sum is above 0": (value("sum", "input") or 0) > 0,
           "output _sum is above 0": (value("sum", "output") or 0) > 0,
       }
       failed = [k for k, ok in checks.items() if not ok]
       if failed:
           print("\n".join(l for l in text.splitlines() if "gen_ai_client_token_usage" in l))
           sys.exit("FAIL: " + "; ".join(failed))
       print("token usage metric carries the documented labels, sum, and count")
       PY
       {{< /doc-test >}}
