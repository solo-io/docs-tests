  content: |2-
       {{< doc-test paths="llm-functions" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES:
       #   * Step 1: a chat request that carries a `tools` list and
       #     `parallel_tool_calls` passes through the gateway's chat completion handling
       #     to the provider and returns a completion with token usage.
       #   * Step 4: a follow-up request that carries an assistant `tool_calls` message
       #     with null content and a `tool` result message is accepted the same way.
       #
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * That the model suggests `get_weather` (steps 2 and 5): the openai-setup
       #     prerequisite points the backend at the httpbun mock LLM, which does not
       #     call tools. Which tool a model picks is the provider's behavior, not the
       #     gateway's.
       YAMLTest -f - <<'EOF'
       - name: a request with a tools list returns a completion
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {
               "model": "{{< reuse "agw-docs/snippets/openai-model.md" >}}",
               "messages": [{"role": "user", "content": "How is the current weather in Columbus?"}],
               "parallel_tool_calls": false,
               "tools": [{"type": "function", "function": {"name": "get_weather", "description": "Get the current weather",
                 "parameters": {"type": "object", "properties": {"location": {"type": "string", "description": "The city and country, eg. San Francisco, USA"},
                 "format": {"type": "string", "enum": ["celsius", "fahrenheit", "rankine"]}}, "required": ["location", "format"]}}}],
               "stream": false
             }
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.usage.prompt_tokens"
               comparator: greaterThan
               value: 0
             - path: "$.usage.completion_tokens"
               comparator: greaterThan
               value: 0
       EOF
       {{< /doc-test >}}
