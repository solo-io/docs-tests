    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="providers-multiple-endpoints-run" >}}
       # ============================================================================
       # Doc test coverage for this guide (these comments are not rendered on the page)
       # ============================================================================
       # WHAT THIS TEST VALIDATES, for both the backend `routes` map and the
       # alternative AgentgatewayPolicy `routes`:
       #   * /openai/v1/chat/completions is handled as `Completions`: a chat request
       #     returns a completion with token usage, and an embeddings body on that path
       #     is rejected by the gateway as an unparseable Completions request.
       #   * /openai/v1/embeddings is handled as `Passthrough`: the same embeddings body
       #     is forwarded without being parsed as a Completions request.
       #
       # WHAT THIS TEST DOES NOT VALIDATE (and why):
       #   * Real embeddings and model lists from OpenAI: the backend is patched to the
       #     httpbun mock LLM, which serves chat completions only, so the test checks
       #     how the gateway classifies each path rather than the provider's answer.
       # The apply above replaced the provider block; point it back at the httpbun mock.
       kubectl patch {{< reuse "agw-docs/snippets/backend.md" >}} openai -n {{< reuse "agw-docs/snippets/namespace.md" >}} --type=merge --patch-file /dev/stdin <<EOF
       spec:
         ai:
           provider:
             host: httpbun.default.svc.cluster.local
             port: 3090
             path: /llm/chat/completions
       EOF
       YAMLTest -f - <<'EOF'
       - name: the openai backend with a routes map is accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       # Accepted=True also covers a partly translated backend (reason PartiallyValid),
       # which can silently drop its auth policy. The reason tells the two apart.
       - name: the openai backend with a routes map translated in full, not partly
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/backend.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai
           jsonPath: "$.status.conditions[?(@.type=='Accepted')].reason"
           jsonPathExpectation:
             comparator: equals
             value: "Accepted"
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       # Classify each documented path: a Completions route parses the body, a
       # Passthrough route does not.
       EMBED_BODY='{"model": "text-embedding-ada-002", "input": "The food was delicious"}'
       for _ in $(seq 1 30); do
         STATUS=$(curl -s -m 10 -o /tmp/me-resp.txt -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:80/openai/v1/chat/completions" \
           -H content-type:application/json -d "$EMBED_BODY")
         [ "$STATUS" = "400" ] && grep -q 'failed to parse Completions request' /tmp/me-resp.txt && break
         sleep 2
       done
       grep -q 'failed to parse Completions request' /tmp/me-resp.txt \
         || { echo "FAIL: the backend routes map: /v1/chat/completions did not parse the body as Completions (HTTP $STATUS)"; cat /tmp/me-resp.txt; exit 1; }
       # Retried, because a newly attached policy can take a moment to reach the proxy.
       for _ in $(seq 1 15); do
         curl -s -m 10 -o /tmp/me-resp.txt "http://${INGRESS_GW_ADDRESS}:80/openai/v1/embeddings" \
           -H content-type:application/json -d "$EMBED_BODY"
         grep -q 'failed to parse' /tmp/me-resp.txt || break
         sleep 2
       done
       if grep -q 'failed to parse' /tmp/me-resp.txt; then
         echo "FAIL: the backend routes map: /v1/embeddings was parsed instead of passed through"; cat /tmp/me-resp.txt; exit 1
       fi
       YAMLTest -f - <<'EOF'
       - name: with the backend routes map, a chat request on /v1/chat/completions returns a completion with token usage
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/openai/v1/chat/completions"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "{{< reuse "agw-docs/snippets/openai-model.md" >}}", "messages": [{"role": "user", "content": "Hello!"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.usage.prompt_tokens"
               comparator: greaterThan
               value: 0
             - path: "$.usage.completion_tokens"
               comparator: greaterThan
               value: 0
       EOF
       {{< /doc-test >}}
