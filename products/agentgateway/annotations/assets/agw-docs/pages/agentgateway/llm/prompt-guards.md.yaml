- after:
    block: 1
    fingerprint: 5432b9c66bb9b68a
    lang: yaml
    lines: abbd1bdc fbc30693 7f57603a 8c8c4228 b309a767 8af957d1 fa1e8330 7bf46955 36184fa5 588a5d84 b5a028c9 56bf9360 6666820d bb85cefe ad3afdb1 7262a56b 14ddcd05 3c9df703 a007a685 eeb7e2a3 ceea3490 eaaad965 ba37d056 abc56510
    preview: kubectl apply -f - <<EOF
  content: |2-
       {{< doc-test paths="guardrails-regex-run" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the request prompt guard to be accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai-prompt-guard
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: a prompt that mentions a credit card is rejected
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "Can you give me some examples of Master Card credit card numbers?"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 403
       - name: the same prompt without the word credit is allowed
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "Can you give me some examples of Master Card card numbers?"}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
       EOF
       {{< /doc-test >}}
- after:
    block: 9
    fingerprint: 145b049405d465f4
    lang: yaml
    lines: abbd1bdc fbc30693 7f57603a 8c8c4228 b309a767 8af957d1 fa1e8330 7bf46955 36184fa5 588a5d84 b5a028c9 56bf9360 6666820d bb85cefe ad3afdb1 7262a56b 99c83b01 51da151f 8096ca96 6eb574a8 f51fdba0 abc56510
    preview: kubectl apply -f - <<EOF
  content: |2-
       {{< doc-test paths="guardrails-regex-run" >}}
       # The httpbun mock returns the content it is given, so the reply carries a
       # card number that the response guard must mask.
       YAMLTest -f - <<'EOF'
       - name: wait for the response prompt guard to be accepted
         wait:
           target:
             kind: {{< reuse "agw-docs/snippets/policy.md" >}}
             metadata:
               namespace: agentgateway-system
               name: openai-prompt-guard
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: a credit card number in the response is masked
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80/openai"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "What type of number is 4242424242424242?"}], "httpbun": {"content": "4242424242424242 is an even number."}}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.choices[0].message.content"
               comparator: equals
               value: "<CREDIT_CARD> is an even number."
       EOF
       {{< /doc-test >}}
