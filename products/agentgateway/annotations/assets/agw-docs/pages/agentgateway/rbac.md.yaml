  content: |2-
       {{< doc-test paths="llm-rbac-run" >}}
       YAMLTest -f - <<'EOF'
       - name: the rbac-policy policy is accepted
         wait:
           target:
             kind: AgentgatewayPolicy
             metadata:
               namespace: agentgateway-system
               name: rbac-policy
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: a request without the x-llm header is denied
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/gemini"
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "", "messages": [{"role": "user", "content": "Explain how AI works in simple terms."}]}
         source:
           type: local
         retries: 15
         expect:
           statusCode: 403
       - name: a request with the x-llm gemini header is allowed
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: "/gemini"
           method: POST
           headers:
             content-type: application/json
             x-llm: gemini
           body: |
             {"model": "", "messages": [{"role": "user", "content": "Explain how AI works in simple terms."}]}
         source:
           type: local
         retries: 5
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.usage.prompt_tokens"
               comparator: greaterThan
               value: 0
             - path: "$.usage.completion_tokens"
               comparator: greaterThan
               value: 0
       EOF
       {{< /doc-test >}}
