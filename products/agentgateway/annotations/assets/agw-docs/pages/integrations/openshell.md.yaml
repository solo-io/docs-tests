  content: |2-
       {{< doc-test paths="openshell" >}}
       # What this test covers, and what it does not:
       # - Covered: the Helm install with the guide's development values, the Gateway
       #   becoming Programmed, the GRPCRoute Accepted with ResolvedRefs, both workloads
       #   rolling out, and a gRPC Health call to OpenShell through the agentgateway
       #   proxy (the RPC behind `openshell status`).
       # - Not covered: the port-forward and the OpenShell CLI steps (the runner forbids
       #   port-forward, and the CLI is not installed), sandbox create/exec (needs a CNI
       #   that enforces NetworkPolicy and a node kernel with Landlock; kind has
       #   neither), and "Secure external access" (needs a DNS name, a trusted
       #   certificate, and a reachable OIDC provider).
       # The chart's preflight refuses to install without Agent Sandbox, so install
       # the version the guide was tested with first.
       kubectl apply --server-side -f "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v{{< reuse "agw-docs/versions/agent-sandbox.md" >}}/sandbox.yaml"
       kubectl wait --for=condition=Established crd/sandboxes.agents.x-k8s.io --timeout=120s
       kubectl rollout status deployment/agent-sandbox-controller -n agent-sandbox-system --timeout=300s
       # The reader saves the block above as openshell-values.yaml; write the same file.
       cat > openshell-values.yaml <<'EOF'
       server:
         disableTls: true
         auth:
           allowUnauthenticatedUsers: true

       grpcRoute:
         enabled: true
         gateway:
           create: true
           className: {{< reuse "agw-docs/snippets/gatewayclass.md" >}}
           name: openshell-ingress
       EOF
       {{< /doc-test >}}
