  content: |2-
       {{< doc-test paths="openshell" >}}
       # Instead of the port-forward and `openshell status`, call the same unauthenticated
       # openshell.v1.OpenShell/Health RPC through the proxy's LoadBalancer address.
       lb=""
       for i in $(seq 1 90); do
         lb=$(kubectl get svc openshell-ingress -n openshell -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" 2>/dev/null || true)
         [ -n "$lb" ] && break
         sleep 2
       done
       if [ -z "$lb" ]; then
         echo "openshell-ingress has no LoadBalancer address"
         exit 1
       fi
       # An empty HealthRequest is a 5-byte gRPC frame: no compression, zero length.
       hdrs=""
       for i in $(seq 1 30); do
         hdrs=$(printf '\000\000\000\000\000' | curl -sS --http2-prior-knowledge -o /dev/null -D - \
           -H 'content-type: application/grpc' -H 'te: trailers' --data-binary @- \
           "http://${lb}:80/openshell.v1.OpenShell/Health" 2>/dev/null || true)
         echo "$hdrs" | grep -qi '^grpc-status: *0' && break
         sleep 2
       done
       echo "$hdrs"
       echo "$hdrs" | grep -q '^HTTP/2 200' || { echo "Health RPC through agentgateway did not return HTTP/2 200"; exit 1; }
       echo "$hdrs" | grep -qi '^grpc-status: *0' || { echo "Health RPC through agentgateway did not return grpc-status 0"; exit 1; }
       {{< /doc-test >}}
