       {{< doc-test paths="argo-rollouts" >}}
       # The visible step applies the amd64 plugin. On an arm64 kind node (Apple silicon),
       # switch to the arm64 build from the page's other tab so the controller can run it.
       arch=$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')
       if [ "$arch" = "arm64" ]; then
         kubectl patch configmap argo-rollouts-config -n argo-rollouts --type=merge -p '{"data":{"trafficRouterPlugins":"- name: \"argoproj-labs/gatewayAPI\"\n  location: \"https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.11.0/gatewayapi-plugin-linux-arm64\""}}'
       fi
       {{< /doc-test >}}
