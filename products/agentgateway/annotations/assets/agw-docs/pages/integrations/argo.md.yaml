       {{< doc-test paths="argo-rollouts" >}}
       # Same change as the visible `kubectl argo rollouts set image` step, made with
       # kubectl so the test does not need the kubectl-argo-rollouts plugin.
       kubectl patch rollout httpbun-rollout -n default --type=json \
         -p '[{"op":"replace","path":"/spec/template/spec/containers/0/image","value":"sharat87/httpbun:latest"}]'
       # The page: the rollout pauses at the first canary step with 30% of traffic on the canary.
       YAMLTest -f - <<'EOF'
       - name: rollout pauses at the first canary step
         wait:
           target:
             kind: Rollout
             metadata:
               namespace: default
               name: httpbun-rollout
           jsonPath: "$.status.pauseConditions[0].reason"
           jsonPathExpectation:
             comparator: equals
             value: CanaryPauseStep
           polling:
             timeoutSeconds: 300
             intervalSeconds: 3
       - name: canary service gets weight 30 in the HTTPRoute
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: default
               name: httpbun-http-route
           jsonPath: "$.spec.rules[0].backendRefs[?(@.name=='httpbun-canary-service')].weight"
           jsonPathExpectation:
             comparator: equals
             value: 30
           polling:
             timeoutSeconds: 180
             intervalSeconds: 3
       - name: stable service gets weight 70 in the HTTPRoute
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: default
               name: httpbun-http-route
           jsonPath: "$.spec.rules[0].backendRefs[?(@.name=='httpbun-stable-service')].weight"
           jsonPathExpectation:
             comparator: equals
             value: 70
           polling:
             timeoutSeconds: 60
             intervalSeconds: 3
       EOF
       {{< /doc-test >}}
- after:
    block: 22
    fingerprint: 278fefcccf12bb49
    lang: sh
    lines: 278fefcc
    preview: kubectl argo rollouts promote httpbun-rollout
  content: |2-
       {{< doc-test paths="argo-rollouts" >}}
       # Same as the visible `kubectl argo rollouts promote` step: unpause the rollout and
       # clear its pause condition (the plugin's promote patches the status subresource).
       kubectl patch rollout httpbun-rollout -n default --type=merge -p '{"spec":{"paused":false}}'
       kubectl patch rollout httpbun-rollout -n default --subresource=status --type=merge \
         -p '{"status":{"pauseConditions":null}}' \
         || kubectl patch rollout httpbun-rollout -n default --type=merge -p '{"status":{"pauseConditions":null}}'
       # The page: the rollout continues through the remaining steps (about 30 seconds) until
       # the canary receives all traffic and becomes the stable version.
       YAMLTest -f - <<'EOF'
       - name: rollout finishes the remaining canary steps
         wait:
           target:
             kind: Rollout
             metadata:
               namespace: default
               name: httpbun-rollout
           jsonPath: "$.status.phase"
           jsonPathExpectation:
             comparator: equals
             value: Healthy
           polling:
             timeoutSeconds: 300
             intervalSeconds: 3
       - name: stable service gets all traffic after promotion
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: default
               name: httpbun-http-route
           jsonPath: "$.spec.rules[0].backendRefs[?(@.name=='httpbun-stable-service')].weight"
           jsonPathExpectation:
             comparator: equals
             value: 100
           polling:
             timeoutSeconds: 180
             intervalSeconds: 3
       - name: canary service gets no traffic after promotion
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: default
               name: httpbun-http-route
           jsonPath: "$.spec.rules[0].backendRefs[?(@.name=='httpbun-canary-service')].weight"
           jsonPathExpectation:
             comparator: equals
             value: 0
           polling:
             timeoutSeconds: 60
             intervalSeconds: 3
       EOF
       # The new revision is now the stable one: the stable service selects the new pods.
       new_hash=$(kubectl get rollout httpbun-rollout -n default -o jsonpath='{.status.currentPodHash}')
       stable_rs=$(kubectl get rollout httpbun-rollout -n default -o jsonpath='{.status.stableRS}')
       svc_hash=$(kubectl get svc httpbun-stable-service -n default -o jsonpath='{.spec.selector.rollouts-pod-template-hash}')
       if [ -z "$new_hash" ] || [ "$stable_rs" != "$new_hash" ] || [ "$svc_hash" != "$new_hash" ]; then
         echo "after promotion: currentPodHash=${new_hash} stableRS=${stable_rs} stable service selector=${svc_hash}"
         exit 1
       fi
       # The page: after the rollout completes, the httpbun pods run the latest image.
       # The old ReplicaSet scales down after a delay (30 seconds by default), so poll.
       images=""
       for i in $(seq 1 60); do
         images=$(kubectl get pods -n default -l app=httpbun --field-selector=status.phase!=Failed \
           -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\n"}{end}' | sort -u)
         [ "$images" = "sharat87/httpbun:latest" ] && break
         sleep 3
       done
       if [ "$images" != "sharat87/httpbun:latest" ]; then
         echo "httpbun pod images after promotion: ${images}"
         exit 1
       fi
       YAMLTest -f - <<'EOF'
       - name: chat completion through the httpbun route returns a completion
         http:
           url: "http://${INGRESS_GW_ADDRESS}:80"
           path: /llm/chat/completions
           method: POST
           headers:
             content-type: application/json
           body: |
             {"model": "gpt-4", "messages": [{"role": "user", "content": "Explain agentgateway in one sentence."}]}
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
             - path: "$.object"
               comparator: equals
               value: chat.completion
             - path: "$.choices[0].message.content"
               comparator: exists
       EOF
       {{< /doc-test >}}
