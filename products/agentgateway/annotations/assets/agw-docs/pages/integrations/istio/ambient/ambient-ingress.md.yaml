  content: |-
    {{< doc-test paths="istio-ambient-ingress" >}}
    # Automated runs can't use the page's port-forward, so reach the same Service
    # through the LoadBalancer address that the cluster assigns to it.
    AMBIENT_URL=""
    for i in $(seq 1 90); do
      lb=$(kubectl -n agentgateway-system get svc ambient-ingress -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" 2>/dev/null || true)
      if [ -n "$lb" ]; then
        AMBIENT_URL="http://${lb}:80"
        code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" "${AMBIENT_URL}/get" -H "host: www.example.com" || true)
        [ "$code" = "200" ] && break
      fi
      sleep 2
    done
    export AMBIENT_URL
    {{< /doc-test >}}
- after:
