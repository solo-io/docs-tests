    preview: kubectl config current-context
  content: |-
    {{< doc-test paths="istio-ambient-ingress" >}}
    # The preflight claims: an agentgateway GatewayClass exists and a ztunnel pod
    # runs on each node.
    kubectl get gatewayclass agentgateway >/dev/null
    nodes=$(kubectl get nodes --no-headers | wc -l | tr -d ' ')
    zt=$(kubectl -n istio-system get pods -l app=ztunnel --field-selector=status.phase=Running --no-headers | wc -l | tr -d ' ')
    if [ "$zt" -lt "$nodes" ]; then
      echo "found ${zt} running ztunnel pods for ${nodes} nodes"
      exit 1
    fi
    {{< /doc-test >}}
