  content: |-
    {{< doc-test paths="istio-ambient-ingress" >}}
    # Claims: status 200, and httpbin echoes Host: www.example.com.
    resp=$(curl -sS -m 10 -w '\n%{http_code}' ${AMBIENT_URL}/get -H "host: www.example.com")
    code=$(printf '%s' "$resp" | tail -n1)
    body=$(printf '%s' "$resp" | sed '$d')
    if [ "$code" != "200" ]; then
      echo "expected 200 through the ambient ingress, got ${code}"
      exit 1
    fi
    host=$(printf '%s' "$body" | jq -r '.headers.Host[0]')
    if [ "$host" != "www.example.com" ]; then
      echo "httpbin echoed Host '${host}', expected www.example.com"
      exit 1
    fi
    {{< /doc-test >}}
