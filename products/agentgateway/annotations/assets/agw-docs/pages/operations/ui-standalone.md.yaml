  content: |-
    {{< doc-test paths="ui-standalone-default" >}}
    YAMLTest -f - <<'EOF'
    - name: UI returns HTTP 200 on default port
      http:
        url: "http://localhost:15000/ui/"
        method: GET
      source:
        type: local
      expect:
        statusCode: 200
      retries: 3
    EOF
    kill $AGW_DEFAULT_PID 2>/dev/null || true
    {{< /doc-test >}}
