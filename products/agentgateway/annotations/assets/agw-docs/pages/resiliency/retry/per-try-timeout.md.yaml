  content: |-
    {{< doc-test paths="per-try-timeout-in-httproute,per-try-timeout-in-agentgateway,per-try-timeout-in-gatewaylistener" >}}
      YAMLTest -f - <<'EOF'
      - name: wait for retry HTTPRoute to be accepted
        wait:
          target:
            kind: HTTPRoute
            metadata:
              namespace: httpbin
              name: retry
          jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
          jsonPathExpectation:
            comparator: equals
            value: "True"
          polling:
            timeoutSeconds: 300
            intervalSeconds: 5
      - name: verify request to retry route succeeds
        http:
          url: "http://${INGRESS_GW_ADDRESS}"
          path: /headers
          method: GET
          headers:
            host: retry.example
        source:
          type: local
        expect:
          statusCode: 200
      EOF
      {{< /doc-test >}}
