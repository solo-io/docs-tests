    preview: kubectl port-forward deployment/agentgateway-proxy \
  content: |-
    {{< doc-test paths="backend-timeouts" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for backend timeout policy to be accepted
      wait:
        target:
          kind: AgentgatewayPolicy
          metadata:
            namespace: httpbin
            name: httpbin-backend-timeouts
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    - name: wait for backend timeouts in config dump
      retries: 20
      http:
        url: http://localhost:15000
        path: /config_dump
      source:
        type: pod
        usePortForward: true
        selector:
          kind: Deployment
          metadata:
            namespace: agentgateway-system
            name: agentgateway-proxy
      expect:
        bodyContains:
        - '"httpbin-backend-timeouts"'
        - '"connectTimeout":"2s"'
        - '"requestTimeout":"5s"'
    EOF
    {{< /doc-test >}}
