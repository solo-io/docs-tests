  content: |-
    {{< doc-test paths="timeout-in-httproute,timeout-in-trafficpolicy,timeout-in-gatewaylistener" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for httpbin-timeout HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-timeout
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: verify request under timeout limit succeeds
      http:
        url: "http://${INGRESS_GW_ADDRESS}"
        path: /delay/1
        method: GET
        headers:
          host: timeout.example
      source:
        type: local
      expect:
        statusCode: 200
    - name: verify request over timeout limit returns 504
      http:
        url: "http://${INGRESS_GW_ADDRESS}"
        path: /delay/5
        method: GET
        headers:
          host: timeout.example
      source:
        type: local
      expect:
        statusCode: 504
    - name: verify timeout in config dump
      http:
        url: http://localhost:15000
        skipSslVerification: true
        method: GET
        path: /config_dump
      source:
        type: pod
        usePortForward: true
        selector:
          kind: Deployment
          metadata:
            namespace: agentgateway-system
            name: agentgateway-proxy
      expect:
        bodyContains:
        - '"requestTimeout":"2s'
    EOF
    {{< /doc-test >}}
