    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="install-httpbin" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for httpbin HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for httpbin HTTPRoute refs to be resolved
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
