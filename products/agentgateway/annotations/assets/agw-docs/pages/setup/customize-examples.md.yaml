  content: |-
    {{< doc-test paths="customize-configs-run" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the agentgateway-daemonset Gateway to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: agentgateway-system
            name: agentgateway-daemonset
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: the proxy runs as a DaemonSet with a ready pod on the node
      wait:
        target:
          kind: DaemonSet
          metadata:
            namespace: agentgateway-system
            name: agentgateway-daemonset
        jsonPath: "$.status.numberReady"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # DaemonSet mode replaces the default Deployment rather than adding one.
    if kubectl get deployment agentgateway-daemonset -n agentgateway-system >/dev/null 2>&1; then
      echo "a Deployment named agentgateway-daemonset exists, expected only a DaemonSet"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 22
