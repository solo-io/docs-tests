  content: |2-
       {{< doc-test paths="customize-configs-run" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the ClusterIP agentgateway-proxy Gateway to be programmed
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: agentgateway-system
               name: agentgateway-proxy
           jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: the generated service is of type ClusterIP
         wait:
           target:
             kind: Service
             metadata:
               namespace: agentgateway-system
               name: agentgateway-proxy
           jsonPath: "$.spec.type"
           jsonPathExpectation:
             comparator: equals
             value: ClusterIP
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       ext=$(kubectl get svc agentgateway-proxy -n agentgateway-system -o jsonpath='{.status.loadBalancer.ingress}')
       if [ -n "$ext" ]; then
         echo "agentgateway-proxy has an external address '${ext}', expected none"
         exit 1
       fi
       {{< /doc-test >}}
