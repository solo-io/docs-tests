  content: |2-
       {{< doc-test paths="listener-mtls" >}}
       mtls_code() {
         # Prints the HTTP status, or 000 when the TLS handshake or connection fails.
         curl -sk --max-time 15 --resolve "example.com:$1:${INGRESS_GW_ADDRESS}" -o /dev/null -w "%{http_code}" \
           "https://example.com:$1/get" "${@:2}" 2>/dev/null || true
       }
       expect_code() {
         local port=$1 want=$2; shift 2
         local code=""
         for i in $(seq 1 60); do
           code=$(mtls_code "$port" "$@")
           [ "$code" = "$want" ] && return 0
           sleep 2
         done
         echo "port ${port} $* returned '${code}', expected '${want}'"
         return 1
       }
       # Wait until the proxy serves both mTLS listeners before the page's curl runs.
       CERT_ARGS=(--cert client-cert.pem --key client-key.pem --cacert ca-cert.pem)
       expect_code 8443 200 "${CERT_ARGS[@]}"
       expect_code 8444 200 "${CERT_ARGS[@]}"
       {{< /doc-test >}}
