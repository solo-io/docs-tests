    preview: curl -v -k --resolve "example.com:8443:${INGRESS_GW_ADDRESS}"  https://example.c
  content: |2-
       {{< doc-test paths="listener-mtls" >}}
       # perPort override: 8444 falls back to insecure and accepts a client without a
       # certificate, while 8443 keeps the AllowValidOnly default. Poll 8444 first so
       # the updated Gateway has reached the proxy.
       CERT_ARGS=(--cert client-cert.pem --key client-key.pem --cacert ca-cert.pem)
       expect_code 8444 200
       expect_code 8443 000
       expect_code 8443 200 "${CERT_ARGS[@]}"
       expect_code 8444 200 "${CERT_ARGS[@]}"
       {{< /doc-test >}}
