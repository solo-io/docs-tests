    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="listener-mtls" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the mtls Gateway to be programmed
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: agentgateway-system
               name: mtls
           jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the httpbin-https HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: httpbin
               name: httpbin-https
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 180
             intervalSeconds: 5
       EOF
       # The next step reads the LoadBalancer address, so wait until it is assigned.
       for i in $(seq 1 90); do
         lb=$(kubectl get svc mtls -n agentgateway-system -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" 2>/dev/null || true)
         [ -n "$lb" ] && break
         sleep 2
       done
       {{< /doc-test >}}
- after:
