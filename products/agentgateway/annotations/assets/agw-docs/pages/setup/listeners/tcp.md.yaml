    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="tcp-listener" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the tcp-gateway to be programmed
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: agentgateway-system
               name: tcp-gateway
           jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 180
             intervalSeconds: 2
       - name: wait for the TCPRoute to be accepted
         wait:
           target:
             kind: TCPRoute
             metadata:
               namespace: agentgateway-system
               name: tcp-route-echo
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       EOF
       # The next step reads the LoadBalancer address, so wait until it is assigned.
       for i in $(seq 1 90); do
         lb=$(kubectl get svc tcp-gateway -n agentgateway-system -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" 2>/dev/null || true)
         [ -n "$lb" ] && break
         sleep 2
       done
       {{< /doc-test >}}
