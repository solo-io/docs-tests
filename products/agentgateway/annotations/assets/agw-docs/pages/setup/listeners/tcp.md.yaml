  content: |2-
       {{< doc-test paths="tcp-listener" >}}
       # The guide's nc session is interactive; send one line and expect it echoed back.
       out=""
       for i in $(seq 1 30); do
         out=$(printf 'hello\n' | nc -w 3 "${INGRESS_GW_ADDRESS}" 8000 2>/dev/null || true)
         [ "$out" = "hello" ] && break
         sleep 2
       done
       if [ "$out" != "hello" ]; then
         echo "TCP echo through tcp-gateway:8000 returned '${out}', expected 'hello'"
         exit 1
       fi
       {{< /doc-test >}}
