    YAMLTest -f - <<'EOF'
    - name: host redirect - host.redirect.example returns 302 with location www.example.com
      retries: 1
      http:
        url: "http://${INGRESS_GW_ADDRESS}:80"
        path: /headers
        method: GET
        headers:
          host: "host.redirect.example"
      source:
        type: local
      expect:
        statusCode: 302
        headers:
          - name: location
            comparator: contains
            value: www.example.com
    EOF
    {{< /doc-test >}}
