  content: |-
    {{< doc-test paths="https-redirect" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for httpbin-https-redirect HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-https-redirect
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
