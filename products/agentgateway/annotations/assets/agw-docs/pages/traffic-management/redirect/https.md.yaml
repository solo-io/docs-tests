  content: |-
    {{< doc-test paths="https-redirect" >}}
    YAMLTest -f - <<'EOF'
    - name: https redirect - HTTP request returns 301 with https location
      retries: 1
      http:
        url: "http://${INGRESS_GW_ADDRESS}:80"
        path: /status/200
        method: GET
        headers:
          host: redirect.example
      source:
        type: local
      expect:
        statusCode: 301
        headers:
          - name: location
            comparator: contains
            value: https://redirect.example
    EOF
    {{< /doc-test >}}
