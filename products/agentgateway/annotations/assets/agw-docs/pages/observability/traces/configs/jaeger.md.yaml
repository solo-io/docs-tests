  content: |2-
       {{< doc-test paths="jaeger-traces" >}}
       # The guide checks the Jaeger UI by eye. Query the same Jaeger API instead, through
       # the Kubernetes API server's service proxy (no local port needed), and keep sending
       # requests until the agentgateway service has reported spans.
       jaeger_services() {
         kubectl get --raw "/api/v1/namespaces/tracing/services/jaeger:16686/proxy/api/v3/services" 2>/dev/null || true
       }
       found=""
       for i in $(seq 1 40); do
         curl -s -o /dev/null -X POST "http://${INGRESS_GW_ADDRESS}:80/post" -H "host: www.example.com" || true
         if jaeger_services | grep -q '"agentgateway'; then
           found=yes
           break
         fi
         sleep 3
       done
       services=$(jaeger_services)
       if [ -z "$found" ]; then
         echo "Jaeger has no agentgateway service. Services: ${services}"
         exit 1
       fi
       {{< /doc-test >}}
