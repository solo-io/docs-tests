# Doc-test scenario definitions for agentgateway, kubernetes mode.
#
# Covers traffic-management and llm (documentation/llm/). Every other subject area still declares its
# scenarios in the consuming repo's page front matter; both forms are read.
#
# Scenarios are keyed by the assets/ file a page reuses, not by the page's own
# path, because over the 7 weeks after agentgateway/website#920 opened,
# content/docs/ churned 89% (1,992 of 2,232 files changed path, almost all of it
# the docTabs partition) while assets/agw-docs/ churned 2% (8 of 478).
#
#   source:  an assets/ path. The runner resolves it to every live version root
#            that reuses it, so one entry covers latest and main.
#   page:    a version-root-relative content path. The fallback for a page that
#            carries its own body and so has no single reuse source.
#   needs:   named prerequisites, defined once below. In front matter these were
#            restated per page: documentation/setup/gateway.md [all] alone
#            appeared 266 times across the tree.
#
# Scenario names are unique per MODE, not globally: 9 names (direct-response,
# extproc, csrf, ...) exist in both the kubernetes and standalone trees and mean
# different things, which is why this file is per-mode.
version: 1
mode: kubernetes
prerequisites:
  gateway:
    page: documentation/setup/gateway.md
    path: all
  httpbin:
    page: documentation/install/sample-app.md
    path: install-httpbin
  install-experimental:
    page: documentation/quickstart/install.md
    path: experimental
  install-standard:
    page: documentation/quickstart/install.md
    path: standard
  helm-standard:
    page: documentation/install/helm.md
    path: standard
# Pages with deliberately no test: section indexes and concept pages. The
# manifest form of front matter `test: skip`; they count as covered.
skip:
- page: documentation/traffic-management/_index.md
- page: documentation/traffic-management/buffer.md
- page: documentation/traffic-management/header-control/_index.md
- page: documentation/traffic-management/load-balancing.md
- page: documentation/traffic-management/match/_index.md
- page: documentation/traffic-management/redirect/_index.md
- page: documentation/traffic-management/rewrite/_index.md
- page: documentation/traffic-management/route-delegation/_index.md
- page: documentation/traffic-management/route-delegation/inheritance/_index.md
- page: documentation/traffic-management/route-delegation/overview.md
- page: documentation/traffic-management/transformations/_index.md
- page: documentation/traffic-management/transformations/templating-language.md
- page: documentation/llm/_index.md
- page: documentation/llm/about.md
- page: documentation/llm/api-types/_index.md
- page: documentation/llm/cost-controls/_index.md
- page: documentation/llm/cost-controls/attribution.md
- page: documentation/llm/cost-controls/dashboard.md
- page: documentation/llm/guardrails/_index.md
- page: documentation/llm/guardrails/webhook/_index.md
- page: documentation/llm/inference/benchmarking.md
- page: documentation/llm/inference/inference-routing.md
