    preview: '* Mark bundle as not supporting multiuse'
  content: |2-
       {{< doc-test paths="listeners-http,listeners-http-listenerset" >}}
       # The request goes to port 8080 of the my-http-gateway address with the
       # mydomain.com host that the listener serves.
       for i in $(seq 1 60); do
         code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' \
           "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: mydomain.com:8080" || true)
         [ "$code" = "200" ] && break
         echo "listeners-http attempt $i: got '${code:-no response}', retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "request to mydomain.com on my-http-gateway did not return 200"; exit 1; }
       echo "listeners-http: httpbin returned 200 through my-http-gateway"
       {{< /doc-test >}}
