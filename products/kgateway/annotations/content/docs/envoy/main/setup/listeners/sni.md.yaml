  blank_before: []
  content: |2-
       {{< doc-test paths="sni,sni-listenerset" >}}
       # SNI httpbin.example.com must select the httpbin certificate.
       # s_client verifies the chain against the page's root CA and the name, so a
       # wrong certificate fails here; the subject proves which certificate it was.
       subject=""
       for i in $(seq 1 60); do
         subject=$(openssl s_client -connect "${INGRESS_GW_ADDRESS}:443" -servername httpbin.example.com \
           -CAfile example_certs/example.com.crt -verify_hostname httpbin.example.com -verify_return_error </dev/null 2>/dev/null \
           | openssl x509 -noout -subject -nameopt RFC2253 2>/dev/null) && [ -n "$subject" ] && break
         echo "attempt $i: no verified certificate for httpbin.example.com yet, retrying"
         sleep 2
       done
       echo "httpbin.example.com: $subject"
       [[ "$subject" == *"CN=httpbin.example.com"* && "$subject" == *"O=httpbin organization"* ]] || { echo "httpbin.example.com did not get the certificate with CN=httpbin.example.com, O=httpbin organization"; exit 1; }
       # SNI petstore.example.com must select the petstore certificate.
       # s_client verifies the chain against the page's root CA and the name, so a
       # wrong certificate fails here; the subject proves which certificate it was.
       subject=""
       for i in $(seq 1 60); do
         subject=$(openssl s_client -connect "${INGRESS_GW_ADDRESS}:443" -servername petstore.example.com \
           -CAfile example_certs/example.com.crt -verify_hostname petstore.example.com -verify_return_error </dev/null 2>/dev/null \
           | openssl x509 -noout -subject -nameopt RFC2253 2>/dev/null) && [ -n "$subject" ] && break
         echo "attempt $i: no verified certificate for petstore.example.com yet, retrying"
         sleep 2
       done
       echo "petstore.example.com: $subject"
       [[ "$subject" == *"CN=petstore.example.com"* && "$subject" == *"O=petstore organization"* ]] || { echo "petstore.example.com did not get the certificate with CN=petstore.example.com, O=petstore organization"; exit 1; }
       # The request verifies the certificate against the root CA (no -k).
       code=""
       for i in $(seq 1 60); do
         code=$(curl -sS -o /tmp/doc-test-body -D /tmp/doc-test-headers -w '%{http_code}' --cacert example_certs/example.com.crt \
           --resolve "httpbin.example.com:443:${INGRESS_GW_ADDRESS}" https://httpbin.example.com:443/anything) && [ "$code" = "200" ] && break
         echo "attempt $i: got '${code:-no response}' from httpbin.example.com, retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "HTTPS request to httpbin.example.com/anything with certificate verification did not return 200"; exit 1; }
       grep -q 'httpbin.example.com' /tmp/doc-test-body || { echo "response from httpbin.example.com/anything does not contain httpbin.example.com"; cat /tmp/doc-test-body; exit 1; }
       # The request verifies the certificate against the root CA (no -k).
       code=""
       for i in $(seq 1 60); do
         code=$(curl -sS -o /tmp/doc-test-body -D /tmp/doc-test-headers -w '%{http_code}' --cacert example_certs/example.com.crt \
           --resolve "petstore.example.com:443:${INGRESS_GW_ADDRESS}" https://petstore.example.com:443/api/pets) && [ "$code" = "200" ] && break
         echo "attempt $i: got '${code:-no response}' from petstore.example.com, retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "HTTPS request to petstore.example.com/api/pets with certificate verification did not return 200"; exit 1; }
       grep -q '"name":"Dog"' /tmp/doc-test-body || { echo "response from petstore.example.com/api/pets does not contain "name":"Dog""; cat /tmp/doc-test-body; exit 1; }
       {{< /doc-test >}}
