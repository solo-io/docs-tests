    preview: '* ALPN, offering h2'
  content: |2-
       {{< doc-test paths="listeners-https,listeners-https-listenerset" >}}
       # The page's curl uses -k. This check verifies the gateway certificate against
       # the root CA instead, so it also fails if the certificate does not cover
       # https.example.com.
       for i in $(seq 1 60); do
         code=$(curl -sS -o /dev/null --max-time 5 -w '%{http_code}' --cacert example_certs/root.crt \
           --resolve "https.example.com:443:${INGRESS_GW_ADDRESS}" \
           https://https.example.com:443/status/200 || true)
         [ "$code" = "200" ] && break
         echo "listeners-https attempt $i: got '${code:-no response}', retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "HTTPS request to https.example.com with certificate verification did not return 200"; exit 1; }
       echo "listeners-https: httpbin returned 200 over HTTPS with a verified certificate"
       {{< /doc-test >}}
