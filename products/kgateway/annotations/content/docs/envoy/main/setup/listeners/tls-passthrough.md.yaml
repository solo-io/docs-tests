    preview: export INGRESS_GW_ADDRESS=$(kubectl get svc -n {{< reuse "kgw-docs/snippets/name
  blank_before: []
  content: |2-
       {{< doc-test paths="tls-passthrough,tls-passthrough-listenerset" >}}
       # Passthrough: the gateway holds no certificate for this listener, so a certificate
       # for nginx.example.com signed by the page's root CA can only come from nginx.
       # s_client verifies the chain against the page's root CA and the name, so a
       # wrong certificate fails here; the subject proves which certificate it was.
       subject=""
       for i in $(seq 1 60); do
         subject=$(openssl s_client -connect "${INGRESS_GW_ADDRESS}:8443" -servername nginx.example.com \
           -CAfile example_certs/example.com.crt -verify_hostname nginx.example.com -verify_return_error </dev/null 2>/dev/null \
           | openssl x509 -noout -subject -nameopt RFC2253 2>/dev/null) && [ -n "$subject" ] && break
         echo "attempt $i: no verified certificate for nginx.example.com yet, retrying"
         sleep 2
       done
       echo "nginx.example.com: $subject"
       [[ "$subject" == *"CN=nginx.example.com"* && "$subject" == *"O=some organization"* ]] || { echo "nginx.example.com did not get the certificate with CN=nginx.example.com, O=some organization"; exit 1; }
       # The request verifies the certificate against the root CA (no -k).
       code=""
       for i in $(seq 1 60); do
         code=$(curl -sS -o /tmp/doc-test-body -D /tmp/doc-test-headers -w '%{http_code}' --cacert example_certs/example.com.crt \
           --resolve "nginx.example.com:8443:${INGRESS_GW_ADDRESS}" https://nginx.example.com:8443/) && [ "$code" = "200" ] && break
         echo "attempt $i: got '${code:-no response}' from nginx.example.com, retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "HTTPS request to nginx.example.com/ with certificate verification did not return 200"; exit 1; }
       grep -q 'Welcome to nginx' /tmp/doc-test-body || { echo "response from nginx.example.com/ does not contain Welcome to nginx"; cat /tmp/doc-test-body; exit 1; }
       grep -qi '^server: nginx' /tmp/doc-test-headers || { echo "response from nginx.example.com/ has no '^server: nginx' header"; cat /tmp/doc-test-headers; exit 1; }
       {{< /doc-test >}}
