  content: |2-
       {{< doc-test paths="tls-termination,tls-termination-listenerset" >}}
       # Terminate: the gateway presents its own certificate (CN=*.example.com).
       # s_client verifies the chain against the page's root CA and the name, so a
       # wrong certificate fails here; the subject proves which certificate it was.
       subject=""
       for i in $(seq 1 60); do
         subject=$(openssl s_client -connect "${INGRESS_GW_ADDRESS}:8443" -servername app.example.com \
           -CAfile example_certs/root.crt -verify_hostname app.example.com -verify_return_error </dev/null 2>/dev/null \
           | openssl x509 -noout -subject -nameopt RFC2253 2>/dev/null) && [ -n "$subject" ] && break
         echo "attempt $i: no verified certificate for app.example.com yet, retrying"
         sleep 2
       done
       echo "app.example.com: $subject"
       [[ "$subject" == *"CN=*.example.com"* && "$subject" == *"O=any domain"* ]] || { echo "app.example.com did not get the certificate with CN=*.example.com, O=any domain"; exit 1; }
       # The request verifies the certificate against the root CA (no -k).
       code=""
       for i in $(seq 1 60); do
         code=$(curl -sS -o /tmp/doc-test-body -D /tmp/doc-test-headers -w '%{http_code}' --cacert example_certs/root.crt \
           --resolve "app.example.com:8443:${INGRESS_GW_ADDRESS}" https://app.example.com:8443/status/200) && [ "$code" = "200" ] && break
         echo "attempt $i: got '${code:-no response}' from app.example.com, retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "HTTPS request to app.example.com/status/200 with certificate verification did not return 200"; exit 1; }
       # The request verifies the certificate against the root CA (no -k).
       code=""
       for i in $(seq 1 60); do
         code=$(curl -sS -o /tmp/doc-test-body -D /tmp/doc-test-headers -w '%{http_code}' --cacert example_certs/root.crt \
           --resolve "app.example.com:8443:${INGRESS_GW_ADDRESS}" https://app.example.com:8443/headers) && [ "$code" = "200" ] && break
         echo "attempt $i: got '${code:-no response}' from app.example.com, retrying"
         sleep 2
       done
       [ "$code" = "200" ] || { echo "HTTPS request to app.example.com/headers with certificate verification did not return 200"; exit 1; }
       grep -q 'app.example.com' /tmp/doc-test-body || { echo "response from app.example.com/headers does not contain app.example.com"; cat /tmp/doc-test-body; exit 1; }
       {{< /doc-test >}}
