  content: |-
    {{< doc-test paths="migrate-basic-auth" >}}
    # Test-only: every resource that the page applies exists. The backends are not in the
    # cluster, so the check stops at Accepted (no ResolvedRefs, no traffic).
    kubectl get gateway nginx -n default
    kubectl get httproute basic-auth-demo-auth-example-com -n default
    kubectl get trafficpolicy basic-auth-demo -n default
    kubectl get secret my-htpasswd-secret -n default
    YAMLTest -f - <<'EOF'
    - name: wait for the basic-auth-demo-auth-example-com HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: basic-auth-demo-auth-example-com
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the basic-auth-demo TrafficPolicy to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: default
            name: basic-auth-demo
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
