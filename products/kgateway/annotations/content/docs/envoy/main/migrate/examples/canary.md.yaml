  content: |-
    {{< doc-test paths="migrate-canary" >}}
    # Test-only: every resource that the page applies exists. The backends are not in the
    # cluster, so the check stops at Accepted (no ResolvedRefs, no traffic).
    kubectl get gateway nginx -n default
    kubectl get httproute app-canary-app-example-com -n default
    YAMLTest -f - <<'EOF'
    - name: wait for the app-canary-app-example-com HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: app-canary-app-example-com
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
