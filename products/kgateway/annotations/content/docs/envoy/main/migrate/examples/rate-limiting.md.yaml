  content: |-
    {{< doc-test paths="migrate-rate-limiting" >}}
    # Test-only: every resource that the page applies exists. The backends are not in the
    # cluster, so the check stops at Accepted (no ResolvedRefs, no traffic).
    kubectl get gateway nginx -n default
    kubectl get httproute ratelimit-demo-api-example-com -n default
    kubectl get trafficpolicy ratelimit-demo-api-example-com-0 -n default
    YAMLTest -f - <<'EOF'
    - name: wait for the ratelimit-demo-api-example-com HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: ratelimit-demo-api-example-com
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the ratelimit-demo-api-example-com-0 TrafficPolicy to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: default
            name: ratelimit-demo-api-example-com-0
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
