  content: |-
    {{< doc-test paths="migrate-header-modifiers" >}}
    # Test-only: every resource that the page applies exists. The backends are not in the
    # cluster, so the check stops at Accepted (no ResolvedRefs, no traffic).
    kubectl get gateway nginx -n default
    kubectl get httproute headers-demo-app-example-com -n default
    # The hand-applied HTTPRoute replaced the converted one: the filter and the match are both there.
    test "$(kubectl get httproute headers-demo-app-example-com -n default -o jsonpath='{.spec.rules[0].filters[0].requestHeaderModifier.set[0].name}={.spec.rules[0].filters[0].requestHeaderModifier.set[0].value}')" = "X-Environment=production"
    test "$(kubectl get httproute headers-demo-app-example-com -n default -o jsonpath='{.spec.rules[0].matches[0].path.value}')" = "/"
    YAMLTest -f - <<'EOF'
    - name: wait for the headers-demo-app-example-com HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: headers-demo-app-example-com
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
