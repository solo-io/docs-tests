    {{< doc-test paths="migrate-backend-tls" >}}
    # Test-only: the converted file has what the "After" section on this page shows.
    python3 - <<'PY'
    import sys
    import yaml

    FILE = "backend-tls-kgateway.yaml"
    with open(FILE) as f:
        docs = [d for d in yaml.safe_load_all(f) if d]


    def find(kind, name):
        for d in docs:
            if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name:
                return d
        found = ", ".join(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)
        sys.exit(f"FAIL: {FILE} has no {kind} named {name}. Found: {found}")


    def expect(what, got, want):
        if got != want:
            sys.exit(f"FAIL: {what} is {got!r}, expected {want!r}")


    def kinds():
        return sorted(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)

    expect("resources", kinds(), ["BackendConfigPolicy/secure-api-backend-config", "Gateway/nginx", "HTTPRoute/backend-tls-demo-app-example-com"])
    gw = find("Gateway", "nginx")
    gspec = gw.get("spec") or {}
    expect("Gateway nginx gatewayClassName", gspec.get("gatewayClassName"), "kgateway")
    expect("Gateway nginx listeners", gspec.get("listeners"),
           [{"hostname": "app.example.com", "name": "app-example-com-http", "port": 80, "protocol": "HTTP"}])
    if "tls" in gspec:
        sys.exit("FAIL: Gateway nginx has spec.tls; the page shows none")
    route = find("HTTPRoute", "backend-tls-demo-app-example-com")
    rspec = route.get("spec") or {}
    expect("HTTPRoute hostnames", rspec.get("hostnames"), ["app.example.com"])
    expect("HTTPRoute parentRefs", rspec.get("parentRefs"), [{"name": "nginx"}])
    rules = rspec.get("rules") or []
    expect("HTTPRoute rule count", len(rules), 1)
    rule = rules[0]
    expect("HTTPRoute rules[0].name", rule.get("name"), "rule-0")
    expect("HTTPRoute rules[0].backendRefs", rule.get("backendRefs"), [{"name": "secure-api", "port": 443}])
    expect("HTTPRoute rules[0].matches", rule.get("matches"), [{"path": {"type": "PathPrefix", "value": "/api"}}])
    bcp = find("BackendConfigPolicy", "secure-api-backend-config")
    spec = bcp.get("spec") or {}
    expect("BackendConfigPolicy targetRefs", spec.get("targetRefs"),
           [{"group": "", "kind": "Service", "name": "secure-api"}])
    # The page shows exactly these TLS fields: no namespace on secretRef and no
    # insecureSkipVerify field.
    expect("BackendConfigPolicy tls", spec.get("tls"),
           {"secretRef": {"name": "backend-tls-secret"}, "sni": "internal-api.example.com"})
    print("OK: Gateway, HTTPRoute, and BackendConfigPolicy match the page")
    PY
    {{< /doc-test >}}
