    python3 - upload-kgateway.yaml <<'PY'
    import sys, yaml
    path = sys.argv[1]
    docs = [d for d in yaml.safe_load_all(open(path)) if d]
    def get(kind, name):
        for d in docs:
            if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name:
                return d
        have = ", ".join("%s/%s" % (d.get("kind"), (d.get("metadata") or {}).get("name")) for d in docs)
        sys.exit("FAIL: %s has no %s named %s. It has: %s" % (path, kind, name, have))
    def only(*want):
        have = sorted("%s/%s" % (d.get("kind"), (d.get("metadata") or {}).get("name")) for d in docs)
        if have != sorted(want):
            sys.exit("FAIL: %s has %s. The page shows %s." % (path, ", ".join(have), ", ".join(sorted(want))))
    def check(obj, field, want):
        cur = obj
        for key in field.split("."):
            try:
                cur = cur[int(key)] if key.isdigit() else cur[key]
            except (KeyError, IndexError, TypeError):
                sys.exit("FAIL: %s %s has no %s. The page shows %r." % (obj["kind"], obj["metadata"]["name"], field, want))
        if cur != want:
            sys.exit("FAIL: %s %s %s is %r. The page shows %r." % (obj["kind"], obj["metadata"]["name"], field, cur, want))
    def absent(obj, field):
        cur = obj
        for key in field.split("."):
            try:
                cur = cur[int(key)] if key.isdigit() else cur[key]
            except (KeyError, IndexError, TypeError):
                return
        sys.exit("FAIL: %s %s has %s. The page says it does not." % (obj["kind"], obj["metadata"]["name"], field))
    only("Gateway/nginx", "HTTPRoute/upload-demo-upload-example-com", "TrafficPolicy/upload-demo-upload-example-com")
    gw = get("Gateway", "nginx")
    check(gw, "spec.gatewayClassName", "kgateway")
    check(gw, "spec.listeners.0.hostname", "upload.example.com")
    check(gw, "spec.listeners.0.name", "upload-example-com-http")
    check(gw, "spec.listeners.0.port", 80)
    check(gw, "spec.listeners.0.protocol", "HTTP")
    rt = get("HTTPRoute", "upload-demo-upload-example-com")
    check(rt, "spec.hostnames.0", "upload.example.com")
    check(rt, "spec.parentRefs.0.name", "nginx")
    check(rt, "spec.rules.0.name", "rule-0")
    check(rt, "spec.rules.0.backendRefs.0.name", "upload-svc")
    check(rt, "spec.rules.0.backendRefs.0.port", 8080)
    check(rt, "spec.rules.0.matches.0.path.type", "PathPrefix")
    check(rt, "spec.rules.0.matches.0.path.value", '/')
    tp = get("TrafficPolicy", "upload-demo-upload-example-com")
    check(tp, "apiVersion", "gateway.kgateway.dev/v1alpha1")
    check(tp, "spec.targetRefs.0.group", "gateway.networking.k8s.io")
    check(tp, "spec.targetRefs.0.kind", "HTTPRoute")
    check(tp, "spec.targetRefs.0.name", "upload-demo-upload-example-com")
    check(tp, "spec.buffer.maxRequestSize", "20Mi")
    print("OK: %s matches the page's After section" % path)
    PY
    {{< /doc-test >}}
