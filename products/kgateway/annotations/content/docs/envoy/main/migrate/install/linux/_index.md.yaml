    {{< doc-test paths="install-ingress2gateway" >}}
    out=$(ingress2gateway version 2>&1)
    echo "$out"
    if ! grep -q "ingress2gateway version: ${VERSION}" <<<"$out"; then
      echo "FAIL: ingress2gateway on PATH does not report ${VERSION}"
      exit 1
    fi
