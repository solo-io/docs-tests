    {{< doc-test paths="install-ingress2gateway" >}}
    # Test-only: the page's example sets ARCH=arm64. Use the runner's architecture.
    case "$(uname -m)" in
      x86_64) ARCH=x86_64 ;;
      aarch64|arm64) ARCH=arm64 ;;
    esac
    echo "ingress2gateway: OS=$OS ARCH=$ARCH VERSION=$VERSION"
    {{< /doc-test >}}
