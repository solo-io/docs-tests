    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="listenerpolicy" >}}
    # The policy's `default` section applies to every listener on the http Gateway,
    # so each dynamic listener in the proxy's config dump carries the 1024-byte
    # per-connection buffer limit.
    limits=""
    for i in $(seq 1 30); do
      limits=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- 127.0.0.1:19000/config_dump \
        | jq -r '.configs[] | select(.["@type"] == "type.googleapis.com/envoy.admin.v3.ListenersConfigDump")
            | .dynamic_listeners[]? | "\(.name)=\(.active_state.listener.per_connection_buffer_limit_bytes // "unset")"') || true
      echo "listener buffer limits: ${limits:-none}"
      if [ -n "$limits" ] && ! grep -qv '=1024$' <<<"$limits"; then break; fi
      echo "not every Gateway listener has per_connection_buffer_limit_bytes 1024 yet, retrying ($i/30)"; sleep 2
    done
    if [ -z "$limits" ] || grep -qv '=1024$' <<<"$limits"; then
      echo "FAIL: the bufferlimits ListenerPolicy did not set per_connection_buffer_limit_bytes to 1024 on every listener of the http Gateway"
      exit 1
    fi
    # Traffic still flows through the listener with the smaller buffer.
    code=""
    for i in $(seq 1 30); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") || true
      [ "$code" = "200" ] && break
      echo "request through the http listener returned '${code}', want 200, retrying ($i/30)"; sleep 2
    done
    [ "$code" = "200" ] || { echo "FAIL: requests through the http Gateway listener do not return 200 after the ListenerPolicy"; exit 1; }
    {{< /doc-test >}}
