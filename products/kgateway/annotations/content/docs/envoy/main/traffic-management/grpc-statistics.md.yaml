  content: |-
    {{< doc-test paths="grpc-statistics" >}}
    # Ping still gets its own per-method counters; the reflection calls count only
    # in the aggregate grpc.* stats, not under ServerReflectionInfo by name.
    gs_allow_ok=false
    for i in $(seq 1 30); do
      gs_ping_after=$(gs_stat 'grpc\.yages\.Echo\.Ping\.total')
      gs_refl_after=$(gs_stat 'grpc\.grpc\.reflection\.v1alpha\.ServerReflection\.ServerReflectionInfo\.total')
      gs_agg_after=$(gs_stat 'grpc\.total')
      gs_agg_ok=$(gs_stat 'grpc\.0')
      if [ "${gs_ping_after:-0}" -ge $(( ${gs_ping_before:-0} + 1 )) ] 2>/dev/null \
          && [ "${gs_agg_after:-0}" -ge $(( ${gs_agg_before:-0} + 2 )) ] 2>/dev/null \
          && [ "${gs_agg_ok:-0}" -ge 2 ] 2>/dev/null; then
        gs_allow_ok=true
        break
      fi
      sleep 2
    done
    if [ "$gs_allow_ok" != true ]; then
      echo "grpc-statistics allow list: expected Ping.total to rise by 1 and the aggregate grpc.total to rise by 2 (the two reflection calls)"
      echo "Ping.total ${gs_ping_before:-missing} -> ${gs_ping_after:-missing}; grpc.total ${gs_agg_before:-missing} -> ${gs_agg_after:-missing}; grpc.0=${gs_agg_ok:-missing}"
      kubectl exec -n kgateway-system deploy/grpc -- wget -qO- "http://127.0.0.1:19000/stats" 2>/dev/null | grep -E '^cluster\.kube_.*\.grpc\.' || true
      exit 1
    fi
    if [ "${gs_refl_after:-0}" != "${gs_refl_before:-0}" ]; then
      echo "grpc-statistics allow list: ServerReflectionInfo.total changed from ${gs_refl_before:-missing} to ${gs_refl_after:-missing}, but the method is not in methodAllowlist"
      exit 1
    fi
    echo "grpc-statistics allow list: Ping.total ${gs_ping_before:-0} -> $gs_ping_after, grpc.total ${gs_agg_before:-0} -> $gs_agg_after, ServerReflectionInfo.total unchanged at ${gs_refl_after:-missing}"
    {{< /doc-test >}}
