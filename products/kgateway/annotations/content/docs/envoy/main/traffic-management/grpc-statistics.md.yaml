      preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="grpc-statistics" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the grpc-stats ListenerPolicy (statsForAllMethods) to be accepted
      wait:
        target:
          kind: ListenerPolicy
          metadata:
            namespace: kgateway-system
            name: grpc-stats
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only helpers. The page port-forwards the admin port of the grpc gateway
    # proxy; the test reads the same admin endpoints with kubectl exec instead.
    # gs_filters prints the HTTP filters of the grpc proxy's listeners as compact
    # JSON, one filter chain per line.
    gs_filters() {
      kubectl exec -n kgateway-system deploy/grpc -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_listeners" 2>/dev/null | python3 -c '
    import json, sys
    def walk(o):
        if isinstance(o, dict):
            if isinstance(o.get("http_filters"), list):
                print(json.dumps(o["http_filters"], separators=(",", ":"), sort_keys=True))
            for v in o.values():
                walk(v)
        elif isinstance(o, list):
            for v in o:
                walk(v)
    try:
        walk(json.load(sys.stdin))
    except Exception:
        pass
    ' || true
    }
    # gs_check_filter <label> <python expression on cfg>: wait until a filter chain
    # has envoy.filters.http.grpc_stats before envoy.filters.http.router and the
    # grpc_stats typed_config (cfg) satisfies the expression.
    gs_check_filter() {
      local label="$1" expr="$2" i out
      for i in $(seq 1 60); do
        out=$(gs_filters | GS_EXPR="$expr" python3 -c '
    import json, os, sys
    for line in sys.stdin:
        chain = json.loads(line)
        names = [f.get("name") for f in chain]
        if "envoy.filters.http.grpc_stats" in names and "envoy.filters.http.router" in names \
                and names.index("envoy.filters.http.grpc_stats") < names.index("envoy.filters.http.router"):
            cfg = chain[names.index("envoy.filters.http.grpc_stats")].get("typed_config", {})
            if eval(os.environ["GS_EXPR"]):
                print(json.dumps(cfg, sort_keys=True))
                break
    ' || true)
        if [ -n "$out" ]; then echo "$label: $out"; return 0; fi
        sleep 5
      done
      echo "$label: no listener on the grpc proxy has grpc_stats before router with: $expr"
      gs_filters
      exit 1
    }
    # gs_stat <stat name suffix after the grpc-echo-svc cluster name>: print the
    # counter value, or nothing when Envoy has not created that stat.
    gs_stat() {
      kubectl exec -n kgateway-system deploy/grpc -- wget -qO- "http://127.0.0.1:19000/stats" 2>/dev/null \
        | grep -E "^cluster\.kube_[^ ]*grpc-echo-svc_3000\.$1: " | head -1 | sed 's/.*: //' || true
    }
    gs_check_filter "grpc-statistics all methods" 'cfg.get("stats_for_all_methods") is True and cfg.get("enable_upstream_stats") is True'
    {{< /doc-test >}}
