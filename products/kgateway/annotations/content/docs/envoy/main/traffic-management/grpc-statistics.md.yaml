  content: |-
    {{< doc-test paths="grpc-statistics" >}}
    # Per-method stats for both the reflection call and Ping, with gRPC status 0,
    # and the upstream latency histogram from enableUpstreamStats.
    gs_all_ok=false
    for i in $(seq 1 30); do
      ping_success=$(gs_stat 'grpc\.yages\.Echo\.Ping\.success')
      ping_ok=$(gs_stat 'grpc\.yages\.Echo\.Ping\.0')
      refl_total=$(gs_stat 'grpc\.grpc\.reflection\.v1alpha\.ServerReflection\.ServerReflectionInfo\.total')
      ping_rq_time=$(gs_stat 'grpc\.yages\.Echo\.Ping\.upstream_rq_time')
      if [ "${ping_success:-0}" -ge 1 ] 2>/dev/null && [ "${ping_ok:-0}" -ge 1 ] 2>/dev/null \
          && [ "${refl_total:-0}" -ge 1 ] 2>/dev/null && [ -n "$ping_rq_time" ]; then
        gs_all_ok=true
        break
      fi
      sleep 2
    done
    if [ "$gs_all_ok" != true ]; then
      echo "grpc-statistics all methods: expected per-method grpc stats on the grpc-echo-svc cluster"
      echo "Ping.success=${ping_success:-missing} Ping.0=${ping_ok:-missing} ServerReflectionInfo.total=${refl_total:-missing} Ping.upstream_rq_time=${ping_rq_time:-missing}"
      kubectl exec -n kgateway-system deploy/grpc -- wget -qO- "http://127.0.0.1:19000/stats" 2>/dev/null | grep -E '^cluster\.kube_.*\.grpc\.' || true
      exit 1
    fi
    echo "grpc-statistics all methods: Ping.success=$ping_success Ping.0=$ping_ok ServerReflectionInfo.total=$refl_total"
    {{< /doc-test >}}
