    {{< doc-test paths="proxy-protocol" >}}
    # Same check as the port-forward step, through the gateway proxy's admin port:
    # a dynamic (Gateway) listener carries the proxy_protocol listener filter.
    filters=""
    for i in $(seq 1 30); do
      filters=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- 127.0.0.1:19000/config_dump \
