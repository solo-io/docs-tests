    preview: '* Request completely sent off'
  content: |-
    {{< doc-test paths="proxy-protocol" >}}
    # Without a PROXY header the listener closes the connection before any HTTP
    # response: curl gets no status code and fails with an empty reply (52) or a
    # reset (56).
    code=""; rc=0; ok=""
    for i in $(seq 1 30); do
      code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") && rc=0 || rc=$?
      if [ "$code" = "000" ] && { [ "$rc" = "52" ] || [ "$rc" = "56" ]; }; then ok=1; break; fi
      echo "request without a PROXY header returned '$code' (curl exit $rc), want no response, retrying ($i/30)"; sleep 2
    done
    if [ -z "$ok" ]; then
      echo "FAIL: request without a PROXY header returned '$code' (curl exit $rc), want an empty reply"
      exit 1
    fi
    {{< /doc-test >}}
