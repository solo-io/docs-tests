- after:
    block: 14
    fingerprint: 96990f188789ce3e
    lang: console
    lines: 245843ab 021fb596 b5e2f688 a0f01a26 3f8b00c7 de5eb55d d10b36aa d10b36aa cfae0d42
    preview: '['
  content: |-
    {{< doc-test paths="proxy-protocol-readiness" >}}
    # Same check as the port-forward step, through the gateway proxy's admin port:
    # the static readiness listener on 8082 has the proxy_protocol filter with
    # allow_requests_without_proxy_protocol.
    filter=""
    for i in $(seq 1 60); do
      filter=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- 127.0.0.1:19000/config_dump \
        | jq -c '.configs[] | select(.["@type"] == "type.googleapis.com/envoy.admin.v3.ListenersConfigDump")
            | .static_listeners[].listener | select(.address.socket_address.port_value == 8082)
            | .listener_filters[]? | select(.name == "envoy.filters.listener.proxy_protocol")') || true
      grep -q '"allow_requests_without_proxy_protocol":true' <<<"$filter" && break
      echo "readiness listener has no proxy_protocol filter yet, retrying ($i/60)"; sleep 5
    done
    echo "$filter"
    if ! grep -q '"allow_requests_without_proxy_protocol":true' <<<"$filter"; then
      echo "FAIL: the readiness listener on 8082 has no proxy_protocol filter with allow_requests_without_proxy_protocol: true"
      echo "(the bootstrap is read at Envoy start; the proxy pod might need a restart to pick up the GatewayParameters change)"
      exit 1
    fi
    # A load balancer health check with a PROXY header, and a plain one, both
    # reach /ready on 8082 through the gateway Service.
    INGRESS_GW_ADDRESS=$(kubectl get svc -n kgateway-system http -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
    for flag in --haproxy-protocol ""; do
      code=""
      for i in $(seq 1 30); do
        code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' $flag "http://${INGRESS_GW_ADDRESS}:8082/ready") || true
        [ "$code" = "200" ] && break
        echo "readiness check ${flag:-without a PROXY header} returned '$code', retrying ($i/30)"; sleep 2
      done
      if [ "$code" != "200" ]; then
        echo "FAIL: GET :8082/ready ${flag:-without a PROXY header} returned '$code', want 200"
        exit 1
      fi
    done
    {{< /doc-test >}}
