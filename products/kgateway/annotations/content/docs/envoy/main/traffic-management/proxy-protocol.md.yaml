  content: |-
    {{< doc-test paths="proxy-protocol-upstream" >}}
    # The nc echo server never answers with HTTP, so the gateway proxy returns 503.
    code=""
    for i in $(seq 1 30); do
      code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/" -H "host: echo.example.com") || true
      [ "$code" = "503" ] && break
      echo "echo.example.com returned '$code', want 503, retrying ($i/30)"; sleep 2
    done
    if [ "$code" != "503" ]; then
      echo "FAIL: echo.example.com returned '$code', want 503"
      exit 1
    fi
    {{< /doc-test >}}
