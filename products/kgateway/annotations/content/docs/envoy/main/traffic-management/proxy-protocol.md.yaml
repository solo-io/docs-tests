    preview: PROXY TCP4 10.244.X.X 10.245.X.X 16329 8080
  content: |-
    {{< doc-test paths="proxy-protocol-upstream" >}}
    # The echo pod logs must start a connection with a PROXY protocol v1 line for
    # the gateway listener port, followed by the forwarded HTTP request.
    logs=""
    for i in $(seq 1 15); do
      logs=$(kubectl logs proxy-echo -n default) || true
      grep -Eq '^PROXY TCP4 [0-9.]+ [0-9.]+ [0-9]+ 8080' <<<"$logs" && break
      sleep 2
    done
    printf '%s\n' "$logs"
    if ! grep -Eq '^PROXY TCP4 [0-9.]+ [0-9.]+ [0-9]+ 8080' <<<"$logs"; then
      echo "FAIL: no 'PROXY TCP4 <src> <dst> <port> 8080' line in the proxy-echo logs"
      exit 1
    fi
    if ! grep -Fiq 'host: echo.example.com' <<<"$logs"; then
      echo "FAIL: the proxy-echo logs do not show the forwarded HTTP request for echo.example.com"
      exit 1
    fi
    {{< /doc-test >}}
