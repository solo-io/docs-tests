      grep -qx 'envoy.filters.listener.proxy_protocol' <<<"$filters" && break
      echo "proxy_protocol listener filter not on the Gateway listener yet, retrying ($i/30)"; sleep 2
    done
    if ! grep -qx 'envoy.filters.listener.proxy_protocol' <<<"$filters"; then
      echo "FAIL: no envoy.filters.listener.proxy_protocol filter on the Gateway listeners"
      exit 1
    fi
    {{< /doc-test >}}
- after:
