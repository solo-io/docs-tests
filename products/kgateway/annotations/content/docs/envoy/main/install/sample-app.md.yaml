  content: |-
    {{< doc-test paths="install-httpbin" >}}
    for i in $(seq 1 60); do
      curl -s --max-time 5 -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080" && break
      sleep 2
    done
    YAMLTest -f - <<'EOF'
    - name: verify httpbin returns 200 for www.example.com
      retries: 1
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
