    preview: '{'
  content: |-
    {{< doc-test paths="sample-app" >}}
    # Step 2 of the Cloud Provider LoadBalancer tab: the request to www.example.com
    # returns 200 from httpbin through the Envoy gateway proxy, and httpbin echoes
    # the request headers back.
    headers=$(mktemp); body=$(mktemp); code=""
    for i in $(seq 1 60); do
      code=$(curl -s --max-time 5 -D "$headers" -o "$body" -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") || true
      [ "$code" = "200" ] && break
      echo "GET /headers returned '$code', want 200, retrying ($i/60)"; sleep 2
    done
    cat "$headers"; cat "$body"
    if [ "$code" != "200" ]; then
      echo "FAIL: GET http://\${INGRESS_GW_ADDRESS}:8080/headers with host www.example.com:8080 returned $code, want 200"
      exit 1
    fi
    if ! grep -qi '^server: envoy' "$headers"; then
      echo "FAIL: the response has no 'server: envoy' header, so it did not come through the gateway proxy"
      exit 1
    fi
    if ! python3 -c 'import json,sys; h=json.load(open(sys.argv[1]))["headers"]; sys.exit(0 if any("www.example.com" in v for v in h.get("Host",[])) else 1)' "$body"; then
      echo "FAIL: httpbin did not echo a Host header of www.example.com"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 23
    fingerprint: 9b8b92ebc0a9d25f
    lang: sh
    lines: 9b8b92eb
    preview: kubectl delete gateway http -n {{< reuse "kgw-docs/snippets/namespace.md" >}}
  content: |-
    {{< doc-test paths="sample-app" >}}
    # Cleanup removed the httpbin namespace (and the HTTPRoute in it) and the http
    # Gateway with its proxy deployment. Step 2 is not run: deleting the httpbin
    # namespace in step 1 already deletes the HTTPRoute.
    for i in $(seq 1 60); do
      if ! kubectl get namespace httpbin >/dev/null 2>&1 && ! kubectl get deployment http -n kgateway-system >/dev/null 2>&1; then break; fi
      echo "waiting for the httpbin namespace and the http proxy deployment to be deleted ($i/60)"; sleep 5
    done
    if kubectl get namespace httpbin >/dev/null 2>&1; then
      echo "FAIL: the httpbin namespace still exists after cleanup"
      exit 1
    fi
    if kubectl get gateway http -n kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the http Gateway still exists after cleanup"
      exit 1
    fi
    if kubectl get deployment http -n kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the http gateway proxy deployment still exists after cleanup"
      exit 1
    fi
    {{< /doc-test >}}
