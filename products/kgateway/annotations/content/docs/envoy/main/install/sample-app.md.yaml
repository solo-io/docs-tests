  content: |-
    {{< doc-test paths="sample-app" >}}
    # The httpbin pod runs with both of its containers ready (2/2), as in the example output.
    pods=""
    for i in $(seq 1 60); do
      pods=$(kubectl get pods -n httpbin -l app=httpbin \
        -o jsonpath='{range .items[*]}{.status.phase}{" "}{.status.containerStatuses[*].ready}{"\n"}{end}')
      grep -q '^Running true true$' <<<"$pods" && break
      echo "httpbin pods not Running 2/2 yet: '$pods' ($i/60)"; sleep 5
    done
    if ! grep -q '^Running true true$' <<<"$pods"; then
      echo "FAIL: no httpbin pod is Running with 2/2 containers ready"
      exit 1
    fi
    {{< /doc-test >}}
