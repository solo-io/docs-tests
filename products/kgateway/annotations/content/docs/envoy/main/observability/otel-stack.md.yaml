    preview: < HTTP/1.1 418 Unknown
  content: |-
    {{< doc-test paths="otel-stack" >}}
    # Send the page's requests until the access logs reach the logs collector and
    # the spans reach the traces collector. The debug exporter prints both.
    logs=0; traces=0
    for i in $(seq 1 30); do
      for j in 1 2 3 4 5; do
        curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/status/418" -H "host: www.example.com:8080" || true
      done
      sleep 5
      out=$(kubectl -n telemetry logs deploy/opentelemetry-collector-logs 2>/dev/null || true)
      logs=$(grep -c '/status/418' <<<"$out" || true)
      out=$(kubectl -n telemetry logs deploy/opentelemetry-collector-traces 2>/dev/null || true)
      traces=$(grep -c 'http.status_code: Str(418)' <<<"$out" || true)
      echo "attempt $i: $logs access log lines, $traces spans with status 418"
      [ "$logs" -ge 5 ] && [ "$traces" -ge 1 ] && break
    done
    [ "$logs" -ge 5 ] || { echo "the logs collector did not receive the gateway access logs"; exit 1; }
    [ "$traces" -ge 1 ] || { echo "the traces collector did not receive the gateway spans"; exit 1; }
    {{< /doc-test >}}
- after:
    block: 6
    fingerprint: 8d0f2ea68c68e089
    lang: ''
    lines: cd58cf30 fe260b1b ab5df625
    preview: < HTTP/1.1 418 Unknown
  content: |-
    {{< doc-test paths="otel-stack" >}}
    # The collectors export to the storage backends. Query Loki and Tempo from the
    # curl pod that the Prometheus check started.
    loki=""
    for i in $(seq 1 36); do
      loki=$(kubectl -n telemetry exec otel-stack-check -- curl -sfG \
        http://loki.telemetry.svc.cluster.local:3100/loki/api/v1/query_range \
        --data-urlencode 'query={service_name=~".+"} |= "/status/418"' \
        --data-urlencode 'since=1h' --data-urlencode 'limit=5' 2>/dev/null || true)
      [[ "$loki" == *'/status/418'* ]] && break
      echo "attempt $i: Loki has no /status/418 access log yet: ${loki:0:200}"
      sleep 5
    done
    [[ "$loki" == *'/status/418'* ]] || { echo "Loki did not store the gateway access logs"; exit 1; }
    tempo=""
    for i in $(seq 1 36); do
      tempo=$(kubectl -n telemetry exec otel-stack-check -- curl -sfG \
        http://tempo.telemetry.svc.cluster.local:3100/api/search \
        --data-urlencode 'q={ resource.service.name = "http" }' --data-urlencode 'limit=5' 2>/dev/null || true)
      [[ "$tempo" == *'"traceID"'* ]] && break
      echo "attempt $i: Tempo has no traces for service http yet: ${tempo:0:200}"
      sleep 5
    done
    [[ "$tempo" == *'"traceID"'* ]] || { echo "Tempo did not store the gateway traces"; exit 1; }
    {{< /doc-test >}}
