  content: |-
    {{< doc-test paths="migrate-client-tls" >}}
    # Test-only: every resource that the page applies exists, and the HTTPRoute
    # is Accepted.
    # The Gateway from mtls-gateway.yaml keeps its frontend TLS settings, and
    # its HTTPS listener resolves the server certificate and the client CA.
    # The secret-svc backend is not deployed, so backend refs are not checked.
    python3 - <<'PY'
    import json
    import subprocess
    import sys
    import time

    import yaml

    FILES = ['mtls-kgateway.yaml', 'mtls-gateway.yaml']
    docs = []
    for name in FILES:
        with open(name) as f:
            docs += [d for d in yaml.safe_load_all(f) if d]
    # Kind/name pairs that only need to exist, not be Accepted. See the comment above.
    EXIST_ONLY = []


    def accepted(conditions):
        for c in conditions or []:
            if c.get("type") == "Accepted":
                return c.get("status")
        return None


    def get(kind, name, api_version):
        group = api_version.rsplit("/", 1)[0] if "/" in api_version else ""
        resource = f"{kind.lower()}.{group}" if group else kind.lower()
        out = subprocess.run(["kubectl", "get", resource, name, "-n", "default", "-o", "json"],
                             capture_output=True, text=True)
        if out.returncode != 0:
            return None, out.stderr.strip()
        return json.loads(out.stdout), None


    def problem(d):
        kind, name = d["kind"], d["metadata"]["name"]
        obj, err = get(kind, name, d["apiVersion"])
        if obj is None:
            return f"{kind}/{name} not found: {err}"
        if f"{kind}/{name}" in EXIST_ONLY:
            return None
        status = obj.get("status") or {}
        if kind == "HTTPRoute":
            parents = status.get("parents") or [{}]
            if accepted(parents[0].get("conditions")) != "True":
                return f"HTTPRoute/{name} is not Accepted yet: {parents[0].get('conditions')}"
        if kind == "TrafficPolicy":
            ancestors = status.get("ancestors") or [{}]
            if accepted(ancestors[0].get("conditions")) != "True":
                return f"TrafficPolicy/{name} is not Accepted yet: {ancestors[0].get('conditions')}"
        return None


    def gateway_problems():
        # The applied Gateway keeps spec.tls.frontend (the API server did not drop
        # it), and the HTTPS listener resolved the server certificate and the CA.
        obj, err = get("Gateway", "nginx", "gateway.networking.k8s.io/v1")
        if obj is None:
            return [f"Gateway/nginx not found: {err}"]
        out = []
        frontend = ((obj.get("spec") or {}).get("tls") or {}).get("frontend") or {}
        validation = (frontend.get("default") or {}).get("validation") or {}
        refs = validation.get("caCertificateRefs") or []
        if [r.get("name") for r in refs] != ["client-ca"]:
            out.append(f"Gateway/nginx spec.tls.frontend.default.validation.caCertificateRefs is {refs!r}")
        listeners = {l.get("name"): l for l in (obj.get("status") or {}).get("listeners") or []}
        https = listeners.get("secure-example-com-https")
        if https is None:
            out.append(f"Gateway/nginx has no status for listener secure-example-com-https yet: {sorted(listeners)}")
        else:
            for cond in ("Accepted", "ResolvedRefs"):
                got = [c.get("status") for c in https.get("conditions") or [] if c.get("type") == cond]
                if got != ["True"]:
                    out.append(f"Gateway/nginx listener secure-example-com-https {cond} is {got}: {https.get('conditions')}")
        return out

    for attempt in range(60):
        problems = [p for p in map(problem, docs) if p]
        problems += gateway_problems()
        if not problems:
            print(f"OK: all {len(docs)} resources from {', '.join(FILES)} exist and have the expected status")
            sys.exit(0)
        time.sleep(5)
    sys.exit("FAIL: " + "; ".join(problems))
    PY
    {{< /doc-test >}}
