  content: |-
    {{< doc-test paths="migrate-client-tls" >}}
    # Test-only: create the two Secrets that mtls-gateway.yaml refers to, as the
    # text before the code block says. client-ca holds a CA certificate under the
    # ca.crt key, as for the Ingress NGINX auth-tls-secret annotation.
    # server-cert is a TLS Secret for secure.example.com, signed by that CA.
    mkdir -p mtls_certs
    openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Test CA/O=Test Org" \
      -keyout mtls_certs/ca.key -out mtls_certs/ca.crt
    openssl req -newkey rsa:2048 -nodes -subj "/CN=secure.example.com/O=Test Org" \
      -keyout mtls_certs/server.key -out mtls_certs/server.csr
    printf 'subjectAltName=DNS:secure.example.com\n' > mtls_certs/server.ext
    openssl x509 -req -days 1 -in mtls_certs/server.csr -CA mtls_certs/ca.crt -CAkey mtls_certs/ca.key \
      -CAcreateserial -extfile mtls_certs/server.ext -out mtls_certs/server.crt
    kubectl create secret generic client-ca -n default --from-file=ca.crt=mtls_certs/ca.crt \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret tls server-cert -n default --cert=mtls_certs/server.crt --key=mtls_certs/server.key \
      --dry-run=client -o yaml | kubectl apply -f -
    {{< /doc-test >}}
