  content: |-
    {{< doc-test paths="migrate-api-key-auth" >}}
    # Test-only: check that the converted file has what the page's After section shows.
    python3 - api-key-kgateway.yaml <<'PY'
    import sys, yaml
    path = sys.argv[1]
    docs = [d for d in yaml.safe_load_all(open(path)) if d]
    errors = []
    MISSING = object()  # a named object that is not in the file; its field checks are skipped
    def find(kind, name):
        for d in docs:
            if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name:
                return d
        have = ", ".join(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)
        errors.append(f"no {kind} named {name!r} in {path} (found: {have})")
        return MISSING
    def get(obj, *keys):
        if obj is MISSING:
            return MISSING
        for k in keys:
            if isinstance(obj, dict):
                obj = obj.get(k)
            elif isinstance(obj, list) and isinstance(k, int) and k < len(obj):
                obj = obj[k]
            else:
                return None
        return obj
    def expect(label, got, want):
        if got is not MISSING and got != want:
            errors.append(f"{label}: expected {want!r}, got {got!r}")
    # The page lists exactly these resources, in this order.
    got_objs = [(d.get("kind"), (d.get("metadata") or {}).get("name")) for d in docs]
    expect("resources in the file (kind, name)", got_objs, [('Gateway', 'nginx'), ('HTTPRoute', 'api-key-demo-api-example-com')])
    gw = find("Gateway", "nginx")
    expect("Gateway nginx spec.gatewayClassName", get(gw, "spec", "gatewayClassName"), "kgateway")
    expect("Gateway nginx spec.listeners", get(gw, "spec", "listeners"), [{"hostname": "api.example.com", "name": "api-example-com-http", "port": 80, "protocol": "HTTP"}])
    rt = find("HTTPRoute", "api-key-demo-api-example-com")
    expect("HTTPRoute spec.hostnames", get(rt, "spec", "hostnames"), ["api.example.com"])
    expect("HTTPRoute spec.parentRefs[0].name", get(rt, "spec", "parentRefs", 0, "name"), "nginx")
    expect("HTTPRoute spec.rules[0].name", get(rt, "spec", "rules", 0, "name"), "rule-0")
    expect("HTTPRoute spec.rules[0].matches[0].path", get(rt, "spec", "rules", 0, "matches", 0, "path"), {"type": "PathPrefix", "value": "/"})
    expect("HTTPRoute spec.rules[0].backendRefs", get(rt, "spec", "rules", 0, "backendRefs"), [{"name": "httpbin", "port": 8000}])
    # The page says the tool drops the configuration-snippet: no TrafficPolicy, no filters.
    if rt is not MISSING and get(rt, "spec", "rules", 0, "filters"):
        errors.append(f"HTTPRoute spec.rules[0].filters: expected none, got {get(rt, 'spec', 'rules', 0, 'filters')!r}")
    if errors:
        print(f"FAIL: {path} does not match the page's After section:")
        for e in errors:
            print("  - " + e)
        sys.exit(1)
    print(f"{path} matches the page's After section")
    PY
    {{< /doc-test >}}
