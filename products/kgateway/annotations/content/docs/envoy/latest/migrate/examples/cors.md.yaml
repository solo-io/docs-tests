  content: |-
    {{< doc-test paths="migrate-cors" >}}
    # Test-only: every resource that the page applies exists, and the HTTPRoute
    # is Accepted. The TrafficPolicy has no dependencies, so it must be
    # Accepted too. The api-service backend is not deployed, so backend refs
    # are not checked.
    python3 - <<'PY'
    import json
    import subprocess
    import sys
    import time

    import yaml

    FILES = ['cors-kgateway.yaml']
    docs = []
    for name in FILES:
        with open(name) as f:
            docs += [d for d in yaml.safe_load_all(f) if d]
    # Kind/name pairs that only need to exist, not be Accepted. See the comment above.
    EXIST_ONLY = []


    def accepted(conditions):
        for c in conditions or []:
            if c.get("type") == "Accepted":
                return c.get("status")
        return None


    def get(kind, name, api_version):
        group = api_version.rsplit("/", 1)[0] if "/" in api_version else ""
        resource = f"{kind.lower()}.{group}" if group else kind.lower()
        out = subprocess.run(["kubectl", "get", resource, name, "-n", "default", "-o", "json"],
                             capture_output=True, text=True)
        if out.returncode != 0:
            return None, out.stderr.strip()
        return json.loads(out.stdout), None


    def problem(d):
        kind, name = d["kind"], d["metadata"]["name"]
        obj, err = get(kind, name, d["apiVersion"])
        if obj is None:
            return f"{kind}/{name} not found: {err}"
        if f"{kind}/{name}" in EXIST_ONLY:
            return None
        status = obj.get("status") or {}
        if kind == "HTTPRoute":
            parents = status.get("parents") or [{}]
            if accepted(parents[0].get("conditions")) != "True":
                return f"HTTPRoute/{name} is not Accepted yet: {parents[0].get('conditions')}"
        if kind == "TrafficPolicy":
            ancestors = status.get("ancestors") or [{}]
            if accepted(ancestors[0].get("conditions")) != "True":
                return f"TrafficPolicy/{name} is not Accepted yet: {ancestors[0].get('conditions')}"
        return None


    for attempt in range(60):
        problems = [p for p in map(problem, docs) if p]
        if not problems:
            print(f"OK: all {len(docs)} resources from {', '.join(FILES)} exist and have the expected status")
            sys.exit(0)
        time.sleep(5)
    sys.exit("FAIL: " + "; ".join(problems))
    PY
    {{< /doc-test >}}
