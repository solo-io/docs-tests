    {{< doc-test paths="migrate-cors" >}}
    # Test-only: the converted file has what the "After" section on this page shows.
    python3 - <<'PY'
    import sys
    import yaml

    FILE = "cors-kgateway.yaml"
    with open(FILE) as f:
        docs = [d for d in yaml.safe_load_all(f) if d]


    def find(kind, name):
        for d in docs:
            if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name:
                return d
        found = ", ".join(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)
        sys.exit(f"FAIL: {FILE} has no {kind} named {name}. Found: {found}")


    def expect(what, got, want):
        if got != want:
            sys.exit(f"FAIL: {what} is {got!r}, expected {want!r}")


    def kinds():
        return sorted(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)

    expect("resources", kinds(), ["Gateway/nginx", "HTTPRoute/cors-demo-api-example-com", "TrafficPolicy/cors-demo-api-example-com-0"])
    gw = find("Gateway", "nginx")
    gspec = gw.get("spec") or {}
    expect("Gateway nginx gatewayClassName", gspec.get("gatewayClassName"), "kgateway")
    expect("Gateway nginx listeners", gspec.get("listeners"),
           [{"hostname": "api.example.com", "name": "api-example-com-http", "port": 80, "protocol": "HTTP"}])
    if "tls" in gspec:
        sys.exit("FAIL: Gateway nginx has spec.tls; the page shows none")
    route = find("HTTPRoute", "cors-demo-api-example-com")
    rule = ((route.get("spec") or {}).get("rules") or [{}])[0]
    expect("HTTPRoute rules[0].name", rule.get("name"), "rule-0")
    expect("HTTPRoute rules[0].backendRefs", rule.get("backendRefs"), [{"name": "api-service", "port": 8080}])
    # The page says the tool adds a filter that removes Access-Control-* headers.
    expect("HTTPRoute rules[0].filters", rule.get("filters"), [{
        "type": "ResponseHeaderModifier",
        "responseHeaderModifier": {"remove": [
            "Access-Control-Allow-Origin", "Access-Control-Allow-Methods", "Access-Control-Allow-Headers",
            "Access-Control-Expose-Headers", "Access-Control-Max-Age", "Access-Control-Allow-Credentials"]}}])
    tp = find("TrafficPolicy", "cors-demo-api-example-com-0")
    spec = tp.get("spec") or {}
    expect("TrafficPolicy targetRefs", spec.get("targetRefs"), [{
        "group": "gateway.networking.k8s.io", "kind": "HTTPRoute",
        "name": "cors-demo-api-example-com", "sectionName": "rule-0"}])
    # The page says the tool adds allowCredentials: true, which is not in the Ingress.
    expect("TrafficPolicy cors", spec.get("cors"), {
        "allowCredentials": True,
        "allowHeaders": ["Authorization", "Content-Type"],
        "allowMethods": ["GET", "POST", "PUT", "DELETE", "OPTIONS"],
        "allowOrigins": ["https://example.com", "https://app.example.com"],
        "maxAge": 3600})
    print("OK: Gateway, HTTPRoute, and TrafficPolicy cors-demo-api-example-com-0 match the page")
    PY
    {{< /doc-test >}}
