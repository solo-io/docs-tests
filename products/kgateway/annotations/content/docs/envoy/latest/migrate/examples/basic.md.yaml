  content: |-
    {{< doc-test paths="migrate-basic" >}}
    # Test-only: every resource that the page applies exists. The backends are not in the
    # cluster, so the check stops at Accepted (no ResolvedRefs, no traffic).
    kubectl get gateway nginx -n default
    kubectl get httproute demo-localhost-demo-localdev-me -n default
    YAMLTest -f - <<'EOF'
    - name: wait for the demo-localhost-demo-localdev-me HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: demo-localhost-demo-localdev-me
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
