  content: |-
    {{< doc-test paths="migrate-timeouts" >}}
    # Test-only: the page's BackendConfigPolicy targets the slow-svc Service,
    # which the test cluster does not have. Without it the policy is never
    # accepted, so create an empty stand-in Service with the same name and port.
    kubectl get service slow-svc -n default >/dev/null 2>&1 || kubectl create service clusterip slow-svc -n default --tcp=80:80
    # Test-only: every resource in the converted file and every resource the page
    # creates by hand exists, and every route and policy is Accepted. No app runs
    # behind the Ingress's backends in the test cluster, so ResolvedRefs and
    # traffic are not checked.
    mig_resources=$(python3 - timeouts-kgateway.yaml <<'PY'
    import sys, yaml
    for d in yaml.safe_load_all(open(sys.argv[1])):
        if d:
            group = d["apiVersion"].split("/")[0]
            print("%s.%s/%s" % (d["kind"].lower(), group, d["metadata"]["name"]))
    PY
    )
    mig_resources="$mig_resources backendconfigpolicy.gateway.kgateway.dev/slow-svc-backend-config"
    for mig_res in $mig_resources; do
      kubectl get "$mig_res" -n default >/dev/null || { echo "FAIL: $mig_res was not created"; exit 1; }
      case "$mig_res" in
        httproute.*) mig_jp='{.status.parents[0].conditions[?(@.type=="Accepted")].status}' ;;
        trafficpolicy.*|backendconfigpolicy.*) mig_jp='{.status.ancestors[0].conditions[?(@.type=="Accepted")].status}' ;;
        *) echo "OK: $mig_res exists"; continue ;;
      esac
      mig_status=""
      for mig_try in $(seq 1 60); do
        mig_status=$(kubectl get "$mig_res" -n default -o jsonpath="$mig_jp" 2>/dev/null || true)
        [ "$mig_status" = "True" ] && break
        sleep 5
      done
      if [ "$mig_status" != "True" ]; then
        echo "FAIL: $mig_res is not Accepted after 5 minutes. Status:"
        kubectl get "$mig_res" -n default -o jsonpath='{.status}' || true
        exit 1
      fi
      echo "OK: $mig_res is Accepted"
    done
    # Test-only: the hand-authored BackendConfigPolicy sets the 15-second connect timeout
    # on the slow-svc Service.
    mig_ok=""
    for mig_try in $(seq 1 60); do
      if kubectl get backendconfigpolicy.gateway.kgateway.dev/slow-svc-backend-config -n default -o json | python3 -c '
    import json, sys
    r = json.load(sys.stdin)
    spec_ok = (r["spec"].get("connectTimeout") == "15s"
               and r["spec"]["targetRefs"][0].get("name") == "slow-svc")
    gen = r["metadata"]["generation"]
    status = r.get("status") or {}
    entries = (status.get("parents") or []) + (status.get("ancestors") or [])
    accepted = any(c.get("type") == "Accepted" and c.get("status") == "True" and c.get("observedGeneration") == gen
                   for e in entries for c in e.get("conditions") or [])
    sys.exit(0 if spec_ok and accepted else 1)
    '; then mig_ok=1; break; fi
      sleep 5
    done
    if [ -z "$mig_ok" ]; then
      echo "FAIL: backendconfigpolicy.gateway.kgateway.dev/slow-svc-backend-config does not have the page's settings, or is not Accepted for its current generation, after 5 minutes:"
      kubectl get backendconfigpolicy.gateway.kgateway.dev/slow-svc-backend-config -n default -o yaml || true
      exit 1
    fi
    echo "OK: backendconfigpolicy.gateway.kgateway.dev/slow-svc-backend-config has the page's settings and is Accepted"
    {{< /doc-test >}}
