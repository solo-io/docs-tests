  content: |-
    {{< doc-test paths="migrate-session-affinity" >}}
    # Test-only: the page's BackendConfigPolicy targets the my-app Service,
    # which the test cluster does not have. Without it the policy is never
    # accepted, so create an empty stand-in Service with the same name and port.
    kubectl get service my-app -n default >/dev/null 2>&1 || kubectl create service clusterip my-app -n default --tcp=8080:8080
    # Test-only: every resource in the converted file exists, and every route and
    # policy is Accepted. No app runs behind the Ingress's backends in the test
    # cluster, so ResolvedRefs and traffic are not checked.
    mig_resources=$(python3 - session-affinity-kgateway.yaml <<'PY'
    import sys, yaml
    for d in yaml.safe_load_all(open(sys.argv[1])):
        if d:
            group = d["apiVersion"].split("/")[0]
            print("%s.%s/%s" % (d["kind"].lower(), group, d["metadata"]["name"]))
    PY
    )
    for mig_res in $mig_resources; do
      kubectl get "$mig_res" -n default >/dev/null || { echo "FAIL: $mig_res was not created"; exit 1; }
      case "$mig_res" in
        httproute.*) mig_jp='{.status.parents[0].conditions[?(@.type=="Accepted")].status}' ;;
        trafficpolicy.*|backendconfigpolicy.*) mig_jp='{.status.ancestors[0].conditions[?(@.type=="Accepted")].status}' ;;
        *) echo "OK: $mig_res exists"; continue ;;
      esac
      mig_status=""
      for mig_try in $(seq 1 60); do
        mig_status=$(kubectl get "$mig_res" -n default -o jsonpath="$mig_jp" 2>/dev/null || true)
        [ "$mig_status" = "True" ] && break
        sleep 5
      done
      if [ "$mig_status" != "True" ]; then
        echo "FAIL: $mig_res is not Accepted after 5 minutes. Status:"
        kubectl get "$mig_res" -n default -o jsonpath='{.status}' || true
        exit 1
      fi
      echo "OK: $mig_res is Accepted"
    done
    {{< /doc-test >}}
