    {{< doc-test paths="migrate-external-auth" >}}
    # Test-only: the converted file has what the "After" section on this page shows.
    python3 - <<'PY'
    import sys
    import yaml

    FILE = "external-auth-kgateway.yaml"
    with open(FILE) as f:
        docs = [d for d in yaml.safe_load_all(f) if d]


    def find(kind, name):
        for d in docs:
            if d.get("kind") == kind and (d.get("metadata") or {}).get("name") == name:
                return d
        found = ", ".join(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)
        sys.exit(f"FAIL: {FILE} has no {kind} named {name}. Found: {found}")


    def expect(what, got, want):
        if got != want:
            sys.exit(f"FAIL: {what} is {got!r}, expected {want!r}")


    def kinds():
        return sorted(f"{d.get('kind')}/{(d.get('metadata') or {}).get('name')}" for d in docs)

    expect("resources", kinds(), ["Gateway/nginx", "GatewayExtension/ext-auth-demo-extauth", "HTTPRoute/ext-auth-demo-app-example-com", "TrafficPolicy/ext-auth-demo"])
    gw = find("Gateway", "nginx")
    gspec = gw.get("spec") or {}
    expect("Gateway nginx gatewayClassName", gspec.get("gatewayClassName"), "kgateway")
    expect("Gateway nginx listeners", gspec.get("listeners"),
           [{"hostname": "app.example.com", "name": "app-example-com-http", "port": 80, "protocol": "HTTP"}])
    if "tls" in gspec:
        sys.exit("FAIL: Gateway nginx has spec.tls; the page shows none")
    route = find("HTTPRoute", "ext-auth-demo-app-example-com")
    rspec = route.get("spec") or {}
    expect("HTTPRoute hostnames", rspec.get("hostnames"), ["app.example.com"])
    expect("HTTPRoute parentRefs", rspec.get("parentRefs"), [{"name": "nginx"}])
    rules = rspec.get("rules") or []
    expect("HTTPRoute rule count", len(rules), 1)
    rule = rules[0]
    expect("HTTPRoute rules[0].name", rule.get("name"), "rule-0")
    expect("HTTPRoute rules[0].backendRefs", rule.get("backendRefs"), [{"name": "protected-app", "port": 8080}])
    expect("HTTPRoute rules[0].matches", rule.get("matches"), [{"path": {"type": "PathPrefix", "value": "/"}}])
    ext = find("GatewayExtension", "ext-auth-demo-extauth")
    expect("GatewayExtension spec", ext.get("spec"), {"extAuth": {"httpService": {
        "authorizationResponse": {"headersToBackend": ["X-User-ID", "X-User-Email"]},
        "backendRef": {"name": "auth-service", "namespace": "auth", "port": 80},
        "pathPrefix": "/verify"}}})
    tp = find("TrafficPolicy", "ext-auth-demo")
    spec = tp.get("spec") or {}
    expect("TrafficPolicy targetRefs", spec.get("targetRefs"), [{
        "group": "gateway.networking.k8s.io", "kind": "HTTPRoute", "name": "ext-auth-demo-app-example-com"}])
    # The page says v0.5.0 writes an empty namespace here, which the CRD rejects.
    expect("TrafficPolicy extAuth.extensionRef", (spec.get("extAuth") or {}).get("extensionRef"),
           {"name": "ext-auth-demo-extauth", "namespace": ""})
    print("OK: Gateway, HTTPRoute, GatewayExtension, and TrafficPolicy match the page, with the empty namespace")
    PY
    {{< /doc-test >}}
