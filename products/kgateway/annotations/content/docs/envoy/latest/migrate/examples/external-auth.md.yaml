    python3 - <<'PY'
    import sys
    import yaml

    with open("external-auth-kgateway.yaml") as f:
        docs = [d for d in yaml.safe_load_all(f) if d]
    if len(docs) != 4:
        sys.exit(f"FAIL: expected 4 resources after the sed command, found {len(docs)}")
    tp = [d for d in docs if d.get("kind") == "TrafficPolicy"][0]
    ref = tp["spec"]["extAuth"]["extensionRef"]
    if ref != {"name": "ext-auth-demo-extauth"}:
        sys.exit(f"FAIL: TrafficPolicy extAuth.extensionRef is {ref!r} after the sed command")
    ext = [d for d in docs if d.get("kind") == "GatewayExtension"][0]
    if ext["spec"]["extAuth"]["httpService"]["backendRef"].get("namespace") != "auth":
        sys.exit("FAIL: the sed command changed the GatewayExtension backendRef namespace")
    print("OK: the empty namespace line is gone and nothing else changed")
