- after:
    block: 16
    fingerprint: a47b08e28644bff4
    lang: console
    lines: 2cf24dba 2cf24dba
    preview: hello
  content: |2-
       {{< doc-test paths="listeners-tcp,listeners-tcp-listenerset" >}}
       # Test-only: the page's nc session is interactive. Open a TCP connection with
       # bash instead, send one line, and expect the tcp-echo app to send it back.
       msg="hello-from-listeners-tcp"
       reply=""
       for i in $(seq 1 60); do
         reply=$(timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/8000" || exit 1; printf "%s\n" "$2" >&3; IFS= read -r -t 5 line <&3; printf "%s" "$line"' _ "${INGRESS_GW_ADDRESS}" "$msg" 2>/dev/null || true)
         case "$reply" in *"$msg"*) break ;; esac
         echo "listeners-tcp attempt $i: got '${reply:-no reply}', retrying"
         sleep 2
       done
       case "$reply" in
         *"$msg"*) echo "listeners-tcp: tcp-echo echoed '$reply' through port 8000 of tcp-gateway" ;;
         *) echo "listeners-tcp: no echo from tcp-echo through port 8000 of tcp-gateway"; exit 1 ;;
       esac
       {{< /doc-test >}}
