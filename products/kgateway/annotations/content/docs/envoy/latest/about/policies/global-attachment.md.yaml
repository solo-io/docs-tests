    preview: '{'
  content: |2-
       {{< doc-test paths="global-attachment" >}}
       # Before global attachment is on, the policy in kgateway-system cannot attach to
       # the HTTPRoute in httpbin, so the request is not rewritten. Wait until the
       # deleted same-namespace policy is gone (200), then confirm it stays 200.
       code=""
       for i in $(seq 1 60); do
         code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/anything" -H "host: www.example.com:8080" -H "transform: status") || true
         [ "$code" = "200" ] && break
         echo "cross-namespace policy check: got '${code}', want 200, retrying ($i/60)"; sleep 2
       done
       [ "$code" = "200" ] || { echo "FAIL: request with transform:status did not return 200 after moving the policy to kgateway-system"; exit 1; }
       sleep 5
       for i in $(seq 1 5); do
         code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/anything" -H "host: www.example.com:8080" -H "transform: status") || true
         [ "$code" = "200" ] || { echo "FAIL: the TrafficPolicy in kgateway-system attached to the httpbin HTTPRoute without global attachment (got ${code}, want 200)"; exit 1; }
       done
       {{< /doc-test >}}
