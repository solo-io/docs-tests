  content: |2-
       {{< doc-test paths="global-attachment" >}}
       # Steps 1 and 2 by script: the page's step 1 also runs `open`, which has no
       # meaning on a CI runner, and step 2 is a manual edit. Helm prints JSON, which is
       # valid YAML, so jq adds the setting without duplicating the `controller` key.
       helm get values kgateway -n kgateway-system -o json \
         | jq '.controller.extraEnv.KGW_GLOBAL_POLICY_NAMESPACE = "kgateway-system"' > kgateway.yaml
       cat kgateway.yaml
       {{< /doc-test >}}
