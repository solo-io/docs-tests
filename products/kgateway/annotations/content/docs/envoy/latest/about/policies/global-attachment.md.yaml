  content: |2-
       {{< doc-test paths="global-attachment" >}}
       kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
       global_ns=$(kubectl get deployment kgateway -n kgateway-system \
         -o jsonpath='{.spec.template.spec.containers[*].env[?(@.name=="KGW_GLOBAL_POLICY_NAMESPACE")].value}')
       echo "KGW_GLOBAL_POLICY_NAMESPACE=${global_ns}"
       if [ "$global_ns" != "kgateway-system" ]; then
         echo "FAIL: after the Helm upgrade, the kgateway control plane does not have KGW_GLOBAL_POLICY_NAMESPACE=kgateway-system"
         exit 1
       fi
       {{< /doc-test >}}
