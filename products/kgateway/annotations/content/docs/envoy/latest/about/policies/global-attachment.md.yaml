       {{< doc-test paths="global-attachment" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the transformation TrafficPolicy in the httpbin namespace (same namespace as the HTTPRoute) to be accepted
         wait:
           target:
             kind: TrafficPolicy
             metadata:
               namespace: httpbin
               name: transformation
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: same-namespace policy - the transform:status header rewrites /anything to /status/418
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080"
           path: /anything
           method: GET
           headers:
             host: "www.example.com:8080"
             transform: "status"
         source:
           type: local
         expect:
           statusCode: 418
       EOF
       {{< /doc-test >}}
