    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="local-replies" >}}
    YAMLTest -f - <<'EOF'
    - name: "local-replies - wait for the local-replies ListenerPolicy to be accepted"
      wait:
        target:
          kind: ListenerPolicy
          metadata:
            namespace: kgateway-system
            name: local-replies
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "local-replies - text defaultBodyFormat fills the 404 body"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/"
        method: GET
        headers:
          host: "no-such-host.example.com"
      source:
        type: local
      expect:
        statusCode: 404
        bodyRegex:
        - '^error 404: route_not_found'
    EOF
    {{< /doc-test >}}
