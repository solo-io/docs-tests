    YAMLTest -f - <<'EOF'
    - name: "local-replies - the 404 mapper body replaces the defaultBodyFormat body"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/"
        method: GET
        headers:
          host: "no-such-host.example.com"
      source:
        type: local
      expect:
        statusCode: 404
        headers:
        - name: content-type
          comparator: contains
          value: application/json
        bodyJsonPath:
        - path: "$.error"
          comparator: equals
          value: not found
        - path: "$.code"
          comparator: equals
          value: "404"
        - path: "$.message"
          comparator: exists
          negate: true
    EOF
