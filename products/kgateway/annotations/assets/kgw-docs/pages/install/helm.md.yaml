  content: |-
    {{< doc-test paths="helm,helm-experimental,helm-custom-values,helm-development" >}}
    # The controller creates the GatewayClass shortly after it starts, so wait for
    # it before the next step reads it.
    YAMLTest -f - <<'EOF'
    - name: wait for the controller to create and accept the kgateway GatewayClass
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: kgateway
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
