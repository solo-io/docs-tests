    YAMLTest -f - <<'EOF'
    - name: wait for the kgateway control plane deployment from the Helm install to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
