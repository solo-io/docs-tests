    preview: helm upgrade -i --create-namespace \
  content: |-
    {{< doc-test paths="helm,helm-experimental,helm-custom-values,helm-development" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the kgateway TrafficPolicy CRD from the kgateway-crds chart to be established
      wait:
        target:
          kind: CustomResourceDefinition
          metadata:
            name: trafficpolicies.gateway.kgateway.dev
        jsonPath: "$.status.conditions[?(@.type=='Established')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
