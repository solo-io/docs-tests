  content: |-
    {{< doc-test paths="advanced" >}}
    # Default: the chart does not set the variable to false, so the controller default (true) applies.
    current=$(kubectl get deployment kgateway -n kgateway-system \
      -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES")].value}')
    if [ -n "$current" ] && [ "$current" != "true" ]; then
      echo "FAIL: before any change, KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES is '$current', want unset or true"
      exit 1
    fi
    cat > advanced-experimental.yaml <<'EOF'
    controller:
      extraEnv:
        KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES: "false"
    EOF
    helm upgrade -i -n {{< reuse "kgw-docs/snippets/namespace.md" >}} {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}} \
      --reuse-values -f advanced-experimental.yaml
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
    YAMLTest -f - <<'EOF'
    - name: advanced - the experimental Gateway API features gate is set to false on the controller
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.spec.template.spec.containers[0].env[?(@.name=='KGW_ENABLE_EXPERIMENTAL_GATEWAY_API_FEATURES')].value"
        jsonPathExpectation:
          comparator: equals
          value: "false"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    EOF
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com") || true
      [ "$code" = "200" ] && break
      echo "experimental features disabled: httpbin returned '$code', want 200, retrying ($i/60)"; sleep 3
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: experimental features disabled: the httpbin route returned $code, want 200"
      exit 1
    fi
    {{< /doc-test >}}
- after:
