  content: |-
    {{< doc-test paths="advanced" >}}
    # In REFERENCED mode the controller reports the scoping metrics for the http Gateway,
    # and the http Gateway is scoped (disabled_gateways is 0).
    metrics=""
    for i in $(seq 1 40); do
      metrics=$(kubectl get --raw "/api/v1/namespaces/kgateway-system/services/kgateway:9092/proxy/metrics" 2>/dev/null) || true
      if grep -Eq '^kgateway_xds_scoping_disabled_gateways\{[^}]*gateway="http"[^}]*\} 0$' <<<"$metrics" \
        && grep -Eq '^kgateway_xds_snapshot_resources\{[^}]*gateway="http"[^}]*resource="Cluster"[^}]*\} [0-9]+' <<<"$metrics"; then
        break
      fi
      echo "xDS scoping metrics for the http Gateway not reported yet ($i/40)"; sleep 5
    done
    grep -E 'kgateway_xds_scoping|kgateway_xds_snapshot_resources.*Cluster' <<<"$metrics" || true
    if ! grep -Eq '^kgateway_xds_scoping_disabled_gateways\{[^}]*gateway="http"[^}]*\} 0$' <<<"$metrics"; then
      echo "FAIL: no kgateway_xds_scoping_disabled_gateways 0 for the http Gateway"
      exit 1
    fi
    if ! grep -Eq '^kgateway_xds_snapshot_resources\{[^}]*gateway="http"[^}]*resource="Cluster"[^}]*\} [0-9]+' <<<"$metrics"; then
      echo "FAIL: no kgateway_xds_snapshot_resources Cluster count for the http Gateway"
      exit 1
    fi
