- after:
    block: 7
    fingerprint: c0b0d8285c92a094
    lang: yaml
    lines: 5ca4dd17 66e29763 fa0b3e8e 4e3231ff db95f873 e11e2379 839a5cac c8a4ac81 617a04c7 1060ea7b
    preview: 'discoveryNamespaceSelectors:'
  content: |-
    {{< doc-test paths="advanced" >}}
    # Apply the example selectors, then check which namespaces the controller watches:
    # environment=prod plus version=v2 is selected, version=v3 is selected, and
    # environment=prod alone is not (the two labels in one entry are ANDed).
    cat > advanced-discovery.yaml <<'EOF'
    discoveryNamespaceSelectors:
    - matchExpressions:
      - key: environment
        operator: In
        values:
        - prod
      matchLabels:
        version: v2
    - matchLabels:
        version: v3
    EOF
    helm upgrade -i -n {{< reuse "kgw-docs/snippets/namespace.md" >}} {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}} \
      --reuse-values -f advanced-discovery.yaml
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
    selectors=$(kubectl get deployment kgateway -n kgateway-system \
      -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KGW_DISCOVERY_NAMESPACE_SELECTORS")].value}')
    echo "KGW_DISCOVERY_NAMESPACE_SELECTORS=$selectors"
    if ! grep -q '"v3"' <<<"$selectors" || ! grep -q '"prod"' <<<"$selectors"; then
      echo "FAIL: the discoveryNamespaceSelectors value did not reach KGW_DISCOVERY_NAMESPACE_SELECTORS"
      exit 1
    fi
    for ns in discovery-prod-v2:environment=prod,version=v2 discovery-v3:version=v3 discovery-prod-only:environment=prod; do
      name=${ns%%:*}; labels=${ns#*:}
      kubectl create namespace "$name" --dry-run=client -o yaml | kubectl apply -f -
      kubectl label namespace "$name" ${labels//,/ } --overwrite
      kubectl apply -f- <<EOF
    kind: Gateway
    apiVersion: gateway.networking.k8s.io/v1
    metadata:
      name: discovery-check
      namespace: $name
    spec:
      gatewayClassName: {{< reuse "/kgw-docs/snippets/gatewayclass.md" >}}
      listeners:
      - protocol: HTTP
        port: 8080
        name: http
    EOF
    done
    YAMLTest -f - <<'EOF'
    - name: advanced - a Gateway in a namespace with environment=prod and version=v2 is accepted
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: discovery-prod-v2
            name: discovery-check
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: advanced - a Gateway in a namespace with version=v3 is accepted
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: discovery-v3
            name: discovery-check
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    sleep 30
    accepted=$(kubectl get gateway discovery-check -n discovery-prod-only \
      -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status}')
    if [ "$accepted" = "True" ]; then
      echo "FAIL: a Gateway in a namespace with only environment=prod was accepted, so the namespace was not filtered out"
      exit 1
    fi
    # Put back the default (watch all namespaces) so the http Gateway in kgateway-system works again.
    kubectl delete namespace discovery-prod-v2 discovery-v3 discovery-prod-only --wait=false
    helm upgrade -i -n {{< reuse "kgw-docs/snippets/namespace.md" >}} {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}} \
      --reuse-values \
      --set-json 'discoveryNamespaceSelectors=[]'
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com") || true
      [ "$code" = "200" ] && break
      echo "discovery selectors reset: httpbin returned '$code', want 200, retrying ($i/60)"; sleep 3
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: discovery selectors reset: the httpbin route returned $code, want 200"
      exit 1
    fi
    {{< /doc-test >}}
