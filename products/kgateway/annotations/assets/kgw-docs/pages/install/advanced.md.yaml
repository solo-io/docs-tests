    {{< doc-test paths="advanced" >}}
    # Set up what the example grant is for: an API key Secret in team-secrets, and a policy
    # in httpbin that reads it, on its own route. Without the grant the reference is denied.
    kubectl create namespace team-secrets --dry-run=client -o yaml | kubectl apply -f -
    kubectl apply -f- <<'EOF'
    apiVersion: v1
    kind: Secret
    metadata:
      name: apikey
      namespace: team-secrets
    type: Opaque
    stringData:
      api-key: refgrant-test-key
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: refgrant-check
      namespace: httpbin
    spec:
      parentRefs:
      - name: http
        namespace: kgateway-system
      hostnames:
      - "refgrant.example.com"
      rules:
      - backendRefs:
        - name: httpbin
          port: 8000
    ---
    apiVersion: {{< reuse "kgw-docs/snippets/trafficpolicy-apiversion.md" >}}
    kind: {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}}
    metadata:
      name: refgrant-apikey
      namespace: httpbin
    spec:
      targetRefs:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: refgrant-check
      apiKeyAuth:
        secretRef:
          name: apikey
          namespace: team-secrets
    EOF
    status=""
    for i in $(seq 1 60); do
      status=$(kubectl get {{< reuse "kgw-docs/snippets/trafficpolicy.md" >}} refgrant-apikey -n httpbin -o jsonpath='{.status.ancestors[*].conditions[*].message}')
      grep -qi 'reference grant' <<<"$status" && break
      echo "refgrant-apikey status does not report the missing reference grant yet: '$status' ($i/60)"; sleep 5
    done
    if ! grep -qi 'reference grant' <<<"$status"; then
      echo "FAIL: without a ReferenceGrant, the policy that reads a Secret in team-secrets does not report a missing reference grant"
      exit 1
    fi
    {{< /doc-test >}}
