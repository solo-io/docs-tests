  content: |-
    {{< doc-test paths="advanced" >}}
    # Leader election is on by default: the controller holds the kgateway-envoy Lease.
    holder=""
    for i in $(seq 1 30); do
      holder=$(kubectl get lease kgateway-envoy -n kgateway-system -o jsonpath='{.spec.holderIdentity}' 2>/dev/null) || true
      [ -n "$holder" ] && break
      echo "no holder on the kgateway-envoy Lease yet ($i/30)"; sleep 5
    done
    if [ -z "$holder" ]; then
      echo "FAIL: leader election is not active by default: the kgateway-envoy Lease has no holder"
      exit 1
    fi
    cat > advanced-leader-election.yaml <<'EOF'
    controller:
      extraEnv:
        KGW_DISABLE_LEADER_ELECTION: "true"
    EOF
    helm upgrade -i -n {{< reuse "kgw-docs/snippets/namespace.md" >}} {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}} \
      --reuse-values -f advanced-leader-election.yaml
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
    YAMLTest -f - <<'EOF'
    - name: advanced - leader election is disabled on the controller
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.spec.template.spec.containers[0].env[?(@.name=='KGW_DISABLE_LEADER_ELECTION')].value"
        jsonPathExpectation:
          comparator: equals
          value: "true"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    EOF
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com") || true
      [ "$code" = "200" ] && break
      echo "leader election disabled: httpbin returned '$code', want 200, retrying ($i/60)"; sleep 3
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: leader election disabled: the httpbin route returned $code, want 200"
      exit 1
    fi
    # Turn leader election back on for the rest of the page.
    helm upgrade -i -n {{< reuse "kgw-docs/snippets/namespace.md" >}} {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} oci://{{< reuse "/kgw-docs/snippets/helm-path.md" >}}/charts/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} \
      --version {{< reuse "kgw-docs/versions/helm-version-flag.md" >}} \
      --reuse-values \
      --set-string controller.extraEnv.KGW_DISABLE_LEADER_ELECTION=false
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
    {{< /doc-test >}}
