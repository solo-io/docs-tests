  content: |-
    {{< doc-test paths="argocd" >}}
    # The page waits for the Argo CD deployments. The application controller is a
    # StatefulSet, and it is the component that syncs Applications.
    kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s
    {{< /doc-test >}}
