  content: |-
    {{< doc-test paths="argocd" >}}
    # The admin password hash is now the bcrypt hash of `gateway`.
    hash=$(kubectl -n argocd get secret argocd-secret -o json | jq -r '.data["admin.password"] // ""' | base64 -d)
    if [ "$hash" != '$2y$10$f6GlB5V/8OzCduEDEgBU.ugVn4vzxgT7cq7vuCebZAKoADaNve9Ve' ]; then
      echo "FAIL: argocd-secret admin.password is '$hash', not the hash of the gateway password"
      exit 1
    fi
    {{< /doc-test >}}
