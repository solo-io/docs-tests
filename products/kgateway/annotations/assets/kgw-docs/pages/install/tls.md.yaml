  content: |-
    {{< doc-test paths="install-tls" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the cert-manager controller to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: cert-manager
            name: cert-manager
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the cert-manager webhook to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: cert-manager
            name: cert-manager-webhook
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # The webhook starts serving a few seconds after its pod is available. Wait until
    # it admits an Issuer, so that the next step's apply does not fail on a webhook error.
    webhook_ready=false
    for i in $(seq 1 60); do
      if kubectl apply --dry-run=server -f - >/dev/null 2>&1 <<'ISSUER'
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: webhook-ready-probe
      namespace: kgateway-system
    spec:
      selfSigned: {}
    ISSUER
      then webhook_ready=true; break; fi
      echo "attempt $i: cert-manager webhook not ready yet, retrying"
      sleep 3
    done
    [ "$webhook_ready" = "true" ] || { echo "FAIL: the cert-manager webhook did not admit an Issuer"; exit 1; }
    {{< /doc-test >}}
