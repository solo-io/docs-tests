  content: |-
    {{< doc-test paths="install-tls" >}}
    # The upgraded control plane runs with xDS TLS on and the kgateway-xds-cert secret mounted.
    kubectl rollout status deployment/{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --timeout=300s
    tls_env=$(kubectl get deployment {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KGW_XDS_TLS")].value}')
    tls_secret=$(kubectl get deployment {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="xds-tls")].secret.secretName}')
    if [ "$tls_env" != "true" ] || [ "$tls_secret" != "kgateway-xds-cert" ]; then
      echo "FAIL: control plane has KGW_XDS_TLS='$tls_env' and xds-tls volume secret '$tls_secret'; want true and kgateway-xds-cert"
      exit 1
    fi
    YAMLTest -f - <<'EOF'
    - name: wait for the TLS-enabled kgateway control plane to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
