    # Steps 2 and 3: the page's commands use `open` (macOS only) and a manual edit,
    # so the test gets the current values and sets controller.xds.tls.enabled with jq.
    # JSON is valid YAML, so helm reads the result as a values file.
    helm get values {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o json \
      | jq '(. // {}) | .controller.xds.tls.enabled = true' > values.yaml
    cat values.yaml
    {{< /doc-test >}}
