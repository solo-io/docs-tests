  content: |-
    {{< doc-test paths="install-tls" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the kgateway-xds-cert server certificate to be issued
      wait:
        target:
          kind: Certificate
          metadata:
            namespace: kgateway-system
            name: kgateway-xds-cert
        jsonPath: "$.status.conditions[?(@.type=='Ready')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 180
          intervalSeconds: 5
    EOF
    # The control plane needs a kubernetes.io/tls secret named kgateway-xds-cert
    # with tls.crt, tls.key, and ca.crt. The server certificate must chain to ca.crt
    # and cover the control plane service name.
    secret_type=$(kubectl get secret kgateway-xds-cert -n kgateway-system -o jsonpath='{.type}')
    [ "$secret_type" = "kubernetes.io/tls" ] || { echo "FAIL: secret kgateway-xds-cert has type '$secret_type', not kubernetes.io/tls"; exit 1; }
    for key in tls.crt tls.key ca.crt; do
      kubectl get secret kgateway-xds-cert -n kgateway-system -o json | jq -r --arg k "$key" '.data[$k] // ""' | base64 -d > "xds-$key"
      [ -s "xds-$key" ] || { echo "FAIL: secret kgateway-xds-cert has no $key"; exit 1; }
    done
    openssl verify -CAfile xds-ca.crt xds-tls.crt || { echo "FAIL: tls.crt in kgateway-xds-cert does not chain to its ca.crt"; exit 1; }
    if ! openssl x509 -in xds-tls.crt -noout -ext subjectAltName | grep -q "DNS:kgateway.kgateway-system.svc.cluster.local"; then
      echo "FAIL: the server certificate does not cover kgateway.kgateway-system.svc.cluster.local"
      exit 1
    fi
    {{< /doc-test >}}
