  content: |-
    {{< doc-test paths="install-tls" >}}
    # The upgraded control plane adds the xDS CA bundle to each proxy's ConfigMap.
    # Wait for it before the page restarts the http proxy.
    ca_bundle=""
    for i in $(seq 1 60); do
      ca_bundle=$(kubectl get configmap http -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -o json | jq -r '.data["ca.crt"] // ""')
      grep -q "BEGIN CERTIFICATE" <<<"$ca_bundle" && break
      echo "attempt $i: the http proxy ConfigMap has no xDS CA bundle yet, retrying"
      sleep 3
    done
    grep -q "BEGIN CERTIFICATE" <<<"$ca_bundle" || { echo "FAIL: the control plane did not add the xDS CA bundle to the http proxy ConfigMap"; exit 1; }
    {{< /doc-test >}}
- after:
    block: 16
    fingerprint: 5a42b00730200e1e
    lang: ''
    lines: 6f2aa5f0 8c915d42 ddcb10b4 c3269a9b eb921e1a 8df9da24 7d9c921f 6d56ac79 b2d68270
    preview: '# HELP kgateway_xds_auth_rq_failure_total Total number of failed xDS auth reques'
  content: |-
    {{< doc-test paths="install-tls" >}}
    # The page checks the server through port-forwards. The test checks it from
    # pods in the cluster instead.
    # 1. Port 9977 serves TLS with a certificate that chains to the kgateway-xds-ca CA.
    rm -f xds-served.crt
    for i in $(seq 1 30); do
      kubectl run xds-tls-probe --rm -i --restart=Never -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --image=alpine/openssl:3.3.2 --command -- \
        sh -c 'openssl s_client -connect {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}.{{< reuse "kgw-docs/snippets/namespace.md" >}}.svc:9977 -servername {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}.{{< reuse "kgw-docs/snippets/namespace.md" >}}.svc </dev/null 2>/dev/null' \
        > xds-s-client.txt 2>/dev/null || true
      openssl x509 -in xds-s-client.txt -out xds-served.crt 2>/dev/null && break
      echo "attempt $i: no TLS certificate from port 9977 yet, retrying"
      sleep 3
    done
    [ -s xds-served.crt ] || { echo "FAIL: port 9977 on the control plane did not complete a TLS handshake"; cat xds-s-client.txt; exit 1; }
    openssl verify -CAfile xds-ca.crt xds-served.crt || { echo "FAIL: the certificate on port 9977 does not chain to the kgateway-xds-ca CA"; exit 1; }
    # 2. A plaintext gRPC request fails before it reaches authentication, because the
    #    server now requires TLS. Without TLS, the same request returns "authentication failed".
    plain=$(kubectl run xds-plaintext-probe --rm -i --restart=Never -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --image=fullstorydev/grpcurl:v1.9.1 -- \
      -plaintext -max-time 10 {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}.{{< reuse "kgw-docs/snippets/namespace.md" >}}.svc:9977 list 2>&1 || true)
    echo "$plain"
    if grep -q "authentication failed" <<<"$plain" || ! grep -qi "fail" <<<"$plain"; then
      echo "FAIL: a plaintext gRPC request to port 9977 was not rejected at the TLS layer"
      exit 1
    fi
    # 3. Over TLS, the same request reaches the server and fails authentication,
    #    because it carries no service account token.
    tlsout=$(kubectl run xds-tls-grpc-probe --rm -i --restart=Never -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --image=fullstorydev/grpcurl:v1.9.1 -- \
      -insecure -max-time 10 {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}.{{< reuse "kgw-docs/snippets/namespace.md" >}}.svc:9977 list 2>&1 || true)
    echo "$tlsout"
    grep -q "authentication failed" <<<"$tlsout" || { echo "FAIL: a gRPC request over TLS to port 9977 did not return 'authentication failed'"; exit 1; }
    # 4. The http proxy, restarted on the page, serves traffic with configuration
    #    from the TLS-enabled control plane.
    for i in $(seq 1 60); do
      code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") && [ "$code" = "200" ] && break
      echo "attempt $i: got '${code:-no response}' from the restarted http proxy, retrying"
      sleep 3
    done
    [ "$code" = "200" ] || { echo "FAIL: the http proxy did not serve httpbin after it reconnected to the TLS-enabled control plane"; exit 1; }
    # 5. The control plane metrics have the xds_auth counters, with at least one success.
    for i in $(seq 1 30); do
      metrics=$(kubectl run xds-metrics-probe --rm -i --restart=Never -n {{< reuse "kgw-docs/snippets/namespace.md" >}} --image=curlimages/curl:8.10.1 -- \
        -s --max-time 10 http://{{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}.{{< reuse "kgw-docs/snippets/namespace.md" >}}.svc:9092/metrics 2>/dev/null || true)
      success=$(awk '$1=="kgateway_xds_auth_rq_success_total"{print int($2)}' <<<"$metrics")
      [ "${success:-0}" -ge 1 ] && break
      echo "attempt $i: kgateway_xds_auth_rq_success_total is '${success:-missing}', retrying"
      sleep 3
    done
    grep xds_auth <<<"$metrics" || true
    for m in kgateway_xds_auth_rq_total kgateway_xds_auth_rq_success_total kgateway_xds_auth_rq_failure_total; do
      grep -q "^$m " <<<"$metrics" || { echo "FAIL: control plane metrics have no $m"; exit 1; }
    done
    [ "${success:-0}" -ge 1 ] || { echo "FAIL: no successful xDS auth request after the proxy reconnected over TLS"; exit 1; }
    {{< /doc-test >}}
