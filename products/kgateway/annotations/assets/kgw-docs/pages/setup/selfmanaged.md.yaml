  content: |-
    {{< doc-test paths="selfmanaged" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the self-managed Gateway to be accepted
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: self-managed
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # The page's check pipes into grep, which exits 1 on the blank output it
    # expects, so the test makes the same check without grep. The control plane
    # has accepted the Gateway; give it time to reconcile, and fail if it creates
    # a proxy Deployment, Service, or bootstrap ConfigMap for the self-managed
    # Gateway at any point.
    for attempt in $(seq 1 20); do
      sm_objs=$(kubectl get deployment,service,configmap -n kgateway-system -l gateway.networking.k8s.io/gateway-name=self-managed -o name 2>/dev/null || true)
      sm_named=$(kubectl get deployment/self-managed service/self-managed configmap/self-managed -n kgateway-system -o name 2>/dev/null || true)
      if [ -n "$sm_objs$sm_named" ]; then
        echo "FAIL: the control plane created proxy resources for the self-managed Gateway:"
        printf '%s\n' "$sm_objs" "$sm_named"
        exit 1
      fi
      sleep 3
    done
    sm_pods=$(kubectl get pods -n kgateway-system -o name | grep self-managed || true)
    if [ -n "$sm_pods" ]; then
      echo "FAIL: proxy pods exist for the self-managed Gateway: $sm_pods"
      exit 1
    fi
    echo "no proxy Deployment, Service, ConfigMap, or pod for the self-managed Gateway"
    {{< /doc-test >}}
