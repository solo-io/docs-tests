  content: |-
    {{< doc-test paths="default" >}}
    # The http Gateway from the sample app gets a proxy Deployment and a Service of
    # type LoadBalancer with an external address, both named after the Gateway.
    YAMLTest -f - <<'EOF'
    - name: default - the http Gateway has a gateway proxy deployment
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: default - the http gateway proxy service is of type LoadBalancer
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.spec.type"
        jsonPathExpectation:
          comparator: equals
          value: "LoadBalancer"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: default - the http gateway proxy service has an external address
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.loadBalancer.ingress[0].ip"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
- after:
    section: Reserved ports
    line: d2d9b2b2c8f17978
    occurrence: 0
    words: d9c0d341 9edd6d99 21a355f1 db34f613
    block_before: null
  content: |-
    {{< doc-test paths="default" >}}
    # Reserved ports: a Gateway with a listener on the Prometheus port 9091 next to a
    # normal listener on 8080.
    kubectl apply -f- <<'EOF'
    kind: Gateway
    apiVersion: gateway.networking.k8s.io/v1
    metadata:
      name: reserved-port-check
      namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
    spec:
      gatewayClassName: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
      listeners:
      - protocol: HTTP
        port: 8080
        name: http
      - protocol: HTTP
        port: 9091
        name: reserved
    EOF
    {{< version exclude-if="2.0.x,2.1.x,2.2.x,2.3.x,2.4.x" >}}
    # The listener on 9091 is rejected with the Invalid reason and the "port is reserved"
    # message, and the proxy Service does not expose port 9091.
    YAMLTest -f - <<'EOF'
    - name: default - the listener on the reserved port 9091 is not accepted
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: reserved-port-check
        jsonPath: "$.status.listeners[?(@.name=='reserved')].conditions[?(@.type=='Accepted')].reason"
        jsonPathExpectation:
          comparator: equals
          value: "Invalid"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: default - the reserved listener's message says the port is reserved
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: reserved-port-check
        jsonPath: "$.status.listeners[?(@.name=='reserved')].conditions[?(@.type=='Accepted')].message"
        jsonPathExpectation:
          comparator: contains
          value: "invalid port 9091 in listener: port is reserved"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: default - the gateway proxy service for the reserved-port Gateway exists
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: reserved-port-check
        jsonPath: "$.spec.type"
        jsonPathExpectation:
          comparator: equals
          value: "LoadBalancer"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    ports=$(kubectl get svc reserved-port-check -n kgateway-system -o jsonpath='{.spec.ports[*].port}')
    echo "reserved-port-check Service ports: $ports"
    if grep -qw 9091 <<<"$ports"; then
      echo "FAIL: the proxy Service exposes the reserved port 9091"
      exit 1
    fi
    {{< /version >}}
    {{< version include-if="2.0.x,2.1.x,2.2.x,2.3.x,2.4.x" >}}
    # The gateway proxy still deploys, and the control plane logs an error about port 9091.
    YAMLTest -f - <<'EOF'
    - name: default - the gateway proxy for the reserved-port Gateway still deploys
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: reserved-port-check
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    found=""
    for i in $(seq 1 30); do
      # Capture the logs first: under pipefail, `| grep -q` can fail on a match (SIGPIPE).
      logs=$(kubectl logs deploy/kgateway -n kgateway-system --since=10m 2>/dev/null) || true
      if grep -i error <<<"$logs" | grep 9091 >/dev/null; then found=1; break; fi
      echo "no error about port 9091 in the kgateway logs yet, retrying ($i/30)"; sleep 5
    done
    if [ -z "$found" ]; then
      echo "FAIL: the kgateway control plane logs show no error about the reserved port 9091"
      exit 1
    fi
    {{< /version >}}
    kubectl delete gateway reserved-port-check -n kgateway-system
    {{< /doc-test >}}
