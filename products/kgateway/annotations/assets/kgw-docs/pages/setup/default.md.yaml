  content: |-
    {{< doc-test paths="default" >}}
    YAMLTest -f - <<'EOF'
    - name: default - the kgateway GatewayClass is created at install with the kgateway.dev/kgateway controller
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.spec.controllerName"
        jsonPathExpectation:
          comparator: equals
          value: "kgateway.dev/kgateway"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: default - the kgateway GatewayClass has the description that the page shows
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.spec.description"
        jsonPathExpectation:
          comparator: equals
          value: "Standard class for managing Gateway API ingress traffic."
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    - name: default - the kgateway GatewayClass is accepted
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: {{< reuse "kgw-docs/snippets/gatewayclass.md" >}}
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
