    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="http10" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the accept-http10 ListenerPolicy to be accepted
      wait:
        target:
          kind: ListenerPolicy
          metadata:
            namespace: kgateway-system
            name: accept-http10
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # With acceptHttp10: true, the same HTTP/1.0 request now reaches httpbin.
    code=""
    for i in $(seq 1 30); do
      code=$(curl -s --http1.0 -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com") || true
      [ "$code" = "200" ] && break
      echo "acceptHttp10 enabled: HTTP/1.0 request returned $code, want 200, retrying ($i/30)"; sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: with the accept-http10 ListenerPolicy, an HTTP/1.0 request returned $code, want 200"
      exit 1
    fi
    {{< /doc-test >}}
