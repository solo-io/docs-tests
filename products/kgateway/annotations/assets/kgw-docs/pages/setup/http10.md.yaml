  content: |-
    {{< doc-test paths="http10" >}}
    # Before the ListenerPolicy: the gateway proxy answers an HTTP/1.0 request with 426 Upgrade Required.
    code=""
    for i in $(seq 1 30); do
      code=$(curl -s --http1.0 -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com") || true
      [ "$code" = "426" ] && break
      echo "default gateway: HTTP/1.0 request returned $code, want 426, retrying ($i/30)"; sleep 2
    done
    if [ "$code" != "426" ]; then
      echo "FAIL: before the accept-http10 ListenerPolicy, an HTTP/1.0 request returned $code, want 426 Upgrade Required"
      exit 1
    fi
    {{< /doc-test >}}
- after:
