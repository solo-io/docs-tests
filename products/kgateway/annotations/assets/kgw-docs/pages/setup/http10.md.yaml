  content: |-
    {{< doc-test paths="http10" >}}
    # Same check as the port-forward step, through the gateway proxy's admin port.
    dump=""
    for i in $(seq 1 30); do
      dump=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- 127.0.0.1:19000/config_dump) || true
      grep -q '"accept_http_10": true' <<<"$dump" && break
      echo "accept_http_10 not in the Envoy config yet, retrying ($i/30)"; sleep 2
    done
    if ! grep -q '"accept_http_10": true' <<<"$dump"; then
      echo "FAIL: the http_protocol_options of the HTTP connection manager do not have accept_http_10 set to true"
      exit 1
    fi
    {{< /doc-test >}}
