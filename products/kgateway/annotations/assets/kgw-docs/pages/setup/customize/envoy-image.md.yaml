  content: |-
    {{< doc-test paths="envoy-image" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the my-gateway Gateway with custom-envoy-image to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: my-gateway
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    ei_img=""
    for attempt in $(seq 1 60); do
      ei_img=$(kubectl get deployment my-gateway -n kgateway-system -o jsonpath='{.spec.template.spec.containers[?(@.name=="kgateway-proxy")].image}' 2>/dev/null || true)
      [ "$ei_img" = "registry.example.com/myorg/envoy-wrapper:v2.3.0-custom" ] && break
      echo "deployment/my-gateway proxy image is '${ei_img}', want the custom wrapper image, retrying ($attempt/60)"; sleep 2
    done
    if [ "$ei_img" != "registry.example.com/myorg/envoy-wrapper:v2.3.0-custom" ]; then
      echo "FAIL: deployment/my-gateway runs '${ei_img}', want registry.example.com/myorg/envoy-wrapper:v2.3.0-custom"
      exit 1
    fi
    if ! kubectl rollout status deployment/my-gateway -n kgateway-system --timeout=300s; then
      kubectl get pods -n kgateway-system -l gateway.networking.k8s.io/gateway-name=my-gateway -o wide
      kubectl describe pods -n kgateway-system -l gateway.networking.k8s.io/gateway-name=my-gateway | tail -n 30
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 14
    fingerprint: d5cca8fb930a2efe
    lang: ''
    lines: d5cca8fb
    preview: registry.example.com/myorg/envoy-wrapper:v2.3.0-custom
  content: |-
    {{< doc-test paths="envoy-image" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the my-gateway Service to get a load balancer address
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: my-gateway
        jsonPath: "$.status.loadBalancer.ingress[0].ip"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # The running proxy pod uses the custom image, and the proxy connects to the
    # control plane and serves traffic. Test-only: route envoy-image.example.com
    # on my-gateway to httpbin and send a request through the Gateway's load
    # balancer address on port 80.
    ei_pod_img=$(kubectl get pods -n kgateway-system -l gateway.networking.k8s.io/gateway-name=my-gateway --field-selector=status.phase=Running -o jsonpath='{.items[*].spec.containers[?(@.name=="kgateway-proxy")].image}')
    case " $ei_pod_img " in
      *" registry.example.com/myorg/envoy-wrapper:v2.3.0-custom "*) ;;
      *) echo "FAIL: running my-gateway proxy pods use '${ei_pod_img}', want the custom wrapper image"; exit 1 ;;
    esac
    kubectl apply -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: envoy-image-httpbin
      namespace: httpbin
    spec:
      parentRefs:
      - name: my-gateway
        namespace: kgateway-system
      hostnames:
      - envoy-image.example.com
      rules:
      - backendRefs:
        - name: httpbin
          port: 8000
    EOF
    YAMLTest -f - <<'EOF'
    - name: wait for the envoy-image-httpbin HTTPRoute to be accepted by my-gateway
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: envoy-image-httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    ei_addr=""
    for attempt in $(seq 1 60); do
      ei_addr=$(kubectl get svc my-gateway -n kgateway-system -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" 2>/dev/null || true)
      [ -n "$ei_addr" ] && break
      echo "Service my-gateway has no load balancer address yet, retrying ($attempt/60)"; sleep 5
    done
    if [ -z "$ei_addr" ]; then
      echo "FAIL: Service my-gateway in kgateway-system got no load balancer address"
      exit 1
    fi
    ei_code=""
    for attempt in $(seq 1 30); do
      ei_code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "http://${ei_addr}:80/headers" -H "host: envoy-image.example.com") || true
      [ "$ei_code" = "200" ] && break
      echo "request through my-gateway returned '$ei_code', want 200, retrying ($attempt/30)"; sleep 2
    done
    if [ "$ei_code" != "200" ]; then
      echo "FAIL: request to envoy-image.example.com through my-gateway returned '$ei_code', want 200"
      exit 1
    fi
    {{< /doc-test >}}
