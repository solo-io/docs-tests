  content: |-
    {{< doc-test paths="envoy-image" >}}
    # Test-only: the test cannot compile the Rust module and push to a registry,
    # so it stands in for steps 1 and 2. It gives the stock envoy-wrapper image
    # that the installed kgateway already runs (the image of the httpbin sample's
    # http proxy) the name the page pushes,
    # registry.example.com/myorg/envoy-wrapper:v2.3.0-custom, in the kind node's
    # image store. The default pullPolicy is IfNotPresent, so the proxy pod starts
    # from that local copy and never contacts registry.example.com.
    ei_src=$(kubectl get deployment http -n kgateway-system -o jsonpath='{.spec.template.spec.containers[?(@.name=="kgateway-proxy")].image}')
    ei_dst=registry.example.com/myorg/envoy-wrapper:v2.3.0-custom
    case "$ei_src" in
      */envoy-wrapper:*) ;;
      *) echo "FAIL: the http proxy runs '${ei_src}', not an envoy-wrapper image"; exit 1 ;;
    esac
    ei_node=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
    echo "tagging ${ei_src} as ${ei_dst} on kind node ${ei_node}"
    docker exec "$ei_node" crictl inspecti "$ei_src" >/dev/null 2>&1 || docker exec "$ei_node" crictl pull "$ei_src"
    docker exec "$ei_node" ctr -n k8s.io images tag --force "$ei_src" "$ei_dst"
    ei_seen=0
    for attempt in $(seq 1 15); do
      if docker exec "$ei_node" crictl inspecti "$ei_dst" >/dev/null 2>&1; then ei_seen=1; break; fi
      echo "kubelet image store does not list ${ei_dst} yet, retrying ($attempt/15)"; sleep 2
    done
    if [ "$ei_seen" -ne 1 ]; then
      echo "FAIL: ${ei_dst} is not in the kind node's image store"
      docker exec "$ei_node" crictl images
      exit 1
    fi
    {{< /doc-test >}}
