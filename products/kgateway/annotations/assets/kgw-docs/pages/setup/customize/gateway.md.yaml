    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="customize-gateway" >}}
    # The custom proxy must start with the JSON log format and the extra args
    # (--base-id 7, --cpuset-threads); a bootstrap or flag Envoy rejects keeps the
    # pod from becoming ready.
    YAMLTest -f - <<'EOF'
    - name: wait for the custom proxy with the built-in gw-params to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: custom
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    kubectl rollout status deployment/custom -n kgateway-system --timeout=300s
    cg_svc=""
    for attempt in $(seq 1 60); do
      cg_svc=$(kubectl get svc custom -n kgateway-system -o jsonpath='{.spec.type}' 2>/dev/null || true)
      [ "$cg_svc" = "NodePort" ] && break
      sleep 2
    done
    if [ "$cg_svc" != "NodePort" ]; then
      echo "customize-gateway built-in: expected svc/custom of type NodePort, got '${cg_svc}'"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 4
    fingerprint: ab879b002d2b8bb2
    lang: sh
    lines: ab879b00
    preview: kubectl logs -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -l app.kubernetes
  content: |-
    {{< doc-test paths="customize-gateway" >}}
    # A recent application log line of the custom proxy parses as JSON and carries
    # the four fields that the logFormat.json example defines.
    cg_json=0
    cg_logs=""
    for attempt in $(seq 1 30); do
      cg_logs=$(kubectl logs -n kgateway-system -l app.kubernetes.io/name=custom -c kgateway-proxy --tail=20 2>/dev/null || true)
      if python3 -c '
    import json, sys
    for line in sys.stdin:
        line = line.strip()
        if not line.startswith("{"):
            continue
        try:
            entry = json.loads(line)
        except ValueError:
            continue
        if all(k in entry for k in ("message", "level", "scope", "timestamp")):
            sys.exit(0)
    sys.exit(1)
    ' <<<"$cg_logs"; then
        cg_json=1
        break
      fi
      sleep 2
    done
    if [ "$cg_json" -ne 1 ]; then
      echo "customize-gateway built-in: no JSON log line with message, level, scope, and timestamp in the custom proxy logs:"
      printf '%s\n' "$cg_logs"
      exit 1
    fi
    {{< /doc-test >}}
