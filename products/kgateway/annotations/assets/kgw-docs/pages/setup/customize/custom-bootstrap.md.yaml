    {{< doc-test paths="custom-bootstrap" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the custom Gateway with gw-params to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: custom
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    kubectl rollout status deployment/custom -n kgateway-system --timeout=300s
    # The control plane generates a ConfigMap named after the Gateway, with the
    # Envoy bootstrap in its envoy.yaml entry. The next step reads it.
    cb_boot=""
    for attempt in $(seq 1 60); do
      cb_boot=$(kubectl get configmap custom -n kgateway-system -o jsonpath='{.data.envoy\.yaml}' 2>/dev/null || true)
      [ -n "$cb_boot" ] && break
      echo "generated ConfigMap custom has no envoy.yaml yet, retrying ($attempt/60)"; sleep 2
    done
    if [ -z "$cb_boot" ]; then
      echo "FAIL: the generated ConfigMap custom in kgateway-system has no envoy.yaml entry"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 1
    fingerprint: f96808c9529f1243
    lang: sh
