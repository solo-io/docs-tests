    preview: kubectl get configmap custom -n {{< reuse "kgw-docs/snippets/namespace.md" >}} -
  content: |-
    {{< doc-test paths="custom-bootstrap" >}}
    # Test-only: the page asks the reader to edit custom-bootstrap.yaml by hand.
    # Make the same edits: rename the ConfigMap to custom-bootstrap, and add the
    # stats_config block from the page as a new top-level key of envoy.yaml. Also
    # drop the server-set fields (resourceVersion, uid, creationTimestamp,
    # managedFields, ownerReferences) that the copy carries, as the page says.
    python3 - custom-bootstrap.yaml <<'PYEOF'
    import sys, yaml
    path = sys.argv[1]
    with open(path) as f:
        cm = yaml.safe_load(f)
    meta = cm["metadata"]
    meta["name"] = "custom-bootstrap"
    for key in ("resourceVersion", "uid", "creationTimestamp", "managedFields", "ownerReferences"):
        meta.pop(key, None)
    boot = cm["data"]["envoy.yaml"]
    if "stats_config" in yaml.safe_load(boot):
        sys.exit("FAIL: the generated bootstrap already has a stats_config key; the page adds it as a new key")
    if not boot.endswith("\n"):
        boot += "\n"
    boot += (
        "stats_config:\n"
        "  histogram_bucket_settings:\n"
        "  - match:\n"
        "      prefix: \"cluster.\"\n"
        "    buckets: [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]\n"
    )
    yaml.safe_load(boot)
    cm["data"]["envoy.yaml"] = boot
    with open(path, "w") as f:
        yaml.safe_dump(cm, f, sort_keys=False)
    PYEOF
    grep -n "name: custom-bootstrap" custom-bootstrap.yaml
    {{< /doc-test >}}
