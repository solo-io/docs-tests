  content: |-
    {{< doc-test paths="custom-bootstrap" >}}
    YAMLTest -f - <<'EOF'
    - name: the applied custom-bootstrap ConfigMap carries the histogram_bucket_settings
      wait:
        target:
          kind: ConfigMap
          metadata:
            namespace: kgateway-system
            name: custom-bootstrap
        jsonPath: "$.data['envoy.yaml']"
        jsonPathExpectation:
          comparator: contains
          value: "histogram_bucket_settings"
        polling:
          timeoutSeconds: 60
          intervalSeconds: 3
    EOF
    # Test-only: the page reads config_dump through a port-forward, which the test
    # cannot use. The proxy's admin port listens on 127.0.0.1:19000 inside the pod,
    # so read it with kubectl exec instead. The bootstrap section of config_dump
    # must carry the histogram_bucket_settings from the custom ConfigMap.
    cb_ok=0
    cb_buckets=""
    for attempt in $(seq 1 60); do
      cb_buckets=$(kubectl exec deploy/custom -n kgateway-system -- wget -qO- "http://127.0.0.1:19000/config_dump" 2>/dev/null | python3 -c '
    import json, sys
    def find(o, key):
        if isinstance(o, dict):
            if key in o:
                return o[key]
            o = list(o.values())
        if isinstance(o, list):
            for v in o:
                r = find(v, key)
                if r is not None:
                    return r
        return None
    try:
        s = find(json.load(sys.stdin), "histogram_bucket_settings") or []
        print(json.dumps([{"prefix": e.get("match", {}).get("prefix"), "buckets": [float(b) for b in e.get("buckets", [])]} for e in s]))
    except Exception:
        print("null")
    ' || true)
      if printf '%s' "$cb_buckets" | python3 -c '
    import json, sys
    want = [{"prefix": "cluster.", "buckets": [1.0, 5.0, 10.0, 25.0, 50.0, 100.0, 250.0, 500.0, 1000.0, 2500.0, 5000.0, 10000.0]}]
    sys.exit(0 if json.load(sys.stdin) == want else 1)
    ' 2>/dev/null; then
        cb_ok=1
        break
      fi
      echo "custom histogram_bucket_settings not in the proxy bootstrap yet (${cb_buckets:-none}), retrying ($attempt/60)"; sleep 3
    done
    if [ "$cb_ok" -ne 1 ]; then
      echo "FAIL: the bootstrap of deploy/custom has histogram_bucket_settings ${cb_buckets:-none}, want prefix cluster. with buckets 1..10000"
      exit 1
    fi
    {{< /doc-test >}}
