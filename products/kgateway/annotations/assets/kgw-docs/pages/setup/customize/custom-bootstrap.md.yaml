    {{< doc-test paths="custom-bootstrap" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the custom Gateway Service to get a load balancer address
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: custom
        jsonPath: "$.status.loadBalancer.ingress[0].ip"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # The custom bootstrap keeps the control-plane sections, so the proxy still
    # gets its routes over xDS and serves traffic. Test-only: route
    # custom-bootstrap.example.com on the custom Gateway to httpbin and send a
    # request through the Gateway's load balancer address on port 80.
    kubectl apply -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: custom-bootstrap-httpbin
      namespace: httpbin
    spec:
      parentRefs:
      - name: custom
        namespace: kgateway-system
      hostnames:
      - custom-bootstrap.example.com
      rules:
      - backendRefs:
        - name: httpbin
          port: 8000
    EOF
    YAMLTest -f - <<'EOF'
    - name: wait for the custom-bootstrap-httpbin HTTPRoute to be accepted by the custom Gateway
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: custom-bootstrap-httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    cb_addr=""
    for attempt in $(seq 1 60); do
      cb_addr=$(kubectl get svc custom -n kgateway-system -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}" 2>/dev/null || true)
      [ -n "$cb_addr" ] && break
      echo "Service custom has no load balancer address yet, retrying ($attempt/60)"; sleep 5
    done
    if [ -z "$cb_addr" ]; then
      echo "FAIL: Service custom in kgateway-system got no load balancer address"
      exit 1
    fi
    cb_code=""
    for attempt in $(seq 1 30); do
      cb_code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "http://${cb_addr}:80/headers" -H "host: custom-bootstrap.example.com") || true
      [ "$cb_code" = "200" ] && break
      echo "request through the custom Gateway returned '$cb_code', want 200, retrying ($attempt/30)"; sleep 2
    done
    if [ "$cb_code" != "200" ]; then
      echo "FAIL: request to custom-bootstrap.example.com through the custom Gateway returned '$cb_code', want 200"
      exit 1
    fi
    {{< /doc-test >}}
