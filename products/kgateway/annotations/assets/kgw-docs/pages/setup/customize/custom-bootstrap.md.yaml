            namespace: kgateway-system
            name: custom
        jsonPath: "$.spec.template.spec.volumes[?(@.name=='envoy-config')].configMap.name"
        jsonPathExpectation:
          comparator: equals
          value: "custom-bootstrap"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    EOF
    # The overlay changes the pod template, so the Deployment rolls out new pods
    # by itself; no restart is needed. Wait for the rollout to finish.
    kubectl rollout status deployment/custom -n kgateway-system --timeout=300s
    {{< /doc-test >}}
