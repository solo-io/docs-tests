- after:
    block: 10
    fingerprint: f1009cd65a7337a3
    lang: yaml
    lines: fa03f663 88b9492f 2ee1c717 8c8c4228 1ecdac76 0bebd850 36184fa5 9cc14d83 18bfcf8e 776530bb abc56510
    preview: kubectl apply -f- <<'EOF'
  content: |-
    {{< doc-test paths="configs-deployment" >}}
    # Test-only: the page applies each example to an existing GatewayParameters
    # and points to the Change proxy settings page for the Gateway that uses it.
    # Create that Gateway, custom, the same as the HPA example on this page, plus
    # an HTTPRoute to httpbin so that each change can be checked with traffic.
    kubectl apply -f- <<EOF
    kind: Gateway
    apiVersion: gateway.networking.k8s.io/v1
    metadata:
      name: custom
      namespace: kgateway-system
    spec:
      gatewayClassName: kgateway
      infrastructure:
        parametersRef:
          name: gw-params
          group: gateway.kgateway.dev
          kind: GatewayParameters
      listeners:
      - protocol: HTTP
        port: 80
        name: http
        allowedRoutes:
          namespaces:
            from: All
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: custom-httpbin
      namespace: httpbin
    spec:
      parentRefs:
      - name: custom
        namespace: kgateway-system
      hostnames:
      - custom.example.com
      rules:
      - backendRefs:
        - name: httpbin
          port: 8000
    EOF
    YAMLTest -f - <<'EOF'
    - name: wait for the custom Gateway of the deployment examples to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: custom
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    CUSTOM_GW_ADDRESS=""
    for attempt in $(seq 1 90); do
      CUSTOM_GW_ADDRESS=$(kubectl get svc custom -n kgateway-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
      [ -n "$CUSTOM_GW_ADDRESS" ] && break
      sleep 2
    done
    if [ -z "$CUSTOM_GW_ADDRESS" ]; then
      echo "configs-deployment: svc/custom got no load balancer address"
      exit 1
    fi
    export CUSTOM_GW_ADDRESS
    cfg_rep=""
    for attempt in $(seq 1 90); do
      cfg_rep=$(kubectl get deployment custom -n kgateway-system -o jsonpath='{.spec.replicas}/{.status.readyReplicas}' 2>/dev/null || true)
      [ "$cfg_rep" = "3/3" ] && break
      sleep 2
    done
    if [ "$cfg_rep" != "3/3" ]; then
      echo "configs-deployment replicas: expected deployment/custom 3 replicas, 3 ready, got '${cfg_rep}'"
      exit 1
    fi
    YAMLTest -f - <<'EOF'
    - name: configs-deployment replicas - httpbin answers through the custom Gateway
      retries: 30
      http:
        url: "http://${CUSTOM_GW_ADDRESS}:80"
        path: /headers
        method: GET
        headers:
          host: "custom.example.com"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
