    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="configs" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the custom Gateway with the HPA gw-params to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: custom
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # The HPA is named after the Gateway, targets its Deployment, and carries the
    # label from the GatewayParameters metadata. Metrics are not checked: on kind
    # the metrics-server has no kubelet TLS, so the HPA never reads CPU usage.
    cfg_hpa=""
    for attempt in $(seq 1 60); do
      cfg_hpa=$(kubectl get hpa custom -n kgateway-system -o jsonpath='{.spec.minReplicas}/{.spec.maxReplicas}/{.spec.scaleTargetRef.kind}/{.spec.scaleTargetRef.name}/{.spec.metrics[0].resource.name}/{.spec.metrics[0].resource.target.averageUtilization}/{.metadata.labels.app\.kubernetes\.io/name}' 2>/dev/null || true)
      [ "$cfg_hpa" = "2/10/Deployment/custom/cpu/80/gw-params" ] && break
      sleep 2
    done
    if [ "$cfg_hpa" != "2/10/Deployment/custom/cpu/80/gw-params" ]; then
      echo "configs hpa: expected hpa/custom 2/10/Deployment/custom/cpu/80/gw-params, got '${cfg_hpa}'"
      exit 1
    fi
    {{< /doc-test >}}
