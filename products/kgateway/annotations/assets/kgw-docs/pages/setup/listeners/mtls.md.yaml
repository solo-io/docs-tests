    # perPort: port 8444 now uses AllowInsecureFallback, so a request without a
    # client certificate succeeds. Retry until the new configuration is in place.
    code=""
    for i in $(seq 1 60); do
      code=$(curl -sS -o /dev/null --max-time 10 -w '%{http_code}' --cacert ca-cert.pem \
        --resolve "example.com:8444:${INGRESS_GW_ADDRESS}" https://example.com:8444/get) || true
      [ "$code" = "200" ] && break
      echo "port 8444 without a client certificate returned '$code', want 200, retrying ($i/60)"; sleep 5
    done
