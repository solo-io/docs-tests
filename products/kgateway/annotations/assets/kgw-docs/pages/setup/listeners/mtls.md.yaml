  content: |-
    {{< doc-test paths="mtls" >}}
    # The mtls Gateway gets its own LoadBalancer Service. Wait for its external
    # address before the next step reads it into INGRESS_GW_ADDRESS.
    addr=""
    for i in $(seq 1 60); do
      addr=$(kubectl get svc mtls -n kgateway-system -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}") || true
      [ -n "$addr" ] && break
      echo "the mtls Service has no external address yet, retrying ($i/60)"; sleep 5
    done
    if [ -z "$addr" ]; then
      echo "FAIL: the mtls Service never got an external address"
      kubectl get svc mtls -n kgateway-system -o yaml
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 13
    fingerprint: 1481521c804b0e17
    lang: console
    lines: 448780c1 d6cb56f9 bed133f0 d101fdb8
    preview: '* LibreSSL SSL_read: LibreSSL/3.3.6: error:1404C45C:SSL routines:ST_OK:reason(11'
  content: |-
    {{< doc-test paths="mtls" >}}
    # First wait until both mTLS ports serve a client that presents the right
    # certificate, so that the failures below come from the missing certificate
    # and not from a listener that is still starting.
    for port in 8443 8444; do
      code=""
      for i in $(seq 1 60); do
        code=$(curl -sS -o /dev/null --max-time 10 -w '%{http_code}' --cacert ca-cert.pem \
          --cert client-cert.pem --key client-key.pem \
          --resolve "example.com:${port}:${INGRESS_GW_ADDRESS}" "https://example.com:${port}/get") || true
        [ "$code" = "200" ] && break
        echo "port $port with a client certificate returned '$code', want 200, retrying ($i/60)"; sleep 5
      done
      if [ "$code" != "200" ]; then
        echo "FAIL: port $port did not return 200 for a request with a valid client certificate"
        exit 1
      fi
    done
    # Without a client certificate the TLS handshake fails: curl gets no HTTP
    # status and exits with an SSL connect error (35) or a receive error (56).
    for port in 8443 8444; do
      rc=0
      code=$(curl -sS -o /dev/null --max-time 10 -w '%{http_code}' --cacert ca-cert.pem \
        --resolve "example.com:${port}:${INGRESS_GW_ADDRESS}" "https://example.com:${port}/get") || rc=$?
      if [ "$code" != "000" ] || { [ "$rc" != "35" ] && [ "$rc" != "56" ]; }; then
        echo "FAIL: port $port without a client certificate returned '$code' (curl exit $rc), want a failed TLS handshake (curl exit 35 or 56)"
        exit 1
      fi
    done
    {{< /doc-test >}}
