  content: |-
    {{< doc-test paths="proxy-100-continue" >}}
    # default gateway: curl must get a 100 Continue and then a 200, and the headers that
    # httpbin echoes back does not include the Expect header.
    body=$(mktemp); trace=$(mktemp); ok=""
    for i in $(seq 1 30); do
      curl -s -v --max-time 10 -o "$body" -X POST "http://${INGRESS_GW_ADDRESS}:8080/anything" \
        -H "host: www.example.com" -H "Expect: 100-continue" --data-binary 'hello' 2>"$trace" || true
      if grep -q '^< HTTP/1.1 100 Continue' "$trace" && grep -q '^< HTTP/1.1 200 OK' "$trace" && ! grep -q '"Expect"' "$body"; then ok=1; break; fi
      echo "default gateway: response not as expected yet, retrying ($i/30)"; sleep 2
    done
    grep '^< HTTP' "$trace"; cat "$body"
    if [ -z "$ok" ]; then
      echo "FAIL: default gateway: want 100 Continue, then 200 OK, and an echoed header list that does not include Expect"
      exit 1
    fi
    {{< /doc-test >}}
