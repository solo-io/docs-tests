  content: |-
    {{< doc-test paths="proxy-100-continue" >}}
    # Same check as the port-forward step, through the gateway proxy's admin port.
    dump=""
    for i in $(seq 1 30); do
      dump=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- 127.0.0.1:19000/config_dump) || true
      grep -q '"proxy_100_continue": true' <<<"$dump" && break
      echo "proxy_100_continue not in the Envoy config yet, retrying ($i/30)"; sleep 2
    done
    if ! grep -q '"proxy_100_continue": true' <<<"$dump"; then
      echo "FAIL: the HTTP connection manager does not have proxy_100_continue set to true"
      exit 1
    fi
    {{< /doc-test >}}
