    lines: 6364ab47 3ca1ea63 dabd3aff d62ece41 b38bc40e 9d00f09c ed94dcdc 50fc9288 317b9438 62b67e1f 5b07bb0e 6364ab47 d6ef152a 72529f30 a54f0e53 7a58bab1 dabd3aff 021fb596 2e253c22 c7197869 817ad316 39d4b54e 6056662a e774783a 39d4b54e 0653176f f538f08a cfae0d42 d10b36aa d10b36aa
    preview: < HTTP/1.1 200 OK
  content: |-
    {{< doc-test paths="http-upgrades" >}}
    # CONNECT termination: curl opens a CONNECT tunnel to the gateway proxy (first
    # 200), then sends GET /headers through it, which httpbin answers (second 200).
    out=""; codes=""
    for i in $(seq 1 30); do
      out=$(curl -s --max-time 10 -p -x "http://${INGRESS_GW_ADDRESS}:8080" -w '\n%{http_connect} %{http_code}' http://connect.example:8000/headers) || true
      codes=$(printf '%s\n' "$out" | tail -n 1)
      [ "$codes" = "200 200" ] && break
      echo "CONNECT termination: CONNECT/GET returned '$codes', want '200 200', retrying ($i/30)"; sleep 2
    done
    printf '%s\n' "$out"
    if [ "$codes" != "200 200" ]; then
      echo "FAIL: CONNECT termination: CONNECT and GET codes were '$codes', want '200 200'"
      exit 1
    fi
    if ! grep -q '"connect.example:8000"' <<<"$out"; then
      echo "FAIL: CONNECT termination: httpbin did not echo Host connect.example:8000"
      exit 1
    fi
    {{< /doc-test >}}
