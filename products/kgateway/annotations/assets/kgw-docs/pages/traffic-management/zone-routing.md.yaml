    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="zone-routing,zone-routing-force" >}}
    # Test-only: kind nodes carry no topology labels, so the GatewayParameters
    # nodeSelector topology.kubernetes.io/zone: us-east-1a matches no node and the
    # proxy pod stays Pending. Label every node with the zone and region that the
    # example uses before the Gateway picks up the GatewayParameters.
    kubectl label nodes --all topology.kubernetes.io/zone=us-east-1a topology.kubernetes.io/region=us-east-1 --overwrite
    kubectl get nodes -L topology.kubernetes.io/zone
    {{< /doc-test >}}
