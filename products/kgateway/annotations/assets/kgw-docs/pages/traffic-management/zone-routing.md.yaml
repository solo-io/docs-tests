    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="zone-routing,zone-routing-force" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the http Gateway with zone-aware-gw-params to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    zr_env=""
    for attempt in $(seq 1 60); do
      zr_env=$(kubectl get deployment http -n kgateway-system -o jsonpath='{.spec.template.spec.containers[*].env[?(@.name=="KGATEWAY_NODE_ZONE")].value}' 2>/dev/null || true)
      [ "$zr_env" = "us-east-1a" ] && break
      sleep 2
    done
    if [ "$zr_env" != "us-east-1a" ]; then
      echo "zone-routing: expected KGATEWAY_NODE_ZONE=us-east-1a on deployment/http, got '${zr_env}'"
      exit 1
    fi
    kubectl rollout status deployment/http -n kgateway-system --timeout=300s
    {{< /doc-test >}}
- after:
    block: 6
    fingerprint: 3da123fd3fef897a
    lang: yaml
    lines: 16c71da1 d664f32c 3f173fd2 8c8c4228 ff91d602 0f10c5bc 36184fa5 588a5d84 e6365cc1 0d6480f0 d217c891 5679d65b f34295ce c3fcb66b 9dae0e78 b5193703 e09e743c abc56510
    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="zone-routing" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the prefer-local httpbin-zone-aware BackendConfigPolicy to be accepted
      wait:
        target:
          kind: BackendConfigPolicy
          metadata:
            namespace: httpbin
            name: httpbin-zone-aware
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only: the page reads config_dump through a port-forward, which the test
    # cannot use. The proxy's admin port listens on 127.0.0.1:19000 inside the pod,
    # so read it with kubectl exec instead, and check the zone_aware_lb_config of
    # the httpbin cluster: routing_enabled 100, min_cluster_size 3, and
    # force_local_zone.min_size none (none means no force_local_zone).
    zr_ok=0
    for attempt in $(seq 1 60); do
      zr_cfg=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_active_clusters" 2>/dev/null | python3 -c '
    import json, sys
    def find(o, key, name=None):
        # First dict under o that has key (and, if name is set, that name).
        if isinstance(o, dict):
            if key in o and (name is None or o.get("name") == name):
                return o if name else o[key]
            o = list(o.values())
        if isinstance(o, list):
            for v in o:
                r = find(v, key, name)
                if r is not None:
                    return r
        return None
    # The zone_aware_lb_config sits in the typed load_balancing_policy of the
    # httpbin cluster (locality_lb_config), so search the whole cluster for it.
    try:
        cluster = find(json.load(sys.stdin), "name", "kube_httpbin_httpbin_8000")
        print(json.dumps(find(cluster, "zone_aware_lb_config"), separators=(",", ":"), sort_keys=True))
    except Exception:
        print("null")
    ' || true)
      if printf '%s' "$zr_cfg" | python3 -c '
    import json, sys
    want_force = sys.argv[1]
    c = json.load(sys.stdin)
    ok = (isinstance(c, dict)
          and float(c.get("routing_enabled", {}).get("value", -1)) == 100
          and str(c.get("min_cluster_size")) == "3")
    force = c.get("force_local_zone") if isinstance(c, dict) else None
    if want_force == "none":
        ok = ok and force is None
    else:
        ok = ok and isinstance(force, dict) and str(force.get("min_size")) == want_force
    sys.exit(0 if ok else 1)
    ' none 2>/dev/null; then
        zr_ok=1
        break
      fi
      sleep 2
    done
    echo "zone-routing prefer local: zone_aware_lb_config of cluster kube_httpbin_httpbin_8000: ${zr_cfg:-none}"
    if [ "$zr_ok" -ne 1 ]; then
      echo "zone-routing prefer local: expected routing_enabled 100, min_cluster_size 3, force_local_zone.min_size none"
      exit 1
    fi
    YAMLTest -f - <<'EOF'
    - name: zone-routing prefer local - httpbin still answers through the gateway
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
