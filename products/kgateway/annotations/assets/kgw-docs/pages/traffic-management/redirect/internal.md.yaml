  content: |-
    {{< doc-test paths="redirect-internal" >}}
    YAMLTest -f - <<'EOF'
    - name: redirect-internal - the gateway follows the 302 and returns the /anything/redirected response
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /redirect-to
        method: GET
        params:
          url: "http://www.example.com/anything/redirected"
          status_code: "302"
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.url"
          comparator: contains
          value: "/anything/redirected"
    - name: redirect-internal - default settings do not follow a 303, so the client gets the 303
      retries: 5
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /redirect-to
        method: GET
        params:
          url: "http://www.example.com/anything/redirected"
          status_code: "303"
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 303
        headers:
        - name: location
          comparator: equals
          value: "http://www.example.com/anything/redirected"
    EOF
    {{< /doc-test >}}
