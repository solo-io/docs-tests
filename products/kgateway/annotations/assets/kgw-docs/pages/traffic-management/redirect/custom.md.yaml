    preview: '* Request completely sent off'
  content: |-
    {{< doc-test paths="redirect-custom" >}}
    YAMLTest -f - <<'EOF'
    - name: redirect-custom - /get returns the annotation's 307 instead of the filter's 302, with location /anything
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /get
        method: GET
        headers:
          host: "redirect.example"
      source:
        type: local
      expect:
        statusCode: 307
        headers:
        - name: location
          comparator: matches
          value: "^http://redirect\\.example(:[0-9]+)?/anything$"
    - name: redirect-custom - /post/test returns 307 with location /anything/test
      retries: 5
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /post/test
        method: GET
        headers:
          host: "redirect.example"
      source:
        type: local
      expect:
        statusCode: 307
        headers:
        - name: location
          comparator: matches
          value: "^http://redirect\\.example(:[0-9]+)?/anything/test$"
    EOF
    {{< /doc-test >}}
