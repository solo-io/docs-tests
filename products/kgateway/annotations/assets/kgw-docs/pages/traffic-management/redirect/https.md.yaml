    preview: '* ALPN: curl offers h2,http/1.1'
  content: |-
    {{< doc-test paths="redirect-https" >}}
    YAMLTest -f - <<'EOF'
    - name: redirect-https - an HTTP request on the http listener returns 301 to the default HTTPS port
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /status/200
        method: GET
        headers:
          host: "redirect.example.com"
      source:
        type: local
      expect:
        statusCode: 301
        headers:
        - name: location
          comparator: equals
          value: "https://redirect.example.com/status/200"
    EOF
    {{< /doc-test >}}
- after:
    block: 10
