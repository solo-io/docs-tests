    lines: b7d0c99e edbf342c 24d920e3 a7e7ba83 2a7b465c f1901ba0 5a4b1a12 756e5458 f32c91a7 fac876a5 e6f992f5 e29cb09f d447f0af 17315501 a6cef498 184f0709 7a1a6bbd 81a467da e48cb674 dda94c03 50fc9288 317b9438 62b67e1f 5b07bb0e 6364ab47 92413e97 ab5df625
    preview: '* ALPN: curl offers h2,http/1.1'
  content: |-
    {{< doc-test paths="redirect-https" >}}
    # The HTTPS request verifies the gateway certificate against the root CA, so
    # it fails if the certificate does not cover redirect.example.com.
    for i in $(seq 1 60); do
      code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert example_certs/root.crt \
        --resolve "redirect.example.com:443:${INGRESS_GW_ADDRESS}" \
        https://redirect.example.com/status/200) && [ "$code" = "200" ] && break
      echo "attempt $i: got '${code:-no response}', retrying"
      sleep 2
    done
    [ "$code" = "200" ] || { echo "HTTPS request with certificate verification did not return 200"; exit 1; }
    {{< /doc-test >}}
