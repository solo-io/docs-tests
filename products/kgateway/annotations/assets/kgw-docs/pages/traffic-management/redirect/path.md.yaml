    preview: '* Mark bundle as not supporting multiuse'
  content: |-
    {{< doc-test paths="redirect-path" >}}
    YAMLTest -f - <<'EOF'
    - name: redirect-path prefix - /get returns 302 with location /status/200
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /get
        method: GET
        headers:
          host: "path.redirect.example:8080"
      source:
        type: local
      expect:
        statusCode: 302
        headers:
        - name: location
          comparator: matches
          value: "^http://path\\.redirect\\.example(:[0-9]+)?/status/200$"
    - name: redirect-path prefix - /get/headers keeps the rest of the path, location /status/200/headers
      retries: 5
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /get/headers
        method: GET
        headers:
          host: "path.redirect.example:8080"
      source:
        type: local
      expect:
        statusCode: 302
        headers:
        - name: location
          comparator: matches
          value: "^http://path\\.redirect\\.example(:[0-9]+)?/status/200/headers$"
    EOF
    {{< /doc-test >}}
