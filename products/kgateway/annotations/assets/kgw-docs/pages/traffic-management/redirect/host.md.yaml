  content: |-
    {{< doc-test paths="redirect-host" >}}
    YAMLTest -f - <<'EOF'
    - name: redirect-host - host.redirect.example returns 302 with location www.example.com/headers
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "host.redirect.example:8080"
      source:
        type: local
      expect:
        statusCode: 302
        headers:
        - name: location
          comparator: matches
          value: "^http://www\\.example\\.com(:[0-9]+)?/headers$"
    EOF
    {{< /doc-test >}}
