    {{< doc-test paths="direct-response" >}}
    YAMLTest -f - <<'EOF'
    - name: direct-response - /status/200 is forwarded to httpbin
      retries: 5
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "direct-response.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
    - name: direct-response - /direct-response returns 510 with the configured body
      retries: 5
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/direct-response"
        method: GET
        headers:
          host: "direct-response.com:8080"
      source:
        type: local
      expect:
        statusCode: 510
        bodyContains:
        - "Disallow: /direct-response"
    EOF
    {{< /doc-test >}}
