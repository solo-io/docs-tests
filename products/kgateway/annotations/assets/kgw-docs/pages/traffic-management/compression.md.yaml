    preview: '{'
  content: |-
    {{< doc-test paths="compression" >}}
    # decomp_expect <label> <payload file> <Content-Encoding> <yes|no>: POST the
    # file to /post and check whether httpbin received the decompressed string.
    decomp_expect() {
      local label="$1" file="$2" enc="$3" want="$4" attempt data="" got
      for attempt in $(seq 1 60); do
        data=$(curl -s --max-time 10 -X POST "http://${INGRESS_GW_ADDRESS}:8080/post" \
          -H "host: decompression.example:8080" \
          -H "Content-Type: text/plain" \
          -H "Content-Encoding: $enc" \
          --data-binary @"$file" | jq -r '.data' 2>/dev/null || true)
        if [ "$data" = "Hello, world!" ]; then got=yes; elif [ -n "$data" ]; then got=no; else got=""; fi
        [ "$got" = "$want" ] && { echo "$label: data is '$data'"; return 0; }
        echo "$label: attempt $attempt got data '${data}', want decompressed=$want"
        sleep 2
      done
      echo "$label: httpbin never received the expected body"
      exit 1
    }
    decomp_expect "compression - a gzip request body reaches httpbin decompressed" /tmp/payload.gz gzip yes
    {{< /doc-test >}}
