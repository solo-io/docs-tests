    preview: < HTTP/1.1 200 OK
  content: |-
    {{< doc-test paths="compression" >}}
    # YAMLTest's HTTP client decompresses gzip and drops the content-encoding
    # header, so the compression checks read the raw response headers with curl.
    # comp_expect <label> <Accept-Encoding value, or "" for none> <content-encoding, or "none">
    comp_expect() {
      local label="$1" accept="$2" want="$3" attempt got=""
      for attempt in $(seq 1 60); do
        if [ -n "$accept" ]; then
          got=$(curl -s -o /dev/null -D - --max-time 10 "http://${INGRESS_GW_ADDRESS}:8080/html" \
            -H "host: compression.example:8080" -H "Accept-Encoding: $accept" || true)
        else
          got=$(curl -s -o /dev/null -D - --max-time 10 "http://${INGRESS_GW_ADDRESS}:8080/html" \
            -H "host: compression.example:8080" || true)
        fi
        got=$(printf '%s\n' "$got" | tr -d '\r' | awk 'NR==1{code=$2} tolower($1)=="content-encoding:"{enc=$2} END{if (code!="200") print "status-" code; else if (enc=="") print "none"; else print enc}')
        [ "$got" = "$want" ] && { echo "$label: content-encoding $got"; return 0; }
        echo "$label: attempt $attempt got '$got', want '$want'"
        sleep 2
      done
      echo "$label: the /html response never had content-encoding '$want'"
      exit 1
    }
    comp_expect "compression - Accept-Encoding gzip gets a gzip-compressed response" gzip gzip
    {{< /doc-test >}}
