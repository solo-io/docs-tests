  content: |-
    {{< doc-test paths="weighted-routes" >}}
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
    wr_env=$(kubectl get deployment kgateway -n kgateway-system -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KGW_WEIGHTED_ROUTE_PRECEDENCE")].value}')
    if [ "$wr_env" != "true" ]; then
      echo "weighted-routes: expected KGW_WEIGHTED_ROUTE_PRECEDENCE=true on the kgateway controller, got '${wr_env}'"
      exit 1
    fi
    YAMLTest -f - <<'EOF'
    - name: wait for the upgraded kgateway control plane to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
