  content: |-
    {{< doc-test paths="weighted-routes" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the hello-world deployment to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: httpbin
            name: hello-world
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the two-rule httpbin HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: weighted-routes default precedence - /anything/a is served by the more specific hello-world rule
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /anything/a
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "Server name: hello-world"
    - name: weighted-routes default precedence - /anything is served by httpbin
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /anything
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.url"
          comparator: matches
          value: "/anything$"
    EOF
    {{< /doc-test >}}
- after:
    block: 10
    fingerprint: 76915ad1d89121b6
    lang: yaml
    lines: adc43cf7 6c077fe9 c38a9485
    preview: 'controller:'
  content: |-
    {{< doc-test paths="weighted-routes" >}}
    # Test-only: the previous step opens the values file in an editor and asks the
    # reader to add the controller.extraEnv value by hand. Write the same file
    # here: the current release values plus KGW_WEIGHTED_ROUTE_PRECEDENCE: true,
    # so the page's own helm upgrade command below runs unchanged.
    helm get values kgateway -n kgateway-system -o yaml > kgateway.yaml
    python3 - <<'PY'
    import yaml
    with open("kgateway.yaml") as f:
        values = yaml.safe_load(f) or {}
    values.setdefault("controller", {}).setdefault("extraEnv", {})["KGW_WEIGHTED_ROUTE_PRECEDENCE"] = True
    with open("kgateway.yaml", "w") as f:
        yaml.safe_dump(values, f, default_flow_style=False)
    PY
    cat kgateway.yaml
    {{< /doc-test >}}
