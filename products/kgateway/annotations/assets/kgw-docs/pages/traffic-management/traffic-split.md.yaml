  content: |-
    {{< doc-test paths="traffic-split" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the traffic-split HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: helloworld
            name: traffic-split
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: traffic-split - traffic.split.example requests reach a helloworld app
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /hello
        method: GET
        headers:
          host: "traffic.split.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "Hello version: v"
    EOF
    # Test-only: the split is random, so check it loosely. Over 100 requests with
    # weights 10/10/80, every version answers at least once and v3 answers most.
    # The odds that a 10% backend never answers by chance are about 3 in 100,000.
    ts_v1=0; ts_v2=0; ts_v3=0; ts_other=0
    for i in $(seq 1 100); do
      ts_body=$(curl -s --max-time 10 "http://${INGRESS_GW_ADDRESS}:8080/hello" -H "host: traffic.split.example:8080" || true)
      case "$ts_body" in
        *"Hello version: v1,"*) ts_v1=$((ts_v1+1)) ;;
        *"Hello version: v2,"*) ts_v2=$((ts_v2+1)) ;;
        *"Hello version: v3,"*) ts_v3=$((ts_v3+1)) ;;
        *) ts_other=$((ts_other+1)) ;;
      esac
    done
    echo "traffic-split: v1=$ts_v1 v2=$ts_v2 v3=$ts_v3 other=$ts_other (of 100)"
    if [ "$ts_v1" -lt 1 ] || [ "$ts_v2" -lt 1 ] || [ "$ts_v3" -lt 1 ]; then
      echo "traffic-split: expected every helloworld version to answer at least once"
      exit 1
    fi
    if [ "$ts_v3" -le "$ts_v1" ] || [ "$ts_v3" -le "$ts_v2" ]; then
      echo "traffic-split: expected helloworld-v3 (weight 80) to answer more often than v1 and v2 (weight 10 each)"
      exit 1
    fi
    if [ "$ts_other" -gt 10 ]; then
      echo "traffic-split: $ts_other of 100 requests did not return a helloworld response"
      exit 1
    fi
    {{< /doc-test >}}
