  content: |-
    {{< doc-test paths="preserve-request-paths" >}}
    # Test-only: the page reads config_dump through a port-forward, which the test
    # cannot use. The admin port listens on 127.0.0.1:19000 inside the proxy pod,
    # so read it with kubectl exec. Every HTTP connection manager on the Gateway's
    # listeners must have normalize_path false and merge_slashes unset or false.
    for attempt in $(seq 1 60); do
      hcms=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump" 2>/dev/null | jq -c '[
        .configs[]
        | select(.["@type"] == "type.googleapis.com/envoy.admin.v3.ListenersConfigDump")
        | .dynamic_listeners[]
        | .active_state.listener.filter_chains[].filters[]
        | select(.name == "envoy.filters.network.http_connection_manager")
        | .typed_config
        | {normalize_path, merge_slashes}
      ]' 2>/dev/null || true)
      if printf '%s' "$hcms" | jq -e 'length > 0 and all(.[]; .normalize_path == false and (.merge_slashes // false) == false)' >/dev/null 2>&1; then
        echo "preserve-request-paths - config_dump: $hcms"
        break
      fi
      echo "preserve-request-paths - attempt $attempt: config_dump HCM settings '${hcms}'"
      [ "$attempt" -eq 60 ] && { echo "preserve-request-paths - the listener still normalizes paths or merges slashes"; exit 1; }
      sleep 2
    done
    {{< /doc-test >}}
