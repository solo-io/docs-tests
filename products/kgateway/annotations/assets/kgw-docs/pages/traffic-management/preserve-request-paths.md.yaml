  content: |-
    {{< doc-test paths="preserve-request-paths" >}}
    # pp_check <label> <raw path> <expected code> <ERE for the location header
    # (30x) or for the url that httpbin echoes (200)>. curl --path-as-is sends
    # the path exactly as written, so the proxy sees the repeated slash or dot
    # segment.
    pp_check() {
      local label="$1" path="$2" want="$3" pattern="$4" attempt code="" got=""
      for attempt in $(seq 1 60); do
        code=$(curl -s --path-as-is -D /tmp/pp_headers -o /tmp/pp_body -w '%{http_code}' --max-time 10 \
          "http://${INGRESS_GW_ADDRESS}:8080${path}" -H "host: www.example.com:8080" || true)
        case "$code" in
          30*) got=$(tr -d '\r' < /tmp/pp_headers | awk 'tolower($1)=="location:"{print $2}' || true) ;;
          200) got=$(jq -r '.url // empty' /tmp/pp_body 2>/dev/null || true) ;;
          *) got="" ;;
        esac
        if [ "$code" = "$want" ] && { [ -z "$pattern" ] || printf '%s' "$got" | grep -Eq "$pattern"; }; then
          echo "$label: $code $got"
          return 0
        fi
        echo "$label: attempt $attempt got $code '${got}', want $want matching '$pattern'"
        sleep 2
      done
      echo "$label: $path never returned $want matching '$pattern'"
      exit 1
    }
    # Before the policy, Envoy merges slashes and normalizes dot segments, so
    # httpbin receives the canonical path and answers 200.
    pp_check "preserve-request-paths - default, slashes are merged before httpbin" "/anything/foo//bar" 200 "/anything/foo/bar$"
    pp_check "preserve-request-paths - default, dot segments are resolved before httpbin" "/anything/foo/../bar" 200 "/anything/bar$"
    {{< /doc-test >}}
