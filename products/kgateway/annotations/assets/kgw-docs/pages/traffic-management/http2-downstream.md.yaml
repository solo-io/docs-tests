      preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="http2-downstream" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the http2-settings ListenerPolicy to be accepted
      wait:
        target:
          kind: ListenerPolicy
          metadata:
            namespace: kgateway-system
            name: http2-settings
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only helper. The page port-forwards the admin port of the http gateway
    # proxy; the test reads the same config dump with kubectl exec instead.
    # h2d_check <label> <python expression on opts>: wait until a non-empty
    # http2_protocol_options in the listener config satisfies the expression.
    h2d_check() {
      local label="$1" expr="$2" i out
      for i in $(seq 1 60); do
        out=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_listeners" 2>/dev/null | H2D_EXPR="$expr" python3 -c '
    import json, os, sys
    found = []
    def walk(o):
        if isinstance(o, dict):
            v = o.get("http2_protocol_options")
            if isinstance(v, dict) and v:
                found.append(v)
            for x in o.values():
                walk(x)
        elif isinstance(o, list):
            for x in o:
                walk(x)
    try:
        walk(json.load(sys.stdin))
    except Exception:
        sys.exit(0)
    for opts in found:
        if eval(os.environ["H2D_EXPR"]):
            print(json.dumps(opts, sort_keys=True))
            break
    ' || true)
        if [ -n "$out" ]; then echo "$label: $out"; return 0; fi
        sleep 5
      done
      echo "$label: no http2_protocol_options on the http proxy's listeners match: $expr"
      exit 1
    }
    h2d_check "http2-downstream window sizes and streams" 'opts.get("initial_stream_window_size") == 131072 and opts.get("initial_connection_window_size") == 262144 and opts.get("max_concurrent_streams") == 100'
    # HTTP/2 clients still get through with the tuned settings.
    YAMLTest -f - <<'EOF'
    - name: http2-downstream - an HTTP/2 prior-knowledge request to httpbin returns 200 over HTTP/2
      retries: 30
      command:
        command: "curl -s -o /dev/null --max-time 5 --http2-prior-knowledge -w '%{http_version} %{http_code}' http://${INGRESS_GW_ADDRESS}:8080/headers -H 'host: www.example.com:8080'"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          equals: "2 200"
    EOF
    {{< /doc-test >}}
