      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: dfp-httproute
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
