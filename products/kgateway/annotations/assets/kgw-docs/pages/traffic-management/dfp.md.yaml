    preview: '* Request completely sent off'
  content: |-
    {{< doc-test paths="dfp" >}}
    # Test-only: the httpbin-org-standin prerequisite resolves httpbin.org in the
    # cluster to the go-httpbin sample app, so the welcome page differs from the
    # public httpbin.org page in the example output. Check the status code on /,
    # then prove that the request went through the dynamic forward proxy: go-httpbin
    # echoes the httpbin.org Host header that the proxy resolved.
    YAMLTest -f - <<'EOF'
    - name: dfp - a request for the httpbin.org host returns the welcome page through the dynamic forward proxy
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /
        method: GET
        headers:
          host: "httpbin.org"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "<html"
    - name: dfp - the httpbin.org request reaches the resolved upstream with its Host header unchanged
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "httpbin.org"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.Host[0]"
          comparator: equals
          value: "httpbin.org"
    EOF
    {{< /doc-test >}}
