       YAMLTest -f - <<'EOF'
       - name: transform-update-response-body - before the policy - wait for the httpbin HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: httpbin
               name: httpbin
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: transform-update-response-body - before the policy, /json returns the sample slideshow
         retries: 30
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/json"
           method: GET
           headers:
             host: "www.example.com:8080"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.slideshow.author"
             comparator: equals
             value: "Yours Truly"
           - path: "$.slideshow.slides[0].type"
             comparator: equals
             value: "all"
       EOF
       {{< /doc-test >}}
