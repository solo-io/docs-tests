  content: |2-
       {{< doc-test paths="transform-update-request-path" >}}
       YAMLTest -f - <<'EOF'
       - name: transform-update-request-path - wait for the httpbin HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: httpbin
               name: httpbin
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: transform-update-request-path - wait for the transformation TrafficPolicy to be accepted
         wait:
           target:
             kind: TrafficPolicy
             metadata:
               namespace: httpbin
               name: transformation
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: transform-update-request-path - with foo bar, GET /get is sent to httpbin as POST /post
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/get"
           method: GET
           headers:
             host: "www.example.com:8080"
             foo: bar
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.url"
             comparator: matches
             value: "/post$"
       EOF
       {{< /doc-test >}}
