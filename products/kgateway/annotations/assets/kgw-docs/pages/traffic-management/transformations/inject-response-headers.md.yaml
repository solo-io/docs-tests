  content: |-
    {{< doc-test paths="transform-inject-response-headers" >}}
    YAMLTest -f - <<'EOF'
    - name: "transform-inject-response-headers - wait for the httpbin HTTPRoute to be accepted"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "transform-inject-response-headers - wait for the transformation TrafficPolicy to be accepted"
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: transformation
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "transform-inject-response-headers - response carries the injected headers"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/response-headers"
        method: GET
        headers:
          host: "www.example.com:8080"
          x-gateway-request: "my custom request header"
          baz: "pattern-to-replace"
      source:
        type: local
      expect:
        statusCode: 200
        headers:
          - name: x-gateway-response
            comparator: equals
            value: "my custom request header"
          - name: x-podname
            comparator: matches
            value: "^http-"
          - name: x-season
            comparator: equals
            value: "summer"
          - name: x-response-raw
            comparator: equals
            value: "hello"
          - name: x-replace
            comparator: matches
            value: "^[A-Za-z0-9+/]{22}$"
    EOF
    {{< /doc-test >}}
