    YAMLTest -f - <<'EOF'
    - name: "transform-decode-base64-headers - wait for the httpbin HTTPRoute to be accepted"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "transform-decode-base64-headers - wait for the transformation TrafficPolicy to be accepted"
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: transformation
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "transform-decode-base64-headers - x-base64-decoded carries the decoded value from the 11th character"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/response-headers"
        method: GET
        headers:
          host: "www.example.com:8080"
          x-base64-encoded: "dHJhbnNmb3JtYXRpb24gdGVzdA=="
      source:
        type: local
      expect:
        statusCode: 200
        headers:
          - name: x-base64-decoded
            comparator: equals
            value: "ion test"
    EOF
    {{< /doc-test >}}
