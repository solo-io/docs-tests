  content: |-
    {{< doc-test paths="transform-change-response-status" >}}
    YAMLTest -f - <<'EOF'
    - name: "transform-change-response-status - wait for the httpbin HTTPRoute to be accepted"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "transform-change-response-status - wait for the transformation TrafficPolicy to be accepted"
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: transformation
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "transform-change-response-status - foo: bar response header turns the status into 401"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/response-headers?foo=bar"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 401
        headers:
          - name: foo
            comparator: equals
            value: "bar"
        bodyJsonPath:
        - path: "$.foo[0]"
          comparator: equals
          value: bar
    - name: "transform-change-response-status - any other foo value returns 403"
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/response-headers?foo=baz"
        method: GET
        headers:
          host: "www.example.com:8080"
      source:
        type: local
      expect:
        statusCode: 403
        headers:
          - name: foo
            comparator: equals
            value: "baz"
        bodyJsonPath:
        - path: "$.foo[0]"
          comparator: equals
          value: baz
    EOF
    {{< /doc-test >}}
