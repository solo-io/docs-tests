  content: |-
    {{< doc-test paths="static,static-backendtlspolicy" >}}
    # Test-only: step 1 of the HTTPS section links to the HTTPS listener guide.
    # Create the same certificates and the `https` Gateway here, without that
    # page's httpbin route and cleanup.
    mkdir -p example_certs
    openssl req -x509 -sha256 -nodes -days 365 -newkey rsa:2048 -subj '/O=any domain/CN=*' -keyout example_certs/root.key -out example_certs/root.crt
    cat <<'CNF' > example_certs/gateway.cnf
    [ req ]
    default_bits = 2048
    prompt = no
    default_md = sha256
    distinguished_name = dn
    req_extensions = req_ext
    [ dn ]
    CN = *.example.com
    O = any domain
    [ req_ext ]
    subjectAltName = @alt_names
    [ alt_names ]
    DNS.1 = *.example.com
    DNS.2 = example.com
    CNF
    openssl req -new -nodes -keyout example_certs/gateway.key -out example_certs/gateway.csr -config example_certs/gateway.cnf
    openssl x509 -req -sha256 -days 365 \
      -CA example_certs/root.crt -CAkey example_certs/root.key -set_serial 0 \
      -in example_certs/gateway.csr -out example_certs/gateway.crt \
      -extfile example_certs/gateway.cnf -extensions req_ext
    kubectl create secret tls -n kgateway-system https \
      --key example_certs/gateway.key \
      --cert example_certs/gateway.crt
    kubectl apply -f- <<'GW'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: https
      namespace: kgateway-system
    spec:
      gatewayClassName: kgateway
      listeners:
      - protocol: HTTPS
        port: 443
        name: https
        tls:
          mode: Terminate
          certificateRefs:
            - name: https
              kind: Secret
        allowedRoutes:
          namespaces:
            from: All
    GW
    YAMLTest -f - <<'EOF'
    - name: static - wait for the https Gateway to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: https
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: static - wait for the https listener to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: https
        jsonPath: "$.status.listeners[?(@.name=='https')].conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    kubectl rollout status deploy/https -n kgateway-system --timeout=300s
    # The page's HTTPS request sends INGRESS_GW_ADDRESS to the https Gateway, so
    # point the variable at that Gateway's load balancer from here on.
    for i in $(seq 1 60); do
      INGRESS_GW_ADDRESS=$(kubectl get svc -n kgateway-system https -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
      [ -n "$INGRESS_GW_ADDRESS" ] && break
      sleep 5
    done
    [ -n "$INGRESS_GW_ADDRESS" ] || { echo "static: the https Gateway service got no load balancer address"; exit 1; }
    export INGRESS_GW_ADDRESS
    echo "static: https Gateway address $INGRESS_GW_ADDRESS"
    {{< /doc-test >}}
