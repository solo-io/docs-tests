    {{< doc-test paths="static" >}}
    # Test-only: replaces the reader's curl. The Backend points to the public
    # jsonplaceholder.typicode.com service, so the runner needs internet access.
    # Retry, and check only the status code and stable fields of the first post.
    YAMLTest -f - <<'EOF'
    - name: static - HTTP static backend returns the jsonplaceholder posts through the http Gateway
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /posts
        method: GET
        headers:
          host: "static.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$[0].userId"
          comparator: equals
          value: 1
        - path: "$[0].id"
          comparator: equals
          value: 1
    EOF
    {{< /doc-test >}}
