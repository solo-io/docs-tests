  content: |-
    {{< doc-test paths="static,static-backendtlspolicy" >}}
    # Test-only: replaces the reader's curl. The client verifies the https Gateway
    # certificate against example_certs/root.crt, and the gateway proxy verifies
    # jsonplaceholder.typicode.com against the system CA bundle in the Envoy image.
    # Until the TLS policy reaches the proxy, the upstream rejects plain HTTP on
    # port 443, so retry until the posts come back.
    static_https_ok=false
    for i in $(seq 1 60); do
      code=$(curl -sS -o static-posts.json -w '%{http_code}' --max-time 10 --cacert example_certs/root.crt \
        --resolve "static.example.com:443:${INGRESS_GW_ADDRESS}" \
        https://static.example.com:443/posts || true)
      if [ "$code" = "200" ] && python3 -c '
    import json, sys
    d = json.load(open("static-posts.json"))
    sys.exit(0 if isinstance(d, list) and d and d[0].get("userId") == 1 and d[0].get("id") == 1 else 1)
    ' 2>/dev/null; then
        static_https_ok=true
        break
      fi
      echo "static: HTTPS attempt $i got '${code:-no response}', retrying"
      sleep 3
    done
    [ "$static_https_ok" = true ] || { echo "static: HTTPS request to static.example.com/posts did not return 200 with the jsonplaceholder posts"; head -c 500 static-posts.json 2>/dev/null; exit 1; }
    echo "static: HTTPS static backend returned the jsonplaceholder posts"
    {{< /doc-test >}}
