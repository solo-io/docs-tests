- after:
    block: 9
    fingerprint: 60cb94de86f6fc8d
    lang: console
    lines: 6364ab47 92413e97 ab5df625 dabd3aff 021fb596 2e253c22 c7197869 817ad316 39d4b54e 812dc567 18d10c7d 39d4b54e 6056662a 88017a50 39d4b54e c9aa1623 d29ef39c 39d4b54e 0653176f f538f08a 39d4b54e ab5df625
    preview: < HTTP/1.1 200 OK
  content: |2-
       {{< doc-test paths="header-manipulation" >}}
       YAMLTest -f - <<'EOF'
       - name: header-manipulation - on /headers, the addHeaders instruction makes the ExtProc server add extproc true to the request that httpbin receives
         retries: 30
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080"
           path: /headers
           method: GET
           headers:
             host: extproc.example
             instructions: '{"addHeaders":{"extproc":"true"}}'
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers['Extproc'][0]"
             comparator: equals
             value: "true"
           - path: "$.headers['Instructions'][0]"
             comparator: equals
             value: '{"addHeaders":{"extproc":"true"}}'
       - name: header-manipulation - on /headers, the removeHeaders instruction makes the ExtProc server strip x-remove-me before the request reaches httpbin
         retries: 10
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080"
           path: /headers
           method: GET
           headers:
             host: extproc.example
             x-remove-me: please
             x-keep-me: please
             instructions: '{"addHeaders":{"extproc":"true"},"removeHeaders":["x-remove-me"]}'
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers['Extproc'][0]"
             comparator: equals
             value: "true"
           - path: "$.headers['X-Remove-Me']"
             comparator: exists
             negate: true
           - path: "$.headers['X-Keep-Me'][0]"
             comparator: equals
             value: please
       - name: header-manipulation - on /headers, a request without an instructions header is not changed by the ExtProc server
         retries: 10
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080"
           path: /headers
           method: GET
           headers:
             host: extproc.example
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers['Extproc']"
             comparator: exists
             negate: true
       EOF
       {{< /doc-test >}}
