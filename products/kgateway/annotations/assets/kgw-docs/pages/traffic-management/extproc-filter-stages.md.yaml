  content: |2-
        {{< doc-test paths="filter-stages" >}}
        # One request must open two ExtProc streams (one per filter stage) and send
        # request headers on each. Without DeepMerge only one of the two policies
        # would apply, and the count would be 1. `kubectl logs -l` shows only the last
        # 10 lines unless --tail=-1 is set.
        count_lines() {
          local logs
          logs=$(kubectl logs -n kgateway-system -l app.kubernetes.io/name=ext-proc-grpc --tail=-1)
          grep -cE "INFO $1( |\$)" <<<"${logs}" || true
        }
        streams_before=$(count_lines process)
        headers_before=$(count_lines 'got RequestHeaders')
        code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: extproc.example")
        if [ "${code}" != "200" ]; then
          echo "FAIL: the single counted request to /headers returned HTTP ${code}, not 200" >&2
          exit 1
        fi
        streams=0
        headers=0
        for _ in $(seq 1 15); do
          streams=$(( $(count_lines process) - streams_before ))
          headers=$(( $(count_lines 'got RequestHeaders') - headers_before ))
          if [ "${streams}" -ge 2 ] && [ "${headers}" -ge 2 ]; then
            break
          fi
          sleep 2
        done
        echo "ExtProc streams opened for one request: ${streams}; request headers processed: ${headers}"
        if [ "${streams}" -ne 2 ] || [ "${headers}" -ne 2 ]; then
          echo "FAIL: expected the ExtProc server to be called twice for one request (once before AuthN, once after Route), got ${streams} streams and ${headers} RequestHeaders messages" >&2
          kubectl logs -n kgateway-system -l app.kubernetes.io/name=ext-proc-grpc --tail=40 >&2 || true
          exit 1
        fi
        {{< /doc-test >}}
