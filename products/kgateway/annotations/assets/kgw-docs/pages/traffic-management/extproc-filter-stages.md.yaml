  content: |2-
       {{< doc-test paths="filter-stages" >}}
       # Run the page's two make targets from a kgateway checkout. v2.4.7 is pinned
       # because its extproc-server image builds with docker alone (later versions
       # compile the server with the host Go toolchain) and it has the --add-header
       # flag that step 5 uses. The published ghcr.io/kgateway-dev/extproc-server:0.0.1
       # image predates that flag, and no 0.0.2 tag is published.
       # KIND=kind uses the kind binary on the runner instead of `go tool kind`.
       kgw_src=$(mktemp -d)
       git clone --quiet --depth 1 --branch v2.4.7 https://github.com/kgateway-dev/kgateway.git "${kgw_src}"
       kind_cluster=$(kubectl config current-context)
       kind_cluster=${kind_cluster#kind-}
       echo "Loading the ExtProc server image into kind cluster ${kind_cluster}"
       make -C "${kgw_src}" extproc-server-docker EXTPROC_SERVER_VERSION=0.0.2
       make -C "${kgw_src}" cluster-load-extproc-server CLUSTER_NAME="${kind_cluster}" EXTPROC_SERVER_VERSION=0.0.2 KIND=kind
       rm -rf "${kgw_src}"
       {{< /doc-test >}}
