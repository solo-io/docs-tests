       {{< doc-test paths="filter-stages" >}}
       kubectl rollout status deployment/kgateway -n kgateway-system --timeout=300s
       policy_merge=$(kubectl get deployment kgateway -n kgateway-system \
         -o jsonpath='{.spec.template.spec.containers[*].env[?(@.name=="KGW_POLICY_MERGE")].value}')
       echo "KGW_POLICY_MERGE=${policy_merge}"
       if ! jq -e '.trafficPolicy.extProc == "DeepMerge"' <<<"${policy_merge}" >/dev/null; then
         echo "FAIL: after the Helm upgrade, the kgateway control plane does not have KGW_POLICY_MERGE trafficPolicy.extProc=DeepMerge" >&2
         exit 1
       fi
       {{< /doc-test >}}
- after:
