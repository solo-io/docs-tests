  content: |-
    {{< doc-test paths="match-header-regex" >}}
    YAMLTest -f - <<'EOF'
    - name: match-header-regex - request with valid pet, version, and Authorization headers returns 200
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "match.example:8080"
          Authorization: "Bearer 123"
          pet: "dogs"
          version: "3.0"
      source:
        type: local
      expect:
        statusCode: 200
    - name: match-header-regex - request with an invalid version header value returns 404
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
        method: GET
        headers:
          host: "match.example:8080"
          Authorization: "Bearer 123"
          pet: "dogs"
          version: "30"
      source:
        type: local
      expect:
        statusCode: 404
    EOF
    {{< /doc-test >}}
