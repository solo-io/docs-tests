  content: |-
    {{< doc-test paths="route-ordering" >}}
    # Older HTTPRoute: a short /anything prefix, plus bare prefixes that the newer route refines.
    kubectl apply -f- <<KEOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: ordering-older
      namespace: httpbin
    spec:
      parentRefs:
      - name: http
        namespace: kgateway-system
      hostnames:
      - ordering-specificity.example
      rules:
      - matches:
        - path:
            type: PathPrefix
            value: /anything
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: short-prefix
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: PathPrefix
            value: /anything/method
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: no-method
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: PathPrefix
            value: /anything/header
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: no-header
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: PathPrefix
            value: /anything/query
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: no-query
        backendRefs:
        - name: httpbin
          port: 8000
    KEOF
    # Creation timestamps have one-second resolution; make the second route strictly newer.
    sleep 2
    kubectl apply -f- <<KEOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: ordering-newer
      namespace: httpbin
    spec:
      parentRefs:
      - name: http
        namespace: kgateway-system
      hostnames:
      - ordering-specificity.example
      rules:
      - matches:
        - path:
            type: PathPrefix
            value: /anything/team
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: long-prefix
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: Exact
            value: /anything/team/exact
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: exact
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: PathPrefix
            value: /anything/method
          method: GET
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: method
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: PathPrefix
            value: /anything/header
          headers:
          - name: x-match
            value: a
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: header
        backendRefs:
        - name: httpbin
          port: 8000
      - matches:
        - path:
            type: PathPrefix
            value: /anything/query
          queryParams:
          - name: q
            value: a
        filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
            - name: X-Route
              value: query
        backendRefs:
        - name: httpbin
          port: 8000
    KEOF
    YAMLTest -f - <<'EOF'
    - name: wait for the ordering-older HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: ordering-older
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the ordering-newer HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: ordering-newer
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "specificity - a longer PathPrefix in a newer HTTPRoute wins over a shorter one in an older HTTPRoute"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team/1"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "long-prefix"
    - name: "specificity - a request that only the short prefix matches goes to the short prefix"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/other"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "short-prefix"
    - name: "specificity - Exact wins over PathPrefix"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team/exact"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "exact"
    - name: "specificity - a rule with a method match wins over a same-length prefix without one"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/method/1"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "method"
    - name: "specificity - a request with another method falls through to the rule without a method match"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/method/1"
        method: POST
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "no-method"
    - name: "specificity - a rule with a header match wins over a same-length prefix without one"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/header/1"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
          x-match: "a"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "header"
    - name: "specificity - a request without the header falls through to the rule without a header match"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/header/1"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "no-header"
    - name: "specificity - a rule with a query param match wins over a same-length prefix without one"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/query/1?q=a"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "query"
    - name: "specificity - a request without the query param falls through to the rule without a query param match"
      retries: 20
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything/query/1"
        method: GET
        headers:
          host: "ordering-specificity.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-Route'][0]"
          comparator: equals
          value: "no-query"
    EOF
    {{< /doc-test >}}
