    YAMLTest -f - <<'EOF'
    - name: match-method - GET request returns 200
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/get"
        method: GET
        headers:
          host: "match.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
    - name: match-method - POST request returns 404
      retries: 30
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/post"
        method: POST
        headers:
          host: "match.example:8080"
      source:
        type: local
      expect:
        statusCode: 404
    EOF
