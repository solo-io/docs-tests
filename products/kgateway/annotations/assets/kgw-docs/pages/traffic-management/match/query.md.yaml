  content: |2-
       {{< doc-test paths="match-query" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the httpbin-match HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: httpbin
               name: httpbin-match
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: "match-query - /status/200?user=me matches the user=me query parameter and returns 200"
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/status/200?user=me"
           method: GET
           headers:
             host: "match.example:8080"
         source:
           type: local
         expect:
           statusCode: 200
       - name: "match-query - /status/200 without the query parameter returns 404"
         retries: 20
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/status/200"
           method: GET
           headers:
             host: "match.example:8080"
         source:
           type: local
         expect:
           statusCode: 404
       EOF
       {{< /doc-test >}}
