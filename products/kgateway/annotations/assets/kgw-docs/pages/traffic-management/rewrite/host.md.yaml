  content: |-
    {{< doc-test paths="rewrite-host-external" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the backend-rewrite HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: default
            name: backend-rewrite
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: rewrite-host-external - the request reaches httpbin.org with the rewritten host and path
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "external-rewrite.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.Host[0]"
          comparator: equals
          value: "httpbin.org"
        - path: "$.url"
          comparator: matches
          value: "/headers$"
    EOF
    {{< /doc-test >}}
