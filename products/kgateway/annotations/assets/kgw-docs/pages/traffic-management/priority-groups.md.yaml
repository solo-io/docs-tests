            name: httpbin-backend
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: priority-groups - wait for the hello-world-backend Backend to be accepted
      wait:
        target:
          kind: Backend
          metadata:
            namespace: httpbin
            name: hello-world-backend
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: priority-groups - wait for the failover-backend priority groups Backend to be accepted
      wait:
        target:
          kind: Backend
          metadata:
            namespace: httpbin
            name: failover-backend
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: priority-groups - wait for the failover-healthcheck BackendConfigPolicy to be accepted
      wait:
        target:
          kind: BackendConfigPolicy
          metadata:
            namespace: httpbin
            name: failover-healthcheck
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: priority-groups - wait for the failover-route HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: failover-route
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: priority-groups - wait for the failover-route HTTPRoute to resolve its Backend reference
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: failover-route
        jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # pg_which: send one request to failover.example and print which app answered:
    # httpbin (its home page), hello-world (the nginxdemos/hello plain-text body),
    # or other.
    pg_which() {
      local code body
      body=$(curl -s --max-time 5 -w '\n%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/" -H "host: failover.example:8080" || true)
      code="${body##*$'\n'}"
      body="${body%$'\n'*}"
      if [ "$code" != 200 ]; then
        echo "other($code)"
      elif [[ "$body" == *"A golang port of the venerable"* ]]; then
        echo httpbin
      elif [[ "$body" == *"Server name: hello-world-"* ]]; then
        echo hello-world
      else
        echo "other($code)"
      fi
    }
    # pg_expect <app> <label>: retry until 5 requests in a row are answered by <app>.
    # Health checks run every 5s, so allow a few minutes for the proxy to switch.
    pg_expect() {
      local want="$1" label="$2" i got streak=0
      for i in $(seq 1 120); do
        got=$(pg_which)
        if [ "$got" = "$want" ]; then
          streak=$((streak + 1))
          if [ "$streak" -ge 5 ]; then
            echo "priority-groups: $label - 5 responses in a row came from $want"
            return 0
          fi
        else
          streak=0
          echo "priority-groups: $label - attempt $i answered by $got, waiting for $want"
          sleep 2
        fi
      done
      echo "priority-groups: $label - expected 5 responses in a row from $want, last answered by ${got:-nothing}"
      exit 1
    }
    {{< /doc-test >}}
