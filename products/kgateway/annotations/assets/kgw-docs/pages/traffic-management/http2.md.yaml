  content: |-
    {{< doc-test paths="http2" >}}
    # The access log entry for the nginx request records protocol HTTP/2, the
    # nginx backend cluster, and a 200 response code.
    h2_log_ok=false
    for i in $(seq 1 30); do
      h2_log=$(kubectl -n kgateway-system logs deployments/http --tail=500 2>/dev/null | python3 -c '
    import json, sys
    for line in sys.stdin:
        line = line.strip()
        if not line.startswith("{"):
            continue
        try:
            e = json.loads(line)
        except Exception:
            continue
        if str(e.get("authority", "")).startswith("http2.example.com") and e.get("protocol") == "HTTP/2" \
                and str(e.get("response_code")) == "200" and e.get("backendCluster") == "kube_default_nginx_8080":
            print(json.dumps(e, sort_keys=True))
    ' | tail -1 || true)
      if [ -n "$h2_log" ]; then
        h2_log_ok=true
        break
      fi
      sleep 2
    done
    if [ "$h2_log_ok" != true ]; then
      echo "http2: no access log entry for http2.example.com with protocol HTTP/2, backendCluster kube_default_nginx_8080, and response_code 200"
      kubectl -n kgateway-system logs deployments/http --tail=20 || true
      exit 1
    fi
    echo "http2: access log entry: $h2_log"
    {{< /doc-test >}}
