  content: |-
    {{< doc-test paths="http2" >}}
    # nginx accepts only HTTP/2 (listen 80 http2), so a 200 with the nginx welcome
    # page over HTTP/2 shows both the downstream and the upstream used HTTP/2.
    h2_ok=false
    for i in $(seq 1 60); do
      h2_out=$(curl -sk --max-time 5 --http2-prior-knowledge -o /tmp/http2-nginx-body.html -w '%{http_version} %{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/" -H "host: http2.example.com:8080" || true)
      if [ "$h2_out" = "2 200" ] && grep -q "Welcome to nginx!" /tmp/http2-nginx-body.html 2>/dev/null; then
        h2_ok=true
        break
      fi
      sleep 2
    done
    if [ "$h2_ok" != true ]; then
      echo "http2: expected an HTTP/2 200 with the nginx welcome page from host http2.example.com, got '${h2_out:-no response}' (http_version http_code)"
      exit 1
    fi
    echo "http2: http2.example.com returned HTTP/2 200 with the nginx welcome page"
    {{< /doc-test >}}
