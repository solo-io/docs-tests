  content: |-
    {{< doc-test paths="buffering" >}}
    # buffering_large <label> <expected code>: send the page's 2 KiB payload to
    # /anything until the gateway returns the expected status code. curl prints
    # 000 when the connection fails, so a reset never counts as a match.
    buffering_large() {
      local label="$1" want="$2" attempt code=""
      for attempt in $(seq 1 60); do
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "http://${INGRESS_GW_ADDRESS}:8080/anything" \
          -H "host: www.example.com:8080" \
          -H "Content-Type: text/plain" \
          --data-binary "{\"payload\": \"$(cat /tmp/large_payload_2k.txt)\"}" || true)
        [ "$code" = "$want" ] && { echo "$label: got $code"; return 0; }
        echo "$label: attempt $attempt got '${code:-no response}', want $want"
        sleep 2
      done
      echo "$label: the 2 KiB request never returned $want"
      exit 1
    }
    buffering_large "buffering - per gateway - the 2 KiB payload exceeds the 1 KiB listener buffer" 413
    {{< /doc-test >}}
