      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/anything"
        method: POST
        headers:
          host: "www.example.com:8080"
          Content-Type: application/json
        body: '{"payload":  "hello world"}'
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.json.payload"
          comparator: equals
          value: "hello world"
    EOF
    {{< /doc-test >}}
