  content: |-
    {{< doc-test paths="http-connect-tunnels" >}}
    # Requests for tunnel.example reach httpbin only through the Squid CONNECT tunnel.
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: tunnel.example") || true
      [ "$code" = "200" ] && break
      echo "tunnel.example returned '$code', retrying ($i/60)"; sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: request to tunnel.example through the gateway returned '$code', want 200"
      exit 1
    fi
    # The gateway proxy's CONNECT listener (stat prefix tunnel_<cluster>) must have
    # carried a connection, which proves the request went through the tunnel.
    stats=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- '127.0.0.1:19000/stats?filter=^tcp\.tunnel_')
    echo "$stats"
    if ! grep -Eq '^tcp\.tunnel_.*\.downstream_cx_total: [1-9]' <<<"$stats"; then
      echo "FAIL: no connection counted on the gateway proxy's CONNECT tunnel listener"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 13
    fingerprint: e6758ba8a864a432
    lang: console
    lines: e6758ba8
    preview: 10.244.0.32 CONNECT httpbin.httpbin.svc.cluster.local:8000 200 "Proxy-Authorizat
  content: |-
    {{< doc-test paths="http-connect-tunnels" >}}
    # Squid writes a CONNECT entry to its access log when the tunnel closes. The
    # gateway proxy keeps the upstream connection pooled, so if the entry is not
    # there yet, restart httpbin to close the tunnel from the destination side.
    want='CONNECT httpbin.httpbin.svc.cluster.local:8000 200 "Proxy-Authorization: Basic dXNlcjpwYXNz"'
    found=""
    for i in $(seq 1 10); do
      log=$(kubectl exec -n httpbin deploy/egress-proxy -- cat /var/log/squid/access.log) || true
      if grep -Fq "$want" <<<"$log"; then found=1; break; fi
      sleep 3
    done
    if [ -z "$found" ]; then
      echo "no CONNECT entry in the Squid access log yet; restarting httpbin to close the pooled tunnel"
      kubectl rollout restart deployment/httpbin -n httpbin
      kubectl rollout status deployment/httpbin -n httpbin --timeout=300s
      for i in $(seq 1 30); do
        log=$(kubectl exec -n httpbin deploy/egress-proxy -- cat /var/log/squid/access.log) || true
      if grep -Fq "$want" <<<"$log"; then found=1; break; fi
        sleep 3
      done
    fi
    kubectl exec -n httpbin deploy/egress-proxy -- cat /var/log/squid/access.log
    if [ -z "$found" ]; then
      echo "FAIL: the Squid access log has no line containing: $want"
      exit 1
    fi
    {{< /doc-test >}}
