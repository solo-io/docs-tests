    block_before:
      block: 16
      fingerprint: d3235f6235a723a1
      lang: bash
      lines: 0b763a0e 0e93116c
      preview: grpcurl -insecure -authority grpc.example.com localhost:8443 list
  content: |2-
       {{< doc-test paths="grpc-services" >}}
       YAMLTest -f - <<'EOF'
       # The runner has no grpcurl, so these checks run the page's grpcurl commands
       # from the grpcurl-client Pod that the page deploys, against the same GATEWAY_IP:443.
       - name: grpc-services - reflection list through grpc-gateway over TLS shows the Echo, health, and reflection services
         retries: 60
         command:
           command: "kubectl exec -n default grpcurl-client -c grpcurl -- grpcurl -insecure -authority grpc.example.com ${GATEWAY_IP}:443 list"
         source:
           type: local
         expect:
           exitCode: 0
           stdout:
           - contains: 'yages.Echo'
           - contains: 'grpc.health.v1.Health'
           - contains: 'grpc.reflection.v1alpha.ServerReflection'
       - name: grpc-services - describe yages.Echo through grpc-gateway over TLS shows the Ping and Reverse methods
         retries: 10
         command:
           command: "kubectl exec -n default grpcurl-client -c grpcurl -- grpcurl -insecure -authority grpc.example.com ${GATEWAY_IP}:443 describe yages.Echo"
         source:
           type: local
         expect:
           exitCode: 0
           stdout:
           - contains: 'yages.Echo is a service:'
           - contains: 'rpc Ping ( .yages.Empty ) returns ( .yages.Content );'
           - contains: 'rpc Reverse ( .yages.Content ) returns ( .yages.Content );'
       EOF
       {{< /doc-test >}}
