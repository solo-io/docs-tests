    preview: 'apiVersion: gateway.networking.k8s.io/v1'
  content: |-
    {{< doc-test paths="http-services" >}}
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: kube-backend
      namespace: httpbin
    spec:
      parentRefs:
      - name: http
        namespace: {{< reuse "kgw-docs/snippets/namespace.md" >}}
      hostnames:
        - httpbin.example.com
      rules:
        - backendRefs:
          - name: httpbin
            port: 8000
    EOF
    YAMLTest -f - <<'EOF'
    - name: the kube-backend HTTPRoute is accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: kube-backend
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 120
          intervalSeconds: 2
    - name: "http-services - httpbin.example.com is routed to the httpbin Service"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "httpbin.example.com"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains: "httpbin.example.com"
    EOF
    {{< /doc-test >}}
