    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="health-checks-gateway" >}}
    # Test-only: while Envoy is healthy, the proxy answers the health check path
    # itself with 200 and the x-envoy-upstream-healthchecked-cluster header. No
    # HTTPRoute matches this request (the Host is the bare address), so a 200 can
    # only come from the health check filter.
    ok=0
    for i in $(seq 1 60); do
      resp=$(curl -si --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/check/healthz" | tr -d '\r') || true
      status=$(head -n1 <<<"$resp" | awk '{print $2}')
      if [ "$status" = "200" ] && grep -qi '^x-envoy-upstream-healthchecked-cluster:' <<<"$resp"; then ok=1; break; fi
      echo "attempt $i: /check/healthz returned '${status:-no response}', waiting for 200 from the health check filter"
      sleep 2
    done
    [ "$ok" = "1" ] || { echo "/check/healthz did not return 200 with x-envoy-upstream-healthchecked-cluster:"; echo "$resp"; exit 1; }
    {{< /doc-test >}}
