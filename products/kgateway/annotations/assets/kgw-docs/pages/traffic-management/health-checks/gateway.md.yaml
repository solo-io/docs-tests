  content: |-
    {{< doc-test paths="health-checks-gateway" >}}
    # Test-only: without the ListenerPolicy, nothing answers /check/healthz for the
    # bare address, so the proxy returns 404 (no route).
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/check/healthz") || true
      [ "$code" = "404" ] && break
      echo "attempt $i: /check/healthz returned '${code:-no response}' after cleanup, waiting for 404"
      sleep 2
    done
    [ "$code" = "404" ] || { echo "/check/healthz still answered after the ListenerPolicy was deleted (got '$code')"; exit 1; }
    {{< /doc-test >}}
