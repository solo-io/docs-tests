  content: |-
    {{< doc-test paths="health-checks-gateway" >}}
    # Test-only: while Envoy fails health checks, the health check path returns 503
    # with x-envoy-immediate-health-check-fail: true. Check right away: the proxy's
    # readiness probe also fails now, and after about 30 seconds Kubernetes takes
    # the pod out of the load balancer.
    ok=0
    for i in $(seq 1 15); do
      resp=$(curl -si --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/check/healthz" | tr -d '\r') || true
      status=$(head -n1 <<<"$resp" | awk '{print $2}')
      if [ "$status" = "503" ] && grep -qi '^x-envoy-immediate-health-check-fail: true' <<<"$resp"; then ok=1; break; fi
      echo "attempt $i: /check/healthz returned '${status:-no response}', waiting for 503 from the failed health check"
      sleep 1
    done
    [ "$ok" = "1" ] || { echo "/check/healthz did not return 503 with x-envoy-immediate-health-check-fail: true:"; echo "$resp"; exit 1; }
    {{< /doc-test >}}
