    pod_ips() {
      kubectl get pods -n httpbin -l "app=health-check-demo,variant=$1" -o json \
        | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .status.podIP // empty'
    }
    # The health flags Envoy reports for one pod IP, from $flags.
    flags_for() {
      awk -F'::' -v host="$1:8000" '$2 == host {print $4}' <<<"$flags"
    }
    # Test-only: fix the failing Deployment (no injected errors). Its replacement
    # pod passes the health check, so Envoy marks every endpoint healthy and none
    # /failed_active_hc.
    kubectl set env deployment/health-check-demo-failing -n httpbin ERROR_RATE=0
    kubectl rollout status deployment/health-check-demo-failing -n httpbin --timeout=300s
    ok=0
    for i in $(seq 1 60); do
      flags=$(hc_flags)
      all=$(pod_ips failing; pod_ips ok)
      ok=1
      [ "$(wc -w <<<"$all")" -eq 3 ] || ok=0
      for ip in $all; do [ "$(flags_for "$ip")" = "healthy" ] || ok=0; done
      grep -q 'failed_active_hc' <<<"$flags" && ok=0
      [ "$ok" = "1" ] && break
      echo "attempt $i: waiting for Envoy to mark all three endpoints healthy after the fix"
      sleep 2
    done
    [ "$ok" = "1" ] || { echo "after fixing the failing Deployment, Envoy does not mark every endpoint healthy:"; echo "$flags"; exit 1; }
    echo "$flags"
    {{< /doc-test >}}
