    {{< doc-test paths="health-checks-backend,health-checks-backend-panic-default" >}}
    # Send 30 requests and count the response codes.
    send30() {
      for n in $(seq 1 30); do
        curl -s -o /dev/null -w "%{http_code}\n" --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/" -H "host: healthcheck.example" || true
      done
    }
    # Without a health check, some requests reach the failing pod: the 30 requests
    # return both 200 and 503, and nothing else.
    ok=0
    for round in $(seq 1 30); do
      codes=$(send30)
      n200=$(grep -c '^200$' <<<"$codes" || true)
      n503=$(grep -c '^503$' <<<"$codes" || true)
      if [ "$n200" -gt 0 ] && [ "$n503" -gt 0 ] && [ $((n200 + n503)) -eq 30 ]; then ok=1; break; fi
      echo "round $round: $n200 x 200 and $n503 x 503 of 30 requests; waiting for the route to reach all three pods"
      sleep 2
    done
    [ "$ok" = "1" ] || { echo "before the health check, expected a mix of 200 and 503 responses, got:"; sort <<<"$codes" | uniq -c; exit 1; }
    echo "before the health check: $n200 x 200, $n503 x 503"
    {{< /doc-test >}}
