  content: |-
    {{< doc-test paths="health-checks-backend,health-checks-backend-panic-default" >}}
    # Envoy's health flags for the sample app's endpoints, read from the admin
    # interface inside the proxy pod (127.0.0.1:19000; busybox wget in the image).
    hc_flags() {
      kubectl exec -n kgateway-system deploy/http -- wget -qO- http://127.0.0.1:19000/clusters 2>/dev/null \
        | grep 'health-check-demo' | grep '::health_flags::' || true
    }
    # IPs of the running (not terminating) pods of one Deployment variant.
    pod_ips() {
      kubectl get pods -n httpbin -l "app=health-check-demo,variant=$1" -o json \
        | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .status.podIP // empty'
    }
    # The health flags Envoy reports for one pod IP, from $flags.
    flags_for() {
      awk -F'::' -v host="$1:8000" '$2 == host {print $4}' <<<"$flags"
    }
    # The page's port-forward is not run. Envoy must mark exactly the failing pod
    # /failed_active_hc and both pods of the ok Deployment healthy.
    ok=0
    for i in $(seq 1 60); do
      flags=$(hc_flags)
      failing=$(pod_ips failing)
      healthy=$(pod_ips ok)
      ok=1
      { [ "$(wc -w <<<"$failing")" -eq 1 ] && [ "$(wc -w <<<"$healthy")" -eq 2 ]; } || ok=0
      for ip in $failing; do [[ "$(flags_for "$ip")" == *failed_active_hc* ]] || ok=0; done
      for ip in $healthy; do [ "$(flags_for "$ip")" = "healthy" ] || ok=0; done
      [ "$ok" = "1" ] && break
      echo "attempt $i: waiting for Envoy to mark only the failing pod (${failing:-none}) /failed_active_hc"
      sleep 2
    done
    [ "$ok" = "1" ] || { echo "Envoy health flags do not show only the failing pod as unhealthy:"; echo "$flags"; echo "failing pod: $failing; ok pods: $healthy"; exit 1; }
    echo "$flags"
    {{< /doc-test >}}
