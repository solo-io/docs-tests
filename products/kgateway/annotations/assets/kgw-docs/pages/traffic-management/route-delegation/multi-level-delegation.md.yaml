  content: |2-
       {{< doc-test paths="delegation-multi-level" >}}
       YAMLTest -f - <<'EOF'
       - name: multi-level - wait for the parent HTTPRoute (parent) to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: multi-level - wait for the child-team1 HTTPRoute (child) to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team1
               name: child-team1
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: multi-level - wait for the child-team2 HTTPRoute (child) to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team2
               name: child-team2
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: multi-level - wait for the grandchild HTTPRoute (grandchild) to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team2
               name: grandchild
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
