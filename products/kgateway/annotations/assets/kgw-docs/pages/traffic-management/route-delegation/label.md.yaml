    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="delegation-label" >}}
       YAMLTest -f - <<'EOF'
       - name: delegation-label - /anything/team1/foo returns 200 through child-team1
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/foo"
           method: GET
           headers:
             host: "delegation.example"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.url"
             comparator: matches
             value: "/anything/team1/foo$"
       - name: delegation-label - /anything/team2/bar returns 200 through child-team2
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team2/bar"
           method: GET
           headers:
             host: "delegation.example"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.url"
             comparator: matches
             value: "/anything/team2/bar$"
       - name: delegation-label - /anything/team1/bar returns 404 because no child HTTPRoute matches it
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/bar"
           method: GET
           headers:
             host: "delegation.example"
         source:
           type: local
         expect:
           statusCode: 404
       EOF
       {{< /doc-test >}}
