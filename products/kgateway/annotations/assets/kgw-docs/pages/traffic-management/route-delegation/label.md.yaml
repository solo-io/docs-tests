  content: |2-
       {{< doc-test paths="delegation-label" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the label parent HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the label parent HTTPRoute delegation refs to be resolved
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
