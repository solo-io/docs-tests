  content: |2-
       {{< doc-test paths="delegation-inheritance-native" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the parent HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the child-team1 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team1
               name: child-team1
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the child-team2 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team2
               name: child-team2
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       for i in $(seq 1 60); do
         out1=$(curl -s --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/foo" -H "host: delegation.example:8080" || true)
         out2=$(curl -s --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/anything/team2/bar" -H "host: delegation.example:8080" || true)
         if echo "$out1" | grep -q '"X-Envoy-Expected-Rq-Timeout-Ms"' && echo "$out2" | grep -q '"X-Envoy-Expected-Rq-Timeout-Ms"'; then break; fi
         sleep 2
       done
       {{< /doc-test >}}
