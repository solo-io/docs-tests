    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="delegation-header-query" >}}
       YAMLTest -f - <<'EOF'
       - name: delegation-header-query - /anything/team1/foo with all parent and child matchers returns 200
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/foo?query1=val1&queryX=valX"
           method: GET
           headers:
             host: "delegation.example"
             header1: "val1"
             headerX: "valX"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.args.queryX[0]"
             comparator: equals
             value: "valX"
       - name: delegation-header-query - /anything/team1/foo with only the parent matchers returns 404
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/foo?query1=val1"
           method: GET
           headers:
             host: "delegation.example"
             header1: "val1"
         source:
           type: local
         expect:
           statusCode: 404
       - name: delegation-header-query - /anything/team2/bar returns 500 because child-team2 does not repeat the parent matchers
         retries: 60
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team2/bar?queryX=valX&query2=val2"
           method: GET
           headers:
             host: "delegation.example"
             headerX: "valX"
             header2: "val2"
         source:
           type: local
         expect:
           statusCode: 500
           bodyContains: "invalid route configuration detected and replaced with a direct response"
       EOF
       {{< /doc-test >}}
