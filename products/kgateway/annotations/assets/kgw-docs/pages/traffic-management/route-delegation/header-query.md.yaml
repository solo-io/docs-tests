       YAMLTest -f - <<'EOF'
       - name: wait for the header and query parent HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
