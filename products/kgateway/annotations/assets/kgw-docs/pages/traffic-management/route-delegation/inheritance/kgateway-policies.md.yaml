             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the child-team1 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team1
               name: child-team1
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
