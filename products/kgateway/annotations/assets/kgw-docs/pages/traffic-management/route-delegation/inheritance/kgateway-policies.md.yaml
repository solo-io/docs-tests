             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the child-policy TrafficPolicy to be accepted
         wait:
           target:
             kind: TrafficPolicy
             metadata:
               namespace: team1
               name: child-policy
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       # Each domain is limited to 1 request per 60s. Send requests until the local
       # rate limit answers 429 on both domains, which shows that the parent-policy is
       # programmed, then wait for both token buckets to refill before the checks.
       for host in delegation-parent1.example delegation-parent2.example; do
         for i in $(seq 1 60); do
           code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/foo" -H "host: ${host}:8080" || true)
           if [ "$code" = "429" ]; then break; fi
           sleep 2
         done
       done
       sleep 65
       {{< /doc-test >}}
