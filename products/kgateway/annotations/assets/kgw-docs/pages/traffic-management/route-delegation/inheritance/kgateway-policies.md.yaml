  content: |2-
       {{< doc-test paths="delegation-inheritance-kgateway" >}}
       YAMLTest -f - <<'EOF'
       - name: "delegation-inheritance-kgateway - parent1 (ShallowMergePreferParent) applies the parent transformation, not the child one"
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/anything/team1/foo"
           method: GET
           headers:
             host: "delegation-parent1.example:8080"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers['X-Parent-Policy'][0]"
             comparator: equals
             value: "This policy is inherited from the parent."
           - path: "$.headers['X-Child-Team1']"
             comparator: exists
             negate: true
       EOF
       {{< /doc-test >}}
