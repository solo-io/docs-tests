  content: |2-
       {{< doc-test paths="delegation-multi-parent" >}}
       YAMLTest -f - <<'EOF'
       - name: multi-parent - wait for the parent1 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent1
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: multi-parent - wait for the parent2 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent2
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: multi-parent - wait for the child-team1 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team1
               name: child-team1
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: multi-parent - wait for the child-team2 HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team2
               name: child-team2
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
