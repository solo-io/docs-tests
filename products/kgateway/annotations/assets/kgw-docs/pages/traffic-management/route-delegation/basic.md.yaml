    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="delegation-basic" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the parent HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the parent HTTPRoute delegation refs to be resolved
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: kgateway-system
               name: parent
           jsonPath: "$.status.parents[0].conditions[?(@.type=='ResolvedRefs')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       - name: wait for the child-team2 HTTPRoute to be accepted by its parent HTTPRoute
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: team2
               name: child-team2
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
