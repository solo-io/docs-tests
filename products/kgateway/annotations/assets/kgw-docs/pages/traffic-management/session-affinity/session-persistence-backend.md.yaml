    preview: '...'
  content: |-
    {{< doc-test paths="affinity-session-persistence,affinity-session-persistence-policy" >}}
    # Test-only: replaces the reader's curl and kubectl logs steps. The first
    # response sets the Session-A cookie; requests with that cookie stay on one pod,
    # while requests without it are load balanced across both pods.
    SA_HOST="www.example.com:8080"
    sp_cookie=""
    for attempt in $(seq 1 60); do
      hdrs=$(curl -s -D - -o /dev/null --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: ${SA_HOST}" | tr -d '\r' || true)
      sp_cookie=$(printf '%s\n' "$hdrs" | grep -i '^set-cookie: Session-A=' | head -n 1 || true)
      if [ -n "$sp_cookie" ]; then break; fi
      sleep 2
    done
    if [ -z "$sp_cookie" ]; then echo "the response has no set-cookie header for Session-A"; exit 1; fi
    echo "$sp_cookie"
    case "$sp_cookie" in *"Max-Age=1800"*) ;; *) echo "the Session-A cookie does not have Max-Age=1800 (absoluteTimeout 30m, Permanent)"; exit 1 ;; esac
    SP_VALUE=$(printf '%s\n' "$sp_cookie" | sed 's/^[^=]*=\([^;]*\).*/\1/')
    sa_expect session-persistence-no-cookie spread
    sa_expect session-persistence-same-cookie sticky -H "cookie: Session-A=${SP_VALUE}"
    SP_POD="$SA_LAST_POD"
    {{< /doc-test >}}
