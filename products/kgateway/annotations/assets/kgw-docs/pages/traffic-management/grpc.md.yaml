  content: |-
    {{< doc-test paths="grpc" >}}
    YAMLTest -f - <<'EOF'
    - name: grpc - yages.Echo/Ping through the grpc Gateway returns pong
      retries: 60
      command:
        command: "kubectl exec -n kgateway-system grpcurl-client -c grpcurl -- grpcurl -plaintext -authority grpc.com -vv grpc:80 yages.Echo/Ping"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: '"text": "pong"'
    - name: grpc - reflection list through the grpc Gateway includes yages.Echo
      retries: 10
      command:
        command: "kubectl exec -n kgateway-system grpcurl-client -c grpcurl -- grpcurl -plaintext -authority grpc.com -vv grpc:80 list"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: "yages.Echo"
    - name: grpc - describe yages.Echo through the grpc Gateway shows the Reverse method
      retries: 10
      command:
        command: "kubectl exec -n kgateway-system grpcurl-client -c grpcurl -- grpcurl -plaintext -authority grpc.com -vv grpc:80 describe yages.Echo"
      source:
        type: local
      expect:
        exitCode: 0
        stdout:
          contains: "rpc Reverse"
    EOF
    {{< /doc-test >}}
