    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="add-request-header" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the httpbin-headers HTTPRoute to be accepted
         wait:
           target:
             kind: HTTPRoute
             metadata:
               namespace: httpbin
               name: httpbin-headers
           jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       for i in $(seq 1 60); do
         out=$(curl -s --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: headers.example:8080" -H "user-agent: doc-test" || true)
         if echo "$out" | grep -q '"My-Header"'; then break; fi
         sleep 2
       done
       YAMLTest -f - <<'EOF'
       - name: "add-request-header - HTTPRoute filter adds my-header: hello"
         retries: 5
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
           method: GET
           headers:
             host: "headers.example:8080"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers['My-Header'][0]"
             comparator: equals
             value: "hello"
       - name: "add-request-header - HTTPRoute filter appends hello to an existing my-header: foo"
         retries: 5
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
           method: GET
           headers:
             host: "headers.example:8080"
             my-header: "foo"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers['My-Header'][0]"
             comparator: equals
             value: "foo"
           - path: "$.headers['My-Header'][1]"
             comparator: equals
             value: "hello"
       EOF
       {{< /doc-test >}}
