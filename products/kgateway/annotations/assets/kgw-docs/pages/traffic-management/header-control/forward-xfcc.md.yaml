    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="forward-xfcc" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the forward-xfcc ListenerPolicy to be accepted
         wait:
           target:
             kind: ListenerPolicy
             metadata:
               namespace: kgateway-system
               name: forward-xfcc
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: forward-xfcc - AlwaysForwardOnly forwards the client's XFCC header unchanged on a plain HTTP listener
         retries: 40
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
           method: GET
           headers:
             host: "www.example.com:8080"
             x-forwarded-client-cert: "By=spiffe://cluster.local/ns/default/sa/backend;Hash=abc123"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers.X-Forwarded-Client-Cert[0]"
             comparator: equals
             value: "By=spiffe://cluster.local/ns/default/sa/backend;Hash=abc123"
       EOF
       {{< /doc-test >}}
- after:
    block: 7
    fingerprint: 1bea0c5b88abd264
    lang: yaml
    lines: 16c71da1 d664f32c 9144003f 8c8c4228 cc92cbb9 0bebd850 36184fa5 588a5d84 b5a028c9 cd44d8cd 9278ed91 0b02fb9c 74de47a5 97ff51db d4dcf0cb abc56510
    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="forward-xfcc" >}}
    YAMLTest -f - <<'EOF'
    - name: forward-xfcc - ForwardOnly strips the XFCC header on a plain HTTP listener
      retries: 40
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com:8080"
          x-forwarded-client-cert: "By=spiffe://cluster.local/ns/default/sa/backend;Hash=abc123"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.X-Forwarded-Client-Cert"
          comparator: exists
          negate: true
    EOF
    # Test scaffolding: reset to AlwaysForwardOnly (header forwarded) so that the
    # next section's 'header is stripped' check proves the new mode took effect.
    kubectl patch listenerpolicy forward-xfcc -n kgateway-system --type merge \
      -p '{"spec":{"default":{"httpSettings":{"forwardClientCertDetails":{"mode":"AlwaysForwardOnly","details":null}}}}}'
    YAMLTest -f - <<'EOF'
    - name: forward-xfcc - after ForwardOnly, reset to AlwaysForwardOnly forwards the XFCC header again
      retries: 40
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
        method: GET
        headers:
          host: "www.example.com:8080"
          x-forwarded-client-cert: "By=spiffe://cluster.local/ns/default/sa/backend;Hash=abc123"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.X-Forwarded-Client-Cert[0]"
          comparator: equals
          value: "By=spiffe://cluster.local/ns/default/sa/backend;Hash=abc123"
    EOF
    {{< /doc-test >}}
