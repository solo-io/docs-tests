  content: |2-
       {{< doc-test paths="forward-xfcc" >}}
       YAMLTest -f - <<'EOF'
       - name: forward-xfcc - without a ListenerPolicy, the gateway strips the XFCC header
         retries: 5
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
           method: GET
           headers:
             host: "www.example.com:8080"
             x-forwarded-client-cert: "By=spiffe://cluster.local/ns/default/sa/backend;Hash=abc123"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers.X-Forwarded-Client-Cert"
             comparator: exists
             negate: true
       EOF
       {{< /doc-test >}}
