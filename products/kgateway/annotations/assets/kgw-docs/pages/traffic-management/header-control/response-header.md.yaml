    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="add-response-header" >}}
    YAMLTest -f - <<'EOF'
    - name: "add-response-header - wait for the httpbin-headers HTTPRoute to be accepted"
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-headers
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: "add-response-header - HTTPRoute filter adds my-response: hello"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/response-headers"
        method: GET
        headers:
          host: "headers.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        headers:
          - name: my-response
            comparator: equals
            value: "hello"
    - name: "add-response-header - HTTPRoute filter appends to an existing my-response header"
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080/response-headers?my-response=world"
        method: GET
        headers:
          host: "headers.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
        headers:
          - name: my-response
            comparator: contains
            value: "world"
          - name: my-response
            comparator: contains
            value: "hello"
    EOF
    {{< /doc-test >}}
