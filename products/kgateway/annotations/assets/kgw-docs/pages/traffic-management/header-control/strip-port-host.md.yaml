    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="strip-port-host" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the strip-host-port ListenerPolicy to be accepted
         wait:
           target:
             kind: ListenerPolicy
             metadata:
               namespace: kgateway-system
               name: strip-host-port
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 120
             intervalSeconds: 2
       - name: strip-port-host - AnyPort strips port 9999 from the Host header
         retries: 40
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
           method: GET
           headers:
             host: "www.example.com:9999"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers.Host[0]"
             comparator: equals
             value: "www.example.com"
       EOF
       {{< /doc-test >}}
