  content: |2-
       {{< doc-test paths="strip-port-host" >}}
       YAMLTest -f - <<'EOF'
       - name: strip-port-host - without a ListenerPolicy, the port in the Host header is forwarded
         retries: 5
         http:
           url: "http://${INGRESS_GW_ADDRESS}:8080/headers"
           method: GET
           headers:
             host: "www.example.com:9999"
         source:
           type: local
         expect:
           statusCode: 200
           bodyJsonPath:
           - path: "$.headers.Host[0]"
             comparator: equals
             value: "www.example.com:9999"
       EOF
       {{< /doc-test >}}
- after:
