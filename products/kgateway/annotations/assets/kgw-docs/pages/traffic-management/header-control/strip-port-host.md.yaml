  content: |2-
       {{< doc-test paths="strip-port-host" >}}
       YAMLTest -f - <<'EOF'
       - name: strip-port-host - the http Gateway listener is on port 8080
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: kgateway-system
               name: http
           jsonPath: "$.spec.listeners[?(@.name=='http')].port"
           jsonPathExpectation:
             comparator: equals
             value: 8080
           polling:
             timeoutSeconds: 30
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
