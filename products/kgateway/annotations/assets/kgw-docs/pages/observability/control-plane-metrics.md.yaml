    preview: '# HELP kgateway_controller_reconciliations_total Total controller reconciliation'
  content: |-
    {{< doc-test paths="control-plane-metrics" >}}
    # Test-only: the CI runner cannot forward ports, so read the control plane's
    # metrics endpoint on port 9092 through the Kubernetes API server's service
    # proxy instead. Check the metric in the example output and a few metrics
    # from the reference table that every install with a Gateway reports.
    metrics=""
    for i in $(seq 1 30); do
      metrics=$(kubectl get --raw "/api/v1/namespaces/kgateway-system/services/kgateway:9092/proxy/metrics" 2>/dev/null || true)
      grep -q '^kgateway_controller_reconciliations_total{.*controller="gateway".*result="success".*}' <<<"$metrics" && break
      echo "waiting for the control plane to report gateway reconciliations ($i/30)"; sleep 5
    done
    if ! grep -q '^# TYPE kgateway_controller_reconciliations_total counter' <<<"$metrics"; then
      echo "FAIL: /metrics has no kgateway_controller_reconciliations_total counter"
      head -40 <<<"$metrics"; exit 1
    fi
    if ! grep -q '^kgateway_controller_reconciliations_total{.*controller="gateway".*result="success".*}' <<<"$metrics"; then
      echo "FAIL: /metrics has no successful gateway reconciliation in kgateway_controller_reconciliations_total"
      grep '^kgateway_controller_reconciliations_total' <<<"$metrics"; exit 1
    fi
    if ! grep -q '^kgateway_controller_reconciliations_total{.*controller="gatewayclass".*result="success".*}' <<<"$metrics"; then
      echo "FAIL: /metrics has no successful gatewayclass reconciliation in kgateway_controller_reconciliations_total"
      grep '^kgateway_controller_reconciliations_total' <<<"$metrics"; exit 1
    fi
    for m in kgateway_controller_reconcile_duration_seconds kgateway_translator_translations_total kgateway_xds_snapshot_transforms_total kgateway_resources_managed; do
      if ! grep -q "^# TYPE ${m} " <<<"$metrics"; then
        echo "FAIL: /metrics has no ${m} metric from the reference table"
        exit 1
      fi
    done
    {{< /doc-test >}}
