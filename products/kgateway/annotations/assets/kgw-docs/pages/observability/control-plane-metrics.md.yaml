    metrics=$(kubectl get --raw "/api/v1/namespaces/kgateway-system/services/kgateway:9092/proxy/metrics")
    if ! grep -q '^kgateway_controller_reconciliations_total' <<<"$metrics"; then
      echo "FAIL: could not read the control plane metrics endpoint"
      exit 1
    fi
    if grep -q '^kgateway_envoy_xds_rejects_\(total\|active\){' <<<"$metrics"; then
      echo "FAIL: NACK metrics are present although the proxy accepted all configuration:"
      grep '^kgateway_envoy_xds_rejects_' <<<"$metrics"; exit 1
    fi
    {{< /doc-test >}}
