- after:
    block: 1
    fingerprint: 30990f64f37fa317
    lang: console
    lines: e9c9871d 1f56dc7e
    preview: '# TYPE envoy_cluster_external_upstream_rq counter'
  content: |-
    {{< doc-test paths="gateway-metrics,gateway-metrics-inclusion,gateway-metrics-exclusion" >}}
    # Instead of the port-forward, read the stats from inside the proxy pod. Send
    # requests to httpbin first so that the upstream request counter exists.
    found=""
    for i in $(seq 1 60); do
      curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" || true
      stats=$(kubectl -n kgateway-system exec deploy/http -- wget -qO- http://127.0.0.1:19000/stats/prometheus 2>/dev/null || true)
      line=$(grep '^envoy_cluster_external_upstream_rq{' <<<"$stats" | grep 'envoy_cluster_name="kube_httpbin_httpbin_8000"' | grep 'envoy_response_code="200"' || true)
      if [ -n "$line" ]; then found=1; echo "$line"; break; fi
      echo "attempt $i: no envoy_cluster_external_upstream_rq series for kube_httpbin_httpbin_8000 yet"
      sleep 2
    done
    [ -n "$found" ] || { echo "the proxy stats do not show 200 responses from the kube_httpbin_httpbin_8000 cluster"; exit 1; }
    grep -q '^envoy_server_live' <<<"$stats" || { echo "the default proxy stats have no envoy_server_live"; exit 1; }
    # The proxy pod is annotated for Prometheus scraping, and the scrape endpoint
    # on port 9091 serves the same stats.
    scrape=$(kubectl -n kgateway-system get deploy http -o jsonpath='{.spec.template.metadata.annotations.prometheus\.io/scrape}')
    [ "$scrape" = "true" ] || { echo "the http proxy pod template has prometheus.io/scrape='$scrape', expected true"; exit 1; }
    metrics=$(kubectl -n kgateway-system exec deploy/http -- wget -qO- http://127.0.0.1:9091/metrics)
    grep -q '^envoy_cluster_external_upstream_rq{' <<<"$metrics" || { echo "port 9091 /metrics does not serve the Envoy stats"; exit 1; }
    {{< /doc-test >}}
- after:
