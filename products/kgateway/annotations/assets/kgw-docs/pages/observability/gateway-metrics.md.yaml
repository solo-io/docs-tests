  content: |-
    {{< doc-test paths="gateway-metrics" >}}
    # Per-listener stat prefix: the HTTP listener on port 8080 reports http_8080,
    # not the earlier shared prefix http.
    curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" || true
    prom=$(kubectl -n kgateway-system exec deploy/http -- wget -qO- http://127.0.0.1:19000/stats/prometheus)
    rq=$(grep '^envoy_http_downstream_rq_total{' <<<"$prom" || true)
    [[ "$rq" == *'envoy_http_conn_manager_prefix="http_8080"'* ]] || { echo "no envoy_http_downstream_rq_total series with envoy_http_conn_manager_prefix=\"http_8080\""; echo "$rq"; exit 1; }
    if grep -qE 'envoy_http_conn_manager_prefix="http"[,}]' <<<"$rq"; then echo "a listener still uses the earlier shared prefix http"; echo "$rq"; exit 1; fi
    admin=$(kubectl -n kgateway-system exec deploy/http -- wget -qO- http://127.0.0.1:19000/stats)
    grep -q '^http\.http_8080\.downstream_rq_total:' <<<"$admin" || { echo "the admin stats have no http.http_8080.downstream_rq_total"; exit 1; }
    {{< /doc-test >}}
