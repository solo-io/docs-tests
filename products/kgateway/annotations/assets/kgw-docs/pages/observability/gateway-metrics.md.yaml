    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="gateway-metrics-inclusion" >}}
    # The deployer writes the inclusion list into the proxy bootstrap ConfigMap.
    boot=""
    for i in $(seq 1 60); do
      boot=$(kubectl -n kgateway-system get configmap http -o jsonpath='{.data.envoy\.yaml}' 2>/dev/null || true)
      [[ "$boot" == *inclusion_list* ]] && break
      sleep 2
    done
    [[ "$boot" == *inclusion_list* ]] || { echo "the proxy bootstrap ConfigMap has no stats_matcher inclusion_list"; exit 1; }
    # The proxy emits only the included stats: http.* stats stay, and server.*
    # stats such as envoy_server_live are gone.
    ok=""
    for i in $(seq 1 30); do
      curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" || true
      prom=$(kubectl -n kgateway-system exec deploy/http -- wget -qO- http://127.0.0.1:19000/stats/prometheus 2>/dev/null || true)
      if grep -q '^envoy_http_downstream_rq_total{' <<<"$prom" && ! grep -q '^envoy_server_live' <<<"$prom"; then ok=1; break; fi
      echo "attempt $i: the proxy still reports server.* stats that the inclusion list leaves out"
      sleep 4
    done
    [ -n "$ok" ] || { echo "The running proxy still emits stats outside the inclusion list. The matcher is in the bootstrap ConfigMap, but Envoy reads its bootstrap only at startup, so the page may need a step that restarts the proxy, such as kubectl rollout restart deployment/http."; exit 1; }
    {{< /doc-test >}}
