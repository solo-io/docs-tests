  content: |-
    {{< doc-test paths="otel-stack" >}}
    # Loki (single binary), its MinIO object store, and Tempo come up. The Loki
    # chunks and results caches request several GiB of memory and can stay
    # Pending on a small runner. Loki serves without them, so the test reports
    # them but does not require them.
    kubectl -n telemetry rollout status statefulset/loki --timeout=600s
    for r in $(kubectl -n telemetry get statefulset,deployment -o name | grep minio || true); do
      kubectl -n telemetry rollout status "$r" --timeout=600s
    done
    kubectl -n telemetry rollout status statefulset/tempo --timeout=600s
    kubectl -n telemetry get pods -o wide
    pending=$(kubectl -n telemetry get pods --field-selector=status.phase=Pending -o name)
    if [ -n "$pending" ]; then
      echo "warning: these pods are still Pending (not required by this test): $pending"
      kubectl -n telemetry describe $pending | grep -A6 '^Events:' || true
    fi
    {{< /doc-test >}}
