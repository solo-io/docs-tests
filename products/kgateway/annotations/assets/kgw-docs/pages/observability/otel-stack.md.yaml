  content: |-
    {{< doc-test paths="otel-stack" >}}
    # Query Prometheus and Grafana from inside the cluster with a curl pod.
    kubectl -n telemetry run otel-stack-check --image=curlimages/curl:8.11.1 --restart=Never --command -- sleep 7200
    kubectl -n telemetry wait pod/otel-stack-check --for=condition=Ready --timeout=300s
    # The metrics collector scrapes the gateway proxy (envoy_*) and the control
    # plane (kgateway_*) and remote-writes the series to Prometheus.
    prom_count() {
      kubectl -n telemetry exec otel-stack-check -- curl -sfG \
        http://kube-prometheus-stack-prometheus.telemetry.svc:9090/api/v1/query \
        --data-urlencode "query=count({__name__=~\"$1\"})" 2>/dev/null || true
    }
    for metric in 'envoy_.+' 'kgateway_.+'; do
      ok=""
      for i in $(seq 1 60); do
        out=$(prom_count "$metric")
        if [[ "$out" == *'"result":[{'* ]]; then ok=1; echo "Prometheus has $metric series: $out"; break; fi
        echo "attempt $i: no $metric series in Prometheus yet"
        sleep 5
      done
      if [ -z "$ok" ]; then
        echo "Prometheus has no $metric series: the metrics collector did not remote-write the kgateway metrics"
        kubectl -n telemetry logs deploy/opentelemetry-collector-metrics --tail=50 || true
        exit 1
      fi
    done
    # Grafana is up and has the Prometheus, Tempo, and Loki data sources.
    ds=""
    for i in $(seq 1 30); do
      ds=$(kubectl -n telemetry exec otel-stack-check -- curl -sf -u admin:prom-operator \
        http://kube-prometheus-stack-grafana.telemetry.svc/api/datasources 2>/dev/null || true)
      [[ "$ds" == *'"type":"prometheus"'* && "$ds" == *'"type":"tempo"'* && "$ds" == *'"type":"loki"'* ]] && break
      echo "attempt $i: Grafana data sources not ready: ${ds:0:200}"
      sleep 5
    done
    [[ "$ds" == *'"type":"prometheus"'* && "$ds" == *'"type":"tempo"'* && "$ds" == *'"type":"loki"'* ]] || { echo "Grafana does not list the Prometheus, Tempo, and Loki data sources"; exit 1; }
    {{< /doc-test >}}
