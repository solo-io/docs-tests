  content: |-
    {{< doc-test paths="tracing,tracing-disable" >}}
    # Send requests until the collector's debug exporter prints gateway spans with
    # the auto-populated resource attributes from the example output.
    ok=""
    for i in $(seq 1 40); do
      curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/get" -H "host: www.example.com:8080" || true
      sleep 3
      out=$(kubectl -n kgateway-system logs otel-collector 2>/dev/null || true)
      if [[ "$out" == *'Span #'* && "$out" == *'service.name: Str(http.kgateway-system)'* && "$out" == *'service.namespace: Str(kgateway-system)'* && "$out" == *'k8s.pod.name: Str(http-'* && "$out" == *'k8s.namespace.name: Str(kgateway-system)'* ]]; then ok=1; break; fi
      echo "attempt $i: no gateway spans with the expected resource attributes yet"
    done
    [ -n "$ok" ] || { echo "the OTel collector did not receive gateway spans with the expected resource attributes"; kubectl -n kgateway-system logs otel-collector --tail=60 || true; exit 1; }
    {{< /doc-test >}}
