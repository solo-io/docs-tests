    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="tracing-disable" >}}
    # Requests on the httpbin route stop producing spans. Each attempt sends a
    # request with a unique path and checks the collector for it. Envoy flushes
    # spans every few seconds, so wait before checking, and pass after two
    # attempts in a row whose path never shows up.
    quiet=0
    for i in $(seq 1 15); do
      marker="doc-test-disable-$i-$RANDOM"
      curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/anything/$marker" -H "host: www.example.com:8080" || true
      sleep 12
      out=$(kubectl -n kgateway-system logs otel-collector --since=1m 2>/dev/null || true)
      if [[ "$out" == *"$marker"* ]]; then quiet=0; echo "attempt $i: the request to /anything/$marker was still traced"; else quiet=$((quiet + 1)); echo "attempt $i: no span for /anything/$marker"; fi
      [ "$quiet" -ge 2 ] && break
    done
    [ "$quiet" -ge 2 ] || { echo "requests on the httpbin route are still traced after tracing was disabled for the route"; exit 1; }
    {{< /doc-test >}}
