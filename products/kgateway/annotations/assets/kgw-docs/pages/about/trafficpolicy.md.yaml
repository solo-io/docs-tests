  content: |-
    {{< doc-test paths="trafficpolicy" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the httpbin HTTPRoute with the named rules rule0 and rule1 to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: rule0 (/anything/path1) on the trafficpolicy.example host returns 200 before any policy is attached
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /anything/path1
        method: GET
        headers:
          host: "trafficpolicy.example"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
