    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="trafficpolicy" >}}
    # The policy targets only rule1 (/anything/path2) and allows 1 request per 100s.
    # Repeated requests to /anything/path2 must hit the limit (429).
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/anything/path2" -H "host: trafficpolicy.example") || true
      [ "$code" = "429" ] && break
      echo "rule1 (/anything/path2) returned '${code}', want 429 once the rate limit applies, retrying ($i/60)"
      sleep 2
    done
    if [ "$code" != "429" ]; then
      echo "FAIL: the local-ratelimit TrafficPolicy attached to rule1 never rate limited /anything/path2"
      exit 1
    fi
    # rule0 (/anything/path1) is in the same HTTPRoute but not targeted, so it is never limited.
    for i in $(seq 1 5); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/anything/path1" -H "host: trafficpolicy.example") || true
      if [ "$code" != "200" ]; then
        echo "FAIL: rule0 (/anything/path1) returned '${code}' on request $i, want 200; the rule1 policy leaked to rule0"
        exit 1
      fi
    done
    echo "rate limit applies to rule1 only"
    {{< /doc-test >}}
