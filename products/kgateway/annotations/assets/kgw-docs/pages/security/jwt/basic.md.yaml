      preview: curl -vik localhost:8080/headers \
  content: |-
    {{< doc-test paths="simple-basic" >}}
    # Test-only: the sample token is signed by the key in the inline JWKS, has the
    # kgateway.dev issuer, and expires in 2035. A token with a broken signature is
    # denied. By default the gateway removes the token before it forwards the request.
    YAMLTest -f - <<'EOF'
    - name: simple-basic - a request with the sample JWT succeeds and the token is not forwarded
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.Authorization"
          comparator: exists
          negate: true
    - name: simple-basic - a request with a JWT whose signature does not verify is denied with 401
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${TOKEN}x"
      source:
        type: local
      expect:
        statusCode: 401
    EOF
    {{< /doc-test >}}
