    YAMLTest -f - <<'EOF'
    - name: wait for the jwt-policy TrafficPolicy to be accepted (jwtAuth with the selfminted-jwt GatewayExtension)
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: kgateway-system
            name: jwt-policy
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the httpbin HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
