    {{< doc-test paths="claim-based-rbac" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the jwt-policy TrafficPolicy to be accepted (jwtAuth and rbac team == dev)
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: kgateway-system
            name: jwt-policy
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
