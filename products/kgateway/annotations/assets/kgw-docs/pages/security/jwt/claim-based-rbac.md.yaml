  content: |-
    {{< doc-test paths="claim-based-rbac" >}}
    YAMLTest -f - <<'EOF'
    - name: claim-based-rbac - a request with the sample JWT (team dev) is allowed
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
    - name: claim-based-rbac - a request without a JWT is denied with 401
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 401
    EOF
    {{< /doc-test >}}
