  content: |-
    {{< doc-test paths="jwt-claim-extraction" >}}
    # Test-only: the gateway fetches the JWKS from the auth.example.com stand-in
    # through the auth-idp Backend over TLS, verifies the token, and copies the sub
    # and email claims into X-User-ID and X-User-Email (httpbin shows them as
    # X-User-Id and X-User-Email).
    YAMLTest -f - <<'EOF'
    - name: jwt-claim-extraction - a valid JWT is accepted and the sub and email claims reach the backend as headers
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${JCE_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-User-Id'][0]"
          comparator: equals
          value: user-12345
        - path: "$.headers['X-User-Email'][0]"
          comparator: equals
          value: alice@example.com
    - name: jwt-claim-extraction - a JWT without an email claim gets X-User-ID but no X-User-Email header
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${JCE_TOKEN_NO_EMAIL}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-User-Id'][0]"
          comparator: equals
          value: user-67890
        - path: "$.headers['X-User-Email']"
          comparator: exists
          negate: true
    - name: jwt-claim-extraction - an X-User-ID header from the client is overwritten with the verified sub claim
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${JCE_TOKEN}"
          X-User-ID: "attacker"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers['X-User-Id'][0]"
          comparator: equals
          value: user-12345
        - path: "$.headers['X-User-Id'][1]"
          comparator: exists
          negate: true
    - name: jwt-claim-extraction - a request without a JWT is denied with 401
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 401
    - name: jwt-claim-extraction - a JWT for another audience is denied with 401
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${JCE_TOKEN_OTHER_AUD}"
      source:
        type: local
      expect:
        statusCode: 401
    EOF
