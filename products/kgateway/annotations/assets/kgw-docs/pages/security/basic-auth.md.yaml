    lines: 16c71da1 88b9492f c548623c 8c8c4228 529ff855 0bebd850 36184fa5 588a5d84 b5a028c9 cd44d8cd 9278ed91 de77b3a7 c9888a7d a1bf21d1 abc56510
    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="extauth-basic" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the basic-auth TrafficPolicy to be accepted (inline users list)
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: kgateway-system
            name: basic-auth
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the httpbin HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
