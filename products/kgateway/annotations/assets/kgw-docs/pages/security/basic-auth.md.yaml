  content: |-
    {{< doc-test paths="extauth-basic" >}}
    # Test-only: htpasswd -s is unsalted SHA-1, so its output must match the page's example output
    # and the hash in the policy that follows.
    got=$(htpasswd -nbs user password)
    [ "$got" = 'user:{SHA}W6ph5Mm5Pz8GgiULbPgzG37mj9g=' ] || { echo "htpasswd printed '$got', not the page's example output"; exit 1; }
    {{< /doc-test >}}
