  content: |2-
       {{< doc-test paths="local" >}}
       # Test-only: prove the 1-token bucket that refills every 100s. Send requests
       # until one gets 429, wait for the refill, then show that the next request
       # succeeds and the one right after it is rate limited again.
       url="http://${INGRESS_GW_ADDRESS}:8080/status/200"
       hdr="host: ratelimit.example:8080"
       c=""
       for i in $(seq 1 60); do
         c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" -H "$hdr" || true)
         [ "$c" = "429" ] && break
         sleep 1
       done
       if [ "$c" != "429" ]; then
         echo "local: no 429 after 60 requests to ratelimit.example, so the 1-token bucket is not enforced (last status: ${c})"; exit 1
       fi
       # The bucket gets 1 token every 100s. Requests that get 429 do not use a token.
       ok=""
       for i in $(seq 1 50); do
         sleep 5
         c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" -H "$hdr" || true)
         if [ "$c" = "200" ]; then ok=1; break; fi
         if [ "$c" != "429" ]; then echo "local: unexpected status ${c} while waiting for the refill"; exit 1; fi
       done
       if [ -z "$ok" ]; then
         echo "local: no request succeeded within 250s, so the bucket did not refill after the 100s fill interval"; exit 1
       fi
       resp=$(curl -s -i --max-time 5 "$url" -H "$hdr" || true)
       status=${resp%%$'\n'*}
       case "$status" in
         *" 429"*) ;;
         *) echo "local: the request right after the refilled one was not rate limited: ${status}"; exit 1 ;;
       esac
       case "$resp" in
         *local_rate_limited*) ;;
         *) echo "local: the 429 response has no local_rate_limited body"; echo "$resp"; exit 1 ;;
       esac
       echo "local: 429 response headers (the page shows x-ratelimit-* headers; not asserted):"
       echo "$resp"
       {{< /doc-test >}}
