  content: |-
    {{< doc-test paths="backend-tls,backend-tls-bcp" >}}
    # Test-only: the https port of the Service now has appProtocol http, and the
    # nginx backend still answers over TLS.
    proto=$(kubectl get service nginx -n kgateway-base -o jsonpath='{.spec.ports[1].appProtocol}')
    if [ "$proto" != "http" ]; then echo "FAIL: appProtocol on the https port is '$proto', not http"; exit 1; fi
    YAMLTest -f - <<'EOF'
    - name: backend-tls - after the appProtocol http patch, the nginx backend still answers over TLS
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /
        method: GET
        headers:
          host: "example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains:
        - Welcome to nginx!
    EOF
    {{< /doc-test >}}
