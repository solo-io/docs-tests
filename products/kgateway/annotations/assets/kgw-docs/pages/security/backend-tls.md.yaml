    preview: '* Host localhost:8080 was resolved.'
  content: |-
    {{< doc-test paths="backend-tls,backend-tls-bcp" >}}
    # Test-only: nginx accepts only TLS on the Service's 8443 port, so a 200 with
    # the nginx welcome page means that the gateway originated TLS to nginx and
    # trusted its certificate. A plain HTTP request to that port gets a 400 instead.
    YAMLTest -f - <<'EOF'
    - name: backend-tls - a request to example.com reaches the TLS-only nginx port through the gateway
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /
        method: GET
        headers:
          host: "example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains:
        - Welcome to nginx!
    EOF
    {{< /doc-test >}}
