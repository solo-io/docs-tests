    block_before:
      block: 12
      fingerprint: 586057866d9f8958
      lang: sh
      lines: '58605786'
      preview: kubectl port-forward deploy/http -n kgateway-system 19000
  content: |-
    {{< doc-test paths="backend-tls,backend-tls-bcp" >}}
    # Test-only: read the same stats inside the gateway pod instead of a port-forward.
    # The cluster for the nginx Service is named kube_<namespace>_<service>_<port>,
    # so in this guide it is kube_kgateway-base_nginx_8443.
    handshakes=0
    stats=""
    for i in $(seq 1 30); do
      stats=$(kubectl exec deploy/http -n kgateway-system -- wget -qO- "http://127.0.0.1:19000/stats?filter=kube_kgateway-base_nginx_8443.ssl" 2>/dev/null || true)
      handshakes=$(awk -F': ' '$1 == "cluster.kube_kgateway-base_nginx_8443.ssl.handshake" {print $2}' <<<"$stats")
      if [ "${handshakes:-0}" -gt 0 ] 2>/dev/null; then break; fi
      curl -s -o /dev/null "http://${INGRESS_GW_ADDRESS}:8080/" -H "host: example.com:8080" || true
      sleep 2
    done
    echo "$stats"
    if ! [ "${handshakes:-0}" -gt 0 ] 2>/dev/null; then
      echo "FAIL: no successful TLS handshakes from the gateway to nginx (cluster.kube_kgateway-base_nginx_8443.ssl.handshake)"
      exit 1
    fi
    echo "OK: ${handshakes} TLS handshakes from the gateway to the nginx backend"
    {{< /doc-test >}}
- after:
    block: 19
    fingerprint: a02ace750c6a8af8
    lang: console
    lines: 6364ab47 92413e97 ab5df625 021fb596 1efe1dd8 66e083c5 03ee0faf 1b4d8aee 2e253c22 e0f8c8b3 c9d9a58e 0dc14315 a55e3e20 3d4fb558 72a074dd e52a1813 a8640350 82c9ab0f 425e33ce 7ce82d83 d10b36aa
    preview: < HTTP/1.1 200 OK
  content: |-
    {{< doc-test paths="backend-tls,backend-tls-bcp" >}}
    # Test-only: this section uses the real public httpbin.org service over TLS, so
    # the in-cluster httpbin.org stand-in cannot replace it. If the runner cannot
    # reach httpbin.org at all, the check is skipped with a warning. Otherwise a 200
    # with "url": "https://httpbin.org/anything" and "Host": "httpbin.org" shows the
    # host rewrite and the TLS connection on port 443 (plain HTTP there gets a 400).
    if ! curl -sS -o /dev/null --max-time 15 https://httpbin.org/get; then
      echo "WARNING: httpbin.org is not reachable from the runner; skipping the external service check"
    else
      ok=""
      for i in $(seq 1 40); do
        resp=$(curl -sS --max-time 20 -w '\n%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/anything" -H "host: httpbin-external.example" 2>/dev/null || true)
        code=$(tail -n1 <<<"$resp")
        body=$(sed '$d' <<<"$resp")
        url=$(jq -r '.url // empty' <<<"$body" 2>/dev/null || true)
        host=$(jq -r '.headers.Host // empty' <<<"$body" 2>/dev/null || true)
        if [ "$code" = "200" ] && [ "$url" = "https://httpbin.org/anything" ] && [ "$host" = "httpbin.org" ]; then ok=1; break; fi
        echo "attempt $i: HTTP $code url=$url host=$host"
        sleep 5
      done
      if [ -z "$ok" ]; then
        echo "FAIL: no 200 from https://httpbin.org/anything through the gateway"
        exit 1
      fi
      echo "OK: the gateway rewrote the host to httpbin.org and reached it over TLS"
    fi
    {{< /doc-test >}}
- after:
    block: 21
