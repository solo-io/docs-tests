    preview: kubectl apply -f - <<EOF
  content: |2-
       {{< doc-test paths="byo-ext-auth-service-grpc" >}}
       # GatewayExtension has no Accepted condition to wait on, so check that the
       # grpc GatewayExtension exists and points to the ext-authz Service.
       YAMLTest -f - <<'EOF'
       - name: the basic-ext-auth GatewayExtension uses the ext-authz grpc backend
         wait:
           target:
             kind: GatewayExtension
             metadata:
               namespace: kgateway-system
               name: basic-ext-auth
           jsonPath: "$.spec.extAuth.grpcService.backendRef.name"
           jsonPathExpectation:
             comparator: equals
             value: ext-authz
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
