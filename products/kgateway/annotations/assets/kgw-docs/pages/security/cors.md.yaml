- after:
    block: 11
    fingerprint: e486a84a06bc6ead
    lang: console
    lines: 92413e97 9bb623b1 3201f37c 15357256 92413e97 a152bc23 5a8507b6 3e670794 befea1e7 18e0a468 3201f37c 15357256 cd8a298e 5f7c6523
    preview: HTTP/1.1 200 OK
  content: |-
    {{< doc-test paths="cors,cors-trafficpolicy" >}}
    # The gateway does not answer a preflight from an origin that is not allowed, so
    # the request reaches httpbin, which adds its own generic CORS headers. None of
    # the policy's values (max age 86400, methods GET, POST, OPTIONS, the expose
    # headers) are in the response.
    cors_bad=""
    for i in $(seq 1 30); do
      cors_resp=$(curl -s -o /dev/null -D - --max-time 5 -X OPTIONS "http://${INGRESS_GW_ADDRESS}:8080/get" -H "host: cors.example:8080" \
        -H "Origin: https://notallowed.com" \
        -H "Access-Control-Request-Method: POST" \
        -H "Access-Control-Request-Headers: Origin" 2>/dev/null | tr -d '\r' | tr 'A-Z' 'a-z') || true
      cors_code=$(awk 'NR==1{print $2}' <<<"$cors_resp")
      cors_bad=""
      if [ "$cors_code" != 200 ]; then cors_bad="status is '${cors_code}', expected 200"; fi
      if grep -qx 'access-control-max-age: 86400' <<<"$cors_resp"; then cors_bad="${cors_bad} max-age is the policy's 86400;"; fi
      if grep -qx 'access-control-allow-methods: get, post, options' <<<"$cors_resp"; then cors_bad="${cors_bad} allow-methods are the policy's;"; fi
      if grep -q '^access-control-expose-headers:.*x-\(httproute\|trafficpolicy\)-header' <<<"$cors_resp"; then cors_bad="${cors_bad} expose-headers are the policy's;"; fi
      if grep -qx 'access-control-allow-origin: https://example.com' <<<"$cors_resp"; then cors_bad="${cors_bad} allow-origin is the allowed origin;"; fi
      if [ -z "$cors_bad" ]; then break; fi
      sleep 2
    done
    if [ -n "$cors_bad" ]; then
      echo "cors: a preflight from https://notallowed.com got the policy's CORS headers or failed: ${cors_bad}"
      echo "$cors_resp"
      exit 1
    fi
    echo "cors: a preflight from https://notallowed.com gets HTTP 200 without the policy's CORS headers"
    {{< /doc-test >}}
