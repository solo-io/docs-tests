       # Test-only: Before you begin asks for an HTTPS listener, and the Verify
       # steps send requests to port 8443 of the same gateway with host
       # www.example.com. Add a self-signed HTTPS listener on port 8443 to the
       # sample `http` Gateway, which the httpbin HTTPRoute attaches to.
       openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=www.example.com" \
         -addext "subjectAltName=DNS:www.example.com" -keyout gw-https.key -out gw-https.crt
       kubectl create secret tls keycloak-test-https -n kgateway-system --cert=gw-https.crt --key=gw-https.key
       kubectl patch gateway http -n kgateway-system --type=json -p '[{"op":"add","path":"/spec/listeners/-","value":{"name":"https","protocol":"HTTPS","port":8443,"tls":{"mode":"Terminate","certificateRefs":[{"kind":"Secret","name":"keycloak-test-https"}]},"allowedRoutes":{"namespaces":{"from":"All"}}}}]'
       code=000
       for i in $(seq 1 60); do
         code=$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' "https://${INGRESS_GW_ADDRESS}:8443/headers" -H "host: www.example.com" || true)
         [ "$code" = "200" ] && break
         sleep 5
       done
       if [ "$code" != "200" ]; then
         echo "FAIL: the test HTTPS listener on ${INGRESS_GW_ADDRESS}:8443 returned ${code} for httpbin, want 200 before the OAuth2 policy"
         kubectl get gateway http -n kgateway-system -o yaml
         exit 1
       fi
       {{< /doc-test >}}
