    preview: < HTTP/2 302
  content: |2-
       {{< doc-test paths="keycloak-authorization-code" >}}
       # Step 1: a request without a session cookie is redirected to Keycloak with
       # the registered redirect_uri, and the nonce cookie is Secure and HttpOnly.
       hdr=$(mktemp)
       code=000
       for i in $(seq 1 60); do
         code=$(curl -sk --max-time 10 -D "$hdr" -o /dev/null -w '%{http_code}' \
           "https://${INGRESS_GW_ADDRESS}:8443/headers" -H "host: www.example.com" || true)
         [ "$code" = "302" ] && break
         sleep 5
       done
       location=$(grep -i '^location:' "$hdr" | head -1 | cut -d' ' -f2- | tr -d '\r' || true)
       nonce=$(grep -i '^set-cookie: OauthNonce-' "$hdr" | head -1 | tr -d '\r' || true)
       if [ "$code" != "302" ]; then
         echo "FAIL: an unauthenticated request to https://${INGRESS_GW_ADDRESS}:8443/headers returned ${code}, want 302"
         cat "$hdr"
         exit 1
       fi
       case "$location" in
         "https://keycloak.example.com/realms/myrealm/protocol/openid-connect/auth?"*) ;;
         *) echo "FAIL: the redirect goes to '${location}', want the Keycloak authorization endpoint"; exit 1 ;;
       esac
       for want in "client_id=kgateway-client" "redirect_uri=https%3A%2F%2Fwww.example.com%2Foauth2%2Fredirect"; do
         if ! grep -qF "$want" <<<"$location"; then
           echo "FAIL: the redirect location does not contain ${want}: ${location}"
           exit 1
         fi
       done
       if [ -z "$nonce" ] || ! grep -qi 'secure' <<<"$nonce" || ! grep -qi 'httponly' <<<"$nonce"; then
         echo "FAIL: want a Secure, HttpOnly OauthNonce cookie, got: ${nonce:-none}"
         exit 1
       fi
       {{< /doc-test >}}
- after:
    block: 7
    fingerprint: 78322d6ee60ce1f4
    lang: text
    lines: bd9ba729 053998a9 e3b4bdb8
    preview: < HTTP/2 302
  content: |2-
       {{< doc-test paths="keycloak-authorization-code" >}}
       # Steps 2 to 4 without a browser: curl with a cookie jar follows the gateway
       # redirect to Keycloak, posts the test user's credentials to the login form,
       # follows the redirect back to the gateway callback, and then loads the app.
       # --connect-to sends www.example.com to the gateway's HTTPS listener and
       # keycloak.example.com to the keycloak-lb Service, so the hosts and cookies
       # match what a browser sees.
       jar=$(mktemp); body=$(mktemp); hdr=$(mktemp)
       kc() {
         curl -sk --max-time 20 \
           --connect-to "www.example.com:443:${INGRESS_GW_ADDRESS}:8443" \
           --connect-to "keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443" \
           -b "$jar" -c "$jar" -D "$hdr" -o "$body" -w '%{http_code}' "$@" || true
       }
       location() { grep -i '^location:' "$hdr" | head -1 | cut -d' ' -f2- | tr -d '\r' || true; }
       fail() { echo "FAIL: $1"; echo "--- headers"; cat "$hdr"; echo "--- body (first 40 lines)"; head -40 "$body"; exit 1; }

       code=$(kc "https://www.example.com/headers")
       [ "$code" = "302" ] || fail "GET https://www.example.com/headers without a session returned ${code}, want 302"
       auth_url=$(location)

       code=$(kc "$auth_url")
       [ "$code" = "200" ] || fail "the Keycloak login page returned ${code}, want 200"
       action=$(python3 -c 'import html, re, sys; t = open(sys.argv[1]).read(); m = re.search(r"<form[^>]*id=\"kc-form-login\"[^>]*>", t, re.S); a = re.search(r"action=\"([^\"]+)\"", m.group(0)) if m else None; print(html.unescape(a.group(1)) if a else "")' "$body")
       [ -n "$action" ] || fail "no kc-form-login form on the Keycloak login page"

       code=$(kc --data-urlencode "username=testuser" --data-urlencode "password=password" --data-urlencode "credentialId=" "$action")
       [ "$code" = "302" ] || fail "posting testuser/password to the Keycloak login form returned ${code}, want 302"
       callback=$(location)
       case "$callback" in
         "https://www.example.com/oauth2/redirect?"*code=*) ;;
         *) fail "Keycloak redirected to '${callback}', want https://www.example.com/oauth2/redirect with a code" ;;
       esac

       code=$(kc "$callback")
       [ "$code" = "302" ] || fail "the gateway callback returned ${code}, want 302 back to the original URL (CSRF check or code exchange failed)"
       original=$(location)
       [ "$original" = "https://www.example.com/headers" ] || fail "the callback redirected to '${original}', want https://www.example.com/headers"
       jar_text=$(cat "$jar")
       grep -q 'IdToken-' <<<"$jar_text" || fail "the gateway set no IdToken session cookie after the code exchange"

       code=$(kc "$original")
       [ "$code" = "200" ] || fail "GET https://www.example.com/headers with the session cookies returned ${code}, want 200 from httpbin"
       body_text=$(cat "$body")
       grep -q '"headers"' <<<"$body_text" || fail "the response is not the httpbin headers output"

       # A second request reuses the session cookies without another login.
       code=$(kc "https://www.example.com/headers")
       [ "$code" = "200" ] || fail "a second request with the session cookies returned ${code}, want 200"
       # The same request without the cookies is still redirected to Keycloak.
       code=$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' \
         --connect-to "www.example.com:443:${INGRESS_GW_ADDRESS}:8443" "https://www.example.com/headers" || true)
       [ "$code" = "302" ] || fail "a request without the session cookies returned ${code}, want 302"
       echo "authorization code flow: login, callback, and session cookies work"
       {{< /doc-test >}}
