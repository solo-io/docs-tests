  content: |2-
       {{< doc-test paths="keycloak-authorization-code,keycloak-authorization-code-deny-redirect,keycloak-oauth2-config" >}}
       # GatewayExtension has no Accepted condition to wait on, so check that the
       # keycloak-oauth2 provider exists with the page's redirect URI.
       YAMLTest -f - <<'EOF'
       - name: the keycloak-oauth2 GatewayExtension sends the registered redirect URI
         wait:
           target:
             kind: GatewayExtension
             metadata:
               namespace: kgateway-system
               name: keycloak-oauth2
           jsonPath: "$.spec.oauth2.redirectURI"
           jsonPathExpectation:
             comparator: equals
             value: https://www.example.com/oauth2/redirect
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
