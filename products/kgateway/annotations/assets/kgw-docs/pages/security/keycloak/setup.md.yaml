  content: |-
    {{< doc-test paths="keycloak,keycloak-setup" >}}
    # Capture the logs first, then match with here-strings: `grep -q` in a pipe
    # can fail on a match under pipefail.
    logs=$(kubectl logs deployment/keycloak -n keycloak)
    for want in "Realm 'myrealm' imported" "Import finished successfully"; do
      if ! grep -qF "$want" <<<"$logs"; then
        echo "FAIL: the Keycloak logs do not contain \"$want\""
        grep -i import <<<"$logs" || true
        exit 1
      fi
    done
    {{< /doc-test >}}
