  content: |2-
       {{< doc-test paths="keycloak,keycloak-setup" >}}
       # Test-only: the guides use https://keycloak.example.com as the public
       # Keycloak address. Expose Keycloak on port 443 through a LoadBalancer
       # Service, so the test client can reach that address with
       # curl --connect-to keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443.
       kubectl apply -f- <<EOF
       apiVersion: v1
       kind: Service
       metadata:
         name: keycloak-lb
         namespace: keycloak
       spec:
         type: LoadBalancer
         selector:
           app: keycloak
         ports:
           - name: https
             port: 443
             targetPort: 8443
       EOF
       KEYCLOAK_ADDRESS=""
       for i in $(seq 1 60); do
         KEYCLOAK_ADDRESS=$(kubectl get svc keycloak-lb -n keycloak -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
         [ -n "$KEYCLOAK_ADDRESS" ] && break
         sleep 5
       done
       if [ -z "$KEYCLOAK_ADDRESS" ]; then
         echo "FAIL: the keycloak-lb LoadBalancer Service got no address in 300s"
         kubectl get svc keycloak-lb -n keycloak -o yaml
         exit 1
       fi
       export KEYCLOAK_ADDRESS
       echo "KEYCLOAK_ADDRESS=${KEYCLOAK_ADDRESS}"
       {{< /doc-test >}}
