  content: |-
    {{< doc-test paths="keycloak,keycloak-setup" >}}
    # Headless stand-in for the admin console check: log in as admin/admin with
    # the admin-cli client of the master realm and list the realms. Then check
    # that the imported client and test user issue tokens through the password
    # grant, and that the audience mapper puts kgateway-client in `aud`.
    KC_CONNECT="keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443"
    admin_token=$(curl -sk --max-time 10 --connect-to "$KC_CONNECT" \
      -d client_id=admin-cli -d username=admin -d password=admin -d grant_type=password \
      "https://keycloak.example.com/realms/master/protocol/openid-connect/token" | jq -r '.access_token // empty')
    if [ -z "$admin_token" ]; then
      echo "FAIL: could not log in to Keycloak as admin/admin"
      exit 1
    fi
    realms=$(curl -sk --max-time 10 --connect-to "$KC_CONNECT" -H "Authorization: Bearer ${admin_token}" \
      "https://keycloak.example.com/admin/realms" | jq -r '.[].realm')
    if ! grep -qx "myrealm" <<<"$realms"; then
      echo "FAIL: myrealm is not in the Keycloak realm list: $(tr '\n' ' ' <<<"$realms")"
      exit 1
    fi
    user_token=$(curl -sk --max-time 10 --connect-to "$KC_CONNECT" \
      -d client_id=kgateway-client -d client_secret=kgateway-client-secret \
      -d username=testuser -d password=password -d grant_type=password \
      "https://keycloak.example.com/realms/myrealm/protocol/openid-connect/token" | jq -r '.access_token // empty')
    if [ -z "$user_token" ]; then
      echo "FAIL: the password grant for testuser on kgateway-client returned no access token"
      exit 1
    fi
    payload=$(cut -d. -f2 <<<"$user_token" | tr '_-' '/+')
    while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
    claims=$(base64 -d <<<"$payload" 2>/dev/null || base64 --decode <<<"$payload")
    iss=$(jq -r '.iss' <<<"$claims")
    aud=$(jq -c '[.aud] | flatten' <<<"$claims")
    if [ "$iss" != "https://keycloak.example.com/realms/myrealm" ]; then
      echo "FAIL: token iss is '${iss}', want https://keycloak.example.com/realms/myrealm"
      exit 1
    fi
    if ! jq -e 'index("kgateway-client") != null and index("account") != null' <<<"$aud" >/dev/null; then
      echo "FAIL: token aud is ${aud}, want it to include kgateway-client and account"
      exit 1
    fi
    echo "token iss=${iss} aud=${aud}"
    {{< /doc-test >}}
