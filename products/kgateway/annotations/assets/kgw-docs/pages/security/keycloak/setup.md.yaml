    # The Deployment has no readiness probe, so a finished rollout does not mean
    # that Keycloak answers yet. Wait for the new pod alone, then for the imported
    # realm's discovery document on the public address.
    kubectl rollout status deployment/keycloak -n keycloak --timeout=600s
    for i in $(seq 1 60); do
      pods=$(kubectl get pods -n keycloak -l app=keycloak --no-headers 2>/dev/null | wc -l | tr -d ' ')
      [ "$pods" = "1" ] && break
      sleep 5
    done
    issuer=""
    for i in $(seq 1 90); do
      issuer=$(curl -sk --max-time 5 --connect-to "keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443" \
        "https://keycloak.example.com/realms/myrealm/.well-known/openid-configuration" | jq -r '.issuer // empty' 2>/dev/null || true)
      [ -n "$issuer" ] && break
      sleep 5
    done
    if [ "$issuer" != "https://keycloak.example.com/realms/myrealm" ]; then
      echo "FAIL: realm myrealm discovery on https://keycloak.example.com returned issuer '${issuer}', want https://keycloak.example.com/realms/myrealm"
      kubectl get pods -n keycloak -o wide
      kubectl logs deployment/keycloak -n keycloak --tail=50 || true
      exit 1
    fi
    {{< /doc-test >}}
