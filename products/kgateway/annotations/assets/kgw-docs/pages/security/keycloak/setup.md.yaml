  content: |-
    {{< doc-test paths="keycloak-setup" >}}
    # Test-only: the page says the gateway can now reach Keycloak. Prove it with a
    # temporary HTTPRoute that sends keycloak-reach.example.com to the keycloak
    # Backend. A 200 with the realm's issuer means the Backend address and the
    # insecureSkipVerify TLS setting both work. The route is removed right after.
    kubectl apply -f- <<EOF
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: keycloak-reach-test
      namespace: kgateway-system
    spec:
      parentRefs:
        - name: http
          namespace: kgateway-system
      hostnames:
        - keycloak-reach.example.com
      rules:
        - backendRefs:
            - group: gateway.kgateway.dev
              kind: Backend
              name: keycloak
    EOF
    issuer=""
    for i in $(seq 1 60); do
      issuer=$(curl -s --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/realms/myrealm/.well-known/openid-configuration" \
        -H "host: keycloak-reach.example.com" | jq -r '.issuer // empty' 2>/dev/null || true)
      [ -n "$issuer" ] && break
      sleep 5
    done
    kubectl delete httproute keycloak-reach-test -n kgateway-system
    if [ -z "$issuer" ]; then
      echo "FAIL: the gateway could not reach Keycloak through the keycloak Backend and the keycloak-tls BackendConfigPolicy in 300s"
      kubectl get backend keycloak -n kgateway-system -o yaml
      kubectl get backendconfigpolicy keycloak-tls -n kgateway-system -o yaml
      exit 1
    fi
    echo "gateway reached Keycloak through the Backend, issuer=${issuer}"
    {{< /doc-test >}}
