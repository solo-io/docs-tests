       {{< doc-test paths="keycloak-access-token" >}}
       # GatewayExtension has no Accepted condition to wait on, so check that the
       # keycloak-jwt provider exists with the page's issuer.
       YAMLTest -f - <<'EOF'
       - name: the keycloak-jwt GatewayExtension has the keycloak provider with the realm issuer
         wait:
           target:
             kind: GatewayExtension
             metadata:
               namespace: kgateway-system
               name: keycloak-jwt
           jsonPath: "$.spec.jwt.providers[0].issuer"
           jsonPathExpectation:
             comparator: equals
             value: https://keycloak.example.com/realms/myrealm
           polling:
             timeoutSeconds: 60
             intervalSeconds: 2
       EOF
       {{< /doc-test >}}
