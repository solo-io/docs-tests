  content: |2-
       {{< doc-test paths="keycloak-access-token" >}}
       # Test-only: the page's token request has a YOUR_CLIENT_SECRET placeholder
       # and needs keycloak.example.com to resolve. Use the secret from the setup
       # page's realm ConfigMap and reach keycloak.example.com through the
       # keycloak-lb Service from the keycloak prerequisite.
       TOKEN=""
       for i in $(seq 1 30); do
         TOKEN=$(curl -sk --max-time 10 --connect-to "keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443" \
           -d "client_id=kgateway-client" \
           -d "client_secret=kgateway-client-secret" \
           -d "username=testuser" \
           -d "password=password" \
           -d "grant_type=password" \
           "https://keycloak.example.com/realms/myrealm/protocol/openid-connect/token" \
           | jq -r '.access_token // empty' 2>/dev/null || true)
         [ -n "$TOKEN" ] && break
         sleep 5
       done
       if [ -z "$TOKEN" ]; then
         echo "FAIL: Keycloak returned no access token for testuser on kgateway-client"
         exit 1
       fi
       export TOKEN
       # Decode the base64url payload (the page's decode command is checked at the end).
       payload=$(cut -d. -f2 <<<"$TOKEN" | tr '_-' '/+')
       while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
       claims=$(base64 -d <<<"$payload" 2>/dev/null || base64 --decode <<<"$payload")
       iss=$(jq -r '.iss' <<<"$claims")
       aud=$(jq -c '[.aud] | flatten' <<<"$claims")
       if [ "$iss" != "https://keycloak.example.com/realms/myrealm" ]; then
         echo "FAIL: token iss is '${iss}', want the GatewayExtension issuer https://keycloak.example.com/realms/myrealm"
         exit 1
       fi
       if ! jq -e 'index("kgateway-client") != null' <<<"$aud" >/dev/null; then
         echo "FAIL: token aud is ${aud}, want it to include kgateway-client"
         exit 1
       fi
       echo "token iss=${iss} aud=${aud}"
       {{< /doc-test >}}
