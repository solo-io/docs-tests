    # Test-only check of "the gateway can reach Auth0": a temporary route sends
    # requests through the auth0 Backend, over TLS with the page's BackendConfigPolicy
    # (system CA file, SNI auth0.idp-standin.test), to the discovery document. The route is
    # removed right after, so the page's cleanup stays the same.
    kubectl apply -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: idp-standin-check
      namespace: kgateway-system
    spec:
      parentRefs:
      - name: http
        namespace: kgateway-system
      hostnames:
      - idp-check.example.com
      rules:
      - backendRefs:
        - name: auth0
          kind: Backend
          group: gateway.kgateway.dev
        filters:
        - type: URLRewrite
          urlRewrite:
            hostname: auth0.idp-standin.test
    EOF
    code=""; body=""; ok=false
    for i in $(seq 1 60); do
      body=$(curl -s --max-time 5 -w '\n%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/.well-known/openid-configuration" -H "host: idp-check.example.com" || true)
      code=${body##*$'\n'}
      if [ "$code" = 200 ] && grep -qF '"issuer":"https://auth0.idp-standin.test/"' <<<"$body"; then ok=true; break; fi
      echo "GET /.well-known/openid-configuration through the auth0 Backend returned '$code', want 200 with issuer https://auth0.idp-standin.test/ ($i/60)"; sleep 2
    done
