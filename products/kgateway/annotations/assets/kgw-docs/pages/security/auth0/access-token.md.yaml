    YAMLTest -f - <<'EOF'
    - name: auth0-access-token - a request without a token is rejected with 401
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 401
    EOF
    # Test-only: the next step requests the token from https://YOUR_AUTH0_DOMAIN.
    # This curl function swaps in the stand-in host, sends it to the stand-in's
    # LoadBalancer address, and trusts the test CA. It is removed after the step.
    curl() {
      local a args=()
      for a in "$@"; do args+=("${a//${IDP_PLACEHOLDER}/${IDP_HOST}}"); done
      command curl --cacert "$IDP_DIR/ca.crt" --resolve "${IDP_HOST}:443:${IDP_ADDRESS}" "${args[@]}"
    }
    {{< /doc-test >}}
