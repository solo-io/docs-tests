  content: |-
    {{< doc-test paths="auth0-access-token" >}}
    unset -f curl
    # The page's token request must have returned a JWT (three dot-separated parts).
    if [ "$(tr -cd '.' <<<"$TOKEN" | wc -c | tr -d ' ')" != 2 ]; then
      echo "FAIL: the password grant request did not return a JWT access token: '$TOKEN'"
      command kubectl logs -n idp-standin deploy/idp-standin --tail=20 || true
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 10
    fingerprint: dbafce82d490e922
    lang: json
    lines: 021fb596 d850ebc4 b720c94b d10b36aa
    preview: '{'
  content: |-
    {{< doc-test paths="auth0-access-token" >}}
    # Step 4 decodes the token. The page's jq command reads base64, not base64url,
    # so it fails on tokens whose payload contains - or _; decode with python3 here.
    python3 - "$TOKEN" <<'PY'
    import base64, json, sys
    part = sys.argv[1].split(".")[1]
    claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
    aud = claims.get("aud")
    auds = aud if isinstance(aud, list) else [aud]
    print({"iss": claims.get("iss"), "aud": aud})
    assert claims.get("iss") == "https://auth0.idp-standin.test/", "iss is %r, want https://auth0.idp-standin.test/" % claims.get("iss")
    assert "YOUR_API_AUDIENCE" in auds, "aud %r does not include YOUR_API_AUDIENCE" % aud
    PY
    {{< /doc-test >}}
