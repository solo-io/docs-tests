    YAMLTest -f - <<'EOF'
    - name: auth0-access-token - a request with the token reaches httpbin
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.Host[0]"
          comparator: equals
          value: www.example.com
    EOF
    # "A 403 response means that the token is valid but its aud claim does not match":
    # a token for another API identifier is rejected with 403.
    OTHER_AUD_TOKEN=$(command curl -s --cacert "$IDP_DIR/ca.crt" --resolve "${IDP_HOST}:443:${IDP_ADDRESS}" \
      -X POST "https://${IDP_HOST}/oauth/token" \
      -d "client_id=YOUR_CLIENT_ID" -d "client_secret=YOUR_CLIENT_SECRET" \
      -d "username=testuser@example.com" -d "password=YOUR_PASSWORD" \
      -d "grant_type=password" -d "audience=https://other-api.example.com" | jq -r .access_token)
    export OTHER_AUD_TOKEN
    YAMLTest -f - <<'EOF'
    - name: auth0-access-token - a valid token for another audience is rejected with 403
      retries: 10
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${OTHER_AUD_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 403
    EOF
    {{< /doc-test >}}
