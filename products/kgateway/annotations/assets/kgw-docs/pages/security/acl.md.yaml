  content: |-
    {{< doc-test paths="acl" >}}
    # Test-only: the ACL filter matches the client IP that the gateway proxy sees
    # (Envoy's source.address), not the IP of the machine that sends the request.
    # Through cloud-provider-kind, the load balancer container and kube-proxy
    # rewrite the source address, so a request from the runner can arrive from a
    # private IP. The proxy sets useRemoteAddress, so it appends the IP that it sees
    # to X-Forwarded-For, and httpbin echoes that header back. Record the IP for a
    # request through the load balancer and for one from the httpbin pod before any
    # ACL policy exists, then expect each policy's outcome for those IPs.
    # acl_get <lb|pod> <path>: the response status line, headers, and body.
    acl_get() {
      if [ "$1" = lb ]; then
        curl -s -i --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080$2" -H "host: www.example.com" 2>/dev/null || true
      else
        kubectl exec -n httpbin deploy/httpbin -c curl -- \
          curl -s -i --max-time 5 "http://http.kgateway-system.svc.cluster.local:8080$2" -H "host: www.example.com" 2>/dev/null || true
      fi
    }
    # acl_seen <lb|pod>: the client IP that the proxy appended to X-Forwarded-For.
    acl_seen() {
      for i in $(seq 1 60); do
        seen=$(acl_get "$1" /headers | python3 -c '
    import json, sys
    raw = sys.stdin.read().replace("\r\n", "\n")
    try:
        xff = json.loads(raw.split("\n\n", 1)[1])["headers"]["X-Forwarded-For"][-1]
        print(xff.split(",")[-1].strip())
    except Exception:
        pass
    ')
        if [ -n "$seen" ]; then echo "$seen"; return 0; fi
        sleep 2
      done
      echo "acl: httpbin /headers showed no X-Forwarded-For for a request from $1" >&2
      return 1
    }
    # acl_decide <ip> <defaultAction> <action=name=cidr,cidr>...: print "allow <rule>"
    # or "deny <rule>", where <rule> is the rule name, "rule" for an unnamed rule, or
    # "default". Longest prefix wins; for the same prefix, the later rule wins.
    acl_decide() {
      python3 -c '
    import ipaddress, sys
    ip = ipaddress.ip_address(sys.argv[1])
    if ip.version == 6 and ip.ipv4_mapped:
        ip = ip.ipv4_mapped
    best = None
    for r in sys.argv[3:]:
        action, name, cidrs = r.split("=", 2)
        for c in cidrs.split(","):
            net = ipaddress.ip_network(c, strict=False)
            if ip.version == net.version and ip in net and (best is None or net.prefixlen >= best[0]):
                best = (net.prefixlen, action, name or "rule")
    print(f"{best[1]} {best[2]}" if best else f"{sys.argv[2]} default")
    ' "$@"
    }
    # acl_expect <lb|pod> <label> <status> [<header: value> | !<header>]...: retry a
    # GET /status/200 until the status matches, every "header: value" line is in the
    # response, and every !header is not.
    acl_expect() {
      from=$1; label=$2; want=$3; shift 3
      for i in $(seq 1 60); do
        out=$(acl_get "$from" /status/200 | tr -d '\r')
        head=${out%%$'\n\n'*}
        code=$(awk 'NR==1{print $2}' <<<"$head")
        ok=false
        if [ "$code" = "$want" ]; then
          ok=true
          for spec in "$@"; do
            case "$spec" in
              "!"*) if grep -qi "^${spec#!}:" <<<"$head"; then ok=false; fi ;;
              *) if ! grep -qix "$spec" <<<"$head"; then ok=false; fi ;;
            esac
          done
        fi
        if [ "$ok" = true ]; then echo "$label: HTTP $code $*"; return 0; fi
        sleep 2
      done
      echo "$label: expected HTTP $want $*; last response headers:"
      echo "$head"
      exit 1
    }
    # acl_check <lb|pod> <label> <deny status> <blockedBy header|-> <extra deny header|-> <defaultAction> <rules>...:
    # expect the outcome that acl_decide gives for the IP that the proxy sees.
    acl_check() {
      from=$1; label=$2; deny_code=$3; by_hdr=$4; extra=$5; shift 5
      if [ "$from" = lb ]; then ip=$acl_lb_ip; else ip=$acl_pod_ip; fi
      read -r action rule <<<"$(acl_decide "$ip" "$@")"
      specs=()
      if [ "$action" = deny ]; then
        if [ "$by_hdr" != - ]; then specs+=("$by_hdr: $rule"); fi
        if [ "$extra" != - ]; then specs+=("$extra"); fi
        acl_expect "$from" "$label: $ip is denied ($rule)" "$deny_code" ${specs[@]+"${specs[@]}"}
      else
        if [ "$by_hdr" != - ]; then specs+=("!$by_hdr"); fi
        acl_expect "$from" "$label: $ip is allowed ($rule)" 200 ${specs[@]+"${specs[@]}"}
      fi
    }
    acl_lb_ip=$(acl_seen lb) || exit 1
    acl_pod_ip=$(acl_seen pod) || exit 1
    echo "acl: the gateway proxy sees a request through the load balancer as ${acl_lb_ip} and one from the httpbin pod as ${acl_pod_ip}"
    {{< /doc-test >}}
