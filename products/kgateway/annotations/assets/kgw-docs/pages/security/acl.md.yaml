  content: |-
    {{< doc-test paths="acl" >}}
    # Test-only: read the counter from the admin port inside the proxy pod instead
    # of a port-forward. Envoy can put a dynamic-module scope in front of the name,
    # so match on the suffix. Every section above had at least one denial.
    acl_blocked=""
    for i in $(seq 1 30); do
      acl_stats=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/stats" 2>/dev/null) || true
      acl_blocked=$(grep -E 'dev\.kgateway\.http\.acl\.blocked: [0-9]+$' <<<"$acl_stats" | head -1 | sed 's/.*: //') || true
      if [ "${acl_blocked:-0}" -ge 1 ] 2>/dev/null; then break; fi
      sleep 2
    done
    if [ "${acl_blocked:-0}" -ge 1 ] 2>/dev/null; then
      echo "acl stats: dev.kgateway.http.acl.blocked is ${acl_blocked}"
    else
      echo "acl stats: expected dev.kgateway.http.acl.blocked of at least 1, got '${acl_blocked:-missing}'"
      grep -i acl <<<"$acl_stats" || true
      exit 1
    fi
    {{< /doc-test >}}
