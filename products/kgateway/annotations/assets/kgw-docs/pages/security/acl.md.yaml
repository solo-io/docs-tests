  content: |-
    {{< doc-test paths="acl" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the acl-allowlist TrafficPolicy to be accepted on the httpbin HTTPRoute
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: acl-allowlist
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Default deny, allow 10.0.0.0/8. The pod IP is in the cluster's pod CIDR.
    acl_check pod "acl allowlist, request from the httpbin pod" 403 - - deny "allow==10.0.0.0/8"
    acl_check lb "acl allowlist, request through the load balancer" 403 - - deny "allow==10.0.0.0/8"
    case "$(acl_decide "$acl_lb_ip" deny "allow==10.0.0.0/8")" in
      deny*) ;;
      *) echo "acl allowlist: NOTE the page expects a 403 for a request from outside the cluster, but the proxy sees ${acl_lb_ip}, which 10.0.0.0/8 allows" ;;
    esac
    {{< /doc-test >}}
