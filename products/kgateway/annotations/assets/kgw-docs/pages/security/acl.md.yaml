  content: |-
    {{< doc-test paths="acl" >}}
    # Hole-punching: longest prefix wins. This policy has no blockedByHeaderName, so
    # a denial without X-Blocked-By shows the update replaced the denylist.
    acl_check pod "acl hole-punching, request from the httpbin pod" 403 - "!X-Blocked-By" allow "deny=block-internal-range=10.0.0.0/8" "allow=allow-trusted-subnet=10.1.0.0/16" "deny=block-rogue-host=10.1.2.3"
    acl_check lb "acl hole-punching, request through the load balancer" 403 - "!X-Blocked-By" allow "deny=block-internal-range=10.0.0.0/8" "allow=allow-trusted-subnet=10.1.0.0/16" "deny=block-rogue-host=10.1.2.3"
    {{< /doc-test >}}
