      preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="okta-setup" >}}
    # Test-only check of "the gateway can reach Okta": a temporary route sends
    # requests through the okta Backend, over TLS with the page's BackendConfigPolicy
    # (system CA file, SNI okta.idp-standin.test), to the discovery document. The route is
    # removed right after, so the page's cleanup stays the same.
    kubectl apply -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: idp-standin-check
      namespace: kgateway-system
    spec:
      parentRefs:
      - name: http
        namespace: kgateway-system
      hostnames:
      - idp-check.example.com
      rules:
      - backendRefs:
        - name: okta
          kind: Backend
          group: gateway.kgateway.dev
        filters:
        - type: URLRewrite
          urlRewrite:
            hostname: okta.idp-standin.test
    EOF
    code=""; body=""
    for i in $(seq 1 60); do
      body=$(curl -s --max-time 5 -w '\n%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/oauth2/default/.well-known/openid-configuration" -H "host: idp-check.example.com" || true)
      code=${body##*$'\n'}
      if [ "$code" = 200 ] && grep -qF '"issuer":"https://okta.idp-standin.test/oauth2/default"' <<<"$body"; then break; fi
      echo "GET /oauth2/default/.well-known/openid-configuration through the okta Backend returned '$code', want 200 with issuer https://okta.idp-standin.test/oauth2/default ($i/60)"; sleep 2
    done
    if [ "$code" != 200 ]; then
      echo "FAIL: the gateway did not reach the Okta stand-in through the okta Backend and the okta-tls BackendConfigPolicy"
      echo "$body"; exit 1
    fi
    kubectl delete httproute idp-standin-check -n kgateway-system
    {{< /doc-test >}}
