  content: |-
    {{< doc-test paths="okta-access-token" >}}
    # The token from step 3 reaches httpbin, and the three rejection messages in
    # the table come back as the response body.
    sig=${TOKEN##*.}
    if [ "${sig:20:1}" = A ]; then swap=B; else swap=A; fi
    BAD_SIG_TOKEN="${TOKEN%.*}.${sig:0:20}${swap}${sig:21}"
    export BAD_SIG_TOKEN
    YAMLTest -f - <<'EOF'
    - name: okta-access-token - a request with the token reaches httpbin
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.Host[0]"
          comparator: equals
          value: www.example.com
    - name: okta-access-token - no Authorization header gives Jwt is missing
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
      source:
        type: local
      expect:
        statusCode: 401
        bodyContains:
        - Jwt is missing
    - name: okta-access-token - a value that is not a JWT gives the three-sections message
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer not-a-jwt"
      source:
        type: local
      expect:
        statusCode: 401
        bodyContains:
        - Jwt is not in the form of Header.Payload.Signature with two dots and 3 sections
    - name: okta-access-token - a token with a changed signature gives Jwt verification fails
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com"
          Authorization: "Bearer ${BAD_SIG_TOKEN}"
      source:
        type: local
      expect:
        statusCode: 401
        bodyContains:
        - Jwt verification fails
    EOF
    {{< /doc-test >}}
