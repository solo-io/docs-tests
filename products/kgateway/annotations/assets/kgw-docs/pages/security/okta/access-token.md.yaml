    lines: 021fb596 ede0947c 0c340825 d10b36aa
    preview: '{'
  content: |-
    {{< doc-test paths="okta-access-token" >}}
    # Step 4 decodes the token. The page's jq command reads base64, not base64url,
    # so it fails on tokens whose payload contains - or _; decode with python3 here.
    python3 - "$TOKEN" <<'PY'
    import base64, json, sys
    part = sys.argv[1].split(".")[1]
    claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
    aud = claims.get("aud")
    auds = aud if isinstance(aud, list) else [aud]
    print({"iss": claims.get("iss"), "aud": aud})
    assert claims.get("iss") == "https://okta.idp-standin.test/oauth2/default", "iss is %r, want https://okta.idp-standin.test/oauth2/default" % claims.get("iss")
    assert "api://default" in auds, "aud %r does not include api://default" % aud
    PY
    {{< /doc-test >}}
