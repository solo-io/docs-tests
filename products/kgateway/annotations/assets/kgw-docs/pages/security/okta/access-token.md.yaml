  content: |-
    {{< doc-test paths="okta-access-token" >}}
    # Test-only: the next step requests the token from https://YOUR_OKTA_DOMAIN.
    # This curl function swaps in the stand-in host, sends it to the stand-in's
    # LoadBalancer address, and trusts the test CA. It is removed after the step.
    curl() {
      local a args=()
      for a in "$@"; do args+=("${a//${IDP_PLACEHOLDER}/${IDP_HOST}}"); done
      command curl --cacert "$IDP_DIR/ca.crt" --resolve "${IDP_HOST}:443:${IDP_ADDRESS}" "${args[@]}"
    }
    {{< /doc-test >}}
