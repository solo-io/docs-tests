  content: |-
    {{< doc-test paths="okta-access-token" >}}
    unset -f curl
    # The page's token request must have returned a JWT (three dot-separated parts).
    if [ "$(tr -cd '.' <<<"$TOKEN" | wc -c | tr -d ' ')" != 2 ]; then
      echo "FAIL: the client credentials request did not return a JWT access token: '$TOKEN'"
      command kubectl logs -n idp-standin deploy/idp-standin --tail=20 || true
      exit 1
    fi
    {{< /doc-test >}}
- after:
