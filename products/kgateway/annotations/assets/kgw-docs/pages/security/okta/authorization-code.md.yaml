      preview: < HTTP/2 302
  content: |-
    {{< doc-test paths="okta-authorization-code" >}}
    # Steps 2 to 4 with curl as the browser and one cookie jar. --connect-to sends
    # www.example.com to the gateway's HTTPS listener and okta.idp-standin.test to the
    # stand-in, so every URL and cookie keeps its real host name.
    JAR="$IDP_DIR/browser-cookies.txt"; rm -f "$JAR"
    browser() {
      command curl -sS --max-time 20 --cacert "$IDP_DIR/ca.crt" -c "$JAR" -b "$JAR" \
        --connect-to "www.example.com:443:${INGRESS_GW_ADDRESS}:8443" \
        --connect-to "${IDP_HOST}:443:${IDP_ADDRESS}:443" "$@"
    }
    login_url=""
    for i in $(seq 1 30); do
      login_url=$(browser -o /dev/null -w '%{redirect_url}' "https://www.example.com/headers" || true)
      case "$login_url" in "${IDP_AUTHORIZE_URL}?"*) break ;; esac
      echo "GET https://www.example.com/headers did not redirect to the sign-in page yet: '$login_url' ($i/30)"; sleep 2
    done
    case "$login_url" in "${IDP_AUTHORIZE_URL}?"*) ;; *) echo "FAIL: no redirect to ${IDP_AUTHORIZE_URL}"; exit 1 ;; esac
    # Step 2: the sign-in page.
    code=$(browser -o "$IDP_DIR/login.html" -w '%{http_code}' "$login_url" || true)
    [ "$code" = 200 ] || { echo "FAIL: the sign-in page returned $code"; cat "$IDP_DIR/login.html"; exit 1; }
    tx=$(sed -n 's/.*name="tx" value="\([^"]*\)".*/\1/p' "$IDP_DIR/login.html")
    action=$(sed -n 's/.*action="\([^"]*\)".*/\1/p' "$IDP_DIR/login.html")
    # Step 3: sign in as the test user. The provider redirects to redirect_uri with a code.
    callback=$(browser -o /dev/null -w '%{redirect_url}' "https://${IDP_HOST}${action}" \
      --data-urlencode "tx=${tx}" --data-urlencode "username=testuser@example.com" --data-urlencode "password=YOUR_PASSWORD" || true)
    case "$callback" in "https://www.example.com/oauth2/redirect?code="*) ;; *) echo "FAIL: sign-in did not redirect to the callback: '$callback'"; exit 1 ;; esac
    # Step 4: the gateway exchanges the code for tokens through the okta Backend, sets
    # the session cookies, and sends the browser back to /headers.
    back=$(browser -o "$IDP_DIR/callback.txt" -w '%{http_code} %{redirect_url}' "$callback" || true)
    case "$back" in "302 https://www.example.com/headers"*) ;; *)
      echo "FAIL: the callback returned '$back', want 302 to https://www.example.com/headers"; cat "$IDP_DIR/callback.txt"
      command kubectl logs -n idp-standin deploy/idp-standin --tail=20 || true; exit 1 ;; esac
    for cookie in AccessToken- IdToken- OauthHMAC-; do
      grep -q "$(printf '\t')${cookie}" "$JAR" || { echo "FAIL: no ${cookie}* session cookie after the callback"; cat "$JAR"; exit 1; }
    done
    code=$(browser -o "$IDP_DIR/headers.json" -w '%{http_code}' "https://www.example.com/headers" || true)
    [ "$code" = 200 ] || { echo "FAIL: with the session cookies, /headers returned $code, want 200"; cat "$IDP_DIR/headers.json"; exit 1; }
    jq -e '.headers.Host[0] == "www.example.com"' "$IDP_DIR/headers.json" >/dev/null || { echo "FAIL: the response is not the httpbin output"; cat "$IDP_DIR/headers.json"; exit 1; }
    {{< /doc-test >}}
