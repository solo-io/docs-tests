  content: |-
    {{< doc-test paths="okta-authorization-code" >}}
    # Step 1, Cloud Provider LoadBalancer tab: no session cookie, so the gateway
    # answers 302 to the authorization endpoint with the registered redirect_uri and
    # sets the OauthNonce cookie with the Secure and HttpOnly attributes.
    hdrs=""; status=""
    for i in $(seq 1 60); do
      hdrs=$(command curl -sk --max-time 5 -o /dev/null -D - "https://${INGRESS_GW_ADDRESS}:8443/headers" -H "host: www.example.com" | tr -d '\r' || true)
      status=$(head -n 1 <<<"$hdrs" | awk '{print $2}')
      [ "$status" = 302 ] && break
      echo "unauthenticated GET /headers on 8443 returned '$status', want 302 ($i/60)"; sleep 2
    done
    [ "$status" = 302 ] || { echo "FAIL: want 302, got '$status'"; echo "$hdrs"; exit 1; }
    location=$(grep -i '^location:' <<<"$hdrs" | sed -n '1s/^[Ll]ocation: *//p' || true)
    nonce=$(grep -i '^set-cookie: OauthNonce-' <<<"$hdrs" | sed -n 1p || true)
    echo "location: $location"; echo "$nonce"
    case "$location" in "${IDP_AUTHORIZE_URL}?"*) ;; *) echo "FAIL: location is not ${IDP_AUTHORIZE_URL}"; exit 1 ;; esac
    grep -q 'client_id=YOUR_CLIENT_ID' <<<"$location" || { echo "FAIL: location has no client_id=YOUR_CLIENT_ID"; exit 1; }
    grep -q 'redirect_uri=https%3A%2F%2Fwww.example.com%2Foauth2%2Fredirect' <<<"$location" || { echo "FAIL: location has the wrong redirect_uri"; exit 1; }
    grep -qi 'secure' <<<"$nonce" && grep -qi 'httponly' <<<"$nonce" || { echo "FAIL: no OauthNonce cookie with Secure and HttpOnly"; exit 1; }
    {{< /doc-test >}}
