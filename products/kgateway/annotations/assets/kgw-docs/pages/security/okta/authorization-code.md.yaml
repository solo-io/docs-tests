  content: |-
    {{< doc-test paths="okta-authorization-code,okta-authorization-code-deny-redirect" >}}
    # Test-only: the HTTPS listener from "Before you begin". The `http` Gateway gets a
    # second listener, `https` on port 8443, with a www.example.com certificate from
    # the stand-in's test CA (IDP_DIR, created on the Okta setup page).
    openssl req -new -nodes -newkey rsa:2048 -subj "/CN=www.example.com" \
      -keyout "$IDP_DIR/www.key" -out "$IDP_DIR/www.csr"
    printf 'subjectAltName=DNS:www.example.com\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > "$IDP_DIR/www.ext"
    openssl x509 -req -sha256 -days 7 -in "$IDP_DIR/www.csr" -CA "$IDP_DIR/ca.crt" -CAkey "$IDP_DIR/ca.key" \
      -CAcreateserial -out "$IDP_DIR/www.crt" -extfile "$IDP_DIR/www.ext"
    kubectl create secret tls oauth-test-https -n kgateway-system --cert="$IDP_DIR/www.crt" --key="$IDP_DIR/www.key"
    kubectl patch gateway http -n kgateway-system --type=json -p '[{"op":"add","path":"/spec/listeners/-","value":{"name":"https","protocol":"HTTPS","port":8443,"tls":{"mode":"Terminate","certificateRefs":[{"kind":"Secret","name":"oauth-test-https"}]},"allowedRoutes":{"namespaces":{"from":"All"}}}}]'
    code=""
    for i in $(seq 1 60); do
      code=$(command curl -s --max-time 5 -o /dev/null -w '%{http_code}' --cacert "$IDP_DIR/ca.crt" \
        --connect-to "www.example.com:443:${INGRESS_GW_ADDRESS}:8443" "https://www.example.com/headers" || true)
      [ "$code" = 200 ] && break
      echo "https://www.example.com/headers on port 8443 returned '$code', want 200 before the OAuth2 policy ($i/60)"; sleep 2
    done
    [ "$code" = 200 ] || { echo "FAIL: the test HTTPS listener on ${INGRESS_GW_ADDRESS}:8443 does not serve httpbin"; exit 1; }
    {{< /doc-test >}}
