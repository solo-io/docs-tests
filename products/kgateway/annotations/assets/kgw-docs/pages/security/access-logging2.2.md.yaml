       # Step 3: open a TCP connection to port 8000 of tcp-gateway, send one line,
       # read the echo, and close. The proxy writes one entry when the connection closes.
       TCP_GW_ADDRESS=$(kubectl get svc -n kgateway-system tcp-gateway -o jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
       msg="hello-from-access-logging-tcp"
       entry=""
       for i in $(seq 1 60); do
         reply=$(timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/8000" || exit 1; printf "%s\n" "$2" >&3; IFS= read -r -t 5 line <&3; printf "%s" "$line"; exec 3>&-' _ "${TCP_GW_ADDRESS}" "${msg}" 2>/dev/null || true)
         sleep 1
         logs=$(kubectl logs deploy/tcp-gateway -n kgateway-system --tail=500 2>/dev/null || true)
         entry=$(jq -c -R 'fromjson? | select(type == "object" and has("downstream_remote_address") and has("upstream_host") and (.bytes_received // 0) > 0)' <<<"${logs}" 2>/dev/null | tail -1 || true)
         case "${reply}" in *"${msg}"*) [ -n "${entry}" ] && break ;; esac
         echo "access-logging-tcp attempt ${i}: echo '${reply:-none}', no per-connection JSON entry yet"
         sleep 2
       done
       case "${reply}" in *"${msg}"*) ;; *) echo "FAIL: no echo from tcp-echo through port 8000 of tcp-gateway"; exit 1 ;; esac
       if [ -z "${entry}" ]; then
         echo "FAIL: the tcp-gateway proxy logs have no JSON entry for the TCP connection"
         kubectl logs deploy/tcp-gateway -n kgateway-system --tail=20 || true
         exit 1
       fi
       jq . <<<"${entry}"
       for key in start_time downstream_remote_address upstream_host bytes_received bytes_sent duration response_flags; do
         if ! jq -e --arg k "${key}" 'has($k)' <<<"${entry}" >/dev/null; then
           echo "FAIL: the TCP access log entry has no ${key} key"; exit 1
         fi
       done
       if ! jq -e '(.upstream_host | tostring | test(":1025$")) and .bytes_sent > 0 and (.duration | type == "number")' <<<"${entry}" >/dev/null; then
