    - name: access-logging-string-format - wait for the access-logs ListenerPolicy (stringFormat block scalar) to be accepted
      wait:
        target:
          kind: ListenerPolicy
          metadata:
            namespace: kgateway-system
            name: access-logs
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
