    preview: kubectl apply -f- <<EOF
  content: |2-
       {{< doc-test paths="access-logging" >}}
       YAMLTest -f - <<'EOF'
       - name: access-logging - wait for the access-logs ListenerPolicy (jsonFormat to /dev/stdout) to be accepted
         wait:
           target:
             kind: ListenerPolicy
             metadata:
               namespace: kgateway-system
               name: access-logs
           jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       # Send the page's request with a unique user agent until the proxy writes a JSON
       # access log entry for it to the stdout stream (kubectl logs on the proxy).
       ua="doc-test-access-logging-${RANDOM}"
       entry=""
       for i in $(seq 1 60); do
         code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" -A "${ua}" || true)
         sleep 1
         logs=$(kubectl -n kgateway-system logs deployments/http --tail=500 2>/dev/null || true)
         entry=$(jq -c -R --arg ua "${ua}" 'fromjson? | select(type == "object" and .user_agent == $ua)' <<<"${logs}" 2>/dev/null | tail -1 || true)
         if [ "${code}" = "200" ] && [ -n "${entry}" ]; then break; fi
         echo "access-logging attempt ${i}: HTTP ${code:-none}, no JSON access log entry with user_agent ${ua} yet"
         sleep 2
       done
       if [ "${code}" != "200" ]; then echo "FAIL: GET /status/200 returned ${code:-no response}, not 200"; exit 1; fi
       if [ -z "${entry}" ]; then
         echo "FAIL: the http proxy logs have no JSON access log entry for the request"
         kubectl -n kgateway-system logs deployments/http --tail=20 || true
         exit 1
       fi
       jq . <<<"${entry}"
       # Every key from the page's jsonFormat is in the entry.
       for key in start_time method path protocol response_code response_flags bytes_received bytes_sent total_duration resp_backend_service_time req_x_forwarded_for user_agent request_id authority backendHost backendCluster; do
         if ! jq -e --arg k "${key}" 'has($k)' <<<"${entry}" >/dev/null; then
           echo "FAIL: the access log entry has no ${key} key"; exit 1
         fi
       done
       # The values match the request, as in the page's example output.
       if ! jq -e '.method == "GET" and .path == "/status/200" and .protocol == "HTTP/1.1"
           and .response_code == 200 and .response_flags == "-"
           and .authority == "www.example.com:8080"
           and (.request_id | type == "string" and length > 0)
           and (.start_time | type == "string" and length > 0)
           and (.total_duration | type == "number")
           and (.backendCluster | tostring | test("httpbin"))
           and (.backendHost | tostring | test(":[0-9]+$"))' <<<"${entry}" >/dev/null; then
         echo "FAIL: the access log entry values do not match GET /status/200 on www.example.com:8080 routed to httpbin"; exit 1
       fi
       echo "access-logging: the proxy wrote a JSON access log entry with the page's fields to stdout"
       {{< /doc-test >}}
