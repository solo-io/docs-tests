    # format. The pattern is anchored at both ends, so it also confirms that the
    # folded block scalar ends each entry with a newline (one entry per line).
    pattern='^\[[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z\] "GET /status/200" "HTTP/1\.1" "200" "-"$'
