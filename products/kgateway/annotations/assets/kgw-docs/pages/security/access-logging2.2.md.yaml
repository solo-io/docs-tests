         # bytesSent and bytesReceived are available for gRPC services (as here).
         for key in extauth_latency_us extauth_bytes_sent extauth_bytes_received; do
           if ! jq -e --arg k "${key}" '.[$k] | type == "string" and test("^[0-9]+$")' <<<"${entry}" >/dev/null; then
