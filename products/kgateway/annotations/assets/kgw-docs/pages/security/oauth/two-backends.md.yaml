  content: |-
    {{< doc-test paths="two-backends" >}}
    # With jwt.accessToken set, the gateway validates the access token from the
    # code exchange against the JWKS that it fetches through keycloak-jwks. Log in
    # headless (cookie jar, Keycloak login form, gateway callback) over the HTTPS
    # listener; a 200 from httpbin at the end means the JWKS fetch through the
    # separate Backend worked.
    jar=$(mktemp); body=$(mktemp); hdr=$(mktemp)
    kc() {
      curl -sk --max-time 20 \
        --connect-to "www.example.com:443:${INGRESS_GW_ADDRESS}:8443" \
        --connect-to "keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443" \
        -b "$jar" -c "$jar" -D "$hdr" -o "$body" -w '%{http_code}' "$@" || true
    }
    location() { grep -i '^location:' "$hdr" | head -1 | cut -d' ' -f2- | tr -d '\r' || true; }
    fail() { echo "FAIL: $1"; echo "--- headers"; cat "$hdr"; echo "--- body (first 40 lines)"; head -40 "$body"; exit 1; }
    code=000
    for i in $(seq 1 30); do
      code=$(kc "https://www.example.com/headers")
      [ "$code" = "302" ] && break
      sleep 5
    done
    [ "$code" = "302" ] || fail "GET https://www.example.com/headers without a session returned ${code}, want 302"
    code=$(kc "$(location)")
    [ "$code" = "200" ] || fail "the Keycloak login page returned ${code}, want 200"
    action=$(python3 -c 'import html, re, sys; t = open(sys.argv[1]).read(); m = re.search(r"<form[^>]*id=\"kc-form-login\"[^>]*>", t, re.S); a = re.search(r"action=\"([^\"]+)\"", m.group(0)) if m else None; print(html.unescape(a.group(1)) if a else "")' "$body")
    [ -n "$action" ] || fail "no kc-form-login form on the Keycloak login page"
    code=$(kc --data-urlencode "username=testuser" --data-urlencode "password=password" --data-urlencode "credentialId=" "$action")
    [ "$code" = "302" ] || fail "posting testuser/password to the Keycloak login form returned ${code}, want 302"
    code=$(kc "$(location)")
    [ "$code" = "302" ] || fail "the gateway callback returned ${code}, want 302 back to the original URL"
    code=$(kc "https://www.example.com/headers")
    [ "$code" = "200" ] || fail "with jwksBackendRef, GET https://www.example.com/headers after login returned ${code}, want 200 (JWKS fetch or token validation failed)"
    echo "login through the gateway works with JWKS from the keycloak-jwks Backend"
    {{< /doc-test >}}
