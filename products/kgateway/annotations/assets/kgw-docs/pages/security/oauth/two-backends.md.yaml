  content: |-
    {{< doc-test paths="two-backends" >}}
    # The page's own check: a request over HTTP with a Bearer token gets 200.
    # TOKEN is not set anywhere on the page, so fetch one from Keycloak.
    TOKEN=$(curl -sk --max-time 10 --connect-to "keycloak.example.com:443:${KEYCLOAK_ADDRESS}:443" \
      -d "client_id=kgateway-client" -d "client_secret=kgateway-client-secret" \
      -d "username=testuser" -d "password=password" -d "grant_type=password" \
      "https://keycloak.example.com/realms/myrealm/protocol/openid-connect/token" | jq -r '.access_token // empty' || true)
    if [ -z "$TOKEN" ]; then
      echo "FAIL: Keycloak returned no access token for testuser"
      exit 1
    fi
    export TOKEN
    YAMLTest -f - <<'EOF'
    - name: two-backends - a request with a Bearer token gets 200, as the Verify section says
      retries: 10
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "www.example.com:8080"
          Authorization: "Bearer ${TOKEN}"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    {{< /doc-test >}}
