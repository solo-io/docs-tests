  content: |-
    {{< doc-test paths="two-backends" >}}
    # Test-only Keycloak stand-in for steps 2 to 4. The Cognito Backend above is
    # not reachable from the test, and step 4 applies a cognito-jwks-backend.yaml
    # file that the page never creates. Instead, create a second Backend for the
    # in-cluster Keycloak, used only for JWKS, and add jwt.jwksURI,
    # jwt.jwksBackendRef, and jwt.accessToken to the keycloak-oauth2
    # GatewayExtension. jwksURI is set explicitly so that no OIDC discovery runs.
    kubectl apply -f- <<EOF
    apiVersion: gateway.kgateway.dev/v1alpha1
    kind: Backend
    metadata:
      name: keycloak-jwks
      namespace: kgateway-system
    spec:
      type: Static
      static:
        hosts:
        - host: keycloak.keycloak.svc.cluster.local
          port: 8443
    ---
    apiVersion: gateway.kgateway.dev/v1alpha1
    kind: BackendConfigPolicy
    metadata:
      name: keycloak-jwks-tls
      namespace: kgateway-system
    spec:
      targetRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: keycloak-jwks
      tls:
        insecureSkipVerify: true
    EOF
    kubectl patch gatewayextension keycloak-oauth2 -n kgateway-system --type=merge -p '{"spec":{"oauth2":{"jwt":{"jwksURI":"https://keycloak.example.com/realms/myrealm/protocol/openid-connect/certs","jwksBackendRef":{"group":"gateway.kgateway.dev","kind":"Backend","name":"keycloak-jwks"},"accessToken":{"audiences":["kgateway-client"]}}}}}'
    YAMLTest -f - <<'EOF'
    - name: the keycloak-oauth2 GatewayExtension fetches JWKS through the keycloak-jwks Backend
      wait:
        target:
          kind: GatewayExtension
          metadata:
            namespace: kgateway-system
            name: keycloak-oauth2
        jsonPath: "$.spec.oauth2.jwt.jwksBackendRef.name"
        jsonPathExpectation:
          comparator: equals
          value: keycloak-jwks
        polling:
          timeoutSeconds: 60
          intervalSeconds: 2
    - name: the keycloak-oauth2 TrafficPolicy is still accepted after the GatewayExtension change
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: keycloak-oauth2
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 180
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
