- after:
    block: 8
    fingerprint: 3f6810b1588e4c6c
    lang: console
    lines: 76741cb6 6fcd35db 39b522ee ab5df625
    preview: 'http.{{< version include-if="2.0.x,2.1.x,2.2.x,2.3.x,2.4.x" >}}http{{< /version '
  content: |-
    {{< doc-test paths="csrf" >}}
    # Test-only: read the counters from the admin port inside the proxy pod instead
    # of a port-forward. The checks above sent requests without an origin, with a
    # rejected origin, and with accepted origins, so all three are at least 1.
    csrf_ok=false
    for i in $(seq 1 30); do
      csrf_stats=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/stats" 2>/dev/null) || true
      csrf_lines=$(grep -E '^http\.[^ ]+\.csrf\.(missing_source_origin|request_invalid|request_valid): ' <<<"$csrf_stats") || true
      csrf_missing=$(grep -E '\.csrf\.missing_source_origin: ' <<<"$csrf_lines" | head -1 | sed 's/.*: //') || true
      csrf_invalid=$(grep -E '\.csrf\.request_invalid: ' <<<"$csrf_lines" | head -1 | sed 's/.*: //') || true
      csrf_valid=$(grep -E '\.csrf\.request_valid: ' <<<"$csrf_lines" | head -1 | sed 's/.*: //') || true
      if [ "${csrf_missing:-0}" -ge 1 ] 2>/dev/null && [ "${csrf_invalid:-0}" -ge 1 ] 2>/dev/null && [ "${csrf_valid:-0}" -ge 1 ] 2>/dev/null; then
        csrf_ok=true
        break
      fi
      sleep 2
    done
    if [ "$csrf_ok" != true ]; then
      echo "csrf stats: expected missing_source_origin, request_invalid, and request_valid of at least 1"
      echo "${csrf_lines:-no csrf stats found}"
      exit 1
    fi
    echo "csrf stats:"
    echo "$csrf_lines"
    {{< /doc-test >}}
