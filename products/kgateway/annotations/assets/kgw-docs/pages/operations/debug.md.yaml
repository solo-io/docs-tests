  content: |-
    {{< doc-test paths="debug" >}}
    # The proxy container starts Envoy with the debug log level from the GatewayParameters.
    args=$(kubectl get pods -l app.kubernetes.io/name=debug-gateway -n kgateway-system -o jsonpath='{.items[0].spec.containers[0].args}')
    echo "debug-gateway proxy args: $args"
    if ! python3 -c 'import json,sys; a=json.loads(sys.argv[1]); i=a.index("--log-level"); sys.exit(0 if a[i+1]=="debug" else 1)' "$args"; then
      echo "FAIL: the debug-gateway proxy container is not started with --log-level debug"
      exit 1
    fi
    {{< /doc-test >}}
