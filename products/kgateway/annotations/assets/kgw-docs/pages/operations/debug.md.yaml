  content: |-
    {{< doc-test paths="debug" >}}
    # Test-only: the CI runner cannot forward ports, and the admin server listens
    # on localhost:9095 inside the control plane pod. Add a debug container with
    # curl to the pod (it shares the pod's network) and read the endpoints from it.
    cp_pod=$(kubectl get pod -n kgateway-system -l app.kubernetes.io/name=kgateway -o jsonpath='{.items[0].metadata.name}')
    kubectl debug -n kgateway-system "$cp_pod" --image=curlimages/curl:8.10.1 --container=doctest-admin -- sleep 3600
    for i in $(seq 1 60); do
      [ -n "$(kubectl get pod -n kgateway-system "$cp_pod" -o jsonpath='{.status.ephemeralContainerStatuses[?(@.name=="doctest-admin")].state.running}')" ] && break
      echo "waiting for the doctest-admin debug container to run ($i/60)"; sleep 2
    done
    cp_admin() { kubectl exec -n kgateway-system "$cp_pod" -c doctest-admin -- curl -sS -L --max-time 30 "http://localhost:9095$1"; }
    index=$(cp_admin /)
    for want in 'Admin Server' '/debug/pprof/' '/logging' '/snapshots/krt' '/snapshots/xds' 'Current Levels:'; do
      if ! grep -qF "$want" <<<"$index"; then
        echo "FAIL: the admin server index page does not show $want"
        exit 1
      fi
    done
    pprof=$(cp_admin /debug/pprof)
    for want in goroutine heap; do
      if ! grep -q "$want" <<<"$pprof"; then
        echo "FAIL: /debug/pprof does not list the $want profile"
        exit 1
      fi
    done
    cp_admin /snapshots/krt > krt.json
    if ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d else 1)' krt.json; then
      echo "FAIL: /snapshots/krt did not return a non-empty JSON snapshot"
      head -c 500 krt.json; exit 1
    fi
    xds_ok=""
    for i in $(seq 1 30); do
      cp_admin /snapshots/xds > xds.json
      if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("data") and any("http" in k for k in d["data"]) else 1)' xds.json && grep -q 'www.example.com' xds.json; then
        xds_ok=1; break
      fi
      echo "waiting for /snapshots/xds to hold the http Gateway snapshot with the www.example.com route ($i/30)"; sleep 5
    done
    if [ -z "$xds_ok" ]; then
      echo "FAIL: /snapshots/xds has no snapshot for the http Gateway that holds the www.example.com route"
      head -c 1000 xds.json; exit 1
    fi
    {{< /doc-test >}}
