  content: |-
    {{< doc-test paths="debug" >}}
    # The debug gateway proxy writes debug-level Envoy log lines, as in the example output.
    logs=$(kubectl logs -n kgateway-system -l app.kubernetes.io/name=debug-gateway --tail=-1)
    if ! grep -q '\]\[debug\]\[' <<<"$logs"; then
      echo "FAIL: the debug-gateway proxy logs have no [debug] lines"
      tail -20 <<<"$logs"; exit 1
    fi
    if ! grep -q '\]\[debug\]\[\(connection\|http\|pool\|router\)\]' <<<"$logs"; then
      echo "FAIL: the debug-gateway proxy logs have no debug lines for the request (connection, http, pool, or router)"
      tail -20 <<<"$logs"; exit 1
    fi
    {{< /doc-test >}}
