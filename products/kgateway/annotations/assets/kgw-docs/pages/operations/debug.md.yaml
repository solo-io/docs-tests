    - name: debug - wait for the debug-gateway Gateway to be programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: debug-gateway
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: debug - wait for the debug-gateway proxy deployment to be ready
      wait:
        target:
          kind: Deployment
