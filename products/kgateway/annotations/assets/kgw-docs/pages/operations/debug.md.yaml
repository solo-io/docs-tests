    {{< doc-test paths="debug" >}}
    # Step 6, Cloud Provider LoadBalancer: a request for debug.com through the
    # debug gateway proxy reaches httpbin.
    YAMLTest -f - <<'EOF'
    - name: debug - a request for debug.com through the debug-gateway returns 200 from httpbin
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "debug.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyJsonPath:
        - path: "$.headers.Host[0]"
          comparator: equals
          value: "debug.com:8080"
    EOF
    {{< /doc-test >}}
