    YAMLTest -f - <<'EOF'
    - name: upgrade - the upgraded kgateway control plane is available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 400
          intervalSeconds: 5
    EOF
    proxy=""
    for i in $(seq 1 60); do
      proxy=$(kubectl -n kgateway-system get deployment http -o jsonpath='{.spec.template.spec.containers[0].image}')
      case "$proxy" in *":v${NEW_VERSION}") break ;; esac
      echo "waiting for the http gateway proxy to move to v${NEW_VERSION}: '$proxy' ($i/60)"; sleep 5
    done
    case "$proxy" in
      *":v${NEW_VERSION}") echo "http gateway proxy image: $proxy" ;;
