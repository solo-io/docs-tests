- after:
    start: true
  content: |-
    {{< doc-test paths="upgrade,upgrade-experimental" >}}
    # Test-only: install the previous minor release of kgateway with the quick
    # start's Helm commands, then the httpbin sample app behind the http Gateway,
    # and confirm that routing works before the upgrade.
    export OLD_VERSION={{< reuse "kgw-docs/versions/patch_n-1.md" >}}
    if [ -z "$OLD_VERSION" ]; then echo "FAIL: the previous minor version is empty"; exit 1; fi
    echo "Installing kgateway v${OLD_VERSION} before the upgrade"
    helm upgrade -i kgateway-crds oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds \
      --create-namespace --namespace kgateway-system \
      --version v{{< reuse "kgw-docs/versions/patch_n-1.md" >}} \
      --set controller.image.pullPolicy=Always
    helm upgrade -i kgateway oci://cr.kgateway.dev/kgateway-dev/charts/kgateway \
      --namespace kgateway-system \
      --version v{{< reuse "kgw-docs/versions/patch_n-1.md" >}} \
      --set controller.image.pullPolicy=Always
    kubectl rollout status deployment/kgateway -n kgateway-system --timeout=400s
    kubectl apply -f https://raw.githubusercontent.com/kgateway-dev/kgateway/refs/heads/{{< reuse "kgw-docs/versions/github-branch.md" >}}/examples/httpbin.yaml
    kubectl apply -f- <<'EOF'
    kind: Gateway
    apiVersion: gateway.networking.k8s.io/v1
    metadata:
      name: http
      namespace: kgateway-system
    spec:
      gatewayClassName: kgateway
      listeners:
      - protocol: HTTP
        port: 8080
        name: http
        allowedRoutes:
          namespaces:
            from: All
    EOF
    kubectl apply -f- <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: httpbin
      namespace: httpbin
    spec:
      parentRefs:
        - name: http
          namespace: kgateway-system
      hostnames:
        - "www.example.com"
      rules:
        - backendRefs:
            - name: httpbin
              port: 8000
    EOF
    kubectl rollout status deployment/httpbin -n httpbin --timeout=400s
    YAMLTest -f - <<'EOF'
    - name: upgrade - before the upgrade, the http Gateway is programmed
      wait:
        target:
          kind: Gateway
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: upgrade - before the upgrade, the http gateway service has a load balancer address
      wait:
        target:
          kind: Service
          metadata:
            namespace: kgateway-system
            name: http
        jsonPath: "$.status.loadBalancer.ingress[0].ip"
        jsonPathExpectation:
          comparator: exists
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: upgrade - before the upgrade, the httpbin HTTPRoute is accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    export INGRESS_GW_ADDRESS=$(kubectl get svc -n kgateway-system http -o=jsonpath="{.status.loadBalancer.ingress[0]['hostname','ip']}")
    code=""
    for i in $(seq 1 60); do
      code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/headers" -H "host: www.example.com:8080") || true
      [ "$code" = "200" ] && break
      echo "before the upgrade: GET /headers returned '$code', want 200 ($i/60)"; sleep 2
    done
    if [ "$code" != "200" ]; then
      echo "FAIL: before the upgrade, routing to httpbin through the http Gateway returned $code, want 200"
      exit 1
    fi
    image=$(kubectl -n kgateway-system get deployment kgateway -o jsonpath='{.spec.template.spec.containers[0].image}')
    case "$image" in
      *":v${OLD_VERSION}") echo "kgateway v${OLD_VERSION} runs before the upgrade: $image" ;;
      *) echo "FAIL: the control plane image before the upgrade is $image, want tag v${OLD_VERSION}"; exit 1 ;;
    esac
    {{< /doc-test >}}
