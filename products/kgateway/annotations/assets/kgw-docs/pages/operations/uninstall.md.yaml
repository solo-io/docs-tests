  content: |-
    {{< doc-test paths="uninstall" >}}
    # Test-only: the page's command has placeholders. The httpbin sample has one
    # HTTPRoute, httpbin in the httpbin namespace.
    kubectl delete -n httpbin httproute httpbin
    for i in $(seq 1 30); do
      [ -z "$(kubectl get httproutes -A -o name)" ] && break
      echo "waiting for the HTTPRoutes to be deleted ($i/30)"; sleep 2
    done
    if [ -n "$(kubectl get httproutes -A -o name)" ]; then
      echo "FAIL: HTTPRoutes are left after step 2: $(kubectl get httproutes -A -o name | tr '\n' ' ')"
      exit 1
    fi
    {{< /doc-test >}}
