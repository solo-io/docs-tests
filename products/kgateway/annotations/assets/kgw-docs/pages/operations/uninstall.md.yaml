- after:
    block: 5
    fingerprint: 5c8e6c7ba97e0b0c
    lang: sh
    lines: 5c8e6c7b
    preview: kubectl delete -n <namespace> gateway <gateway-name>
  content: |-
    {{< doc-test paths="uninstall" >}}
    # Test-only: the page's command has placeholders. The httpbin sample has one
    # kgateway Gateway, http in the kgateway-system namespace. Deleting it removes
    # its gateway proxy deployment.
    kubectl delete -n kgateway-system gateway http
    for i in $(seq 1 60); do
      if [ -z "$(kubectl get gateways -A -o name)" ] && ! kubectl get deployment http -n kgateway-system >/dev/null 2>&1; then break; fi
      echo "waiting for the Gateways and the http proxy deployment to be deleted ($i/60)"; sleep 5
    done
    if [ -n "$(kubectl get gateways -A -o name)" ]; then
      echo "FAIL: Gateways are left after step 6: $(kubectl get gateways -A -o name | tr '\n' ' ')"
      exit 1
    fi
    if kubectl get deployment http -n kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the http gateway proxy deployment still exists after its Gateway was deleted"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 6
    fingerprint: 16f87fa35975e171
    lang: sh
    lines: 16f87fa3
    preview: 'helm uninstall {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}} -n {{< reuse '
  content: |-
    {{< doc-test paths="uninstall" >}}
    # The kgateway release and its control plane deployment are gone.
    for i in $(seq 1 60); do
      ! kubectl get deployment kgateway -n kgateway-system >/dev/null 2>&1 && break
      echo "waiting for the kgateway control plane deployment to be deleted ($i/60)"; sleep 5
    done
    if helm status kgateway -n kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the kgateway Helm release still exists"
      exit 1
    fi
    if kubectl get deployment kgateway -n kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the kgateway control plane deployment still exists"
      exit 1
    fi
    {{< /doc-test >}}
- after:
    block: 9
    fingerprint: eef583acc00c5d2c
    lang: sh
    lines: eef583ac
    preview: kubectl get crds | grep {{< reuse "/kgw-docs/snippets/helm-kgateway.md" >}}
  content: |-
    {{< doc-test paths="uninstall" >}}
    # Test-only: the page's grep exits 1 when nothing matches, which is the
    # expected result, so check the same thing without failing the script.
    for i in $(seq 1 60); do
      left=$(kubectl get crds -o name | grep kgateway || true)
      [ -z "$left" ] && ! kubectl get namespace kgateway-system >/dev/null 2>&1 && break
      echo "waiting for the kgateway CRDs and the kgateway-system namespace to be deleted ($i/60)"; sleep 5
    done
    left=$(kubectl get crds -o name | grep kgateway || true)
    if [ -n "$left" ]; then
      echo "FAIL: kgateway CRDs are left after uninstalling the kgateway-crds release: $(tr '\n' ' ' <<<"$left")"
      exit 1
    fi
    if helm status kgateway-crds -n kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the kgateway-crds Helm release still exists"
      exit 1
    fi
    if kubectl get namespace kgateway-system >/dev/null 2>&1; then
      echo "FAIL: the kgateway-system namespace still exists"
      exit 1
    fi
    {{< /doc-test >}}
