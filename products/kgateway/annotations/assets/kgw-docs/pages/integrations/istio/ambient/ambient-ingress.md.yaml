  content: |2-
       {{< doc-test paths="istio-ambient-ingress" >}}
       # Claims: status 200, and httpbin echoes Host: www.example.com:8080.
       resp=$(curl -sS -m 10 -w '\n%{http_code}' "http://$INGRESS_GW_ADDRESS:8080/headers" -H "host: www.example.com:8080")
       code=$(tail -n1 <<<"$resp")
       body=$(sed '$d' <<<"$resp")
       [ "$code" = "200" ] || { echo "expected 200 through the ambient ingress, got ${code}"; exit 1; }
       host=$(jq -r '.headers.Host[0]' <<<"$body")
       [ "$host" = "www.example.com:8080" ] || { echo "httpbin echoed Host '${host}', expected www.example.com:8080"; exit 1; }
       {{< /doc-test >}}
