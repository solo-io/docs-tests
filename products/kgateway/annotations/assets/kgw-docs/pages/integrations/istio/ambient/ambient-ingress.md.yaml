  content: |2-
          {{< doc-test paths="istio-ambient-ingress" >}}
          # The page reads the log of one ztunnel by name; read them all. ztunnel
          # logs a connection when it completes, and the gateway keeps its upstream
          # connection to httpbin pooled, so `connection: close` from the client
          # does not end it. If no entry shows up after a few rounds, restart the
          # gateway once so the pooled connection closes.
          line=""
          restarted=""
          for i in $(seq 1 30); do
            for j in 1 2 3; do
              curl -sSI -m 10 "http://$INGRESS_GW_ADDRESS:8080/headers" -H "host: www.example.com:8080" -H "connection: close" > /dev/null || true
            done
            logs=$(kubectl -n istio-system logs -l app=ztunnel --since=5m --tail=-1 2>/dev/null || true)
            line=$(grep 'dst.namespace="httpbin"' <<<"$logs" | grep 'src.namespace="{{< reuse "kgw-docs/snippets/namespace.md" >}}"' | tail -n1 || true)
            [ -n "$line" ] && break
            if [ "$i" -ge 5 ] && [ -z "$restarted" ]; then
              kubectl -n {{< reuse "kgw-docs/snippets/namespace.md" >}} rollout restart deployment/http
              kubectl -n {{< reuse "kgw-docs/snippets/namespace.md" >}} rollout status deployment/http --timeout=120s
              restarted=yes
            fi
            sleep 4
          done
          [ -n "$line" ] || { echo "no ztunnel log line for {{< reuse "kgw-docs/snippets/namespace.md" >}} -> httpbin"; exit 1; }
          echo "$line"
          # Claims: both workloads have a SPIFFE ID, and the hop goes over HBONE (15008).
          for want in 'src.identity="spiffe://cluster.local/ns/{{< reuse "kgw-docs/snippets/namespace.md" >}}/' \
                      'dst.identity="spiffe://cluster.local/ns/httpbin/sa/httpbin"' \
                      'dst.hbone_addr=' ':15008 '; do
            case "$line" in
              *"$want"*) ;;
              *) echo "ztunnel log line is missing '${want}'"; exit 1 ;;
            esac
          done
          {{< /doc-test >}}
