  content: |2-
       {{< doc-test paths="istio-ambient-ingress" >}}
       # Ambient picks up running pods without a restart, but not instantly. Wait
       # until the gateway reaches httpbin again before the page's request.
       for i in $(seq 1 60); do
         code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" "http://$INGRESS_GW_ADDRESS:8080/headers" -H "host: www.example.com:8080" || true)
         [ "$code" = "200" ] && break
         sleep 2
       done
       {{< /doc-test >}}
