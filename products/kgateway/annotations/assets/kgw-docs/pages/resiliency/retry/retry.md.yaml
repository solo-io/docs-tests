    preview: '{'
  content: |-
    {{< doc-test paths="retry,retry-trafficpolicy,retry-gateway-listener" >}}
    # Test-only: replaces the reader's port-forward, config dump, curl, and
    # kubectl logs steps. Uses the Envoy admin API through kubectl exec.
    retry_admin() {
      kubectl exec deploy/http -n kgateway-system -- wget -qO- "127.0.0.1:19000/$1" 2>/dev/null
    }
    # Value of the upstream_rq_retry counter on the reviews cluster, 0 when unset.
    retry_count() {
      local v
      v=$(retry_admin "stats?filter=upstream_rq_retry" | grep -E '^cluster\.[^ ]*reviews[^ ]*\.upstream_rq_retry: ' | head -1 | sed 's/.*: //' || true)
      echo "${v:-0}"
    }
    # "<response_code> <response_flags>" of the latest /reviews/1 access log entry.
    retry_last_log() {
      kubectl logs deploy/http -n kgateway-system --tail=200 2>/dev/null \
        | jq -R -r 'fromjson? | select(type == "object" and .path == "/reviews/1") | "\(.response_code) \(.response_flags)"' \
        | tail -1 || true
    }
    retry_code() {
      curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://${INGRESS_GW_ADDRESS}:8080/reviews/1" -H "host: retry.example:8080" || true
    }

    # The retry policy reaches the retry.example virtual host: 3 retries, 1s base backoff.
    policy=""
    for i in $(seq 1 60); do
      policy=$(retry_admin "config_dump?resource=dynamic_route_configs" \
        | jq -c '[.configs[]?.route_config.virtual_hosts[]? | select(any(.domains[]?; startswith("retry.example"))) | .. | objects | select(has("num_retries"))] | first // empty' 2>/dev/null) || true
      if [ -n "$policy" ]; then break; fi
      echo "retry policy for retry.example not in the Envoy config yet ($i/60)"; sleep 5
    done
    if [ -z "$policy" ] || [ "$(jq -r '.num_retries' <<<"$policy")" != "3" ] || [ "$(jq -r '.retry_back_off.base_interval // empty' <<<"$policy")" != "1s" ]; then
      echo "retry: expected a retry policy with num_retries 3 and base_interval 1s on the retry.example virtual host, got: ${policy:-none}"
      exit 1
    fi
    echo "retry: Envoy retry policy $policy"

    # A healthy reviews app answers 200, without retries.
    code=""
    for i in $(seq 1 60); do
      code=$(retry_code)
      if [ "$code" = "200" ]; then break; fi
      echo "retry.example/reviews/1 returned ${code:-no response}, waiting for 200 ($i/60)"; sleep 5
    done
    if [ "$code" != "200" ]; then
      echo "retry: expected 200 from the healthy reviews app, got ${code:-no response}"
      exit 1
    fi
    before=$(retry_count)
    code=$(retry_code)
    after=$(retry_count)
    if [ "$code" != "200" ] || [ "$after" != "$before" ]; then
      echo "retry: expected a 200 with no retries, got $code and upstream_rq_retry $before -> $after"
      exit 1
    fi
    log=""
    for i in $(seq 1 10); do
      log=$(retry_last_log)
      if [ "$log" = "200 -" ]; then break; fi
      sleep 2
    done
    if [ "$log" != "200 -" ]; then
      echo "retry: expected the access log entry '200 -' (no response flags), got: ${log:-no entry}"
      exit 1
    fi
    echo "retry: healthy request returned 200 with response_flags '-' and no retries"
    {{< /doc-test >}}
