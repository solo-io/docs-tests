  content: |-
    {{< doc-test paths="retry,retry-trafficpolicy,retry-gateway-listener" >}}
    # Test-only: replaces the reader's curl and kubectl logs steps. The sleeping
    # reviews pod refuses connections, so each request is retried and then fails.
    code=""
    for i in $(seq 1 60); do
      code=$(retry_code)
      if [ "$code" = "503" ]; then break; fi
      echo "retry.example/reviews/1 returned ${code:-no response}, waiting for 503 ($i/60)"; sleep 5
    done
    if [ "$code" != "503" ]; then
      echo "retry: expected 503 once the reviews app stops listening, got ${code:-no response}"
      exit 1
    fi
    before=$(retry_count)
    code=$(retry_code)
    after=$(retry_count)
    if [ "$code" != "503" ] || [ "$after" -le "$before" ]; then
      echo "retry: expected a 503 after retries, got $code and upstream_rq_retry $before -> $after"
      exit 1
    fi
    echo "retry: failing request returned 503 after $((after - before)) retries (the policy allows 3)"
    log=""
    for i in $(seq 1 10); do
      log=$(retry_last_log)
      case "$log" in 503\ *URX*) case "$log" in *UF*) break ;; esac ;; esac
      sleep 2
    done
    case "$log" in
      503\ *URX*UF*|503\ *UF*URX*) echo "retry: access log shows $log" ;;
      *) echo "retry: expected the access log entry for the failed request to show 503 with URX and UF response flags, got: ${log:-no entry}"; exit 1 ;;
    esac
    {{< /doc-test >}}
