  content: |-
    {{< doc-test paths="per-try-timeout,per-try-timeout-trafficpolicy,per-try-timeout-gateway-listener" >}}
    # Test-only: replaces the reader's port-forward and config dump steps, and
    # checks that the per-try timeout fires. Uses the Envoy admin API through
    # kubectl exec.
    ptt_admin() {
      kubectl exec deploy/http -n kgateway-system -- wget -qO- "127.0.0.1:19000/$1" 2>/dev/null
    }
    # Value of the upstream_rq_per_try_timeout counter on the httpbin cluster, 0 when unset.
    ptt_count() {
      local v
      v=$(ptt_admin "stats?filter=upstream_rq_per_try_timeout" | grep -E '^cluster\.[^ ]*httpbin_8000\.upstream_rq_per_try_timeout: ' | head -1 | sed 's/.*: //' || true)
      echo "${v:-0}"
    }
    policy=""
    for i in $(seq 1 60); do
      policy=$(ptt_admin "config_dump?resource=dynamic_route_configs" \
        | jq -c '[.configs[]?.route_config.virtual_hosts[]? | select(any(.domains[]?; startswith("retry.example"))) | .. | objects | select(has("per_try_timeout"))] | first // empty' 2>/dev/null) || true
      if [ -n "$policy" ]; then break; fi
      echo "per_try_timeout for retry.example not in the Envoy config yet ($i/60)"; sleep 5
    done
    if [ -z "$policy" ] || [ "$(jq -r '.per_try_timeout // empty' <<<"$policy")" != "5s" ]; then
      echo "per-try-timeout: expected a retry policy with per_try_timeout 5s on the retry.example virtual host, got: ${policy:-none}"
      exit 1
    fi
    echo "per-try-timeout: Envoy retry policy $policy"

    # A response faster than the per-try timeout succeeds.
    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://${INGRESS_GW_ADDRESS}:8080/delay/2" -H "host: retry.example:8080" || true)
    if [ "$code" != "200" ]; then
      echo "per-try-timeout: expected 200 from /delay/2, which is shorter than the 5s per-try timeout, got ${code:-no response}"
      exit 1
    fi
    # A response slower than the per-try timeout fails with 504 once the timeout fires.
    before=$(ptt_count)
    result=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 40 "http://${INGRESS_GW_ADDRESS}:8080/delay/7" -H "host: retry.example:8080" || true)
    after=$(ptt_count)
    code=${result%% *}
    elapsed=${result#* }
    if [ "$code" != "504" ]; then
      echo "per-try-timeout: expected 504 from /delay/7, which is longer than the 5s per-try timeout, got ${result:-no response}"
      exit 1
    fi
    if ! awk -v t="$elapsed" 'BEGIN { exit !(t >= 4.5 && t <= 17) }'; then
      echo "per-try-timeout: expected the 504 between 4.5s (one 5s try) and 17s (the 15s route timeout), took ${elapsed}s"
      exit 1
    fi
    if [ "$after" -le "$before" ]; then
      echo "per-try-timeout: expected upstream_rq_per_try_timeout on the httpbin cluster to rise, got $before -> $after"
      exit 1
    fi
    echo "per-try-timeout: /delay/7 returned 504 after ${elapsed}s; upstream_rq_per_try_timeout $before -> $after"
    {{< /doc-test >}}
