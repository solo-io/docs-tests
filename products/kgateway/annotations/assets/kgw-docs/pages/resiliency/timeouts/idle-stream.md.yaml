    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="timeout-idle-stream" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the timeout TrafficPolicy to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: timeout
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only check. The page port-forwards the admin port of the http gateway
    # proxy; the test reads the same config dump with kubectl exec instead. Every
    # route to the kube_httpbin_httpbin_8000 cluster must carry idle_timeout 600s.
    idle_stream_ok=false
    idle_stream_out=""
    for i in $(seq 1 60); do
      idle_stream_out=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_route_configs" 2>/dev/null | python3 -c '
    import json, sys
    try:
        d = json.load(sys.stdin)
    except Exception:
        sys.exit(0)
    vals = []
    for c in d.get("configs", []):
        rc = c.get("route_config") or {}
        for vh in rc.get("virtual_hosts", []):
            for r in vh.get("routes", []):
                route = r.get("route") or {}
                if route.get("cluster") == "kube_httpbin_httpbin_8000":
                    vals.append(route.get("idle_timeout", "unset"))
    print(" ".join(sorted(set(vals))))
    ' || true)
      if [ "$idle_stream_out" = "600s" ]; then
        idle_stream_ok=true
        break
      fi
      sleep 5
    done
    if [ "$idle_stream_ok" != true ]; then
      echo "timeout-idle-stream: expected route idle_timeout 600s on every route to kube_httpbin_httpbin_8000, got '${idle_stream_out:-no httpbin route}'"
      exit 1
    fi
    echo "timeout-idle-stream: routes to kube_httpbin_httpbin_8000 have idle_timeout 600s"
    # Traffic through the httpbin route still works with the policy attached.
    idle_stream_code=""
    for i in $(seq 1 30); do
      idle_stream_code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" || true)
      [ "$idle_stream_code" = "200" ] && break
      sleep 2
    done
    if [ "$idle_stream_code" != "200" ]; then
      echo "timeout-idle-stream: expected HTTP 200 from www.example.com/status/200, got '${idle_stream_code:-no response}'"
      exit 1
    fi
    echo "timeout-idle-stream: www.example.com/status/200 returned 200"
    {{< /doc-test >}}
