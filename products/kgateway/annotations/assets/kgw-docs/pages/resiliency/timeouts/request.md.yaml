      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-timeout
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: wait for the timeout TrafficPolicy on the timeout rule to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: timeout
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
