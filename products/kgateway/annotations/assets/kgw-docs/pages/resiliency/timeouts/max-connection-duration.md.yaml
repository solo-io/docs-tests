    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="timeout-max-connection-duration" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the max-connection-duration ListenerPolicy to be accepted
      wait:
        target:
          kind: ListenerPolicy
          metadata:
            namespace: kgateway-system
            name: max-connection-duration
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only check. The page port-forwards the admin port of the http gateway
    # proxy; the test reads the same config dump with kubectl exec instead. Every
    # http_connection_manager on the active listeners must carry
    # max_connection_duration 600s (10m).
    mcd_listener_ok=false
    mcd_listener_out=""
    for i in $(seq 1 60); do
      mcd_listener_out=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_listeners" 2>/dev/null | python3 -c '
    import json, sys
    try:
        d = json.load(sys.stdin)
    except Exception:
        sys.exit(0)
    vals = []
    def walk(o):
        if isinstance(o, dict):
            if o.get("name") == "envoy.filters.network.http_connection_manager":
                opts = (o.get("typed_config") or {}).get("common_http_protocol_options") or {}
                vals.append(opts.get("max_connection_duration", "unset"))
            for x in o.values():
                walk(x)
        elif isinstance(o, list):
            for x in o:
                walk(x)
    for c in d.get("configs", []):
        # With ?resource=dynamic_listeners each config is one DynamicListener.
        for l in c.get("dynamic_listeners", [c]):
            walk((l.get("active_state") or {}).get("listener") or {})
    print(" ".join(sorted(set(vals))))
    ' || true)
      if [ "$mcd_listener_out" = "600s" ]; then
        mcd_listener_ok=true
        break
      fi
      sleep 5
    done
    if [ "$mcd_listener_ok" != true ]; then
      echo "timeout-max-connection-duration: expected max_connection_duration 600s in common_http_protocol_options of every http_connection_manager, got '${mcd_listener_out:-no listener config}'"
      exit 1
    fi
    echo "timeout-max-connection-duration: listener common_http_protocol_options.max_connection_duration is 600s"
    {{< /doc-test >}}
