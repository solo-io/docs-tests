  content: |-
    {{< doc-test paths="timeout-max-connection-duration" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the max-connection-duration BackendConfigPolicy to be accepted
      wait:
        target:
          kind: BackendConfigPolicy
          metadata:
            namespace: httpbin
            name: max-connection-duration
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only check: the kube_httpbin_httpbin_8000 cluster must carry
    # max_connection_duration 600s in its upstream HttpProtocolOptions.
    mcd_cluster_ok=false
    mcd_cluster_out=""
    for i in $(seq 1 60); do
      mcd_cluster_out=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_active_clusters" 2>/dev/null | python3 -c '
    import json, sys
    try:
        d = json.load(sys.stdin)
    except Exception:
        sys.exit(0)
    for c in d.get("configs", []):
        cl = c.get("cluster") or {}
        if cl.get("name") != "kube_httpbin_httpbin_8000":
            continue
        opts = (cl.get("typed_extension_protocol_options") or {}).get("envoy.extensions.upstreams.http.v3.HttpProtocolOptions") or {}
        print((opts.get("common_http_protocol_options") or {}).get("max_connection_duration", "unset"))
    ' || true)
      if [ "$mcd_cluster_out" = "600s" ]; then
        mcd_cluster_ok=true
        break
      fi
      sleep 5
    done
    if [ "$mcd_cluster_ok" != true ]; then
      echo "timeout-max-connection-duration: expected max_connection_duration 600s on cluster kube_httpbin_httpbin_8000, got '${mcd_cluster_out:-cluster not found}'"
      exit 1
    fi
    echo "timeout-max-connection-duration: cluster kube_httpbin_httpbin_8000 has max_connection_duration 600s"
    # Traffic through the gateway to httpbin still works with both policies attached.
    mcd_code=""
    for i in $(seq 1 30); do
      mcd_code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" || true)
      [ "$mcd_code" = "200" ] && break
      sleep 2
    done
    if [ "$mcd_code" != "200" ]; then
      echo "timeout-max-connection-duration: expected HTTP 200 from www.example.com/status/200, got '${mcd_code:-no response}'"
      exit 1
    fi
    echo "timeout-max-connection-duration: www.example.com/status/200 returned 200"
    {{< /doc-test >}}
