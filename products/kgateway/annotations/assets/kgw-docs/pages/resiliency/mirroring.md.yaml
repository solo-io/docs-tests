    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="mirroring" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the httpbin-mirror TrafficPolicy with disableShadowHostSuffixAppend to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: httpbin-mirror
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only: mr_policy prints the route's mirror policy for the httpbin2 cluster
    # from config_dump as JSON, or "none". The page has no step to read it, so read
    # the admin port with kubectl exec.
    mr_policy() {
      kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_route_configs" 2>/dev/null | python3 -c '
    import json, sys
    def walk(o):
        if isinstance(o, dict):
            for p in o.get("request_mirror_policies", []) or []:
                if "httpbin2" in str(p.get("cluster", "")):
                    return p
            o = list(o.values())
        if isinstance(o, list):
            for v in o:
                r = walk(v)
                if r is not None:
                    return r
        return None
    try:
        p = walk(json.load(sys.stdin))
        print(json.dumps(p, sort_keys=True, separators=(",", ":")) if p else "none")
    except Exception:
        print("none")
    ' || true
    }
    mr_got=""
    for attempt in $(seq 1 60); do
      mr_got=$(mr_policy)
      case "$mr_got" in *'"disable_shadow_host_suffix_append":true'*) break ;; esac
      sleep 2
    done
    echo "mirroring: httpbin2 mirror policy is ${mr_got}"
    case "$mr_got" in
      *'"disable_shadow_host_suffix_append":true'*) ;;
      *) echo "mirroring: expected disable_shadow_host_suffix_append true on the httpbin2 mirror policy"; exit 1 ;;
    esac
    mr_check kgw-mirror-no-suffix || exit 1
    {{< /doc-test >}}
