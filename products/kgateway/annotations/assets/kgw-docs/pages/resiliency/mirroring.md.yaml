    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="mirroring" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the httpbin-mirror HTTPRoute to be accepted
      wait:
        target:
          kind: HTTPRoute
          metadata:
            namespace: httpbin
            name: httpbin-mirror
        jsonPath: "$.status.parents[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    - name: mirroring - requests on mirror.example reach httpbin
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /headers
        method: GET
        headers:
          host: "mirror.example:8080"
      source:
        type: local
      expect:
        statusCode: 200
    EOF
    # Test-only: mr_check sends 5 requests on mirror.example to a unique path, then
    # checks that both httpbin (v1, the backend) and httpbin2 (v2, the mirror) log
    # all 5 of them. The mirror copy is sent asynchronously, so retry the log check.
    mr_check() {
      mr_marker="$1"
      for i in 1 2 3 4 5; do
        mr_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${INGRESS_GW_ADDRESS}:8080/anything/${mr_marker}" -H "host: mirror.example:8080" || true)
        if [ "$mr_code" != "200" ]; then
          echo "mirroring: expected 200 for /anything/${mr_marker} on mirror.example, got '${mr_code}'"
          return 1
        fi
      done
      mr_v1=0; mr_v2=0
      for attempt in $(seq 1 30); do
        mr_v1=$(kubectl logs -l version=v1 -n httpbin -c httpbin --tail=-1 2>/dev/null | grep -c "/anything/${mr_marker}" || true)
        mr_v2=$(kubectl logs deploy/httpbin2 -n httpbin -c httpbin --tail=-1 2>/dev/null | grep -c "/anything/${mr_marker}" || true)
        [ "$mr_v1" -ge 5 ] && [ "$mr_v2" -ge 5 ] && break
        sleep 2
      done
      echo "mirroring: /anything/${mr_marker} logged ${mr_v1} times by httpbin (v1) and ${mr_v2} times by httpbin2 (v2)"
      if [ "$mr_v1" -lt 5 ] || [ "$mr_v2" -lt 5 ]; then
        echo "mirroring: expected both httpbin and the httpbin2 mirror to log all 5 requests"
        return 1
      fi
    }
    mr_check kgw-mirror-route || exit 1
    {{< /doc-test >}}
- after:
