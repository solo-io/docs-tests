  content: |-
    {{< doc-test paths="outlier-detection" >}}
    kubectl rollout status deploy/httpbin -n httpbin --timeout=300s
    # Test-only: the page reads pod logs and uses a port-forward to read Envoy stats.
    # The test reads the proxy's admin endpoints with kubectl exec instead: /clusters
    # for per-host request counts and outlier flags, /stats for outlier detection
    # counters, and config_dump for the outlier_detection config of a cluster.
    od_admin() {
      kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/$1" 2>/dev/null || true
    }
    # od_hosts <cluster>: one host address per line.
    od_hosts() {
      od_admin clusters | awk -F'::' -v c="$1" '$1==c && $3=="health_flags" {print $2}' | sort -u
    }
    # od_ejected <cluster>: the hosts that carry the failed_outlier_check flag.
    od_ejected() {
      od_admin clusters | awk -F'::' -v c="$1" '$1==c && $3=="health_flags" && $4 ~ /failed_outlier_check/ {print $2}' | sort -u
    }
    # od_rq <cluster> <host>: the host's rq_total counter.
    od_rq() {
      local v
      v=$(od_admin clusters | awk -F'::' -v c="$1" -v h="$2" '$1==c && $2==h && $3=="rq_total" {print $4; exit}')
      echo "${v:-0}"
    }
    # od_stat <cluster> <stat>: an outlier_detection stat of the cluster, 0 if absent.
    od_stat() {
      local v
      v=$(od_admin "stats?filter=outlier_detection" | awk -v n="cluster.$1.outlier_detection.$2:" '$1==n {print $2; exit}')
      echo "${v:-0}"
    }
    # od_send <path> <count> <code>: send requests through the gateway and print
    # how many did not return the expected status code.
    od_send() {
      local path="$1" n="$2" want="$3" i code bad=0
      for i in $(seq 1 "$n"); do
        code=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "http://${INGRESS_GW_ADDRESS}:8080${path}" -H "host: www.example.com:8080" || true)
        [ "$code" = "$want" ] || bad=$((bad + 1))
      done
      echo "$bad"
    }
    # od_outlier_expect <label> <cluster> <key=json>|<!key>...: wait until the
    # cluster's outlier_detection config has every key=value and none of the !keys.
    od_outlier_expect() {
      local label="$1" cluster="$2" attempt got=""
      shift 2
      for attempt in $(seq 1 60); do
        got=$(od_admin "config_dump?resource=dynamic_active_clusters" | python3 -c '
    import json, sys
    name, checks = sys.argv[1], sys.argv[2:]
    def find(o):
        if isinstance(o, dict):
            if o.get("name") == name:
                return o
            o = list(o.values())
        if isinstance(o, list):
            for v in o:
                r = find(v)
                if r is not None:
                    return r
        return None
    try:
        c = find(json.load(sys.stdin))
    except Exception:
        c = None
    od = (c or {}).get("outlier_detection")
    if od is None:
        print("missing")
        sys.exit(0)
    for chk in checks:
        if chk.startswith("!"):
            if chk[1:] in od:
                print("unexpected " + chk[1:] + " in " + json.dumps(od, sort_keys=True))
                sys.exit(0)
        else:
            k, v = chk.split("=", 1)
            if od.get(k) != json.loads(v):
                print("want " + chk + " in " + json.dumps(od, sort_keys=True))
                sys.exit(0)
    print("ok " + json.dumps(od, sort_keys=True, separators=(",", ":")))
    ' "$cluster" "$@" || true)
        case "$got" in
          ok*)
            echo "outlier-detection: $label - $cluster ${got#ok }"
            return 0
            ;;
        esac
        sleep 2
      done
      echo "outlier-detection: $label - outlier_detection of $cluster does not match: ${got:-no config_dump}"
      exit 1
    }
    # od_spread <label>: send 20 requests and check that both httpbin hosts served some.
    od_spread() {
      local label="$1" attempt h1 h2 a0 b0 a1 b1 bad=""
      for attempt in $(seq 1 5); do
        h1=$(od_hosts kube_httpbin_httpbin_8000 | sed -n 1p)
        h2=$(od_hosts kube_httpbin_httpbin_8000 | sed -n 2p)
        a0=$(od_rq kube_httpbin_httpbin_8000 "$h1")
        b0=$(od_rq kube_httpbin_httpbin_8000 "$h2")
        bad=$(od_send /status/200 20 200)
        a1=$(od_rq kube_httpbin_httpbin_8000 "$h1")
        b1=$(od_rq kube_httpbin_httpbin_8000 "$h2")
        if [ "$bad" = 0 ] && [ -n "$h1" ] && [ -n "$h2" ] && [ "$a1" -gt "$a0" ] && [ "$b1" -gt "$b0" ]; then
          echo "outlier-detection: $label - both httpbin hosts served requests ($h1 rq_total $a0 -> $a1, $h2 rq_total $b0 -> $b1)"
          return 0
        fi
        sleep 2
      done
      echo "outlier-detection: $label - expected 20 x 200 spread over 2 httpbin hosts; non-200: $bad, ${h1:-no host} rq_total $a0 -> $a1, ${h2:-no host} rq_total $b0 -> $b1"
      exit 1
    }
    # Wait until the gateway proxy sees both httpbin replicas.
    od_n=0
    for i in $(seq 1 60); do
      od_n=$(od_hosts kube_httpbin_httpbin_8000 | wc -l | tr -d ' ')
      [ "$od_n" = 2 ] && break
      sleep 2
    done
    if [ "$od_n" != 2 ]; then
      echo "outlier-detection: expected 2 hosts in cluster kube_httpbin_httpbin_8000 after scaling httpbin, got $od_n"
      od_admin clusters | grep '^kube_httpbin_httpbin_8000::' | grep health_flags || true
      exit 1
    fi
    echo "outlier-detection: cluster kube_httpbin_httpbin_8000 has 2 hosts"
    {{< /doc-test >}}
