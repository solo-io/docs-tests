  content: |-
    {{< doc-test paths="outlier-detection" >}}
    # The page's step 9 command is identical to step 7, so the extractor drops it
    # from the script. Send the second 503 here; it can only reach the healthy host.
    # The 503 qualifies that host for ejection, but maxEjectionPercent 80 keeps it
    # in the pool: the overflow counter goes up, and still only the first host is
    # ejected.
    if [ "$(od_send /status/503 1 503)" != 0 ]; then
      echo "outlier-detection: expected /status/503 to return 503 from the remaining host"
      exit 1
    fi
    od_overflow_ok=false
    for i in $(seq 1 30); do
      od_now=$(od_ejected kube_httpbin_httpbin_8000)
      if [ "$od_now" = "$OD_EJECTED" ] && [ "$(od_stat kube_httpbin_httpbin_8000 ejections_overflow)" -ge 1 ]; then
        od_overflow_ok=true
        break
      fi
      sleep 2
    done
    if [ "$od_overflow_ok" != true ]; then
      echo "outlier-detection: expected only $OD_EJECTED ejected and ejections_overflow >= 1 after the second 503, got ejected '${od_now:-none}', ejections_overflow $(od_stat kube_httpbin_httpbin_8000 ejections_overflow)"
      exit 1
    fi
    echo "outlier-detection: second host stayed in the pool (ejections_overflow $(od_stat kube_httpbin_httpbin_8000 ejections_overflow))"
    {{< /doc-test >}}
