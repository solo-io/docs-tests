  content: |-
    {{< doc-test paths="outlier-detection" >}}
    # One 503 ejects the host that returned it. Wait for exactly one ejected host.
    OD_EJECTED=""
    for i in $(seq 1 30); do
      OD_EJECTED=$(od_ejected kube_httpbin_httpbin_8000)
      [ "$(echo "$OD_EJECTED" | wc -w | tr -d ' ')" = 1 ] && break
      sleep 2
    done
    if [ "$(echo "$OD_EJECTED" | wc -w | tr -d ' ')" != 1 ]; then
      echo "outlier-detection: expected 1 ejected host (failed_outlier_check) in kube_httpbin_httpbin_8000 after one 503, got '${OD_EJECTED:-none}'"
      od_admin clusters | grep '^kube_httpbin_httpbin_8000::' | grep health_flags || true
      exit 1
    fi
    if [ "$(od_stat kube_httpbin_httpbin_8000 ejections_enforced_consecutive_5xx)" -lt 1 ]; then
      echo "outlier-detection: expected ejections_enforced_consecutive_5xx >= 1 for kube_httpbin_httpbin_8000"
      exit 1
    fi
    OD_HEALTHY=$(od_hosts kube_httpbin_httpbin_8000 | grep -v -x -F "$OD_EJECTED" || true)
    echo "outlier-detection: ejected host $OD_EJECTED, healthy host $OD_HEALTHY"
    # od_only_healthy <label>: 10 requests all return 200 and all go to the host
    # that was not ejected.
    od_only_healthy() {
      local label="$1" e0 h0 e1 h1 bad
      e0=$(od_rq kube_httpbin_httpbin_8000 "$OD_EJECTED")
      h0=$(od_rq kube_httpbin_httpbin_8000 "$OD_HEALTHY")
      bad=$(od_send /status/200 10 200)
      e1=$(od_rq kube_httpbin_httpbin_8000 "$OD_EJECTED")
      h1=$(od_rq kube_httpbin_httpbin_8000 "$OD_HEALTHY")
      if [ "$bad" != 0 ] || [ "$e1" != "$e0" ] || [ "$h1" -le "$h0" ]; then
        echo "outlier-detection: $label - expected 10 x 200 all on $OD_HEALTHY; non-200: $bad, ejected host rq_total $e0 -> $e1, healthy host rq_total $h0 -> $h1"
        exit 1
      fi
      echo "outlier-detection: $label - all requests went to $OD_HEALTHY (rq_total $h0 -> $h1), ejected host $OD_EJECTED stayed at $e0"
    }
    {{< /doc-test >}}
