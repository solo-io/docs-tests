  content: |-
    {{< doc-test paths="keepalive-http2" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the httpbin-http2-keepalive BackendConfigPolicy to be accepted
      wait:
        target:
          kind: BackendConfigPolicy
          metadata:
            namespace: httpbin
            name: httpbin-http2-keepalive
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only: the page reads config_dump through a port-forward, which the test
    # cannot use. The proxy's admin port listens on 127.0.0.1:19000 inside the pod,
    # so read it with kubectl exec instead. Print the connection_keepalive of the
    # httpbin cluster as compact JSON with sorted keys.
    h2ka_ok=false
    h2ka=""
    for i in $(seq 1 60); do
      h2ka=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/config_dump?resource=dynamic_active_clusters" 2>/dev/null | python3 -c '
    import json, sys
    def find(o, key):
        if isinstance(o, dict):
            if key in o:
                return o[key]
            o = list(o.values())
        if isinstance(o, list):
            for v in o:
                r = find(v, key)
                if r is not None:
                    return r
        return None
    def cluster(o):
        if isinstance(o, dict):
            if o.get("name") == "kube_httpbin_httpbin_8000":
                return o
            o = list(o.values())
        if isinstance(o, list):
            for v in o:
                r = cluster(v)
                if r is not None:
                    return r
        return None
    try:
        c = cluster(json.load(sys.stdin))
        ka = find(c, "connection_keepalive") if c else None
        print(json.dumps(ka, sort_keys=True, separators=(",", ":")) if ka is not None else "")
    except Exception:
        print("")
    ' || true)
      if [ "$h2ka" = '{"connection_idle_interval":"60s","interval":"30s","timeout":"5s"}' ]; then
        h2ka_ok=true
        break
      fi
      sleep 2
    done
    if [ "$h2ka_ok" != true ]; then
      echo "keepalive-http2: expected connection_keepalive {interval 30s, timeout 5s, connection_idle_interval 60s} on cluster kube_httpbin_httpbin_8000, got '${h2ka:-nothing}'"
      exit 1
    fi
    echo "keepalive-http2: cluster kube_httpbin_httpbin_8000 connection_keepalive is $h2ka"
    # No request check: the httpbin sample app serves only HTTP/1.1, so requests
    # fail while its Service uses h2c, as the page's note says.
    {{< /doc-test >}}
