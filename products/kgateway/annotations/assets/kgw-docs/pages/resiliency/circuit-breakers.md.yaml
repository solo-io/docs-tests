    preview: kubectl apply -f- <<EOF
  content: |-
    {{< doc-test paths="circuit-breakers" >}}
    # Test-only: the page re-applied its own limits with trackRemaining: true, which
    # replaces the lowered test-only limits. Check that the old limits are gone and
    # track_remaining is set, then read /stats with kubectl exec instead of the
    # page's port-forward.
    for attempt in $(seq 1 60); do
      cb_got=$(cb_thresholds)
      [ "$cb_got" = "1000 500 2000 10 True" ] && break
      sleep 2
    done
    if [ "$cb_got" != "1000 500 2000 10 True" ]; then
      echo "circuit-breakers: expected thresholds 1000 500 2000 10 with track_remaining true after the trackRemaining update, got '${cb_got}'"
      exit 1
    fi
    cb_stats=""
    for attempt in $(seq 1 30); do
      cb_stats=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/stats" 2>/dev/null \
        | grep "kube_httpbin_httpbin_8000.*remaining" || true)
      printf '%s\n' "$cb_stats" | grep -q '\.remaining_pending: 500$' \
        && printf '%s\n' "$cb_stats" | grep -q '\.remaining_rq: 2000$' \
        && printf '%s\n' "$cb_stats" | grep -q '\.remaining_retries: 10$' \
        && printf '%s\n' "$cb_stats" | grep -q '\.remaining_cx: [0-9]' \
        && break
      sleep 2
    done
    printf '%s\n' "$cb_stats"
    # remaining_cx is 1000 minus the open upstream connections, so only check it exists.
    for cb_metric in 'remaining_cx: [0-9]' 'remaining_pending: 500$' 'remaining_rq: 2000$' 'remaining_retries: 10$'; do
      if ! printf '%s\n' "$cb_stats" | grep -q "circuit_breakers\.default\.${cb_metric}"; then
        echo "circuit-breakers: expected a cluster.kube_httpbin_httpbin_8000.circuit_breakers.default.${cb_metric} stat"
        exit 1
      fi
    done
    {{< /doc-test >}}
