  content: |-
    {{< doc-test paths="fault-injection" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the httpbin-fault TrafficPolicy with the delay to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: httpbin-fault
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only: fi_req prints "<status code> <seconds>" for one request to the
    # httpbin route, and fi_at_least checks a time in seconds against a minimum.
    fi_req() {
      curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 30 \
        "http://${INGRESS_GW_ADDRESS}:8080${1:-/status/200}" -H "host: www.example.com:8080" || echo "000 0"
    }
    fi_at_least() { awk -v t="$1" -v m="$2" 'BEGIN { exit !(t >= m) }'; }
    # The delay applies to 50% of requests, so wait until one request is delayed
    # (the policy is in effect), then send 16 more. Every request must return 200,
    # and both delayed (at least 4.5s) and undelayed (under 2s) requests must
    # appear. The odds that 16 requests all land on the same side are about 3 in
    # 100,000.
    fi_seen=0
    for attempt in $(seq 1 60); do
      fi_out=$(fi_req)
      if [ "${fi_out%% *}" = "200" ] && fi_at_least "${fi_out#* }" 4.5; then fi_seen=1; break; fi
      sleep 1
    done
    if [ "$fi_seen" != "1" ]; then
      echo "fault-injection: no request was delayed by 5s within 60 attempts; last result '${fi_out}'"
      exit 1
    fi
    fi_slow=0; fi_fast=0
    for i in $(seq 1 16); do
      fi_out=$(fi_req)
      if [ "${fi_out%% *}" != "200" ]; then
        echo "fault-injection: expected 200 from a delayed or undelayed request, got '${fi_out}'"
        exit 1
      fi
      if fi_at_least "${fi_out#* }" 4.5; then fi_slow=$((fi_slow+1));
      elif ! fi_at_least "${fi_out#* }" 2; then fi_fast=$((fi_fast+1)); fi
    done
    echo "fault-injection: ${fi_slow} of 16 requests were delayed by at least 4.5s, ${fi_fast} answered in under 2s"
    if [ "$fi_slow" -lt 1 ] || [ "$fi_fast" -lt 1 ]; then
      echo "fault-injection: expected a 50% delay to slow some requests but not all"
      exit 1
    fi
    {{< /doc-test >}}
- after:
