  content: |-
    {{< doc-test paths="fault-injection" >}}
    YAMLTest -f - <<'EOF'
    - name: wait for the httpbin-fault TrafficPolicy with the response rate limit to be accepted
      wait:
        target:
          kind: TrafficPolicy
          metadata:
            namespace: httpbin
            name: httpbin-fault
        jsonPath: "$.status.ancestors[0].conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    # Test-only: the page times the download with `time`. Measure it with curl
    # instead and wait until the 500 KB download is throttled (at least 3s; at a
    # 64 rate limit it takes several seconds, an unthrottled download takes well
    # under one). The download must still complete with all 500000 bytes.
    fi_dl() {
      curl -s -o /dev/null -w '%{http_code} %{time_total} %{size_download}' --max-time 150 \
        "http://${INGRESS_GW_ADDRESS}:8080/bytes/500000" -H "host: www.example.com:8080" || echo "000 0 0"
    }
    fi_t64=""
    for attempt in $(seq 1 30); do
      fi_out=$(fi_dl)
      set -- $fi_out
      if [ "$1" = "200" ] && [ "$3" = "500000" ] && fi_at_least "$2" 3; then fi_t64="$2"; break; fi
      sleep 2
    done
    if [ -z "$fi_t64" ]; then
      echo "fault-injection: expected the 500 KB download to be throttled (200, 500000 bytes, at least 3s), got '${fi_out}'"
      exit 1
    fi
    echo "fault-injection: 500 KB download with kbitsPerSecond 64 took ${fi_t64}s"
    {{< /doc-test >}}
