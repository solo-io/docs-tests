  content: |-
    {{< doc-test paths="fault-injection" >}}
    # Test-only: the abort policy replaces the delay policy (same name). Wait until
    # requests are aborted with 503 and the fault filter body, then check that every
    # request is aborted and none is still delayed.
    fi_abort_ok=0
    for attempt in $(seq 1 60); do
      fi_body=$(curl -s --max-time 30 "http://${INGRESS_GW_ADDRESS}:8080/status/200" -H "host: www.example.com:8080" -w ' %{http_code}' || true)
      case "$fi_body" in *"fault filter abort"*" 503") fi_abort_ok=1; break ;; esac
      sleep 2
    done
    if [ "$fi_abort_ok" != "1" ]; then
      echo "fault-injection: expected 503 with 'fault filter abort' after the abort update, got '${fi_body}'"
      exit 1
    fi
    for i in $(seq 1 10); do
      fi_out=$(fi_req)
      if [ "${fi_out%% *}" != "503" ] || fi_at_least "${fi_out#* }" 2; then
        echo "fault-injection: expected every request to be aborted with 503 and no delay, got '${fi_out}'"
        exit 1
      fi
    done
    echo "fault-injection: 10 of 10 requests were aborted with 503 without a delay"
    {{< /doc-test >}}
