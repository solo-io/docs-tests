    - name: wait for the kgateway-helm control plane deployment that Argo CD installed to be available
      wait:
        target:
          kind: Deployment
          metadata:
            namespace: kgateway-system
            name: kgateway-helm
        jsonPath: "$.status.availableReplicas"
        jsonPathExpectation:
          comparator: greaterThan
          value: 0
        polling:
          timeoutSeconds: 600
          intervalSeconds: 5
    - name: wait for the controller to create and accept the kgateway GatewayClass
      wait:
        target:
          kind: GatewayClass
          metadata:
            name: kgateway
        jsonPath: "$.status.conditions[?(@.type=='Accepted')].status"
        jsonPathExpectation:
          comparator: equals
          value: "True"
        polling:
          timeoutSeconds: 300
          intervalSeconds: 5
    EOF
    {{< /doc-test >}}
