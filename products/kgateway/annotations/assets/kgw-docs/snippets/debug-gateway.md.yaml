  content: |-
    {{< doc-test paths="debug" >}}
    # Test-only: the CI runner cannot forward ports, so read the Envoy admin
    # interface on 127.0.0.1:19000 from inside the http gateway proxy pod (its
    # image ships busybox wget). Check the endpoints in the table.
    envoy_admin() { kubectl exec -n kgateway-system deploy/http -- wget -qO- "http://127.0.0.1:19000/$1"; }
    dump=""
    for i in $(seq 1 30); do
      dump=$(envoy_admin config_dump 2>/dev/null || true)
      grep -q 'www.example.com' <<<"$dump" && break
      echo "waiting for the http proxy config_dump to hold the www.example.com route ($i/30)"; sleep 5
    done
    for want in '"configs"' 'type.googleapis.com/envoy.admin.v3.ListenersConfigDump' 'type.googleapis.com/envoy.admin.v3.RoutesConfigDump' 'www.example.com'; do
      if ! grep -qF "$want" <<<"$dump"; then
        echo "FAIL: the Envoy admin config_dump does not contain $want"
        exit 1
      fi
    done
    listeners=$(envoy_admin listeners)
    echo "listeners: $listeners"
    if ! grep -q '8080' <<<"$listeners"; then
      echo "FAIL: the Envoy admin listeners endpoint does not list the 8080 listener of the http Gateway"
      exit 1
    fi
    logging=$(kubectl exec -n kgateway-system deploy/http -- wget -qO- --post-data "" "http://127.0.0.1:19000/logging")
    if ! grep -q 'active loggers' <<<"$logging"; then
      echo "FAIL: the Envoy admin logging endpoint does not list the active loggers and their levels"
      exit 1
    fi
    stats=$(envoy_admin stats/prometheus)
    if ! grep -q '^envoy_server_live' <<<"$stats"; then
      echo "FAIL: the Envoy admin stats/prometheus endpoint does not return Prometheus metrics"
      exit 1
    fi
    {{< /doc-test >}}
