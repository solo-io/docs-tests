  content: |2-
       {{< doc-test paths="route-delegation-prereq" >}}
       YAMLTest -f - <<'EOF'
       - name: wait for the delegation http Gateway to be programmed
         wait:
           target:
             kind: Gateway
             metadata:
               namespace: kgateway-system
               name: http
           jsonPath: "$.status.conditions[?(@.type=='Programmed')].status"
           jsonPathExpectation:
             comparator: equals
             value: "True"
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       # Programmed can be True before cloud-provider-kind gives the Service an
       # address, and the next step reads that address into INGRESS_GW_ADDRESS.
       - name: wait for the delegation http gateway service to get a load balancer address
         wait:
           target:
             kind: Service
             metadata:
               namespace: kgateway-system
               name: http
           jsonPath: "$.status.loadBalancer.ingress[0].ip"
           jsonPathExpectation:
             comparator: exists
           polling:
             timeoutSeconds: 300
             intervalSeconds: 5
       EOF
       {{< /doc-test >}}
