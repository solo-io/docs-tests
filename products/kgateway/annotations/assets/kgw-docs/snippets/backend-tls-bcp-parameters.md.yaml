  content: |-
    {{< doc-test paths="backend-tls-bcp" >}}
    # Test-only: the nginx backend has an RSA certificate for example.com and
    # supports TLS 1.2 and 1.3, so the restricted curves, ciphers, signature
    # algorithms, ALPN protocol, and SAN check in the updated policy still allow
    # the TLS connection.
    YAMLTest -f - <<'EOF'
    - name: backend-tls-bcp - with the TLS parameters set, the nginx backend still answers over TLS
      retries: 60
      http:
        url: "http://${INGRESS_GW_ADDRESS}:8080"
        path: /
        method: GET
        headers:
          host: "example.com:8080"
      source:
        type: local
      expect:
        statusCode: 200
        bodyContains:
        - Welcome to nginx!
    EOF
    {{< /doc-test >}}
