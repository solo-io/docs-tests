  content: |-
    {{< doc-test paths="buffering-filter-stage" >}}
    # bfs_large <label> <expected code>: send the 2 KiB payload with the
    # x-ext-authz: allow header to the bufferedroute.com route until the gateway
    # returns the expected status code (000 means the connection failed).
    bfs_large() {
      local label="$1" want="$2" attempt code=""
      for attempt in $(seq 1 60); do
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "http://${INGRESS_GW_ADDRESS}:8080/anything" \
          -H "host: bufferedroute.com:8080" \
          -H "x-ext-authz: allow" \
          --data-binary @/tmp/large_payload_2k.txt || true)
        [ "$code" = "$want" ] && { echo "$label: got $code"; return 0; }
        echo "$label: attempt $attempt got '${code:-no response}', want $want"
        sleep 2
      done
      echo "$label: the 2 KiB request never returned $want"
      exit 1
    }
    # Without filterStage, external auth reads the body ahead of the buffer filter,
    # so maxRequestSize 1024 is not enforced and the oversized request succeeds.
    bfs_large "buffering-filter-stage - default placement - the 2 KiB payload is not rejected" 200
    {{< /doc-test >}}
