  affinity-consistent-hashing-ringhash:
    # One scenario per algorithm. Each applies the Headers, Cookies, and Source
    # IP tabs in turn (same policy name, so each replaces the last) and checks
    # stickiness by counting which httpbin pod logged each request. A hidden
    # step scales httpbin to two replicas before the first check.
    type:
    - schema
    - functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/session-affinity/consistent-hashing.md
    path: affinity-consistent-hashing-ringhash
  affinity-loadbalancing:
    # Applies the three algorithm tabs in turn and reads the httpbin cluster's
    # load balancing policy from config_dump through kubectl exec, in place of
    # the page's port-forward.
    type:
    - schema
    - functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/session-affinity/loadbalancing.md
    path: affinity-loadbalancing
