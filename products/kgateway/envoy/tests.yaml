scenarios:
  access-logging-schema:
    type: schema
    source: kgw-docs/pages/security/access-logging2.2.md
    path: access-logging
  acl:
    # Expected outcomes are computed from the client IP that the proxy sees (read
    # from X-Forwarded-For before any policy), because cloud-provider-kind and
    # kube-proxy rewrite the runner's IP.
    type:
    - schema
    - functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/security/acl.md
    path: acl
  add-request-header:
    type:
    - schema
    - functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/header-control/request-header.md
    path: add-request-header
  add-response-header:
