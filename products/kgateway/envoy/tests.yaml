# Doc-test scenario definitions for kgateway (kgateway-dev/kgateway.dev), envoy mode.
#
# Every page in the latest and main trees is either skipped (indexes, concept
# and reference pages, stubs), checked with a `schema` scenario (the
# kgateway and Gateway API resources on the page, no cluster), or still on the
# functional backlog. Functional scenarios are added in batches by section.
#
# A `schema` scenario needs no annotation markup: doc_test_schema_check.py
# checks every visible block on the scenario's own page. Its `path` names the
# tag a later functional scenario on the same page would use.
#
# Same shape as ../../agentgateway/kubernetes/tests.yaml. What differs:
#
#   mode:    the folder name, `envoy`, because kgateway.dev lays its docs out as
#            content/docs/envoy/<version>/. The default content_root,
#            content/docs, already matches.
#   source:  kgateway.dev keeps shared page bodies in assets/kgw-docs/, so a
#            source here starts `kgw-docs/`, where agentgateway's start `agw-docs/`.
#   ports:   kgateway's sample Gateway listens on 8080, not 80, so every request
#            in the annotations goes to ${INGRESS_GW_ADDRESS}:8080.
#
# The version snippets that set the helm --version flag are keyed by release
# (2.4.x, 2.5.x). The extractor maps the latest and main trees to those through
# params.versions[].linkVersion in kgateway.dev's hugo.yaml.
version: 1
mode: envoy
prerequisites:
  # Quick start: Gateway API standard CRDs, then the kgateway CRD and control
  # plane charts. Markup is on the snippet the page reuses,
  # annotations/assets/kgw-docs/snippets/envoy/get-started.md.yaml.
  install-standard:
    page: quickstart.md
    path: standard
  install-experimental:
    page: quickstart.md
    path: experimental
  # httpbin, the `http` Gateway, the httpbin HTTPRoute, and INGRESS_GW_ADDRESS
  # from the Cloud Provider LoadBalancer tab. The page carries its own body, so
  # its markup is per version tree under annotations/content/docs/envoy/.
  httpbin:
    page: install/sample-app.md
    path: install-httpbin
  # Test-only stand-in for the public httpbin.org service: a Service in front
  # of the httpbin sample app plus a CoreDNS rewrite, so guides that route to
  # httpbin.org over plain HTTP run without internet access. Hidden block on
  # the sample-app page, after the httpbin markup. Needs `httpbin` first.
  httpbin-org-standin:
    page: install/sample-app.md
    path: httpbin-org-standin
  # The grpc Gateway, the yages.Echo sample gRPC service, the GRPCRoute, and the
  # grpcurl client pod from the gRPC routing guide, for pages that build on it.
  grpc-routing:
    page: traffic-management/grpc.md
    path: grpc
# Pages with deliberately no test: section indexes, concept and reference
# pages, and stubs that point to a guide elsewhere. They count as covered.
