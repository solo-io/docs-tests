    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/session-affinity/consistent-hashing.md
    path: affinity-consistent-hashing-maglev
  affinity-consistent-hashing-ringhash:
    # One scenario per algorithm. Each applies the Headers, Cookies, and Source
    # IP tabs in turn (same policy name, so each replaces the last) and checks
    # stickiness by counting which httpbin pod logged each request. A hidden
    # step scales httpbin to two replicas before the first check.
    type:
    - schema
    - functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/session-affinity/consistent-hashing.md
    path: affinity-consistent-hashing-ringhash
  affinity-loadbalancing:
    # Applies the three algorithm tabs in turn and reads the httpbin cluster's
    # load balancing policy from config_dump through kubectl exec, in place of
    # the page's port-forward.
    type:
    - schema
    - functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/session-affinity/loadbalancing.md
    path: affinity-loadbalancing
  affinity-session-persistence-policy:
    # BackendConfigPolicy tab, main only until the backend page reaches latest.
    # Standard channel on purpose: the page says this option does not need the
    # experimental channel.
    type: functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/traffic-management/session-affinity/session-persistence-backend.md
    path: affinity-session-persistence-policy
  affinity-session-persistence:
    # The page reuses session-persistence.md in latest and
    # session-persistence-backend.md in main, so this entry uses page: to cover
    # both trees. HTTPRoute sessionPersistence needs the experimental channel.
    type:
    - schema
    - functional
    needs:
    - install-experimental
    - httpbin
    page: traffic-management/session-affinity/session-persistence.md
    path: affinity-session-persistence
  alb-schema:
    type: schema
    source: kgw-docs/pages/integrations/aws-elb/alb.md
    path: alb
  apikey-client-id:
    # Other configuration examples: clientIdHeader. The client id is the entry
    # name in the apikey secret (api-key), checked in httpbin's /headers echo.
    type: functional
    needs:
    - install-standard
    - httpbin
    source: kgw-docs/pages/security/apikey-auth.md
    path: apikey-client-id
  apikey-custom-header:
