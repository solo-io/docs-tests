name: Refresh test annotations

# Test markup for each consuming site lives here, in
# products/<product>/annotations/, and is attached to the pages at test time
# by fingerprint. Content changes every day, so once a day this re-attaches each
# product's annotations to its site's main branch, records the new fingerprints,
# follows pages that moved, and marks what changed too much as needs update.
# One matrix job per product: agentgateway/website and kgateway-dev/kgateway.dev.
#
# It commits straight to main: changes are expected too often to review daily.
# The safety net is in scripts/annotations.py: a refresh never drops markup,
# and refuses to write if any would disappear. Every close match is listed in
# the commit message, and git history allows a one-step revert.
#
# It also adds a schema test for each new page that has none and shows a
# Kubernetes object or a standalone config file (scripts/scaffold_schema_tests.py).
# Those go out as a pull request, not to main: a new test that fails on its
# first run usually means the page shows placeholder YAML, and a person decides
# whether the page needs a fix or a `skip:` entry.
#
# Runs at 05:00 UTC, before the website's doc tests at 06:00.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-annotations
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # The daily post goes where the doc test results go, in the same layout; a
  # failed refresh also goes to the builds channel.
  SLACK_CHANNEL: doctopus-tests
  SLACK_FAILURE_CHANNEL: doctopus-builds

jobs:
  refresh:
    name: Refresh ${{ matrix.product }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time, so the two commits to main never race each other's push.
      max-parallel: 1
      matrix:
        include:
          - product: agentgateway
            repository: agentgateway/website
            # Lets the scaffold step recognize a whole standalone config file.
            config_schema: https://raw.githubusercontent.com/agentgateway/agentgateway/main/schema/config.json
          - product: kgateway
            repository: kgateway-dev/kgateway.dev
    env:
      ANNOTATIONS: products/${{ matrix.product }}/annotations
    steps:
      - name: Checkout docs-tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Full history: refresh diffs the site from the last refreshed commit
      # (recorded in each product's refresh-state.yaml) to follow renamed pages.
      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          path: consumer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        # jsonschema: the scaffold step loads the standalone config schema.
        run: pip install pyyaml jsonschema

      - name: Refresh annotations
        run: |
          set -o pipefail
          mkdir -p out
          python3 scripts/annotations.py refresh --repo consumer --annotations "$ANNOTATIONS" \
            --report out/refresh-report.json | tee out/refresh.log
          {
            echo "## Annotation refresh"
            echo
            echo '```'
            cat out/refresh.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- "$ANNOTATIONS")" ]; then
            echo "No annotation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$ANNOTATIONS"
          git commit -q -F - <<EOF
          Refresh ${{ matrix.product }} annotations

          $(cat out/refresh.log)
          EOF
          # Another refresh may have pushed since checkout; each writes only its
          # own product directory, so a rebase cannot conflict.
          git pull -q --rebase origin main
          git push origin HEAD:main

      # Runs after the refresh commit, so the pull request starts from today's
      # main. The branch is rebuilt from scratch each day: it holds every page
      # that still has no test, so an open pull request stays current, and one
      # that was merged leaves nothing to add.
      - name: Scaffold schema tests for new pages
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_SCHEMA_URL: ${{ matrix.config_schema }}
          PRODUCT: ${{ matrix.product }}
          BRANCH: scaffold-schema-tests/${{ matrix.product }}
        run: |
          set -euo pipefail
          ARGS=(--repo consumer --product "$PRODUCT" --report out/scaffold-report.json)
          if [ -n "$CONFIG_SCHEMA_URL" ]; then
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/config.json" "$CONFIG_SCHEMA_URL"
            ARGS+=(--config-schema "$RUNNER_TEMP/config.json")
          fi
          python3 scripts/scaffold_schema_tests.py "${ARGS[@]}" | tee out/scaffold.log
          if [ -z "$(git status --porcelain -- "products/$PRODUCT")" ]; then
            echo "No new pages to add schema tests for."
            exit 0
          fi
          {
            echo "## New schema tests"
            echo
            echo '```'
            cat out/scaffold.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -C "$BRANCH"
          git add -A -- "products/$PRODUCT"
          git commit -q -F - <<EOF
          Add schema tests for new $PRODUCT pages

          $(cat out/scaffold.log)
          EOF
          git push -q -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main --title "Add schema tests for new $PRODUCT pages" --body-file - <<EOF
          These pages have no doc test yet. Each shows a Kubernetes object or a standalone
          config file, so each gets a \`schema\` scenario with \`path: all\`, which needs no
          markup on the page. This pull request is rebuilt every day from main.

          Before you merge, check the site's next schema run, or run the schema check locally.
          A scenario that fails usually means placeholder YAML on the page: fix the page, or
          move it under \`skip:\` in the manifest.

          \`\`\`
          $(cat out/scaffold.log)
          \`\`\`
          EOF
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refresh-report-${{ matrix.product }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      # Posted every scheduled day, like the doc test results: a header with the
      # counts, every piece of markup that needs update, and a thread listing
      # the close matches and moved pages that were committed without review.
      # A failed refresh leaves tests running on yesterday's annotations, which
      # is safe but goes stale, so it is reported the same day.
      - name: Post to Slack
        if: always() && github.event_name == 'schedule'
        env:
          # Its own secret, not the org-wide SLACK_BOT_TOKEN: that may be a
          # different bot from the one that posts doc test results. Unset, the
          # step skips posting with a warning.
          SLACK_BOT_TOKEN: ${{ secrets.DOCS_TESTS_SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::warning::DOCS_TESTS_SLACK_BOT_TOKEN is not set; not posting."
            exit 0
          fi
          FAILED=""
          CHANNELS="$SLACK_CHANNEL"
          if [ "$STATUS" != "success" ]; then
            FAILED="--failed"
            CHANNELS="$SLACK_CHANNEL $SLACK_FAILURE_CHANNEL"
          fi
          PAYLOADS=$(python3 scripts/annotations.py slack --report out/refresh-report.json --run-url "$RUN_URL" \
            --product "${{ matrix.product }}" $FAILED)
          post() {
            curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data "$1"
          }
          for CHANNEL in $CHANNELS; do
            TS=$(post "$(echo "$PAYLOADS" | jq -c --arg c "$CHANNEL" '.main + {channel: $c}')" | jq -er '.ts')
            if [ "$(echo "$PAYLOADS" | jq '.thread != null')" = "true" ]; then
              post "$(echo "$PAYLOADS" | jq -c --arg c "$CHANNEL" --arg ts "$TS" '.thread + {channel: $c, thread_ts: $ts}')" \
                | jq -e '.ok' > /dev/null
            fi
          done
